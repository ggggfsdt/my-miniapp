/* TERRIFYING TITAN */
function drawBossBody(u, x, y, r, t){
  const wp = u.moving ? Math.sin(t*4 + u.bob) : Math.sin(t*1.5 + u.bob)*0.3;
  const lo = wp * 5;
  const br = Math.sin(t*1.2 + u.bob)*1.6;
  const gr = !!u.grabbedTarget;
  const jumped = u.titanJumpZ || 0;
  // Terrifying shadow (bigger)
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath();
  ctx.ellipse(x, y + r*0.9 + jumped*0.3, r*1.4, r*0.55, 0, 0, Math.PI*2);
  ctx.fill();

  const yOff = -jumped;
  const y2 = y + yOff;

  // Dark aura ring
  ctx.save();
  ctx.globalAlpha = 0.35 + Math.sin(t*2)*0.15;
  ctx.strokeStyle = '#a020f0';
  ctx.shadowColor = '#a020f0'; ctx.shadowBlur = 18;
  ctx.lineWidth = 2.5;
  ctx.setLineDash([10, 8]);
  ctx.lineDashOffset = -t * 30;
  ctx.beginPath(); ctx.arc(x, y2 - r*0.3, r*1.7, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Legs (thick, huge)
  ctx.strokeStyle = darken(u.color, .6);
  ctx.lineWidth = r*0.62;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r*0.65, y2 + r*0.55);
  ctx.lineTo(x - r*0.65 + lo, y2 + r*1.55);
  ctx.moveTo(x + r*0.65, y2 + r*0.55);
  ctx.lineTo(x + r*0.65 - lo, y2 + r*1.55);
  ctx.stroke();
  // Ankle spikes
  ctx.fillStyle = darken(u.color, .5);
  ctx.beginPath();
  ctx.moveTo(x - r*0.9 + lo, y2 + r*1.55);
  ctx.lineTo(x - r*0.4 + lo, y2 + r*1.55);
  ctx.lineTo(x - r*0.65 + lo, y2 + r*1.75);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + r*0.4 - lo, y2 + r*1.55);
  ctx.lineTo(x + r*0.9 - lo, y2 + r*1.55);
  ctx.lineTo(x + r*0.65 - lo, y2 + r*1.75);
  ctx.closePath(); ctx.fill();

  // Torso (massive)
  const bg = ctx.createRadialGradient(x - r*0.3, y2 - r*0.4, r*0.3, x, y2 + r*0.1, r*1.6);
  bg.addColorStop(0, lighten(u.color, .35));
  bg.addColorStop(.6, u.color);
  bg.addColorStop(1, darken(u.color, .4));
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(x - r*1.35, y2 - r*0.75 + br);
  ctx.quadraticCurveTo(x - r*1.55, y2 + r*0.3, x - r*1.1, y2 + r*0.85);
  ctx.lineTo(x + r*1.1, y2 + r*0.85);
  ctx.quadraticCurveTo(x + r*1.55, y2 + r*0.3, x + r*1.35, y2 - r*0.75 + br);
  ctx.quadraticCurveTo(x, y2 - r*1.45 + br, x - r*1.35, y2 - r*0.75 + br);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = darken(u.color, .6); ctx.lineWidth = 2; ctx.stroke();

  // Ribs / scars
  ctx.strokeStyle = darken(u.color, .55); ctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++){
    ctx.beginPath();
    ctx.moveTo(x - r*0.8, y2 - r*0.3 + i*r*0.35 + br);
    ctx.quadraticCurveTo(x, y2 - r*0.4 + i*r*0.35 + br, x + r*0.8, y2 - r*0.3 + i*r*0.35 + br);
    ctx.stroke();
  }

  // Chest sigil (pulsing red)
  const sigG = ctx.createRadialGradient(x, y2 + r*0.05 + br, r*0.05, x, y2 + r*0.05 + br, r*0.5);
  sigG.addColorStop(0, '#fff');
  sigG.addColorStop(.3, '#ff4080');
  sigG.addColorStop(1, 'rgba(255,64,128,0)');
  ctx.fillStyle = sigG;
  ctx.beginPath();
  ctx.arc(x, y2 + r*0.05 + br, r*0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = `rgba(255,60,120,${0.6 + Math.sin(t*4)*0.3})`;
  ctx.beginPath();
  ctx.arc(x, y2 + r*0.05 + br, r*0.22, 0, Math.PI*2);
  ctx.fill();

  // Arms with TERRIFYING claws
  const grabbing = !!u.grabbedTarget;
  const ar = grabbing ? -Math.PI*0.65 : -Math.PI*0.3 + Math.sin(t*2 + u.bob)*0.2;
  const al = -Math.PI*0.7 + Math.sin(t*2 + u.bob + 1)*0.2;
  const armLen = r*1.7;

  // Right arm
  ctx.strokeStyle = darken(u.color, .35);
  ctx.lineWidth = r*0.7;
  ctx.lineCap = 'round';
  const axR = x + r*1.15, ayR = y2 - r*0.4 + br;
  const fxR = axR + Math.cos(ar) * armLen;
  const fyR = ayR + Math.sin(ar) * armLen;
  ctx.beginPath();
  ctx.moveTo(axR, ayR);
  ctx.lineTo(fxR, fyR);
  ctx.stroke();

  // Left arm
  const axL = x - r*1.15, ayL = y2 - r*0.4 + br;
  const fxL = axL + Math.cos(al) * armLen;
  const fyL = ayL + Math.sin(al) * armLen;
  ctx.beginPath();
  ctx.moveTo(axL, ayL);
  ctx.lineTo(fxL, fyL);
  ctx.stroke();

  // Clawed fists
  function drawClaw(cx, cy, ang, sz){
    ctx.fillStyle = lighten(u.color, .2);
    ctx.beginPath();
    ctx.arc(cx, cy, sz, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = darken(u.color, .5); ctx.lineWidth = 1.5; ctx.stroke();
    // Claws
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 6;
    for (let i = -1; i <= 1; i++){
      const ca = ang + i * 0.35;
      const cxx = cx + Math.cos(ca) * sz * 1.1;
      const cyy = cy + Math.sin(ca) * sz * 1.1;
      const tx = cx + Math.cos(ca) * sz * 1.9;
      const ty = cy + Math.sin(ca) * sz * 1.9;
      ctx.beginPath();
      ctx.moveTo(cxx, cyy);
      ctx.lineTo(tx, ty);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  drawClaw(fxR, fyR, ar, r*0.42);
  drawClaw(fxL, fyL, al, r*0.42);

  // Head (with more detail)
  const hy = y2 - r*1.55 + br;
  ctx.beginPath();
  ctx.arc(x, hy, r*0.85, 0, Math.PI*2);
  const hg = ctx.createRadialGradient(x - r*0.25, hy - r*0.25, r*0.1, x, hy, r*0.9);
  hg.addColorStop(0, lighten(u.color, .5));
  hg.addColorStop(1, darken(u.color, .2));
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = darken(u.color, .6); ctx.lineWidth = 2; ctx.stroke();

  // MANY horns - terrifying crown
  ctx.fillStyle = darken(u.color, .7);
  for (let i = -3; i <= 3; i++){
    const hx = x + i*r*0.28;
    const tall = (3 - Math.abs(i)) * r*0.28 + r*0.6;
    ctx.beginPath();
    ctx.moveTo(hx - r*0.12, hy - r*0.6);
    ctx.lineTo(hx, hy - tall - r*0.7);
    ctx.lineTo(hx + r*0.12, hy - r*0.6);
    ctx.closePath(); ctx.fill();
  }
  // Side horns
  ctx.beginPath();
  ctx.moveTo(x - r*0.7, hy - r*0.35);
  ctx.lineTo(x - r*1.3, hy - r*1.1);
  ctx.lineTo(x - r*0.85, hy - r*0.1);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + r*0.7, hy - r*0.35);
  ctx.lineTo(x + r*1.3, hy - r*1.1);
  ctx.lineTo(x + r*0.85, hy - r*0.1);
  ctx.closePath(); ctx.fill();

  // GLOWING EYES (bigger, scarier)
  ctx.fillStyle = '#ff2060';
  ctx.shadowColor = '#ff2060'; ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(x - r*0.32, hy - r*0.05, r*0.2, 0, Math.PI*2);
  ctx.arc(x + r*0.32, hy - r*0.05, r*0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Pupils (dark slits)
  ctx.fillStyle = '#3a0018';
  ctx.beginPath();
  ctx.ellipse(x - r*0.32, hy - r*0.05, r*0.05, r*0.14, 0, 0, Math.PI*2);
  ctx.ellipse(x + r*0.32, hy - r*0.05, r*0.05, r*0.14, 0, 0, Math.PI*2);
  ctx.fill();

  // Teeth (jagged mouth)
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(x - r*0.5, hy + r*0.35);
  ctx.quadraticCurveTo(x, hy + r*0.7, x + r*0.5, hy + r*0.35);
  ctx.lineTo(x + r*0.35, hy + r*0.4);
  ctx.lineTo(x - r*0.35, hy + r*0.4);
  ctx.closePath(); ctx.fill();
  // Teeth points
  ctx.fillStyle = '#f0f0f0';
  for (let i = -2; i <= 2; i++){
    const tx = x + i*r*0.18;
    ctx.beginPath();
    ctx.moveTo(tx - r*0.05, hy + r*0.42);
    ctx.lineTo(tx, hy + r*0.6);
    ctx.lineTo(tx + r*0.05, hy + r*0.42);
    ctx.closePath(); ctx.fill();
  }

  // Steam particles from mouth periodically
  if (Math.random() < 0.1){
    addParticles(x + (Math.random()-0.5)*r*0.3, hy + r*0.5, 1, '#ff4060', 30, .8, 3);
  }

  // Held tower
  if (u.carriedTower){
    const tx = x, ty = y2 - r*2.3;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.fillStyle = '#a0a0a8';
    roundRect(ctx, -r*0.9, -r*0.5, r*1.8, r*1.0, 4); ctx.fill();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.stroke();
    // Crenellations
    ctx.fillStyle = '#7a7a82';
    for (let i = -2; i <= 2; i++){
      ctx.fillRect(i*r*0.35 - r*0.12, -r*0.7, r*0.24, r*0.24);
    }
    ctx.restore();
  }
}
function drawSeraphBody(u, x, y, r, t){
  const fb = Math.sin(t*2.5 + u.bob)*2.5;
  const yy = y + fb;
  ctx.strokeStyle = `rgba(255,230,120,${0.7 + Math.sin(t*3)*0.2})`;
  ctx.lineWidth = 3; ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.ellipse(x, yy - r*1.9, r*0.7, r*0.22, 0, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;
  const fl = Math.sin(t*4 + u.bob)*0.4;
  for (let i=0;i<3;i++){
    const wl = r*(1.6 + i*0.5), yo = -r*0.3 + i*r*0.4;
    ctx.fillStyle = `rgba(255,246,194,${0.5 - i*0.1})`;
    ctx.beginPath();
    ctx.moveTo(x - r*0.5, yy + yo);
    ctx.quadraticCurveTo(x - wl, yy + yo - r*1.2 + fl*r, x - wl*1.15, yy + yo + r*0.2);
    ctx.quadraticCurveTo(x - wl*0.7, yy + yo - r*0.1, x - r*0.5, yy + yo + r*0.3); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + r*0.5, yy + yo);
    ctx.quadraticCurveTo(x + wl, yy + yo - r*1.2 - fl*r, x + wl*1.15, yy + yo + r*0.2);
    ctx.quadraticCurveTo(x + wl*0.7, yy + yo - r*0.1, x + r*0.5, yy + yo + r*0.3); ctx.closePath(); ctx.fill();
  }
  const bg = ctx.createRadialGradient(x, yy, r*0.2, x, yy, r*1.2);
  bg.addColorStop(0, '#fff6c2'); bg.addColorStop(.6, '#ffe066'); bg.addColorStop(1, '#d4a800');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(x - r*0.75, yy + r*0.9); ctx.lineTo(x - r*0.5, yy - r*0.5);
  ctx.quadraticCurveTo(x, yy - r*0.9, x + r*0.5, yy - r*0.5);
  ctx.lineTo(x + r*0.75, yy + r*0.9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x, yy - r*1.05, r*0.5, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(x - r*0.15, yy - r*1.08, r*0.07, 0, Math.PI*2);
  ctx.arc(x + r*0.15, yy - r*1.08, r*0.07, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}
function drawDragonBody(u, x, y, r, t){
  const fb = Math.sin(t*3 + u.bob)*2.8;
  const yy = y + fb;
  const fl = Math.sin(t*5 + u.bob)*0.6;
  ctx.fillStyle = 'rgba(180,40,20,0.75)';

  ctx.moveTo(x - r*0.3, yy - r*0.2);
  ctx.quadraticCurveTo(x - r*2.4, yy - r*1.6 + fl*r, x - r*3.0, yy + r*0.1);
  ctx.quadraticCurveTo(x - r*1.8, yy - r*0.4, x - r*0.3, yy + r*0.4); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + r*0.3, yy - r*0.2);
  ctx.quadraticCurveTo(x + r*2.4, yy - r*1.6 - fl*r, x + r*3.0, yy + r*0.1);

  bg.addColorStop(0, '#ff7a4d'); bg.addColorStop(.5, '#d94a2a'); bg.addColorStop(1, '#7a1a08');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(x, yy + r*0.15, r*0.85, r*1.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,140,0.7)';
  ctx.beginPath(); ctx.ellipse(x, yy + r*0.4, r*0.5, r*0.75, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x, yy - r*1.1);
  ctx.quadraticCurveTo(x - r*0.7, yy - r*1.4, x - r*0.55, yy - r*0.9);
  ctx.lineTo(x + r*0.55, yy - r*0.9);
  ctx.quadraticCurveTo(x + r*0.7, yy - r*1.4, x, yy - r*1.1); ctx.closePath();
  ctx.fillStyle = '#d94a2a'; ctx.fill();
  ctx.fillStyle = '#ffe066';
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;

  ctx.arc(x + r*0.22, yy - r*1.08, r*0.12, 0, Math.PI*2); ctx.fill();

}
function drawNecromancerBody(u, x, y, r, t){

function drawHogBody(u, x, y, r, t){

/* NEW: Golem */
function drawGolemBody(u, x, y, r, t){
  const wp = u.moving ? Math.sin(t*6 + u.bob) : Math.sin(t*1.5 + u.bob)*0.25;

  ctx.quadraticCurveTo(x + r*1.4, y + r*0.3, x + r*1.2, y - r*0.8);

    ctx.lineTo(cx + (Math.random()*2-1)*r*0.4, cy + r*0.3);

  }
  // Glowing core
  ctx.fillStyle = `rgba(255,140,60,${0.7 + Math.sin(t*2)*0.3})`;

  ctx.beginPath();
  ctx.arc(x, y - r*0.1, r*0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Head (rock block)
  ctx.fillStyle = '#8a7a6a';
  roundRect(ctx, x - r*0.7, y - r*1.9, r*1.4, r*1.0, r*0.2);
  ctx.fill();
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2; ctx.stroke();
  // Glowing eyes
  ctx.fillStyle = '#ff8a3d';
  ctx.shadowColor = '#ff8a3d'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(x - r*0.3, y - r*1.5, r*0.14, 0, Math.PI*2);
  ctx.arc(x + r*0.3, y - r*1.5, r*0.14, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Arms
  const ap = u.attackAnim > 0 ? Math.sin((1 - u.attackAnim/0.22)*Math.PI) : 0;
  ctx.fillStyle = '#8a7a6a';
  roundRect(ctx, x + r*1.1, y - r*0.5, r*0.8, r*1.0, r*0.15);
  ctx.fill();
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  roundRect(ctx, x - r*1.9, y - r*0.5, r*0.8, r*1.0, r*0.15);
  ctx.fill();
  ctx.stroke();
}

function drawCharacterBody(u, x, y, r, t){
  const alpha = u.stealthTimer > 0 ? (0.35 + Math.sin(t*22)*0.1) : (u.phasing ? 0.9 : 1);
  ctx.globalAlpha = alpha;
  switch(u.body){
    case 'skeleton': drawSkeletonBody(u, x, y, r, t); break;
    case 'spirit': drawSpiritBody(u, x, y, r, t); break;
    case 'bat': drawBatBody(u, x, y, r, t); break;
    case 'ghost': drawGhostBody(u, x, y, r, t); break;
    case 'robed': drawRobed(u, x, y, r, t); break;
    case 'brute': drawBrute(u, x, y, r, t); break;
    case 'mech': drawMechBody(u, x, y, r, t); break;
    case 'bird': drawBirdBody(u, x, y, r, t); break;
    case 'grappler': drawGrapplerBody(u, x, y, r, t); break;
    case 'stretcher': drawStretcherBody(u, x, y, r, t); break;
    case 'illusioner': drawIllusionerBody(u, x, y, r, t); break;
    case 'boss': drawBossBody(u, x, y, r, t); break;
    case 'seraph': drawSeraphBody(u, x, y, r, t); break;
    case 'dragon': drawDragonBody(u, x, y, r, t); break;
    case 'necromancer': drawNecromancerBody(u, x, y, r, t); break;
    case 'hog': drawHogBody(u, x, y, r, t); break;
    case 'balloon': drawBalloonBody(u, x, y, r, t); break;
    case 'golem': drawGolemBody(u, x, y, r, t); break;
    default: drawHumanoid(u, x, y, r, t); break;
  }
  ctx.globalAlpha = 1;
}
function drawUnit(u){
  const sp = Math.max(0, u.spawnAnim);
  const k = clamp(1 - sp, 0, 1);
  const pop = 0.4 + 0.6 * easeOutBack(k);
  let ox = 0, oy = 0;
  if (u.attackAnim > 0){
    const p = clamp(1 - u.attackAnim/0.22, 0, 1);
    const lu = Math.sin(p*Math.PI)*6;
    ox = Math.cos(u.attackAngle)*lu; oy = Math.sin(u.attackAngle)*lu;
  }
  const x = u.x + ox, y = u.y + oy;
  const r = u.r * pop;
  // Jump height offset
  const jumpY = (u.titanJumpZ || 0);

  drawShadow(u, x, y, r);

  if(u.isClone){
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 9, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(200,168,255,${0.3 + Math.sin(G.t*5 + u.id)*0.15})`;
    ctx.lineWidth = 1.5; ctx.setLineDash([3,5]); ctx.lineDashOffset = G.t*15; ctx.stroke(); ctx.setLineDash([]);
  }
  if(u.stunTimer > 0){
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 8, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(168,240,255,.85)'; ctx.lineWidth = 2.5;
    ctx.setLineDash([4,4]); ctx.lineDashOffset = -G.t*40; ctx.stroke(); ctx.setLineDash([]);
  }
  if(u.slowTimer > 0){
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 6, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(110,215,255,${0.5 + Math.sin(G.t*8)*0.2})`; ctx.lineWidth = 2; ctx.stroke();
  }
  if(u.poisonTimer > 0){
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 7.5, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(130,230,110,.55)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  }
  if(u.shield > 0){
    const a2 = .3 + (u.shield/u.maxShield)*.5;
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 4, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(160,220,255,${a2})`; ctx.lineWidth = 2.5; ctx.stroke();
  }
  if(u.rarity === 'holy' || u.key === 'titan'){
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 14, 0, Math.PI*2);
    ctx.strokeStyle = u.rarity === 'holy'
      ? `rgba(255,224,102,${0.5 + Math.sin(G.t*3)*0.2})`
      : `rgba(200,120,255,${0.4 + Math.sin(G.t*3)*0.2})`;
    ctx.lineWidth = 2.5; ctx.setLineDash([8,10]); ctx.lineDashOffset = G.t*20; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.beginPath(); ctx.arc(x, y + r*0.9 + jumpY*0.05, r*0.5, 0, Math.PI*2);
  ctx.fillStyle = u.side === 'player' ? 'rgba(47,125,255,.7)' : 'rgba(255,59,59,.7)';
  ctx.fill();
  // Draw character (with jump offset)
  ctx.save();
  ctx.translate(0, -jumpY);
  drawCharacterBody(u, x, y, r, G.t);
  ctx.restore();
  if (u.hitFlash > 0){
    ctx.globalAlpha = clamp(u.hitFlash/0.12, 0, 1) * 0.6;
    ctx.beginPath(); ctx.arc(x, y - r*0.3 - jumpY, r + 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = 1;
  }
  if(u.key !== 'illusioner' && (u.hp < u.maxHp || u.shield < u.maxShield)){
    const bw = Math.max(r*2.2, u.body === 'boss' ? 48 : r*2.5);
    drawHpBar(x, y - r - 22 - jumpY, bw, u.hp/u.maxHp, u.side);
  }
}
function drawUnits(){
  const arr = G.units;
  if (arr.length > 1) arr.sort((a,b) => a.y - b.y);
  for (const u of arr) if (u.alive) drawUnit(u);
}
/* Projectiles */
function drawProjectiles(){
  for(const p of G.projectiles){
    const ang=Math.atan2(p.ly-p.y,p.lx-p.x);
    ctx.save();ctx.translate(p.x,p.y);
    switch(p.attackType){
      case 'sword':{
        ctx.save();ctx.rotate(p.spinAngle);
        ctx.shadowColor='#c9a5ff';ctx.shadowBlur=12;
        ctx.strokeStyle='#e0d0ff';ctx.lineWidth=3.5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,6);ctx.stroke();
        ctx.restore();break;
      }
      case 'fireball':{
        ctx.save();ctx.rotate(ang);
        for(let i=1;i<=3;i++){
          ctx.globalAlpha=.5/i;
          ctx.beginPath();ctx.arc(-i*7,0,5-i*.8,0,Math.PI*2);
          ctx.fillStyle=i===1?'#ffcc44':'#ff6622';ctx.fill();
        }
        ctx.restore();
        const gg=ctx.createRadialGradient(-1,-1,.5,0,0,6);
        gg.addColorStop(0,'#fff7c2');gg.addColorStop(.4,'#ffbb44');gg.addColorStop(1,'#ff4400');
        ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fillStyle=gg;ctx.fill();break;
      }
      case 'ice':{
        ctx.save();ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(9,0);ctx.lineTo(-2,-4);ctx.lineTo(-6,0);ctx.lineTo(-2,4);ctx.closePath();
        const ig=ctx.createLinearGradient(-6,0,9,0);
        ig.addColorStop(0,'#e0f4ff');ig.addColorStop(.5,'#a8e8ff');ig.addColorStop(1,'#fff');
        ctx.fillStyle=ig;ctx.fill();
        ctx.restore();break;
      }
      case 'poison':{
        const pg=ctx.createRadialGradient(-1,-1,.5,0,0,6);
        pg.addColorStop(0,'#d8ffb0');pg.addColorStop(.5,'#7fd96f');pg.addColorStop(1,'#2d8a1f');
        ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();break;
      }
      case 'mortar':{
        ctx.beginPath();ctx.ellipse(0,0,6,5,0,0,Math.PI*2);
        const mg=ctx.createRadialGradient(-1.5,-1.5,.5,0,0,6);
        mg.addColorStop(0,'#5a5a5a');mg.addColorStop(.6,'#2a2a2a');mg.addColorStop(1,'#0a0a0a');
        ctx.fillStyle=mg;ctx.fill();
        ctx.beginPath();ctx.arc(-6,-2,2.2,0,Math.PI*2);ctx.fillStyle='#ffcc44';ctx.fill();break;
      }
      case 'bomb':{
        ctx.save();ctx.rotate(p.spinAngle*.6);
        const bg=ctx.createRadialGradient(-2,-2,.5,0,0,7);
        bg.addColorStop(0,'#4a4a4a');bg.addColorStop(.6,'#1a1a1a');bg.addColorStop(1,'#000');
        ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
        ctx.restore();break;
      }
      case 'icespirit':{
        const sg=ctx.createRadialGradient(0,0,.5,0,0,6);
        sg.addColorStop(0,'#fff');sg.addColorStop(.5,'#c8f0ff');sg.addColorStop(1,'#6fd9ff');
        ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();break;
      }
      case 'chainTrap':{
        ctx.save();ctx.rotate(p.spinAngle*.4);
        for(let i=-2;i<=2;i++){
          ctx.beginPath();ctx.ellipse(i*5,Math.sin(p.spinAngle+i)*1.5,3.5,2.2,0,0,Math.PI*2);
          ctx.strokeStyle=i%2===0?'#c9a5ff':'#8a6ae0';ctx.lineWidth=1.8;ctx.stroke();
        }
        ctx.restore();break;
      }
      case 'hook':{
        ctx.save();ctx.rotate(ang);
        ctx.strokeStyle='#8a8a94';ctx.lineWidth=2;
        for(let i=1;i<=4;i++){
          ctx.beginPath();ctx.ellipse(-i*6,0,2,1.5,0,0,Math.PI*2);ctx.stroke();
        }
        ctx.strokeStyle='#d0d0d8';ctx.lineWidth=2.8;ctx.lineCap='round';
        ctx.beginPath();ctx.arc(2,0,5,-Math.PI*0.7,Math.PI*0.7);ctx.stroke();
        ctx.restore();break;
      }
      case 'stretch':{
        ctx.save();ctx.rotate(ang);
        ctx.strokeStyle='#f0a8c8';ctx.lineWidth=5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(0,0);ctx.stroke();
        ctx.beginPath();ctx.arc(2,0,5,0,Math.PI*2);
        ctx.fillStyle='#ffd0e8';ctx.fill();
        ctx.restore();break;
      }
      case 'electro':{
        ctx.save();ctx.rotate(ang);
        ctx.strokeStyle='#7dd8ff';ctx.lineWidth=2.5;ctx.lineCap='round';
        ctx.shadowColor='#7dd8ff';ctx.shadowBlur=14;
        ctx.beginPath();ctx.moveTo(-10,0);
        for(let i=0;i<5;i++)ctx.lineTo(-10+i*5+2.5,(Math.random()-.5)*6);
        ctx.lineTo(10,0);ctx.stroke();
        ctx.restore();break;
      }
      case 'boomerang':{
        ctx.save();ctx.rotate(p.spinAngle);
        ctx.strokeStyle='#d06060';ctx.lineWidth=4;ctx.lineCap='round';
        ctx.shadowColor='#d06060';ctx.shadowBlur=10;
        ctx.beginPath();ctx.moveTo(-10,0);ctx.quadraticCurveTo(0,-10,10,0);ctx.stroke();
        ctx.restore();break;
      }
      case 'holy':{
        ctx.save();ctx.rotate(ang);
        ctx.shadowColor='#ffe066';ctx.shadowBlur=16;
        const gg=ctx.createRadialGradient(0,0,.5,0,0,7);
        gg.addColorStop(0,'#fff');gg.addColorStop(.5,'#ffe066');gg.addColorStop(1,'#d4a800');
        ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fillStyle=gg;ctx.fill();
        ctx.restore();break;
      }
      case 'dragonbreath':{
        ctx.save();ctx.rotate(ang);
        const fg=ctx.createRadialGradient(0,0,1,0,0,12);
        fg.addColorStop(0,'#fff6c2');fg.addColorStop(.3,'#ffcc44');fg.addColorStop(.7,'#ff6b2b');fg.addColorStop(1,'#7a1a08');
        ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();
        ctx.restore();break;
      }
      case 'necrobolt':{
        ctx.save();ctx.rotate(ang);
        const ng=ctx.createRadialGradient(0,0,1,0,0,7);
        ng.addColorStop(0,'#e0d0ff');ng.addColorStop(.5,'#9a6ae0');ng.addColorStop(1,'#3a1a6a');
        ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fillStyle=ng;ctx.fill();
        ctx.restore();break;
      }
      default:{
        ctx.save();ctx.rotate(ang);
        ctx.globalAlpha=.4;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.ellipse(-6,0,8,3,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        ctx.beginPath();ctx.arc(0,0,3.4,0,Math.PI*2);
        ctx.fillStyle=p.color;ctx.fill();
        ctx.beginPath();ctx.arc(0,0,1.6,0,Math.PI*2);
        ctx.fillStyle='#fff';ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }
}
function drawZones(){
  for(const z of G.zones){
    const a=clamp(z.timer/z.maxTimer,0,1);
    ctx.save();
    ctx.globalAlpha=.18*a;ctx.fillStyle=z.color;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.65*a;ctx.strokeStyle=z.color;ctx.lineWidth=2;
    ctx.setLineDash([6,6]);ctx.lineDashOffset=-G.t*30;
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();
  }
}
function drawChains(){
  for(const c of G.chains){
    const a=c.life/c.maxLife;const pts=c.points;
    if(pts.length<2)continue;
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle='#e0d8ff';ctx.lineWidth=3.5;
    ctx.shadowColor='#c9a5ff';ctx.shadowBlur=12;ctx.lineCap='round';
    for(let i=0;i<pts.length-1;i++){
      const a1=pts[i],b1=pts[i+1];
      ctx.beginPath();ctx.moveTo(a1.x,a1.y);
      const segs=5;
      for(let s=1;s<=segs;s++){
        const t=s/segs;
        let px=a1.x+(b1.x-a1.x)*t;
        let py=a1.y+(b1.y-a1.y)*t;
        if(s<segs){
          const perp=Math.atan2(b1.y-a1.y,b1.x-a1.x)+Math.PI/2;
          const off=Math.sin(s*7.3+i*2.1)*5;
          px+=Math.cos(perp)*off;py+=Math.sin(perp)*off;
        }
        ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}
function drawSlashFx(){
  for(const s of G.slashFx){
    const p=s.life/s.maxLife;
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);
    ctx.globalAlpha=p;ctx.strokeStyle=s.color;
    ctx.lineWidth=3.5*p+.5;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,s.size*(1.3-p*.3),-.9,.9);ctx.stroke();
    ctx.restore();
  }
}
function drawShockwaves(){
  for(const s of G.shockwaves){
    const p = s.life / s.maxLife;
    const rad = s.r + (s.maxR - s.r) * easeOutCubic(1 - p);
    ctx.save();
    ctx.globalAlpha = p * 0.7;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 5 * p + 1;
    ctx.shadowColor = s.color; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI*2); ctx.stroke();
    // second inner ring
    ctx.globalAlpha = p * 0.4;
    ctx.lineWidth = 3 * p;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad * 0.7, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
function drawFX(){
  for(const p of G.particles){
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const r of G.rings){
    const p=1-r.life/r.maxLife;
    const rad=r.r+(r.maxR-r.r)*easeOutCubic(p);
    ctx.globalAlpha=(1-p)*.85;
    ctx.strokeStyle=r.color;ctx.lineWidth=3.5*(1-p)+.6;
    ctx.beginPath();ctx.arc(r.x,r.y,rad,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawPendingSpawns(){
  for(const p of G.pendingSpawns){
    const progress=1-(p.timer/p.maxTimer);
    const isBlue=p.side==='player';
    const col=isBlue?'#7fd6ff':'#ff8a8a';
    const colB=isBlue?'#3a86ff':'#d63030';
    ctx.save();
    ctx.globalAlpha=.35;
    ctx.beginPath();ctx.arc(p.x,p.y,26,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x,p.y,26,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);
    ctx.lineTo(p.x,p.y);ctx.closePath();
    ctx.fillStyle=colB+'cc';ctx.fill();
    ctx.restore();
    ctx.beginPath();ctx.arc(p.x,p.y,26,0,Math.PI*2);
    ctx.strokeStyle=col;ctx.lineWidth=2.5;
    ctx.setLineDash([5,4]);ctx.lineDashOffset=-G.t*20;ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#fff';
    ctx.font='bold 12px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#000';ctx.shadowBlur=4;
    ctx.fillText(Math.ceil(p.timer*10)/10,p.x,p.y);
    ctx.shadowBlur=0;
    const c=CARDS[p.key];
    ctx.font='18px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.fillText(c.icon,p.x,p.y-34);
  }
}
function drawTower(t){
  const r=t.r;
  if(!t.alive){
    ctx.save();ctx.translate(t.x,t.y);
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath();ctx.ellipse(0,r*.4,r*1.15,r*.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#57534a';
    for(let i=0;i<6;i++){
      const a=i*1.1;
      ctx.beginPath();ctx.arc(Math.cos(a)*r*.7,Math.sin(a)*r*.4+r*.25,2.5+(i%3),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();return;
  }
  if (t.carried){
    // carried towers are drawn floating above the titan, skip normal draw
    return;
  }
  const teamA=t.side==='player'?'#3b7ddd':'#d94a4a';
  const teamB=t.side==='player'?'#24518f':'#963131';
  const rec=t.recoil>0?Math.sin((1-t.recoil/.25)*Math.PI)*3:0;
  const dir=t.side==='player'?-1:1;
  ctx.save();ctx.translate(t.x,t.y+rec*dir);
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();ctx.ellipse(0,r*.68,r*1.05,r*.42,0,0,Math.PI*2);ctx.fill();
  const bg=ctx.createLinearGradient(0,-r,0,r);
  bg.addColorStop(0,'#e2dbca');bg.addColorStop(1,'#948d7c');
  ctx.fillStyle=bg;
  roundRect(ctx,-r*.85,-r*.85,r*1.7,r*1.7,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.32)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle=teamA;
  roundRect(ctx,-r*.95,-r*1.02,r*1.9,r*.58,6);ctx.fill();
  ctx.fillStyle=teamB;
  roundRect(ctx,-r*.95,-r*.56,r*1.9,r*.16,2);ctx.fill();
  const coreG=ctx.createRadialGradient(-r*.15,-r*.15,1,0,0,r*.45);
  coreG.addColorStop(0,'#fff');coreG.addColorStop(.45,teamA);coreG.addColorStop(1,teamB);
  ctx.beginPath();ctx.arc(0,0,r*.42,0,Math.PI*2);ctx.fillStyle=coreG;ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.5)';ctx.stroke();
  if(t.kind==='king'){
    ctx.font=`${Math.round(r*.9)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=t.active?1:.45;
    ctx.fillText('👑',0,-r*1.32);ctx.globalAlpha=1;
  }
  if(t.hitFlash>0){
    ctx.globalAlpha=(t.hitFlash/.12)*.65;
    ctx.fillStyle='#fff';
    roundRect(ctx,-r*.9,-r*1.05,r*1.8,r*1.85,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  if(t.kind==='king'&&!t.active){
    ctx.globalAlpha=.5+Math.sin(G.t*3)*.2;
    ctx.strokeStyle='#ffd166';ctx.lineWidth=2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(0,0,r*1.15,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  ctx.restore();
  drawHpBar(t.x,t.y-r-13,r*2.1,t.hp/t.maxHp,t.side);
}
function drawBattle(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  // Apply screen shake
  let sx = 0, sy = 0;
  if (G.shake > 0){
    sx = (Math.random() - 0.5) * G.shake;
    sy = (Math.random() - 0.5) * G.shake;
  }
  ctx.setTransform(view.scale, 0, 0, view.scale, view.ox + sx*view.dpr, view.oy + sy*view.dpr);
  drawArena();
  drawPlacement();
  drawZones();
  for(const t of G.towers)drawTower(t);
  drawPendingSpawns();
  drawUnits();
  drawProjectiles();
  drawChains();
  drawSlashFx();
  drawShockwaves();
  drawFX();
  drawGhostPreview();
}

   HUD

const elixirFill=document.getElementById('elixirFill');
const elixirNum=document.getElementById('elixirNum');
const timerEl=document.getElementById('timer');
const playerCrownsEl=document.getElementById('playerCrowns');
const enemyCrownsEl=document.getElementById('enemyCrowns');
const enemyElixirTopEl=document.getElementById('enemyElixirTop');
const playerElixirTopEl=document.getElementById('playerElixirTop');
let lastElixirFloor=-1,lastEnemyElixirFloor=-1,lastTimeStr='',lastCrowns='';
function updateHUD(){
  const e=G.elixir.player;
  elixirFill.style.width=(e/10*100)+'%';
  const fl=Math.floor(e);
  if(fl!==lastElixirFloor){
    lastElixirFloor=fl;
    elixirNum.textContent=fl;
    playerElixirTopEl.textContent=fl;
    renderHand();
  }
  const ee=G.elixir.enemy;
  const efl=Math.floor(ee);
  if(efl!==lastEnemyElixirFloor){
    lastEnemyElixirFloor=efl;
    enemyElixirTopEl.textContent=efl;
  }
  const m=Math.floor(G.timeLeft/60),s=Math.floor(G.timeLeft%60);

function onCardPointerDown(ev){
  ev.preventDefault();ev.stopPropagation();
  if(G.over)return;
  const i=+this.dataset.i;
  const key=G.queue.player[i];
  if(!key)return;
  const c=CARDS[key];
  if(G.elixir.player<c.cost){
    this.classList.add('shake');
    setTimeout(()=>this.classList.remove('shake'),320);
    SFX.cardFail();haptic('rigid');return;
  }
  drag.active=true;drag.cardIdx=i;
  drag.startX=ev.clientX;drag.startY=ev.clientY;
  drag.pointerId=ev.pointerId;drag.moved=false;
  const p=toWorld(ev.clientX,ev.clientY);
  drag.x=clamp(p.x,0,W);drag.y=clamp(p.y,0,H);
  this.classList.add('dragging');
  dragGhostEl.querySelector('.dgIcon').textContent=c.icon;
  const costEl=dragGhostEl.querySelector('.dgCost');
  costEl.textContent=c.cost;
  dragGhostEl.style.setProperty('--c',c.color);
  dragGhostEl.style.left=ev.clientX+'px';
  dragGhostEl.style.top=ev.clientY+'px';
  dragGhostEl.classList.add('show');
  G.selected=i;renderHand(true);
  try{this.setPointerCapture(ev.pointerId);}catch(e){}
}
function onCardPointerMove(ev){
  if(!drag.active)return;
  const dx=ev.clientX-drag.startX,dy=ev.clientY-drag.startY;
  if(!drag.moved&&Math.hypot(dx,dy)>8)drag.moved=true;
  dragGhostEl.style.left=ev.clientX+'px';
  dragGhostEl.style.top=ev.clientY+'px';
  const p=toWorld(ev.clientX,ev.clientY);
  drag.x=p.x;drag.y=p.y;
}
function onCardPointerUp(ev){
  if(!drag.active)return;
  const wasMoved=drag.moved,wx=drag.x,wy=drag.y,cardIdx=drag.cardIdx;
  drag.active=false;
  dragGhostEl.classList.remove('show');
  cardEls.forEach(el=>el.classList.remove('dragging'));
  try{if(drag.pointerId!==null)this.releasePointerCapture(drag.pointerId);}catch(e){}
  drag.pointerId=null;drag.moved=false;
  if(wasMoved){
    if(isValidPlacement(wx,wy)){
      const key=G.queue.player[cardIdx];
      const c=CARDS[key];
      if(G.elixir.player>=c.cost){
        queueDeploy('player',key,wx,wy,cardIdx);
        SFX.deploy();haptic('medium');
        G.selected=-1;ghostFromSelected.show=false;
        renderHand(true);
      }else{SFX.cardFail();haptic('rigid');}
    }else{SFX.cardFail();haptic('rigid');}
  }else{
    SFX.cardPick();haptic('light');
    renderHand(true);
  }
}
function onCanvasPointerDown(ev){
  ev.preventDefault();
  if(G.over||G.selected<0)return;
  const p=toWorld(ev.clientX,ev.clientY);
  if(!isValidPlacement(p.x,p.y)){
    SFX.cardFail();haptic('rigid');
    addRing(clamp(p.x,20,W-20),clamp(p.y,RIVER_Y+26,H-20),26,'#ff5a5a',.3);
    return;
  }
  const key=G.queue.player[G.selected];
  const c=CARDS[key];
  if(G.elixir.player<c.cost){SFX.cardFail();haptic('rigid');return;}
  const cardIdx=G.selected;
  queueDeploy('player',key,p.x,p.y,cardIdx);
  SFX.deploy();haptic('medium');
  G.selected=-1;ghostFromSelected.show=false;
  renderHand(true);
}

  ghostFromSelected.x=p.x;
  ghostFromSelected.y=p.y;

});

function renderHand(force){
  const q=G.queue.player;
  if(!q.length)return;
  const sig=q.slice(0,5).join(',')+'|'+G.selected+'|'+Math.floor(G.elixir.player);
  if(!force&&sig===handSig)return;
  handSig=sig;
  for(let i=0;i<4;i++){
    const key=q[i];
    if(!key)continue;
    const c=CARDS[key];
    const el=cardEls[i];
    const rarity=c.rarity||'common';
    el.className='card rarity-'+rarity;
    if(G.selected===i)el.classList.add('selected');
    if(G.elixir.player<c.cost)el.classList.add('disabled');
    const costEl=el.querySelector('.cost');
    costEl.textContent=c.cost;
    costEl.className='cost'+(c.cost<=2?' cheap':'')+(c.cost>=8&&rarity!=='holy'?' boss':'')+(rarity==='holy'?' holy':'');
    el.querySelector('.icon').textContent=c.icon;
    el.querySelector('.name').textContent=c.name;
    el.style.setProperty('--c',c.color);
  }
  const nk=q[4]||q[0];
  if(!nk)return;
  const nc=CARDS[nk];
  const nRarity=nc.rarity||'common';
  nextEl.className='card rarity-'+nRarity;
  const nCostEl=nextEl.querySelector('.cost');
  nCostEl.textContent=nc.cost;
  nCostEl.className='cost'+(nc.cost<=2?' cheap':'')+(nc.cost>=8&&nRarity!=='holy'?' boss':'')+(nRarity==='holy'?' holy':'');
  nextEl.querySelector('.icon').textContent=nc.icon;
  nextEl.querySelector('.name').textContent=nc.name;
  nextEl.style.setProperty('--c',nc.color);
}
function toWorld(clientX,clientY){
  const rect=gameCanvas.getBoundingClientRect();
  const px=(clientX-rect.left)*view.dpr;
  const py=(clientY-rect.top)*view.dpr;
  return{x:(px-view.ox)/view.scale,y:(py-view.oy)/view.scale};
}

const DECK_KEY='tgcard_deck_v7';
const WINS_KEY='tgcard_wins_v2';
const SOUND_KEY='tgcard_sound_v2';
let memoryDeck=null,memoryWins=null;
function tryStorage(fn){try{return fn(localStorage);}catch(e){try{return fn(sessionStorage);}catch(e2){return null;}}}
function sanitizeDeck(arr){
  if(!Array.isArray(arr))return null;
  const seen=new Set();const out=[];
  for(const k of arr){
    if(typeof k!=='string'||!CARDS[k]||seen.has(k))continue;
    seen.add(k);out.push(k);
    if(out.length===8)break;
  }
  return out;
}
function loadDeck(){
  let saved=tryStorage(s=>s.getItem(DECK_KEY));
  if(!saved)saved=tryStorage(s=>s.getItem('tgcard_deck_v6'));
  if(!saved)saved=tryStorage(s=>s.getItem('tgcard_deck_v5'));
  if(saved){
    try{
      const parsed=JSON.parse(saved);
      const clean=sanitizeDeck(parsed);
      if(clean&&clean.length>0){memoryDeck=clean;return clean;}
    }catch(e){}
  }
  if(memoryDeck&&memoryDeck.length>0)return memoryDeck;
  memoryDeck=[...DEFAULT_DECK];
  return [...DEFAULT_DECK];
}
function saveDeck(deck){
  const clean=sanitizeDeck(deck)||[];
  memoryDeck=clean;
  tryStorage(s=>{s.setItem(DECK_KEY,JSON.stringify(clean));return true;});
  try{if(tg?.CloudStorage)tg.CloudStorage.setItem(DECK_KEY,JSON.stringify(clean));}catch(e){}
  return clean;
}
function loadWins(){const s=tryStorage(s=>s.getItem(WINS_KEY));if(s!==null&&s!==undefined)return parseInt(s,10)||0;return memoryWins||0;}
function bumpWins(){const w=loadWins()+1;memoryWins=w;tryStorage(s=>{s.setItem(WINS_KEY,String(w));return true;});}
function loadSoundEnabled(){const s=tryStorage(s=>s.getItem(SOUND_KEY));return s!=='0';}
function saveSoundEnabled(v){tryStorage(s=>{s.setItem(SOUND_KEY,v?'1':'0');return true;});}

  }
  if(key==='elderdragon'||key==='necromancer'||key==='golem'||key==='balloon'){
    P.units.push(makePreviewChar(key,charX,charY));
    P.units.push(makeDummy(190,charY-20,c.color));
    P.units.push(makeDummy(190,charY+20,c.color));
    P.units.push(makeDummy(240,charY,c.color));
    return;
  }
  if(key==='tesla'||key==='mortar'||key==='bombtower'){
    P.units.push(makePreviewChar(key,charX,charY));
    const dd=key==='mortar'?200:70;
    P.units.push(makeDummy(charX+dd,charY,c.color));
    P.units.push(makeDummy(charX+dd+20,charY-35,c.color));
    return;
  }
  if(c.splash&&(key==='valkyrie'||key==='bomber'||key==='wallbreaker'||key==='icespirit'||key==='firespirit')){
    P.units.push(makePreviewChar(key,charX,charY));
    const range=Math.max(60,c.range);
    P.units.push(makeDummy(charX+range+10,charY,c.color));
    P.units.push(makeDummy(charX+range+25,charY-22,c.color));
    P.units.push(makeDummy(charX+range+25,charY+22,c.color));
    return;
  }
  if(c.count>1){
    P.units.push(makePreviewChar(key,charX,charY));
    const td=Math.max(90,c.range+30);
    P.units.push(makeDummy(charX+td,charY,c.color));
    P.units.push(makeDummy(charX+td,charY-40,c.color));
    return;
  }
  P.units.push(makePreviewChar(key,charX,charY));
  const td=Math.max(90,c.range+30);
  P.units.push(makeDummy(charX+td,charY,c.color));
}
function withPreviewState(fn){
  const r={
    units:G.units,projectiles:G.projectiles,particles:G.particles,
    rings:G.rings,zones:G.zones,chains:G.chains,slashFx:G.slashFx,shockwaves:G.shockwaves,
    towers:G.towers,t:G.t,pendingSpawns:G.pendingSpawns,shake:G.shake,
  };
  G.units=P.units;G.projectiles=P.projectiles;G.particles=P.particles;
  G.rings=P.rings;G.zones=P.zones;G.chains=P.chains;G.slashFx=P.slashFx;G.shockwaves=P.shockwaves;
  G.towers=[];G.t=P.t;G.pendingSpawns=P.pendingSpawns;G.shake=P.shake;
  fn();
  P.units=G.units;P.projectiles=G.projectiles;P.particles=G.particles;
  P.rings=G.rings;P.zones=G.zones;P.chains=G.chains;P.slashFx=G.slashFx;P.shockwaves=G.shockwaves;
  P.t=G.t;P.pendingSpawns=G.pendingSpawns;P.shake=G.shake;
  G.units=r.units;G.projectiles=r.projectiles;G.particles=r.particles;
  G.rings=r.rings;G.zones=r.zones;G.chains=r.chains;G.slashFx=r.slashFx;G.shockwaves=r.shockwaves;
  G.towers=r.towers;G.t=r.t;G.pendingSpawns=r.pendingSpawns;G.shake=r.shake;
}
function updatePreview(dt){
  P.t+=dt;P.resetTimer+=dt;
  if(P.resetTimer>8){setupPreview(P.key);return;}
  for(const u of P.units){
    if(u.key==='dummy')u.hp=u.maxHp;
    if(u.side==='player'&&u.maxHp>0&&u.hp<u.maxHp*.15&&u.key!==P.key&&!u.isClone){
      u.hp=u.maxHp*.3;
    }
  }
  withPreviewState(()=>{
    updateUnits(dt);updateProjectiles(dt);updateZones(dt);
    updateChains(dt);updateSlashFx(dt);updateShockwaves(dt);updateFX(dt);
  });
}
function drawPreviewScene(){
  const ctxSave=ctx,viewSave=view;
  ctx=previewCtx;view=previewView;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
  let sx=0,sy=0;
  if(P.shake>0){sx=(Math.random()-.5)*P.shake;sy=(Math.random()-.5)*P.shake;}
  ctx.setTransform(previewView.scale,0,0,previewView.scale,sx*previewView.dpr,sy*previewView.dpr);
  const g=ctx.createLinearGradient(0,0,0,PREVIEW_H);
  g.addColorStop(0,'#2a4d33');g.addColorStop(1,'#1a3020');
  ctx.fillStyle=g;ctx.fillRect(0,0,PREVIEW_W,PREVIEW_H);
  ctx.save();ctx.globalAlpha=.05;ctx.fillStyle='#fff';
  for(let y=0;y<PREVIEW_H;y+=28)ctx.fillRect(0,y,PREVIEW_W,14);ctx.restore();
  ctx.save();
  const vg=ctx.createRadialGradient(PREVIEW_W/2,PREVIEW_H/2,30,PREVIEW_W/2,PREVIEW_H/2,PREVIEW_W*.7);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,PREVIEW_W,PREVIEW_H);
  ctx.restore();
  withPreviewState(()=>{
    drawZones();
    const arr=G.units;
    if(arr.length>1)arr.sort((a,b)=>a.y-b.y);
    for(const u of arr)if(u.alive)drawUnit(u);
    drawProjectiles();drawChains();drawSlashFx();drawShockwaves();drawFX();
  });
  ctx=ctxSave;view=viewSave;
}
/* ================================================================
   TOAST + RESULT
================================================================ */
const toastEl=document.getElementById('toast');
let toastTimeout=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>toastEl.classList.remove('show'),1800);
}
document.getElementById('againBtn').addEventListener('pointerdown',(ev)=>{
  ev.preventDefault();
  SFX.uiClick();haptic('medium');initGame();
});
document.getElementById('menuBtn').addEventListener('pointerdown',(ev)=>{
  ev.preventDefault();
  SFX.uiClose();haptic('light');
  document.getElementById('overlay').classList.remove('show');
  showScreen('menu');
});
/* ================================================================
   LOOP
================================================================ */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  if(mode==='battle'){
    if(!G.over)update(dt);
    else{G.t+=dt;updateFX(dt);updateSlashFx(dt);updateShockwaves(dt);}
    updateHUD();
    drawBattle();
  }else if(mode==='card'){
    updatePreview(dt);
    drawPreviewScene();
  }
  requestAnimationFrame(loop);
}
/* ================================================================
   START
================================================================ */
showScreen('menu');
resizeGame();
resizePreview();
try{
  if(tg?.CloudStorage){
    tg.CloudStorage.getItem(DECK_KEY,(err,val)=>{
      if(!err&&val){
        try{
          const parsed=JSON.parse(val);
          const clean=sanitizeDeck(parsed);
          if(clean&&clean.length>0)memoryDeck=clean;
        }catch(e){}
      }
    });
  }
}catch(e){}
requestAnimationFrame((t)=>{
  lastT=t;
  requestAnimationFrame(loop);
});
</script>
