<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#0d0d0d;--surface-2:#161616;--surface-3:#202020;
  --text:#fff;--text-2:#a8a8a8;--text-3:#5a5a5a;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);
  --accent:#4d9fff;--accent-2:#6eb0ff;
  --green:#34d399;--gold:#fbbf24;--red:#f87171;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;touch-action:manipulation}

/* ====== HEADER ====== */
#header{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 6px) 16px 6px;z-index:100;background:rgba(0,0,0,.9);
  border-bottom:.5px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.h-left{display:flex;align-items:center;gap:10px;min-width:0}
.h-av{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.h-av img{width:100%;height:100%;object-fit:cover;display:block}
.h-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:16px;font-weight:700;letter-spacing:-.4px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-right{font-size:12px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:4px}

/* ====== MAIN ====== */
#main{position:absolute;inset:0;padding-top:calc(var(--safe-t) + 56px);padding-bottom:calc(var(--safe-b) + 60px);overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px;opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity .22s var(--ease),transform .28s var(--ease),visibility .22s}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;visibility:visible;transform:translateY(0)}

/* ====== TABS — CLEAN ====== */
#tabs{position:absolute;bottom:0;left:0;right:0;height:calc(var(--safe-b) + 60px);display:flex;
  background:rgba(0,0,0,.94);border-top:.5px solid var(--border);z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding-bottom:var(--safe-b)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:0;color:var(--text-3);font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:.2px;cursor:pointer;transition:color .25s var(--ease);position:relative}
.tab-btn.active{color:var(--accent)}
.tab-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s var(--spring)}
.tab-btn.active svg{transform:scale(1.12)}

/* ====== SEARCH BAR ====== */
.search-hero{margin-bottom:20px}
.search-title{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.search-sub{font-size:13px;color:var(--text-2);margin-bottom:14px}
.search-wrap{position:relative}
.search-input{width:100%;padding:14px 16px 14px 44px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;color:var(--text);font-family:inherit;font-size:16px;outline:none;
  transition:border .2s var(--ease),background .2s var(--ease)}
.search-input:focus{border-color:var(--accent);background:var(--surface-2)}
.search-input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;
  stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;transition:stroke .2s}
.search-input:focus~.search-icon{stroke:var(--accent)}
.search-spinner{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  border:2px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;display:none}
.search-spinner.show{display:block}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

/* ====== SUGGESTION CHIPS ====== */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  transition:all .15s var(--ease)}
.chip:active{transform:scale(.95);background:var(--surface-2);border-color:var(--accent);color:var(--accent)}

/* ====== SEARCH RESULTS ====== */
.results{margin-top:20px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;
  margin-bottom:10px;opacity:0;transform:translateY(8px);animation:resultIn .4s var(--spring) forwards}
@keyframes resultIn{to{opacity:1;transform:translateY(0)}}
.result-header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.result-av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surface-2);
  position:relative}
.result-av img{width:100%;height:100%;object-fit:cover;display:block}
.result-av::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.result-info{flex:1;min-width:0}
.result-name{font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-handle{font-size:13px;color:var(--text-3);margin-top:2px;font-weight:500}
.result-verified{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
  background:var(--accent);border-radius:50%;margin-left:6px;vertical-align:middle}
.result-verified svg{width:9px;height:9px;stroke:#fff;stroke-width:3;fill:none}
.result-actions{display:flex;gap:8px}
.result-btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;transition:transform .15s var(--spring),background .2s var(--ease);
  display:flex;align-items:center;justify-content:center;gap:6px}
.result-btn:active{transform:scale(.97)}
.result-btn.primary{background:var(--accent);color:#fff}
.result-btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.result-btn.done{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3);pointer-events:none}
.result-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ====== SKELETON ====== */
.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.skeleton-row{display:flex;align-items:center;gap:14px}
.skeleton-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;flex-shrink:0}
.skeleton-lines{flex:1;display:flex;flex-direction:column;gap:8px}
.skeleton-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skeleton-line:nth-child(2){width:60%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ====== STATE MESSAGES ====== */
.state-msg{text-align:center;padding:36px 20px;color:var(--text-3)}
.state-msg svg{width:44px;height:44px;stroke:var(--text-3);fill:none;stroke-width:1.4;margin-bottom:14px;opacity:.6}
.state-msg .state-title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.state-msg .state-text{font-size:13px;line-height:1.5}
.state-msg .state-text b{color:var(--accent);font-weight:600}
.state-msg.error svg{stroke:var(--red)}
.state-msg.error .state-title{color:var(--red)}
.retry-btn{margin-top:14px;padding:9px 18px;border-radius:99px;border:1px solid var(--border-2);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.retry-btn:active{opacity:.7}

/* ====== CONNECTIONS LIST ====== */
.section{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px}
.section-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-3);padding:14px 16px 10px}
.conn-row{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;cursor:pointer;
  transition:background .15s var(--ease)}
.conn-row:active{background:var(--surface-2)}
.conn-row+.conn-row::before{content:'';position:absolute;top:0;left:66px;right:16px;height:.5px;background:var(--border)}
.conn-av{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.conn-av img{width:100%;height:100%;object-fit:cover;display:block}
.conn-body{flex:1;min-width:0}
.conn-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn-handle{font-size:12.5px;color:var(--text-3);margin-top:1px;font-weight:500}
.conn-chevron{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.conn-empty{padding:28px 16px;text-align:center;font-size:13px;color:var(--text-3);line-height:1.5}

/* ====== NOVA / PULSE / PROFILE ====== */
.nova-card{background:linear-gradient(160deg,rgba(77,159,255,.1),rgba(77,159,255,.01)),var(--surface);
  border:1px solid rgba(77,159,255,.18);border-radius:20px;padding:24px 18px;text-align:center;margin-bottom:14px}
.nova-em{font-size:72px;line-height:1;margin-bottom:8px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.nova-name{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.nova-meta{font-size:12px;color:var(--text-3);margin-bottom:18px;font-weight:500}
.bar-row{margin-bottom:11px;text-align:left}
.bar-head{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .45s var(--spring)}
.nova-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.nova-btns button{padding:12px 4px;border-radius:10px;border:none;background:var(--surface-2);color:var(--text);
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;transition:transform .15s var(--spring)}
.nova-btns button:active{transform:scale(.94)}
.nova-btns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.anon-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.anon-text{font-size:13.5px;line-height:1.5;font-style:italic;margin-bottom:10px;color:var(--text)}
.reveal-btn{width:100%;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.reveal-btn:active{opacity:.7}

.profile-hero{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;text-align:center}
.profile-av{width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--surface-2);margin-bottom:14px;
  box-shadow:0 0 0 3px var(--accent),0 0 0 6px rgba(77,159,255,.15)}
.profile-av img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.profile-handle{font-size:13.5px;color:var(--text-3);font-weight:500}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center}
.stat-val{font-size:18px;font-weight:700;line-height:1;color:var(--text)}
.stat-lbl{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500}

.settings{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.setting-row{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative}
.setting-row+.setting-row::before{content:'';position:absolute;top:0;left:16px;right:16px;height:.5px;background:var(--border)}
.setting-lbl{font-size:14px;font-weight:500;flex:1}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);cursor:pointer;transition:background .2s}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;
  background:#fff;transition:transform .22s var(--spring)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::before{transform:translateX(16px)}

/* ====== TOAST ====== */
#toast-wrap{position:fixed;top:calc(var(--safe-t) + 68px);left:50%;transform:translateX(-50%);
  z-index:10000;display:flex;flex-direction:column;gap:6px;width:calc(100% - 32px);max-width:360px;
  align-items:center;pointer-events:none}
.toast{padding:11px 16px;border-radius:12px;background:rgba(20,20,20,.96);border:1px solid var(--border-2);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;
  opacity:0;transform:translateY(-10px);transition:opacity .2s,transform .3s var(--spring);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:rgba(52,211,153,.35);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,.35);color:var(--red)}
.toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>

<div id="header"></div>
<main id="main">
  <section class="page" id="page-friends"></section>
  <section class="page" id="page-nova"></section>
  <section class="page" id="page-pulse"></section>
  <section class="page" id="page-profile"></section>
</main>
<nav id="tabs"></nav>
<div id="toast-wrap"></div>

<script>
(function(){
'use strict';

/* ============================================================
   TELEGRAM
   ============================================================ */
const tg = window.Telegram?.WebApp;
if (tg){ try{tg.ready()}catch(_){}; try{tg.expand()}catch(_){} }
function haptic(t){ try{tg?.HapticFeedback?.impactOccurred(t||'light')}catch(_){} }

/* ============================================================
   ICONS
   ============================================================ */
const I = {
  people:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  paw:'<svg viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="9" cy="10" r="2"/><path d="M9 14a4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4z"/></svg>',
  pulse:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  user:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  check:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  x:'<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  feed:'<svg viewBox="0 0 24 24"><path d="M4 5h16l-2 4H6zM6 9v10h12V9M9 13h6"/></svg>',
  play:'<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>',
  sleep:'<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  error:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  empty:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>'
};

/* ============================================================
   STATE
   ============================================================ */
const LS_KEY = 'orbit_v4';
const state = {
  tab: 'friends',
  query: '',
  result: null,
  searching: false,
  error: null,
  connections: [],           // [{username, name, photo}]
  nova: { food: 68, happy: 54, energy: 41, level: 3, xp: 340, xpMax: 500 },
  balance: 1250,
  notifications: true
};
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    connections: state.connections,
    nova: state.nova,
    balance: state.balance,
    notifications: state.notifications
  })) }catch(_){}
}
function load(){
  try{ const r = localStorage.getItem(LS_KEY); if(!r) return;
    const d = JSON.parse(r);
    if (Array.isArray(d.connections)) state.connections = d.connections;
    if (d.nova) state.nova = { ...state.nova, ...d.nova };
    if (typeof d.balance === 'number') state.balance = d.balance;
    if (typeof d.notifications === 'boolean') state.notifications = d.notifications;
  }catch(_){}
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

/* ============================================================
   REAL USERNAME SEARCH — no backend needed
   Uses public CORS proxy to fetch t.me/<username> HTML,
   parses og:title for the REAL display name,
   uses unavatar.io CDN for the REAL profile photo.
   ============================================================ */
const SEARCH_CACHE = new Map();

async function fetchViaProxy(url){
  const proxies = [
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`
  ];
  for (const make of proxies){
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 7000);
      const res = await fetch(make(url), { signal: controller.signal });
      clearTimeout(timeout);
      if (res.ok){
        const text = await res.text();
        if (text && text.length > 200) return text;
      }
    } catch(_){ }
  }
  return null;
}

function extractMeta(html, property){
  const pats = [
    new RegExp(`<meta[^>]+property=["']${property}["'][^>]+content=["']([^"']+)["']`, 'i'),
    new RegExp(`<meta[^>]+content=["']([^"']+)["'][^>]+property=["']${property}["']`, 'i')
  ];
  for (const p of pats){
    const m = html.match(p);
    if (m) return m[1];
  }
  return null;
}

async function resolveUsername(input){
  const clean = String(input).replace(/^@/, '').trim().toLowerCase();
  if (!clean) return { error: 'empty' };
  if (clean.length < 3) return { error: 'too_short' };
  if (!/^[a-z0-9_]{3,32}$/i.test(clean)) return { error: 'invalid' };

  if (SEARCH_CACHE.has(clean)) return { ok: true, user: SEARCH_CACHE.get(clean) };

  const html = await fetchViaProxy('https://t.me/' + clean);
  if (!html) return { error: 'network' };

  const title = extractMeta(html, 'og:title');
  if (!title) return { error: 'not_found' };

  // Telegram's "user not found" page uses generic titles like "Telegram: Contact @username" or "Telegram Messenger"
  const generic = [
    /^telegram:/i,
    /^telegram messenger/i,
    /^contact @/i,
    /^join telegram/i,
    /^telegram\./i
  ];
  const isGeneric = generic.some(p => p.test(title.trim()));
  if (isGeneric) return { error: 'not_found' };

  // Real user found. Photo comes from unavatar.io — real Telegram avatar CDN.
  const user = {
    username: clean,
    name: title.trim(),
    photo: `https://unavatar.io/telegram/${clean}`
  };
  SEARCH_CACHE.set(clean, user);
  return { ok: true, user };
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?I.check:type==='error'?I.x:I.search) + `<span>${esc(text)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),280); }, 2400);
  haptic('light');
}

/* ============================================================
   HEADER
   ============================================================ */
function renderHeader(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? ((u.first_name||'')+(u.last_name?' '+u.last_name:'')).trim() : 'You';
  const photo = u?.photo_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=4d9fff&textColor=ffffff`;
  $('#header').innerHTML = `
    <div class="h-left">
      <div class="h-av"><img src="${esc(photo)}" alt="" onerror="this.style.background='#161616'"></div>
      <div class="h-name">${esc(name)}</div>
    </div>
    <div class="h-brand">Orbit</div>
    <div class="h-right">${state.balance.toLocaleString()} 💎</div>`;
}

/* ============================================================
   TABS
   ============================================================ */
const TABS = [
  {id:'friends', label:'Friends', icon:'people'},
  {id:'nova', label:'Nova', icon:'paw'},
  {id:'pulse', label:'Pulse', icon:'pulse'},
  {id:'profile', label:'Profile', icon:'user'}
];
function renderTabs(){
  $('#tabs').innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.tab===t.id?' active':'');
    b.dataset.tab = t.id;
    b.innerHTML = I[t.icon] + `<span>${t.label}</span>`;
    b.addEventListener('click', () => switchTab(t.id));
    $('#tabs').appendChild(b);
  });
}
function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');
  $('#page-'+state.tab)?.classList.remove('active');
  state.tab = tab;
  $('#page-'+tab).classList.add('active');
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  if (tab==='friends') renderFriends();
  if (tab==='nova') renderNova();
  if (tab==='pulse') renderPulse();
  if (tab==='profile') renderProfile();
}

/* ============================================================
   FRIENDS PAGE (search is the hero)
   ============================================================ */
function renderFriends(){
  const page = $('#page-friends');

  const examples = ['durov', 'telegram', 'durov'];
  const chipsHtml = ['durov', 'telegram'].map(u =>
    `<button class="chip" data-try="${u}">@${u}</button>`).join('');

  let resultsHtml = '';
  if (state.searching){
    resultsHtml = `
      <div class="results">
        <div class="skeleton-card">
          <div class="skeleton-row">
            <div class="skeleton-av"></div>
            <div class="skeleton-lines">
              <div class="skeleton-line"></div>
              <div class="skeleton-line"></div>
            </div>
          </div>
        </div>
      </div>`;
  } else if (state.error){
    resultsHtml = `
      <div class="results">
        <div class="state-msg error">
          ${I.error}
          <div class="state-title">${errorTitle(state.error)}</div>
          <div class="state-text">${errorText(state.error)}</div>
          <button class="retry-btn" id="retry-btn">Try again</button>
        </div>
      </div>`;
  } else if (state.result){
    resultsHtml = `<div class="results">${renderResultCard(state.result)}</div>`;
  } else if (state.query && !state.searching){
    resultsHtml = `
      <div class="results">
        <div class="state-msg">
          ${I.empty}
          <div class="state-title">Type a username to search</div>
          <div class="state-text">Example: <b>@durov</b> for Pavel Durov's real profile</div>
        </div>
      </div>`;
  }

  const connectionsHtml = state.connections.length
    ? state.connections.map((c,i) => `
        <div class="conn-row" data-open="${esc(c.username)}" style="animation-delay:${i*20}ms">
          <div class="conn-av"><img src="${esc(c.photo)}" alt="" onerror="this.style.background='#161616'"></div>
          <div class="conn-body">
            <div class="conn-name">${esc(c.name)}</div>
            <div class="conn-handle">@${esc(c.username)}</div>
          </div>
          ${I.chev}
        </div>`).join('')
    : `<div class="conn-empty">Nobody added yet.<br>Search a username above to add your first connection.</div>`;

  page.innerHTML = `
    <div class="search-hero">
      <div class="search-title">Find people</div>
      <div class="search-sub">Search any Telegram user by @username</div>
      <div class="search-wrap">
        ${I.search}
        <input class="search-input" id="search-input" placeholder="@username" value="${esc(state.query)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <div class="search-spinner ${state.searching?'show':''}" id="search-spinner"></div>
      </div>
      <div class="chips">${chipsHtml}</div>
    </div>

    ${resultsHtml}

    <div class="section">
      <div class="section-title">Your connections (${state.connections.length})</div>
      ${connectionsHtml}
    </div>`;

  const input = $('#search-input');
  let debounceTimer;
  input?.addEventListener('input', e => {
    state.query = e.target.value;
    clearTimeout(debounceTimer);
    // reset states when typing
    state.result = null;
    state.error = null;
    state.searching = false;
    // rerender will happen after debounce
    if (!state.query.trim()){
      renderFriends();
      return;
    }
    debounceTimer = setTimeout(() => {
      runSearch();
    }, 500);
  });
  input?.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ clearTimeout(debounceTimer); runSearch(); }
  });

  page.querySelectorAll('[data-try]').forEach(chip => {
    chip.addEventListener('click', () => {
      state.query = '@' + chip.dataset.try;
      if (input) input.value = state.query;
      haptic('light');
      runSearch();
    });
  });

  $('#retry-btn')?.addEventListener('click', () => runSearch());

  page.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => addConnection(btn.dataset.add));
  });
  page.querySelectorAll('[data-open]').forEach(row => {
    row.addEventListener('click', () => openChat(row.dataset.open));
  });
}

function errorTitle(err){
  if (err === 'not_found') return 'No user found';
  if (err === 'invalid') return 'Invalid username';
  if (err === 'too_short') return 'Too short';
  if (err === 'network') return 'Network error';
  return 'Search error';
}
function errorText(err){
  if (err === 'not_found') return 'Nobody on Telegram uses that @username. Check spelling.';
  if (err === 'invalid') return 'Usernames are 3–32 letters, numbers or underscores.';
  if (err === 'too_short') return 'Type at least 3 characters.';
  if (err === 'network') return 'Couldn\'t reach Telegram. Try again in a moment.';
  return 'Something went wrong. Try again.';
}

async function runSearch(){
  const q = state.query.trim();
  if (!q) return;
  const clean = q.replace(/^@/, '');
  if (clean.length < 3 || !/^[a-z0-9_]{3,32}$/i.test(clean)){
    state.error = clean.length < 3 ? 'too_short' : 'invalid';
    state.searching = false;
    state.result = null;
    renderFriends();
    return;
  }
  state.searching = true;
  state.result = null;
  state.error = null;
  renderFriends();

  const res = await resolveUsername(clean);

  state.searching = false;
  if (res.error){
    state.error = res.error;
    state.result = null;
  } else {
    state.result = res.user;
    state.error = null;
    haptic('medium');
  }
  renderFriends();
}

function renderResultCard(u){
  const alreadyAdded = state.connections.some(c => c.username.toLowerCase() === u.username.toLowerCase());
  return `
    <div class="result-card">
      <div class="result-header">
        <div class="result-av">
          <img src="${esc(u.photo)}" alt="${esc(u.name)}" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(u.username)}&backgroundColor=4d9fff&textColor=ffffff'">
        </div>
        <div class="result-info">
          <div class="result-name">${esc(u.name)}</div>
          <div class="result-handle">@${esc(u.username)}</div>
        </div>
      </div>
      <div class="result-actions">
        ${alreadyAdded
          ? `<button class="result-btn done">${I.check}<span>Added</span></button>
             <button class="result-btn ghost" data-open="${esc(u.username)}">${I.chat}<span>Open</span></button>`
          : `<button class="result-btn primary" data-add="${esc(u.username)}">${I.chat}<span>Connect</span></button>
             <button class="result-btn ghost" data-open="${esc(u.username)}">${I.chev}<span>View</span></button>`}
      </div>
    </div>`;
}

/* ============================================================
   ADD / OPEN
   ============================================================ */
function addConnection(username){
  const u = state.result;
  if (!u) return;
  if (state.connections.some(c => c.username.toLowerCase() === username.toLowerCase())){
    toast('Already in your connections', 'info');
    return;
  }
  state.connections.unshift({
    username: u.username,
    name: u.name,
    photo: u.photo
  });
  save();
  haptic('heavy');
  toast(`Connected with @${u.username}`, 'success');
  renderFriends();

  // open the real Telegram chat after a short delay
  setTimeout(() => openChat(u.username), 600);
}

function openChat(username){
  const clean = String(username).replace(/^@/, '');
  haptic('medium');
  try {
    if (tg?.openTelegramLink){
      tg.openTelegramLink('https://t.me/' + clean);
      return;
    }
  } catch(_){}
  window.open('https://t.me/' + clean, '_blank');
}

/* ============================================================
   NOVA PAGE
   ============================================================ */
function renderNova(){
  const n = state.nova;
  const pct = Math.min(100, (n.xp / n.xpMax) * 100);
  $('#page-nova').innerHTML = `
    <div class="nova-card">
      <div class="nova-em">🦊</div>
      <div class="nova-name">Nova</div>
      <div class="nova-meta">Level ${n.level} · ${state.connections.length} friends caring</div>
      ${['food','happy','energy'].map((k,i)=>`
        <div class="bar-row">
          <div class="bar-head"><span>${k[0].toUpperCase()+k.slice(1)}</span><span>${n[k]}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${n[k]}%;background:${['#34d399','#fbbf24','#4d9fff'][i]}"></div></div>
        </div>`).join('')}
      <div class="nova-btns">
        <button data-care="feed">${I.feed}<span>Feed</span></button>
        <button data-care="play">${I.play}<span>Play</span></button>
        <button data-care="sleep">${I.sleep}<span>Sleep</span></button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Level progress</div>
      <div style="padding:0 16px 16px">
        <div class="bar-head"><span>Level ${n.level}</span><span>${n.xp}/${n.xpMax}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      </div>
    </div>`;
  $$('[data-care]').forEach(b => b.addEventListener('click', () => care(b.dataset.care)));
}
function care(kind){
  const n = state.nova;
  if (kind==='feed'){ n.food=clamp(n.food+18,0,100); n.energy=clamp(n.energy-5,0,100); n.xp+=15; }
  if (kind==='play'){ n.happy=clamp(n.happy+16,0,100); n.energy=clamp(n.energy-12,0,100); n.xp+=20; }
  if (kind==='sleep'){ n.energy=clamp(n.energy+22,0,100); n.food=clamp(n.food-4,0,100); n.xp+=10; }
  if (n.xp >= n.xpMax){ n.level++; n.xp=0; n.xpMax=Math.round(n.xpMax*1.2); toast('Nova leveled up', 'success'); haptic('heavy'); }
  else haptic('light');
  save();
  renderNova();
}

/* ============================================================
   PULSE PAGE
   ============================================================ */
function renderPulse(){
  $('#page-pulse').innerHTML = `
    <div class="section">
      <div class="section-title">Anonymous messages</div>
      <div style="padding:0 16px 16px">
        <div class="anon-card">
          <div class="anon-text">"You're building something cool. Keep going."</div>
          <button class="reveal-btn" data-reveal="50">Reveal author · 50 💎</button>
        </div>
        <div class="anon-card">
          <div class="anon-text">"Bro it's 3am, close the laptop and sleep."</div>
          <button class="reveal-btn" data-reveal="50">Reveal author · 50 💎</button>
        </div>
      </div>
    </div>`;
  $$('[data-reveal]').forEach(b => b.addEventListener('click', () => {
    const cost = +b.dataset.reveal;
    if (state.balance < cost){ toast('Not enough diamonds', 'error'); return; }
    state.balance -= cost;
    save();
    renderHeader();
    toast('Author revealed', 'success');
    haptic('heavy');
    b.textContent = 'Revealed ✓';
    b.disabled = true;
    b.style.color = 'var(--green)';
  }));
}

/* ============================================================
   PROFILE PAGE
   ============================================================ */
function renderProfile(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? ((u.first_name||'')+(u.last_name?' '+u.last_name:'')).trim() : 'You';
  const handle = u?.username ? '@'+u.username : 'no username';
  const photo = u?.photo_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=4d9fff&textColor=ffffff`;
  $('#page-profile').innerHTML = `
    <div class="profile-hero">
      <div class="profile-av"><img src="${esc(photo)}" alt="" onerror="this.style.background='#161616'"></div>
      <div class="profile-name">${esc(name)}</div>
      <div class="profile-handle">${esc(handle)}</div>
    </div>
    <div class="profile-stats">
      <div class="stat-card"><div class="stat-val">${state.connections.length}</div><div class="stat-lbl">Connections</div></div>
      <div class="stat-card"><div class="stat-val">${state.nova.level}</div><div class="stat-lbl">Nova</div></div>
      <div class="stat-card"><div class="stat-val">${state.balance.toLocaleString()}</div><div class="stat-lbl">Diamonds</div></div>
    </div>
    <div class="settings">
      <div class="setting-row"><span class="setting-lbl">Notifications</span>
        <label class="switch"><input type="checkbox" id="notif" ${state.notifications?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="setting-row"><span class="setting-lbl">Haptics</span>
        <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
      </div>
    </div>
    <div style="padding:20px;text-align:center;font-size:11px;color:var(--text-3)">Orbit · v1.0</div>`;
  $('#notif')?.addEventListener('change', e => { state.notifications = e.target.checked; save(); });
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  load();
  renderHeader();
  renderTabs();
  switchTab('friends');
}
init();

})();
</script>
