<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cashback</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}

  :root{
    --bg:#000;
    --card-1:#0d0d0d;
    --card-2:#060606;
    --border:#181818;
    --border-2:#242424;
    --text:#f2f2f2;
    --text-2:#8a8a8a;
    --text-3:#4a4a4a;
    --accent:#e8e8e8;
    --green:#4CC38A;
    --ease:.35s cubic-bezier(.4,0,.2,1);
  }

  html,body{
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    padding:20px 14px 40px;
    display:flex;flex-direction:column;align-items:center;
  }

  .stack{
    width:100%;max-width:400px;
    display:flex;flex-direction:column;gap:12px;
  }

  .card{
    background:linear-gradient(180deg,var(--card-1) 0%,var(--card-2) 100%);
    border:1px solid var(--border);
    border-radius:14px;
  }

  /* ========== PROFILE ========== */
  .profile{
    padding:22px 20px 18px;
    display:flex;flex-direction:column;align-items:center;
  }
  .profile .pfp{
    width:76px;height:76px;border-radius:50%;
    object-fit:cover;
    border:1px solid var(--border-2);
    background:#111;
    margin-bottom:12px;
  }
  .profile .nick{
    font-size:17px;font-weight:800;color:var(--text);
    letter-spacing:-.3px;line-height:1.15;
    text-align:center;
    max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    margin-bottom:6px;
  }
  .profile .rank-line{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:700;color:var(--text-2);
    letter-spacing:.1px;
    margin-bottom:18px;
  }
  .profile .rank-line .rk-dot{
    width:3px;height:3px;border-radius:50%;background:var(--text-3);
  }
  .profile .rank-line .rk-pct{
    color:var(--green);
    font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .profile .rank-line.locked .rk-pct{color:var(--text-3)}

  .profile .progress-head{
    width:100%;
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;font-weight:700;
    color:var(--text-3);
    letter-spacing:.1px;
    margin-bottom:8px;
    font-variant-numeric:tabular-nums;
  }
  .profile .progress-head .right{color:var(--text-2)}

  .profile .progress-track{
    position:relative;
    width:100%;
    height:5px;
    background:#141414;
    border-radius:5px;
  }
  .profile .progress-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--accent);
    border-radius:5px;
    transition:width .55s cubic-bezier(.4,0,.2,1);
  }
  .profile .progress-arrow{
    position:absolute;
    top:-8px;
    width:10px;height:6px;
    color:var(--accent);
    transform:translateX(-50%);
    transition:left .55s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }
  .profile .progress-arrow svg{width:100%;height:100%;display:block;fill:currentColor}

  /* ========== CLAIM ========== */
  .claim{
    padding:13px 14px 12px;
  }
  .claim .row-1{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
  }
  .claim .left-meta{
    display:flex;align-items:center;gap:9px;
    min-width:0;
  }
  .claim .claim-icon{
    width:26px;height:26px;object-fit:contain;flex-shrink:0;
    transition:opacity .3s ease;
  }
  .claim .claim-icon.locked{opacity:.35}
  .claim .label{
    font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--text-3);
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .claim .pct{
    font-size:15px;font-weight:900;color:var(--green);
    letter-spacing:-.3px;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .claim .pct.locked{color:var(--text-3)}

  .claim .amount{
    display:flex;align-items:center;gap:8px;
    font-size:24px;font-weight:900;color:var(--text);
    letter-spacing:-1px;line-height:1;
    font-variant-numeric:tabular-nums;
    margin-bottom:11px;
  }
  .claim .amount img{
    width:17px;height:17px;object-fit:contain;
    opacity:.85;
  }

  .claim .btns{
    display:flex;gap:7px;
  }
  .claim .btns button{
    flex:1;
    padding:10px 8px;
    border-radius:9px;
    font-family:inherit;font-size:12px;font-weight:800;
    letter-spacing:.3px;
    cursor:pointer;
    transition:transform .18s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
    border:1px solid var(--border-2);
    background:transparent;
    color:var(--text);
  }
  .claim .btns button:active{transform:scale(.98)}
  .claim .btns .btn-solid{
    background:var(--accent);
    color:#000;
    border-color:var(--accent);
  }
  .claim .btns .btn-solid:active{background:#c8c8c8}
  .claim .btns button:disabled{
    opacity:.3;pointer-events:none;
  }

  .stake-row{
    display:none;
    margin-top:9px;
    padding-top:10px;
    border-top:1px solid var(--border);
    gap:7px;
  }
  .stake-row.open{display:flex}
  .stake-row button{
    flex:1;
    padding:9px 4px;
    border-radius:8px;
    border:1px solid var(--border-2);
    background:transparent;
    color:var(--text-2);
    font-family:inherit;font-size:11px;font-weight:800;
    letter-spacing:.3px;
    cursor:pointer;
    transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
  }
  .stake-row button:active{background:rgba(255,255,255,.05)}
  .stake-row button span{display:block;font-size:9.5px;color:var(--text-3);font-weight:700;margin-top:2px}

  /* ========== WHEEL (no card, no border, just floating) ========== */
  .wheel-zone{
    padding:26px 0 14px;
  }

  .wheel-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0px;
    cursor:grab;
    touch-action:none;
  }
  .wheel-area:active{cursor:grabbing}

  /* vertical slot reel */
  .reel-window{
    position:relative;
    width:150px;
    height:150px;
    overflow:hidden;
    flex-shrink:0;
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
  }
  .reel-strip{
    position:absolute;
    left:0;right:0;top:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .5s cubic-bezier(.22,.9,.24,1);
    will-change:transform;
  }
  .reel-strip.dragging{transition:none}

  .reel-item{
    width:150px;
    height:150px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .reel-item img{
    width:128px;
    height:128px;
    object-fit:contain;
    display:block;
    pointer-events:none;
  }

  /* vertical arc immediately beside the reel */
  .arc-wrap{
    width:46px;
    height:170px;
    flex-shrink:0;
    margin-left:-6px;
    pointer-events:none;
  }
  .arc{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  .arc-base{
    stroke:#1c1c1c;
    stroke-width:4;
    fill:none;
    stroke-linecap:round;
  }
  .arc-fill{
    stroke:#e8e8e8;
    stroke-width:4;
    fill:none;
    stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.35));
    transition:stroke-dashoffset .5s cubic-bezier(.22,.9,.24,1);
  }
  .arc-fill.dragging{transition:none}

  .wheel-caption{
    text-align:center;
    padding-top:14px;
  }
  .wheel-caption .wn{
    font-size:14px;font-weight:800;color:var(--text);
    letter-spacing:-.2px;
  }
  .wheel-caption .wp{
    font-size:12px;font-weight:900;color:var(--green);
    letter-spacing:.2px;
    font-variant-numeric:tabular-nums;
    margin-top:3px;
  }

  /* ========== DEMO ========== */
  .demo{
    padding:12px 14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .demo .lbl{
    display:flex;justify-content:space-between;
    font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--text-3);
  }
  .demo .lbl strong{color:var(--text-2);letter-spacing:0;font-size:11px;font-variant-numeric:tabular-nums}
  .demo input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;
    background:#1a1a1a;outline:none;
  }
  .demo input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.7);
    cursor:grab;margin-top:-6px;
  }
  .demo input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;border:none;background:var(--accent);
    box-shadow:0 0 0 1px #000, 0 2px 6px rgba(0,0,0,.7);
  }
  .demo-btns{display:flex;gap:6px;flex-wrap:wrap}
  .demo-btns button{
    flex:1;min-width:0;
    padding:8px 6px;
    border-radius:8px;
    border:1px solid var(--border-2);
    background:transparent;
    color:var(--text-2);
    font-family:inherit;font-size:10.5px;font-weight:800;
    letter-spacing:.3px;cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease);
  }
  .demo-btns button:active{background:#141414;color:#fff}

  /* ========== TOAST ========== */
  .toast{
    position:fixed;top:24px;left:50%;
    transform:translateX(-50%) translateY(-24px);
    padding:11px 18px;
    background:#0e0e0e;
    border:1px solid var(--border-2);
    border-radius:10px;
    color:var(--text);font-size:12.5px;font-weight:800;letter-spacing:.2px;
    box-shadow:0 12px 40px rgba(0,0,0,.75);
    opacity:0;pointer-events:none;
    transition:transform .4s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    z-index:9999;
    white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div class="stack">

  <!-- PROFILE -->
  <div class="card profile">
    <img class="pfp" src="https://i.pravatar.cc/150?img=12" alt="">
    <div class="nick">Player</div>

    <div class="rank-line" id="rank-line">
      <span class="rk-name" id="rk-name">Unranked</span>
      <span class="rk-dot"></span>
      <span class="rk-pct" id="rk-pct">0.0%</span>
    </div>

    <div class="progress-head">
      <span id="prog-left">0 wagered</span>
      <span class="right" id="prog-right">7,500 to unlock</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill"></div>
      <div class="progress-arrow" id="prog-arrow">
        <svg viewBox="0 0 12 8"><polygon points="0,0 12,0 6,8"/></svg>
      </div>
    </div>
  </div>

  <!-- CLAIM -->
  <div class="card claim">
    <div class="row-1">
      <div class="left-meta">
        <img class="claim-icon locked" id="claim-icon" src="" alt="">
        <div class="label">Available to claim</div>
      </div>
      <div class="pct locked" id="claim-pct">0.0%</div>
    </div>
    <div class="amount">
      <img src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="">
      <span id="claim-value">0</span>
    </div>
    <div class="btns">
      <button id="btn-stake" type="button">Stake</button>
      <button class="btn-solid" id="btn-claim" type="button" disabled>Claim</button>
    </div>
    <div class="stake-row" id="stake-row">
      <button data-days="2" type="button">2d <span>+25%</span></button>
      <button data-days="4" type="button">4d <span>+50%</span></button>
      <button data-days="7" type="button">7d <span>+100%</span></button>
    </div>
  </div>

  <!-- WHEEL (no card, floating) -->
  <div class="wheel-zone">
    <div class="wheel-area" id="wheel">
      <div class="reel-window">
        <div class="reel-strip" id="reel-strip"></div>
      </div>
      <div class="arc-wrap">
        <svg class="arc" viewBox="0 0 44 170" preserveAspectRatio="none">
          <path class="arc-base" d="M 8 8 Q 36 85 8 162" />
          <path class="arc-fill" id="arc-fill" d="M 8 8 Q 36 85 8 162" />
        </svg>
      </div>
    </div>
    <div class="wheel-caption">
      <div class="wn" id="wn">Rank 1</div>
      <div class="wp" id="wp">1.5%</div>
    </div>
  </div>

  <!-- DEMO -->
  <div class="card demo">
    <div class="lbl">
      <span>Test wagered</span>
      <strong id="demo-val">0</strong>
    </div>
    <input id="demo-range" type="range" min="0" max="1600000" step="100" value="0">
    <div class="demo-btns">
      <button data-w="0">Reset</button>
      <button data-w="7500">R1</button>
      <button data-w="25000">R2</button>
      <button data-w="75000">R3</button>
      <button data-w="200000">R4</button>
      <button data-w="500000">R5</button>
      <button data-w="1500000">R6</button>
    </div>
    <div class="demo-btns">
      <button data-earn="250">+250 cb</button>
      <button data-earn="800">+800 cb</button>
      <button data-earn="2500">+2500 cb</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">Claimed</div>

<script>
(function(){
  'use strict';

  /* ============================================================
     CONFIG
     ============================================================ */
  const RANKS = [
    { rank: 1, threshold: 7500,    pct: 1.5, img: 'https://i.postimg.cc/LXwm8NP4/jq06s-removebg-preview.png' },
    { rank: 2, threshold: 25000,   pct: 2.0, img: 'https://i.postimg.cc/CKMhPZYB/o-Tz-Q4-removebg-preview.png' },
    { rank: 3, threshold: 75000,   pct: 2.5, img: 'https://i.postimg.cc/x12Tmx4z/FLYTP-removebg-preview.png' },
    { rank: 4, threshold: 200000,  pct: 3.0, img: 'https://i.postimg.cc/x8whWZmr/x8a-KM-removebg-preview.png' },
    { rank: 5, threshold: 500000,  pct: 3.5, img: 'https://i.postimg.cc/DZz9sLhj/gzp-WY-removebg-preview.png' },
    { rank: 6, threshold: 1500000, pct: 4.0, img: 'https://i.postimg.cc/fRcQhM59/Oa-Uf-D-removebg-preview.png' },
  ];

  const ITEM_H = 150;   /* reel row height in px */

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    wagered: 0,
    rank: 0,
    pct: 0,
    pending: 0,
    wheelIdx: 0,
  };

  /* ============================================================
     HELPERS
     ============================================================ */
  function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }
  function haptic(s){ try{ if(navigator.vibrate) navigator.vibrate(s==='heavy'?24:8); }catch(_){} }

  function computeRank(w){
    let rank = 0, pct = 0;
    for(let i = 0; i < RANKS.length; i++){
      if(w >= RANKS[i].threshold){ rank = RANKS[i].rank; pct = RANKS[i].pct; }
      else break;
    }
    return { rank, pct };
  }

  /* ============================================================
     PROFILE RENDER
     ============================================================ */
  function renderProfile(){
    const lineEl = document.getElementById('rank-line');
    const nameEl = document.getElementById('rk-name');
    const pctEl  = document.getElementById('rk-pct');

    if(state.rank === 0){
      lineEl.classList.add('locked');
      nameEl.textContent = 'Unranked';
      pctEl.textContent = '0.0%';
    } else {
      const r = RANKS[state.rank - 1];
      lineEl.classList.remove('locked');
      nameEl.textContent = 'Rank ' + r.rank + (r.rank === RANKS.length ? ' · Max' : '');
      pctEl.textContent = r.pct.toFixed(1) + '%';
    }

    const left = document.getElementById('prog-left');
    const right = document.getElementById('prog-right');
    const fill = document.getElementById('prog-fill');
    const arrow = document.getElementById('prog-arrow');

    const cur = state.rank;
    if(cur >= RANKS.length){
      left.textContent = fmt(state.wagered) + ' wagered';
      right.textContent = 'Max rank';
      fill.style.width = '100%';
      arrow.style.left = '100%';
      return;
    }
    const next = RANKS[cur];
    const base = cur > 0 ? RANKS[cur - 1].threshold : 0;
    const span = Math.max(1, next.threshold - base);
    const progress = Math.min(1, Math.max(0, (state.wagered - base) / span));

    left.textContent = fmt(state.wagered) + ' wagered';
    right.textContent = (cur === 0)
      ? fmt(next.threshold) + ' to unlock'
      : fmt(next.threshold) + ' to Rank ' + (cur + 1);

    fill.style.width = (progress * 100) + '%';
    arrow.style.left = (progress * 100) + '%';
  }

  /* ============================================================
     CLAIM RENDER
     ============================================================ */
  function renderClaim(){
    const iconEl = document.getElementById('claim-icon');
    const pctEl  = document.getElementById('claim-pct');
    const valEl  = document.getElementById('claim-value');
    const btn    = document.getElementById('btn-claim');
    const btnS   = document.getElementById('btn-stake');

    valEl.textContent = fmt(state.pending);

    if(state.rank === 0){
      iconEl.classList.add('locked');
      iconEl.src = RANKS[0].img;
      pctEl.classList.add('locked');
      pctEl.textContent = '0.0%';
    } else {
      const r = RANKS[state.rank - 1];
      iconEl.classList.remove('locked');
      iconEl.src = r.img;
      pctEl.classList.remove('locked');
      pctEl.textContent = r.pct.toFixed(1) + '%';
    }

    btn.disabled = state.pending <= 0;
    btnS.disabled = state.pending <= 0;
  }

  /* ============================================================
     REEL BUILD + POSITION
     ============================================================ */
  function buildReel(){
    const strip = document.getElementById('reel-strip');
    strip.innerHTML = RANKS.map(r =>
      '<div class="reel-item"><img src="' + r.img + '" alt="" draggable="false"></div>'
    ).join('');
  }

  function setReelPosition(continuousIdx, animate){
    const strip = document.getElementById('reel-strip');
    const clamped = Math.max(0, Math.min(RANKS.length - 1, continuousIdx));
    if(!animate) strip.classList.add('dragging');
    else         strip.classList.remove('dragging');
    strip.style.transform = 'translateY(' + (-clamped * ITEM_H) + 'px)';
  }

  /* ============================================================
     ARC (stroke-dashoffset reveal, grows bottom-up)
     Path starts at TOP (M 8 8) → BOTTOM (8 162).
     Wait — we want fill to grow from bottom as rank rises.
     So we reveal from END of path. Use negative dashoffset trick:
     stroke-dasharray = len ; stroke-dashoffset = len - fraction*len
     To grow from bottom, reverse the direction by swapping stroke-dashoffset sign.
     Simplest: draw from bottom. Path: M 8 162 Q 36 85 8 8.
     ============================================================ */
  let ARC_LEN = 0;

  function initArc(){
    const base = document.querySelector('.arc-base');
    const fill = document.getElementById('arc-fill');
    /* redraw paths from bottom to top so fill grows upward */
    const dFromBottom = 'M 8 162 Q 36 85 8 8';
    base.setAttribute('d', dFromBottom);
    fill.setAttribute('d', dFromBottom);
    ARC_LEN = fill.getTotalLength();
    fill.style.strokeDasharray = ARC_LEN;
    fill.style.strokeDashoffset = ARC_LEN;
  }

  function setArcFraction(fraction, animate){
    const fill = document.getElementById('arc-fill');
    if(!animate) fill.classList.add('dragging');
    else         fill.classList.remove('dragging');
    fill.style.strokeDashoffset = ARC_LEN * (1 - fraction);
  }

  /* ============================================================
     WHEEL STATE APPLY
     ============================================================ */
  function applyWheelIndex(idx, animate){
    idx = Math.max(0, Math.min(RANKS.length - 1, idx));
    state.wheelIdx = idx;

    const r = RANKS[idx];
    document.getElementById('wn').textContent = 'Rank ' + r.rank;
    document.getElementById('wp').textContent = r.pct.toFixed(1) + '%';

    setReelPosition(idx, animate);
    setArcFraction((idx + 1) / RANKS.length, animate);
  }

  /* ============================================================
     DRAG INTERACTION
     ============================================================ */
  (function initWheel(){
    const wheel = document.getElementById('wheel');
    let dragging = false;
    let startY = 0;
    let startIdx = 0;
    let lastApplied = 0;

    wheel.addEventListener('pointerdown', function(e){
      dragging = true;
      startY = e.clientY;
      startIdx = state.wheelIdx;
      lastApplied = startIdx;
      try { wheel.setPointerCapture(e.pointerId); } catch(_) {}
    });

    wheel.addEventListener('pointermove', function(e){
      if(!dragging) return;
      const dy = startY - e.clientY;              /* drag up = positive */
      const delta = dy / 60;                       /* pixels per rank step */
      let target = startIdx + delta;
      target = Math.max(0, Math.min(RANKS.length - 1, target));

      /* live update — no animation classes, just raw position */
      const r = RANKS[Math.round(target)];
      document.getElementById('wn').textContent = 'Rank ' + r.rank;
      document.getElementById('wp').textContent = r.pct.toFixed(1) + '%';

      setReelPosition(target, false);
      setArcFraction((target + 1) / RANKS.length, false);

      lastApplied = target;
    });

    function snap(e){
      if(!dragging) return;
      dragging = false;
      try { wheel.releasePointerCapture(e.pointerId); } catch(_) {}
      const snapped = Math.round(lastApplied);
      applyWheelIndex(snapped, true);
    }
    wheel.addEventListener('pointerup', snap);
    wheel.addEventListener('pointercancel', snap);
    wheel.addEventListener('pointerleave', snap);

    wheel.addEventListener('wheel', function(e){
      e.preventDefault();
      const dir = e.deltaY > 0 ? 1 : -1;
      const target = Math.max(0, Math.min(RANKS.length - 1, state.wheelIdx + dir));
      if(target !== state.wheelIdx) applyWheelIndex(target, true);
    }, { passive: false });
  })();

  /* ============================================================
     CLAIM / STAKE / TOAST
     ============================================================ */
  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  document.getElementById('btn-claim').addEventListener('click', function(){
    if(state.pending <= 0) return;
    const amt = state.pending;
    state.pending = 0;
    haptic('heavy');
    renderClaim();
    showToast('Claimed ' + fmt(amt) + ' ◆');
  });

  document.getElementById('btn-stake').addEventListener('click', function(){
    document.getElementById('stake-row').classList.toggle('open');
  });

  document.querySelectorAll('#stake-row button').forEach(function(b){
    b.addEventListener('click', function(){
      if(state.pending <= 0) return;
      const days = parseInt(b.dataset.days, 10);
      const mult = days === 2 ? 1.25 : days === 4 ? 1.5 : 2;
      const amt = state.pending;
      state.pending = 0;
      haptic('heavy');
      document.getElementById('stake-row').classList.remove('open');
      renderClaim();
      showToast('Staked ' + fmt(amt) + ' ◆ · ' + days + 'd · +' + Math.round((mult - 1) * 100) + '%');
    });
  });

  /* ============================================================
     DEMO CONTROLS
     ============================================================ */
  const range = document.getElementById('demo-range');
  const rangeVal = document.getElementById('demo-val');

  function setWagered(v){
    v = Math.max(0, parseInt(v, 10) || 0);
    rangeVal.textContent = fmt(v);
    state.wagered = v;
    const r = computeRank(v);
    state.rank = r.rank;
    state.pct = r.pct;
    renderProfile();
    renderClaim();
  }

  range.addEventListener('input', function(){ setWagered(range.value); });

  document.querySelectorAll('.demo-btns button[data-w]').forEach(function(b){
    b.addEventListener('click', function(){
      const v = parseInt(b.dataset.w, 10);
      range.value = v;
      setWagered(v);
    });
  });

  document.querySelectorAll('.demo-btns button[data-earn]').forEach(function(b){
    b.addEventListener('click', function(){
      const amt = parseInt(b.dataset.earn, 10);
      state.pending += amt;
      haptic('light');
      renderClaim();
      showToast('+' + fmt(amt) + ' ◆ cashback');
    });
  });

  /* ============================================================
     BOOT
     ============================================================ */
  buildReel();
  initArc();
  applyWheelIndex(0, false);
  setWagered(0);
  state.pending = 320;
  renderClaim();

})();
</script>

</body>
</html>
