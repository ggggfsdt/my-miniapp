<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>dllump · ice arena</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{
    --bg:#07080d;
    --panel:rgba(255,255,255,.05);
    --panel2:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.09);
    --border2:rgba(255,255,255,.16);
    --text:#f2f5fa;
    --text2:#8a94a8;
    --text3:#4e5668;
    --blue:#5b9dff;
    --blue2:#4a86e8;
    --gold:#f0d080;
    --green:#4ade80;
    --red:#ff6b7f;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  html,body{
    height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;
  }
  body{position:fixed;inset:0;width:100%}

  #app{
    display:flex;flex-direction:column;height:100%;max-width:440px;margin:0 auto;
    position:relative;overflow:hidden;isolation:isolate;
    background:radial-gradient(ellipse at 50% -10%, #16203a 0%, #0a0e18 45%, #06070c 100%);
  }
  #app::after{
    content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 30% 20%, rgba(0,0,0,.22), rgba(0,0,0,.72) 74%);
  }
  #app > *{position:relative;z-index:1}

  #top{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + var(--safe-t)) 14px 8px;flex-shrink:0;
    gap:8px;
  }
  #brand{
    font-size:13px;font-weight:900;letter-spacing:2.8px;text-transform:uppercase;
    color:var(--text);text-shadow:0 1px 6px rgba(0,0,0,.6);
    flex-shrink:0;
  }
  #brand span{color:var(--blue);text-shadow:0 0 14px rgba(91,157,255,.6)}
  #topRight{display:flex;align-items:center;gap:8px;flex-shrink:0}

  .circle-btn{
    width:34px;height:34px;border-radius:50%;
    border:.5px solid var(--border);
    background:var(--panel2);
    color:var(--text2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;
    transition:transform .18s var(--spring),background .22s ease,color .22s ease,
               box-shadow .3s ease,border-color .22s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .circle-btn svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
  .circle-btn:active{transform:scale(.9)}

  #cheatBtn.on{
    color:#0a0a0a;
    background:linear-gradient(135deg,#f6dd9a,#d4b46a);
    border-color:rgba(240,208,128,.65);
    box-shadow:0 0 22px rgba(240,208,128,.55),
               inset 0 1px 0 rgba(255,255,255,.55);
  }
  #cheatBtn.on svg{transform:scale(1.12) rotate(-6deg)}

  #settingsBtn.open{
    color:#fff;
    background:rgba(91,157,255,.20);
    border-color:rgba(140,180,255,.5);
    box-shadow:0 0 18px rgba(91,157,255,.35),
               inset 0 1px 0 rgba(255,255,255,.15);
  }
  #settingsBtn.open svg{transform:rotate(35deg)}

  #balChip{
    display:flex;align-items:center;gap:7px;
    background:var(--panel2);border:.5px solid var(--border);
    padding:6px 13px 6px 7px;border-radius:99px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 18px rgba(0,0,0,.4);
  }
  #balChip img{width:20px;height:20px;display:block;object-fit:contain;
    animation:glowD 2.8s ease-in-out infinite}
  @keyframes glowD{0%,100%{filter:drop-shadow(0 0 5px rgba(200,168,78,.35))}
                   50%{filter:drop-shadow(0 0 18px rgba(200,168,78,.75)) brightness(1.15)}}
  #balOut{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px}

  #settingsPanel{
    position:absolute;
    top:calc(54px + var(--safe-t));
    right:14px;
    width:236px;
    max-height: 70vh;
    overflow-y: auto;
    background:linear-gradient(180deg, rgba(28,32,44,.97), rgba(14,16,22,.98));
    border:1px solid rgba(255,255,255,.10);
    border-radius:16px;
    padding:8px;
    z-index:60;
    box-shadow:0 24px 60px rgba(0,0,0,.75),
               inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px) scale(.94);
    transform-origin:top right;
    transition:opacity .18s ease, visibility 0s .22s,
               transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  #settingsPanel.open{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
    transition:opacity .18s ease, visibility 0s,
               transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .settings-title{
    font-size:9.5px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--text3);
    padding:5px 10px 8px;
    display:flex;align-items:center;gap:8px;
  }
  .settings-title::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,.10),transparent);
  }
  .setting-row{
    display:flex;align-items:center;gap:10px;
    width:100%;
    padding:9px 10px;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.1px;
    cursor:pointer;
    border-radius:10px;
    transition:background .18s ease;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .setting-row:hover{background:rgba(255,255,255,.04)}
  .setting-row:active{background:rgba(255,255,255,.07)}
  .setting-label{
    flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .switch-sm{
    width:34px;height:20px;border-radius:999px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.12);
    position:relative;flex-shrink:0;
    transition:background .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .switch-sm .knob{
    position:absolute;top:2px;left:2px;
    width:14px;height:14px;border-radius:50%;
    background:linear-gradient(180deg,#fff,#c8d2e2);
    box-shadow:0 2px 6px rgba(0,0,0,.45);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .setting-row.active .switch-sm{
    background:linear-gradient(135deg,#6da9ff,#4a86e8);
    border-color:rgba(140,180,255,.55);
    box-shadow:0 0 12px rgba(91,157,255,.35);
  }
  .setting-row.active .switch-sm .knob{
    transform:translateX(14px);
  }
  .setting-row.active{color:#fff}

  #stage{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    padding:8px;min-height:0;
  }
  #cv{display:block;border-radius:26px;touch-action:none}

  #banner{
    position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;
    transform:translate(-50%,-50%) scale(.6);opacity:0;
    font-size:36px;font-weight:900;letter-spacing:-1.2px;
    text-shadow:0 4px 24px rgba(0,0,0,.85);
    transition:transform .45s var(--spring),opacity .3s ease;
    white-space:nowrap;
  }
  #banner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  #banner.win{color:#bfe0ff;text-shadow:0 0 36px rgba(91,157,255,.95),0 4px 24px rgba(0,0,0,.9)}
  #banner.lose{color:#ff9aa8;text-shadow:0 0 32px rgba(224,85,107,.8),0 4px 24px rgba(0,0,0,.9)}

  #panel{
    flex-shrink:0;
    padding:24px 16px calc(16px + var(--safe-b));
    display:flex;flex-direction:column;
    position:relative;
    transition:padding .35s cubic-bezier(.4,0,.2,1);
    will-change:padding;
  }
  #panel.hidden{
    padding-top:24px;
    padding-bottom:6px;
  }
  #panel::before{
    content:'';position:absolute;left:0;right:0;top:0;height:14px;
    background:linear-gradient(180deg,rgba(6,7,12,.75),transparent);
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #panel.hidden::before{opacity:0}

  #panelToggle{
    position:absolute;
    top:0;left:50%;
    transform:translateX(-50%);
    width:64px;height:20px;
    border:none;
    border-radius:0 0 12px 12px;
    background:linear-gradient(180deg, rgba(28,32,44,.9), rgba(14,16,22,.96));
    color:var(--text3);
    cursor:pointer;
    z-index:5;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    transition:color .2s ease, background .2s ease, box-shadow .25s ease;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  #panelToggle:active{
    color:var(--text);
    background:linear-gradient(180deg, rgba(40,46,60,.96), rgba(20,24,32,.98));
  }
  #panelToggle svg{
    width:14px;height:14px;
    stroke:currentColor;fill:none;
    stroke-width:2.5;
    stroke-linecap:round;stroke-linejoin:round;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  #panel.hidden #panelToggle svg{
    transform:rotate(180deg);
  }
  #panelContent{
    display:flex;flex-direction:column;gap:10px;
    max-height: 900px;
    opacity: 1;
    overflow: hidden;
    transition:max-height .35s cubic-bezier(.4,0,.2,1),
               opacity .25s ease .05s;
  }
  #panel.hidden #panelContent{
    max-height: 0;
    opacity: 0;
    pointer-events: none;
    transition:max-height .35s cubic-bezier(.4,0,.2,1),
               opacity .15s ease;
  }

  .row-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .stat{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:.5px solid var(--border);
    border-radius:15px;
    padding:9px 8px 8px;text-align:center;position:relative;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
  }
  .stat::before{
    content:'';position:absolute;top:0;left:24%;right:24%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  }
  .stat .lbl{
    display:block;font-size:8.5px;font-weight:800;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--text3);margin-bottom:4px;
  }
  .stat .val{
    display:block;font-size:17px;font-weight:800;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;color:var(--text);
  }
  .stat .val.gold{color:var(--gold);text-shadow:0 0 18px rgba(240,208,128,.4)}
  .stat .val.accent{transition:color .2s ease, text-shadow .2s ease}

  .slider-box{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:.5px solid var(--border);
    border-radius:17px;
    padding:11px 16px 7px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
    transition:opacity .25s ease;
  }
  .slider-box.locked{opacity:.4;pointer-events:none}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:34px;
    background:transparent;cursor:pointer;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:10px;border-radius:99px;border:none;
    background:var(--track, rgba(255,255,255,.08));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:48px;height:24px;
    border-radius:14px;
    margin-top:-7px;
    border:none;
    background:linear-gradient(180deg,#ffffff 0%,#dbe4f0 45%,#b8c4d4 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.65),
               0 0 0 3px var(--thumb-glow, rgba(91,157,255,.18)),
               inset 0 1px 0 rgba(255,255,255,.95),
               inset 0 -1px 0 rgba(0,0,0,.12);
    transition:transform .15s var(--spring), box-shadow .3s ease;
    position:relative;
  }
  input[type=range]::-webkit-slider-thumb::after{
    content:'';
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:24px;height:3px;border-radius:2px;
    background:rgba(120,140,170,.35);
  }
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.06)}
  input[type=range]::-moz-range-track{
    height:10px;border-radius:99px;border:none;
    background:var(--track, rgba(255,255,255,.08));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45);
  }
  input[type=range]::-moz-range-thumb{
    width:46px;height:22px;border-radius:12px;border:none;
    background:linear-gradient(180deg,#ffffff 0%,#dbe4f0 45%,#b8c4d4 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.65),
               0 0 0 3px var(--thumb-glow, rgba(91,157,255,.18));
  }
  .slider-labels{
    display:flex;justify-content:space-between;
    font-size:8.5px;font-weight:800;letter-spacing:1.4px;color:var(--text3);
    margin-top:-2px;padding:0 2px;
  }

  .speed-row{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
    transition:opacity .25s ease;
  }
  .speed-row.locked{opacity:.4;pointer-events:none}
  .speed-pill{
    padding:9px 0;
    border-radius:14px;
    border:.5px solid var(--border);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    color:var(--text3);
    font-family:inherit;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.6px;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .16s var(--spring),color .22s ease,background .25s ease,
               border-color .22s ease,box-shadow .25s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 8px rgba(0,0,0,.2);
    position:relative;
    overflow:hidden;
  }
  .speed-pill:active{transform:scale(.95)}
  .speed-pill.active{
    color:#fff;
    border-color:rgba(140,180,255,.5);
    background:linear-gradient(180deg,rgba(91,157,255,.20),rgba(91,157,255,.06));
    box-shadow:0 0 16px rgba(91,157,255,.22),
               inset 0 1px 0 rgba(255,255,255,.15);
    text-shadow:0 0 12px rgba(140,180,255,.55);
  }
  .speed-pill.active::before{
    content:'';position:absolute;top:0;left:24%;right:24%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  }

  .bet-box{display:flex;gap:7px;align-items:stretch}
  .bet-field{
    flex:1;display:flex;align-items:center;gap:9px;padding:0 14px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:.5px solid var(--border);border-radius:15px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
    transition:border-color .2s ease,opacity .25s ease,box-shadow .25s ease;
  }
  .bet-field:focus-within{
    border-color:rgba(140,180,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),
               0 0 0 3px rgba(91,157,255,.12),
               0 4px 12px rgba(0,0,0,.25);
  }
  .bet-field.locked{opacity:.4;pointer-events:none}
  .bet-field img{width:19px;height:19px;object-fit:contain;flex-shrink:0;opacity:.95}
  .bet-field input{
    flex:1;min-width:0;height:46px;border:none;background:transparent;outline:none;
    color:var(--text);font-family:inherit;font-size:17px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.3px;
    -webkit-user-select:text;user-select:text;
  }
  .mini{
    width:48px;border-radius:15px;border:.5px solid var(--border);
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    color:var(--text2);
    font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.4px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .16s var(--spring),background .2s ease,color .2s ease,opacity .25s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
  }
  .mini:active{transform:scale(.93);background:rgba(255,255,255,.11);color:var(--text)}
  .mini.locked{opacity:.4;pointer-events:none}

  #playBtn{
    width:100%;height:58px;border-radius:19px;border:none;cursor:pointer;
    font-family:inherit;font-size:15.5px;font-weight:900;letter-spacing:2.2px;
    text-transform:uppercase;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#6da9ff 0%,#4a86e8 100%);
    box-shadow:0 12px 32px rgba(91,157,255,.42),
               inset 0 1px 0 rgba(255,255,255,.30);
    transition:transform .18s var(--spring),box-shadow .3s ease,opacity .25s ease,filter .25s ease;
  }
  #playBtn:active{transform:scale(.975)}
  #playBtn:disabled{opacity:.42;pointer-events:none;filter:grayscale(.4)}
  #playBtn::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.30) 50%,transparent 65%);
    background-size:280% 100%;animation:btnShine 3.4s ease-in-out infinite;
  }
  @keyframes btnShine{0%,100%{background-position:170% 0}50%{background-position:-70% 0}}

  @media (max-height:680px){
    .stat .val{font-size:15px}
    #playBtn{height:52px;font-size:14px}
    .bet-field input{height:42px;font-size:16px}
    #panelContent{gap:8px}
    #panel{padding-top:22px}
    .speed-pill{padding:7px 0;font-size:9.5px}
  }
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div id="brand">dllump <span>ice</span></div>
    <div id="topRight">
      <button id="cheatBtn" class="circle-btn" type="button" aria-label="Cheat mode">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
      <button id="settingsBtn" class="circle-btn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div id="balChip">
        <img src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="">
        <span id="balOut">1000</span>
      </div>
    </div>
  </div>

  <div id="settingsPanel" aria-hidden="true">
    <div class="settings-title">Settings</div>
    <button class="setting-row" data-key="bounce" type="button">
      <span class="setting-label">Bounce physics</span>
      <span class="switch-sm"><span class="knob"></span></span>
    </button>
    <button class="setting-row" data-key="zoom" type="button">
      <span class="setting-label">Zoom on stop</span>
      <span class="switch-sm"><span class="knob"></span></span>
    </button>
    <button class="setting-row" data-key="pop" type="button">
      <span class="setting-label">Stop pop</span>
      <span class="switch-sm"><span class="knob"></span></span>
    </button>
    <button class="setting-row" data-key="outline" type="button">
      <span class="setting-label">Field outlines</span>
      <span class="switch-sm"><span class="knob"></span></span>
    </button>
    <button class="setting-row" data-key="arrow" type="button">
      <span class="setting-label">Spin arrow</span>
      <span class="switch-sm"><span class="knob"></span></span>
    </button>
    <button class="setting-row" data-key="glow" type="button">
      <span class="setting-label">Glow &amp; shadows</span>
      <span class="switch-sm"><span class="knob"></span></span>
    </button>
    <button class="setting-row" data-key="bgGifs" type="button">
      <span class="setting-label">Background GIFs</span>

<script>
(function(){
'use strict';

/* ==========================================================================
   CONFIG
   ========================================================================== */
const S          = 400;
const R          = 24;
const PUCK_R     = 24;
const HOUSE      = 0.03;
const MIN_CHANCE = 0.05;
const MAX_CHANCE = 95;

const EMPTY_GIF_URL = 'https://i.postimg.cc/DfYMRbty/ezgif-3ae2db2f22c213a2.gif';
const EMPTY_GIF = new Image();
EMPTY_GIF.src = EMPTY_GIF_URL;

const BG_WIN_GIF_URL  = 'https://i.postimg.cc/BQNRcBgH/ezgif-3cacf477150edf7a.gif';
const BG_LOSE_GIF_URL = 'https://i.postimg.cc/d3jpf2cX/ezgif-33e4bfba5fa5f0a3.gif';
const BG_WIN_GIF  = new Image();
const BG_LOSE_GIF = new Image();
BG_WIN_GIF.src  = BG_WIN_GIF_URL;
BG_LOSE_GIF.src = BG_LOSE_GIF_URL;

/* ==========================================================================
   SETTINGS
   ========================================================================== */
const DEFAULT_SETTINGS = {
  bounce:  false,
  zoom:    true,
  pop:     true,
  outline: true,
  arrow:   true,
  glow:    true,
  bgGifs:  false,
};
const settings = Object.assign({}, DEFAULT_SETTINGS);
try {
  const raw = localStorage.getItem('dllump_ice_settings');
  if (raw) Object.assign(settings, JSON.parse(raw));
} catch (_) {}

function saveSettings(){
  try { localStorage.setItem('dllump_ice_settings', JSON.stringify(settings)); } catch(_) {}
}

function setGlow(c, blur, color){
  if (settings.glow){ c.shadowBlur = blur; c.shadowColor = color; }
  else { c.shadowBlur = 0; c.shadowColor = 'transparent'; }
}

/* ==========================================================================
   RINK PERIMETER
   ========================================================================== */
function buildPerimeter(size, r, N){
  const segs = [];
  segs.push({t:'l', a:{x:r,y:0},           b:{x:size-r,y:0}});
  segs.push({t:'a', c:{x:size-r,y:r},      a0:-Math.PI/2, a1:0});
  segs.push({t:'l', a:{x:size,y:r},        b:{x:size,y:size-r}});
  segs.push({t:'a', c:{x:size-r,y:size-r}, a0:0, a1:Math.PI/2});
  segs.push({t:'l', a:{x:size-r,y:size},   b:{x:r,y:size}});
  segs.push({t:'a', c:{x:r,y:size-r},      a0:Math.PI/2, a1:Math.PI});
  segs.push({t:'l', a:{x:0,y:size-r},      b:{x:0,y:r}});
  segs.push({t:'a', c:{x:r,y:r},           a0:Math.PI, a1:3*Math.PI/2});

  const lens = segs.map(s => s.t==='l'
    ? Math.hypot(s.b.x-s.a.x, s.b.y-s.a.y)
    : Math.abs(s.a1-s.a0)*r);
  const total = lens.reduce((a,b)=>a+b,0);

  const pts = [];
  const step = total / N;
  let si = 0, acc = 0;
  for (let i = 0; i < N; i++){
    const target = i * step;
    while (si < segs.length - 1 && acc + lens[si] < target){ acc += lens[si]; si++; }
    const lt = Math.min(1, Math.max(0, (target - acc) / lens[si]));
    const s = segs[si];
    let px, py;
    if (s.t === 'l'){
      px = s.a.x + (s.b.x - s.a.x) * lt;
      py = s.a.y + (s.b.y - s.a.y) * lt;
    } else {
      const ang = s.a0 + (s.a1 - s.a0) * lt;
      px = s.c.x + r * Math.cos(ang);
      py = s.c.y + r * Math.sin(ang);
    }
    pts.push({x:px, y:py});
  }
  return pts;
}

const PERIM = buildPerimeter(S, R, 240);
const N_PERIM = PERIM.length;

const RINK_PATH = (function(){
  const p = new Path2D();
  p.moveTo(PERIM[0].x, PERIM[0].y);
  for (let i = 1; i < PERIM.length; i++) p.lineTo(PERIM[i].x, PERIM[i].y);
  p.closePath();
  return p;
})();

const INNER_PATH = (function(){
  const p = new Path2D();
  const c = S/2;
  const k = 0.965;
  PERIM.forEach((v, i) => {
    const x = c + (v.x - c) * k;
    const y = c + (v.y - c) * k;
    if (i === 0) p.moveTo(x, y);
    else p.lineTo(x, y);
  });
  p.closePath();
  return p;
})();

/* ==========================================================================
   BOUNCE PHYSICS
   ========================================================================== */
const BOUNCE_OMEGA   = 18;
const BOUNCE_TAU     = 5.5;
const BOUNCE_SIGMA   = 0.20;
const BOUNCE_MAX_T   = 0.9;

const jiggleDisp = new Float32Array(N_PERIM);
const jiggles = [];
const PERIM_RADIAL = new Float32Array(N_PERIM * 2);

(function precomputeRadial(){
  const cx = S/2, cy = S/2;
  for (let i = 0; i < N_PERIM; i++){
    const p = PERIM[i];
    const dx = p.x - cx, dy = p.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    PERIM_RADIAL[i*2]   = dx / len;
    PERIM_RADIAL[i*2+1] = dy / len;
  }
})();

function spawnJiggle(idx, intensity){
  if (!settings.bounce) return;
  if (idx < 0 || idx >= N_PERIM) return;
  if (jiggles.length >= 10) jiggles.shift();

  const dists = new Float32Array(N_PERIM);
  for (let i = 0; i < N_PERIM; i++){
    let d = Math.abs(i - idx);
    d = Math.min(d, N_PERIM - d);
    dists[i] = d;
  }
  jiggles.push({
    dists,
    intensity,
    startTime: performance.now() / 1000,
  });
}

function updateJiggles(nowSec){
  if (!settings.bounce) return;
  if (jiggles.length === 0){
    let any = false;
    for (let i = 0; i < N_PERIM; i++){ if (jiggleDisp[i] !== 0){ any = true; break; } }
    if (!any) return;
  }

  jiggleDisp.fill(0);

  for (let k = jiggles.length - 1; k >= 0; k--){
    const j = jiggles[k];
    const t = nowSec - j.startTime;
    if (t > BOUNCE_MAX_T){ jiggles.splice(k, 1); continue; }

    const amp   = j.intensity * Math.exp(-t * BOUNCE_TAU);
    const wave  = Math.cos(t * BOUNCE_OMEGA);
    const dists = j.dists;

    for (let i = 0; i < N_PERIM; i++){
      const sf = Math.exp(-dists[i] * BOUNCE_SIGMA);
      if (sf < 0.02) continue;
      jiggleDisp[i] += amp * wave * sf;
    }
  }
}

function findNearestPerimIdx(x, y){
  let bestIdx = 0, bestD = Infinity;
  for (let i = 0; i < N_PERIM; i++){
    const p = PERIM[i];
    const dx = p.x - x, dy = p.y - y;
    const d = dx*dx + dy*dy;
    if (d < bestD){ bestD = d; bestIdx = i; }
  }
  return bestIdx;
}

function buildJigglePath(scaleFactor){
  const cx = S/2, cy = S/2;
  const path = new Path2D();
  for (let i = 0; i < N_PERIM; i++){
    const p = PERIM[i];
    const nx = PERIM_RADIAL[i*2];
    const ny = PERIM_RADIAL[i*2+1];
    const disp = jiggleDisp[i];
    const x = cx + (p.x + nx * disp - cx) * scaleFactor;
    const y = cy + (p.y + ny * disp - cy) * scaleFactor;
    if (i === 0) path.moveTo(x, y);
    else path.lineTo(x, y);
  }
  path.closePath();
  return path;
}

/* ==========================================================================
   POLY MATH
   ========================================================================== */
function polyArea(p){
  if (!p || p.length < 3) return 0;
  let a = 0;
  for (let i = 0; i < p.length; i++){
    const q = p[i], r = p[(i+1) % p.length];
    a += q.x * r.y - r.x * q.y;
  }
  return Math.abs(a) * 0.5;
}

function bboxOf(poly){
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  for (const v of poly){
    if (v.x < x0) x0 = v.x;
    if (v.y < y0) y0 = v.y;
    if (v.x > x1) x1 = v.x;
    if (v.y > y1) y1 = v.y;
  }
  return {x0, y0, x1, y1};
}

function centroidOf(poly){
  let cx = 0, cy = 0;
  for (const v of poly){ cx += v.x; cy += v.y; }
  return { x: cx / poly.length, y: cy / poly.length };
}

function pointInPoly(px, py, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function distToEdges(px, py, poly){
  let min = Infinity;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const ax = poly[j].x, ay = poly[j].y;
    const bx = poly[i].x, by = poly[i].y;
    const dx = bx - ax, dy = by - ay;
    const l2 = dx*dx + dy*dy;
    let t = l2 > 0 ? ((px-ax)*dx + (py-ay)*dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
    if (d < min) min = d;
  }
  return min;
}

function computeLabelCenter(poly){
  if (!poly || poly.length < 3) return { x: S/2, y: S/2 };

  const bb = bboxOf(poly);
  const bcx = (bb.x0 + bb.x1) / 2;
  const bcy = (bb.y0 + bb.y1) / 2;
  if (pointInPoly(bcx, bcy, poly)) return { x: bcx, y: bcy };

  const c = centroidOf(poly);
  if (pointInPoly(c.x, c.y, poly)) return c;
  return { x: bcx, y: bcy };
}

function polyToPath(poly){
  const p = new Path2D();
  if (!poly || poly.length < 3) return p;
  p.moveTo(poly[0].x, poly[0].y);
  for (let i = 1; i < poly.length; i++) p.lineTo(poly[i].x, poly[i].y);
  p.closePath();
  return p;
}

function rgbToHex(r, g, b){
  return '#' + [r,g,b].map(v => {
    const s = Math.max(0, Math.min(255, Math.round(v))).toString(16);
    return s.length === 1 ? '0' + s : s;
  }).join('');
}

function hslToRgb(h, s, l){
  h = ((h % 360) + 360) % 360;
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [ (r+m)*255, (g+m)*255, (b+m)*255 ];
}

function lighten(hex, amt){
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt);
  g = Math.min(255, g + amt);
  b = Math.min(255, b + amt);
  return rgbToHex(r, g, b);
}

function chanceToHue(chance){
  const c = Math.max(0, Math.min(1, chance));
  if (c <= 0.5) return (c / 0.5) * 35;
  return 35 + ((c - 0.5) / 0.5) * 95;
}
function chanceToHex(chance){
  const hue = chanceToHue(chance);
  const [r,g,b] = hslToRgb(hue, 62, 52);
  return rgbToHex(r, g, b);
}

function findBboxCorners(poly){
  let tl=null, tr=null, bl=null, br=null;
  let tlS=Infinity, trS=-Infinity, blS=Infinity, brS=-Infinity;
  for (const v of poly){
    const a = v.x + v.y;
    const b = v.x - v.y;
    if (a < tlS){ tlS = a; tl = v; }
    if (a > brS){ brS = a; br = v; }
    if (b > trS){ trS = b; tr = v; }
    if (b < blS){ blS = b; bl = v; }
  }
  return [tl, tr, bl, br];
}

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t){
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}

/* ==========================================================================
   POLYGON SPLIT
   ========================================================================== */
function splitPolygon(poly, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const side = p => dx * (p.y - ay) - dy * (p.x - ax);
  const eps = 1e-7;
  const A = [];
  const B = [];
  const n = poly.length;
  for (let i = 0; i < n; i++){
    const a = poly[i];
    const b = poly[(i + 1) % n];
    const sa = side(a);
    const sb = side(b);
    if (sa >= -eps) A.push(a);
    if (sa <= eps)  B.push(a);
    if ((sa > eps && sb < -eps) || (sa < -eps && sb > eps)){
      const t = sa / (sa - sb);
      const ip = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      A.push(ip);
      B.push(ip);
    }
  }
  return [A, B];
}

function pickCut(poly, angle, targetRatio){
  const bb = bboxOf(poly);
  const cx = (bb.x0 + bb.x1) / 2;
  const cy = (bb.y0 + bb.y1) / 2;
  const range = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0);
  const dirX = Math.cos(angle), dirY = Math.sin(angle);
  const perpX = -dirY, perpY = dirX;
  const totalArea = polyArea(poly);
  const minArea = totalArea * Math.min(0.003, targetRatio * 0.4);

  let lo = -range * 1.2;
  let hi =  range * 1.2;
  let best = null, bestErr = Infinity;

  for (let i = 0; i < 30; i++){
    const mid = (lo + hi) / 2;
    const px = cx + perpX * mid;
    const py = cy + perpY * mid;
    const ax = px - dirX * range * 2;
    const ay = py - dirY * range * 2;
    const bx = px + dirX * range * 2;
    const by = py + dirY * range * 2;

    const pieces = splitPolygon(poly, ax, ay, bx, by);
    const A = pieces[0], B = pieces[1];

    if (A.length < 3 || B.length < 3){
      if (mid > 0) hi = mid; else lo = mid;
      continue;
    }
    const aA = polyArea(A), aB = polyArea(B);
    const tot = aA + aB;
    if (tot < 1e-6){
      if (mid > 0) hi = mid; else lo = mid;
      continue;
    }
    const ratio = aA / tot;
    const err = Math.abs(ratio - targetRatio);
    if (err < bestErr && aA >= minArea && aB >= minArea){
      bestErr = err;
      best = { win: A, lose: B };
    }

    if (ratio > targetRatio) lo = mid;
    else                     hi = mid;

    if (bestErr < 0.0005) break;
  }
  return best;
}

/* ==========================================================================
   STATE
   ========================================================================== */
const G = {
  balance: 1000,
  bet: 10,

  chance: 0.45,
  shown: 0.45,
  shownVel: 0,
  lastShown: -1,
  cutAngle: 0,

  winPoly: null,
  losePoly: null,
  winCenter: null,
  loseCenter: null,
  winBB: null,
  loseBB: null,

  winLabel: { x: S/2, y: S/4 },
  loseLabel: { x: S/2, y: S*0.75 },
  winFontPx: 24,

  state: 'idle',
  puck: { x: S/2, y: S/2 },
  puckScale: 0.55,
  puckAlpha: 0,

  path: null,

  spinStart: 0,
  spinDuration: 1.9,
  spinFinalAngle: 0,
  spinArrowAngle: 0,
  spinExtraTurns: 4,

  rollStart: 0,
  duration: 10,
  rollSegIdx: 0,
  lastJiggleIdx: -1,

  zoom: 1,
  zoomCenterX: S/2,
  zoomCenterY: S/2,
  zoomAtStop: 1,

  stopPopStart: 0,
  stopPopDuration: 0.7,

  outcome: false,
  rollMult: 2,
  rollBet: 10,

  bgGifWinOpacity: 0,
  bgGifLoseOpacity: 0,

  speedMode: 'normal',

  flashT: 0,
  bannerTimer: null,
  doneTimer: null
};

/* ==========================================================================
   CANVAS + RESIZE (debounced)
   ========================================================================== */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cssSize = 340, scale = 0.85, dpr = 1;

function resize(){
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const size = Math.max(160, Math.floor(Math.min(rect.width, rect.height)) - 16);
  cssSize = size;
  dpr = Math.min(window.devicePixelRatio || 1, 2);  // cap at 2 for perf
  cv.width  = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  cv.style.width  = size + 'px';
  cv.style.height = size + 'px';
  scale = size / S;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}

/* Debounced resize — only fires after the layout settles, and only when
   the game is idle. This is what fixes the "square glitches/disappears"
   problem during the panel transition. */
let pendingResizeTimer = null;
let lastResizeAttempt = 0;

function scheduleResize(delayMs){
  if (pendingResizeTimer) clearTimeout(pendingResizeTimer);
  pendingResizeTimer = setTimeout(attemptResize, delayMs || 200);
}

function attemptResize(){
  pendingResizeTimer = null;
  // Never resize mid-round — would cause the puck to jump.
  if (G.state !== 'idle'){
    pendingResizeTimer = setTimeout(attemptResize, 400);
    return;
  }
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const size = Math.max(160, Math.floor(Math.min(rect.width, rect.height)) - 16);
  // Skip no-op resizes.
  if (Math.abs(size - cssSize) < 4) return;
  lastResizeAttempt = performance.now();
  resize();
}

if (typeof ResizeObserver !== 'undefined'){
  const stageEl = document.getElementById('stage');
  const ro = new ResizeObserver(function(){
    // Debounce — collapses many events during the panel transition into one.
    scheduleResize(200);
  });
  ro.observe(stageEl);
}

window.addEventListener('resize', function(){ scheduleResize(180); });
window.addEventListener('orientationchange', function(){ scheduleResize(300); });

/* ==========================================================================
   MOTION PROFILE
   ========================================================================== */
const FAST_DURATION  = 2.4;
const SLOW_DURATION  = 6.5;
const TOTAL_DURATION = FAST_DURATION + SLOW_DURATION;
const FAST_FRAC      = 0.55;
const U1             = FAST_DURATION / TOTAL_DURATION;
const SLOW_EXP       = (FAST_FRAC / U1) * (1 - U1) / (1 - FAST_FRAC);

const SPEED_MULT = { slow: 1.5, normal: 1.0, fast: 0.5 };

const ZOOM_MAX           = 1.85;
const ZOOM_LEAD          = 1.5;
const ZOOM_IN_DURATION   = 0.9;
const ZOOM_OUT_DELAY     = 0.35;
const ZOOM_OUT_DURATION  = 1.0;

function distFrac(u){
  if (u <= U1) return (u / U1) * FAST_FRAC;
  const t = (u - U1) / (1 - U1);
  return FAST_FRAC + (1 - FAST_FRAC) * (1 - Math.pow(1 - t, SLOW_EXP));
}

/* ==========================================================================
   FIELD SPRING
   ========================================================================== */
const FIELD_OMEGA = 6.0;
const FIELD_ZETA  = 0.62;

function stepFieldSpring(dt){
  const diff = G.chance - G.shown;
  const accel = FIELD_OMEGA * FIELD_OMEGA * diff
              - 2 * FIELD_ZETA * FIELD_OMEGA * G.shownVel;
  G.shownVel += accel * dt;
  G.shown    += G.shownVel * dt;

  if (G.shown < 0.0002){ G.shown = 0.0002; if (G.shownVel < 0) G.shownVel = 0; }
  if (G.shown > 0.999){  G.shown = 0.999;  if (G.shownVel > 0) G.shownVel = 0; }

  if (Math.abs(diff) < 0.0003 && Math.abs(G.shownVel) < 0.0003){
    G.shown = G.chance;
    G.shownVel = 0;
  }
}

/* ==========================================================================
   FIELD RECOMPUTE
   ========================================================================== */
function randomizeAngle(){
  G.cutAngle = Math.random() * Math.PI * 2;
}

function recomputeField(){
  const target = Math.max(0.0003, Math.min(0.9997, G.shown));
  const cut = pickCut(PERIM, G.cutAngle, target);
  if (cut){
    G.winPoly    = cut.win;
    G.losePoly   = cut.lose;
    G.winBB      = bboxOf(G.winPoly);
    G.loseBB     = bboxOf(G.losePoly);
    G.winCenter  = computeLabelCenter(G.winPoly);
    G.loseCenter = computeLabelCenter(G.losePoly);
  }
  G.lastShown = G.shown;
}

/* ==========================================================================
   TARGET PICKING
   ========================================================================== */
function pickTargetPoint(poly){
  if (!poly || poly.length < 3) return { x: S/2, y: S/2 };

  const bb = bboxOf(poly);
  const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0;

  const margins = [
    Math.min(22, h * 0.34, w * 0.34),
    Math.min(15, h * 0.27, w * 0.27),
    Math.min(10, h * 0.21, w * 0.21),
    Math.min(6,  h * 0.15, w * 0.15),
    Math.min(3,  h * 0.10, w * 0.10),
    Math.min(1.2, h * 0.06, w * 0.06),
    0.4
  ];

  for (const m of margins){
    if (m <= 0) continue;
    for (let i = 0; i < 260; i++){
      const x = bb.x0 + Math.random() * w;
      const y = bb.y0 + Math.random() * h;
      if (pointInPoly(x, y, poly) && distToEdges(x, y, poly) >= m){
        return { x, y };
      }
    }
  }

  const c = centroidOf(poly);
  if (pointInPoly(c.x, c.y, poly)) return c;

  for (let i = 0; i < 4000; i++){
    const x = bb.x0 + Math.random() * w;
    const y = bb.y0 + Math.random() * h;
    if (pointInPoly(x, y, poly)) return { x, y };
  }
  const cx = poly.reduce((s,v)=>s+v.x, 0) / poly.length;
  const cy = poly.reduce((s,v)=>s+v.y, 0) / poly.length;
  return { x: cx, y: cy };
}

/* ==========================================================================
   BILLIARD UNFOLDING
   ========================================================================== */
function foldAxis(v){
  const m = ((v % (2*S)) + 2*S) % (2*S);
  return m <= S ? m : 2*S - m;
}

const TARGET_LEN = 5200;
const LEN_MIN    = 4800;
const LEN_MAX    = 5600;

function buildBilliardPath(start, target){
  let bestValid = null;
  let bestValidDelta = Infinity;

  for (let attempt = 0; attempt < 20000; attempt++){
    const ix = Math.floor(Math.random() * 60) - 30;
    const iy = Math.floor(Math.random() * 60) - 30;
    if (ix === 0 && iy === 0) continue;

    const sx = Math.random() < 0.5 ? -1 : 1;
    const sy = Math.random() < 0.5 ? -1 : 1;
    const U = { x: sx*target.x + 2*S*ix, y: sy*target.y + 2*S*iy };

    const dx = U.x - start.x;
    const dy = U.y - start.y;

    const straight = Math.hypot(dx, dy);
    if (straight < LEN_MIN || straight > LEN_MAX) continue;

    const cuts = [];
    if (Math.abs(dx) > 1e-6){
      const k0 = Math.ceil(Math.min(start.x, U.x) / S);
      const k1 = Math.floor(Math.max(start.x, U.x) / S);
      for (let k = k0; k <= k1; k++){
        const t = (k*S - start.x) / dx;
        if (t > 1e-4 && t < 1 - 1e-4) cuts.push({ t });
      }
    }
    if (Math.abs(dy) > 1e-6){
      const k0 = Math.ceil(Math.min(start.y, U.y) / S);
      const k1 = Math.floor(Math.max(start.y, U.y) / S);
      for (let k = k0; k <= k1; k++){
        const t = (k*S - start.y) / dy;
        if (t > 1e-4 && t < 1 - 1e-4) cuts.push({ t });
      }
    }

    cuts.sort((a,b) => a.t - b.t);

    let cornerHit = false;
    for (let i = 1; i < cuts.length; i++){
      if (Math.abs(cuts[i].t - cuts[i-1].t) < 1e-5){ cornerHit = true; break; }
    }
    if (cornerHit) continue;

    const pts = [{ x: start.x, y: start.y }];
    for (const c of cuts){
      const ux = start.x + dx * c.t;
      const uy = start.y + dy * c.t;
      pts.push({ x: foldAxis(ux), y: foldAxis(uy) });
    }
    pts.push({ x: target.x, y: target.y });

    let bad = false;
    for (let i = 1; i < pts.length - 1; i++){
      const p = pts[i];
      const nearX = (p.x < R + 8 || p.x > S - R - 8);
      const nearY = (p.y < R + 8 || p.y > S - R - 8);
      if (nearX && nearY){ bad = true; break; }
    }
    if (bad) continue;

    let minSeg = Infinity;
    for (let i = 1; i < pts.length; i++){
      const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
      if (d < minSeg) minSeg = d;
    }
    if (minSeg < 26) continue;

    const cum = [0];
    for (let i = 1; i < pts.length; i++){
      cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    }
    const total = cum[cum.length - 1];
    if (total < LEN_MIN) continue;

    const delta = Math.abs(total - TARGET_LEN);
    if (delta < bestValidDelta){
      bestValidDelta = delta;
      bestValid = { pts, cum, total };
    }

    if (bestValidDelta < 50) break;
  }

  if (bestValid) return bestValid;

  {
    const angle = Math.random() * Math.PI * 2;
    const d = LEN_MIN + Math.random() * (LEN_MAX - LEN_MIN) * 0.5;
    const uxIdeal = start.x + d * Math.cos(angle);
    const uyIdeal = start.y + d * Math.sin(angle);
    const sx = Math.random() < 0.5 ? -1 : 1;
    const sy = Math.random() < 0.5 ? -1 : 1;
    const ix = Math.round((uxIdeal - sx * target.x) / (2 * S));
    const iy = Math.round((uyIdeal - sy * target.y) / (2 * S));
    const U = { x: sx*target.x + 2*S*ix, y: sy*target.y + 2*S*iy };
    const dx = U.x - start.x;
    const dy = U.y - start.y;

    const cuts = [];
    if (Math.abs(dx) > 1e-6){
      const k0 = Math.ceil(Math.min(start.x, U.x) / S);
      const k1 = Math.floor(Math.max(start.x, U.x) / S);
      for (let k = k0; k <= k1; k++){
        const t = (k*S - start.x) / dx;
        if (t > 1e-4 && t < 1 - 1e-4) cuts.push({ t });
      }
    }
    if (Math.abs(dy) > 1e-6){
      const k0 = Math.ceil(Math.min(start.y, U.y) / S);
      const k1 = Math.floor(Math.max(start.y, U.y) / S);
      for (let k = k0; k <= k1; k++){
        const t = (k*S - start.y) / dy;
        if (t > 1e-4 && t < 1 - 1e-4) cuts.push({ t });
      }
    }

    cuts.sort((a,b) => a.t - b.t);

    const pts = [{ x: start.x, y: start.y }];
    for (const c of cuts){
      const ux = start.x + dx * c.t;
      const uy = start.y + dy * c.t;
      pts.push({ x: foldAxis(ux), y: foldAxis(uy) });
    }
    pts.push({ x: target.x, y: target.y });

    const cum = [0];
    for (let i = 1; i < pts.length; i++){
      cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    }
    return { pts, cum, total: cum[cum.length-1] };
  }
}

function pointAtPath(p, d){
  if (d <= 0) return { x: p.pts[0].x, y: p.pts[0].y };
  if (d >= p.total){
    const l = p.pts[p.pts.length-1];
    return { x: l.x, y: l.y };
  }
  let i = 0;
  while (i < p.cum.length - 2 && p.cum[i+1] < d) i++;
  const seg = p.cum[i+1] - p.cum[i];
  const t = seg > 0 ? (d - p.cum[i]) / seg : 0;
  const a = p.pts[i], b = p.pts[i+1];
  return { x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t };
}

function formatChance(percent){

function syncSliderFill(){

  const pct = ((v - min) / (max - min)) * 100;

  const hue = chanceToHue(G.shown);
  const [r,g,b] = hslToRgb(hue, 70, 55);
  const fill = 'rgb(' + r + ',' + g + ',' + b + ')';
  const fillLight = 'rgb(' + Math.min(255, r+30) + ',' + Math.min(255, g+30) + ',' + Math.min(255, b+30) + ')';

  slider.style.setProperty('--track',
    'linear-gradient(90deg,' + fill + ' 0%,' + fillLight + ' ' + pct.toFixed(1) + '%,' +
    'rgba(255,255,255,.075) ' + pct.toFixed(1) + '%,rgba(255,255,255,.075) 100%)');

  slider.style.setProperty('--thumb-glow',
    'rgba(' + r + ',' + g + ',' + b + ',.35)');

/* ==========================================================================
   BACKGROUND GIF LOGIC
   ========================================================================== */
function updateBgGifs(now, dt){
  let targetWin = false, targetLose = false;

  if (settings.bgGifs){
    const state = G.state;
    if (state === 'rolling' || state === 'done'){
      let show = false;
      if (state === 'rolling'){
        const elapsed = (now - G.rollStart) / 1000;
        const u = elapsed / G.duration;
        if (u > U1) show = true;
      } else if (state === 'done'){
        const age = (now - G.stopPopStart) / 1000;
        if (age < 2.4) show = true;
      }

      if (show && G.winPoly && G.losePoly){
        const px = G.puck.x, py = G.puck.y;
        const inWin  = pointInPoly(px, py, G.winPoly);
        const inLose = !inWin && pointInPoly(px, py, G.losePoly);
        if (inWin) targetWin = true;
        else if (inLose) targetLose = true;
      }
    }
  }

  const rateIn  = 1.8 * dt;
  const rateOut = 2.5 * dt;

  if (targetWin){
    G.bgGifWinOpacity = Math.min(1, G.bgGifWinOpacity + rateIn);
  } else {
    G.bgGifWinOpacity = Math.max(0, G.bgGifWinOpacity - rateOut);
  }
  if (targetLose){
    G.bgGifLoseOpacity = Math.min(1, G.bgGifLoseOpacity + rateIn);
  } else {
    G.bgGifLoseOpacity = Math.max(0, G.bgGifLoseOpacity - rateOut);
  }

  if (G.bgGifWinOpacity < 0.005)  G.bgGifWinOpacity = 0;
  if (G.bgGifLoseOpacity < 0.005) G.bgGifLoseOpacity = 0;
}

/* Draw a GIF centered at (cx, cy) at a small fixed fraction of arena size.
   The GIF animates natively because the browser keeps the frame advancing. */
function drawBgGif(c, img, opacity, cx, cy){
  if (!img || !img.complete || img.naturalWidth === 0) return;
  if (opacity < 0.01) return;

  c.save();
  c.globalAlpha = Math.min(1, opacity) * 0.55;

  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const targetSize = S * 0.22;   // 22% of arena — small & subtle
  const scaleFit = Math.min(targetSize / iw, targetSize / ih);
  const dw = iw * scaleFit;
  const dh = ih * scaleFit;

  c.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  c.restore();
}

/* ==========================================================================
   ROLL
   ========================================================================== */
function showBanner(text, win){
  banner.textContent = text;
  banner.className = 'show ' + (win ? 'win' : 'lose');
  clearTimeout(G.bannerTimer);
  G.bannerTimer = setTimeout(function(){
    banner.classList.remove('show');
  }, 1600);
}

function startRoll(){
  if (G.state !== 'idle') return;
  closeSettings();

  G.shown = G.chance;
  G.shownVel = 0;
  recomputeField();

  if (G.winCenter)  { G.winLabel.x = G.winCenter.x;  G.winLabel.y = G.winCenter.y;  }
  if (G.loseCenter) { G.loseLabel.x = G.loseCenter.x; G.loseLabel.y = G.loseCenter.y; }

  if (G.bet < 1){ G.bet = 10; betInput.value = 10; syncUI(); return; }
  if (G.bet > G.balance) return;
  if (!G.winPoly || !G.losePoly) return;

  G.outcome  = cheatOn ? true : (Math.random() < G.chance);
  G.rollMult = multiplierFor(G.chance);
  G.rollBet  = Math.min(G.bet, Math.floor(G.balance));

  G.balance -= G.rollBet;

  const region = G.outcome ? G.winPoly : G.losePoly;
  const target = pickTargetPoint(region);
  const path   = buildBilliardPath({ x: S/2, y: S/2 }, target);
  G.path       = path;

  G.duration = TOTAL_DURATION * (SPEED_MULT[G.speedMode] || 1);

  const dx = path.pts[1].x - path.pts[0].x;
  const dy = path.pts[1].y - path.pts[0].y;
  G.spinFinalAngle = Math.atan2(dy, dx);
  G.spinExtraTurns = 3 + Math.floor(Math.random() * 4);
  G.spinArrowAngle = G.spinFinalAngle - G.spinExtraTurns * 2 * Math.PI;
  G.spinStart      = performance.now();
  G.spinDuration   = 1.7 + Math.random() * 0.5;

  G.rollStart = 0;
  G.state     = 'spinning';
  G.puck.x    = S/2;
  G.puck.y    = S/2;
  G.puckScale = 0.55;
  G.puckAlpha = 1;
  G.stopPopStart = 0;

  jiggles.length = 0;
  jiggleDisp.fill(0);
  G.rollSegIdx = 0;
  G.lastJiggleIdx = -1;

  G.zoom = 1;
  G.zoomCenterX = S/2;
  G.zoomCenterY = S/2;
  G.zoomAtStop = 1;

  playBtn.disabled = true;
  banner.classList.remove('show');

  syncUI();
}

function finishRoll(){
  G.state = 'done';
  G.flashT = performance.now();
  G.stopPopStart = performance.now();
  G.zoomAtStop = G.zoom;

  if (G.outcome){
    const payout = Math.floor(G.rollBet * G.rollMult);
    G.balance += payout;
    showBanner('+' + payout.toLocaleString(), true);
  } else {
    showBanner('−' + G.rollBet.toLocaleString(), false);
  }

  syncUI();

  clearTimeout(G.doneTimer);
  G.doneTimer = setTimeout(function(){
    if (G.state !== 'done') return;
    G.state = 'idle';

    G.puck.x = S/2;
    G.puck.y = S/2;
    G.puckAlpha = 0;
    G.puckScale = 0.55;
    G.stopPopStart = 0;
    G.zoom = 1;
    G.zoomCenterX = S/2;
    G.zoomCenterY = S/2;

    playBtn.disabled = false;

    randomizeAngle();
    recomputeField();

    if (G.bet > G.balance){
      G.bet = Math.max(1, Math.floor(G.balance));
      betInput.value = G.bet;
    }
    syncUI();

    // If a resize was deferred while we were rolling, do it now.
    if (pendingResizeTimer){
      clearTimeout(pendingResizeTimer);
      pendingResizeTimer = null;
    }
    scheduleResize(150);
  }, 2400);
}

playBtn.addEventListener('click', startRoll);

/* ==========================================================================
   PUCK POP
   ========================================================================== */
function puckPopScale(t){
  if (t <= 0) return 1;
  if (t >= 1) return 1;
  if (t < 0.28){
    const k = t / 0.28;
    return 1 + 0.58 * (1 - Math.pow(1 - k, 2));
  }
  const k = (t - 0.28) / 0.72;
  const decay = Math.pow(1 - k, 2.1);
  return 1 + 0.58 * decay * Math.cos(k * Math.PI * 2.3);
}

/* ==========================================================================
   PUCK DRAW
   ========================================================================== */
const PUCK_OPTS = {
  rimRatio: 0.44, outerRatio: 0.32,
  rimAlpha: 0.95, outerAlpha: 0.20, innerGlow: 0.10,
  cross: true, crossAlpha: 0.28, crossWidth: 1.6
};

function drawPuck(c, x, y, r){
  if (r <= 0.5) return;
  const scl   = r / 36;
  const rim   = PUCK_OPTS.rimRatio   * r;
  const outer = PUCK_OPTS.outerRatio * r;

  c.save();
  c.beginPath();
  c.lineWidth = outer;
  c.strokeStyle = 'rgba(255,255,255,' + PUCK_OPTS.outerAlpha + ')';
  c.lineCap = 'round';
  c.arc(x, y, r + outer * 0.12, 0, Math.PI*2);
  c.stroke();
  c.restore();

  c.save();
  c.beginPath();
  c.lineWidth = rim;
  c.strokeStyle = 'rgba(255,255,255,' + PUCK_OPTS.rimAlpha + ')';
  c.lineCap = 'round';
  c.arc(x, y, r - rim/2, 0, Math.PI*2);
  c.stroke();
  c.restore();

  c.save();
  c.beginPath();
  c.lineWidth = Math.max(1, rim*0.36);
  c.strokeStyle = 'rgba(0,0,0,0.18)';
  c.lineCap = 'round';
  c.arc(x, y, r - rim*0.9, 0, Math.PI*2);
  c.stroke();
  c.restore();

  c.save();
  c.beginPath();
  c.lineWidth = Math.max(1, rim*0.12);
  c.strokeStyle = 'rgba(255,255,255,0.12)';
  c.lineCap = 'round';
  c.arc(x, y, r - rim*0.6, 0, Math.PI*2);
  c.stroke();
  c.restore();

  if (PUCK_OPTS.cross){
    const L = r * 1.9;
    c.save();
    c.lineWidth = PUCK_OPTS.crossWidth * (r/20);
    c.strokeStyle = 'rgba(255,255,255,' + PUCK_OPTS.crossAlpha + ')';
    c.beginPath();
    c.moveTo(x - L/2, y); c.lineTo(x + L/2, y);
    c.moveTo(x, y - L/2); c.lineTo(x, y + L/2);
    c.stroke();
    c.restore();
  }

  c.save();
  const g = c.createRadialGradient(x - r*0.18, y - r*0.18, 1, x, y, r*1.2);
  g.addColorStop(0,    'rgba(255,255,255,' + PUCK_OPTS.innerGlow + ')');
  g.addColorStop(0.35, 'rgba(255,255,255,' + (PUCK_OPTS.innerGlow*0.45) + ')');
  g.addColorStop(1,    'rgba(255,255,255,0)');
  c.fillStyle = g;
  c.beginPath();
  c.arc(x, y, r - rim*0.6, 0, Math.PI*2);
  c.fill();
  c.restore();

  const ca = [-2.35, -0.8, 2.35, 0.8];
  c.save();
  for (let i = 0; i < ca.length; i++){
    const a = ca[i];
    const px = x + Math.cos(a) * (r - rim/2);
    const py = y + Math.sin(a) * (r - rim/2);
    c.save();
    c.translate(px, py);
    c.rotate(a + Math.PI/2);
    const gw = Math.max(8*scl, rim*1.1);
    const gh = Math.max(2*scl, rim*0.26);
    const grad = c.createLinearGradient(-gw/2, 0, gw/2, 0);
    grad.addColorStop(0,    'rgba(255,255,255,0)');
    grad.addColorStop(0.35, 'rgba(255,255,255,0.45)');
    grad.addColorStop(0.65, 'rgba(255,255,255,0.45)');
    grad.addColorStop(1,    'rgba(255,255,255,0)');
    c.fillStyle = grad;
    c.beginPath();
    c.ellipse(0, 0, gw/2, gh/2, 0, 0, Math.PI*2);
    c.fill();
    c.restore();
  }
  c.restore();

  c.save();
  c.beginPath();
  c.lineWidth = Math.max(1, rim*0.08);
  c.strokeStyle = 'rgba(255,255,255,0.04)';
  c.arc(x, y, r - rim*0.2, -0.6, 0.6);
  c.stroke();
  c.restore();
}

/* ==========================================================================
   SPIN ARROW
   ========================================================================== */
function drawSpinArrow(c){
  const cx = S/2, cy = S/2;
  const puckR = PUCK_R * G.puckScale;
  const orbit = puckR + 5;
  const triSize = Math.min(S * 0.035, 10);
  const tipOffset = triSize * 0.4;

  c.save();
  c.translate(cx, cy);
  c.rotate(G.spinArrowAngle);
  c.translate(orbit, 0);

  c.beginPath();
  c.moveTo(tipOffset, 0);
  c.lineTo(-tipOffset * 0.3, -triSize * 0.5);
  c.lineTo(-tipOffset * 0.3,  triSize * 0.5);
  c.closePath();

  c.fillStyle = '#e8f4ff';
  setGlow(c, 14, 'rgba(180,210,255,.9)');
  c.fill();
  c.shadowBlur = 0;

  c.strokeStyle = 'rgba(180,210,255,.45)';
  c.lineWidth = 1;
  c.stroke();

  c.restore();
}

/* ==========================================================================
   EMPTY REGION CROSS
   ========================================================================== */
function drawEmptyCross(c, x, y, size){
  if (size < 4) return;
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.52)';
  c.lineWidth = Math.max(1.4, size * 0.13);
  c.lineCap = 'round';
  setGlow(c, size * 0.45, 'rgba(200,220,255,0.5)');
  c.beginPath();
  c.moveTo(x - size * 0.30, y - size * 0.30);
  c.lineTo(x + size * 0.30, y + size * 0.30);
  c.moveTo(x + size * 0.30, y - size * 0.30);
  c.lineTo(x - size * 0.30, y + size * 0.30);
  c.stroke();
  c.restore();
}

/* ==========================================================================
   MAIN DRAW
   ========================================================================== */
function draw(now){
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, cssSize, cssSize);

  c.save();
  c.scale(scale, scale);

  c.fillStyle = '#06070c';
  c.fillRect(0, 0, S, S);

  const m = multiplierFor(G.chance);
  const fieldHex = chanceToHex(G.shown);

  const zoomActive = settings.zoom && G.zoom > 1.002;
  if (zoomActive){
    c.save();
    c.translate(S/2, S/2);
    c.scale(G.zoom, G.zoom);
    c.translate(-G.zoomCenterX, -G.zoomCenterY);
  }

  /* rink fill */
  c.save();
  c.fillStyle = '#070b14';
  c.fill(RINK_PATH);
  c.restore();

  /* clipped interior */
  c.save();
  c.clip(RINK_PATH);

  /* bg gradient */
  const bg = c.createRadialGradient(S/2, S*0.34, 20, S/2, S/2, S*0.80);
  bg.addColorStop(0,   'rgba(52,70,108,0.55)');
  bg.addColorStop(0.5, 'rgba(22,32,52,0.62)');
  bg.addColorStop(1,   'rgba(6,10,18,0.80)');
  c.fillStyle = bg;
  c.fillRect(0, 0, S, S);

  /* ---- STEP 1: fill both poly regions ---- */
  if (G.losePoly && G.losePoly.length >= 3 && G.loseBB){
    const lp = polyToPath(G.losePoly);
    const lbb = G.loseBB;
    const lg = c.createLinearGradient(lbb.x0, lbb.y0, lbb.x1, lbb.y1);
    lg.addColorStop(0,   '#10131c');
    lg.addColorStop(0.5, '#181c28');
    lg.addColorStop(1,   '#0d1018');
    c.fillStyle = lg;
    c.fill(lp);
  }
  if (G.winPoly && G.winPoly.length >= 3 && G.winBB){
    const wp = polyToPath(G.winPoly);
    const wbb = G.winBB;
    const wg = c.createLinearGradient(wbb.x0, wbb.y0, wbb.x1, wbb.y1);
    wg.addColorStop(0,   lighten(fieldHex, 42));
    wg.addColorStop(0.5, fieldHex);
    wg.addColorStop(1,   lighten(fieldHex, 18));
    c.fillStyle = wg;
    c.fill(wp);
  }

  /* ---- STEP 2: outlines ---- */
  if (G.losePoly && G.losePoly.length >= 3){
    const lp = polyToPath(G.losePoly);
    c.strokeStyle = 'rgba(255,255,255,0.10)';
    c.lineWidth = 1.2;
    c.lineJoin = 'round';
    c.stroke(lp);
  }
  if (G.winPoly && G.winPoly.length >= 3 && G.winBB){
    const wp = polyToPath(G.winPoly);
    const wbb = G.winBB;
    const ww = wbb.x1 - wbb.x0, wh = wbb.y1 - wbb.y0;
    if (settings.outline){
      c.save();
      if (G.state !== 'rolling' && G.state !== 'spinning'){
        setGlow(c, 12, 'rgba(180,215,255,0.55)');
      }
      c.strokeStyle = 'rgba(255,255,255,0.88)';
      c.lineWidth = 2;
      c.lineJoin = 'round';
      c.stroke(wp);
      c.restore();

      const corners = findBboxCorners(G.winPoly);
      for (const corner of corners){
        if (!corner) continue;
        const br = Math.min(30, Math.min(ww, wh) * 0.28);
        if (br <= 1) continue;
        const rg = c.createRadialGradient(corner.x, corner.y, 0, corner.x, corner.y, br);
        rg.addColorStop(0,    'rgba(255,255,255,0.46)');
        rg.addColorStop(0.45, 'rgba(255,255,255,0.13)');
        rg.addColorStop(1,    'rgba(255,255,255,0)');
        c.fillStyle = rg;
        c.beginPath();
        c.arc(corner.x, corner.y, br, 0, Math.PI*2);
        c.fill();
      }
    }
  }

  /* ---- STEP 3: bg gifs (over field fills, under labels) ---- */
  if (settings.bgGifs){
    if (G.bgGifLoseOpacity > 0.01){
      drawBgGif(c, BG_LOSE_GIF, G.bgGifLoseOpacity, G.loseLabel.x, G.loseLabel.y);
    }
    if (G.bgGifWinOpacity > 0.01){
      drawBgGif(c, BG_WIN_GIF, G.bgGifWinOpacity, G.winLabel.x, G.winLabel.y);
    }
  }

  /* ---- STEP 4: empty region labels ---- */
  if (G.losePoly && G.losePoly.length >= 3 && G.loseBB){
    const lbb = G.loseBB;
    const lw = lbb.x1 - lbb.x0, lh = lbb.y1 - lbb.y0;
    const lc = G.loseLabel;
    c.textAlign = 'center';
    c.textBaseline = 'middle';

    if (lw > 90 && lh > 90){
      const crossSize = Math.min(18, Math.min(lw, lh) * 0.14);
      const gs = Math.min(46, lh * 0.28, lw * 0.28);
      const labelH = 14;
      const gap1 = 9;
      const gap2 = 6;
      const totalH = crossSize + gap1 + labelH + gap2 + gs;
      const topY = lc.y - totalH / 2;

      drawEmptyCross(c, lc.x, topY + crossSize / 2, crossSize);

      c.fillStyle = 'rgba(230,240,255,0.72)';
      c.font = '800 10.5px -apple-system,system-ui,sans-serif';
      c.fillText('E M P T Y', lc.x, topY + crossSize + gap1 + labelH / 2);

      if (EMPTY_GIF.complete && EMPTY_GIF.naturalWidth > 0){
        c.save();
        c.globalAlpha = 0.92;
        c.drawImage(EMPTY_GIF, lc.x - gs / 2,
          topY + crossSize + gap1 + labelH + gap2, gs, gs);
        c.restore();
      }
    } else if (lw > 50 && lh > 50){
      const crossSize = Math.min(14, Math.min(lw, lh) * 0.18);
      const labelH = 12;
      const gap = 6;
      const totalH = crossSize + gap + labelH;
      const topY = lc.y - totalH / 2;

      drawEmptyCross(c, lc.x, topY + crossSize / 2, crossSize);
      c.fillStyle = 'rgba(230,240,255,0.65)';
      c.font = '800 8.5px -apple-system,system-ui,sans-serif';
      c.fillText('EMPTY', lc.x, topY + crossSize + gap + labelH / 2);
    } else if (lw > 30 && lh > 30){
      const crossSize = Math.min(12, Math.min(lw, lh) * 0.28);
      drawEmptyCross(c, lc.x, lc.y, crossSize);
    } else {
      const crossSize = Math.min(9, Math.min(lw, lh) * 0.35);
      drawEmptyCross(c, lc.x, lc.y, crossSize);
    }
  }

  /* ---- STEP 5: win region labels ---- */
  if (G.winPoly && G.winPoly.length >= 3 && G.winBB){
    const wbb = G.winBB;
    const wc = G.winLabel;
    const ww = wbb.x1 - wbb.x0, wh = wbb.y1 - wbb.y0;

    c.textAlign = 'center';
    c.textBaseline = 'middle';

    const baseMultPx = G.winFontPx;
    const baseLabelPx = Math.max(9, baseMultPx * 0.42);

    if (ww > 60 && wh > 55){
      const labelH = baseLabelPx + 2;
      const multH = baseMultPx + 4;
      const gap = 2;
      const totalH = labelH + gap + multH;
      const topY = wc.y - totalH / 2;

      c.fillStyle = 'rgba(255,255,255,0.92)';
      c.font = '800 ' + baseLabelPx.toFixed(1) + 'px -apple-system,system-ui,sans-serif';
      c.fillText('W I N', wc.x, topY + labelH / 2);

      c.fillStyle = 'rgba(255,255,255,1)';
      c.font = '900 ' + baseMultPx.toFixed(1) + 'px -apple-system,system-ui,sans-serif';
      c.fillText('×' + m.toFixed(2), wc.x, topY + labelH + gap + multH / 2);
    } else if (ww > 40 && wh > 26){
      const multPx = Math.max(11, baseMultPx * 0.65);
      c.fillStyle = 'rgba(255,255,255,1)';
      c.font = '900 ' + multPx.toFixed(1) + 'px -apple-system,system-ui,sans-serif';
      c.fillText('×' + m.toFixed(2), wc.x, wc.y);
    } else if (ww > 24 && wh > 16){
      const multPx = Math.max(9, baseMultPx * 0.45);
      c.fillStyle = 'rgba(255,255,255,0.95)';
      c.font = '900 ' + multPx.toFixed(1) + 'px -apple-system,system-ui,sans-serif';
      c.fillText('×' + m.toFixed(1), wc.x, wc.y);
    }
  }

  /* result flash */
  if (G.state === 'done'){
    const age = (now - G.flashT) / 1000;
    if (age < 1.0){
      const a = (1 - age) * 0.32;
      c.fillStyle = G.outcome
        ? 'rgba(120,190,255,' + a + ')'
        : 'rgba(224,85,107,' + (a * 0.85) + ')';
      c.fillRect(0, 0, S, S);
    }
  }

  c.restore(); /* unclip */

  /* rink border */
  let bp = RINK_PATH, ip = INNER_PATH;
  if (settings.bounce && jiggles.length > 0){
    bp = buildJigglePath(1.0);
    ip = buildJigglePath(0.965);
  }

  c.save();
  setGlow(c, 38, 'rgba(140,180,255,0.55)');
  c.strokeStyle = 'rgba(180,210,255,0.15)';
  c.lineWidth = 22;
  c.lineJoin = 'round';
  c.stroke(bp);
  c.restore();

  c.save();
  setGlow(c, 20, 'rgba(120,170,255,0.55)');
  c.strokeStyle = 'rgba(150,190,255,0.42)';
  c.lineWidth = 10;
  c.lineJoin = 'round';
  c.stroke(bp);
  c.restore();

  c.save();
  setGlow(c, 14, 'rgba(255,255,255,0.95)');
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  c.lineWidth = 3.2;
  c.lineJoin = 'round';
  c.stroke(bp);
  c.restore();

  if (settings.outline){
    c.save();
    c.strokeStyle = 'rgba(255,255,255,0.28)';
    c.lineWidth = 1.2;
    c.lineJoin = 'round';
    c.stroke(ip);
    c.restore();

    c.save();
    c.strokeStyle = 'rgba(140,180,255,0.10)';
    c.lineWidth = 6;
    c.lineJoin = 'round';
    c.stroke(ip);
    c.restore();
  }

  if (settings.arrow && G.state === 'spinning'){
    drawSpinArrow(c);
  }

  if (G.puckAlpha > 0.01){
    let popScale = 1;
    if (settings.pop && G.state === 'done' && G.stopPopStart > 0){
      const age = (now - G.stopPopStart) / 1000;
      const t = Math.min(1, age / G.stopPopDuration);
      popScale = puckPopScale(t);
    }

    c.save();
    c.globalAlpha = G.puckAlpha;
    drawPuck(c, G.puck.x, G.puck.y, PUCK_R * G.puckScale * popScale);
    c.restore();
  }

  if (zoomActive){
    c.restore();
  }

  c.restore();
}

/* ==========================================================================
   LOOP
   ========================================================================== */
let lastT = 0;
let lastFieldRecomputeAt = 0;

function frame(now){
  requestAnimationFrame(frame);

  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  const nowSec = now / 1000;

  if (G.state === 'idle'){
    const before = G.shown;
    stepFieldSpring(dt);

    if (Math.abs(G.shown - before) > 0.00005){
      syncFieldColorUI();
    }

    // Rate-limit field rebuilds — collapsing many small changes into one
    // recalculation every ~45 ms. This is a big perf win.
    if (Math.abs(G.shown - G.lastShown) > 0.003 && now - lastFieldRecomputeAt > 45){
      lastFieldRecomputeAt = now;
      recomputeField();
    }

    G.puckAlpha = 0;
    G.puckScale = 0.55;
    G.puck.x = S/2;
    G.puck.y = S/2;
    G.zoom = 1;
  }

  /* Smooth label positions & font size */
  if (G.winCenter){
    const k = Math.min(1, dt * 12);
    G.winLabel.x += (G.winCenter.x - G.winLabel.x) * k;
    G.winLabel.y += (G.winCenter.y - G.winLabel.y) * k;
  }
  if (G.loseCenter){
    const k = Math.min(1, dt * 12);
    G.loseLabel.x += (G.loseCenter.x - G.loseLabel.x) * k;
    G.loseLabel.y += (G.loseCenter.y - G.loseLabel.y) * k;
  }
  if (G.winBB){
    const ww = G.winBB.x1 - G.winBB.x0;
    const wh = G.winBB.y1 - G.winBB.y0;
    const fieldSize = Math.min(ww, wh);
    const targetMult = Math.max(11, Math.min(26, fieldSize * 0.14));
    const k = Math.min(1, dt * 8);
    G.winFontPx += (targetMult - G.winFontPx) * k;
  }

  if (G.state === 'spinning'){
    const t = (now - G.spinStart) / 1000 / G.spinDuration;
    if (t >= 1){
      G.spinArrowAngle = G.spinFinalAngle;
      G.state = 'rolling';
      G.rollStart = now;
    } else {
      const e = 1 - Math.pow(1 - t, 3);
      G.spinArrowAngle = G.spinFinalAngle
                       - (1 - e) * G.spinExtraTurns * 2 * Math.PI;
    }
  }

  if (G.state === 'rolling'){
    const elapsed = (now - G.rollStart) / 1000;
    const u = Math.min(1, elapsed / G.duration);
    const dist = G.path.total * distFrac(u);

    if (u >= 1){
      const last = G.path.pts[G.path.pts.length - 1];
      G.puck.x = last.x;
      G.puck.y = last.y;
      finishRoll();
    } else {
      const p = pointAtPath(G.path, dist);
      G.puck.x = p.x;
      G.puck.y = p.y;
    }

    if (G.puckScale < 1) G.puckScale = Math.min(1, G.puckScale + dt * 3.4);

    if (settings.bounce){
      let segIdx = 0;
      const pts = G.path.pts;
      while (segIdx < G.path.cum.length - 2 && G.path.cum[segIdx + 1] <= dist) segIdx++;
      if (segIdx > G.rollSegIdx){
        for (let s = G.rollSegIdx + 1; s <= segIdx; s++){
          if (s <= 0 || s >= pts.length - 1) continue;
          const bp = pts[s];
          if (!bp) continue;
          const idx = findNearestPerimIdx(bp.x, bp.y);
          if (idx === G.lastJiggleIdx) continue;
          G.lastJiggleIdx = idx;
          const phase = u <= U1 ? 1 : (1 - ((u - U1) / (1 - U1)) * 0.7);
          const intensity = (4 + Math.random() * 3) * phase;
          spawnJiggle(idx, intensity);
        }
        G.rollSegIdx = segIdx;
      } else if (segIdx < G.rollSegIdx){
        G.rollSegIdx = segIdx;
      }
    }

    if (settings.zoom){
      const zoomStartAt = Math.max(0, G.duration - ZOOM_LEAD);
      if (elapsed >= zoomStartAt){
        const zp = Math.min(1, (elapsed - zoomStartAt) / ZOOM_IN_DURATION);
        const ze = easeOutCubic(zp);
        G.zoom = 1 + (ZOOM_MAX - 1) * ze;
      } else {
        G.zoom = 1;
      }
      if (G.zoom > 1.002){
        const followRate = Math.min(1, dt * 9);
        G.zoomCenterX += (G.puck.x - G.zoomCenterX) * followRate;
        G.zoomCenterY += (G.puck.y - G.zoomCenterY) * followRate;
      }
    } else {
      G.zoom = 1;
    }
  }

  if (G.state === 'done'){
    if (settings.zoom){
      const sinceStop = (now - G.stopPopStart) / 1000;
      if (sinceStop < ZOOM_OUT_DELAY){
        G.zoom = G.zoomAtStop;
      } else {
        const t = Math.min(1, (sinceStop - ZOOM_OUT_DELAY) / ZOOM_OUT_DURATION);
        const e = easeInOutCubic(t);
        G.zoom = G.zoomAtStop - (G.zoomAtStop - 1) * e;
      }
      if (G.zoom > 1.002){
        const followRate = Math.min(1, dt * 9);
        G.zoomCenterX += (G.puck.x - G.zoomCenterX) * followRate;
        G.zoomCenterY += (G.puck.y - G.zoomCenterY) * followRate;
      }
    } else {
      G.zoom = 1;
    }
  }

  updateJiggles(nowSec);
  updateBgGifs(now, dt);

  draw(now);
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  resize();
  randomizeAngle();
  recomputeField();
  if (G.winCenter)  { G.winLabel.x = G.winCenter.x;  G.winLabel.y = G.winCenter.y;  }
  if (G.loseCenter) { G.loseLabel.x = G.loseCenter.x; G.loseLabel.y = G.loseCenter.y; }
  syncUI();
  requestAnimationFrame(function(t){
    lastT = t;
    requestAnimationFrame(frame);
  });
}

if (document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(boot, 30);
} else {
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 30); });
}

})();
</script>
