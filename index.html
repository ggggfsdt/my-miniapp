<!DOCTYPE html>
<html lang="en" data-theme="onyx">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>dllump · merge</title>
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{
    --bg-base:#0a0a0a;
    --surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.08);--surface3:rgba(255,255,255,.12);
    --primary:#5b9dff;
    --text:#f5f5f5;--text2:#9a9a9a;--text3:#5a5a5a;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
    --gold:#d4b46a;--red:#e0556b;--green:#4CC38A;
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
    --r-sm:14px;--r-md:16px;--r-lg:20px;--r-xl:22px;--r-pill:99px;
  }
  html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg-base);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}

  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:440px;margin:0 auto;
    position:relative;background:var(--bg-base);overflow:hidden;isolation:isolate}
  #app::before{content:'';position:absolute;inset:-40px;z-index:0;
    background:radial-gradient(ellipse at 30% 15%, rgba(91,157,255,.08), transparent 55%),
               radial-gradient(ellipse at 80% 90%, rgba(76,195,138,.05), transparent 55%);
    filter:blur(30px);pointer-events:none}
  #app::after{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(circle at 30% 20%, rgba(0,0,0,.25), rgba(0,0,0,.7) 70%);pointer-events:none}
  #app > *{position:relative;z-index:1}

  /* ============== TOPBAR ============== */
  #topbar{display:flex;align-items:center;gap:8px;
    padding:calc(14px + var(--safe-top)) 12px 10px;flex-shrink:0}
  .back-btn{width:38px;height:38px;border-radius:var(--r-sm);border:.5px solid var(--border);
    background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .18s var(--ease-spring),background .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  .back-btn:active{transform:scale(.9);background:var(--surface3)}
  .back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #topbar .title{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px;min-height:20px;
    background:linear-gradient(180deg,#fff,#b8c8e0);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent}
  #topbar .title .caret{display:inline-block;width:1.5px;height:14px;background:#8fb8ff;
    margin-left:2px;vertical-align:-2px;animation:caretBlink 1s steps(1,end) infinite;border-radius:2px}
  @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .balance-pill{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:var(--r-pill);
    background:var(--surface2);border:.5px solid var(--border);flex-shrink:0}
  .balance-pill img{width:18px;height:18px;display:block;object-fit:contain}
  .balance-pill span{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  /* ============== STAT BAR ============== */
  #stat-bar{flex-shrink:0;display:flex;gap:8px;padding:0 12px 10px}
  .stat-box{flex:1;position:relative;overflow:hidden;padding:9px 14px 10px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
  .stat-fill{position:absolute;left:0;top:0;bottom:0;width:0%;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#4CC38A,#2fa86f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
    transition:width .55s var(--ease-spring),background .45s ease}
  .stat-fill.tier-blue{background:linear-gradient(180deg,#6db3ff,#3a7fd4)}
  .stat-fill.tier-purple{background:linear-gradient(180deg,#c193ff,#8b5ddc)}
  .stat-fill.tier-yellow{background:linear-gradient(180deg,#ffe68a,#d4b02e)}
  .stat-fill.tier-orange{background:linear-gradient(180deg,#ffb877,#e07c1e)}
  .stat-label{position:relative;z-index:1;display:block;font-size:8.5px;font-weight:900;
    letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);
    line-height:1;margin-bottom:4px}
  .stat-value{position:relative;z-index:1;display:block;font-size:16.5px;font-weight:900;
    font-variant-numeric:tabular-nums;letter-spacing:-.4px;color:#fff;line-height:1.1;
    text-shadow:0 1px 5px rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.35);transform-origin:left center}
  .stat-value.bump{animation:valBump .42s var(--ease-spring)}
  @keyframes valBump{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

  /* ============== GRID ============== */
  #grid-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
    padding:0 12px;position:relative;overflow:hidden}

  #grid-frame{
    position:relative;padding:12px;border-radius:24px;
    background:linear-gradient(180deg,#232830 0%,#14181e 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 -5px 0 rgba(0,0,0,.6),
      0 12px 32px rgba(0,0,0,.55);
    transition:box-shadow .35s ease;
    z-index:1}
  #grid-frame.shaking{animation:gridShake .55s cubic-bezier(.36,.07,.19,.97)}
  @keyframes gridShake{
    0%,100%{transform:translate(0,0)}
    15%{transform:translate(-9px,3px) rotate(-1deg)}
    30%{transform:translate(8px,-3px) rotate(1deg)}
    45%{transform:translate(-6px,2px)}
    60%{transform:translate(5px,-2px)}
    75%{transform:translate(-3px,1px)}
    90%{transform:translate(2px,0)}
  }
  #grid-frame.pulse{animation:gridPulse .5s var(--ease-spring)}
  @keyframes gridPulse{
    0%{transform:scale(1)}
    40%{transform:scale(1.014)}
    100%{transform:scale(1)}
  }
  #grid-frame::after{
    content:'';position:absolute;inset:-3px;border-radius:26px;
    border:2px solid rgba(255,77,109,.55);
    opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:-1}
  #grid-frame.danger::after{opacity:1;animation:dangerPulse 1.1s ease-in-out infinite}
  @keyframes dangerPulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* combo counter — top-right of the frame */
  #combo-badge{
    position:absolute;top:-16px;right:-10px;z-index:20;
    padding:8px 16px;border-radius:16px;
    background:linear-gradient(180deg,#ffe066 0%,#ffb020 100%);
    color:#1a1206;font-size:14px;font-weight:900;letter-spacing:.5px;
    box-shadow:0 8px 22px rgba(255,180,30,.65),0 0 40px rgba(255,200,60,.5),inset 0 1px 0 rgba(255,255,255,.65);
    opacity:0;transform:scale(.5) translateY(-8px);
    transition:opacity .3s ease,transform .45s var(--ease-spring);
    pointer-events:none}
  #combo-badge.show{opacity:1;transform:scale(1) translateY(0)}
  #combo-badge.bump{animation:comboBump .5s var(--ease-spring)}
  @keyframes comboBump{
    0%{transform:scale(1) translateY(0)}
    45%{transform:scale(1.35) translateY(-3px)}
    100%{transform:scale(1) translateY(0)}
  }

  #merge-grid{display:grid;position:relative}

  /* ---- STEP cells ---- */
  .tile{
    position:relative;aspect-ratio:1/1;padding:0;cursor:pointer;
    border:0;background:none;outline:0;
    -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;
    font-family:inherit;
    animation:tileSlideUp .55s cubic-bezier(.22,.9,.28,1.05) backwards}
  .tile:focus,.tile:focus-visible,.tile:active{outline:0!important;border:0!important}
  @keyframes tileSlideUp{
    0%{opacity:0;transform:translateY(40px) scale(.9)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }

  .cell{
    position:absolute;inset:0;border-radius:14px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 42%, var(--glow-a, transparent) 0%, transparent 68%),
      linear-gradient(180deg,#3a3e46 0%,#262a31 100%);
    box-shadow:
      0 5px 0 0 #0f1115,
      0 7px 11px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.10);
    transition:transform .2s var(--ease-spring),box-shadow .4s ease,background .3s ease}
  .tile:active .cell{
    transform:translateY(3px);
    box-shadow:0 2px 0 0 #0f1115,0 3px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}

  /* faint empty-slot preview */
  .cell::before{
    content:'';position:absolute;
    width:60%;height:60%;
    background-image:url('https://i.postimg.cc/SsNS5WNq/better-gift-box.png');
    background-size:contain;background-position:center;background-repeat:no-repeat;
    opacity:.12;filter:grayscale(1) brightness(1.7);
    transition:opacity .22s ease;pointer-events:none}
  .tile.filled .cell::before{opacity:0}

  /* MAIN gift — a real <img> so the browser can retry loading */
  .gift{
    position:absolute;left:50%;top:50%;width:82%;height:82%;
    object-fit:contain;pointer-events:none;
    transform:translate(-50%,-50%) scale(.2);
    opacity:0;
    transition:opacity .26s ease,transform .52s var(--ease-spring),filter .3s ease;
    will-change:transform,opacity}
  .tile.filled .gift{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .tile.just-filled .gift{animation:giftPop .62s var(--ease-spring) both}
  @keyframes giftPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-30deg)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.28) rotate(8deg)}
    75%{transform:translate(-50%,-50%) scale(.92) rotate(-3deg)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  }

  .tile.teleport-flash .cell{animation:tpFlash .5s ease-out}
  @keyframes tpFlash{
    0%{background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),linear-gradient(180deg,#3a3e46,#262a31)}
    100%{background:radial-gradient(circle at 50% 42%, var(--glow-a, transparent) 0%, transparent 68%),linear-gradient(180deg,#3a3e46,#262a31)}
  }

  /* bomb */
  .bomb{
    position:absolute;left:50%;top:50%;
    font-size:48px;line-height:1;
    transform:translate(-50%,-50%) scale(.2) rotate(-90deg);
    opacity:0;
    filter:drop-shadow(0 0 16px rgba(255,77,109,.9)) drop-shadow(0 0 32px rgba(255,77,109,.5));
    animation:bombIn .6s var(--ease-spring) both;
    pointer-events:none;z-index:3}
  @keyframes bombIn{
    0%{transform:translate(-50%,-50%) scale(.15) rotate(-90deg);opacity:0}
    50%{transform:translate(-50%,-50%) scale(1.35) rotate(15deg);opacity:1}
    78%{transform:translate(-50%,-50%) scale(.92) rotate(-4deg)}
    100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  }
  .tile.is-bomb .cell{
    background:
      radial-gradient(circle at 50% 50%, rgba(255,77,109,.6) 0%, transparent 68%),
      linear-gradient(180deg,#2a0a12 0%,#14050a 100%);
    box-shadow:
      0 5px 0 0 #0f1115,
      0 7px 11px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.06),
      0 0 24px rgba(255,77,109,.7),
      0 0 48px rgba(255,77,109,.4)}

  /* BONUS gift */
  .tile.is-bonus .cell{
    background:
      radial-gradient(circle at 50% 42%, rgba(0,255,136,.55) 0%, transparent 68%),
      linear-gradient(180deg,#0a2a1c 0%,#041a10 100%);
    box-shadow:
      0 5px 0 0 #061410,
      0 7px 11px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(0,255,136,.25),
      0 0 22px rgba(0,255,136,.45),
      0 0 44px rgba(0,255,136,.22);
    animation:bonusGlow 2s ease-in-out infinite}
  @keyframes bonusGlow{
    0%,100%{box-shadow:0 5px 0 0 #061410,0 7px 11px rgba(0,0,0,.45),inset 0 1px 0 rgba(0,255,136,.25),0 0 18px rgba(0,255,136,.4),0 0 36px rgba(0,255,136,.18)}
    50%{box-shadow:0 5px 0 0 #061410,0 7px 11px rgba(0,0,0,.45),inset 0 1px 0 rgba(0,255,136,.4),0 0 26px rgba(0,255,136,.6),0 0 52px rgba(0,255,136,.3)}
  }
  .tile.is-bonus .gift{
    filter:
      brightness(1.25) saturate(1.7) hue-rotate(80deg)
      drop-shadow(0 0 10px #00ff88)
      drop-shadow(0 0 24px #00ff88)
      drop-shadow(0 0 40px rgba(0,255,136,.5))}
  .bonus-label{
    position:absolute;bottom:6%;left:0;right:0;text-align:center;
    font-size:9px;font-weight:900;letter-spacing:1.8px;
    color:#00ff88;
    text-shadow:0 0 8px #00ff88,0 0 16px #00ff88,0 1px 2px rgba(0,0,0,.9);
    pointer-events:none;animation:bonusPulse 1.4s ease-in-out infinite}
  @keyframes bonusPulse{
    0%,100%{opacity:.85;transform:scale(1)}
    50%{opacity:1;transform:scale(1.12)}
  }

  .highest-badge{
    position:absolute;top:3px;left:3px;
    padding:2.5px 6px;border-radius:8px;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-size:10px;font-weight:900;letter-spacing:-.1px;
    color:#fff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 8px var(--glow,#fff),0 1px 3px rgba(0,0,0,.9);
    pointer-events:none;
    opacity:0;transform:scale(.6);
    transition:opacity .3s ease,transform .45s var(--ease-spring);
    z-index:5}
  .tile.highest .highest-badge{opacity:1;transform:scale(1)}

  .tile.merge-pop .cell{animation:mergeLand .72s var(--ease-spring)}
  @keyframes mergeLand{
    0%{transform:scale(.5)}
    38%{transform:scale(1.24)}
    62%{transform:scale(.94)}
    82%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }

  /* flying ghost — uses <img> for reliability */
  .fly-gift{
    position:absolute;z-index:40;pointer-events:none;
    object-fit:contain;
    will-change:transform,opacity;
    filter:
      drop-shadow(0 0 10px var(--glow,#fff))
      drop-shadow(0 0 24px var(--glow,#fff))
      drop-shadow(0 0 40px var(--glow,#fff))}

  /* floating text */
  .float-value{
    position:fixed;z-index:45;pointer-events:none;
    font-size:16px;font-weight:900;letter-spacing:-.2px;
    color:#fff;font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px var(--glow,#fff),0 2px 6px rgba(0,0,0,.95);
    animation:floatUp 1.05s ease-out forwards}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,0) scale(.5)}
    22%{opacity:1;transform:translate(-50%,-16px) scale(1.25)}
    42%{transform:translate(-50%,-26px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-82px) scale(.9)}
  }
  .combo-text{
    position:fixed;z-index:9998;left:50%;top:38%;
    transform:translate(-50%,-50%) scale(.3) rotate(-14deg);
    font-size:46px;font-weight:900;letter-spacing:-1.6px;
    color:#fff;white-space:nowrap;
    text-shadow:0 0 26px var(--glow,#ffd54a),0 0 52px var(--glow,#ffd54a),0 3px 10px rgba(0,0,0,.95);
    pointer-events:none;opacity:0;
    animation:comboPop 1.1s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes comboPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-14deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(4deg)}
    38%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    72%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-76%) scale(.85)}
  }
  .bonus-text{
    position:fixed;z-index:9998;pointer-events:none;
    font-size:17px;font-weight:900;letter-spacing:.3px;
    color:#00ff88;
    text-shadow:0 0 14px #00ff88,0 0 28px rgba(0,255,136,.7),0 2px 6px rgba(0,0,0,.95);
    animation:bonusFloat 1.15s ease-out forwards}
  @keyframes bonusFloat{
    0%{opacity:0;transform:translate(-50%,0) scale(.4) rotate(-10deg)}
    28%{opacity:1;transform:translate(-50%,-16px) scale(1.3) rotate(6deg)}
    100%{opacity:0;transform:translate(-50%,-76px) scale(.9) rotate(-4deg)}
  }

  /* ============== CONTROLS ============== */
  #controls{flex-shrink:0;padding:8px 12px calc(14px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:8px}

  #diff-row{display:flex;gap:6px}
  .diff-chip{flex:1;height:46px;border-radius:16px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:inherit;cursor:pointer;padding:0 4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 12px rgba(0,0,0,.22);
    transition:transform .16s var(--ease-spring),background .2s,border-color .2s,box-shadow .25s;
    -webkit-appearance:none;appearance:none;outline:none}
  .diff-chip:active{transform:scale(.94)}
  .diff-chip:disabled{opacity:.4;pointer-events:none}
  .dc-name{font-size:11.5px;font-weight:900;letter-spacing:.1px;line-height:1}
  .dc-sub{font-size:8.5px;font-weight:800;letter-spacing:.5px;opacity:.5;line-height:1;margin-top:2px}
  .diff-chip.active{
    border-color:var(--dc);
    background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.035));
    box-shadow:0 0 0 1px var(--dc),0 0 18px var(--dc-a),inset 0 1px 0 rgba(255,255,255,.22)}
  .diff-chip.active .dc-name{color:var(--dc)}
  .diff-chip.active .dc-sub{opacity:.95;color:var(--dc)}

  #grid-size-row{display:flex;align-items:center;gap:6px}
  .gs-label{font-size:9px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
    color:rgba(255,255,255,.42);flex-shrink:0;padding-right:2px}
  .gs-chip{flex:1;height:34px;border-radius:12px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    color:rgba(255,255,255,.7);
    font-family:inherit;font-size:12.5px;font-weight:900;letter-spacing:.3px;
    cursor:pointer;transition:all .2s ease;
    -webkit-appearance:none;appearance:none;outline:none}
  .gs-chip:active{transform:scale(.94)}
  .gs-chip:disabled{opacity:.4;pointer-events:none}
  .gs-chip.active{
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));
    border-color:rgba(255,255,255,.45);color:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.15),inset 0 1px 0 rgba(255,255,255,.28)}

  #bet-area{display:flex;gap:8px}
  .bet-row{display:flex;gap:8px;width:100%}
  #bet-input{flex:1;height:50px;padding:0 18px;border-radius:var(--r-xl);
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    color:#fff;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
    outline:none;font-family:inherit;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  #bet-input:focus{border-color:rgba(140,180,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(91,157,255,.14)}
  #bet-input:disabled{opacity:.45}

  #allin-btn{height:50px;padding:0 22px;border-radius:var(--r-xl);
    border:1px solid rgba(140,180,255,.4);
    background:linear-gradient(180deg,#6da9ff,#4a86e8);color:#fff;
    font-family:inherit;font-weight:900;font-size:12px;letter-spacing:.7px;
    cursor:pointer;flex-shrink:0;
    box-shadow:0 6px 18px rgba(91,157,255,.35),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .18s var(--ease-spring),opacity .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  #allin-btn:active{transform:scale(.95)}
  #allin-btn:disabled{opacity:.35;pointer-events:none}

  #action-row{display:flex;gap:8px}
  #action-btn{height:58px;border-radius:var(--r-xl);border:none;flex:1;
    font-family:inherit;font-size:15px;font-weight:900;letter-spacing:.6px;
    cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#6da9ff 0%,#4a86e8 100%);color:#fff;
    box-shadow:0 10px 28px rgba(91,157,255,.42),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .2s var(--ease-spring),box-shadow .25s,background .3s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-appearance:none;appearance:none;outline:none}
  #action-btn:active{transform:scale(.975)}
  #action-btn:disabled{opacity:.4;pointer-events:none}

  #cashout-btn{height:58px;border-radius:var(--r-xl);border:none;
    padding:0 20px;
    font-family:inherit;font-size:13.5px;font-weight:900;letter-spacing:.4px;
    cursor:pointer;
    background:linear-gradient(180deg,#4ade80,#22c55e);color:#fff;
    box-shadow:0 10px 28px rgba(34,197,94,.42),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .2s var(--ease-spring),box-shadow .25s;
    display:flex;align-items:center;justify-content:center;gap:6px;
    -webkit-appearance:none;appearance:none;outline:none}
  #cashout-btn:active{transform:scale(.975)}
  #cashout-btn:disabled{opacity:.35;pointer-events:none}
  #cashout-btn .co-amount{font-variant-numeric:tabular-nums;opacity:.92;font-weight:800}
  #cashout-btn.urgent{animation:cashoutPulse 1s ease-in-out infinite}
  @keyframes cashoutPulse{
    0%,100%{box-shadow:0 10px 28px rgba(34,197,94,.42),inset 0 1px 0 rgba(255,255,255,.3)}
    50%{box-shadow:0 10px 40px rgba(34,197,94,.9),0 0 30px rgba(34,197,94,.6),inset 0 1px 0 rgba(255,255,255,.3)}
  }

  /* ============== RESULT ============== */
  #result-overlay{position:absolute;inset:0;z-index:50;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;
    padding:0 12px calc(12px + var(--safe-bottom))}
  #result-panel{width:100%;max-width:400px;border-radius:26px;padding:24px 20px 16px;
    background:linear-gradient(180deg, rgba(40,50,80,.95), rgba(18,24,40,.97));
    backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border:1px solid rgba(180,210,255,.22);
    box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.14);
    transform:translateY(130%);opacity:0;pointer-events:none;
    transition:transform .55s var(--ease-spring),opacity .3s ease}
  #result-panel.show{transform:translateY(0);opacity:1;pointer-events:auto}
  #result-panel.win{border-color:rgba(76,195,138,.45);
    box-shadow:0 24px 60px rgba(0,0,0,.75),0 0 60px rgba(76,195,138,.22),inset 0 1px 0 rgba(255,255,255,.16)}
  #result-panel.lose{border-color:rgba(224,85,107,.45);
    box-shadow:0 24px 60px rgba(0,0,0,.75),0 0 60px rgba(224,85,107,.2),inset 0 1px 0 rgba(255,255,255,.12)}
  .result-head{text-align:center;margin-bottom:14px}
  .result-title{font-size:11px;font-weight:900;letter-spacing:2.6px;text-transform:uppercase;
    color:rgba(200,220,250,.6);margin-bottom:8px;min-height:14px}
  .result-title .caret{display:inline-block;width:1.5px;height:11px;background:#8fb8ff;
    margin-left:2px;vertical-align:-1px;animation:caretBlink 1s steps(1,end) infinite;border-radius:2px}
  .result-mult{font-size:38px;font-weight:900;letter-spacing:-1.6px;line-height:1;
    font-variant-numeric:tabular-nums;color:#fff;margin-bottom:6px}
  #result-panel.win .result-mult{color:#8ef0b8;text-shadow:0 0 28px rgba(76,195,138,.6)}
  #result-panel.lose .result-mult{color:#ff8a9a;text-shadow:0 0 28px rgba(224,85,107,.5)}
  .result-sub{font-size:13px;font-weight:700;color:var(--text2);
    display:flex;align-items:center;justify-content:center;gap:6px}
  .result-sub img{width:15px;height:15px;object-fit:contain}
  .result-sub .amt{font-size:15px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
  #result-panel.win .result-sub .amt{color:#8ef0b8}
  #result-panel.lose .result-sub .amt{color:#ff8a9a}
  #result-continue{width:100%;height:52px;border-radius:var(--r-xl);border:none;margin-top:8px;
    background:linear-gradient(180deg,#6da9ff,#4a86e8);color:#fff;
    font-family:inherit;font-size:14.5px;font-weight:900;letter-spacing:.5px;cursor:pointer;
    box-shadow:0 8px 22px rgba(91,157,255,.35),inset 0 1px 0 rgba(255,255,255,.24);
    transition:transform .18s var(--ease-spring);
    -webkit-appearance:none;appearance:none;outline:none}
  #result-continue:active{transform:scale(.97)}
  #result-panel.win #result-continue{background:linear-gradient(180deg,#4ade80,#22c55e);
    box-shadow:0 8px 22px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.28)}

  #toast{position:fixed;top:calc(14px + var(--safe-top));left:50%;
    transform:translate(-50%,-140%) scale(.86);
    z-index:9999;padding:12px 20px;border-radius:18px;font-size:12.5px;font-weight:800;
    background:linear-gradient(180deg,rgba(56,68,100,.95),rgba(22,28,46,.97));
    border:1px solid rgba(180,210,255,.24);color:#fff;
    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;pointer-events:none;max-width:90vw;text-align:center;
    transition:transform .42s var(--ease-spring),opacity .25s ease}
  #toast.show{transform:translate(-50%,0) scale(1);opacity:1}
</style>

<body>

<div id="app">

  <div id="topbar">
    <button class="back-btn" id="back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="title" id="topbar-title"></div>
    <div class="balance-pill">
      <img src="https://i.postimg.cc/fRj0QRKq/diamond-elegant.gif" alt="">
      <span id="balance-val">1,000</span>
    </div>
  </div>

  <div id="stat-bar">
    <div class="stat-box">
      <div class="stat-fill" id="mult-fill"></div>
      <span class="stat-label">Multiplier</span>

    </div>
    <div class="stat-box">
      <span class="stat-label">Cashout</span>
      <span class="stat-value" id="cash-value">10</span>
    </div>
  </div>

  <div id="grid-stage">
    <div id="grid-frame">
      <div id="combo-badge">COMBO ×0</div>
      <div id="merge-grid"></div>
    </div>
  </div>

  <div id="controls">
    <div id="diff-row">
      <button class="diff-chip" data-d="easy" type="button">
        <span class="dc-name">Easy</span><span class="dc-sub">4% RISK</span>
      </button>
      <button class="diff-chip" data-d="medium" type="button">
        <span class="dc-name">Medium</span><span class="dc-sub">9% RISK</span>
      </button>
      <button class="diff-chip" data-d="hard" type="button">
        <span class="dc-name">Hard</span><span class="dc-sub">14% RISK</span>
      </button>
      <button class="diff-chip" data-d="extreme" type="button">
        <span class="dc-name">Extreme</span><span class="dc-sub">20% RISK</span>
      </button>
    </div>

    <div id="grid-size-row">
      <span class="gs-label">Grid</span>
      <button class="gs-chip active" data-n="3" type="button">3 × 3</button>
      <button class="gs-chip" data-n="4" type="button">4 × 4</button>
      <button class="gs-chip" data-n="5" type="button">5 × 5</button>
    </div>

    <div id="bet-area">
      <div class="bet-row">
        <input id="bet-input" type="text" inputmode="numeric" enterkeyhint="done" value="10" autocomplete="off">
        <button id="allin-btn" type="button">ALL IN</button>
      </div>
    </div>

    <div id="action-row">
      <button id="action-btn" type="button">Start</button>
      <button id="cashout-btn" type="button" style="display:none">Cashout</button>
    </div>
  </div>

  <div id="result-overlay">
    <div id="result-panel">
      <div class="result-head">
        <div class="result-title" id="result-title"></div>
        <div class="result-mult" id="result-mult">x1.43</div>
        <div class="result-sub">
          <img src="https://i.postimg.cc/fRj0QRKq/diamond-elegant.gif" alt="">
          <span class="amt" id="result-amt">14.3</span>
        </div>
      </div>
      <button id="result-continue" type="button">Continue</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================= TELEGRAM ================= */
  const TG = window.Telegram?.WebApp;
  if (TG) {
    try { TG.expand(); } catch(_){}
    try { TG.setHeaderColor?.('#0a0a0a'); } catch(_){}
    try { TG.setBackgroundColor?.('#0a0a0a'); } catch(_){}
    try { TG.disableVerticalSwipes?.(); } catch(_){}
  }
  function haptic(style){
    try {
      if (TG?.HapticFeedback) TG.HapticFeedback.impactOccurred(style || 'light');
      else if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 30 : 12);
    } catch(_){}
  }
  const $ = s => document.querySelector(s);

  /* ================= ASSETS ================= */
  const GIFT_IMG = 'https://i.postimg.cc/SsNS5WNq/better-gift-box.png';
  const BOMB_EMOJI = '💣';

  /* ================= AUDIO ================= */
  const Sound = (function(){
    let ctx=null, unlocked=false, master=null;
    function ensure(){
      if(!ctx){ try{ const AC=window.AudioContext||window.webkitAudioContext;
        if(AC){ ctx=new AC(); master=ctx.createGain(); master.gain.value=.32; master.connect(ctx.destination);} }catch(_){} }
      if(ctx && ctx.state==='suspended') ctx.resume().catch(()=>{});
      return ctx;
    }
    function unlock(){ if(unlocked)return; const c=ensure(); if(!c)return; unlocked=true; }
    ['pointerdown','touchstart','keydown'].forEach(e=>document.addEventListener(e,unlock,{once:true,passive:true}));
    function tone(freq,dur,type,vol,when,sweepTo){
      const c=ensure(); if(!c||!unlocked)return;
      const t0=when||c.currentTime, o=c.createOscillator(), g=c.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
      if(sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,sweepTo),t0+dur);
      const v=vol==null?.22:vol;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.03);
    }
    function noise(dur,vol,when,ff){
      const c=ensure(); if(!c||!unlocked)return;
      const t0=when||c.currentTime, len=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
      const s=c.createBufferSource(); s.buffer=buf;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ff||1200;
      const g=c.createGain(); g.gain.value=vol==null?.22:vol;
      s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+.03);
    }
    return {
      unlock,
      click(){ tone(720,.035,'sine',.11,null,520); },
      place(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(560,.08,'sine',.13,t,760); tone(820,.06,'sine',.07,t+.03,980); },
      merge(lvl){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        const base=480+lvl*140;
        tone(base,.12,'triangle',.18,t,base*1.7);
        tone(base*1.5,.17,'sine',.10,t+.03,base*2.3);
        if(lvl>=2) tone(base*2,.24,'sine',.09,t+.09,base*3);
        if(lvl>=4) tone(base*2.6,.32,'sine',.07,t+.14,base*4); },
      bomb(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(130,.35,'sawtooth',.34,t,45); tone(80,.5,'triangle',.24,t+.02,30);
        noise(.42,.28,t,900); tone(280,.25,'square',.09,t+.05,90); },
      bonus(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(900,.1,'sine',.14,t,1200); tone(1300,.12,'triangle',.11,t+.06,1700);
        tone(1800,.2,'sine',.09,t+.13,2400); },
      cashout(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
          tone(f,.28,'triangle',.16,t+i*.06); tone(f*2,.22,'sine',.06,t+i*.06+.01); });
        tone(1567.98,.55,'sine',.12,t+.28,2100); },
      lose(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(400,.35,'triangle',.18,t,180); tone(220,.5,'sine',.14,t+.12,90); },
      start(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(440,.1,'sine',.15,t,660); tone(660,.14,'sine',.13,t+.06,990); }
    };
  })();

  /* ================= CONFIG ================= */
  const MIN_BET = 10;
  const MAX_BONUS = 2;
  const OPEN_PER_STEP = 3;   /* cells opened on each manual Open press */

  const TIERS = [
    { v: 1,   color: '#a8b3c4' },
    { v: 2,   color: '#4CC38A' },
    { v: 5,   color: '#2fd9a4' },
    { v: 12,  color: '#5b9dff' },
    { v: 30,  color: '#8a7dff' },
    { v: 75,  color: '#b47aff' },
    { v: 180, color: '#ff4d6d' },
    { v: 450, color: '#ffd54a' }
  ];

  const DIFFS = {
    easy: {
      bomb: 0.04, k: 0.010, name: 'Easy', color: '#4CC38A',
      weights: [78, 16, 4.5, 1.2, 0.2, 0, 0, 0]
    },
    medium: {
      bomb: 0.09, k: 0.018, name: 'Medium', color: '#5b9dff',
      weights: [60, 22, 11, 4.8, 1.6, 0.5, 0.08, 0]
    },
    hard: {
      bomb: 0.14, k: 0.030, name: 'Hard', color: '#ff9d4d',
      weights: [44, 22, 16, 9.5, 5, 2.4, 0.9, 0.2]
    },
    extreme: {
      bomb: 0.20, k: 0.045, name: 'Extreme', color: '#e0556b',
      weights: [28, 19, 19, 14, 9.5, 5.5, 3, 1.6]
    }
  };

  /* ================= STATE ================= */
  const state = {
    difficulty : 'medium',
    gridSize   : 3,
    bet        : 10,
    balance    : 1000,
    playing    : false,
    busy       : false,
    points     : 0,
    totalMerges: 0,
    tiles      : []
  };

  try {
    const b = localStorage.getItem('dllump_merge_balance');
    if (b !== null) state.balance = Math.max(0, parseInt(b, 10) || 0);
  } catch(_){}
  function persistBalance(){
    try { localStorage.setItem('dllump_merge_balance', String(state.balance)); } catch(_){}
  }

  /* ================= DOM ================= */
  const gridEl      = $('#merge-grid');
  const gridFrame   = $('#grid-frame');
  const stageEl     = $('#grid-stage');
  const multValue   = $('#mult-value');
  const cashValue   = $('#cash-value');
  const multFill    = $('#mult-fill');
  const balanceEl   = $('#balance-val');
  const topbarTitle = $('#topbar-title');
  const betInput    = $('#bet-input');
  const allInBtn    = $('#allin-btn');
  const actionBtn   = $('#action-btn');
  const cashoutBtn  = $('#cashout-btn');
  const diffRow     = $('#diff-row');
  const gridSizeRow = $('#grid-size-row');
  const betArea     = $('#bet-area');
  const comboBadge  = $('#combo-badge');
  const resultPanel = $('#result-panel');
  const resultTitle = $('#result-title');
  const resultMult  = $('#result-mult');
  const resultAmt   = $('#result-amt');
  const resultCont  = $('#result-continue');
  const toastEl     = $('#toast');

  /* ================= HELPERS ================= */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const distTL = i => Math.floor(i / state.gridSize) + (i % state.gridSize);

  function hexA(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
  }
  function fmtMult(v){
    if (!isFinite(v)) return 'x∞';
    return 'x' + v.toFixed(2);
  }
  function fmtMoney(v){
    const n = Math.floor(v * 100) / 100;
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(2);
  }
  function multTier(m){
    if (m >= 6)   return 'tier-orange';
    if (m >= 4)   return 'tier-yellow';
    if (m >= 2.5) return 'tier-purple';
    if (m >= 1.5) return 'tier-blue';
    return '';
  }
  function typeText(el, text, speed){
    if (el._typeTimer) { clearTimeout(el._typeTimer); el._typeTimer = null; }
    el.textContent = '';
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);
    let i = 0;
    (function step(){
      if (i >= text.length){
        el._typeTimer = null;
        setTimeout(() => { if (caret.parentNode) caret.remove(); }, 700);
        return;
      }
      el.insertBefore(document.createTextNode(text.charAt(i++)), caret);
      el._typeTimer = setTimeout(step, speed || 55);
    })();
  }
  function bumpValue(el){
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ================= BALANCE ================= */
  function updateBalance(animate){
    const target = Math.floor(state.balance);
    if (animate){
      const from = parseInt(balanceEl.textContent.replace(/,/g, ''), 10) || 0;
      if (from !== target){
        const start = performance.now(), dur = 520;
        (function step(t){
          const p = Math.min(1, (t - start) / dur);
          const e = 1 - Math.pow(1 - p, 3);
          balanceEl.textContent = Math.round(from + (target - from) * e).toLocaleString('en-US');
          if (p < 1) requestAnimationFrame(step);
          else balanceEl.textContent = target.toLocaleString('en-US');
        })(performance.now());
        return;
      }
    }
    balanceEl.textContent = target.toLocaleString('en-US');
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  /* ================= MULTIPLIER ================= */
  function bonusCount(){
    let n = 0;
    for (const t of state.tiles) if (t.tier === -2) n++;
    return n;
  }
  function currentMult(){
    const base = 1 + state.points * DIFFS[state.difficulty].k;
    return base * Math.pow(1.2, bonusCount());
  }
  function recalcPoints(){
    let p = 0;
    for (const t of state.tiles) if (t.tier >= 0) p += TIERS[t.tier].v;
    state.points = p;
  }
  function updateMultDisplay(pulse){
    const mult = currentMult();
    const cash = state.bet * mult;
    multValue.textContent = fmtMult(mult);
    cashValue.textContent = fmtMoney(cash);

    const pct = Math.max(0, Math.min(1, mult / 6)) * 100;
    multFill.style.width = pct + '%';
    const tier = multTier(mult);
    multFill.classList.remove('tier-blue','tier-purple','tier-yellow','tier-orange');
    if (tier) multFill.classList.add(tier);

    if (pulse){ bumpValue(multValue); bumpValue(cashValue); }

    if (state.playing){
      cashoutBtn.innerHTML = 'Cashout <span class="co-amount">· ' + fmtMoney(cash) + '</span>';
      cashoutBtn.disabled = state.points <= 0 || state.busy;
    }
    updateHighestBadge();
    updateComboBadge(false);
    updateDangerState();
  }
  function updateComboBadge(bump){
    if (state.totalMerges > 0){
      comboBadge.textContent = 'COMBO ×' + state.totalMerges;
      comboBadge.classList.add('show');
      if (bump){
        comboBadge.classList.remove('bump');
        void comboBadge.offsetWidth;
        comboBadge.classList.add('bump');
      }
    } else {
      comboBadge.classList.remove('show');
    }
  }
  function updateDangerState(){
    if (!state.playing) { gridFrame.classList.remove('danger'); return; }
    const empties = state.tiles.filter(t => t.tier === -1).length;
    if (empties <= 1) gridFrame.classList.add('danger');
    else gridFrame.classList.remove('danger');
  }

  /* ================= GRID ================= */
  function sizeGrid(){
    const rect = stageEl.getBoundingClientRect();
    const size = Math.max(140, Math.floor(Math.min(rect.width, rect.height) - 40));
    gridEl.style.width  = size + 'px';
    gridEl.style.height = size + 'px';
  }

  function buildGrid(animate){
    const n = state.gridSize;
    const total = n * n;

    gridEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    gridEl.style.gridTemplateRows    = 'repeat(' + n + ', 1fr)';
    gridEl.style.gap = (n === 3 ? '11px' : n === 5 ? '7px' : '9px');

    gridEl.innerHTML = '';
    state.tiles = [];

    for (let i = 0; i < total; i++){
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'tile';
      if (animate) t.style.animationDelay = (i * 20) + 'ms';
      else t.style.animation = 'none';
      t.innerHTML =
        '<div class="cell">' +
          '<img class="gift" alt="" draggable="false">' +
          '<div class="highest-badge"></div>' +
        '</div>';
      t.addEventListener('click', () => onTileClick(i));
      gridEl.appendChild(t);
      state.tiles.push({ tier: -1, el: t });
    }
    sizeGrid();
  }

  function fillCell(idx, tier){
    const t = state.tiles[idx];
    t.tier = tier;
    const el = t.el;
    const cell = el.querySelector('.cell');
    const gift = cell.querySelector('.gift');
    const color = TIERS[tier].color;

    const bl = cell.querySelector('.bonus-label');
    if (bl) bl.remove();

    cell.style.setProperty('--glow-a', hexA(color, .34));
    cell.style.setProperty('--glow', color);
    const bright = 0.9 + tier * 0.055;
    const sat = 1 + tier * 0.04;
    gift.src = GIFT_IMG;
    gift.style.filter =
      'brightness(' + bright + ') saturate(' + sat + ')' +
      ' drop-shadow(0 0 8px ' + color + ')' +
      ' drop-shadow(0 0 20px ' + color + ')';
    /* EXPLICIT opacity — never rely on class inheritance */
    gift.style.opacity = '1';

    el.classList.remove('is-bomb','dimmed','is-bonus','collapse');
    el.style.transform = '';
    el.style.opacity = '';
    el.classList.add('filled');
    el.classList.remove('just-filled');
    void el.offsetWidth;
    el.classList.add('just-filled');
    setTimeout(() => el.classList.remove('just-filled'), 660);
  }

  function fillBonus(idx){
    const t = state.tiles[idx];
    t.tier = -2;
    const el = t.el;
    const cell = el.querySelector('.cell');
    const gift = cell.querySelector('.gift');
    const color = '#00ff88';

    cell.style.setProperty('--glow-a', 'rgba(0,255,136,.5)');
    cell.style.setProperty('--glow', color);
    gift.src = GIFT_IMG;
    gift.style.filter =
      'brightness(1.25) saturate(1.7) hue-rotate(80deg) ' +
      'drop-shadow(0 0 10px ' + color + ') ' +
      'drop-shadow(0 0 24px ' + color + ') ' +
      'drop-shadow(0 0 40px rgba(0,255,136,.5))';
    gift.style.opacity = '1';

    el.classList.remove('is-bomb','dimmed','highest','just-filled','collapse');
    el.style.transform = '';
    el.style.opacity = '';
    el.classList.add('filled','is-bonus');
    void el.offsetWidth;
    el.classList.add('just-filled');
    setTimeout(() => el.classList.remove('just-filled'), 660);

    let bl = cell.querySelector('.bonus-label');
    if (!bl){
      bl = document.createElement('div');
      bl.className = 'bonus-label';
      cell.appendChild(bl);
    }
    bl.textContent = 'BONUS';

    Sound.bonus();
    haptic('medium');
    showBonusText(el);
  }

  /* ---- THE FIX: full clear, no orphaned visuals ---- */
  function clearCell(idx){
    const t = state.tiles[idx];
    t.tier = -1;
    const el = t.el;
    const cell = el.querySelector('.cell');
    const gift = cell.querySelector('.gift');
    el.classList.remove('filled','just-filled','merge-pop','highest','is-bomb','dimmed','is-bonus','teleport-flash','collapse');
    el.style.transform = '';
    el.style.opacity = '';
    cell.style.removeProperty('--glow-a');
    cell.style.removeProperty('--glow');
    if (gift){
      gift.style.opacity = '0';    /* explicit — kills the "only light" state */
      gift.style.filter = '';
      gift.removeAttribute('src');
    }
    const bomb = cell.querySelector('.bomb');
    if (bomb) bomb.remove();
    const bl = cell.querySelector('.bonus-label');
    if (bl) bl.remove();
  }

  function updateHighestBadge(){
    let maxTier = -1, maxIdx = -1;
    state.tiles.forEach((t, i) => {
      if (t.tier > maxTier && t.tier >= 0){ maxTier = t.tier; maxIdx = i; }
    });
    state.tiles.forEach((t, i) => {
      t.el.classList.toggle('highest', i === maxIdx && maxTier >= 0);
    });
    if (maxIdx >= 0){
      const badge = state.tiles[maxIdx].el.querySelector('.highest-badge');
      if (badge){
        badge.textContent = fmtMult(currentMult());
        badge.style.setProperty('--glow', TIERS[maxTier].color);
      }
    }
  }

  /* ================= FLOATING TEXT ================= */
  function floatValue(el, text, color){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const top = r.top + r.height * 0.3;
    const f = document.createElement('div');
    f.className = 'float-value';
    f.textContent = text;
    f.style.left = cx + 'px';
    f.style.top  = top + 'px';
    f.style.setProperty('--glow', color);
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1100);
  }
  function showComboText(count){
    const el = document.createElement('div');
    el.className = 'combo-text';
    if (count >= 5) el.textContent = 'MEGA ×' + count;
    else if (count >= 3) el.textContent = 'SUPER ×' + count;
    else el.textContent = 'COMBO ×' + count;
    el.style.setProperty('--glow', count >= 4 ? '#ffd54a' : '#5b9dff');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
    haptic('medium');
  }
  function showBonusText(el){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const top = r.top + r.height * 0.12;
    const f = document.createElement('div');
    f.className = 'bonus-text';
    f.textContent = '+1.2×';
    f.style.left = cx + 'px';
    f.style.top  = top + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  /* ================= MERGE ANIMATIONS ================= */
  /* KEY: clear source cell at start so it becomes truly empty */
  function makeGhost(srcEl, color){
    const gr = gridFrame.getBoundingClientRect();
    const sr = srcEl.getBoundingClientRect();
    const ghost = document.createElement('img');
    ghost.src = GIFT_IMG;
    ghost.className = 'fly-gift';
    ghost.style.left   = (sr.left - gr.left) + 'px';
    ghost.style.top    = (sr.top  - gr.top)  + 'px';
    ghost.style.width  = sr.width + 'px';
    ghost.style.height = sr.height + 'px';
    ghost.style.setProperty('--glow', color);
    gridFrame.appendChild(ghost);
    return ghost;
  }

  function landMerge(dstIdx, tier){
    fillCell(dstIdx, tier + 1);
    const dstEl = state.tiles[dstIdx].el;
    dstEl.classList.remove('merge-pop');
    void dstEl.offsetWidth;
    dstEl.classList.add('merge-pop');
    setTimeout(() => dstEl.classList.remove('merge-pop'), 760);

    floatValue(dstEl, '+$' + TIERS[tier + 1].v, TIERS[tier + 1].color);

    /* grid glow flash */
    const color = TIERS[tier + 1].color;
    const prevShadow = gridFrame.style.boxShadow;
    gridFrame.style.boxShadow =
      'inset 0 1px 0 rgba(255,255,255,.07),inset 0 -5px 0 rgba(0,0,0,.6),' +
      '0 12px 32px rgba(0,0,0,.55),0 0 60px ' + color + ',0 0 120px ' + color;
    setTimeout(() => { gridFrame.style.boxShadow = prevShadow; }, 420);

    /* screen shake for high tiers */
    if (tier >= 3){
      gridFrame.classList.add('shaking');
      setTimeout(() => gridFrame.classList.remove('shaking'), 500);
    }

    Sound.merge(tier);
    haptic(tier >= 3 ? 'medium' : 'light');
  }

  function animArc(srcIdx, dstIdx, tier){
    return new Promise(resolve => {
      const srcEl = state.tiles[srcIdx].el;
      const dstEl = state.tiles[dstIdx].el;
      const sr = srcEl.getBoundingClientRect();
      const dr = dstEl.getBoundingClientRect();
      const color = TIERS[tier].color;
      const ghost = makeGhost(srcEl, color);

      /* source becomes TRULY empty */
      clearCell(srcIdx);

      const dx = dr.left - sr.left;
      const dy = dr.top  - sr.top;

      ghost.animate([
        { transform: 'translate(0,0) scale(1) rotate(0deg)',                                              opacity: 1, offset: 0 },
        { transform: 'translate(0,-48px) scale(1.3) rotate(-24deg)',                                      opacity: 1, offset: .22 },
        { transform: 'translate(' + (dx*0.5) + 'px,' + (dy*0.5 - 66) + 'px) scale(1.15) rotate(180deg)',  opacity: 1, offset: .58 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.4) rotate(360deg)',                     opacity: 0, offset: 1 }
      ], { duration: 600, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' });

      gridFrame.classList.remove('pulse');
      void gridFrame.offsetWidth;
      gridFrame.classList.add('pulse');
      setTimeout(() => gridFrame.classList.remove('pulse'), 520);

      setTimeout(() => {
        ghost.remove();
        landMerge(dstIdx, tier);
        resolve();
      }, 600);
    });
  }

  function animSlide(srcIdx, dstIdx, tier){
    return new Promise(resolve => {
      const srcEl = state.tiles[srcIdx].el;
      const dstEl = state.tiles[dstIdx].el;
      const sr = srcEl.getBoundingClientRect();
      const dr = dstEl.getBoundingClientRect();
      const color = TIERS[tier].color;
      const ghost = makeGhost(srcEl, color);

      clearCell(srcIdx);

      const dx = dr.left - sr.left;
      const dy = dr.top  - sr.top;

      ghost.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
        { transform: 'translate(' + (dx*0.5) + 'px,' + (dy*0.5) + 'px) scale(1.06)', opacity: 1, offset: .55 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.92)', opacity: .85, offset: 1 }
      ], { duration: 380, easing: 'cubic-bezier(.55,0,.4,1)', fill: 'forwards' });

      setTimeout(() => {
        ghost.remove();
        landMerge(dstIdx, tier);
        resolve();
      }, 380);
    });
  }

  function animTeleport(srcIdx, dstIdx, tier){
    return new Promise(async resolve => {
      const srcEl = state.tiles[srcIdx].el;
      const dstEl = state.tiles[dstIdx].el;
      const color = TIERS[tier].color;
      const ghost = makeGhost(srcEl, color);

      clearCell(srcIdx);

      ghost.animate([
        { transform: 'scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'scale(.1) rotate(220deg)', opacity: 0 }
      ], { duration: 280, easing: 'ease-in', fill: 'forwards' });

      await sleep(260);

      dstEl.classList.add('teleport-flash');
      setTimeout(() => dstEl.classList.remove('teleport-flash'), 520);

      ghost.remove();
      landMerge(dstIdx, tier);
      resolve();
    });
  }

  function animBounce(srcIdx, dstIdx, tier){
    return new Promise(resolve => {
      const srcEl = state.tiles[srcIdx].el;
      const dstEl = state.tiles[dstIdx].el;
      const sr = srcEl.getBoundingClientRect();
      const dr = dstEl.getBoundingClientRect();
      const color = TIERS[tier].color;
      const ghost = makeGhost(srcEl, color);

      clearCell(srcIdx);

      const dx = dr.left - sr.left;
      const dy = dr.top  - sr.top;

      ghost.animate([
        { transform: 'translate(0,0) scale(1)',                                                          opacity: 1, offset: 0 },
        { transform: 'translate(' + (dx*0.3) + 'px,' + (dy*0.3 - 70) + 'px) scale(1.16) rotate(-15deg)', opacity: 1, offset: .3 },
        { transform: 'translate(' + (dx*0.6) + 'px,' + (dy*0.6 + 10) + 'px) scale(.92) rotate(15deg)',   opacity: 1, offset: .6 },
        { transform: 'translate(' + (dx*0.85) + 'px,' + (dy*0.85 - 30) + 'px) scale(1.08) rotate(-8deg)', opacity: 1, offset: .82 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.45) rotate(0deg)',                     opacity: 0, offset: 1 }
      ], { duration: 640, easing: 'cubic-bezier(.4,0,.5,1)', fill: 'forwards' });

      setTimeout(() => {
        ghost.remove();
        landMerge(dstIdx, tier);
        resolve();
      }, 640);
    });
  }

  const MERGE_ANIMS = [animArc, animSlide, animTeleport, animBounce];

  /* ================= MERGE RESOLVER ================= */
  async function resolveMerges(){
    let mergeCount = 0;
    let guard = 0;
    while (guard++ < 100){
      let merged = false;
      for (let tier = 0; tier < TIERS.length - 1; tier++){
        const idxs = [];
        state.tiles.forEach((t, i) => { if (t.tier === tier) idxs.push(i); });
        if (idxs.length < 2) continue;

        /* result lands closest to TOP-LEFT corner */
        idxs.sort((a, b) => distTL(a) - distTL(b));
        const dst = idxs[0];
        const src = idxs[1];

        const anim = MERGE_ANIMS[Math.floor(Math.random() * MERGE_ANIMS.length)];
        await anim(src, dst, tier);

        state.tiles[dst].tier = tier + 1;
        recalcPoints();
        updateMultDisplay(true);
        mergeCount++;
        merged = true;
        break;
      }
      if (!merged) break;
    }
    return mergeCount;
  }

  /* ================= TIER ROLL ================= */
  function rollTier(){
    const w = DIFFS[state.difficulty].weights;
    let total = 0;
    for (const x of w) total += x;
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++){
      if (r < w[i]) return i;
      r -= w[i];
    }
    return 0;
  }

  /* ================= BOARD COLLAPSE ================= */
  async function collapseBoard(direction){
    const filled = state.tiles.filter(t => t.tier !== -1 || t.el.classList.contains('is-bomb'));
    if (!filled.length) return;
    filled.forEach((t, i) => {
      setTimeout(() => {
        const rot = (Math.random() - 0.5) * 900;
        const ty  = direction === 'down' ? (400 + Math.random() * 260) : -(400 + Math.random() * 260);
        const tx  = (Math.random() - 0.5) * 160;
        const sc  = 0.15 + Math.random() * 0.2;
        t.el.style.transition = 'transform 1.05s cubic-bezier(.45,0,.55,1),opacity .9s ease-out';
        t.el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg) scale(' + sc + ')';
        t.el.style.opacity = '0';
      }, i * 32);
    });
    await sleep(filled.length * 32 + 900);
  }

  /* ================= BOMB ================= */
  function revealBomb(idx){
    return new Promise(resolve => {
      const t = state.tiles[idx];
      const cell = t.el.querySelector('.cell');

      t.tier = -1;
      t.el.classList.remove('filled','just-filled','highest','is-bonus');
      const g = cell.querySelector('.gift');
      if (g){ g.style.opacity = '0'; g.removeAttribute('src'); }
      const bl = cell.querySelector('.bonus-label');
      if (bl) bl.remove();

      const bomb = document.createElement('div');
      bomb.className = 'bomb';
      bomb.textContent = BOMB_EMOJI;
      cell.appendChild(bomb);

      t.el.classList.add('is-bomb');
      cell.style.setProperty('--glow-a', 'rgba(255,77,109,.55)');
      cell.style.setProperty('--glow', '#ff4d6d');

      gridFrame.classList.add('shaking');
      setTimeout(() => gridFrame.classList.remove('shaking'), 580);

      Sound.bomb();
      haptic('heavy');

      setTimeout(async () => {
        collapseBoard('down');
        setTimeout(() => {
          loseGame();
          resolve();
        }, 260);
      }, 520);
    });
  }

  function loseGame(){
    state.playing = false;
    state.busy = false;
    setTimeout(() => {
      Sound.lose();
      showResult(false, 0, state.bet);
      unlockControls();
      updateActionButton();
    }, 200);
  }

  /* ================= CASHOUT ================= */
  function cashout(){
    if (!state.playing) return;
    const mult = currentMult();
    const payout = state.bet * mult;

    state.balance += payout;
    persistBalance();
    updateBalance(true);
    haptic('heavy');

    Sound.cashout();
    showResult(true, mult, payout);
    collapseBoard('up');

    state.playing = false;
    state.busy = false;
    unlockControls();
    updateActionButton();
  }

  /* ================= RESULT ================= */
  function showResult(isWin, mult, amount){
    resultPanel.classList.remove('win', 'lose');
    resultPanel.classList.add(isWin ? 'win' : 'lose');
    typeText(resultTitle, isWin ? 'CASHED OUT' : 'BOOM', 40);
    resultMult.textContent = isWin ? fmtMult(mult) : 'x0.00';
    resultAmt.textContent  = isWin ? fmtMoney(amount) : ('-' + fmtMoney(amount));
    requestAnimationFrame(() => resultPanel.classList.add('show'));
  }

  function resetRound(){
    resultPanel.classList.remove('show','win','lose');
    state.playing = false;
    state.busy = false;
    state.points = 0;
    state.totalMerges = 0;
    gridFrame.classList.remove('danger');
    unlockControls();
    updateMultDisplay(false);
    updateComboBadge(false);
    updateActionButton();
    buildGrid(true);
  }

  /* ================= CONTROLS ================= */
  function unlockControls(){
    betInput.disabled = false;
    allInBtn.disabled = false;
    diffRow.querySelectorAll('.diff-chip').forEach(b => b.disabled = false);
    gridSizeRow.querySelectorAll('.gs-chip').forEach(b => b.disabled = false);
  }
  function lockControls(){
    betInput.disabled = true;
    allInBtn.disabled = true;
    diffRow.querySelectorAll('.diff-chip').forEach(b => b.disabled = true);
    gridSizeRow.querySelectorAll('.gs-chip').forEach(b => b.disabled = true);
  }

  function emptyCount(){
    let n = 0;
    for (const t of state.tiles) if (t.tier === -1) n++;
    return n;
  }
  function updateActionButton(){
    if (state.playing){
      const empties = emptyCount();
      if (empties === 0){
        actionBtn.textContent = 'Board Full';
        actionBtn.disabled = true;
        cashoutBtn.classList.add('urgent');
      } else {
        actionBtn.textContent = 'Open';
        actionBtn.disabled = state.busy;
        cashoutBtn.classList.remove('urgent');
      }
      betArea.style.display = 'none';
      cashoutBtn.style.display = '';
      cashoutBtn.disabled = state.points <= 0 || state.busy;
      const cash = state.bet * currentMult();
      cashoutBtn.innerHTML = 'Cashout <span class="co-amount">· ' + fmtMoney(cash) + '</span>';
    } else {
      actionBtn.textContent = 'Start';
      actionBtn.disabled = state.balance < Math.max(MIN_BET, state.bet) || state.busy;
      betArea.style.display = '';
      cashoutBtn.style.display = 'none';
      cashoutBtn.classList.remove('urgent');
    }
  }

  /* ================= OPEN STEP ================= */
  async function openStep(isFirstOpen){
    if (!state.playing || state.busy) return;
    const empties = [];
    state.tiles.forEach((t, i) => { if (t.tier === -1) empties.push(i); });
    if (!empties.length) return;

    state.busy = true;
    updateActionButton();

    /* first open floods the board; every other open reveals exactly up to 3 cells */
    const count = isFirstOpen
      ? Math.max(1, empties.length - 3)
      : Math.min(OPEN_PER_STEP, empties.length);

    shuffle(empties);
    const toFill = empties.slice(0, count);

    /* one bomb roll per Open */
    let bombIdx = -1;
    if (!isFirstOpen && Math.random() < DIFFS[state.difficulty].bomb){
      bombIdx = toFill[Math.floor(Math.random() * toFill.length)];
    }

    for (const idx of toFill){
      if (!state.playing){ state.busy = false; return; }

      if (idx === bombIdx){
        await revealBomb(idx);
        return;
      }

      if (bonusCount() < MAX_BONUS && Math.random() < 0.06){
        fillBonus(idx);
      } else {
        fillCell(idx, rollTier());
        Sound.place();
        haptic('light');
      }
      await sleep(90);
    }

    const merges = await resolveMerges();
    if (merges > 0){
      state.totalMerges += merges;
      updateComboBadge(true);
      if (merges >= 2) showComboText(merges);
    }

    updateHighestBadge();
    updateMultDisplay(true);
    updateDangerState();

    state.busy = false;
    updateActionButton();
  }

  function onTileClick(){
    if (!state.playing || state.busy) return;
    openStep(false);
  }

  /* ================= GAME FLOW ================= */
  async function startGame(){
    if (state.busy) return;

    const bet = Math.max(MIN_BET, Math.floor(state.bet));
    if (bet > state.balance){
      showToast('Insufficient balance');
      haptic('light');
      return;
    }

    state.balance -= bet;
    state.bet = bet;
    persistBalance();
    updateBalance(true);

    state.playing = true;
    state.busy = true;
    state.points = 0;
    state.totalMerges = 0;

    state.tiles.forEach((_, i) => clearCell(i));

    lockControls();
    updateMultDisplay(false);
    updateComboBadge(false);
    updateActionButton();
    Sound.start();
    haptic('medium');

    state.busy = false;
    await openStep(true);
  }

  /* ================= BET INPUT ================= */
  function clampBet(){
    let v = parseInt(betInput.value.replace(/[^\d]/g, ''), 10);
    if (!Number.isFinite(v) || v < MIN_BET) v = MIN_BET;
    if (v > Math.floor(state.balance)) v = Math.max(MIN_BET, Math.floor(state.balance));
    state.bet = v;
    betInput.value = v;
    updateMultDisplay(false);
    updateActionButton();
  }
  betInput.addEventListener('input', () => {
    betInput.value = betInput.value.replace(/[^\d]/g, '').slice(0, 9);
  });
  betInput.addEventListener('blur', clampBet);
  betInput.addEventListener('keydown', e => { if (e.key === 'Enter') betInput.blur(); });

  allInBtn.addEventListener('click', () => {
    if (state.playing) return;
    const amt = Math.max(MIN_BET, Math.floor(state.balance));
    if (amt < MIN_BET){ showToast('Balance too low'); return; }
    betInput.value = amt;
    state.bet = amt;
    haptic('light');
    Sound.click();
    updateMultDisplay(false);
    updateActionButton();
  });

  /* ================= DIFFICULTY ================= */
  function setDifficulty(key, animate){
    if (state.playing) return;
    state.difficulty = key;
    diffRow.querySelectorAll('.diff-chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.d === key);
    });
    if (animate){ haptic('light'); Sound.click(); }
    updateMultDisplay(false);
    updateActionButton();
  }
  diffRow.querySelectorAll('.diff-chip').forEach(btn => {
    const d = DIFFS[btn.dataset.d];
    btn.style.setProperty('--dc', d.color);
    btn.style.setProperty('--dc-a', hexA(d.color, .35));
    btn.addEventListener('click', () => setDifficulty(btn.dataset.d, true));
  });

  /* ================= GRID SIZE ================= */
  function setGridSize(n){
    if (state.playing) return;
    state.gridSize = n;
    gridSizeRow.querySelectorAll('.gs-chip').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.n, 10) === n);
    });
    haptic('light'); Sound.click();
    buildGrid(true);
    updateMultDisplay(false);
    updateActionButton();
  }
  gridSizeRow.querySelectorAll('.gs-chip').forEach(btn => {
    btn.addEventListener('click', () => setGridSize(parseInt(btn.dataset.n, 10)));
  });

  /* ================= ACTION ================= */
  actionBtn.addEventListener('click', async () => {
    if (state.busy) return;
    if (state.playing) await openStep(false);
    else await startGame();
  });

  cashoutBtn.addEventListener('click', () => {
    if (state.busy) return;
    if (!state.playing) return;
    if (state.points <= 0) return;
    cashout();
  });

  resultCont.addEventListener('click', () => {
    haptic('light');
    Sound.click();
    resetRound();
  });

  /* ================= BACK ================= */
  $('#back-btn').addEventListener('click', () => {
    haptic('light');
    Sound.click();
    try {
      if (TG?.close) TG.close();
      else history.back();
    } catch(_){}
  });

  /* ================= INIT ================= */
  function init(){
    setDifficulty('medium', false);
    setGridSize(3);
    buildGrid(true);
    updateBalance(false);
    betInput.value = state.bet;
    updateMultDisplay(false);
    updateActionButton();
    typeText(topbarTitle, 'Merge', 90);
    requestAnimationFrame(() => requestAnimationFrame(sizeGrid));
  }
  window.addEventListener('resize', sizeGrid);
  window.addEventListener('orientationchange', () => setTimeout(sizeGrid, 260));

  init();
})();
</script>
