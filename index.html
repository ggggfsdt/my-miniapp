<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>xDll</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#0a0a0a;--surface-2:#141414;--surface-3:#1e1e1e;
  --text:#fff;--text-2:#a0a0a0;--text-3:#5a5a5a;
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.16);
  --accent:#4d9fff;--accent-2:#6eb0ff;
  --green:#34d399;--gold:#fbbf24;--red:#f87171;
  --safe-top:max(env(safe-area-inset-top,0px),24px);
  --safe-bottom:max(env(safe-area-inset-bottom,0px),10px);
  --header-h:54px;--tabs-h:68px;
  --r-sm:14px;--r-md:18px;--r-lg:22px;--r-xl:26px;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;touch-action:manipulation}

/* LOADING */
#loading{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(circle at 50% 40%,#0d1117 0%,#000 70%);
  transition:opacity .5s ease,visibility .5s ease}
#loading.out{opacity:0;visibility:hidden;pointer-events:none}
.loading-logo{font-size:42px;font-weight:900;letter-spacing:-1.5px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:scale(.85);animation:logoIn .7s var(--spring) .15s forwards}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}
.loading-spinner{width:28px;height:28px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.1);border-top-color:#4d9fff;
  animation:spin .8s linear infinite;opacity:0;
  animation:spin .8s linear infinite, fadeIn .4s ease .5s forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:1}}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:calc(var(--safe-top) + var(--header-h));
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--safe-top) 16px 0;z-index:100;
  background:rgba(0,0,0,.94);border-bottom:.5px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.03)}
.h-left{display:flex;align-items:center;gap:10px;min-width:0;height:var(--header-h)}
.h-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1)}
.h-av img{width:100%;height:100%;object-fit:cover;display:block}
.h-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + var(--safe-top)/2));
  font-size:18px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);-webkit-background-clip:text;
  background-clip:text;color:transparent;pointer-events:none}
.h-right{font-size:12.5px;font-weight:600;color:var(--gold);height:var(--header-h);
  display:flex;align-items:center;gap:4px}

/* MAIN */
#main{position:fixed;top:calc(var(--safe-top) + var(--header-h));
  left:0;right:0;bottom:calc(var(--safe-bottom) + var(--tabs-h));overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px;opacity:0;visibility:hidden;
  transform:translateY(10px);
  transition:opacity .25s var(--ease),transform .3s var(--spring),visibility .25s}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;visibility:visible;transform:translateY(0)}

/* TABS */
#tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--safe-bottom) + var(--tabs-h));
  padding:8px 12px calc(var(--safe-bottom) + 8px);background:rgba(0,0,0,.94);
  border-top:.5px solid var(--border);z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  touch-action:none;user-select:none;-webkit-user-select:none}
#tabs-inner{position:relative;display:flex;align-items:center;height:52px;
  background:rgba(20,20,20,.7);border:1px solid var(--border);border-radius:18px;
  padding:5px;touch-action:none;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.5)}
.tab-indicator{position:absolute;top:5px;bottom:5px;left:5px;
  width:calc((100% - 10px) / 4);
  background:linear-gradient(180deg,rgba(77,159,255,.22),rgba(77,159,255,.12));
  border:1px solid rgba(77,159,255,.4);border-radius:14px;pointer-events:none;
  transition:transform .45s var(--spring);z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -1px 0 rgba(0,0,0,.2),
    0 4px 16px rgba(77,159,255,.25)}
.tab-indicator.dragging{transition:none}
.tab-btn{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;background:none;border:0;
  color:var(--text-3);font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:.2px;cursor:pointer;transition:color .2s var(--ease);
  height:42px;pointer-events:none}
.tab-btn.active{color:var(--accent)}
.tab-icon{position:relative;display:inline-flex;transition:transform .3s var(--spring)}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tab-btn.active .tab-icon{transform:scale(1.14) translateY(-1px)}
.tab-bell{position:absolute;top:-5px;right:-8px;font-size:10px;line-height:1;
  animation:bellWobble 2.4s ease-in-out infinite;transform-origin:50% 20%}
@keyframes bellWobble{0%,100%{transform:rotate(0)}8%{transform:rotate(14deg)}
  16%{transform:rotate(-12deg)}24%{transform:rotate(8deg)}32%{transform:rotate(-4deg)}40%{transform:rotate(0)}}
.tab-bell::before{content:'';position:absolute;top:-1px;right:-1px;width:5px;height:5px;
  background:var(--red);border-radius:50%;border:1px solid #000;
  box-shadow:0 0 6px rgba(248,113,113,.8)}

/* SEARCH */
.search-hero{margin-bottom:16px}
.search-title{font-size:24px;font-weight:800;letter-spacing:-.7px;margin-bottom:4px}
.search-sub{font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.4}
.search-wrap{position:relative}
.search-input{width:100%;padding:13px 44px 13px 44px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);
  font-family:inherit;font-size:16px;outline:none;
  transition:border .2s var(--ease),background .2s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.search-input:focus{border-color:var(--accent);background:var(--surface-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 3px rgba(77,159,255,.12)}
.search-input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:var(--text-3);fill:none;stroke-width:2;
  stroke-linecap:round;pointer-events:none;transition:stroke .2s}
.search-input:focus~.search-icon{stroke:var(--accent)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border:none;background:var(--surface-3);border-radius:50%;
  color:var(--text-2);font-size:12px;cursor:pointer;display:none;
  align-items:center;justify-content:center}
.search-clear.show{display:flex}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s var(--spring)}
.chip:active{transform:scale(.94);background:var(--surface-2);
  border-color:var(--accent);color:var(--accent)}

/* RESULT */
.results{margin-top:18px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  animation:resultIn .5s var(--spring) both;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.result-card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(77,159,255,.4),transparent);pointer-events:none}
@keyframes resultIn{from{opacity:0;transform:translateY(12px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.result-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.result-av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.15)}
.result-av img{width:100%;height:100%;object-fit:cover;display:block}
.result-info{flex:1;min-width:0}
.result-name-row{display:flex;align-items:center;gap:6px}
.result-name{font-size:18px;font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-verified{flex-shrink:0;width:16px;height:16px;background:var(--accent);
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.result-verified svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.result-handle{font-size:13px;color:var(--text-3);margin-top:3px;font-weight:500}
.pending-badge{padding:14px;background:rgba(251,191,36,.1);
  border:1px solid rgba(251,191,36,.3);border-radius:var(--r-md);text-align:center;
  font-size:13px;font-weight:600;color:var(--gold);
  display:flex;align-items:center;justify-content:center;gap:8px}
.connected-badge{padding:14px;background:rgba(52,211,153,.12);
  border:1px solid rgba(52,211,153,.3);border-radius:var(--r-md);text-align:center;
  font-size:13px;font-weight:600;color:var(--green);
  display:flex;align-items:center;justify-content:center;gap:8px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* LIQUID GLASS SLIDER */
.lg-slider{position:relative;height:60px;border-radius:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.1);overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(0,0,0,.4),
    inset 0 0 30px rgba(255,255,255,.03),
    0 4px 20px rgba(0,0,0,.4)}
.lg-slider::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 15% 0%,rgba(255,255,255,.12),transparent 60%),
    radial-gradient(ellipse 70% 60% at 85% 100%,rgba(77,159,255,.18),transparent 60%);
  border-radius:30px}
.lg-fill{position:absolute;top:0;left:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(77,159,255,.35),rgba(77,159,255,.65),rgba(140,190,255,.8));
  border-radius:30px;pointer-events:none;
  box-shadow:0 0 30px rgba(77,159,255,.55),inset 0 0 20px rgba(255,255,255,.25)}
.lg-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.3px;
  pointer-events:none;transition:opacity .2s var(--ease)}
.lg-knob{position:absolute;left:5px;top:5px;width:50px;height:50px;
  will-change:transform;z-index:2}
.lg-knob-inner{width:100%;height:100%;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 42%),
    radial-gradient(circle at 68% 78%,rgba(255,255,255,.18),transparent 50%),
    linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.06) 55%,rgba(200,220,255,.18));
  backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.75),
    inset 0 -3px 6px rgba(0,0,0,.2),
    inset -1px 0 2px rgba(255,255,255,.35),
    0 6px 24px rgba(0,0,0,.55),
    0 2px 8px rgba(0,0,0,.35),
    0 0 0 1px rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;cursor:grab;
  transition:transform .35s var(--spring);
  transform-origin:center center;position:relative;overflow:hidden}
.lg-knob-inner::before{content:'';position:absolute;top:10%;left:18%;right:18%;height:35%;
  background:radial-gradient(ellipse,rgba(255,255,255,.6),transparent 70%);
  border-radius:50%;filter:blur(2px);pointer-events:none}
.lg-knob-inner svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;position:relative;z-index:1;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.lg-knob.dragging .lg-knob-inner{animation:knobJiggle .55s ease-in-out infinite}
@keyframes knobJiggle{
  0%,100%{transform:scale(1.2) rotate(-5deg) skewX(3deg)}
  25%{transform:scale(1.24) rotate(5deg) skewX(-3deg)}
  50%{transform:scale(1.2) rotate(-3deg) skewX(2deg)}
  75%{transform:scale(1.24) rotate(4deg) skewX(-2deg)}
}
.lg-knob.dragging .lg-knob-inner svg{transform:scale(1.15);
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
.lg-slider.completed .lg-knob-inner{
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 42%),
    linear-gradient(135deg,#34d399,#22c55e);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),
    0 6px 24px rgba(52,211,153,.65),
    0 0 0 1px rgba(255,255,255,.2)}

/* CHAT-STYLE CONNECTIONS */
.chat-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:14px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.chat-list::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
  pointer-events:none;z-index:1}
.chat-list-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.chat-list-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-3)}
.chat-list-count{font-size:11px;color:var(--text-3);font-weight:600;
  background:var(--surface-2);padding:2px 8px;border-radius:99px;
  border:1px solid var(--border)}
.chat-row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;
  cursor:pointer;transition:background .15s var(--ease);
  animation:chatIn .35s var(--spring) both}
.chat-row:active{background:var(--surface-2)}
@keyframes chatIn{from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}}
.chat-row+.chat-row::before{content:'';position:absolute;top:0;left:68px;right:16px;
  height:.5px;background:var(--border)}
.chat-av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.chat-av img{width:100%;height:100%;object-fit:cover;display:block}
.chat-online{position:absolute;bottom:1px;right:1px;width:12px;height:12px;
  border-radius:50%;background:var(--green);border:2px solid var(--surface);
  box-shadow:0 0 8px rgba(52,211,153,.6)}
.chat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.chat-name-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:-.1px}
.chat-time{font-size:11px;color:var(--text-3);font-weight:500;flex-shrink:0}
.chat-preview{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.chat-empty{padding:32px 18px;text-align:center;font-size:13px;color:var(--text-3);
  line-height:1.5}
.pend-row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.pend-row+.pend-row::before{content:'';position:absolute;top:0;left:68px;right:16px;
  height:.5px;background:var(--border)}
.pend-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);opacity:.7}
.pend-av img{width:100%;height:100%;object-fit:cover;display:block}
.pend-body{flex:1;min-width:0}
.pend-name{font-size:14px;font-weight:600;opacity:.85}
.pend-handle{font-size:12px;color:var(--text-3);margin-top:1px}
.pend-status{font-size:11px;color:var(--gold);font-weight:600;
  display:flex;align-items:center;gap:4px;background:rgba(251,191,36,.1);
  padding:3px 8px;border-radius:99px;border:1px solid rgba(251,191,36,.2)}

/* STATE MSG */
.state-msg{text-align:center;padding:32px 20px;color:var(--text-3)}
.state-msg svg{width:44px;height:44px;stroke:var(--text-3);fill:none;stroke-width:1.4;
  margin-bottom:12px;opacity:.5}
.state-msg .state-title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.state-msg .state-text{font-size:13px;line-height:1.5}

/* NOVA / 3D ROOM */
.room-scene{position:relative;width:100%;height:400px;margin:0 auto 16px;
  perspective:900px;perspective-origin:50% 42%;overflow:hidden;
  border-radius:var(--r-xl);
  background:radial-gradient(ellipse at 50% 30%,rgba(40,30,60,.55),rgba(0,0,0,.95) 70%);
  touch-action:none;user-select:none;-webkit-user-select:none;
  border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 24px rgba(0,0,0,.5)}
.room-scene::after{content:'drag background to rotate · drag Nova to move';
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:rgba(255,255,255,.25);letter-spacing:.5px;
  text-transform:uppercase;pointer-events:none;font-weight:600;white-space:nowrap}
.room{position:absolute;left:50%;top:52%;width:0;height:0;
  transform-style:preserve-3d;
  transform:rotateX(-20deg) rotateY(0deg);will-change:transform;
  transition:transform 0s}
.face{position:absolute;transform-style:preserve-3d;backface-visibility:visible}
.face-floor{left:-100px;top:-100px;width:200px;height:200px;
  transform:translateY(100px) rotateX(90deg);
  background:linear-gradient(135deg,#3a2818,#241608);
  border:1px solid rgba(0,0,0,.4)}
.face-floor::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 38px,
    rgba(0,0,0,.18) 38px 39px),
    repeating-linear-gradient(0deg,transparent 0 38px,
    rgba(255,255,255,.02) 38px 39px)}
.face-back{left:-100px;top:-70px;width:200px;height:140px;
  transform:translateZ(-100px) translateY(30px);
  background:linear-gradient(180deg,#262040,#1a1428);
  border:1px solid rgba(0,0,0,.4);
  border-bottom:none;
  box-shadow:inset 0 0 40px rgba(80,60,140,.15)}
.face-left{left:-100px;top:-70px;width:200px;height:140px;
  transform:translateX(-100px) rotateY(90deg) translateY(30px);
  background:linear-gradient(180deg,#1a1424,#120c1a);
  border:1px solid rgba(0,0,0,.4);
  box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.face-right{left:-100px;top:-70px;width:200px;height:140px;
  transform:translateX(100px) rotateY(-90deg) translateY(30px);
  background:linear-gradient(180deg,#1e1828,#14101c);
  border:1px solid rgba(0,0,0,.4);
  box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.face-window{left:-70px;top:-40px;width:55px;height:48px;
  transform:translateZ(-99px);
  background:linear-gradient(180deg,#0a1428 0%,#1a2a4a 60%,#2a3a5a 100%);
  border:2px solid #1a1a28;border-radius:3px;
  box-shadow:inset 0 0 20px rgba(100,150,255,.4),0 0 25px rgba(100,150,255,.2)}
.face-window::before{content:'';position:absolute;top:0;left:50%;width:1.5px;height:100%;
  background:#1a1a28;transform:translateX(-50%)}
.face-window::after{content:'';position:absolute;top:50%;left:0;width:100%;height:1.5px;
  background:#1a1a28;transform:translateY(-50%)}
.star{position:absolute;width:1.5px;height:1.5px;border-radius:50%;
  background:rgba(200,220,255,.9);animation:twinkle 3s ease-in-out infinite;
  box-shadow:0 0 4px rgba(200,220,255,.8)}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.face-poster{left:35px;top:-30px;width:48px;height:52px;
  transform:translateZ(-99px);
  background:linear-gradient(135deg,#f472b6,#a78bfa);
  border:1.5px solid rgba(255,255,255,.2);border-radius:3px;
  box-shadow:0 4px 12px rgba(244,114,182,.3)}
.face-poster::after{content:'♥';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-size:20px;
  color:rgba(255,255,255,.7)}
.face-rug{left:-65px;top:-65px;width:130px;height:130px;
  transform:translateY(99px) rotateX(90deg);
  background:radial-gradient(ellipse at 50% 50%,
    rgba(160,100,80,.85) 0%,rgba(120,70,60,.6) 50%,rgba(80,40,30,.4) 80%,transparent 100%);
  border-radius:50%;pointer-events:none}
.face-rug::after{content:'';position:absolute;inset:20px;border-radius:50%;
  border:1.5px dashed rgba(255,200,150,.25)}
.face-bowl{left:60px;top:-15px;width:38px;height:38px;
  transform:translateY(85px) rotateX(90deg);
  font-size:26px;line-height:38px;text-align:center;pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.pet-overlay{position:absolute;left:50%;top:52%;width:90px;height:90px;
  margin-left:-45px;margin-top:-90px;pointer-events:none;z-index:10;
  will-change:transform}
.pet-img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.65));
  cursor:grab;pointer-events:auto;
  transition:filter .2s ease}
.pet-img:active{cursor:grabbing}
.pet-img.dragging{filter:drop-shadow(0 12px 20px rgba(0,0,0,.8))
  drop-shadow(0 0 20px rgba(77,159,255,.4))}

/* NOVA INFO */
.nova-info{text-align:center;margin-bottom:16px}
.nova-name{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:2px}
.nova-meta{font-size:12px;color:var(--text-3);font-weight:500}

/* HAND */
#hand-cursor{position:fixed;pointer-events:none;z-index:99999;display:none;
  transform:translate(-8px,-8px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
#hand-cursor.active{display:block;animation:handAppear .25s var(--spring)}
@keyframes handAppear{from{transform:translate(-8px,-8px) scale(.5);opacity:0}
  to{transform:translate(-8px,-8px) scale(1);opacity:1}}
.hand-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:2px solid #fff;background:var(--surface-2);
  box-shadow:0 2px 10px rgba(0,0,0,.7)}
.hand-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hand-icon{font-size:24px;margin-top:-8px;margin-left:22px;line-height:1;
  animation:handGrab 1.5s ease-in-out infinite}
@keyframes handGrab{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(2deg)}}

/* PULSE */
.anon-card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:16px;margin-bottom:10px;position:relative;
  overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.anon-card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.4),transparent);

.anon-text{font-size:13.5px;line-height:1.55;font-style:italic;margin-bottom:10px;

.reveal-btn{width:100%;padding:9px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--accent);font-family:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer;transition:opacity .2s}
.reveal-btn:active{opacity:.7}
.type-char{display:inline-block;opacity:0;
  animation:typeIn .4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes typeIn{from{opacity:0;transform:translateY(8px) scale(.6)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.cursor-bar{display:inline-block;width:2px;height:1.05em;background:var(--accent);
  margin-left:2px;vertical-align:text-bottom;animation:blink .7s steps(2) infinite;
  border-radius:1px;box-shadow:0 0 6px var(--accent)}
@keyframes blink{50%{opacity:0}}

/* PROFILE */
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;
  text-align:center}
.profile-av{width:88px;height:88px;border-radius:50%;overflow:hidden;
  background:var(--surface-2);margin-bottom:14px;position:relative;
  box-shadow:0 0 0 3px var(--accent),0 0 0 6px rgba(77,159,255,.12)}
.profile-av img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}

.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}

  overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);

.stat-lbl{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500}
.settings{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);overflow:hidden;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.settings::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
  pointer-events:none;z-index:1}
.setting-row{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative}
.setting-row+.setting-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:.5px;background:var(--border)}
.setting-lbl{font-size:14px;font-weight:500;flex:1}
.switch{position:relative;width:40px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);
  cursor:pointer;transition:background .2s;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.slider::before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;
  border-radius:50%;background:#fff;transition:transform .22s var(--spring);
  box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::before{transform:translateX(16px)}

/* TOAST */
#toast-wrap{position:fixed;top:calc(var(--safe-top) + var(--header-h) + 12px);left:50%;
  transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:6px;
  width:calc(100% - 32px);max-width:360px;align-items:center;pointer-events:none}
.toast{padding:11px 16px;border-radius:14px;background:rgba(20,20,20,.96);
  border:1px solid var(--border-2);font-size:13px;font-weight:600;display:flex;
  align-items:center;gap:9px;opacity:0;transform:translateY(-10px);
  transition:opacity .2s,transform .3s var(--spring);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:100%;
  box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:rgba(52,211,153,.35);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,.35);color:var(--red)}
.toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-logo">xDll</div>
  <div class="loading-spinner"></div>
</div>

<div id="header"></div>
<main id="main">
  <section class="page" id="page-friends"></section>
  <section class="page" id="page-nova"></section>
  <section class="page" id="page-pulse"></section>
  <section class="page" id="page-profile"></section>
</main>
<nav id="tabs"><div id="tabs-inner"><div class="tab-indicator" id="tab-indicator"></div></div></nav>
<div id="toast-wrap"></div>
<div id="hand-cursor">
  <div class="hand-avatar"><img id="hand-avatar-img" src="" alt=""></div>
  <div class="hand-icon">🖐️</div>
</div>

<script>
(function(){
'use strict';

const tg = window.Telegram?.WebApp;
if (tg){ try{tg.ready()}catch(_){}; try{tg.expand()}catch(_){} }
function haptic(t){ try{tg?.HapticFeedback?.impactOccurred(t||'light')}catch(_){} }

const I = {
  people:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  paw:'<svg viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="9" cy="10" r="2"/><path d="M9 14a4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4z"/></svg>',
  pulse:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  user:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  check:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  x:'<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  empty:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
};

/* SAFE INITIAL AVATAR (data URI, never fails) */
function initialAvatar(name, size){
  size = size || 96;
  const initial = (name || '?').trim().charAt(0).toUpperCase() || '?';
  const palette = ['#4d9fff','#34d399','#fbbf24','#f472b6','#a78bfa','#f87171'];
  const color = palette[initial.charCodeAt(0) % palette.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="${color}"/><text x="50%" y="50%" dy=".35em" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="${size*0.44}" font-weight="800">${initial}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* STATE */
const LS_KEY = 'xdll_v1';
const state = {
  tab: 'friends', query: '', result: null, error: null,
  connections: [], pending: new Map(),
  balance: 1250, notifications: true
};
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    connections: state.connections,
    pending: [...state.pending.entries()],
    balance: state.balance, notifications: state.notifications
  })) }catch(_){}
}
function load(){
  try{ const r = localStorage.getItem(LS_KEY); if(!r) return;
    const d = JSON.parse(r);
    if (Array.isArray(d.connections)) state.connections = d.connections;
    if (Array.isArray(d.pending)) state.pending = new Map(d.pending);
    if (typeof d.balance === 'number') state.balance = d.balance;
    if (typeof d.notifications === 'boolean') state.notifications = d.notifications;
  }catch(_){}
}

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

function getUserInfo(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? ((u.first_name||'')+(u.last_name?' '+u.last_name:'')).trim() : 'You';
  let photo = u?.photo_url || '';
  if (!photo) photo = initialAvatar(name, 128);
  return { name, photo, username: u?.username || '' };
}

/* SEARCH */
const KNOWN = {
  durov:'Pavel Durov', telegram:'Telegram', botfather:'BotFather',
  tginfo:'Telegram Info', stickers:'Stickers', premium:'Telegram Premium', gif:'GIF'
};
function search(q){
  const clean = String(q).replace(/^@/, '').trim().toLowerCase();
  if (!clean) return { error: 'empty' };
  if (clean.length < 2) return { error: 'too_short' };
  if (!/^[a-z0-9_]{2,32}$/i.test(clean)) return { error: 'invalid' };
  const isKnown = clean in KNOWN;
  const name = isKnown ? KNOWN[clean] : clean.charAt(0).toUpperCase() + clean.slice(1);
  return { ok: true, user: {
    username: clean, name: name,
    photo: `https://unavatar.io/telegram/${clean}`,
    verified: isKnown
  }};
}

/* TYPEWRITER */
function typeText(el, text, speed, onDone){
  if (!el) return;
  speed = speed || 40;
  el.innerHTML = '';
  let i = 0;
  const bar = document.createElement('span');
  bar.className = 'cursor-bar';
  el.appendChild(bar);
  function tick(){
    if (i >= text.length){ setTimeout(() => bar.remove(), 500); onDone && onDone(); return; }
    const ch = text[i++];
    const span = document.createElement('span');
    span.className = 'type-char';
    span.textContent = ch;
    el.insertBefore(span, bar);
    setTimeout(tick, speed);
  }
  tick();
}

/* TOAST */
function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?I.check:type==='error'?I.x:I.search) + `<span>${esc(text)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),280); }, 2400);
  haptic('light');
}

/* HEADER — with bulletproof avatar */
function renderHeader(){
  const u = getUserInfo();
  $('#header').innerHTML = `
    <div class="h-left">
      <div class="h-av"><img id="h-av-img" src="${esc(u.photo)}" alt=""></div>
      <div class="h-name">${esc(u.name)}</div>
    </div>
    <div class="h-brand">xDll</div>
    <div class="h-right">${state.balance.toLocaleString()} 💎</div>`;
  const img = $('#h-av-img');
  if (img){
    img.onerror = () => {
      img.onerror = null;
      img.src = initialAvatar(u.name, 128);
    };
  }
}

/* TABS */
const TABS = [
  {id:'friends', label:'Friends', icon:'people', bell:true},
  {id:'nova', label:'Nova', icon:'paw'},
  {id:'pulse', label:'Pulse', icon:'pulse'},
  {id:'profile', label:'Profile', icon:'user'}
];
let tabWidth = 0;

function renderTabs(){
  const inner = $('#tabs-inner');
  inner.querySelectorAll('.tab-btn').forEach(b => b.remove());
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.tab===t.id?' active':'');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="tab-icon">${I[t.icon]}${t.bell?'<span class="tab-bell">🔔</span>':''}</span><span>${t.label}</span>`;
    inner.appendChild(b);
  });
  requestAnimationFrame(() => {
    tabWidth = (inner.clientWidth - 10) / TABS.length;
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
  });
}

function setTabIndicator(idx, animate){
  const ind = $('#tab-indicator');
  if (!ind) return;
  if (!animate) ind.classList.add('dragging');
  else ind.classList.remove('dragging');
  ind.style.transform = `translateX(${idx * tabWidth}px)`;
  if (!animate) { void ind.offsetWidth; requestAnimationFrame(()=>ind.classList.remove('dragging')); }
}

function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');
  $('#page-'+state.tab)?.classList.remove('active');
  state.tab = tab;
  $('#page-'+tab).classList.add('active');
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  setTabIndicator(TABS.findIndex(t => t.id === tab), true);
  if (tab==='friends') mountFriendsPage();
  if (tab==='nova') renderNova();
  if (tab==='pulse') renderPulse();
  if (tab==='profile') renderProfile();
}

function initTabSlider(){
  const inner = $('#tabs-inner');
  const ind = $('#tab-indicator');
  let dragging = false, moved = false, startX = 0, startIdx = 0;

  function getX(e){
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return e.clientX;
  }

  function onDown(e){
    dragging = true; moved = false;
    startX = getX(e);
    startIdx = TABS.findIndex(t => t.id === state.tab);
    ind.classList.add('dragging');
  }
  function onMove(e){
    if (!dragging) return;
    const dx = getX(e) - startX;
    if (Math.abs(dx) > 6) moved = true;
    if (moved){
      e.preventDefault();
      const maxX = (TABS.length - 1) * tabWidth;
      ind.style.transform = `translateX(${clamp(startIdx * tabWidth + dx, 0, maxX)}px)`;
    }
  }
  function onUp(e){
    if (!dragging) return;
    dragging = false;
    ind.classList.remove('dragging');
    const innerRect = inner.getBoundingClientRect();
    const relX = getX(e) - innerRect.left - 5;
    let idx = moved ? Math.round(relX / tabWidth) : Math.floor(relX / tabWidth);
    idx = clamp(idx, 0, TABS.length - 1);
    ind.style.transform = `translateX(${idx * tabWidth}px)`;
    if (TABS[idx].id !== state.tab){ haptic('medium'); switchTab(TABS[idx].id); }
    else setTabIndicator(idx, true);
  }

  inner.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', () => {
    if (!dragging) return;
    dragging = false;
    ind.classList.remove('dragging');
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), true);
  });
  inner.addEventListener('touchstart', onDown, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onUp);
  window.addEventListener('resize', () => {
    tabWidth = (inner.clientWidth - 10) / TABS.length;
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
  });
}

/* ============================================================
   FRIENDS PAGE — mounts ONCE, updates REGIONS separately
   so input stays focused while typing.
   ============================================================ */
let searchTimer = null;
let mounted = false;

function mountFriendsPage(){
  if (mounted){ refreshFriendsRegions(); return; }
  mounted = true;
  const page = $('#page-friends');
  page.innerHTML = `
    <div class="search-hero">
      <div class="search-title">Find people</div>
      <div class="search-sub">Search any Telegram user by @username</div>
      <div class="search-wrap">
        ${I.search}
        <input class="search-input" id="search-input" placeholder="@durov"
          value="${esc(state.query)}" autocomplete="off" autocapitalize="none"
          autocorrect="off" spellcheck="false">
        <button class="search-clear ${state.query?'show':''}" id="search-clear">✕</button>
      </div>
      <div class="chips">
        <button class="chip" data-try="durov">⭐ @durov</button>
        <button class="chip" data-try="telegram">💬 @telegram</button>
        <button class="chip" data-try="botfather">🤖 @botfather</button>
      </div>
    </div>
    <div id="region-results"></div>
    <div id="region-pending"></div>
    <div id="region-connections"></div>`;
  wireFriendsInput();
  refreshFriendsRegions();
}

function wireFriendsInput(){
  const input = $('#search-input');
  if (!input) return;

  input.addEventListener('input', e => {
    state.query = e.target.value;
    $('#search-clear')?.classList.toggle('show', !!state.query);
    clearTimeout(searchTimer);
    if (!state.query.trim()){
      state.result = null; state.error = null;
      refreshResults();
      return;
    }
    searchTimer = setTimeout(() => doSearch(state.query), 700);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      clearTimeout(searchTimer);
      doSearch(state.query);
    }
  });

  $('#search-clear')?.addEventListener('click', () => {
    state.query = ''; state.result = null; state.error = null;
    $('#search-input').value = '';
    $('#search-clear')?.classList.remove('show');
    refreshResults();
  });

  $$('[data-try]').forEach(chip => chip.addEventListener('click', () => {
    clearTimeout(searchTimer);
    state.query = '@' + chip.dataset.try;
    $('#search-input').value = state.query;
    doSearch(chip.dataset.try);
  }));
}

function doSearch(q){
  const r = search(q);
  if (r.error){ state.error = r.error; state.result = null; }
  else { state.result = r.user; state.error = null; haptic('medium'); }
  refreshResults();
}

function refreshFriendsRegions(){
  refreshResults();
  refreshPending();
  refreshConnections();
}

function refreshResults(){
  const region = $('#region-results');
  if (!region) return;
  if (state.error){
    const titles = {empty:'Type a username',too_short:'Too short',invalid:'Invalid username'};
    const texts = {empty:'Enter a @username.',too_short:'At least 2 characters.',
      invalid:'Only letters, numbers, underscore.'};
    region.innerHTML = `<div class="results"><div class="state-msg">${I.empty}
      <div class="state-title">${titles[state.error]||'Error'}</div>
      <div class="state-text">${texts[state.error]||''}</div></div></div>`;
    return;
  }
  if (!state.result){ region.innerHTML = ''; return; }
  region.innerHTML = `<div class="results">${renderResultCard(state.result)}</div>`;

  if (nameEl) typeText(nameEl, state.result.name, 55);

}

function renderResultCard(u){
  const isPending = state.pending.has(u.username);
  const isConnected = state.connections.some(c =>
    c.username.toLowerCase() === u.username.toLowerCase());
  const fb = initialAvatar(u.name, 96);

  let actionHtml;
  if (isConnected){
    actionHtml = `<div class="connected-badge">${I.check}<span>Connected</span></div>`;
  } else if (isPending){
    actionHtml = `<div class="pending-badge"><span class="spin">⏳</span><span>Request sent · waiting for acceptance</span></div>`;
  } else {
    actionHtml = `<div class="lg-slider" id="lg-slider">
      <div class="lg-fill"></div>
      <div class="lg-text">Slide to send request</div>
      <div class="lg-knob"><div class="lg-knob-inner">${I.arrow}</div></div>
    </div>`;
  }

  return `
    <div class="result-card">
      <div class="result-header">
        <div class="result-av">
          <img src="${esc(u.photo)}" alt=""
            onerror="this.onerror=null;this.src='${fb}'">
        </div>
        <div class="result-info">
          <div class="result-name-row">
            <div class="result-name" id="result-name">${esc(u.name)}</div>
            ${u.verified ? `<span class="result-verified"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>` : ''}
          </div>
          <div class="result-handle">@${esc(u.username)}</div>
        </div>
      </div>
      ${actionHtml}
    </div>`;
}

        <div class="pend-body">

function refreshConnections(){
  const region = $('#region-connections');
  if (!region) return;
  if (!state.connections.length){
    region.innerHTML = `<div class="chat-list">
      <div class="chat-list-head">
        <div class="chat-list-title">Your connections</div>
        <div class="chat-list-count">0</div>
      </div>
      <div class="chat-empty">Nobody yet.<br>Search a username above to send your first request.</div>
    </div>`;
    return;
  }

  const previews = ['Tap to open chat', 'Say hi 👋', 'Message on Telegram', 'Start a conversation'];
  const times = ['now', '2m', '12m', '1h', '3h'];

  region.innerHTML = `<div class="chat-list">
    <div class="chat-list-head">
      <div class="chat-list-title">Your connections</div>
      <div class="chat-list-count">${state.connections.length}</div>
    </div>
    ${state.connections.map((c, i) => {
      const fb = initialAvatar(c.name, 96);
      const isOnline = i % 3 !== 1;
      return `
        <div class="chat-row" data-open="${esc(c.username)}" style="animation-delay:${i*50}ms">
          <div class="chat-av">
            <img src="${esc(c.photo)}" alt=""
              onerror="this.onerror=null;this.src='${fb}'">
            ${isOnline ? '<span class="chat-online"></span>' : ''}
          </div>
          <div class="chat-body">
            <div class="chat-name-row">
              <div class="chat-name">${esc(c.name)}</div>
              <div class="chat-time">${times[i % times.length]}</div>
            </div>
            <div class="chat-preview">${previews[i % previews.length]}</div>
          </div>
        </div>`;
    }).join('')}
  </div>`;

  region.querySelectorAll('[data-open]').forEach(row => {
    row.addEventListener('click', () => openChat(row.dataset.open));
  });
}

function sendRequest(user){
  if (!user) return;
  if (state.connections.some(c => c.username.toLowerCase() === user.username.toLowerCase())){
    toast('Already connected', 'info'); return;
  }
  if (state.pending.has(user.username)){ toast('Request already sent', 'info'); return; }

  state.pending.set(user.username, {
    name: user.name, photo: user.photo,
    requestedAt: Date.now()
  });
  save();
  haptic('heavy');
  toast(`Request sent to @${user.username}`, 'success');
  refreshFriendsRegions();

  const delay = 8000 + Math.random() * 7000;
  setTimeout(() => {
    if (!state.pending.has(user.username)) return;
    state.pending.delete(user.username);
    state.connections.unshift({
      username: user.username, name: user.name, photo: user.photo,
      connectedAt: Date.now()
    });
    save();
    haptic('heavy');
    toast(`@${user.username} accepted your request`, 'success');
    if (state.tab === 'friends') refreshFriendsRegions();
    if (state.tab === 'profile') renderProfile();
  }, delay);
}

function openChat(username){
  const clean = String(username).replace(/^@/, '');
  haptic('medium');
  try {
    if (tg?.openTelegramLink){ tg.openTelegramLink('https://t.me/' + clean); return; }
  } catch(_){}
  window.open('https://t.me/' + clean, '_blank');
}

/* LIQUID GLASS SLIDER */
function setupLiquidSlider(el, onComplete){
  const knob = el.querySelector('.lg-knob');
  const fill = el.querySelector('.lg-fill');
  const text = el.querySelector('.lg-text');
  let dragging = false, startX = 0, currentX = 0, maxX = 0;

  function measure(){ maxX = el.offsetWidth - knob.offsetWidth - 10; }
  requestAnimationFrame(measure);
  window.addEventListener('resize', measure);

  function getX(e){
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return e.clientX;
  }

  function onDown(e){
    dragging = true;
    startX = getX(e) - currentX;
    knob.style.transition = 'none';
    fill.style.transition = 'none';
    knob.classList.add('dragging');
    haptic('light');
  }
  function onMove(e){
    if (!dragging) return;
    e.preventDefault();
    currentX = clamp(getX(e) - startX, 0, maxX);
    knob.style.transform = `translateX(${currentX}px)`;
    fill.style.width = (currentX + knob.offsetWidth + 5) + 'px';
    text.style.opacity = String(Math.max(0, 1 - currentX / (maxX * 0.4)));
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    knob.classList.remove('dragging');
    knob.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)';
    fill.style.transition = 'width .5s cubic-bezier(.34,1.56,.64,1)';
    if (currentX >= maxX * 0.8){
      currentX = maxX;
      knob.style.transform = `translateX(${maxX}px)`;
      fill.style.width = '100%';
      el.classList.add('completed');
      haptic('heavy');
      setTimeout(() => onComplete && onComplete(), 280);
    } else {
      currentX = 0;
      knob.style.transform = 'translateX(0)';
      fill.style.width = '0px';
      text.style.opacity = '1';
      haptic('light');
    }
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('touchstart', onDown, { passive: true });
  el.addEventListener('touchmove', onMove, { passive: false });
  el.addEventListener('touchend', onUp);
}

/* ============================================================
   NOVA — 3D rotatable room + GIF pet
   ============================================================ */
const PET_GIF = 'https://i.postimg.cc/fRqXk2SR/ezgif-21ab08378515e1ba.gif';
const ROOM_RX = -20;
const FLOOR_Y = 100;
const PERSPECTIVE = 900;

let roomY = 0;
let petX = 0, petZ = 0;
let rotatingRoom = false;
let draggingPet = false;
let rotateStartX = 0, rotateStartY = 0, rotateStartVal = 0;
let petStartX = 0, petStartY = 0, petStartPX = 0, petStartPZ = 0;

function project(px, py, pz, rxDeg, ryDeg){
  const rx = rxDeg * Math.PI / 180;
  const ry = ryDeg * Math.PI / 180;
  const cosY = Math.cos(ry), sinY = Math.sin(ry);
  const x1 = px * cosY + pz * sinY;
  const z1 = -px * sinY + pz * cosY;
  const y1 = py;
  const cosX = Math.cos(rx), sinX = Math.sin(rx);
  const y2 = y1 * cosX - z1 * sinX;
  const z2 = y1 * sinX + z1 * cosX;
  const scale = PERSPECTIVE / (PERSPECTIVE + z2);
  return { x: x1 * scale, y: y2 * scale, scale };
}

function renderNova(){
  const page = $('#page-nova');
  page.innerHTML = `
    <div class="room-scene" id="room-scene">
      <div class="room" id="room">
        <div class="face face-floor"></div>
        <div class="face face-back"></div>
        <div class="face face-left"></div>
        <div class="face face-right"></div>
        <div class="face face-window">
          <span class="star" style="top:20%;left:25%"></span>
          <span class="star" style="top:35%;left:70%;animation-delay:.5s"></span>
          <span class="star" style="top:65%;left:30%;animation-delay:1s"></span>
          <span class="star" style="top:75%;left:65%;animation-delay:1.5s"></span>
        </div>
        <div class="face face-poster"></div>
        <div class="face face-rug"></div>
        <div class="face face-bowl">🍖</div>
      </div>
      <div class="pet-overlay" id="pet-overlay">
        <img class="pet-img" id="pet-img" src="${PET_GIF}" alt="Nova">
      </div>
    </div>

    <div class="nova-info">
      <div class="nova-name">Nova</div>
      <div class="nova-meta">Level 3 · ${state.connections.length} friends</div>
    </div>`;

  // Restore rotation
  roomY = 0;
  petX = 0;
  petZ = 0;
  applyRoomTransform();
  updatePetPosition();
  initRoomInteraction();
}

function applyRoomTransform(){
  const room = $('#room');
  if (room) room.style.transform = `rotateX(${ROOM_RX}deg) rotateY(${roomY}deg)`;
}

function updatePetPosition(){
  const overlay = $('#pet-overlay');
  if (!overlay) return;
  const p = project(petX, FLOOR_Y, petZ, ROOM_RX, roomY);
  overlay.style.transform = `translate(${p.x}px, ${p.y}px)`;
}

function initRoomInteraction(){
  const scene = $('#room-scene');
  const pet = $('#pet-img');
  if (!scene || !pet) return;

  function getPt(e){
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  // Scene drag → rotate room
  scene.addEventListener('pointerdown', e => {
    if (e.target.closest('#pet-img')) return;
    rotatingRoom = true;
    const p = getPt(e);
    rotateStartX = p.x;
    rotateStartY = p.y;
    rotateStartVal = roomY;
    scene.style.cursor = 'grabbing';
    haptic('light');
  });

  // Pet drag
  pet.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    draggingPet = true;
    const p = getPt(e);
    petStartX = p.x;
    petStartY = p.y;
    petStartPX = petX;
    petStartPZ = petZ;
    pet.classList.add('dragging');
    showHand(p.x, p.y);
    haptic('medium');
  });

  document.addEventListener('pointermove', e => {
    const p = getPt(e);

    if (rotatingRoom){
      const dx = p.x - rotateStartX;
      roomY = clamp(rotateStartVal + dx * 0.45, -50, 50);
      applyRoomTransform();
      updatePetPosition();
    }

    if (draggingPet){
      updateHandPos(p.x, p.y);
      const dx = p.x - petStartX;
      const dy = p.y - petStartY;
      // Approximate inverse projection → floor delta
      const rx = ROOM_RX * Math.PI / 180;
      const ry = roomY * Math.PI / 180;
      const cosY = Math.cos(ry), sinY = Math.sin(ry);
      const S = Math.max(0.15, Math.abs(Math.sin(rx)));
      const proj = project(petStartPX, FLOOR_Y, petStartPZ, ROOM_RX, roomY);
      const sc = proj.scale || 1;
      const dfx = (dx * cosY - dy * sinY / S) / sc;
      const dfz = (dx * sinY + dy * cosY / S) / sc;
      petX = clamp(petStartPX + dfx, -75, 75);
      petZ = clamp(petStartPZ + dfz, -75, 75);
      updatePetPosition();
    }
  }, { passive: false });

  document.addEventListener('pointerup', () => {
    if (rotatingRoom){ rotatingRoom = false; scene.style.cursor = ''; }
    if (draggingPet){
      draggingPet = false;
      pet.classList.remove('dragging');
      hideHand();
      haptic('light');
    }
  });

  // Touch fallback
  scene.addEventListener('touchstart', e => {
    if (e.target.closest('#pet-img')) return;
    rotatingRoom = true;
    const p = getPt(e);
    rotateStartX = p.x;
    rotateStartY = p.y;
    rotateStartVal = roomY;
  }, { passive: true });
  pet.addEventListener('touchstart', e => {
    e.preventDefault();
    e.stopPropagation();
    draggingPet = true;
    const p = getPt(e);
    petStartX = p.x;
    petStartY = p.y;
    petStartPX = petX;
    petStartPZ = petZ;
    pet.classList.add('dragging');
    showHand(p.x, p.y);
    haptic('medium');
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    const p = getPt(e);
    if (rotatingRoom){
      e.preventDefault();
      const dx = p.x - rotateStartX;
      roomY = clamp(rotateStartVal + dx * 0.45, -50, 50);
      applyRoomTransform();
      updatePetPosition();
    }
    if (draggingPet){
      e.preventDefault();
      updateHandPos(p.x, p.y);
      const dx = p.x - petStartX;
      const dy = p.y - petStartY;
      const rx = ROOM_RX * Math.PI / 180;
      const ry = roomY * Math.PI / 180;
      const cosY = Math.cos(ry), sinY = Math.sin(ry);
      const S = Math.max(0.15, Math.abs(Math.sin(rx)));
      const proj = project(petStartPX, FLOOR_Y, petStartPZ, ROOM_RX, roomY);
      const sc = proj.scale || 1;
      const dfx = (dx * cosY - dy * sinY / S) / sc;
      const dfz = (dx * sinY + dy * cosY / S) / sc;
      petX = clamp(petStartPX + dfx, -75, 75);
      petZ = clamp(petStartPZ + dfz, -75, 75);
      updatePetPosition();
    }
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (rotatingRoom){ rotatingRoom = false; scene.style.cursor = ''; }
    if (draggingPet){
      draggingPet = false;
      pet.classList.remove('dragging');
      hideHand();
    }
  });
}

function showHand(x, y){
  const h = $('#hand-cursor');
  const u = getUserInfo();
  const img = $('#hand-avatar-img');
  img.src = u.photo;
  img.onerror = () => { img.onerror = null; img.src = initialAvatar(u.name, 96); };
  h.classList.add('active');
  updateHandPos(x, y);
}
function updateHandPos(x, y){
  const h = $('#hand-cursor');
  h.style.left = (x + 12) + 'px';
  h.style.top = (y + 12) + 'px';
}
function hideHand(){ $('#hand-cursor').classList.remove('active'); }

  load();
  renderHeader();
  renderTabs();
  initTabSlider();
  switchTab('friends');

  // Hide loader after content is mounted
  setTimeout(() => {
    const loading = $('#loading');
    if (loading) loading.classList.add('out');
  }, 900);
}

// Wait for DOM
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
