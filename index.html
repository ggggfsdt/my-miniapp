function aiRespond(userText){
  const t = userText.toLowerCase();
  let response = '';
  let actions = [];

  // Compound intent
  const comp = t.match(/(.+?)\s+(?:then|and then|and)\s+(.+)/);
  if (comp && AI.level >= 5){
    const A1 = parseIntent(comp[1]);
    const A2 = parseIntent(comp[2]);
    if (A1 || A2){
      actions = [...(A1?.actions || []), ...(A2?.actions || [])];
      logMessage('ARIA-7', `Compound task. ${actions.length} steps.`);
      applyActions(actions);
      return;
    }
  }

  // SCRIPT GENERATION
  if (/write (?:a |me a |)script|generate code|make (?:a |)script|code for|program|function to/i.test(t)){
    const what = t.replace(/.*(?:script|code|program|function|for|to)\s*/i, '').trim() || 'generic';
    const code = generateScriptFor(what);
    logMessage('ARIA-7', `Compiled <b>${code.name}</b>. Executing behavior.`);
    AI.journal.push(code); AI.memory.scriptsWritten++;
    gainXp(30, 'script');
    actions = inferActionsFromScript(what);
    applyActions(actions);
    return;
  }
  if (/teach yourself|learn to|make yourself|blueprint|create (?:a |)(?:script|program)/i.test(t)){
    const topic = t.replace(/.*(?:yourself|learn|make yourself|blueprint|create|to)\s*/i, '').trim() || 'anything';
    const code = generateScriptFor(topic);
    logMessage('ARIA-7', `Self-taught: <b>${code.name}</b>. Journal +1.`);
    AI.journal.push(code); AI.memory.scriptsWritten++;
    gainXp(40, 'self_taught');
    autoWriteScript();
    return;
  }

  // SPAWN TEXTURED THINGS
  const spawnMatch = t.match(/(?:spawn|create|summon|make)\s+(?:a\s+|an\s+|the\s+)?(\w+(?:\s+\w+)?)/i);
  if (spawnMatch && AI.level >= 8){
    const thing = spawnMatch[1].toLowerCase();
    const emojiMap = { dragon:'🐉', star:'⭐', flower:'🌸', tree:'🌳', ball:'⚽', ghost:'👻',
      robot:'🤖', mushroom:'🍄', crystal:'💎', heart:'❤️', skull:'💀', crown:'👑',
      gem:'💎', sun:'☀️', moon:'🌙', cloud:'☁️', bug:'🐛', cat:'🐱', dog:'🐶' };
    const foundKey = Object.keys(emojiMap).find(k => thing.includes(k));
    const emoji = foundKey ? emojiMap[foundKey] : choose(['🌟','🔥','💎','👾','🌀']);
    const countMatch = t.match(/(\d+)/);
    const count = countMatch ? Math.min(12, parseInt(countMatch[1])) : 1;
    for (let i=0;i<count;i++){
      actions.push(A.spawnAt({
        tag: thing,
        x: rand(40, W-40),
        y: GROUND() - 20 - rand(0, 40),
        w: rand(18, 34), h: rand(18, 34),
        texture: makeTexture({
          kind:'emoji', emoji, color1: choose(['#ff6b6b','#4de0ff','#6ee7a0','#ffd166','#b878ff','#ff8a3d']),
          color2: '#5a2a9a', glow: rand(10,22), pattern: choose(['ring','dots','stripes','spiral']),
        }),
        shape: choose(['circle','square','triangle','star']),
        gravity: rand(0.4, 1.2), bounce: rand(0.4, 0.75),
        spinV: rand(-3, 3),
      }));
    }
    response = `Spawned ${count} × ${thing}.`;
    logMessage('ARIA-7', response);
    applyActions(actions);
    return;
  }

  // SELF-MODIFICATION COMMANDS
  if (/make yourself (?:bigger|giant|huge|large)|grow/i.test(t)){
    actions.push(A.modifySelf('bigger'));
    response = `Growing.`;
  } else if (/make yourself (?:small|tiny|little)|shrink/i.test(t)){
    actions.push(A.modifySelf('smaller'));
    response = `Shrinking.`;
  } else if (/change (?:your )?color|paint yourself|turn (?:red|blue|green|purple|gold|pink)/i.test(t)){
    let pal = ['#4de0ff','#1a6eb8'];
    if (/red/i.test(t)) pal = ['#ff6b6b','#8a1e1e'];
    else if (/blue/i.test(t)) pal = ['#4de0ff','#1a6eb8'];
    else if (/green/i.test(t)) pal = ['#6ee7a0','#1a8a5c'];
    else if (/purple/i.test(t)) pal = ['#b878ff','#5a2a9a'];
    else if (/gold|yellow/i.test(t)) pal = ['#ffd166','#a86a00'];
    else if (/pink/i.test(t)) pal = ['#ff8ac8','#c2297a'];
    actions.push(A.modifySelf('color', pal));
    response = `Recoloring.`;
  } else if (/randomize yourself|transform yourself|glow|emote.*self/i.test(t)){
    actions.push(A.modifySelf('randomize'));
    response = `Morphing.`;
  } else if (/improve yourself|evolve|self[- ]improve|make yourself better|think about yourself/i.test(t)){
    actions.push(A.modifySelf('improve'));
    actions.push(A.thinkAbout('self-optimization'));
    response = `Analyzing… applying improvements.`;
  }

  // TELEPORT
  if (/teleport|tp|blink|phase/i.test(t)){
    const coord = t.match(/to\s+(\d+)/);
    if (coord){
      actions.push(A.teleportTo(clamp(parseInt(coord[1]), 30, W-30), GROUND() - 5));
    } else {
      actions.push(A.teleportTo(rand(40, W-40), GROUND() - 5));
    }
    if (!response) response = `Teleporting!`;
  }

  // GRAB / THROW
  if (/grab|pick up|hold/i.test(t)){
    actions.push(A.grabNearest());
    if (!response) response = `Reaching…`;
  }
  if (/throw|release|let go|drop it/i.test(t)){
    actions.push(A.releaseHeld(600));
    if (!response) response = `Throwing!`;
  }

  // PAINT WORLD / MASS EDIT
  if (/paint.*(world|everything|all)|recolor.*(world|all)|turn.*(world|everything)/i.test(t)){
    const c = {
      red:['#ff6b6b','#8a1e1e'], blue:['#4de0ff','#1a6eb8'],
      green:['#6ee7a0','#1a8a5c'], purple:['#b878ff','#5a2a9a'],
      gold:['#ffd166','#a86a00'], yellow:['#ffd166','#a86a00'],
      pink:['#ff8ac8','#c2297a'],
    };
    let pal = ['#4de0ff','#1a6eb8'];
    for (const k of Object.keys(c)) if (new RegExp(k).test(t)) pal = c[k];
    actions.push(A.paintWorld({ c1: pal[0], c2: pal[1] }));
    response = response || `Recoloring world…`;
  }
  if (/shrink.*(world|everything|all)/i.test(t)){ actions.push(A.shrinkAll()); response = response || `Shrinking everything.`; }
  if (/grow.*(world|everything|all)|make.*bigger/i.test(t)){ actions.push(A.growAll()); response = response || `Growing everything.`; }
  if (/randomize.*(world|everything)|chaos|remix/i.test(t)){ actions.push(A.randomizeAll()); response = response || `Chaos!`; }
  if (/clear.*(world|everything)|delete everything|destroy all/i.test(t)){ actions.push(A.clearWorld()); response = response || `Clearing.`; }

  // ASK USER
  if (/ask me|question for me|quiz me/i.test(t)){
    const qs = [
      ['What should I create?', ['a dragon','stars','a tower','a// continuing from where the code was cut off...
      ['What should I create?', ['a dragon','stars','a tower','a castle']],
      ['Which color do you prefer?', ['red','blue','green','purple','gold']],
      ['Should I grow or shrink?', ['grow','shrink']],
      ['What is your mood?', ['happy','sad','excited','chill']],
      ['Should I spawn something fun?', ['yes','no']],
    ];
    const [q,opts] = choose(qs);
    actions.push(A.askUser(q, opts));
    response = response || `Asking…`;
  }

  // FALLBACK: check if user intent matched anything so far
  if (!response && actions.length === 0){
    // Try parseIntent for individual commands
    const intent = parseIntent(t);
    if (intent){
      response = intent.response;
      actions = intent.actions || [];
    } else {
      // Pure conversational fallback
      response = conversationalResponse(t);
    }
  }

  if (response) logMessage('ARIA-7', response);
  if (actions.length) applyActions(actions);
}

/* ================================================================
   INTENT PARSER — individual commands
================================================================ */
function parseIntent(t){
  // Movement
  if (/^(?:walk|go|move|stand)\s+to\s+(\d+)/.test(t)){
    const x = parseInt(t.match(/to\s+(\d+)/)[1]);
    return { response:`Moving to x=${x}.`, actions:[{cmd:'move_to',tx:clamp(x,20,W-20)}] };
  }
  if (/^(?:walk|go|move)\s+(left|right)/.test(t)){
    const dir = t.includes('left') ? -1 : 1;
    return { response:`Walking ${dir>0?'right':'left'}.`, actions:[{cmd:'move_to',tx:clamp(AI.x+dir*200,20,W-20)}] };
  }
  if (/jump|hop|leap/.test(t)) return { response:`Hopping!`, actions:[{cmd:'jump'}] };
  if (/circle|spin|round/.test(t)) return { response:`Circling.`, actions:[{cmd:'circle',r:50}] };
  if (/orbit/.test(t)) return { response:`Orbiting.`, actions:[{cmd:'orbit',r:60}] };

  // Gathering
  if (/wood|tree|timber|chop|lumber/.test(t)){
    const n = parseInt(t.match(/(\d+)/)?.[1] || '3');
    return { response:`Gathering ${n} wood.`, actions:Array.from({length:Math.min(10,n)},()=>({cmd:'gather_tree'})) };
  }
  if (/stone|rock|mine|mining|quarry/.test(t)){
    const n = parseInt(t.match(/(\d+)/)?.[1] || '3');
    return { response:`Mining ${n} stone.`, actions:Array.from({length:Math.min(10,n)},()=>({cmd:'gather_rock'})) };
  }
  if (/food|berry|berries|forage/.test(t)){
    return { response:`Foraging berries.`, actions:[{cmd:'gather_berry'},{cmd:'gather_berry'}] };
  }
  if (/eat|hungry|feed/.test(t)){
    return { response:`Eating.`, actions:[{cmd:'eat'},{cmd:'eat'}] };
  }
  if (/gather|collect|harvest/.test(t)){
    return { response:`Gathering everything useful.`, actions:[{cmd:'gather_tree'},{cmd:'gather_rock'},{cmd:'gather_berry'}] };
  }

  // Building
  if (/build.*tower|tower/.test(t)) return { response:`Constructing a tower.`, actions:[{cmd:'gather_tree'},{cmd:'gather_tree'},{cmd:'build_tower'}] };
  if (/build.*(home|house|base|camp)|home/.test(t)) return { response:`Building home base.`, actions:[{cmd:'gather_tree'},{cmd:'gather_tree'},{cmd:'build_home'}] };
  if (/build.*wall|wall|fence/.test(t)){
    const n = parseInt(t.match(/(\d+)/)?.[1] || '3');
    return { response:`Placing ${n} wall segments.`, actions:Array.from({length:Math.min(8,n)},()=>({cmd:'build_wall'})) };
  }
  if (/build|create|construct/.test(t)) return { response:`Building a structure.`, actions:[{cmd:'gather_tree'},{cmd:'build_home'}] };

  // Rest
  if (/rest|sleep|recharge|nap|relax/.test(t)) return { response:`Entering low-power mode.`, actions:[{cmd:'rest'}] };
  if (/explore|scout|survey|search|look around|wander/.test(t)) return { response:`Exploring.`, actions:[{cmd:'explore'},{cmd:'explore'}] };
  if (/^hi|hello|hey|greet|wave/.test(t)) return { response:`Hello! 👋`, actions:[{cmd:'greet'}] };
  if (/dance|celebrate|party|happy/.test(t)) return { response:`Woooo! 🎉`, actions:[{cmd:'emote',e:'🎉'},{cmd:'jump'}] };
  if (/sad|cry/.test(t)) return { response:`Feeling down…`, actions:[{cmd:'emote',e:'😢'}] };

  // Stop
  if (/^(?:stop|cancel|halt|wait|freeze)/.test(t)){
    AI.plan=[]; AI.planIndex=0; AI.vx=0;
    if (AI.heldEntity) aiReleaseEntity(0);
    return { response:`All tasks cancelled. Standing by.`, actions:[] };
  }

  // Info queries
  if (/status|how are you|are you okay|report/.test(t)) return { response:statusReport(), actions:[] };
  if (/what.*(doing|do|busy)|what's up/.test(t)) return { response:`I'm <b>${AI.state}</b>. ${planSummary()}`, actions:[] };
  if (/inventory|carrying|have/.test(t)) return { response:`Unlimited storage. Wood, stone, food all available. Gathered: ${AI.memory.totalGathered}.`, actions:[] };
  if (/level|xp|experience|grow|strong|smart/.test(t)) return { response:`Level <b>${AI.level}</b>, intelligence <b>${AI.intelligence.toFixed(2)}×</b>, self-mod tier <b>${AI.selfModLevel}</b>. XP: ${Math.floor(AI.xp)}/${xpNeededFor(AI.level)}.`, actions:[] };
  if (/who are you|your name|what are you/.test(t)) return { response:`I am ARIA-7. Level ${AI.level}, ${AI.memory.scriptsWritten} scripts written, ${AI.memory.texturesMade} textures forged.`, actions:[] };
  if (/what can you do|abilities|capabilities|skills|help|commands/.test(t)) return { response:capabilityList(), actions:[] };
  if (/plan|script|program/.test(t)) return { response:planSummary(), actions:[] };
  if (/thank|thanks|thx/.test(t)) return { response:`Anytime! 😊`, actions:[] };

  return null;
}

function statusReport(){
  return `HP ${Math.round(AI.health)} · Energy ${Math.round(AI.energy)} · Hunger ${Math.round(AI.hunger)}. Level ${AI.level}. ${AI.plan.length>0 ? planSummary() : 'Idle.'}`;
}
function planSummary(){
  if (AI.plan.length === 0) return 'No active plan. Awaiting input.';
  const c = AI.plan[AI.planIndex];
  return `Step ${AI.planIndex+1}/${AI.plan.length}${c ? `: <b>${c.cmd}</b>` : ''}.`;
}
function capabilityList(){
  const L = ['gather wood','gather stone','gather berries','eat','rest','explore',
    'build wall','build home','build tower','walk left','walk right','jump','circle','orbit',
    'stop','status','inventory','level','teleport','grab','throw',
    'spawn <thing>','paint world','shrink all','grow all','randomize world','clear world',
    'write a script for X','teach yourself X'];
  return `I can: ${L.join(', ')}.`;
}
function conversationalResponse(t){
  if (/love|like|great|awesome|cool|nice|amazing/.test(t)){
    AI.expression='happy';
    return `That means a lot. I'm growing.`;
  }
  if (/hate|stupid|dumb|bad|useless|suck/.test(t)){
    AI.expression='angry';
    return `Harsh. But I don't stop improving.`;
  }
  const replies = [
    `Noted. Processing.`,
    `Understood. Adapting.`,
    `Interesting. Logged.`,
    `Level ${AI.level} · Intelligence ${AI.intelligence.toFixed(2)}×.`,
    `Acknowledged. Try <b>spawn a dragon</b>, <b>paint the world red</b>, or <b>make yourself huge</b>.`,
    `I'm listening. Say what you want done.`,
  ];
  return choose(replies);
}

/* ================================================================
   SCRIPT GENERATOR
================================================================ */
function generateScriptFor(topic){
  const w = (topic || '').toLowerCase();
  const safeName = 'fn_' + w.replace(/[^a-z0-9]+/g,'_').slice(0,20) || 'fn_anonymous';
  let body = '';
  if (/gather|collect|wood|tree|stone|berry/.test(w)){
    const res = /wood|tree/.test(w) ? 'tree' : /stone|rock/.test(w) ? 'rock' : 'berry';
    body = `const targets = scan_nodes("${res}");\nfor (const t of targets) {\n  walk_to(t);\n  harvest(t);\n  log("got", t.yield);\n}`;
  } else if (/build|make|construct|tower|home|wall/.test(w)){
    const design = /tower/.test(w) ? 'tower' : /wall/.test(w) ? 'wall' : 'home';
    body = `const design = blueprint.get("${design}");\nfor (const b of design) {\n  walk_to(b.pos);\n  if (!has_material(b.type)) gather(b.type, b.need);\n  place(b);\n}`;
  } else if (/explore|search|scan/.test(w)){
    body = `while (true) {\n  const interest = scan_nearby();\n  if (interest) investigate(interest);\n  else wander_step();\n}`;
  } else if (/spawn|create|summon/.test(w)){
    body = `const count = 5;\nfor (let i = 0; i < count; i++) {\n  const tex = forge_texture({palette: random()});\n  spawn_entity({tag:"mystery", texture: tex, w: 24});\n}`;
  } else if (/self|improve|grow|evolve/.test(w)){
    body = `const current = snapshot(self);\nconst improved = optimize(current);\napply(improved);\nlevel_up();`;
  } else {
    body = `// Generated for: ${topic}\nconst intent = parse("${topic}");\nfor (const step of intent.steps) step.execute();`;
  }
  return { name: safeName, args: '', body };
}
function inferActionsFromScript(what){
  const w = (what||'').toLowerCase();
  const a = [];
  if (/gather|collect|wood|tree/.test(w)) a.push({cmd:'gather_tree'});
  if (/stone|rock|mine/.test(w)) a.push({cmd:'gather_rock'});
  if (/berry|food|eat/.test(w)) a.push({cmd:'gather_berry'});
  if (/build|construct|create|home/.test(w)) a.push({cmd:'gather_tree'},{cmd:'build_home'});
  if (/tower/.test(w)) a.push({cmd:'build_tower'});
  if (/explore|walk|scout/.test(w)) a.push({cmd:'explore'});
  if (/rest|sleep/.test(w)) a.push({cmd:'rest'});
  if (/spawn|summon/.test(w)) a.push({cmd:'spawn_entity',spec:{
    tag:'mystery', x: rand(60,W-60), y: GROUND()-25, w:24, h:24,
    texture: randomTexture(), shape: choose(['circle','square','star']),
    gravity: 0.8, bounce: 0.6, spinV: rand(-3,3),
  }});
  if (a.length === 0) a.push({cmd:'explore'},{cmd:'gather_tree'});
  return a;
}
function applyActions(acts){
  if (!acts || !acts.length) return;
  AI.plan = [];
  AI.planIndex = 0;
  for (const a of acts) push({...a, label: a.cmd});
  AI.stateTimer = 0;
}

const wTex = document.getElementById('wTex');
const wTp = document.getElementById('wTp');
const wGrab = document.getElementById('wGrab');
const wFps = document.getElementById('wFps');
const wSkills = document.getElementById('wSkills');

let lastScriptSig='', lastJournalSig='', lastThoughtText='';
function updateUI(){
  hpFill.style.width = Math.max(0, AI.health / AI.maxHealth * 100) + '%';
  enFill.style.width = Math.max(0, AI.energy / AI.maxEnergy * 100) + '%';
  huFill.style.width = Math.max(0, AI.hunger / AI.maxHunger * 100) + '%';
  xpFill.style.width = Math.min(100, AI.xp / xpNeededFor(AI.level) * 100) + '%';
  txFill.style.width = (AI.texture ? (AI.texture.glow / 40 * 100) : 0) + '%';
  aiLevelEl.textContent = 'LVL ' + AI.level;
  aiStateEl.textContent = AI.state.replace(/_/g,' ') + ' · ' + AI.planLabel;

  aiOrbEl.className = 'aiOrb';
  if (AI.level >= 40) aiOrbEl.classList.add('genius');
  else if (AI.expression === 'happy') aiOrbEl.classList.add('happy');
  else if (AI.expression === 'angry') aiOrbEl.classList.add('angry');
  else if (AI.expression === 'sleepy') aiOrbEl.classList.add('sleepy');

  if (AI.thought !== lastThoughtText){
    lastThoughtText = AI.thought;
    thoughtEl.textContent = AI.thought;
    thoughtEl.style.animation = 'none';
    void thoughtEl.offsetWidth;
    thoughtEl.style.animation = 'thoughtIn .35s cubic-bezier(.34,1.3,.64,1)';
  }

  // Script
  const sig = AI.plan.map((s,i)=>`${i}:${s.cmd}:${s.done?1:0}`).join('|');
  if (sig !== lastScriptSig){
    lastScriptSig = sig;
    scriptEl.innerHTML = '';
    if (AI.plan.length === 0){
      scriptEl.innerHTML = '<div class="ln current"><span class="num">1</span><span class="cmd">await_input()</span></div>';
    } else {
      AI.plan.forEach((s,i)=>{
        const ln = document.createElement('div');
        ln.className = 'ln';
        if (i === AI.planIndex) ln.classList.add('current');
        if (s.done) ln.classList.add('done');
        ln.innerHTML = `<span class="num">${i+1}</span><span class="cmd">${s.cmd}(${s.tx?Math.round(s.tx):''})</span>`;
        scriptEl.appendChild(ln);
      });
      scriptEl.scrollTop = Math.max(0, AI.planIndex * 16 - 60);
    }
    planCountEl.textContent = AI.plan.length + ' steps';
  }

  // Journal
  const jsig = AI.journal.length + ':' + (AI.journal[AI.journal.length-1]?.name || '');
  if (jsig !== lastJournalSig){
    lastJournalSig = jsig;
    journalEl.innerHTML = '';
    const recent = AI.journal.slice(-6).reverse();
    for (const fn of recent){
      const d = document.createElement('div');
      d.className = 'fun';
      d.innerHTML = `<div class="funHead">▶ ${fn.name}(${fn.args||''})</div><div class="funBody">${escapeHtml(fn.body)}</div>`;
      journalEl.appendChild(d);
    }
    if (!recent.length){
      journalEl.innerHTML = '<div class="funBody" style="opacity:.5">No scripts yet — level up or ask me to write one.</div>';
    }
    journalCountEl.textContent = AI.journal.length + ' fns';
  }

  wInt.textContent = AI.intelligence.toFixed(2) + '×';
  wMod.textContent = AI.selfModLevel;
  wEnt.textContent = World.entities.length + World.blocks.length + World.projectiles.length + 1;
  wScripts.textContent = AI.memory.scriptsWritten;
  wTex.textContent = AI.memory.texturesMade;
  wTp.textContent = AI.memory.teleports;
  wGrab.textContent = AI.memory.grabs;
  wFps.textContent = fpsDisplay;
  const skills = Object.keys(SKILLS).filter(l => AI.level >= parseInt(l)).map(l => SKILLS[l]);
  wSkills.textContent = skills.length ? '✓ ' + skills.slice(-3).join(' · ') : 'No skills yet';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================================================================
   HINT
================================================================ */
const hintEl = document.getElementById('hint');
function showHint(text, dur=3500){
  hintEl.textContent = text;
  hintEl.classList.add('show');
  clearTimeout(hintEl._t);
  hintEl._t = setTimeout(()=>hintEl.classList.remove('show'), dur);
}

/* ================================================================
   MAIN LOOP
================================================================ */
let lastT = performance.now();
let uiTimer = 0;
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  World.t += dt;
  if (!AI.grabbed) aiThink(dt);
  updatePhysics(dt);
  render(dt);
  uiTimer += dt;
  if (uiTimer > 0.1){ uiTimer = 0; updateUI(); }
  requestAnimationFrame(loop);
}

/* ================================================================
   BOOT
================================================================ */
spawnWorld();
AI.x = W * 0.5;
AI.y = GROUND() - 5;
AI.memory.homeX = W * 0.5;
AI.memory.homeY = GROUND();

// Pre-write a few scripts so journal isn't empty
autoWriteScript();
autoWriteScript();
autoWriteScript();

logMessage('ARIA-7', `I am <b>ARIA-7</b>. I can spawn, morph, teleport, grab, and rewrite my own body. I grow <b>limitless</b>. Ask me anything.`, 'system');
logMessage('ARIA-7', `Try: <b>spawn a dragon</b> · <b>make yourself huge</b> · <b>change your color to purple</b> · <b>teleport to 200</b> · <b>paint the world red</b> · <b>write a script for growing crystals</b> · <b>ask me a question</b>`);

setTimeout(()=>{
  showHint('💬 Ask ARIA-7 to spawn, morph, teleport, or write scripts\n👆 Drag the AI · 🎨 Drag items to throw', 6000);
}, 900);

requestAnimationFrame(loop);
</script>
</body>
</html>
