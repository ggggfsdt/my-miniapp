<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dlballs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#050506;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

/* ============ STAGE ============ */
#dl{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(ellipse 120% 80% at 50% -10%,#1c1c24 0%,transparent 55%),
  radial-gradient(ellipse 100% 60% at 50% 110%,#14141c 0%,transparent 60%),
  linear-gradient(180deg,#08080c 0%,#04040a 100%)}

/* Aurora sweep overlay */
.dl-aurora{position:absolute;inset:-15%;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(circle at 22% 18%,rgba(120,80,255,.16) 0%,transparent 32%),
    radial-gradient(circle at 80% 62%,rgba(255,80,180,.13) 0%,transparent 32%),
    radial-gradient(circle at 48% 96%,rgba(80,220,255,.10) 0%,transparent 38%);
  animation:dlAurora 22s ease-in-out infinite;filter:blur(30px)}
@keyframes dlAurora{0%,100%{opacity:.55;transform:scale(1) translate(0,0)}
  50%{opacity:1;transform:scale(1.12) translate(-2%,1.5%)}}

#dl::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}

#dl-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* ============ TOP PILLS ============ */
.dl-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;z-index:10;
  display:flex;align-items:center;gap:6px;pointer-events:none}
.dl-pill{position:relative;display:flex;align-items:center;gap:5px;height:30px;padding:0 12px;
  background:linear-gradient(135deg,rgba(22,22,30,.92) 0%,rgba(12,12,18,.88) 100%);
  border:1px solid rgba(255,255,255,.10);border-radius:15px;
  font-size:11px;font-weight:600;pointer-events:auto;flex-shrink:0;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.4);
  backdrop-filter:blur(20px) saturate(140%)}
.dl-pill::after{content:'';position:absolute;top:0;left:0;width:35%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  transform:translateX(-200%);animation:dlPillShine 5.5s ease-in-out infinite;pointer-events:none}
.dl-pill:nth-child(2)::after{animation-delay:1.5s}
.dl-pill:nth-child(3)::after{animation-delay:3s}
@keyframes dlPillShine{0%,75%,100%{transform:translateX(-200%)}88%{transform:translateX(420%)}}

.dl-pill .lbl{color:rgba(255,255,255,.42);font-size:9px;letter-spacing:1px;font-weight:800}
.dl-pill .val{color:#fff;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.2px}
.dl-pill.pot{border-color:rgba(255,220,80,.35);
  box-shadow:0 4px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),0 0 22px rgba(255,220,80,.14)}
.dl-pill.pot .val{color:#ffdd44;text-shadow:0 0 12px rgba(255,220,80,.55)}
.dl-pill.map{border-color:rgba(120,200,255,.32);
  box-shadow:0 4px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),0 0 22px rgba(120,200,255,.12)}
.dl-pill.map .val{color:#7fc8ff;font-size:10px;text-shadow:0 0 10px rgba(120,200,255,.5)}

.dl-pill.bal-flash{animation:dlBalFlash .55s ease-out}
@keyframes dlBalFlash{0%{box-shadow:0 4px 20px rgba(0,0,0,.55),0 0 0 rgba(255,220,80,0)}
  40%{box-shadow:0 4px 20px rgba(0,0,0,.55),0 0 30px rgba(255,220,80,.8),inset 0 0 0 1px rgba(255,220,80,.5)}
  100%{box-shadow:0 4px 20px rgba(0,0,0,.55),0 0 0 rgba(255,220,80,0)}}

.diamond-mini{width:14px;height:14px;object-fit:contain;flex-shrink:0;
  animation:dlDP 2.2s ease-in-out infinite;
  filter:drop-shadow(0 0 4px rgba(255,220,80,.5))}
@keyframes dlDP{0%,100%{filter:drop-shadow(0 0 3px rgba(255,220,80,.4))}
  50%{filter:drop-shadow(0 0 9px rgba(255,220,80,1)) brightness(1.2);transform:scale(1.08)}}

.dl-close{margin-left:auto;width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(135deg,rgba(22,22,30,.92),rgba(12,12,18,.88));
  color:rgba(255,255,255,.85);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;
  pointer-events:auto;flex-shrink:0;backdrop-filter:blur(20px);
  box-shadow:0 4px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.dl-close:active{transform:scale(.88);background:rgba(255,80,80,.22)}

/* ============ TICKER ============ */
.dl-ticker{position:absolute;top:calc(env(safe-area-inset-top,0px) + 48px);left:10px;right:10px;z-index:9;
  display:flex;gap:5px;overflow:hidden;pointer-events:none;height:22px;align-items:center;
  mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
.dl-ticker .chip{flex-shrink:0;
  background:linear-gradient(135deg,rgba(20,20,28,.92),rgba(10,10,16,.88));
  border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:3px 10px;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;
  display:flex;align-items:center;gap:5px;animation:dlCI .55s cubic-bezier(.2,1.2,.3,1);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.dl-ticker .chip .amt{color:#8fe5b0;font-weight:900;text-shadow:0 0 10px rgba(140,230,180,.5)}
.dl-ticker .chip img{width:11px;height:11px}
@keyframes dlCI{0%{transform:translateY(-14px) scale(.7);opacity:0}
  60%{transform:translateY(2px) scale(1.05)}
  100%{transform:translateY(0) scale(1);opacity:1}}

/* ============ MAP BAR ============ */
.dl-mapbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);left:8px;right:8px;z-index:11;
  display:flex;gap:5px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.dl-mapbar button{position:relative;pointer-events:auto;height:26px;padding:0 11px;border-radius:9px;
  background:linear-gradient(135deg,rgba(16,16,24,.90),rgba(8,8,14,.86));
  border:1px solid rgba(255,255,255,.10);
  color:rgba(255,255,255,.62);font-size:10px;font-weight:800;
  cursor:pointer;font-family:inherit;letter-spacing:.3px;
  transition:transform .15s,background .18s,color .18s,border-color .18s,box-shadow .18s;
  backdrop-filter:blur(14px);
  box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.dl-mapbar button:active{transform:scale(.93)}
.dl-mapbar button.on{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.12));
  color:#fff;border-color:rgba(255,255,255,.42);
  box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35),0 0 20px rgba(255,255,255,.28);
  animation:dlMapPulse 2.4s ease-in-out infinite}
@keyframes dlMapPulse{0%,100%{box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35),0 0 20px rgba(255,255,255,.28)}
  50%{box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35),0 0 32px rgba(255,255,255,.45)}}

/* ============ BOTTOM BUTTONS ============ */
.dl-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;right:14px;z-index:10;
  display:flex;gap:10px}
.dl-btn{position:relative;flex:1;height:48px;border-radius:15px;border:none;
  font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .18s;
  overflow:hidden;letter-spacing:.3px}
.dl-btn:active{transform:scale(.96)}
.dl-btn:disabled{opacity:.32;pointer-events:none}
.dl-btn-buy{background:linear-gradient(135deg,rgba(28,28,38,.95),rgba(14,14,22,.92));
  color:#fff;border:1px solid rgba(255,255,255,.11);
  box-shadow:0 6px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.4)}
.dl-btn-buy::before{content:'';position:absolute;top:0;left:-35%;width:35%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  transform:translateX(-100%);animation:dlBtnSweep 4s ease-in-out infinite}
.dl-btn-launch{background:linear-gradient(135deg,#ffffff 0%,#e2e2ea 55%,#c4c4d0 100%);
  color:#0a0a10;
  box-shadow:0 8px 28px rgba(255,255,255,.28),0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,1),inset 0 -2px 0 rgba(0,0,0,.14)}
.dl-btn-launch:not(:disabled)::before{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
  transform:translateX(-100%);animation:dlBtnSweep 2.6s ease-in-out infinite}
@keyframes dlBtnSweep{0%,70%,100%{transform:translateX(-100%)}88%{transform:translateX(380%)}}
.dl-btn .ripple{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);
  transform:scale(0);animation:dlRipple .55s ease-out;opacity:.85}
@keyframes dlRipple{to{transform:scale(1);opacity:0}}

/* ============ MODAL ============ */
.dl-modal{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(14px) saturate(120%)}
.dl-modal.show{display:flex;animation:dlF .22s ease}
@keyframes dlF{from{opacity:0}to{opacity:1}}
.dl-sheet{width:100%;max-width:440px;background:linear-gradient(180deg,#13131a 0%,#0a0a10 100%);
  border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  border-top:1px solid rgba(255,255,255,.10);
  box-shadow:0 -20px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.07);
  animation:dlSU .38s cubic-bezier(.2,1.15,.35,1.05)}
@keyframes dlSU{0%{transform:translateY(100%)}60%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.dl-grip{width:42px;height:4px;background:rgba(255,255,255,.18);border-radius:3px;margin:0 auto 14px}
.dl-sheet h3{font-size:15.5px;font-weight:800;color:#fff;text-align:center;margin-bottom:16px;letter-spacing:.2px}
.dl-sheet h3 small{color:rgba(255,255,255,.4);font-size:11px;font-weight:500}
.dl-seg{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:14px;
  border:1px solid rgba(255,255,255,.04)}
.dl-seg button{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;
  color:rgba(255,255,255,.5);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
  transition:background .18s,color .18s}
.dl-seg button.on{background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.10));
  color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.dl-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.dl-row.inline{flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:14px}
.dl-row label{font-size:10px;color:rgba(255,255,255,.42);letter-spacing:.9px;text-transform:uppercase;font-weight:800;padding-left:2px}
.dl-row.inline label{font-size:13px;color:#fff;letter-spacing:0;text-transform:none;font-weight:700;padding:0}
.dl-row .sub{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:1px;padding-left:2px}
.dl-input{width:100%;height:46px;padding:0 14px;border-radius:12px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);
  color:#fff;font-size:16px;font-weight:800;text-align:center;outline:none;font-family:inherit;
  font-variant-numeric:tabular-nums;transition:border-color .18s,box-shadow .18s,background .18s}
.dl-input:focus{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08)}
.dl-hint{font-size:10.5px;color:rgba(255,255,255,.38);line-height:1.55;padding:0 2px}
.dl-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.dl-tier{padding:11px 2px;border-radius:11px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);color:#fff;cursor:pointer;font-size:10px;font-weight:800;
  text-align:center;font-family:inherit;line-height:1.4;display:flex;flex-direction:column;
  align-items:center;gap:4px;transition:transform .15s,border-color .18s,background .18s,box-shadow .18s}
.dl-tier:active{transform:scale(.95)}
.dl-tier .dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.5)}
.dl-tier .dot.gray{background:radial-gradient(circle at 32% 28%,#e8e8ee 0%,#8a8a92 55%,#3a3a40 100%)}
.dl-tier .dot.silver{background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d0d0dc 45%,#5a5a70 100%)}
.dl-tier .dot.green{background:radial-gradient(circle at 32% 28%,#e0ffe8 0%,#30c977 50%,#0a3a20 100%)}
.dl-tier .dot.gold{background:radial-gradient(circle at 32% 28%,#fffbd0 0%,#ffcc33 45%,#8a5a10 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 14px rgba(255,204,51,.55)}
.dl-tier small{font-size:9.5px;color:rgba(255,255,255,.55);font-weight:700}
.dl-tier.on{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12);
  box-shadow:0 0 22px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.25);transform:scale(1.02)}
.dl-switch{position:relative;width:46px;height:28px;flex-shrink:0;cursor:pointer}
.dl-switch input{opacity:0;width:0;height:0;position:absolute}
.dl-switch-slider{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:999px;transition:.24s;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.dl-switch-slider::before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;
  background:#fff;border-radius:50%;transition:.24s cubic-bezier(.3,1.3,.4,1);
  box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dl-switch input:checked + .dl-switch-slider{background:linear-gradient(135deg,#3aa55a,#2a8050);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 0 14px rgba(58,165,90,.5)}
.dl-switch input:checked + .dl-switch-slider::before{transform:translateX(18px)}
.dl-actions{display:flex;gap:8px;margin-top:6px}
.dl-actions button{flex:1;height:46px;border-radius:12px;border:none;font-weight:800;font-size:13.5px;
  cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .18s}
.dl-actions button:active{transform:scale(.96)}
.dl-cancel{background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.dl-confirm{background:linear-gradient(135deg,#ffffff,#e2e2ea);color:#0a0a10;
  box-shadow:0 6px 22px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,1)}

/* ============ RESULT ============ */
.dl-result{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.86);backdrop-filter:blur(16px) saturate(130%);padding:20px}
.dl-result.show{display:flex;animation:dlF .25s ease}
.dl-result-box{position:relative;width:100%;max-width:360px;
  background:linear-gradient(180deg,#15151d 0%,#0a0a10 100%);
  border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:28px 22px;
  text-align:center;animation:dlPP .5s cubic-bezier(.2,1.4,.35,1);
  box-shadow:0 20px 70px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.09),0 0 60px rgba(255,255,255,.05)}
@keyframes dlPP{0%{transform:scale(.82);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.dl-res-tag{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2.5px;text-transform:uppercase;font-weight:800}
.dl-res-amt{font-size:48px;font-weight:900;color:#fff;margin:12px 0 4px;letter-spacing:-2px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  text-shadow:0 0 30px rgba(255,220,80,.55);animation:dlAmtPop .6s cubic-bezier(.2,1.4,.35,1)}
@keyframes dlAmtPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.dl-res-amt img{width:34px;height:34px;filter:drop-shadow(0 0 14px rgba(255,220,80,.8))}
.dl-res-amt.lose{color:#7a7a82;text-shadow:none}
.dl-res-amt.lose img{filter:grayscale(1) opacity(.5)}
.dl-res-mult{font-size:24px;font-weight:900;color:#ffdd44;margin-bottom:6px;letter-spacing:-0.6px;
  text-shadow:0 0 20px rgba(255,220,80,.5)}
.dl-res-mult.lose{color:#6a6a72;text-shadow:none}
.dl-res-sub{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:20px}

/* ============ ROULETTE ============ */
.dl-r{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px 16px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%,#181820 0%,#08080c 65%,#020205 100%)}
.dl-r::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(255,220,80,.06) 0%,transparent 55%);
  animation:dlRPulse 2s ease-in-out infinite}
@keyframes dlRPulse{0%,100%{opacity:.5}50%{opacity:1}}
.dl-r.show{display:flex;animation:dlF .22s ease}
.dl-r-title{position:relative;font-size:11.5px;color:rgba(255,255,255,.7);letter-spacing:3px;text-transform:uppercase;
  font-weight:900;min-height:14px;text-align:center;text-shadow:0 0 20px rgba(255,255,255,.4)}
.dl-r-rows{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.dl-r-row{position:relative;flex-shrink:0;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(30,30,40,.9),rgba(8,8,14,.96));
  border:1px solid rgba(255,255,255,.08);contain:layout paint;
  box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.dl-r-viewport{position:absolute;inset:0;overflow:hidden}
.dl-r-ball{position:absolute;left:50%;top:50%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-family:-apple-system,system-ui,sans-serif;backface-visibility:hidden;transform-origin:50% 50%;
  will-change:transform,opacity;box-shadow:inset 0 2px 4px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.6)}
.dl-r-ball.gray{background:radial-gradient(circle at 32% 28%,#e8e8ee 0%,#8a8a92 55%,#3a3a40 100%);color:#101014}
.dl-r-ball.silver{background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d0d0dc 45%,#5a5a70 100%);color:#15151e}
.dl-r-ball.green{background:radial-gradient(circle at 32% 28%,#e0ffe8 0%,#30c977 50%,#0a3a20 100%);color:#042a18}
.dl-r-ball.gold{background:radial-gradient(circle at 32% 28%,#fffbd0 0%,#ffcc33 45%,#8a5a10 100%);color:#3a2000;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.6),inset 0 -3px 8px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.6),0 0 22px rgba(255,204,51,.6)}
.dl-r-ball.winner::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid #fff;
  animation:dlWR 1s ease-in-out infinite;box-shadow:0 0 20px #fff,inset 0 0 14px rgba(255,255,255,.6)}
@keyframes dlWR{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
.dl-r-ball.winner{animation:dlWinPop .55s cubic-bezier(.2,1.4,.35,1)}
@keyframes dlWinPop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.dl-r-pointer{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  font-size:14px;color:#fff;font-weight:900;text-shadow:0 0 14px #fff,0 0 4px #fff;pointer-events:none;z-index:500}
.dl-r-amount{position:relative;font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px;
  opacity:0;transform:scale(.7);transition:.4s cubic-bezier(.2,1.4,.35,1);
  min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px;
  text-shadow:0 0 30px rgba(255,220,80,.6)}

      MAP.bars.push({

  const baseA = Math.random()*Math.PI*2;

function createGifCanvas(src, initialSize){

function buildPuckArena(A){
  const halfW = A.w/2, halfH = A.h/2;
  const leftX = A.cx - halfW, rightX = A.cx + halfW;
  const topY  = A.cy + halfH, botY  = A.cy - halfH;

  function seg(x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + A.wallT, A.wallT, 32), arenaMat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0);
    m.rotation.z = ang;
    addOutline(m,1.06);
    mapGroup.add(m);
    WALLS.push({x1,y1,x2,y2,thick:A.wallT/2});
  }
  seg(leftX, topY, -A.topOpeningW/2, topY);
  seg(A.topOpeningW/2, topY, rightX, topY);
  const bots = [...A.bottomOpenings].sort((a,b)=>a.x-b.x);
  let prevX = leftX;
  for (const o of bots){
    seg(prevX, botY, A.cx + o.x - o.w/2, botY);
    prevX = A.cx + o.x + o.w/2;
  }
  seg(prevX, botY, rightX, botY);
  if (A.sideOpening.side === 'left'){
    const yT = A.sideOpening.y + A.sideOpening.w/2;
    const yB = A.sideOpening.y - A.sideOpening.w/2;
    seg(leftX, topY, leftX, yT);
    seg(leftX, yB, leftX, botY);
    seg(rightX, topY, rightX, botY);
  } else {
    const yT = A.sideOpening.y + A.sideOpening.w/2;
    const yB = A.sideOpening.y - A.sideOpening.w/2;
    seg(rightX, topY, rightX, yT);
    seg(rightX, yB, rightX, botY);
    seg(leftX, topY, leftX, botY);
  }

  puckGroup = new THREE.Group();
  const pR = A.puck.r;
  const ringMatP = new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.9,roughness:0.15,emissive:0xa0a0b0,emissiveIntensity:0.9});
  puckGroup.add(new THREE.Mesh(new THREE.TorusGeometry(pR, 5, 14, 40), ringMatP));
  puckGroup.add(new THREE.Mesh(new THREE.TorusGeometry(pR - 5, 1.2, 8, 32), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.5})));
  const crossMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.4,depthWrite:false});
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(pR*1.75, 4, 4), crossMat));
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(4, pR*1.75, 4), crossMat));
  const glow = new THREE.Mesh(new THREE.CircleGeometry(pR*0.9, 24), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.08,depthWrite:false}));
  glow.position.z = -1;
  puckGroup.add(glow);
  puckGroup.position.set(A.puck.x, A.puck.y, 0);
  mapGroup.add(puckGroup);
  A.puck.group = puckGroup;
}

function buildDartBox(D){
  const halfW = D.w/2, halfH = D.h/2;
  const leftX = D.cx - halfW, rightX = D.cx + halfW;
  const topY  = D.cy + halfH, botY  = D.cy - halfH;

  function seg(x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + D.wallT, D.wallT, 32), arenaMat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0);
    m.rotation.z = ang;
    addOutline(m,1.06);
    mapGroup.add(m);
    WALLS.push({x1,y1,x2,y2,thick:D.wallT/2});
  }

  // Top wall with a single opening (balls enter here)
  seg(leftX, topY, -D.topOpeningW/2, topY);
  seg(D.topOpeningW/2, topY, rightX, topY);

  // Bottom wall: ONE center opening
  const bo = D.bottomOpenings[0];
  seg(leftX, botY, D.cx + bo.x - bo.w/2, botY);
  seg(D.cx + bo.x + bo.w/2, botY, rightX, botY);

  // Side walls: ONE small opening on left + ONE small opening on right
  const sY = D.sideOpening.y;
  const sH = D.sideOpening.h;
  const sTop = sY + sH/2;
  const sBot = sY - sH/2;
  seg(leftX, topY, leftX, sTop);
  seg(leftX, sBot, leftX, botY);
  seg(rightX, topY, rightX, sTop);
  seg(rightX, sBot, rightX, botY);

  // Dartboard — alternating RED + WHITE only, deep black outer
  const R = 130;
  const layers = [
    { r: R,        mat: DART_BLACK, z: -10 },
    { r: R*0.94,   mat: DART_RED,   z: -9  },
    { r: R*0.80,   mat: DART_WHITE, z: -8  },
    { r: R*0.62,   mat: DART_RED,   z: -7  },
    { r: R*0.44,   mat: DART_WHITE, z: -6  },
    { r: R*0.28,   mat: DART_RED,   z: -5  },
    { r: R*0.12,   mat: DART_WHITE, z: -4  },
  ];
  layers.forEach(L => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(L.r, 48), L.mat);
    m.position.set(D.cx, D.cy, L.z);
    mapGroup.add(m);
  });
  [R*0.94, R*0.80, R*0.62, R*0.44, R*0.28, R*0.12].forEach((rr, i) => {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(rr - 1.5, rr + 1.5, 40),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.75 })
    );
    ring.position.set(D.cx, D.cy, -9 + i*0.1);
    mapGroup.add(ring);
  });
  const crossX = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 1), new THREE.MeshBasicMaterial({color: 0xff2020}));
  const crossY = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 1), new THREE.MeshBasicMaterial({color: 0xff2020}));
  crossX.position.set(D.cx, D.cy, -3);
  crossY.position.set(D.cx, D.cy, -3);
  mapGroup.add(crossX, crossY);

  D.shootTimer = 0;
  D.active = null;
}

function isBallInDartBox(b){
  const D = MAP.dartBox;
  if (!D) return false;
  const left = D.cx - D.w/2 + D.wallT;
  const right = D.cx + D.w/2 - D.wallT;
  const bot = D.cy - D.h/2 + D.wallT;
  const top = D.cy + D.h/2 - D.wallT;
  return b.x > left && b.x < right && b.y > bot && b.y < top;
}

function buildBowl(cfg){
  const g = new THREE.Group();
  g.position.set(0, cfg.cy, 0);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(cfg.rimR+cfg.wallT/2, cfg.rimR+cfg.wallT/2, cfg.wallH, 56, 1, true), rimMat);
  rim.position.y = cfg.wallH/2;
  g.add(rim);
  const fs = new THREE.Shape();
  fs.absarc(0,0,cfg.rimR,0,Math.PI*2,false);
  for (const h of cfg.holes){
    const hp = new THREE.Path();
    hp.absarc(Math.cos(h.a)*h.r, Math.sin(h.a)*h.r, cfg.holeR, 0, Math.PI*2, true);
    fs.holes.push(hp);
  }
  const fm = new THREE.Mesh(new THREE.ExtrudeGeometry(fs,{depth:6,bevelEnabled:false,curveSegments:40}), floorMat);
  fm.rotation.x = Math.PI/2;
  g.add(fm);

  cfg.holes.forEach(h => {
    const hx = Math.cos(h.a)*h.r, hz = Math.sin(h.a)*h.r;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(cfg.holeR+2, 3, 8, 24), h.red ? ringRedMat : ringWhiteMat);
    ring.rotation.x = -Math.PI/2;
    ring.position.set(hx, 1, hz);
    g.add(ring);

    // Multiplier label floating above the hole
    const label = makeMultSprite('×' + h.mult.toFixed(1), h.red ? '#ff5577' : '#ffffff');
    label.position.set(hx, 62, hz);
    g.add(label);
  });

  mapGroup.add(g);
}

function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, ls=dx*dx+dy*dy;
  if (ls<1e-6) return {x:ax,y:ay};
  let t = ((px-ax)*dx + (py-ay)*dy)/ls;
  t = Math.max(0,Math.min(1,t));
  return {x:ax+t*dx, y:ay+t*dy};
}
function collideSeg(b,ax,ay,bx,by,thick,rest){
  const c = closestOnSeg(b.x,b.y,ax,ay,bx,by);
  const dx = b.x-c.x, dy = b.y-c.y, d2 = dx*dx+dy*dy;
  const minD = b.r + thick;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
  b.x += nx*(minD-d); b.y += ny*(minD-d);
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny;
    b.squash = Math.min(1, Math.abs(vn)/620);
    return true;
  }
  return true;
}
function collideCircle(b,cx,cy,cr,rest){
  const dx = b.x-cx, dy = b.y-cy, minD = b.r+cr, d2 = dx*dx+dy*dy;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
  b.x = cx + nx*minD; b.y = cy + ny*minD;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny;
    b.squash = Math.min(1, Math.abs(vn)/620);
    return true;
  }
  return false;
}
function pointInTri(px,py,ax,ay,bx,by,cx,cy){
  const d1 = (px-bx)*(ay-by)-(ax-bx)*(py-by);
  const d2 = (px-cx)*(by-cy)-(bx-cx)*(py-cy);
  const d3 = (px-ax)*(cy-ay)-(cx-ax)*(py-ay);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
const REST_TRI = 0.5;
function resolveTriangle(b){
  if (!triMesh) return;
  const tipX = G.triX, tipY = MAP.triTipY;
  const blx = G.triX - MAP.triHalf, bly = MAP.triBaseY;
  const brx = G.triX + MAP.triHalf, bry = MAP.triBaseY;
  const pad = b.r + 6;
  if (b.x < Math.min(tipX,blx,brx)-pad || b.x > Math.max(tipX,blx,brx)+pad) return;
  if (b.y < Math.min(tipY,bly,bry)-pad || b.y > Math.max(tipY,bly,bry)+pad) return;
  if (pointInTri(b.x,b.y,tipX,tipY,blx,bly,brx,bry)){
    const side = (b.x-tipX) >= 0 ? 1 : -1;
    const sx = side>0 ? brx : blx, sy = side>0 ? bry : bly;
    const c = closestOnSeg(b.x,b.y,tipX,tipY,sx,sy);
    const dx = b.x-c.x, dy = b.y-c.y, dd = Math.hypot(dx,dy)||0.001;
    b.x = c.x + (dx/dd)*(b.r+3);
    b.y = c.y + (dy/dd)*(b.r+3);
    const vn = b.vx*(dx/dd)+b.vy*(dy/dd);
    if (vn < 0){ b.vx -= (1+REST_TRI)*vn*(dx/dd); b.vy -= (1+REST_TRI)*vn*(dy/dd); }
    b.vx += side*100; b.squash = 0.85;
    return;
  }
  const hL = collideSeg(b,tipX,tipY,blx,bly,3,REST_TRI);
  const hR = collideSeg(b,tipX,tipY,brx,bry,3,REST_TRI);
  if (hL||hR){
    const side = (b.x-tipX) >= 0 ? 1 : -1;
    b.vx += side*80;
  }
}
const REST_BAR = 0.5;
function resolveBar(b,bar){
  const dy = b.y - bar.y;
  if (Math.abs(dy) > b.r+8) return;
  const dx = b.x - bar.x;
  if (Math.abs(dx) > bar.halfW + b.r) return;
  if (Math.abs(dx) < bar.halfW){
    const dir = dy >= 0 ? 1 : -1;
    b.y = bar.y + dir*(b.r+7);
    const vn = b.vy*dir;
    if (vn < 0) b.vy -= (1+REST_BAR)*vn*dir;
    else b.vy = -Math.abs(b.vy)*0.3;
    b.squash = Math.max(b.squash, 0.7);
    const vel = bar.x - bar.prevX;
    if (vel !== 0) b.vx += Math.sign(vel) * 80;
  }
}
function resolveBricks(b){
  if (!MAP.brickWall) return false;
  for (const br of MAP.brickWall.bricks){
    if (br.dead) continue;
    const dx = b.x - br.x;
    const dy = b.y - br.y;
    const overlapX = (br.w/2 + b.r) - Math.abs(dx);
    const overlapY = (br.h/2 + b.r) - Math.abs(dy);
    if (overlapX > 0 && overlapY > 0){
      if (overlapY < overlapX){
        const dir = dy > 0 ? 1 : -1;
        b.y = br.y + dir * (br.h/2 + b.r + 1);
        b.vy = 0;
      } else {
        const dir = dx > 0 ? 1 : -1;
        b.x = br.x + dir * (br.w/2 + b.r + 1);
        b.vx *= 0.5;
      }
      br.hits++;
      br.shake = 1.0;
      if (br.hits === 1){ br.mesh.material = BRICK_CRACKED.clone(); }
      else if (br.hits >= 2){
        br.dead = true;
        br.mesh.visible = false;
        for (let i=0;i<10;i++){
          const mat = new THREE.MeshBasicMaterial({color: 0x8a4a2a, transparent:true});
          const deb = new THREE.Mesh(new THREE.BoxGeometry(5,3,3), mat);
          deb.position.set(br.x, br.y, 0);
          scene.add(deb);
          G.particles.push({
            mesh:deb,
            vx:(Math.random()-0.5)*400,
            vy:150+Math.random()*400,
            vz:(Math.random()-0.5)*200,
            life:1.4, gravity:600,
          });
        }
      }
      b.y = MAP.brickWall.centerY + (MAP.brickWall.rows * MAP.brickWall.brickH) + 100;
      b.vy = -30;
      b.vx = (Math.random()-0.5)*200;
      haptic();
      G.shake = Math.min(1, G.shake + 0.35);
      return true;
    }
  }
  return false;
}

function resolveDartBricks(b){
  if (!DARTBRICKS.length) return false;
  let hit = false;
  for (const br of DARTBRICKS){
    const dx = b.x - br.x;
    const dy = b.y - br.y;
    const overlapX = (br.w/2 + b.r) - Math.abs(dx);
    const overlapY = (br.h/2 + b.r) - Math.abs(dy);
    if (overlapX > 0 && overlapY > 0){
      if (overlapY < overlapX){
        const dir = dy > 0 ? 1 : -1;
        b.y = br.y + dir * (br.h/2 + b.r + 1);
        if (b.vy * dir < 0) b.vy = -b.vy * 0.55;
      } else {
        const dir = dx > 0 ? 1 : -1;
        b.x = br.x + dir * (br.w/2 + b.r + 1);
        b.vx = -b.vx * 0.55;
      }
      br.shake = 1.0;
      b.squash = 0.9;
      hit = true;
    }
  }
  return hit;
}

// ===== Purple jelly platform collision (brick map) =====
function collideJelly(b){
  if (!JELLY.length) return false;
  for (let i = 0; i < JELLY.length; i++){
    const j = JELLY[i];
    // Visual top accounts for current squeeze
    const curHalfH = j.halfH * (1 - j.squeeze * 0.5);
    const dx = b.x - j.x;
    const dy = b.y - j.y;
    const overlapX = (j.halfW + b.r) - Math.abs(dx);
    const overlapY = (curHalfH + b.r) - Math.abs(dy);
    if (overlapX <= 0 || overlapY <= 0) continue;

    if (overlapY < overlapX){
      // Vertical contact
      const dir = dy > 0 ? 1 : -1;
      b.y = j.y + dir * (curHalfH + b.r + 0.5);
      if (dir > 0 && b.vy < 0){
        // BOUNCE off top — jelly energy
        b.vy = -b.vy * 0.92 + 30;
        b.vx += (dx / j.halfW) * 180;
        b.squash = Math.min(1, Math.abs(b.vy) / 500);
        j.squeeze = Math.min(0.85, j.squeeze + 0.6);
        j.squeezeVel = -j.squeeze * 9;
        haptic();
      } else {
        b.vy = -b.vy * 0.35;
      }
    } else {
      // Side contact
      const dir = dx > 0 ? 1 : -1;
      b.x = j.x + dir * (j.halfW + b.r + 0.5);
      b.vx = -b.vx * 0.5;
      j.squeeze = Math.min(0.6, j.squeeze + 0.28);
      j.squeezeVel = -j.squeeze * 7;
    }
    return true;
  }
  return false;
}

const GRAV = 520, AIR = 0.9992, REST_WALL = 0.42, REST_PEG = 0.55;

function spawnBall(value, tier, spawnDelay){
  const a = Math.random()*Math.PI*2, rad = Math.random()*16;
  const b = {
    value, tier, r: ballR(value),
    x: Math.cos(a)*rad, y: MAP.spinCy + Math.sin(a)*rad, z: 0,
    vx: (Math.random()-0.5)*60, vy: (Math.random()-0.5)*60,
    state:'held', popT:-(spawnDelay||0), scale:0,
    theta:0,rad:0,omega:0,bowlNum:0,orbitT:0,
    stall:0,squash:0,spin:0,
    mesh: makeBallMesh(value,tier), dead:false,
    dropTargetY:0, holeTarget:null, holeT:0,
    hoverT:0, hoverDuration:0.55,
    hoverStartTheta:0, hoverEndTheta:0, holeStartY:0,
    escT:0, escFromX:0, escFromY:0, escFromZ:0, escToX:0, escToY:0, escToZ:0,
    escapedBowl2:false, slowMoDone:false,
    lastX:0, lastY:0, stuckCheckT:0, stuckCount:0,
  };
  b.mesh.scale.setScalar(0.001);
  scene.add(b.mesh);
  return b;
}
function removeBall(b){ scene.remove(b.mesh); }
function easeOutBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function updateHeld(dt){
  const innerR = MAP.spinR - MAP.spinTube - 6;
  const ringRot = G.time*1.6;
  const gapWorld = ringRot - Math.PI/2;
  for (let i = G.held.length-1; i >= 0; i--){
    const b = G.held[i];
    if (b.popT < 0){ b.popT += dt; continue; }
    if (b.popT < 0.55){ b.popT += dt; b.scale = Math.max(0.001, easeOutBack(Math.min(b.popT/0.55,1))); }
    else b.scale = 1;
    b.vy -= 380*dt;
    const drag = Math.pow(0.35, dt);
    b.vx *= drag; b.vy *= drag;
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.spin += (Math.abs(b.vx)+Math.abs(b.vy))*0.004;
    const dx = b.x, dy = b.y - MAP.spinCy;
    const dist = Math.hypot(dx,dy);
    const maxDist = innerR - b.r;
    if (G.phase === 'launching' && G.launchOpen > 0.5 && dist > maxDist - 6){
      let ba = Math.atan2(dy,dx), da = ba - gapWorld;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < currentGap*0.5*0.9){
        b.state = 'falling';
        b.vx = (Math.random()-0.5)*40;
        b.vy = -60;
        G.active.push(b); G.held.splice(i,1); haptic();
        continue;
      }
    }
    if (dist > maxDist && dist > 0.001){
      const nx = dx/dist, ny = dy/dist;
      b.x = nx*maxDist; b.y = MAP.spinCy + ny*maxDist;
      const vn = b.vx*nx + b.vy*ny;
      if (vn > 0){ b.vx -= 1.55*vn*nx; b.vy -= 1.55*vn*ny; }
    }
    for (let j = i+1; j < G.held.length; j++){
      const ob = G.held[j];
      if (ob.popT < 0) continue;
      const ddx = b.x-ob.x, ddy = b.y-ob.y, dd = Math.hypot(ddx,ddy);
      const mD = b.r + ob.r;
      if (dd < mD && dd > 0.001){
        const nx = ddx/dd, ny = ddy/dd, push = (mD-dd)*0.5;
        b.x += nx*push; b.y += ny*push;
        ob.x -= nx*push; ob.y -= ny*push;
      }
    }
  }
}

function stepFalling(b, dt){
  const spd = Math.hypot(b.vx, b.vy);
  const SUBSTEPS = Math.min(60, Math.max(6, Math.ceil(spd*dt/3)));
  const subDt = dt/SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV*subDt;
    b.vx *= AIR; b.vy *= AIR;
    b.x += b.vx*subDt; b.y += b.vy*subDt;
    for (const w of WALLS) collideSeg(b,w.x1,w.y1,w.x2,w.y2,w.thick,REST_WALL);
    for (const p of PEGS){
      if (Math.abs(p.x-b.x)>40 || Math.abs(p.y-b.y)>40) continue;
      if (collideCircle(b,p.x,p.y,p.r,REST_PEG)) p.mesh.userData.hit = Math.min(1, p.mesh.userData.hit + 0.8);
    }
    for (const bar of BARS){
      if (Math.abs(bar.y-b.y) > 30) continue;
      resolveBar(b, bar);
    }
    if (JELLY.length) collideJelly(b);
    if (MAP.brickWall) resolveBricks(b);
    if (DARTBRICKS.length) resolveDartBricks(b);
    if (triMesh && b.y < MAP.triTipY+50 && b.y > MAP.triBaseY-50) resolveTriangle(b);
    collideWithPuck(b);
  }
  b.spin += (Math.abs(b.vx)+Math.abs(b.vy))*0.0035;
  b.stuckCheckT += dt;
  if (b.stuckCheckT > 0.5){
    const moved = Math.hypot(b.x-b.lastX, b.y-b.lastY);
    if (moved < 8 && b.state === 'falling'){
      b.stuckCount++;
      b.vx += (Math.random()-0.5)*260;
      b.vy -= 60;
      if (b.stuckCount >= 3){ b.y -= 90; b.vx = (Math.random()-0.5)*100; b.stuckCount = 0; }
    } else b.stuckCount = 0;
    b.lastX = b.x; b.lastY = b.y; b.stuckCheckT = 0;
  }
  if (b.x < -600 || b.x > 600){
    b.state = 'lost'; b.dead = true;
    G.results.push({value:b.value, mult:0});
    return;
  }
  if (b.y < MAP.floorY){
    if (isBallInDartBox(b)) return;
    if (MAP.type === 'dart'){
      // Dart map: any ball that exits the box goes to a bowl
      startBowlDrop(b, Math.random() < 0.20 ? 2 : 1);
      return;
    }
    if (Math.abs(b.x) < MAP.floorOpen){ startBowlDrop(b, Math.random()<0.20?2:1); return; }
    b.state = 'lost'; b.dead = true;
    G.results.push({value:b.value, mult:0});
  }
}

function updatePuck(dt){
  const A = MAP.puckArena;
  if (!A) return;
  const p = A.puck;
  p.x += p.vx*dt; p.y += p.vy*dt;
  p.angle += (p.vx*dt*0.006) + (p.vy*dt*0.004);
  const lb = A.cx - A.w/2 + A.wallT/2 + p.r;
  const rb = A.cx + A.w/2 - A.wallT/2 - p.r;
  const bb = A.cy - A.h/2 + A.wallT/2 + p.r;
  const tb = A.cy + A.h/2 - A.wallT/2 - p.r;
  if (p.x < lb){ p.x = lb; p.vx = Math.abs(p.vx); p.flash = 0.6; }
  if (p.x > rb){ p.x = rb; p.vx = -Math.abs(p.vx); p.flash = 0.6; }
  if (p.y < bb){ p.y = bb; p.vy = Math.abs(p.vy); p.flash = 0.6; }
  if (p.y > tb){ p.y = tb; p.vy = -Math.abs(p.vy); p.flash = 0.6; }
  const drag = Math.pow(0.995, dt*60);
  p.vx *= drag; p.vy *= drag;
  const spd = Math.hypot(p.vx, p.vy);
  const minS = 190, maxS = 340;
  if (spd < minS){
    const ang = spd < 1 ? Math.random()*Math.PI*2 : Math.atan2(p.vy, p.vx);
    const t = minS + Math.random()*50;
    p.vx = Math.cos(ang)*t; p.vy = Math.sin(ang)*t;
  } else if (spd > maxS){
    const k = maxS/spd; p.vx *= k; p.vy *= k;
  }
  if (p.group){
    p.group.position.set(p.x, p.y, 0);
    p.group.rotation.z = p.angle;
  }
}
function collideWithPuck(b){
  const A = MAP.puckArena;
  if (!A) return;
  const p = A.puck;
  const dx = b.x-p.x, dy = b.y-p.y, d = Math.hypot(dx,dy), mD = b.r + p.r;
  if (d < mD && d > 0.001){
    const nx = dx/d, ny = dy/d;
    b.x = p.x + nx*mD; b.y = p.y + ny*mD;
    const rvx = b.vx-p.vx, rvy = b.vy-p.vy;
    const rvn = rvx*nx + rvy*ny;
    if (rvn < 0){ b.vx -= 1.6*rvn*nx; b.vy -= 1.6*rvn*ny; }
    b.vx += p.vx*0.7; b.vy += p.vy*0.7 + 30;
    b.squash = 0.95;
    A.puck.flash = 1;
    haptic();
  }
}

function updateDartBox(dt){
  const D = MAP.dartBox;
  if (!D) return;

  if (D.active && D.active.ball && D.active.ball.dead){
    if (D.active.targetMesh) mapGroup.remove(D.active.targetMesh);
    if (D.active.gunMesh) mapGroup.remove(D.active.gunMesh);
    D.active = null;
  }

  D.shootTimer += dt;
  if (!D.active && D.shootTimer > 0.5){
    D.shootTimer = 0;
    const inBox = G.active.filter(b =>
      !b.dead && b.state === 'falling' && isBallInDartBox(b)
    );
    if (inBox.length){
      const tb = inBox[Math.floor(Math.random() * inBox.length)];
      const targetMesh = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(tb.r + 18, 3.5, 8, 28),
        new THREE.MeshBasicMaterial({color: 0xff2020, transparent: true, opacity: 0.95})
      );
      targetMesh.add(ring);
      const crossMat = new THREE.MeshBasicMaterial({color: 0xff2020, transparent: true, opacity: 0.95});
      targetMesh.add(new THREE.Mesh(new THREE.BoxGeometry((tb.r+18)*2, 2.5, 2.5), crossMat));
      targetMesh.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, (tb.r+18)*2, 2.5), crossMat));
      targetMesh.position.set(tb.x, tb.y, 8);
      targetMesh.scale.setScalar(0.001);
      mapGroup.add(targetMesh);

      const gunMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshBasicMaterial({map: gunState.tex, transparent: true, depthWrite: false})
      );
      gunMesh.position.set(tb.x, tb.y + 85, 10);
      gunMesh.scale.setScalar(0.001);
      gunMesh.renderOrder = 400;
      mapGroup.add(gunMesh);

      D.active = { ball: tb, targetMesh, gunMesh, phase: 'target', t: 0 };
    }
  }

  if (D.active){
    D.active.t += dt;
    const tb = D.active.ball;
    if (!tb.dead){
      if (D.active.phase === 'target'){
        D.active.targetMesh.position.set(tb.x, tb.y, 8);
      } else if (D.active.phase === 'gun'){
        D.active.gunMesh.position.set(tb.x, tb.y + 85, 10);
      }
    }

    if (D.active.phase === 'target'){
      const tt = Math.min(D.active.t / 0.35, 1);
      D.active.targetMesh.scale.setScalar(Math.max(0.001, easeOutBack(tt)));
      if (D.active.t > 0.55){
        D.active.phase = 'gun';
        D.active.t = 0;
        D.active.targetPopT = 0;
      }
    } else if (D.active.phase === 'gun'){
      D.active.targetPopT = (D.active.targetPopT || 0) + dt;
      const tp = Math.min(D.active.targetPopT / 0.25, 1);
      D.active.targetMesh.scale.setScalar(Math.max(0.001, 1 - tp));
      const gt = Math.min(D.active.t / 0.3, 1);
      D.active.gunMesh.scale.setScalar(Math.max(0.001, easeOutBack(gt)));
      if (D.active.t > 0.45){
        const ang = Math.random() * Math.PI * 2;
        const power = 900 + Math.random() * 400;
        tb.vx = Math.cos(ang) * power;
        tb.vy = Math.sin(ang) * power * 0.75 + 100;
        haptic();
        G.shake = Math.min(1, G.shake + 0.5);
        D.active.phase = 'fade';
        D.active.t = 0;
      }
    } else if (D.active.phase === 'fade'){
      const ft = Math.min(D.active.t / 0.35, 1);
      D.active.gunMesh.scale.setScalar(Math.max(0.001, 1 - ft));
      D.active.targetMesh.scale.setScalar(Math.max(0.001, 1 - ft));
      if (ft >= 1){
        mapGroup.remove(D.active.targetMesh);
        mapGroup.remove(D.active.gunMesh);
        D.active = null;
      }
    }
  }
}

function startBowlDrop(b, bowlNum){
  const cfg = bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  b.state = 'drop' + bowlNum;
  b.bowlNum = bowlNum;
  b.dropTargetY = cfg.cy + b.r + 1;
  const minR = cfg.holes[0].r + cfg.holeR + 10;
  const maxR = cfg.rimR - b.r - 8;
  const offA = Math.random()*Math.PI*2;
  const offR = minR >= maxR ? (minR+maxR)*0.5 : minR + Math.random()*(maxR-minR);
  b.x = Math.cos(offA)*offR; b.z = Math.sin(offA)*offR;
  const sT = cfg.cy + cfg.wallH + 120;
  if (b.y < sT) b.y = sT;
  b.vx = 0; b.vy = Math.max(-320, Math.min(b.vy,-80)); b.spin = 0;
}
function updateDrop(b, dt){
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const SUBSTEPS = Math.min(20, Math.max(3, Math.ceil(Math.abs(b.vy)*dt/3)));
  const subDt = dt/SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV*0.9*subDt;
    b.y += b.vy*subDt;
    const r = Math.hypot(b.x,b.z), maxR = cfg.rimR-b.r-8;
    if (r > maxR){ b.x = (b.x/r)*maxR; b.z = (b.z/r)*maxR; }
    if (b.y <= b.dropTargetY || b.y < cfg.cy + b.r){
      b.y = b.dropTargetY; b.squash = 1.0;
      b.theta = Math.atan2(b.z,b.x);
      b.rad = Math.max(Math.hypot(b.x,b.z), cfg.holes[0].r + cfg.holeR + 4);
      b.omega = (Math.random()>0.5?1:-1)*(2.9+Math.random()*0.7);
      b.orbitT = 0;
      b.state = 'bowl' + b.bowlNum;
      return;
    }
  }
}
function updateOrbit(b, dt){
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  b.orbitT += dt;
  b.theta += b.omega*dt;
  b.omega *= Math.pow(0.85, dt);
  const spd = Math.abs(b.omega);
  const inward = spd < 1.2 ? (1.2-spd)*30 : 0;
  b.rad -= (4+inward)*dt;
  if (b.rad < cfg.holes[0].r) b.rad = cfg.holes[0].r;
  if (b.rad > cfg.rimR - b.r - 4) b.rad = cfg.rimR - b.r - 4;
  b.x = Math.cos(b.theta)*b.rad;
  b.z = Math.sin(b.theta)*b.rad;
  b.y = cfg.cy + b.r + 0.5;
  b.spin += Math.abs(b.omega)*dt*6;
  if (b.orbitT < 1.4) return;
  if (b.bowlNum === 1 && !b.escapedBowl2 && b.orbitT > 2.4){
    b.escapedBowl2 = true;
    if (Math.random() < 0.20){ startEscape2(b); return; }
  }
  for (const h of cfg.holes){
    const hx = Math.cos(h.a)*h.r, hz = Math.sin(h.a)*h.r;
    if (Math.hypot(b.x-hx, b.z-hz) < cfg.holeR*1.15 && spd < 3.0){ startHover(b, cfg, h); return; }
  }
  if (b.orbitT > 6.5){
    let best = cfg.holes[0], bd = Infinity;
    for (const h of cfg.holes){
      let da = b.theta-h.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < bd){ bd = Math.abs(da); best = h; }
    }
    b.theta = best.a; b.rad = best.r;
    startHover(b, cfg, best);
  }
}
function startEscape2(b){
  b.state = 'esc2'; b.escT = 0;
  b.escFromX = b.x; b.escFromY = b.y; b.escFromZ = b.z;
  b.escToX = 0; b.escToY = MAP.bowl2.cy + MAP.bowl2.wallH + 60; b.escToZ = 0;
}
function updateEscape2(b, dt){
  b.escT += dt;
  const t = Math.min(b.escT/0.9, 1);
  b.x = b.escFromX + (b.escToX-b.escFromX)*(1-Math.pow(1-t,3));
  b.y = b.escFromY + (b.escToY-b.escFromY)*(t*t);
  b.z = b.escFromZ + (b.escToZ-b.escFromZ)*(1-Math.pow(1-t,3));
  b.spin += dt*12;
  b.scale = 1 - t*0.15;
  if (t >= 1){ b.state = 'drop2'; b.bowlNum = 2; b.dropTargetY = MAP.bowl2.cy+b.r+1; b.vy = -60; }
}
function startHover(b, cfg, hole){
  b.state = 'hover'; b.holeTarget = hole; b.hoverT = 0;
  b.holeStartY = cfg.cy + b.r + 0.5;
  b.hoverStartTheta = b.theta;
  b.hoverEndTheta = hole.a;
  while (b.hoverEndTheta - b.hoverStartTheta > Math.PI) b.hoverEndTheta -= Math.PI*2;
  while (b.hoverEndTheta - b.hoverStartTheta < -Math.PI) b.hoverEndTheta += Math.PI*2;
  G.results.push({value:b.value, mult:hole.mult});
  b.resultMult = hole.mult;
  G.shake = Math.min(1, G.shake + (hole.red?0.5:0.25));
  if (hole.red && b.tier === 'gold' && !slowMo.active && !b.slowMoDone){
    b.slowMoDone = true; slowMo.active = true; slowMo.t = 0; slowMo.ball = b;
    goldL1.visible = true; goldL2.visible = true;
    haptic();
  }
}
function updateHover(b, dt){
  b.hoverT += dt;
  const t = Math.min(b.hoverT/b.hoverDuration, 1);
  const e = t*t*(3-2*t);
  b.theta = b.hoverStartTheta + (b.hoverEndTheta-b.hoverStartTheta)*e;
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const h = b.holeTarget;
  b.x = Math.cos(b.theta)*h.r;
  b.z = Math.sin(b.theta)*h.r;
  b.y = b.holeStartY + Math.sin(t*Math.PI)*6;
  b.x += Math.sin(b.hoverT*30)*1.6;
  b.spin += dt*6;
  if (t >= 1){ b.state = 'hole'; b.holeT = 0; b.holeStartY = cfg.cy+b.r+0.5; }
}
function updateHoleDrop(b, dt){
  b.holeT += dt;
  const t = Math.min(b.holeT/1.05, 1);
  const fall = t*t*(1.4-t*0.4);
  const DROP = b.bowlNum === 1 ? 100 : 200;
  b.y = b.holeStartY - fall*DROP;
  b.spin += dt*10;
  b.scale = 1 - fall*0.7;
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const h = b.holeTarget;
  b.x = Math.cos(h.a)*h.r + Math.sin(b.holeT*24)*2;
  b.z = Math.sin(h.a)*h.r + Math.cos(b.holeT*24)*2;
  if (t >= 1){
    if (b.bowlNum === 2){ b.state = 'endFall'; b.vy = -60; b.scale = 1; b.x = (Math.random()-0.5)*40; b.z = (Math.random()-0.5)*40; }
    else { b.state = 'settled'; b.y = -99999; }
    spawnConfetti(0, cfg.cy-30, 0, h.red);
  }
}
function updateEndFall(b, dt){
  b.vy -= GRAV*0.8*dt; b.y += b.vy*dt;
  const ty = MAP.endCy + b.r + 1;
  if (b.y <= ty){ b.y = ty; b.vy = 0; b.squash = 1.0; b.state = 'endRest'; b.restT = 0; }
}
function updateEndRest(b, dt){
  b.restT += dt;
  b.squash *= Math.pow(0.0008, dt);
  if (b.restT > 1.2){ b.scale = Math.max(0, b.scale - dt*2.5); if (b.scale <= 0){ b.state='settled'; b.y=-99999; } }
}
function resolveBallBall(){
  const f = G.active.filter(b => !b.dead && b.state === 'falling');
  for (let i = 0; i < f.length; i++){
    for (let j = i+1; j < f.length; j++){
      const a = f[i], b = f[j];
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy), mD = a.r + b.r;
      if (d < mD && d > 0.001){
        const nx = dx/d, ny = dy/d, push = (mD-d)*0.5;
        a.x -= nx*push; a.y -= ny*push;
        b.x += nx*push; b.y += ny*push;
        const vn1 = a.vx*nx + a.vy*ny;
        const vn2 = b.vx*nx + b.vy*ny;
        const diff = vn2 - vn1;
        if (diff > 0){
          const imp = diff*0.5;
          a.vx += imp*nx; a.vy += imp*ny;
          b.vx -= imp*nx; b.vy -= imp*ny;
        }
      }
    }
  }
}
const CONF_COLORS = [0xffffff,0xffdd44,0xff5577,0x55ddff,0x8fe5b0];
const CONF_MATS = CONF_COLORS.map(c => new THREE.MeshBasicMaterial({color:c, transparent:true}));
const CONF_GEO = new THREE.SphereGeometry(3.2, 6, 6);
function spawnConfetti(x,y,z,big){
  const n = big ? 50 : 20;
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(CONF_GEO, CONF_MATS[i % CONF_MATS.length]);
    m.position.set(x,y,z); scene.add(m);
    G.particles.push({mesh:m, vx:(Math.random()-0.5)*500, vy:250+Math.random()*500, vz:(Math.random()-0.5)*350, life:1.8, gravity:480});
  }
}

function pickFeaturedBall(){
  if (MAP.dartBox && MAP.dartBox.active && MAP.dartBox.active.ball && !MAP.dartBox.active.ball.dead){
    return MAP.dartBox.active.ball;
  }
  const active = G.active.filter(b => !b.dead && b.state === 'falling');
  if (!active.length) return null;
  let lowest = active[0];
  for (const b of active) if (b.y < lowest.y) lowest = b;
  return lowest;
}
function updateFeaturedArrow(dt){
  featured.ball = pickFeaturedBall();
  if (featured.ball){
    if (!featured.arrow){
      const arrow = new THREE.Mesh(
        FEATURED_ARROW_GEO,
        new THREE.MeshBasicMaterial({
          color: 0xffffff, transparent: true, opacity: 0.95,
          depthWrite: false, side: THREE.DoubleSide,
        })
      );
      arrow.scale.setScalar(22);
      arrow.renderOrder = 500;
      scene.add(arrow);
      featured.arrow = arrow;
    }
    const bob = Math.sin(G.time * 7) * 5;
    featured.arrow.visible = true;
    featured.arrow.position.set(
      featured.ball.x,
      featured.ball.y + 42 + bob,
      16
    );
  } else if (featured.arrow){
    featured.arrow.visible = false;
  }
}

function update(dt){
  G.time += dt;
  G.shake *= Math.pow(0.001, dt);

  if (spinMesh && spinRail){
    const rot = G.time*1.6;
    spinMesh.rotation.z = -Math.PI/2 + currentGap/2 + rot;
    spinRail.rotation.z = -Math.PI/2 + currentGap/2 + rot;
  }

  for (const p of PEGS){
    if (p.mesh.userData.hit > 0){
      const h = p.mesh.userData.hit;
      p.mesh.scale.setScalar(1 + h*0.45);
      const mat = p.mesh.material;
      mat.emissive.setRGB(0.14 + h*0.62, 0.14 + h*0.80, 0.19 + h*0.95);
      mat.emissiveIntensity = 0.3 + h*2.6;
      p.mesh.userData.hit *= Math.pow(0.0005, dt);
      if (p.mesh.userData.hit < 0.002){
        p.mesh.userData.hit = 0;
        p.mesh.scale.setScalar(1);
        mat.emissive.setRGB(0.14,0.14,0.19);
        mat.emissiveIntensity = 0.3;
      }
    }
  }

  for (const br of BRICKS){
    if (br.shake > 0){
      br.shake *= Math.pow(0.001, dt);
      if (br.mesh){
        const s = br.shake;
        br.mesh.position.x = br.x + (Math.random()-0.5)*6*s;
        br.mesh.position.y = br.y + (Math.random()-0.5)*6*s;
        br.mesh.scale.setScalar(1 + s*0.08);
      }
    }
  }

  for (const br of DARTBRICKS){
    if (br.shake > 0){
      br.shake *= Math.pow(0.001, dt);
      if (br.mesh){
        const s = br.shake;
        br.mesh.position.x = br.x + (Math.random()-0.5)*4*s;
        br.mesh.position.y = br.y + (Math.random()-0.5)*4*s;
        br.mesh.scale.setScalar(1 + s*0.06);
      }
    }
  }

  // ===== Purple jelly springs (brick map) =====
  for (const j of JELLY){
    const k = 55, damp = 6.5;
    j.squeezeVel += (-j.squeeze * k) * dt - j.squeezeVel * damp * dt;
    j.squeeze += j.squeezeVel * dt;
    if (j.squeeze < 0){ j.squeeze = 0; j.squeezeVel *= -0.35; }
    if (j.squeeze > 1) j.squeeze = 1;

    if (j.mesh){
      const sq = j.squeeze;
      const sx = 1 + sq * 0.22;
      const sy = Math.max(0.35, 1 - sq * 0.55);
      const sz = 1 + sq * 0.08;
      j.mesh.scale.set(sx, sy, sz);
      j.mesh.position.x = j.x + Math.sin(G.time * 22) * sq * 3;
      j.mesh.position.y = j.y;
      j.mesh.rotation.z = Math.sin(G.time * 26) * sq * 0.09;
    }
  }

  for (const bar of BARS){
    bar.prevX = bar.x;
    bar.phase += dt;
    bar.x = bar.baseX + Math.sin(bar.phase) * bar.range;
    const vel = bar.x - bar.prevX;
    if (bar.mesh) bar.mesh.position.x = bar.x;
    if (bar.arrows && bar.arrows.length){
      const dir = vel >= 0 ? 1 : -1;
      for (let k = 0; k < bar.arrows.length; k++){
        const a = bar.arrows[k];
        const phase = ((G.time * 0.6 + k * 0.33) % 1 + 1) % 1;
        const offsetX = -bar.halfW + phase * bar.halfW * 2;
        a.position.set(bar.x + offsetX, bar.y + 14, 8);
        a.rotation.z = dir > 0 ? 0 : Math.PI;
        const fade = Math.sin(phase * Math.PI);
        a.scale.setScalar(a.userData.baseScale * (0.6 + fade * 0.55));
      }
    }
  }

  if (triMesh && gifPlane && (G.phase === 'playing' || G.phase === 'ended' || G.phase === 'launching')){
    G.triX += G.triDir * MAP.triSpeed * dt;
    if (G.triX >  MAP.triRange){ G.triX =  MAP.triRange; G.triDir = -1; }
    if (G.triX < -MAP.triRange){ G.triX = -MAP.triRange; G.triDir =  1; }
    triMesh.position.x = G.triX;
    gifPlane.position.x = G.triX;
  }

  updatePuck(dt);
  updateDartBox(dt);
  updateFeaturedArrow(dt);

  if (MAP.puckArena && MAP.puckArena.puck.group){
    if (MAP.puckArena.puck.flash > 0){
      MAP.puckArena.puck.flash *= Math.pow(0.0005, dt);
      MAP.puckArena.puck.group.scale.setScalar(1 + MAP.puckArena.puck.flash*0.25);
    } else MAP.puckArena.puck.group.scale.setScalar(1);
  }

  updateHeld(dt);

  if (G.phase === 'launching'){
    G.launchT += dt;
    G.launchOpen = Math.min(1, G.launchT/0.85);
    setSpinnerGap(G.launchOpen*Math.PI*0.95);
    if (G.launchT > 12 && G.held.length > 0){
      while (G.held.length){
        const b = G.held.pop();
        b.state = 'falling'; b.vx = (Math.random()-0.5)*40; b.vy = -60;
        G.active.push(b);
      }
    }
    if (G.launchT > 1.4 && G.held.length === 0){
      G.phase = 'playing'; G._ending = false; updateHud();
    }
  }

  for (let i = G.active.length-1; i >= 0; i--){
    const b = G.active[i];
    b.squash *= Math.pow(0.0008, dt);
    if      (b.state === 'falling') stepFalling(b, dt);
    else if (b.state === 'drop1' || b.state === 'drop2') updateDrop(b, dt);
    else if (b.state === 'bowl1' || b.state === 'bowl2') updateOrbit(b, dt);
    else if (b.state === 'hover') updateHover(b, dt);
    else if (b.state === 'hole') updateHoleDrop(b, dt);
    else if (b.state === 'esc2') updateEscape2(b, dt);
    else if (b.state === 'endFall') updateEndFall(b, dt);
    else if (b.state === 'endRest') updateEndRest(b, dt);
    if (b.dead){ removeBall(b); G.active.splice(i,1); }
  }

  resolveBallBall();

  for (let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;
    p.vy -= p.gravity*dt;
    p.life -= dt;
    if (p.life <= 0){ scene.remove(p.mesh); G.particles.splice(i,1); }
  }

  if (G.phase === 'playing'
    && G.held.length === 0
    && G.active.every(b => b.state === 'settled' || b.state === 'lost' || b.state === 'endRest' || b.dead)
    && !G._ending){
    G._ending = true;
    setTimeout(finishRound, 1200);
  }
}

function syncMeshes(){
  G.held.forEach(b => { b.mesh.position.set(b.x,b.y,b.z); b.mesh.scale.setScalar(b.scale); });
  G.active.forEach(b => {
    if (b.dead) return;
    if (b.state === 'settled'){ b.mesh.visible = false; return; }
    if (b.state === 'endRest' || b.state === 'endFall' || b.state === 'hole'){
      b.mesh.position.set(b.x,b.y,b.z);
      b.mesh.scale.setScalar(b.scale || 1);
      b.mesh.rotation.z += 0.05;
      return;
    }
    const sx = 1 + b.squash*0.22, sy = 1 - b.squash*0.22, sz = 1 + b.squash*0.10, sc = b.scale || 1;
    b.mesh.position.set(b.x,b.y,b.z);
    b.mesh.scale.set(sx*sc, sy*sc, sz*sc);
    b.mesh.rotation.z = Math.sin(b.spin)*0.4;
    b.mesh.rotation.x = Math.cos(b.spin*0.7)*0.3;
  });
}

const camState = { lookY:1200, targetLookY:1200, dist: CAM_RADIUS_NORMAL, targetDist: CAM_RADIUS_NORMAL };
function updateCamera(realDt){
  if (slowMo.active && slowMo.ball){
    camState.targetLookY = slowMo.ball.y; camState.targetDist = CAM_RADIUS_ZOOMED;
  } else if (G.phase === 'launching' || G.phase === 'holding' || G.phase === 'idle'){
    camState.targetLookY = MAP.spinCy - 100; camState.targetDist = CAM_RADIUS_NORMAL;
  } else if (featured.ball){
    camState.targetLookY = featured.ball.y + 100;
    camState.targetDist = CAM_RADIUS_NORMAL;
  } else if (G.active.length){
    const ys = G.active.filter(b=>!b.dead && b.state !== 'settled').map(b=>b.y).sort((a,b)=>a-b);
    const med = ys.length ? ys[Math.floor(ys.length/2)] : camState.lookY;
    camState.targetLookY = med + 180; camState.targetDist = CAM_RADIUS_NORMAL;
  } else camState.targetLookY = camState.lookY;

  const smooth = 1 - Math.pow(0.0035, realDt);
  camState.lookY += (camState.targetLookY - camState.lookY)*smooth;
  camState.dist  += (camState.targetDist  - camState.dist)*smooth*0.7;
  const camSmooth = 1 - Math.pow(0.004, realDt);
  camDrag.yaw   += (camDrag.targetYaw   - camDrag.yaw)*camSmooth;
  camDrag.pitch += (camDrag.targetPitch - camDrag.pitch)*camSmooth;

  if (!isFinite(camState.lookY)) camState.lookY = 0;
  if (!isFinite(camState.dist)) camState.dist = CAM_RADIUS_NORMAL;
  if (!isFinite(camDrag.yaw)) camDrag.yaw = 0;
  if (!isFinite(camDrag.pitch)) camDrag.pitch = CAM_DEFAULT_PITCH;

  const radius = camState.dist;
  const cy_off = Math.sin(camDrag.pitch) * radius;
  const hDist = Math.cos(camDrag.pitch) * radius;
  const cx = Math.sin(camDrag.yaw) * hDist;
  const cz = Math.cos(camDrag.yaw) * hDist;

  camera.position.set(cx, camState.lookY + cy_off, cz);
  camera.lookAt(0, camState.lookY, 0);
}

let last = performance.now(), errCount = 0;
function loop(now){
  const realDt = Math.min((now-last)/1000, 1/30);
  last = now;
  tickGifState(triState, now);
  tickGifState(gunState, now);
  let gameDt = realDt;
  if (slowMo.active){
    slowMo.t += realDt;
    const p = slowMo.t / slowMo.duration;
    let scale;
    if (p < 0.15) scale = 1 - (p/0.15)*0.88;
    else if (p < 0.85) scale = 0.12;
    else scale = 0.12 + ((p-0.85)/0.15)*0.88;
    gameDt = realDt * scale;
    if (slowMo.ball && !slowMo.ball.dead){
      const bx = slowMo.ball.x, by = slowMo.ball.y;
      const flash = 0.8 + 0.6*Math.sin(slowMo.t*30);
      goldL1.position.set(bx-45, by+35, 90); goldL2.position.set(bx+45, by+35, 90);
      goldL1.intensity = 3.5*flash; goldL2.intensity = 3.5*flash;
    }
    if (p >= 1){
      slowMo.active = false;
      goldL1.visible = false; goldL2.visible = false;
      goldL1.intensity = 0; goldL2.intensity = 0;
    }
  }
  try {
    update(gameDt); syncMeshes(); updateCamera(realDt);
    const sx = (Math.random()-0.5)*G.shake*8;
    const sy = (Math.random()-0.5)*G.shake*8;
    renderer.domElement.style.transform = `translate(${sx}px,${sy}px)`;
    renderer.render(scene, camera);
    errCount = 0;
  } catch (e){
    errCount++; console.error(e);
    if (errCount >= 5){
      errCount = 0;
      try {
        G.active.forEach(b=>removeBall(b)); G.held.forEach(b=>removeBall(b));
        G.active = []; G.held = []; G.particles = []; G.results = [];
        G._ending = false; G.phase = 'idle';
      } catch(_){}
    }
  }
  requestAnimationFrame(loop);
}

function attachRipple(el){
  el.addEventListener('pointerdown', (e) => {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top  = (e.clientY - rect.top  - size/2) + 'px';
    el.appendChild(span);
    setTimeout(() => span.remove(), 600);
  });
}

    for (let i=0;i<n;i++){ const v = randomValue(); balls.push({value:v, tier:tierFor(v)}); }
  } else {
    const qty = Math.max(1, Math.min(MAX_BALLS, Math.floor(Number(document.getElementById('dl-tier-qty').value)||1)));
    const price = Number(document.querySelector('.dl-tier.on')?.dataset.price || 10);

    if (cost > BALANCE) return flashResult('Oops','Not enough', true);
    for (let i=0;i<qty;i++) balls.push({value:price, tier:buyTier});
  }
  elBuyModal.classList.remove('show');
  BALANCE -= cost;
  G.wagered += cost;
  updateHud();
  const spawnAll = () => {
    balls.forEach((b,i) => G.held.push(spawnBall(b.value, b.tier, i*0.18)));
    G.phase = 'holding'; updateHud();
  };
  if (isRandom) spinAll(balls, spawnAll);
  else spawnAll();
});

/* ====== ROULETTE ====== */
const ROULETTE_N = 16;
const DEG2RAD = Math.PI / 180;
let spinToken = 0;

function spinAll(balls, done){
  spinToken++;
  const myToken = spinToken;
  elRoulette.classList.add('show');
  elRTitle.textContent = 'Rolling';
  elRAmount.classList.remove('show');
  elRAmount.innerHTML = '';
  elRRows.innerHTML = '';

  const n = balls.length;
  const availH = Math.min(innerHeight * 0.60, 520);
  const gapPx = 6;
  let rowH = Math.floor((availH - (n - 1) * gapPx) / n);
  rowH = Math.max(46, Math.min(170, rowH));

  const baseAngles = new Float32Array(ROULETTE_N);
  for (let i = 0; i < ROULETTE_N; i++) baseAngles[i] = (i / ROULETTE_N) * 360;

  const vpW = elRRows.clientWidth || 360;
  const RADIUS = Math.max(100, Math.min(230, vpW * 0.52));

  const ballSize = Math.min(84, Math.max(30, rowH - 16));
  const fontSize = Math.max(9, ballSize * 0.27);

  const frag = document.createDocumentFragment();
  const rows = [];

  for (let idx = 0; idx < n; idx++){
    const ball = balls[idx];

    const rowEl = document.createElement('div');
    rowEl.className = 'dl-r-row';
    rowEl.style.height = rowH + 'px';

    const vpEl = document.createElement('div');
    vpEl.className = 'dl-r-viewport';
    rowEl.appendChild(vpEl);

    const ptrEl = document.createElement('div');
    ptrEl.className = 'dl-r-pointer';
    ptrEl.textContent = '▲';
    ptrEl.style.fontSize = Math.max(9, Math.min(16, rowH * 0.17)) + 'px';
    rowEl.appendChild(ptrEl);

    const items = new Array(ROULETTE_N);
    for (let k = 0; k < ROULETTE_N; k++){
      const v = randomValue();
      items[k] = {value: v, tier: tierFor(v)};
    }
    const winnerIdx = (Math.random() * ROULETTE_N) | 0;
    items[winnerIdx] = {value: ball.value, tier: ball.tier};

    const ballEls = new Array(ROULETTE_N);
    for (let k = 0; k < ROULETTE_N; k++){
      const it = items[k];
      const d = document.createElement('div');
      d.className = 'dl-r-ball ' + it.tier;
      d.textContent = it.value;
      d.style.width = ballSize + 'px';
      d.style.height = ballSize + 'px';
      d.style.marginLeft = (-ballSize / 2) + 'px';
      d.style.marginTop = (-ballSize / 2) + 'px';
      d.style.fontSize = fontSize + 'px';
      d._z = -1; d._o = -1;
      vpEl.appendChild(d);
      ballEls[k] = d;
    }

    frag.appendChild(rowEl);
    rows.push({
      ballEls,
      winnerIdx,
      endW: -baseAngles[winnerIdx] - 360 * (4 + ((Math.random() * 4) | 0)),
    });
  }
  elRRows.appendChild(frag);

  function applyRow(rowData, W){
    const els = rowData.ballEls;
    for (let i = 0; i < ROULETTE_N; i++){
      const A = (W + baseAngles[i]) * DEG2RAD;
      const c = Math.cos(A), s = Math.sin(A);
      const x = s * RADIUS;
      const depth = (c + 1) * 0.5;
      const el = els[i];
      el.style.transform = 'translate(' + x.toFixed(1) + 'px,0) scale(' + (0.55 + 0.45*depth).toFixed(3) + ')';
      const z = (depth * 1000) | 0;
      if (el._z !== z){ el.style.zIndex = z; el._z = z; }
      const op = (0.42 + 0.58 * depth).toFixed(2);
      if (el._o !== op){ el.style.opacity = op; el._o = op; }
    }
  }

  const eoQ = t => 1 - Math.pow(1 - t, 5);
  const eoB = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const DURATION = FAST_SPIN ? 1000 : 2100;
  const t0 = performance.now();

  for (let i = 0; i < rows.length; i++) applyRow(rows[i], 0);

  function frame(now){
    if (myToken !== spinToken) return;
    const p = Math.min((now - t0) / DURATION, 1);
    const eased = p < 0.9 ? eoQ(p / 0.9) * 0.985 : 0.985 + eoB((p - 0.9) / 0.1) * 0.015;
    for (let i = 0; i < rows.length; i++) applyRow(rows[i], rows[i].endW * eased);

    if (p >= 1){
      for (let i = 0; i < rows.length; i++){
        const r = rows[i];
        applyRow(r, r.endW);
        r.ballEls[r.winnerIdx].classList.add('winner');
      }
      setTimeout(() => {
        if (myToken !== spinToken) return;
        elRTitle.textContent = 'You got';
        let totalVal = 0;
        for (let i = 0; i < balls.length; i++) totalVal += balls[i].value;
        elRAmount.innerHTML = '<img src="' + DIAMOND_GIF + '"><span>' + totalVal + '</span>';
        elRAmount.classList.add('show');
        haptic();
      }, 250);
      setTimeout(() => {
        if (myToken !== spinToken) return;
        elRoulette.classList.remove('show');
        elRRows.innerHTML = '';
        done();
      }, FAST_SPIN ? 900 : 1500);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

elLaunch.addEventListener('click', () => {
  if (G.phase !== 'holding' || G.held.length === 0) return;
  G.phase = 'launching'; G.launchT = 0; G.launchOpen = 0;
  setSpinnerGap(0); elLaunch.disabled = true; haptic();
});

function finishRound(){
  let total = 0, won = 0, lost = 0;
  for (const r of G.results){ total += r.value * r.mult; if (r.mult === 0) lost++; else won++; }
  const winnings = Math.floor(total);
  BALANCE += winnings;
  const mult = G.wagered > 0 ? (winnings/G.wagered) : 0;
  G.wagered = 0;
  updateHud();
  if (winnings > 0) addTickerChip(winnings, mult, '');
  elResTag.textContent = winnings > 0 ? 'Round Results' : 'Round Over';
  elResAmt.innerHTML = `<img src="${DIAMOND_GIF}"><span>${(winnings>0?'+':'')+winnings}</span>`;
  elResAmt.classList.toggle('lose', winnings === 0);
  elResMult.textContent = '×' + mult.toFixed(2);
  elResMult.classList.toggle('lose', winnings === 0);
  elResSub.textContent = `${won} won · ${lost} lost`;
  elResult.classList.add('show');
}

document.getElementById('dl-res-ok').addEventListener('click', () => {
  elResult.classList.remove('show');
  G.active.forEach(b=>removeBall(b));
  G.held.forEach(b=>removeBall(b));
  G.active = []; G.held = [];
  for (const p of G.particles) scene.remove(p.mesh);
  G.particles = []; G.results = [];
  G.launchT = 0; G.launchOpen = 0; G._ending = false;
  G.phase = 'idle';
  slowMo.active = false; slowMo.ball = null; slowMo.t = 0;
  goldL1.visible = false; goldL2.visible = false;
  goldL1.intensity = 0; goldL2.intensity = 0;
  setSpinnerGap(0);
  if (featured.arrow) featured.arrow.visible = false;
  featured.ball = null;
  regenerateMap(); buildMap();
  G.triX = 0; G.triDir = 1;
  camState.lookY = MAP.spinCy - 100;
  camState.targetLookY = MAP.spinCy - 100;
  camDrag.targetYaw = CAM_DEFAULT_YAW;
  camDrag.targetPitch = CAM_DEFAULT_PITCH;
  document.querySelectorAll('.dl-modal,.dl-r,.dl-result').forEach(el => el.classList.remove('show'));
  updateHud();
});
function flashResult(tag, amt, isLose, sub){
  elResTag.textContent = tag;
  elResAmt.innerHTML = `<span>${amt}</span>`;
  elResAmt.classList.toggle('lose', !!isLose);
  elResMult.textContent = '';
  elResSub.textContent = sub || '';
  elResult.classList.add('show');
}

document.getElementById('dl-close').addEventListener('click', () => {
  try { if (window.__state){ window.__state.balance = BALANCE; window.__state.updateBalance?.(); } } catch(_){}
  window.dispatchEvent(new CustomEvent('dlballs-close'));
});

regenerateMap();
buildMap();
onResize();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
