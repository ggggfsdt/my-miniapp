  let W = 0, H = 0, DPR = 1;
  let BLOCK_SIZE = 60;
  let MAP_HEIGHT_PX = 0;

  function resizeCanvas(){
    const rect = frame.getBoundingClientRect();
    W = rect.width; H = rect.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    BLOCK_SIZE = Math.floor(W / MAP_COLS);
    MAP_HEIGHT_PX = MAP_ROWS * BLOCK_SIZE;
    for (const k in blockSpriteCache) delete blockSpriteCache[k];
  }

  const blockSpriteCache = {};

  function getBlockSprite(type, size){
    const key = type + ':' + size;
    if (blockSpriteCache[key]) return blockSpriteCache[key];
    const cv = document.createElement('canvas');
    cv.width  = Math.round(size * DPR);
    cv.height = Math.round(size * DPR);
    const g = cv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBlockSprite(g, type, size);
    blockSpriteCache[key] = cv;
    return cv;
  }

  function drawBlockSprite(g, type, size){
    const b = BLOCKS[type];
    if (!b) return;

    if (b.type === 'grass'){
      const gd = g.createLinearGradient(0, size * 0.25, 0, size);
      gd.addColorStop(0, '#7a5535');
      gd.addColorStop(1, '#5a3e26');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      for (let i = 0; i < 14; i++){
        const x = (Math.sin(i * 4.3) * 0.5 + 0.5) * size;
        const y = size * 0.3 + ((Math.cos(i * 2.7) * 0.5 + 0.5) * size * 0.7);
        g.fillStyle = '#3d2718';
        g.fillRect(Math.floor(x), Math.floor(y), size * 0.08, size * 0.08);
      }
      const gt = g.createLinearGradient(0, 0, 0, size * 0.3);
      gt.addColorStop(0, '#7ac93c');
      gt.addColorStop(1, '#4a8a20');
      g.fillStyle = gt;
      g.fillRect(0, 0, size, size * 0.3);
      g.fillStyle = '#5aa028';
      for (let i = 0; i < 8; i++){
        const x = (i + 0.5) * (size / 8);
        g.fillRect(Math.floor(x), Math.floor(size * 0.28), Math.ceil(size / 10), Math.ceil(size * 0.05));
      }
    } else if (b.type === 'dirt'){
      const gd = g.createLinearGradient(0, 0, 0, size);
      gd.addColorStop(0, '#8a6039');
      gd.addColorStop(1, '#5a3e26');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      for (let i = 0; i < 16; i++){
        const x = (Math.sin(i * 4.3) * 0.5 + 0.5) * size;
        const y = (Math.cos(i * 2.7) * 0.5 + 0.5) * size;
        g.fillStyle = '#3d2718';
        g.fillRect(Math.floor(x), Math.floor(y), size * 0.07, size * 0.07);
      }
    } else if (b.type === 'stone'){
      const gd = g.createLinearGradient(0, 0, 0, size);
      gd.addColorStop(0, '#9a9a9a');
      gd.addColorStop(1, '#6a6a6a');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      for (let i = 0; i < 18; i++){
        const x = (Math.sin(i * 3.1) * 0.5 + 0.5) * size;
        const y = (Math.cos(i * 5.3) * 0.5 + 0.5) * size;
        g.fillStyle = i % 2 ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.10)';
        g.fillRect(Math.floor(x), Math.floor(y), size * 0.06, size * 0.06);
      }
    } else if (b.type === 'ore'){
      const gd = g.createLinearGradient(0, 0, 0, size);
      gd.addColorStop(0, '#9a9a9a');
      gd.addColorStop(1, '#6a6a6a');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      for (let i = 0; i < 16; i++){
        const x = (Math.sin(i * 3.1) * 0.5 + 0.5) * size;
        const y = (Math.cos(i * 5.3) * 0.5 + 0.5) * size;
        g.fillStyle = i % 2 ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.10)';
        g.fillRect(Math.floor(x), Math.floor(y), size * 0.06, size * 0.06);
      }
      const oreUnit = size * 0.12;
      const seed = (type.charCodeAt(0) * 7) % 100;
      for (let i = 0; i < b.oreCount; i++){
        const ang = (i * 2.399 + seed) % (Math.PI * 2);
        const rr = ((i % 3) * 0.11) + 0.12;
        const x = (Math.sin(ang) * rr + 0.5) * size;
        const y = (Math.cos(ang * 1.7) * rr + 0.5) * size;
        const w = oreUnit * (b.oreSize / 3);
        g.fillStyle = 'rgba(0,0,0,.4)';
        g.fillRect(Math.floor(x + 1), Math.floor(y + 1), Math.ceil(w), Math.ceil(w));
        g.fillStyle = b.oreColor;
        g.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(w));
        g.fillStyle = b.oreHL;
        g.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w * 0.5), Math.ceil(w * 0.4));
      }
      if (b.namek){
        const gg = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.75);
        gg.addColorStop(0, 'rgba(125,255,107,.55)');
        gg.addColorStop(1, 'rgba(125,255,107,0)');
        g.fillStyle = gg;
        g.fillRect(0, 0, size, size);
      }
    } else if (b.type === 'tnt'){
      const gd = g.createLinearGradient(0, 0, 0, size);
      gd.addColorStop(0, '#d03030');
      gd.addColorStop(1, '#7a1010');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      g.fillStyle = '#f0f0f0';
      g.fillRect(0, size * 0.42, size, size * 0.18);
      g.strokeStyle = '#2a2a2a';
      g.lineWidth = Math.max(1, size * 0.02);
      g.beginPath();
      g.moveTo(0, size * 0.42 + 0.5); g.lineTo(size, size * 0.42 + 0.5);
      g.moveTo(0, size * 0.60 - 0.5); g.lineTo(size, size * 0.60 - 0.5);
      g.stroke();
      g.fillStyle = '#1a1a1a';
      g.font = '900 ' + Math.round(size * 0.20) + 'px -apple-system, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('TNT', size / 2, size / 2);
    } else if (b.type === 'craft'){
      const gd = g.createLinearGradient(0, 0, 0, size);
      gd.addColorStop(0, '#c89858');
      gd.addColorStop(1, '#8a5c30');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      g.strokeStyle = 'rgba(40,25,10,.6)';
      g.lineWidth = Math.max(1.2, size * 0.028);
      const m = size * 0.13;
      const iw = size - m * 2;
      for (let i = 1; i < 3; i++){
        g.beginPath();
        g.moveTo(m + (iw / 3) * i, m); g.lineTo(m + (iw / 3) * i, size - m);
        g.stroke();
        g.beginPath();
        g.moveTo(m, m + (iw / 3) * i); g.lineTo(size - m, m + (iw / 3) * i);
        g.stroke();
      }
      g.strokeRect(m, m, iw, iw);
    } else if (b.type === 'slime'){
      const gd = g.createLinearGradient(0, 0, 0, size);
      gd.addColorStop(0, '#a8f5a8');
      gd.addColorStop(1, '#5cc85c');
      g.fillStyle = gd;
      g.fillRect(0, 0, size, size);
      g.fillStyle = 'rgba(255,255,255,.25)';
      g.fillRect(size * 0.15, size * 0.15, size * 0.7, size * 0.7);
      for (let i = 0; i < 6; i++){
        const ang = i * 1.9;
        const rr = ((i % 3) * 0.1) + 0.15;
        const x = (Math.sin(ang) * rr + 0.5) * size;
        const y = (Math.cos(ang * 1.5) * rr + 0.5) * size;
        g.fillStyle = 'rgba(255,255,255,.6)';
        g.beginPath();
        g.arc(x, y, size * 0.05, 0, Math.PI * 2);
        g.fill();
      }
      g.strokeStyle = 'rgba(20,90,20,.55)';
      g.lineWidth = Math.max(1, size * 0.04);
      g.strokeRect(size * 0.06, size * 0.06, size * 0.88, size * 0.88);
    }

    const hl = g.createLinearGradient(0, 0, 0, size * 0.35);
    hl.addColorStop(0, 'rgba(255,255,255,.14)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl;
    g.fillRect(0, 0, size, size * 0.35);

    const sh = g.createLinearGradient(0, size * 0.72, 0, size);
    sh.addColorStop(0, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(0,0,0,.28)');
    g.fillStyle = sh;
    g.fillRect(0, size * 0.72, size, size * 0.28);

    g.strokeStyle = 'rgba(0,0,0,.45)';
    g.lineWidth = Math.max(1, Math.round(size / 60));
    g.strokeRect(0.5, 0.5, size - 1, size - 1);
  }

  function drawCracks(g, x, y, size, level, maxLevel){
    if (level <= 0) return;
    const ratio = Math.min(1, level / maxLevel);
    const intensity = 0.4 + ratio * 0.55;
    g.strokeStyle = 'rgba(8,8,8,' + intensity.toFixed(2) + ')';
    g.lineWidth = Math.max(1.2, size * 0.026);
    g.lineCap = 'round';
    const cx = x + size / 2, cy = y + size / 2;
    const r = size * 0.42;
    g.beginPath();
    g.moveTo(cx - r * 0.7, cy - r * 0.4);
    g.lineTo(cx - r * 0.15, cy - r * 0.05);
    g.lineTo(cx + r * 0.18, cy + r * 0.3);
    g.lineTo(cx - r * 0.22, cy + r * 0.72);
    g.stroke();
    if (level >= 2){
      g.beginPath();
      g.moveTo(cx + r * 0.55, cy - r * 0.6);
      g.lineTo(cx + r * 0.22, cy - r * 0.1);
      g.lineTo(cx + r * 0.5, cy + r * 0.3);
      g.stroke();
    }
  }

  function drawPickaxeShape(g, cx, cy, size, angle, tier){
    const t = PICKAXES.find(p => p.key === tier) || PICKAXES[0];
    const s = size / 100;

    g.save();
    g.translate(cx, cy);
    g.rotate(angle);

    g.fillStyle = '#4a3018';
    g.fillRect(-3 * s, 2 * s, 6 * s, 60 * s);
    g.fillStyle = '#7a5836';
    g.fillRect(-3 * s, 2 * s, 2 * s, 60 * s);
    g.strokeStyle = 'rgba(0,0,0,.65)';
    g.lineWidth = 1.2 * s;
    g.strokeRect(-3 * s, 2 * s, 6 * s, 60 * s);

    g.beginPath();
    g.moveTo(-30 * s, 0 * s);
    g.quadraticCurveTo(-22 * s, -12 * s, 0 * s, -14 * s);
    g.quadraticCurveTo(22 * s, -12 * s, 30 * s, 0 * s);
    g.lineTo(26 * s, 5 * s);
    g.quadraticCurveTo(18 * s, -4 * s, 0 * s, -5 * s);
    g.quadraticCurveTo(-18 * s, -4 * s, -26 * s, 5 * s);
    g.closePath();
    g.fillStyle = t.color;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,.7)';
    g.lineWidth = 1.4 * s;
    g.lineJoin = 'round';
    g.stroke();

    g.beginPath();
    g.moveTo(-26 * s, -2 * s);
    g.quadraticCurveTo(-18 * s, -11 * s, 0 * s, -12 * s);
    g.quadraticCurveTo(18 * s, -11 * s, 26 * s, -2 * s);
    g.strokeStyle = t.highlight;
    g.lineWidth = 1.6 * s;
    g.stroke();

    g.restore();
  }

  function pickSVGPath(tier, viewW, viewH){
    const t = PICKAXES.find(p => p.key === tier) || PICKAXES[0];
    return '<svg viewBox="-40 -20 80 90" width="' + viewW + '" height="' + viewH + '" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">' +
      '<rect x="-3" y="2" width="6" height="60" fill="#4a3018" stroke="rgba(0,0,0,.65)" stroke-width="1.2"/>' +
      '<rect x="-3" y="2" width="2" height="60" fill="#7a5836"/>' +
      '<path d="M -30 0 Q -22 -12 0 -14 Q 22 -12 30 0 L 26 5 Q 18 -4 0 -5 Q -18 -4 -26 5 Z" ' +
        'fill="' + t.color + '" stroke="rgba(0,0,0,.7)" stroke-width="1.4" stroke-linejoin="round"/>' +
      '<path d="M -26 -2 Q -18 -11 0 -12 Q 18 -11 26 -2" stroke="' + t.highlight + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
    '</svg>';
  }

  function pickBlockType(row){
    if (row === 0) return 'grass';
    if (row <= 3) return 'stone';
    const depth = Math.min(1, (row - 3) / (MAP_ROWS - 4));
    const weights = [
      ['stone',    30 - depth * 12],
      ['coal',     18],
      ['iron',     14],
      ['gold',     9 + depth * 3],
      ['redstone', 6 + depth * 3],
      ['slime',    4],
      ['craft',    4],
      ['tnt',      4 + depth * 6],
      ['diamond',   row > 18 ? Math.min(7, (row - 18) * 0.45) : 0],
      ['emerald',   row > 30 ? Math.min(3, (row - 30) * 0.25) : 0],
      ['namek',     row > 12 ? Math.min(4, (row - 12) * 0.20) : 0],
    ];
    const total = weights.reduce((s, [, w]) => s + Math.max(0, w), 0);
    let r = Math.random() * total;
    for (const [type, w] of weights){
      if (w <= 0) continue;
      r -= w;
      if (r <= 0) return type;
    }
    return 'stone';
  }

  function generateMap(){
    const arr = [];
    for (let r = 0; r < MAP_ROWS; r++){
      arr.push([]);
      for (let c = 0; c < MAP_COLS; c++){
        const type = pickBlockType(r);
        const bd = BLOCKS[type];
        arr[r].push({ type, hp: bd.hard, maxHp: bd.hard, broken: false });
      }
    }
    return arr;
  }

  function buildReel(targetIdx){
    spinReel.innerHTML = '';
    const ITEM_H = 140;
    const loops = 3;
    const totalItems = loops * PICKAXES.length + targetIdx + 1;
    for (let i = 0; i < totalItems; i++){
      const t = PICKAXES[i % PICKAXES.length];
      const el = document.createElement('div');
      el.className = 'spin-item';
      el.innerHTML = pickSVGPath(t.key, 64, 76) +
        '<div class="si-name" style="color:' + t.color + '">' + t.name + '</div>';
      spinReel.appendChild(el);
    }
    spinReel.style.transition = 'none';
    spinReel.style.transform = 'translateY(0px)';
    void spinReel.offsetWidth;
    return { totalItems, ITEM_H };
  }

  function updateReel(now){
    const s = state.spin;
    if (s.landed){
      if (now - s.finishAt > 1000){
        state.gameState = 'mining';
        spawnPickaxe(PICKAXES[s.targetIdx].key);
        state.lastFrame = now;
      }
      return;
    }
    const elapsed = now - s.start;
    const t = Math.min(1, elapsed / s.dur);
    const e = 1 - Math.pow(1 - t, 5);
    const y = s.from + (s.to - s.from) * e;
    spinReel.style.transform = 'translateY(' + y + 'px)';

    const ticks = Math.floor(Math.abs(y - s.from) / 140);
    if (ticks !== s.tickCount){
      s.tickCount = ticks;
      Sound.reelTick();
      haptic('light');
    }

    if (t >= 1){
      s.landed = true;
      s.finishAt = now;
      Sound.reelLand(s.targetIdx);
      haptic('heavy');
      const t2 = PICKAXES[s.targetIdx];
      spinResult.innerHTML = '<span style="color:' + t2.color + '">' + t2.name + ' Pickaxe</span> · ' + t2.dur + ' durability';
      spinResult.classList.add('show');
    }
  }

  function showReel(targetIdx){
    spinResult.classList.remove('show');
    spinOverlay.classList.add('show');
    const { totalItems, ITEM_H } = buildReel(targetIdx);
    const targetY = -((totalItems - 1) * ITEM_H);
    const s = state.spin;
    s.start = performance.now();
    s.dur = 2400;
    s.from = 0;
    s.to = targetY;
    s.targetIdx = targetIdx;
    s.landed = false;
    s.finishAt = 0;
    s.tickCount = -1;
  }

  function spawnBreakFrags(worldX, worldY, colorTop, colorBot, count){
    for (let i = 0; i < count; i++){
      const ang = Math.random() * Math.PI * 2;
      const spd = 100 + Math.random() * 220;
      state.breakFrags.push({
        x: worldX, y: worldY,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 220,
        size: 3 + Math.random() * 7,
        rot: Math.random() * Math.PI * 2,
        rotVel: (Math.random() - 0.5) * 22,
        color: Math.random() < 0.5 ? colorTop : colorBot,
        born: performance.now(),
        life: 900 + Math.random() * 500,
      });
    }
  }

  function updateFrags(now){
    for (let i = state.breakFrags.length - 1; i >= 0; i--){
      const f = state.breakFrags[i];
      const age = (now - f.born) / f.life;
      if (age >= 1){ state.breakFrags.splice(i, 1); continue; }
      f.vy += GRAVITY * 1.2 / 60;
      f.x += f.vx / 60;
      f.y += f.vy / 60;
      f.rot += f.rotVel / 60;
    }
  }

  function spawnFloatText(worldX, worldY, text, opts){
    opts = opts || {};
    state.floatTexts.push({
      x: worldX + (opts.jx != null ? opts.jx : (Math.random() - 0.5) * 22),
      y: worldY,
      text: String(text),
      color: opts.color || '#8ef0b8',
      size: opts.size || 14,
      weight: opts.weight || 900,
      outline: opts.outline !== false,
      born: performance.now(),
      life: opts.life || 1050,
      vy: opts.vy != null ? opts.vy : -78,
      vx: opts.vx != null ? opts.vx : (Math.random() - 0.5) * 20,
      pop: opts.pop !== false,
    });
  }

  function updateFloatTexts(now){
    for (let i = state.floatTexts.length - 1; i >= 0; i--){
      const t = state.floatTexts[i];
      const age = (now - t.born) / t.life;
      if (age >= 1){ state.floatTexts.splice(i, 1); continue; }
    }
  }

  function drawFloatTexts(now, camY){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < state.floatTexts.length; i++){
      const t = state.floatTexts[i];
      const age = (now - t.born) / t.life;
      const x = t.x + t.vx * age * 0.6;
      const y = t.y - camY + t.vy * age + age * age * 60;
      let scale = 1;
      if (t.pop && age < 0.22){
        scale = 1 + (0.22 - age) * 3;
      }
      ctx.globalAlpha = age < 0.75 ? 1 : (1 - (age - 0.75) / 0.25);
      ctx.font = t.weight + ' ' + (t.size * scale) + 'px -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif';

      if (t.outline){
        ctx.lineWidth = Math.max(2, t.size * scale * 0.22);
        ctx.strokeStyle = 'rgba(0,0,0,.85)';
        ctx.lineJoin = 'round';
        ctx.strokeText(t.text, x, y);
      }
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, x, y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function render(now){
    if (W <= 0 || H <= 0) return;
    ctx.clearRect(0, 0, W, H);

    let shakeX = 0, shakeY = 0;
    if (state.shake > 0.5){
      shakeX = (Math.random() - 0.5) * state.shake;
      shakeY = (Math.random() - 0.5) * state.shake;
      state.shake *= 0.85;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);

    const camY = state.cameraY;
    const groundLineY = -camY;

    if (groundLineY > -50){
      const skyEnd = Math.max(0, groundLineY);
      const skyGrad = ctx.createLinearGradient(0, 0, 0, skyEnd);
      skyGrad.addColorStop(0, '#2e7bc4');
      skyGrad.addColorStop(0.4, '#5aa5e8');
      skyGrad.addColorStop(0.8, '#9ecdf0');
      skyGrad.addColorStop(1, '#d4ecfa');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(-30, -30, W + 60, skyEnd + 30);

      ctx.save();
      ctx.globalAlpha = 0.85;
      const sunY = Math.max(-20, groundLineY * 0.15);
      const sunGrad = ctx.createRadialGradient(W * 0.8, sunY, 0, W * 0.8, sunY, 90);
      sunGrad.addColorStop(0, '#fffbe0');
      sunGrad.addColorStop(0.3, '#fff2a8');
      sunGrad.addColorStop(1, 'rgba(255,242,168,0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(W * 0.8, sunY, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fffbe0';
      ctx.beginPath();
      ctx.arc(W * 0.8, sunY, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,.85)';
      const cloudBase = groundLineY * 0.3;
      drawCloud(W * 0.15, cloudBase + 10, 55);
      drawCloud(W * 0.55, cloudBase - 10, 70);
      drawCloud(W * 0.9, cloudBase + 25, 45);
    }

    const underStart = Math.max(-30, groundLineY);
    if (underStart < H + 30){
      const ug = ctx.createLinearGradient(0, underStart, 0, H + 60);
      ug.addColorStop(0, '#3a2818');
      ug.addColorStop(0.15, '#2a1c10');
      ug.addColorStop(0.5, '#161010');
      ug.addColorStop(1, '#08060a');
      ctx.fillStyle = ug;
      ctx.fillRect(-30, underStart, W + 60, H - underStart + 60);
    }

    const startRow = Math.max(0, Math.floor(camY / BLOCK_SIZE) - 1);
    const endRow = Math.min(MAP_ROWS - 1, Math.ceil((camY + H) / BLOCK_SIZE) + 1);

    for (let r = startRow; r <= endRow; r++){
      const row = state.blocks[r];
      if (!row) continue;
      for (let c = 0; c < MAP_COLS; c++){
        const b = row[c];
        if (!b || b.broken) continue;
        const px = c * BLOCK_SIZE;
        const py = r * BLOCK_SIZE - camY;
        if (py < -BLOCK_SIZE - 10 || py > H + 10) continue;
        const sprite = getBlockSprite(b.type, BLOCK_SIZE);
        ctx.drawImage(sprite, px, py, BLOCK_SIZE, BLOCK_SIZE);
        if (b.hp < b.maxHp){
          drawCracks(ctx, px, py, BLOCK_SIZE, b.maxHp - b.hp, b.maxHp);
        }
      }
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let r = startRow; r <= endRow; r++){
      const row = state.blocks[r];
      if (!row) continue;
      for (let c = 0; c < MAP_COLS; c++){
        const b = row[c];
        if (!b || b.broken || b.type !== 'namek') continue;
        const px = c * BLOCK_SIZE + BLOCK_SIZE/2;
        const py = r * BLOCK_SIZE - camY + BLOCK_SIZE/2;
        const pulse = 0.7 + Math.sin(now * 0.004 + r * 0.6 + c * 1.3) * 0.3;
        const rad = BLOCK_SIZE * 1.55 * pulse;
        const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
        g.addColorStop(0, 'rgba(125,255,107,.55)');
        g.addColorStop(1, 'rgba(125,255,107,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();

    if (state.pickaxe){
      if (state.turbo){
        const px = state.pickaxe.x;
        const py = state.pickaxe.y - camY;
        const g = ctx.createRadialGradient(px, py, 0, px, py, BLOCK_SIZE * 0.85);
        g.addColorStop(0, 'rgba(255,200,100,.4)');
        g.addColorStop(1, 'rgba(255,157,77,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(px, py, BLOCK_SIZE * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }
      drawPickaxeShape(ctx, state.pickaxe.x, state.pickaxe.y - camY, BLOCK_SIZE * 0.95, state.pickaxe.angle, state.pickaxe.tier);
    }

    for (let i = 0; i < state.breakFrags.length; i++){
      const f = state.breakFrags[i];
      const age = (now - f.born) / f.life;
      ctx.globalAlpha = 1 - age;
      ctx.save();
      ctx.translate(f.x, f.y - camY);
      ctx.rotate(f.rot);
      ctx.fillStyle = f.color;
      ctx.fillRect(-f.size/2, -f.size/2, f.size, f.size);
      ctx.strokeStyle = 'rgba(0,0,0,.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-f.size/2, -f.size/2, f.size, f.size);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    for (let i = state.particles.length - 1; i >= 0; i--){
      const p = state.particles[i];
      const age = (now - p.born) / p.life;
      if (age >= 1){ state.particles.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = p.color;
      const px = p.x;
      const py = p.y - camY + p.vy * age * 0.5 + age * age * 250;
      ctx.fillRect(Math.round(px - p.size / 2), Math.round(py - p.size / 2), p.size, p.size);
      ctx.globalAlpha = 1;
    }

    for (let i = state.confetti.length - 1; i >= 0; i--){
      const cf = state.confetti[i];
      const age = (now - cf.born) / cf.life;
      if (age >= 1){ state.confetti.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - age;
      ctx.save();
      ctx.translate(cf.x + cf.vx * age * 0.5, cf.y - camY + cf.vy * age * 0.5 + age * age * 320);
      ctx.rotate(cf.rot + age * 8);
      ctx.fillStyle = cf.color;
      ctx.fillRect(-cf.w/2, -cf.h/2, cf.w, cf.h);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    drawFloatTexts(now, camY);

    ctx.restore();

    if (state.tntFlash > 0){
      const alpha = state.tntFlash * 0.42;
      const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
      grad.addColorStop(0, 'rgba(255,200,100,' + alpha + ')');
      grad.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      state.tntFlash -= 0.06;
      if (state.tntFlash < 0) state.tntFlash = 0;
    }

    if (state.pickaxe){
      const row = Math.max(0, Math.min(MAP_ROWS, Math.floor(state.pickaxe.y / BLOCK_SIZE)));
      statDepthEl.textContent = row + '/' + MAP_ROWS;
    } else {
      statDepthEl.textContent = '0/' + MAP_ROWS;
    }
    statEarnedEl.textContent = '+' + state.roundEarned.toFixed(2);
  }

  function drawCloud(cx, cy, size){
    if (cy < -40 || cy > H + 40) return;
    ctx.beginPath();
    ctx.arc(cx, cy, size * 0.4, 0, Math.PI * 2);
    ctx.arc(cx + size * 0.35, cy - size * 0.1, size * 0.5, 0, Math.PI * 2);
    ctx.arc(cx + size * 0.75, cy, size * 0.4, 0, Math.PI * 2);
    ctx.arc(cx + size * 0.4, cy + size * 0.15, size * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  function spawnMoneyBall(screenX, screenY, text, ballClass){
    const el = document.createElement('div');
    el.className = 'money-ball ' + (ballClass || 'green');
    el.textContent = text;
    el.style.left = screenX + 'px';
    el.style.top = screenY + 'px';
    floats.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.remove(); }, 1700);
  }

  /* ============================================================
     PHYSICS — perfect circle-vs-AABB. Damage on any impact.
     ============================================================ */
  function circleRectContact(cx, cy, r, rx, ry, rw, rh){
    const inside = (cx > rx && cx < rx + rw && cy > ry && cy < ry + rh);
    if (inside){
      const leftDist  = cx - rx;
      const rightDist = (rx + rw) - cx;
      const topDist   = cy - ry;
      const botDist   = (ry + rh) - cy;
      const m = Math.min(leftDist, rightDist, topDist, botDist);
      let nxn = 0, nyn = 0;
      if (m === leftDist)       nxn = -1;
      else if (m === rightDist) nxn =  1;
      else if (m === topDist)   nyn = -1;
      else                      nyn =  1;
      return { nxn, nyn, overlap: r + m };
    }

    const nearestX = Math.max(rx, Math.min(cx, rx + rw));
    const nearestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    const d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return null;
    const d = Math.sqrt(d2) || 0.0001;
    return { nxn: dx / d, nyn: dy / d, overlap: r - d };
  }

  function updateStuck(dt){
    const p = state.pickaxe;
    if (!p) return;
    if (Math.abs(p.y - state.lastStuckY) < 3 && Math.abs(p.vy) < 40){
      state.stuckTimer += dt;
      if (state.stuckTimer > 0.6){
        p.vx += (Math.random() > 0.5 ? 1 : -1) * 300;
        p.vy = 260;
        state.stuckTimer = 0;
      }
    } else {
      state.lastStuckY = p.y;
      state.stuckTimer = 0;
    }
  }

  let damageThisFrame = false;

  function updatePhysics(dt, now){
    const p = state.pickaxe;
    if (!p) return;

    damageThisFrame = false;

    const maxMove = Math.max(Math.abs(p.vx * dt), Math.abs(p.vy * dt));
    const substeps = Math.max(1, Math.ceil(maxMove / (p.r * 0.55)));
    const subDt = dt / substeps;

    for (let s = 0; s < substeps; s++){
      const alive = stepPhysics(p, subDt, now);
      if (!alive) return;
    }
  }

  function stepPhysics(p, dt, now){
    p.vy += GRAVITY * p.speed * dt;
    if (p.vy > TERMINAL_VY * p.speed) p.vy = TERMINAL_VY * p.speed;
    p.vx *= Math.pow(0.995, dt * 60);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.angle += p.angleVel * dt;
    p.angleVel *= Math.pow(0.985, dt * 60);

    const r = p.r;

    if (p.x - r < 0){ p.x = r; p.vx = Math.abs(p.vx) * WALL_REST + 120; p.angleVel += ANGULAR_KICK; }
    if (p.x + r > W){ p.x = W - r; p.vx = -Math.abs(p.vx) * WALL_REST - 120; p.angleVel -= ANGULAR_KICK; }

    const row = Math.floor(p.y / BLOCK_SIZE);
    const col = Math.floor(p.x / BLOCK_SIZE);
    const contacts = [];
    for (let dr = -1; dr <= 1; dr++){
      for (let dc = -1; dc <= 1; dc++){
        const rr = row + dr, cc = col + dc;
        if (rr < 0 || rr >= MAP_ROWS || cc < 0 || cc >= MAP_COLS) continue;
        const b = state.blocks[rr][cc];
        if (!b || b.broken) continue;
        const c = circleRectContact(p.x, p.y, r, cc * BLOCK_SIZE, rr * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        if (!c) continue;
        contacts.push({ rr, cc, b, nxn: c.nxn, nyn: c.nyn, overlap: c.overlap });
      }
    }

    if (contacts.length === 0){
      if (p.y > MAP_HEIGHT_PX + 100){ endRound('bottom'); return false; }
      updateStuck(dt);
      return true;
    }

    contacts.sort((a, b) => b.overlap - a.overlap);

    for (let iter = 0; iter < 4; iter++){
      let anyOverlap = false;
      for (let i = 0; i < contacts.length; i++){
        const c = contacts[i];
        const cc = circleRectContact(p.x, p.y, r, c.cc * BLOCK_SIZE, c.rr * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        if (!cc) continue;
        p.x += cc.nxn * (cc.overlap + 0.1);
        p.y += cc.nyn * (cc.overlap + 0.1);
        anyOverlap = true;
      }
      if (!anyOverlap) break;
    }

    const primary = contacts[0];
    const vn = p.vx * primary.nxn + p.vy * primary.nyn;
    const vnMagnitude = Math.abs(vn);

    // Bouncy reflection
    if (vn < 0){
      if (primary.b.type === 'slime' && primary.nyn < -0.5){
        p.vy = -Math.abs(p.vy) * 1.6 - 320;
        p.vx += (Math.random() - 0.5) * KICK_X * 0.9;
        p.angleVel += (Math.random() - 0.5) * 26;
        state.shake = Math.max(state.shake, 7);
      } else {
        // Bouncier: reflect with BLOCK_REST (0.68)
        p.vx -= (1 + BLOCK_REST) * vn * primary.nxn;
        p.vy -= (1 + BLOCK_REST) * vn * primary.nyn;
        if (primary.nyn < -0.5){
          // Extra horizontal kick + spin on a floor bounce
          p.vx += (Math.random() - 0.5) * KICK_X;
          p.angleVel += (Math.random() - 0.5) * ANGULAR_KICK;
          state.shake = Math.max(state.shake, Math.min(11, 3 + vnMagnitude / 100));
        }
      }
    }

    if (vn < 0 && vnMagnitude > MIN_IMPACT_SPEED && !damageThisFrame){
      damageThisFrame = true;

      const tierInfo = PICKAXES.find(x => x.key === p.tier) || PICKAXES[0];
      const speedBonus = Math.min(0.22, (vnMagnitude / 420) * 0.16);
      const baseDamage = 0.55 + tierInfo.power * 0.09;

      const isCrit = Math.random() < CRIT_CHANCE;
      const damageMult = isCrit ? CRIT_MULT : 1;
      const damage = (baseDamage + speedBonus) * damageMult;

      let brokenCount = 0;
      let brokeRewardTotal = 0;
      let durCost = 0;

      for (let i = 0; i < contacts.length; i++){
        const c = contacts[i];
        const result = damageBlock(c.rr, c.cc, c.b, damage, now, isCrit);
        if (result && result.broke){
          brokenCount++;
          brokeRewardTotal += result.payout || 0;
        }
        // Weight durability cost: insta blocks are cheap
        durCost += BLOCKS[c.b.type].insta ? DUR_COST_INSTA : DUR_COST_ORE;
      }

      if (isCrit){
        Sound.crit();
        haptic('heavy');
        spawnFloatText(p.x, p.y - 14, 'CRIT!', {
          color:'#fff2a8', size:16, life:750, vy:-110, jx:0, pop:true
        });
        state.shake = Math.max(state.shake, 14);
      }

      // Apply weighted durability cost (min 1 so it always drains at least a bit)
      p.dur -= Math.max(1, Math.ceil(durCost));
      state.roundHits += contacts.length;
      updateHero(true);

      if (p.dur <= 0){
        setTimeout(() => { if (state.pickaxe) endRound('break'); }, 150);
        return false;
      }

      if (brokenCount === 0) Sound.rock();
      else if (brokenCount === 1) Sound.break();
      else Sound.bigBreak();

      if (brokenCount >= 2){
        const comboBonus = state.bet * (brokenCount - 1) * 0.5;
        state.roundEarned += comboBonus;
        state.balance += comboBonus;
        persistBalance();
        updateBalance(true);
        updateHero(true);
        Sound.combo(brokenCount);
        haptic('heavy');
        showToast('⚡ ' + brokenCount + '× COMBO  +' + comboBonus.toFixed(2));

        spawnFloatText(p.x, p.y - 46, '+' + comboBonus.toFixed(2), {
          color:'#ff7ad9', size:17, life:1100, vy:-95, jx:0, pop:true
        });

        state.shake = Math.max(state.shake, Math.min(20, 6 + brokenCount * 1.4));
        bumpBalancePill();
      }
    }

    if (p.y > MAP_HEIGHT_PX + 100){ endRound('bottom'); return false; }
    updateStuck(dt);
    return true;
  }

  function damageBlock(r, c, b, dmg, now, isCrit){
    if (b.broken) return null;
    const bd = BLOCKS[b.type];

    if (bd.insta){
      breakBlock(r, c, b, now, isCrit);
      return { broke:true, payout: 0 };
    }

    const bx = c * BLOCK_SIZE + BLOCK_SIZE / 2;
    const by = r * BLOCK_SIZE + BLOCK_SIZE / 2;

    spawnFloatText(bx, by - 6, '-' + dmg.toFixed(2), {
      color: isCrit ? '#fff2a8' : '#ffb04d',
      size: isCrit ? 13 : 11,
      life: 620, vy: -60, outline:true
    });

    b.hp -= dmg;
    spawnSparks(bx, by, b.type === 'namek' ? 10 : 4, bd.particleColor || '#fff');

    if (b.hp <= 0){
      const res = breakBlock(r, c, b, now, isCrit);
      return { broke:true, payout: res ? res.payout : 0 };
    }
    return { broke:false, payout:0 };
  }

  function breakBlock(r, c, b, now, isCrit){
    if (b.broken) return null;
    b.broken = true;
    state.blocksBroken++;
    const bd = BLOCKS[b.type];
    const bx = c * BLOCK_SIZE + BLOCK_SIZE / 2;
    const by = r * BLOCK_SIZE + BLOCK_SIZE / 2;

    const fragmentCount = (b.type === 'diamond' || b.type === 'emerald' || b.type === 'namek') ? 16 : 8;
    spawnBreakFrags(bx, by, bd.top || bd.oreColor || '#8a8a8a', bd.bot || bd.oreColor || '#5a5a5a', fragmentCount);

    const particleColor = bd.particleColor || '#8a8a8a';
    for (let i = 0; i < 12; i++){
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 170;
      state.particles.push({
        x: bx, y: by,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 140,
        size: 2 + Math.random() * 4,
        color: particleColor,
        born: now,
        life: 500 + Math.random() * 500,
      });
    }

    if (b.type === 'tnt'){
      state.shake = 26;
      state.tntFlash = 1;
      triggerTntFlash();
      Sound.tnt();
      haptic('heavy');
      if (state.pickaxe){
        state.pickaxe.vy = -Math.abs(state.pickaxe.vy) - 620;
        state.pickaxe.vx += (Math.random() - 0.5) * 400;
        state.pickaxe.angleVel = (Math.random() - 0.5) * 30;
      }
      spawnFloatText(bx, by, 'BOOM!', { color:'#ff9d4d', size:20, life:900, vy:-120, jx:0 });
      explodeArea(r, c, 1, now);
      return { broke:true, payout:0 };
    }

    if (b.type === 'craft'){
      const p = state.pickaxe;
      if (!p) return { broke:true, payout:0 };
      const idx = PICKAXES.findIndex(x => x.key === p.tier);
      if (idx < PICKAXES.length - 1){
        const next = PICKAXES[idx + 1];
        p.tier = next.key;
        p.speed = next.speed;
        p.maxDur = next.dur;
        p.dur = next.dur;
        p.y = Math.min(p.y, r * BLOCK_SIZE - p.r - 4);
        p.vy = -Math.abs(p.vy) * 0.5 - 40;
        showToast('⛏ ' + next.name + ' Pickaxe!');
        spawnFloatText(bx, by, '⛏ ' + next.name, { color:next.color, size:17, life:1200, vy:-100, jx:0 });
      } else {
        p.dur = p.maxDur;
        p.y = Math.min(p.y, r * BLOCK_SIZE - p.r - 4);
        p.vy = -Math.abs(p.vy) * 0.5 - 40;
        showToast('⛏ Fully repaired');
        spawnFloatText(bx, by, 'REPAIRED', { color:'#8ef0b8', size:16, life:1000, vy:-100, jx:0 });
      }
      Sound.craft();
      haptic('heavy');
      updateHero(true);
      return { broke:true, payout:0 };
    }

    let payout = 0;
    if (bd.reward > 0){
      payout = state.bet * bd.reward * (isCrit ? 1.5 : 1);
      state.roundEarned += payout;
      state.balance += payout;
      persistBalance();
      updateBalance(true);
      updateHero(true);
      bumpBalancePill();

      const sx = c * BLOCK_SIZE + BLOCK_SIZE / 2;
      const sy = r * BLOCK_SIZE - state.cameraY + BLOCK_SIZE / 2;

      let ballClass = bd.ballColor || 'green';
      if (b.type === 'diamond') ballClass = 'cyan diamond';
      else if (b.type === 'emerald') ballClass = 'emerald emerald-lg';
      else if (b.type === 'namek') ballClass = 'emerald emerald-lg';
      spawnMoneyBall(sx, sy, '+' + payout.toFixed(2), ballClass);

      spawnFloatText(bx, by - 10, '+' + payout.toFixed(2), {
        color: isCrit ? '#fff2a8' : (b.type === 'namek' ? '#a6ff8a' : (b.type === 'emerald' ? '#7affa0' : '#ffd24a')),
        size: isCrit ? 20 : (bd.reward >= 8 ? 18 : (bd.reward >= 2 ? 16 : 14)),
        life: 1200, vy: -95, jx:0, pop:true
      });

      state.streak++;
      state.streakTimer = 1.8;
      if (state.streak >= 3){
        showStreakBadge(state.streak);
      }

      if (b.type === 'namek'){
        Sound.namek();
        haptic('heavy');
        spawnConfetti(bx, by, 34);
        state.tntFlash = Math.max(state.tntFlash, 0.5);
        spawnFloatText(bx, by - 40, '✦ NAMEK ✦', { color:'#a6ff8a', size:16, life:1300, vy:-80, jx:0 });
      } else if (b.type === 'diamond' || b.type === 'emerald'){
        Sound.bigOre();
        haptic('heavy');
        spawnConfetti(bx, by, 24);
      } else {
        Sound.ore();
        haptic('medium');
      }
    } else {
      if (b.type === 'slime') haptic('medium');
    }

    return { broke:true, payout };
  }

  function explodeArea(centerR, centerC, radius, now){
    for (let dr = -radius; dr <= radius; dr++){
      for (let dc = -radius; dc <= radius; dc++){
        if (dr === 0 && dc === 0) continue;
        const r = centerR + dr, c = centerC + dc;
        if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) continue;
        const b = state.blocks[r][c];
        if (!b || b.broken) continue;

        const bd = BLOCKS[b.type];
        const bx = c * BLOCK_SIZE + BLOCK_SIZE / 2;
        const by = r * BLOCK_SIZE + BLOCK_SIZE / 2;

        b.broken = true;
        state.blocksBroken++;

        spawnBreakFrags(bx, by, bd.top || bd.oreColor || '#8a8a8a', bd.bot || '#5a5a5a', 5);

        for (let i = 0; i < 6; i++){
          const ang = Math.random() * Math.PI * 2;
          const spd = 80 + Math.random() * 180;
          state.particles.push({
            x: bx, y: by,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 120,
            size: 2 + Math.random() * 4,
            color: Math.random() < 0.5 ? '#ff9d4d' : '#ff5020',
            born: now,
            life: 400 + Math.random() * 400,
          });
        }

        if (bd.reward > 0){
          const payout = state.bet * bd.reward;
          state.roundEarned += payout;
          state.balance += payout;
          persistBalance();
          updateBalance(true);
          updateHero(true);
          let ballClass = bd.ballColor || 'green';
          if (b.type === 'diamond') ballClass = 'cyan diamond';
          else if (b.type === 'emerald') ballClass = 'emerald emerald-lg';
          else if (b.type === 'namek') ballClass = 'emerald emerald-lg';
          spawnMoneyBall(bx, by - state.cameraY, '+' + payout.toFixed(2), ballClass);
          spawnFloatText(bx, by - 10, '+' + payout.toFixed(2), {
            color:'#ffd24a', size:16, life:1200, vy:-95, jx:0, pop:true
          });
        }
      }
    }
  }

  function spawnSparks(x, y, count, color){
    for (let i = 0; i < count; i++){
      const ang = Math.random() * Math.PI * 2;
      const spd = 80 + Math.random() * 160;
      state.particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 100,
        size: 1.5 + Math.random() * 2.5,
        color: color || '#ffffff',
        born: performance.now(),
        life: 400 + Math.random() * 300,
      });
    }
  }

  function spawnConfetti(x, y, count){
    const colors = ['#4CC38A', '#5b9dff', '#d4b46a', '#ffffff', '#b47aff', '#5ce0e0', '#f5d76e', '#7dff6b'];
    for (let i = 0; i < count; i++){
      const ang = Math.random() * Math.PI * 2;
      const spd = 80 + Math.random() * 200;
      state.confetti.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 100,
        w: 4 + Math.random() * 4,
        h: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        color: colors[(Math.random() * colors.length) | 0],
        born: performance.now(),
        life: 1200 + Math.random() * 400,
      });
    }
  }

  let streakTimerHandle = null;
  function showStreakBadge(n){
    streakBadge.textContent = 'x' + n + ' STREAK';
    streakBadge.classList.remove('fade');
    streakBadge.classList.add('show');
    clearTimeout(streakTimerHandle);
    streakTimerHandle = setTimeout(() => {
      streakBadge.classList.add('fade');
      streakBadge.classList.remove('show');
    }, 700);
  }

  function bumpBalancePill(){
    balancePill.classList.remove('bump');
    void balancePill.offsetWidth;
    balancePill.classList.add('bump');
    setTimeout(() => balancePill.classList.remove('bump'), 180);
  }

  let tntFlashTimer = null;
  function triggerTntFlash(){
    tntFlashEl.classList.add('on');
    clearTimeout(tntFlashTimer);
    tntFlashTimer = setTimeout(() => tntFlashEl.classList.remove('on'), 120);
  }

  function updateHero(animate){
    const p = state.pickaxe;
    if (!p){
      pickIconEl.innerHTML = pickSVGPath('wood', 32, 38);
      pickIconEl.style.opacity = '.35';
      pickIconEl.style.borderColor = 'rgba(255,255,255,.14)';
      heroNameEl.textContent = 'No pickaxe';
      heroNameEl.className = '';
      heroEarnedEl.textContent = '+0.00 ◆';
      duraFillEl.style.width = '100%';
      duraFillEl.style.opacity = '.2';
      duraTextEl.textContent = '— / —';
      return;
    }
    pickIconEl.style.opacity = '1';
    const t = PICKAXES.find(x => x.key === p.tier) || PICKAXES[0];
    pickIconEl.innerHTML = pickSVGPath(p.tier, 32, 38);
    pickIconEl.style.borderColor = t.color + '90';

    heroNameEl.textContent = t.name + ' Pickaxe';
    heroNameEl.className = 'tier-' + p.tier;

    heroEarnedEl.textContent = '+' + state.roundEarned.toFixed(2) + ' ◆';

    const durPct = Math.max(0, (p.dur / p.maxDur) * 100);
    duraFillEl.style.opacity = '1';
    duraFillEl.style.width = durPct + '%';
    duraTextEl.textContent = p.dur + ' / ' + p.maxDur;

    if (animate){
      heroEarnedEl.classList.remove('bump');
      void heroEarnedEl.offsetWidth;
      heroEarnedEl.classList.add('bump');
      setTimeout(() => heroEarnedEl.classList.remove('bump'), 200);
    }
  }

  let balanceAnimInterval = null;
  function updateBalance(animate){
    const target = Math.floor(state.balance);
    if (animate){
      const from = parseInt(balanceEl.textContent.replace(/,/g, ''), 10) || 0;
      if (from !== target){
        if (balanceAnimInterval) cancelAnimationFrame(balanceAnimInterval);
        const start = performance.now();
        const dur = 340;
        function step(t){
          const p = Math.min(1, (t - start) / dur);
          const e = 1 - Math.pow(1 - p, 3);
          balanceEl.textContent = Math.round(from + (target - from) * e).toLocaleString('en-US');
          if (p < 1) balanceAnimInterval = requestAnimationFrame(step);
          else { balanceEl.textContent = target.toLocaleString('en-US'); balanceAnimInterval = null; }
        }
        balanceAnimInterval = requestAnimationFrame(step);
        return;
      }
    }
    balanceEl.textContent = target.toLocaleString('en-US');
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function updateActionButton(){
    if (state.gameState === 'idle'){
      actionBtn.textContent = 'Place bet & Start';
      actionBtn.disabled = state.balance < Math.max(MIN_BET, state.bet);
      betInput.disabled = false;
      allInBtn.disabled = false;
    } else {
      actionBtn.textContent = state.gameState === 'spinning' ? 'Rolling…' : 'Mining…';
      actionBtn.disabled = true;
      betInput.disabled = true;
      allInBtn.disabled = true;
    }
  }

  function triggerTurbo(){
    if (state.gameState !== 'mining') return;
    const wasActive = state.turbo;
    state.turbo = true;
    state.turboUntil = performance.now() + 3000;
    if (!wasActive){
      Sound.turbo();
      haptic('heavy');
      turboIndicator.classList.add('on');
      statTurboEl.classList.add('on');
    }
  }

  function updateTurbo(now){
    if (state.turbo && now > state.turboUntil){
      state.turbo = false;
      turboIndicator.classList.remove('on');
      statTurboEl.classList.remove('on');
    }
  }

  frame.addEventListener('pointerdown', () => { triggerTurbo(); });

  function weightedPickIndex(){
    const total = PICK_WEIGHTS.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < PICK_WEIGHTS.length; i++){
      r -= PICK_WEIGHTS[i];
      if (r <= 0) return i;
    }
    return 0;
  }

  function startGame(){
    if (state.gameState !== 'idle') return;
    const bet = Math.max(MIN_BET, Math.floor(state.bet));
    if (bet > state.balance){ showToast('Insufficient balance'); haptic('light'); return; }

    state.bet = bet;
    state.balance -= bet;
    persistBalance();
    updateBalance(true);

    state.blocks = generateMap();
    state.gameState = 'spinning';
    state.cameraY = -H * 0.35;
    state.roundEarned = 0;
    state.roundHits = 0;
    state.blocksBroken = 0;
    state.particles.length = 0;
    state.confetti.length = 0;
    state.breakFrags.length = 0;
    state.floatTexts.length = 0;
    state.tntFlash = 0;
    state.turbo = false;
    state.turboUntil = 0;
    state.depthShown = 0;
    state.streak = 0;
    state.streakTimer = 0;
    turboIndicator.classList.remove('on');
    statTurboEl.classList.remove('on');
    streakBadge.classList.remove('show', 'fade');
    startHint.classList.remove('show');
    endHint.classList.remove('show', 'win', 'lose');
    updateActionButton();

    const targetIdx = weightedPickIndex();
    showReel(targetIdx);
  }

  function spawnPickaxe(tier){
    const t = PICKAXES.find(x => x.key === tier);
    const r = BLOCK_SIZE * 0.40;
    const spawnX = BLOCK_SIZE * (0.5 + Math.random() * (MAP_COLS - 1));
    state.pickaxe = {
      x: spawnX,
      y: -BLOCK_SIZE * 10,
      vx: (Math.random() - 0.5) * 140,
      vy: 100,
      r: r,
      tier: tier,
      maxDur: t.dur,
      dur: t.dur,
      speed: t.speed,
      angle: 0,
      angleVel: 5 + Math.random() * 5,
    };
    state.stuckTimer = 0;
    state.lastStuckY = state.pickaxe.y;
    updateHero(true);

    setTimeout(() => {
      spinOverlay.classList.remove('show');
      spinResult.classList.remove('show');
    }, 350);
  }

  function endRound(reason){
    if (state.gameState !== 'mining') return;
    state.gameState = 'ended';
    state.turbo = false;
    turboIndicator.classList.remove('on');
    statTurboEl.classList.remove('on');

    const earned = state.roundEarned;
    const isBreak = reason === 'break';

    if (state.pickaxe && isBreak){
      spawnBreakDebris(state.pickaxe);
      Sound.pickBreak();
    }

    endTitle.textContent = isBreak ? 'Pickaxe broke' : 'Reached the bottom';
    endAmount.textContent = (earned > 0 ? '+' : '') + earned.toFixed(2) + ' ◆';
    endHint.classList.remove('win', 'lose');
    endHint.classList.add(earned > 0 ? 'win' : 'lose');
    endHint.classList.add('show');

    if (earned > 0){
      if (earned >= state.bet * 5) Sound.bigWin();
      else Sound.cashout();
    }

    if (state.bet > 0){
      const ratio = earned / state.bet;
      state.history.unshift(ratio);
      if (state.history.length > 15) state.history.length = 15;
      if (ratio > state.best) state.best = ratio;
      renderHistory();
    }

    setTimeout(() => {
      endHint.classList.remove('show');
      state.gameState = 'idle';
      state.pickaxe = null;
      state.blocks = generateMap();
      state.cameraY = 0;
      state.roundEarned = 0;
      updateHero();
      updateActionButton();
      startHint.classList.add('show');
    }, 2400);
  }

  function spawnBreakDebris(p){
    const sx = p.x;
    const sy = p.y - state.cameraY;
    const t = PICKAXES.find(x => x.key === p.tier) || PICKAXES[0];
    for (let i = 0; i < 8; i++){
      const el = document.createElement('div');
      el.className = 'debris';
      const size = 6 + Math.random() * 8;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      el.style.background = i < 3 ? '#4a3018' : t.color;
      el.style.borderRadius = '2px';
      el.style.opacity = '1';
      const ang = (i / 8) * Math.PI * 2 + Math.random() * 0.4;
      const dist = 60 + Math.random() * 80;
      const tx = Math.cos(ang) * dist;
      const ty = Math.sin(ang) * dist - 40;
      el.animate([
        { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + tx + 'px), calc(-50% + ' + ty + 'px)) rotate(' + (360 + Math.random() * 720) + 'deg)', opacity: 0 },
      ], { duration: 900, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
      floats.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.remove(); }, 1000);
    }
  }

  function pillStyle(ratio){
    if (ratio < 0.5)  return { top:'#3a1a22', bot:'#1c0c12', text:'#e0556b' };
    if (ratio < 1.0)  return { top:'#3a2e1a', bot:'#1e180c', text:'#f0d080' };
    if (ratio < 2.0)  return { top:'#2e323a', bot:'#161a22', text:'#d0d6de' };
    if (ratio < 5.0)  return { top:'#1e2e50', bot:'#0e1630', text:'#a8c0f0' };
    if (ratio < 12)   return { top:'#2e1e50', bot:'#160e30', text:'#c8a8f0' };
    return              { top:'#1e3a2c', bot:'#0e1e16', text:'#8ef0b8' };
  }
  function renderHistory(){
    if (!state.history.length){
      historyStrip.innerHTML = '<div class="history-empty">No runs yet — place a bet to start mining</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    state.history.forEach(r => {
      const col = pillStyle(r);
      const pill = document.createElement('div');
      pill.className = 'history-pill';
      pill.style.background = 'linear-gradient(180deg, ' + col.top + ', ' + col.bot + ')';
      pill.style.color = col.text;
      pill.textContent = r.toFixed(2) + 'x';
      frag.appendChild(pill);
    });
    historyStrip.innerHTML = '';
    historyStrip.appendChild(frag);
  }

  function clampBet(){
    let v = parseInt(betInput.value.replace(/[^\d]/g, ''), 10);
    if (!Number.isFinite(v) || v < MIN_BET) v = MIN_BET;
    if (v > Math.floor(state.balance)) v = Math.max(MIN_BET, Math.floor(state.balance));
    state.bet = v;
    betInput.value = v;
    updateActionButton();
  }
  betInput.addEventListener('input', () => {
    betInput.value = betInput.value.replace(/[^\d]/g, '').slice(0, 9);
  });
  betInput.addEventListener('blur', clampBet);
  betInput.addEventListener('keydown', e => { if (e.key === 'Enter') betInput.blur(); });

  allInBtn.addEventListener('click', () => {
    if (state.gameState !== 'idle') return;
    const amt = Math.max(MIN_BET, Math.floor(state.balance));
    if (amt < MIN_BET){ showToast('Balance too low'); return; }
    betInput.value = amt;
    state.bet = amt;
    haptic('light');
    Sound.click();
    updateActionButton();
  });

  actionBtn.addEventListener('click', () => {
    if (state.gameState !== 'idle') return;
    clampBet();
    startGame();
  });

  $('#back-btn').addEventListener('click', () => {
    haptic('light');
    Sound.click();
    try {
      if (TG?.close) TG.close();
      else history.back();
    } catch(_){}
  });

  function typeText(el, text, speed){
    if (el._typeTimer){ clearTimeout(el._typeTimer); el._typeTimer = null; }
    el.textContent = '';
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);
    let i = 0;
    function step(){
      if (i >= text.length){
        el._typeTimer = null;
        setTimeout(() => { if (caret.parentNode) caret.remove(); }, 700);
        return;
      }
      el.insertBefore(document.createTextNode(text.charAt(i++)), caret);
      el._typeTimer = setTimeout(step, speed || 55);
    }
    step();
  }

  function updateCamera(dt){
    if (!state.pickaxe){
      const target = -H * 0.35;
      state.cameraY += (target - state.cameraY) * Math.min(1, dt * 3);
      return;
    }
    const target = state.pickaxe.y - H * 0.42;
    const minY = -H * 1.5;
    const maxY = MAP_HEIGHT_PX - H * 0.6;
    const clamped = Math.max(minY, Math.min(maxY, target));
    state.cameraY += (clamped - state.cameraY) * Math.min(1, dt * 8);
  }

  function updateDepthMilestone(now){
    if (!state.pickaxe) return;
    const row = Math.floor(state.pickaxe.y / BLOCK_SIZE);
    const milestone = Math.floor(row / 10) * 10;
    if (milestone > 0 && milestone > state.depthShown){
      state.depthShown = milestone;
      Sound.depth();
      haptic('medium');
      const bonus = state.bet * 0.5 * (milestone / 10);
      state.roundEarned += bonus;
      state.balance += bonus;
      persistBalance();
      updateBalance(true);
      updateHero(true);
      bumpBalancePill();
      showToast('⛏ DEPTH ' + milestone + 'm  +' + bonus.toFixed(2));
      spawnFloatText(state.pickaxe.x, state.pickaxe.y - 30, 'DEPTH ' + milestone + 'm  +' + bonus.toFixed(2), {
        color:'#8fb8ff', size:15, life:1500, vy:-110, jx:0, pop:true
      });
    }
  }

  let rafId = null;
  function loop(now){
    rafId = requestAnimationFrame(loop);
    if (document.hidden) return;
    if (!state.lastFrame) state.lastFrame = now;
    let dt = (now - state.lastFrame) / 1000;
    state.lastFrame = now;
    dt = Math.min(0.033, dt);

    if (state.turbo) dt *= TURBO_SCALE;

    updateTurbo(now);
    updateFloatTexts(now);

    if (state.streakTimer > 0){
      state.streakTimer -= dt * (state.turbo ? 1 / TURBO_SCALE : 1);
      if (state.streakTimer <= 0){
        state.streak = 0;
      }
    }

    if (state.gameState === 'mining'){
      if (state.turbo){
        for (let i = 0; i < 3; i++){
          updatePhysics(dt / 3, now);
        }
      } else {
        updatePhysics(dt, now);
      }
      updateDepthMilestone(now);
      updateCamera(dt);
    } else if (state.gameState === 'spinning'){
      updateReel(now);
      updateCamera(dt);
    } else {
      updateCamera(dt);
    }
    updateFrags(now);
    render(now);
  }

  let resizeDebounce = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => { resizeCanvas(); }, 120);
  });
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 260));

  function init(){
    typeText(topbarTitle, 'Mineshaft', 85);
    updateBalance(false);
    betInput.value = state.bet;
    state.blocks = generateMap();
    state.cameraY = -H * 0.35;
    updateHero();
    updateActionButton();
    renderHistory();

    startHintIcon.innerHTML = pickSVGPath('diamond', 72, 72);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      resizeCanvas();
      state.cameraY = -H * 0.35;
      startHint.classList.add('show');
      if (rafId) cancelAnimationFrame(rafId);
      state.lastFrame = 0;
      rafId = requestAnimationFrame(loop);
    }));
  }

  init();

})();
</script>

</body>
</html>
