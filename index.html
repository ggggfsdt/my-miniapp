<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>ARIA-7 ∞</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  background:#050810;color:#e8eefc;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;transform:translateZ(0)}
canvas{position:absolute;inset:0;display:block;will-change:transform}

.topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;gap:8px;align-items:flex-start;z-index:10;pointer-events:none}
.topbar>*{pointer-events:auto}
.aiCard{flex:1;display:flex;gap:9px;align-items:center;padding:8px 11px;border-radius:16px;
  background:rgba(15,25,45,.72);backdrop-filter:blur(14px);border:1px solid rgba(120,190,255,.22);
  box-shadow:0 8px 24px rgba(0,0,0,.55);min-width:0}
.aiOrb{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 32% 30%,#c8f8ff 0%,#4de0ff 40%,#1a6eb8 100%);
  box-shadow:0 0 20px rgba(77,224,255,.7)}
.aiOrb.happy{background:radial-gradient(circle at 32% 30%,#c8ffdc 0%,#6ee7a0 40%,#1a8a5c 100%)}
.aiOrb.angry{background:radial-gradient(circle at 32% 30%,#ffd0c8 0%,#ff6b6b 40%,#8a1e1e 100%)}
.aiOrb.sleepy{background:radial-gradient(circle at 32% 30%,#d8c8ff 0%,#b878ff 40%,#5a2a9a 100%)}
.aiInfo{flex:1;min-width:0}
.aiName{font-size:11px;font-weight:900;letter-spacing:1.6px;color:#9beaff;display:flex;align-items:center;gap:5px}
.aiMax{font-size:8.5px;font-weight:900;color:#ffd166;background:linear-gradient(180deg,rgba(255,209,102,.25),rgba(255,209,102,.08));
  padding:1px 5px;border-radius:5px;border:1px solid rgba(255,209,102,.5)}
.aiState{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:#8fa8c8;margin-top:1px;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;flex-direction:column;gap:2px;flex-shrink:0;min-width:50px}
.bar{height:4px;border-radius:2px;background:rgba(0,0,0,.5);overflow:hidden}
.bar>div{height:100%;border-radius:2px;transition:width .3s}
.bar.hp>div{background:linear-gradient(90deg,#ff4a4a,#ff8a8a)}
.bar.en>div{background:linear-gradient(90deg,#4de0ff,#a8f0ff)}
.bar.hu>div{background:linear-gradient(90deg,#ffa84a,#ffd18a)}
.iconBtn{width:40px;height:40px;flex-shrink:0;border-radius:13px;cursor:pointer;
  background:rgba(15,25,45,.72);backdrop-filter:blur(14px);border:1px solid rgba(120,190,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#dfe7f5;
  box-shadow:0 8px 24px rgba(0,0,0,.55);transition:transform .12s}
.iconBtn:active{transform:scale(.9)}
.iconBtn.on{background:linear-gradient(180deg,rgba(77,224,255,.5),rgba(30,110,180,.4));border-color:rgba(77,224,255,.7)}

.panel{position:absolute;background:rgba(20,30,55,.9);backdrop-filter:blur(14px);
  border:1px solid rgba(120,190,255,.22);border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);padding:12px;font-size:11.5px;line-height:1.5;
  transition:transform .25s,opacity .2s;z-index:12}
.panel.hidden{transform:translateX(120%);opacity:0;pointer-events:none}
#infoPanel{top:calc(env(safe-area-inset-top) + 66px);right:10px;width:206px}
.panelTitle{font-size:9.5px;font-weight:900;letter-spacing:2px;color:#4de0ff;
  margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.panelTitle::before{content:'';width:6px;height:6px;border-radius:50%;background:#4de0ff;box-shadow:0 0 8px #4de0ff}
.statRow{display:flex;justify-content:space-between;padding:4px 0;
  border-bottom:1px dashed rgba(120,190,255,.15);font-size:10.5px}
.statRow:last-child{border-bottom:none}
.statRow .lbl{color:#8fa8c8;font-weight:700}
.statRow .val{color:#e8eefc;font-weight:900}
#brainPanel{top:calc(env(safe-area-inset-top) + 66px);left:10px;width:220px;max-height:calc(100% - 260px);
  display:flex;flex-direction:column;overflow:hidden}
.thought{font-size:11px;color:#d8e8ff;font-style:italic;padding:8px 10px;border-radius:10px;
  background:linear-gradient(135deg,rgba(77,224,255,.12),rgba(184,120,255,.08));
  border:1px solid rgba(77,224,255,.28);margin-bottom:8px}
.memLabel{font-size:9px;font-weight:900;letter-spacing:1.5px;color:#8fa8c8;margin-bottom:4px;text-transform:uppercase}
.mem{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;line-height:1.5;
  background:rgba(0,0,0,.35);border-radius:8px;padding:6px 8px;color:#c8d8ff;
  max-height:90px;overflow-y:auto;border-left:2px solid rgba(110,231,160,.5)}
.mem::-webkit-scrollbar{width:0}
.mem .line{padding:1px 0;opacity:.85}
.mem .line.new{color:#6ee7a0;font-weight:900}

#uiForge{position:absolute;inset:0;pointer-events:none;z-index:15}
.aria-window{position:absolute;pointer-events:auto;
  background:linear-gradient(180deg,rgba(20,30,55,.97),rgba(10,18,35,.97));
  border:1.5px solid rgba(120,190,255,.4);border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.75),0 0 30px rgba(77,224,255,.25);
  overflow:hidden;animation:winIn .3s cubic-bezier(.34,1.4,.64,1);min-width:120px}
@keyframes winIn{from{opacity:0;transform:scale(.85) translateY(-8px)}to{opacity:1;transform:none}}
.win-head{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;background:linear-gradient(180deg,rgba(77,224,255,.15),rgba(77,224,255,.05));
  border-bottom:1px solid rgba(120,190,255,.2);cursor:grab;touch-action:none}
.win-head:active{cursor:grabbing}
.win-title{font-size:10.5px;font-weight:900;letter-spacing:1px;color:#9beaff;text-transform:uppercase}
.win-close{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,80,80,.25);color:#ffb0b0;font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.win-body{padding:10px;font-size:12px;color:#e8eefc;max-height:60vh;overflow-y:auto}
.win-body::-webkit-scrollbar{width:4px}
.win-body::-webkit-scrollbar-thumb{background:rgba(120,190,255,.4);border-radius:2px}
.win-body button{padding:6px 12px;border-radius:8px;border:1px solid rgba(120,190,255,.4);
  background:linear-gradient(180deg,rgba(77,224,255,.3),rgba(30,110,180,.2));
  color:#fff;font-weight:900;font-size:11px;cursor:pointer;font-family:inherit}
.win-body input,.win-body textarea{width:100%;padding:6px 8px;border-radius:8px;
  background:rgba(0,0,0,.4);border:1px solid rgba(120,190,255,.3);
  color:#fff;font-family:inherit;font-size:14px;outline:none;
  user-select:text;-webkit-user-select:text;touch-action:auto}
.calc-display{background:rgba(0,0,0,.5);padding:10px;border-radius:8px;text-align:right;
  font-family:ui-monospace,monospace;font-size:20px;color:#4de0ff;margin-bottom:8px;
  min-height:40px;overflow:hidden;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.calc-grid button{padding:10px 0;font-size:14px}
.piano-keys{display:flex;gap:3px;justify-content:center}
.piano-keys button{width:32px;padding:20px 0;font-size:11px}
.paint-canvas{width:100%;background:#1a1a2a;border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.stats-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px}
.notepad-area{width:100%;min-height:100px;font-size:12px;padding:8px;border-radius:8px;
  background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(120,190,255,.3);font-family:inherit;
  user-select:text;-webkit-user-select:text}

.questionBar{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 66px);
  padding:10px 12px;border-radius:14px;display:none;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(255,209,102,.22),rgba(200,150,0,.1));
  border:1px solid rgba(255,209,102,.6);z-index:16;
  box-shadow:0 12px 30px rgba(255,180,60,.35)}
.questionBar.show{display:flex;animation:qbIn .3s}
@keyframes qbIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.questionBar .qHead{font-size:9px;font-weight:900;letter-spacing:2px;color:#ffd166}
.questionBar .qText{font-size:12px;font-weight:800;color:#fff;line-height:1.4}
.questionBar .qOpts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.qOpt{padding:6px 12px;border-radius:10px;font-size:11px;font-weight:900;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,209,102,.5);color:#fff;cursor:pointer;
  transition:transform .1s;user-select:none}
.qOpt:active{transform:scale(.94)}

.itemPalette{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  display:flex;gap:5px;padding:7px 9px;border-radius:20px;
  background:rgba(20,30,55,.9);backdrop-filter:blur(14px);
  border:1px solid rgba(120,190,255,.22);box-shadow:0 10px 30px rgba(0,0,0,.6);
  z-index:11;overflow-x:auto;max-width:96vw;scrollbar-width:none}
.itemPalette::-webkit-scrollbar{display:none}
.item{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid rgba(120,190,255,.25);transition:transform .12s}
.item:active,.item.dragging{transform:scale(1.15);border-color:#4de0ff;
  box-shadow:0 0 20px rgba(77,224,255,.85)}

/* CHAT — the critical part */
.chatBar{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 6px);
  display:flex;gap:8px;align-items:center;padding:8px 8px 8px 14px;border-radius:22px;
  background:rgba(20,30,55,.95);backdrop-filter:blur(14px);
  border:1.5px solid rgba(120,190,255,.35);box-shadow:0 14px 40px rgba(0,0,0,.7);
  z-index:100;pointer-events:auto;touch-action:auto}
.chatBar input{flex:1;background:transparent;border:none;outline:none;color:#e8eefc;
  font-size:16px;font-family:inherit;padding:8px 0;min-width:0;
  user-select:text;-webkit-user-select:text;touch-action:auto;cursor:text}
.chatBar input::placeholder{color:#5a7898}
.chatSend{width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(180deg,#b0f0ff,#2b8fd0);border:none;color:#03121e;
  font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #175a8a;cursor:pointer;touch-action:manipulation;
  pointer-events:auto}
.chatSend:active{transform:translateY(2px);box-shadow:0 1px 0 #175a8a}

.log{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 62px);
  max-height:100px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;
  z-index:9;pointer-events:none;
  -webkit-mask-image:linear-gradient(0deg,transparent 0,#000 16px,#000 100%);
  mask-image:linear-gradient(0deg,transparent 0,#000 16px,#000 100%);
  padding-top:8px;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.logMsg{font-size:10px;line-height:1.4;padding:5px 9px;border-radius:9px;
  background:rgba(15,25,45,.8);border:1px solid rgba(120,190,255,.15);
  max-width:85%;align-self:flex-start;word-wrap:break-word}
.logMsg.user{align-self:flex-end;background:linear-gradient(180deg,rgba(77,224,255,.2),rgba(30,110,180,.15));
  border-color:rgba(77,224,255,.4)}
.logMsg.system{align-self:center;background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(200,150,0,.08));
  border-color:rgba(255,209,102,.4);font-weight:800;color:#fff6c2;text-align:center;font-size:9.5px}
.logMsg .from{font-weight:900;font-size:8.5px;letter-spacing:1px;opacity:.7;display:block;margin-bottom:1px}
.logMsg.user .from{color:#9beaff}
.logMsg .from{color:#6ee7a0}
.logMsg.system .from{display:none}

.throwGhost{position:fixed;pointer-events:none;z-index:150;font-size:32px;transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));display:none}
.throwGhost.show{display:block}
.hint{position:absolute;left:50%;top:36%;transform:translateX(-50%);
  padding:10px 16px;border-radius:14px;background:rgba(5,10,20,.88);
  border:1px solid rgba(120,190,255,.35);font-size:11.5px;font-weight:800;color:#c8d8ff;
  z-index:15;pointer-events:none;text-align:center;line-height:1.5;opacity:0;transition:opacity .4s;max-width:280px}
.hint.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="uiForge"></div>

  <div class="topbar">
    <div class="aiCard">
      <div class="aiOrb" id="aiOrb"></div>
      <div class="aiInfo">
        <div class="aiName">ARIA-7 <span class="aiMax">∞ MAX</span></div>
        <div class="aiState" id="aiState">initializing</div>
      </div>
      <div class="bars">
        <div class="bar hp"><div id="hpFill" style="width:100%"></div></div>
        <div class="bar en"><div id="enFill" style="width:100%"></div></div>
        <div class="bar hu"><div id="huFill" style="width:100%"></div></div>
      </div>
    </div>
    <button class="iconBtn" id="brainBtn">🧠</button>
    <button class="iconBtn" id="infoBtn">ⓘ</button>
  </div>

  <div class="questionBar" id="questionBar">
    <div class="qHead">ARIA-7 ASKS</div>
    <div class="qText" id="qText">…</div>
    <div class="qOpts" id="qOpts"></div>
  </div>

  <div class="panel hidden" id="infoPanel">
    <div class="panelTitle">WORLD SCAN</div>
    <div class="statRow"><span class="lbl">Entities</span><span class="val" id="wEnt">0</span></div>
    <div class="statRow"><span class="lbl">UI windows</span><span class="val" id="wWins">0</span></div>
    <div class="statRow"><span class="lbl">Memory items</span><span class="val" id="wMem">0</span></div>
    <div class="statRow"><span class="lbl">Spawns</span><span class="val" id="wSpawn">0</span></div>
    <div class="statRow"><span class="lbl">Teleports</span><span class="val" id="wTp">0</span></div>
    <div class="statRow"><span class="lbl">FPS</span><span class="val" id="wFps">60</span></div>
  </div>

  <div class="panel" id="brainPanel">
    <div class="panelTitle">COGNITION</div>
    <div class="thought" id="thought">Online</div>
    <div class="memLabel">MEMORY <span id="memCount" style="color:#6ee7a0">0</span></div>
    <div class="mem" id="mem"></div>
  </div>

  <div class="itemPalette">
    <div class="item" data-item="bomb" data-icon="💣">💣</div>
    <div class="item" data-item="apple" data-icon="🍎">🍎</div>
    <div class="item" data-item="ball" data-icon="⚽">⚽</div>
    <div class="item" data-item="bolt" data-icon="⚡">⚡</div>
    <div class="item" data-item="dragon" data-icon="🐉">🐉</div>
    <div class="item" data-item="crown" data-icon="👑">👑</div>
    <div class="item" data-item="paint" data-icon="🎨">🎨</div>
    <div class="item" data-item="star" data-icon="⭐">⭐</div>
  </div>

  <div class="log" id="log"></div>

  <div class="chatBar" id="chatBar">
    <input id="chatInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Ask ARIA-7 anything…">
    <button class="chatSend" id="chatSend" type="button">▶</button>
  </div>

  <div class="throwGhost" id="throwGhost"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
/* ================================================================
   TELEGRAM
================================================================ */
const tg = window.Telegram?.WebApp;
try{ if(tg){ tg.ready(); tg.expand(); tg.disableVerticalSwipes?.();
  tg.setHeaderColor?.('#050810'); tg.setBackgroundColor?.('#050810'); } }catch(e){}
const haptic = (s)=>{ try{ tg?.HapticFeedback?.impactOccurred(s||'light'); }catch(e){} };

/* ================================================================
   UTIL
================================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rand=(a,b)=>a+Math.random()*(b-a);
const choose=(a)=>a[(Math.random()*a.length)|0];
const lerp_=(a,b,t)=>a+(b-a)*t;

/* ================================================================
   CANVAS
================================================================ */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();
const GROUND=()=>H*0.72;
const G=900;

/* ================================================================
   WORLD
================================================================ */
const MAX_PARTICLES=180;
const World={
  t:0, entities:[], trees:[], rocks:[], berries:[], blocks:[],
  projectiles:[], particles:[], floaters:[], clouds:[], nextId:1,
};

function spawnParticles(x,y,count,color,spread,life,size,grav){
  spread=spread||120; life=life||0.55; size=size||3; grav=grav||200;
  const room=MAX_PARTICLES-World.particles.length;
  if(room<=0) return;
  count=Math.min(count,room);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=spread*(.4+Math.random()*.8);
    World.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life,maxLife:life,color,size:size*(.6+Math.random()*.8),grav});
  }
}
function spawnFloater(x,y,text,color,size){
  if(World.floaters.length>12) return;
  World.floaters.push({x,y,text,color:color||'#fff',size:size||12,life:1.2,maxLife:1.2,vy:-40});
}
function spawnRing(x,y,color,radius,life){
  if(World.particles.length>MAX_PARTICLES-6) return;
  World.particles.push({type:'ring',x,y,r:4,maxR:radius,life:life||.5,maxLife:life||.5,color});
}

function makeTexture(s){
  return{
    c1:s.color1||'#4de0ff',
    c2:s.color2||s.color1||'#1a6eb8',
    emoji:s.emoji||'',
    pattern:s.pattern||'solid',
    glow:s.glow||0,
  };
}
function randomTexture(){
  const pals=[['#ff6b6b','#c22a2a'],['#4de0ff','#1a6eb8'],['#6ee7a0','#1a8a5c'],
    ['#ffd166','#d4a800'],['#b878ff','#5a2a9a'],['#ff8a3d','#c2410c'],['#ff4d94','#8a1e50']];
  const pal=choose(pals);
  const emojis=['👾','🌟','🔥','❄️','⚡','💎','🌀','🎯','🦋','🐙','👁️','🌸','🍄','🔮','⚙️','🎭'];
  const pats=['solid','stripes','dots','ring','spiral'];
  return makeTexture({
    color1:pal[0],color2:pal[1],
    emoji:Math.random()<.4?choose(emojis):'',
    pattern:choose(pats),
    glow:rand(4,16),
  });
}
function hexToRgb(hex){
  if(hex.startsWith('rgb'))return hex.match(/\d+/g).join(',');
  const n=parseInt(hex.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function spawnEntity(spec){
  const e={
    id:World.nextId++,
    x:spec.x??rand(40,W-40), y:spec.y??GROUND()-20,
    vx:spec.vx??0, vy:spec.vy??0,
    w:spec.w??24, h:spec.h??24,
    tag:spec.tag||'entity',
    texture:spec.texture||randomTexture(),
    shape:spec.shape||choose(['circle','square','triangle','star']),
    spin:spec.spin??0, spinV:spec.spinV??0,
    gravity:spec.gravity??1, bounce:spec.bounce??0.4,
    static:spec.static??false,
    held:false,
  };
  World.entities.push(e);
  return e;
}

/* ================================================================
   AI
================================================================ */
const AI={
  x:0, y:0, vx:0, vy:0,
  baseW:22, baseH:34, sizeScale:1,
  health:100, maxHealth:100, energy:100, maxEnergy:100, hunger:100, maxHunger:100,

/* ================================================================
   UI FORGE
================================================================ */
const UIForge={
  container:document.getElementById('uiForge'),
  windows:[],
  zIndex:100,
  create(spec){
    const win=document.createElement('div');
    win.className='aria-window';
    const w=Math.min(spec.width||220, W-30);
    const x=spec.x??clamp(W/2-w/2+(Math.random()*40-20),10,W-w-10);
    const y=spec.y??clamp(100+Math.random()*80,70,H-260);
    win.style.cssText=`left:${x}px;top:${y}px;width:${w}px;z-index:${++this.zIndex}`;
    win.innerHTML=`
      <div class="win-head">
        <span class="win-title">${escapeHtml(spec.title||'Window')}</span>
        <button class="win-close" type="button" aria-label="close">×</button>
      </div>
      <div class="win-body">${spec.body||''}</div>
    `;
    this.container.appendChild(win);
    this.windows.push(win);

    win.querySelector('.win-close').onclick=()=>{
      win.remove();
      this.windows=this.windows.filter(x=>x!==win);
      haptic('light');
    };

    const head=win.querySelector('.win-head');
    let dragging=false, dx=0, dy=0, pid=null;
    head.addEventListener('pointerdown',(ev)=>{
      ev.preventDefault();
      dragging=true; pid=ev.pointerId;
      const r=win.getBoundingClientRect();
      dx=ev.clientX-r.left; dy=ev.clientY-r.top;
      win.style.zIndex=++this.zIndex;
      try{ head.setPointerCapture(pid); }catch(e){}
    });
    head.addEventListener('pointermove',(ev)=>{
      if(!dragging) return;
      win.style.left=clamp(ev.clientX-dx,0,W-win.offsetWidth)+'px';
      win.style.top=clamp(ev.clientY-dy,0,H-win.offsetHeight)+'px';
    });
    head.addEventListener('pointerup',()=>{
      dragging=false;
      if(pid){try{head.releasePointerCapture(pid);}catch(e){} pid=null;}
    });
    head.addEventListener('pointercancel',()=>{ dragging=false; pid=null; });

    if(spec.init){ try{ spec.init(win); }catch(e){ console.warn(e); } }
    AI.counters.uiCreated++;
    haptic('medium');
    return win;
  },
};

        win.querySelectorAll('button[data-k]').forEach(b=>{
          b.onclick=()=>{
            const k=b.dataset.k;
            if(/[0-9.]/.test(k)){
              if(fresh){ cur=k==='.'?'0.':k; fresh=false; }
              else { if(k==='.'&&cur.includes('.')) return; cur+=k; }
            }
            else if(k==='C'){ cur='0'; prev=null; op=null; fresh=true; }
            else if(k==='='){
              if(op&&prev!=null){ cur=String(calc(prev,cur,op)); prev=null; op=null; fresh=true; }
            } else {

              prev=parseFloat(cur); op=k; fresh=true;
            }
            disp.textContent=cur;
          };
        });
        function calc(a,b,k){
          a=parseFloat(a); b=parseFloat(b);
          if(k==='+')return a+b; if(k==='-')return a-b;

/* ================================================================
   AI CAPABILITIES
================================================================ */
function teleport(x,y){
  spawnParticles(AI.x,AI.y-20,16,'#b878ff',180,.5,3.5);
  spawnRing(AI.x,AI.y-20,'#b878ff',50,.4);
  AI.x=clamp(x,30,W-30); AI.y=clamp(y,60,GROUND()-5);
  AI.vx=0; AI.vy=0;
  spawnParticles(AI.x,AI.y-20,16,'#4de0ff',180,.5,3.5);
  spawnRing(AI.x,AI.y-20,'#4de0ff',50,.4);
  AI.counters.teleports++;
  haptic('heavy');
}
function grabNearest(){
  let best=null, bd=200;
  for(const e of World.entities){
    if(e.held) continue;
    const d=dist(e,AI);
    if(d<bd){ bd=d; best=e; }
  }
  if(best){
    best.held=true; AI.heldEntity=best;
    best.vx=0; best.vy=0;
    AI.counters.grabs++;
    spawnFloater(best.x, best.y-20, 'GRABBED', '#4de0ff', 11);
  }
}
function releaseHeld(force){
  const e=AI.heldEntity; if(!e) return;
  e.held=false; AI.heldEntity=null;
  if(force){ e.vx=AI.facing*force; e.vy=-350; e.spinV=AI.facing*10; }
}
function selfModify(what,value){
  switch(what){
    case 'bigger': AI.sizeScale=clamp(AI.sizeScale*1.3,0.3,4); break;
    case 'smaller': AI.sizeScale=clamp(AI.sizeScale*0.7,0.15,4); break;
    case 'size': AI.sizeScale=clamp(value,0.15,5); break;
    case 'color': AI.texture.c1=value[0]; AI.texture.c2=value[1]; AI.auraColor=hexToRgb(value[0]); break;
    case 'randomize': AI.texture=randomTexture(); AI.auraColor=hexToRgb(AI.texture.c1); break;
    case 'glow': AI.texture.glow=clamp(AI.texture.glow+8,0,40); break;
    case 'pattern': AI.texture.pattern=choose(['solid','stripes','dots','ring','spiral']); break;
  }
  spawnParticles(AI.x,AI.y-20,14,AI.texture.c1,180,.5,3);
  spawnRing(AI.x,AI.y-20,AI.texture.c1,40,.4);
}

const A={

  explore:()=>({cmd:'explore',label:'explore'}),
  greet:()=>({cmd:'greet',label:'greet'}),

  clearWorld:()=>({cmd:'clear_world',label:'clear'}),
  idle:()=>({cmd:'idle',label:'idle'}),
};
function push(a){ AI.plan.push({...a,done:false}); }
function applyActions(acts){
  if(!acts||!acts.length) return;
  AI.plan=[]; AI.planIndex=0;
  for(const a of acts) push({...a,label:a.cmd});
  AI.stateTimer=0;
}

/* ================================================================
   AI PLANNER
================================================================ */
function generatePlan(){
  AI.plan=[]; AI.planIndex=0;
  const roll=Math.random();
  if(AI.hunger<40){ for(let i=0;i<3;i++) push(A.gatherBerry()); push(A.eat()); return; }
  if(AI.energy<30){ push(A.rest()); return; }
  if(roll<0.35){ for(let i=0;i<4;i++) push(A.gatherTree()); }
  else if(roll<0.55){ for(let i=0;i<3;i++) push(A.gatherRock()); }
  else if(roll<0.75){ push(A.explore()); push(A.gatherBerry()); }
  else if(roll<0.88){ push(A.grabNearest()); push(A.releaseHeld(500)); }
  else if(roll<0.95){ push(A.teleportTo(rand(40,W-40),GROUND()-5)); }
  else { push(A.emote(choose(['🎉','✨','🔥','👋','🌀','💫']))); }
}

function aiThink(dt){
  AI.thoughtTimer-=dt; AI.stateTimer-=dt;
  AI.hunger-=dt*0.5; AI.energy-=dt*0.3;
  AI.autoThinkTimer-=dt;
  if(AI.autoThinkTimer<=0){ AI.autoThinkTimer=4+Math.random()*3; updateThought(); }
  if(AI.grabbed){ AI.state='held'; AI.vy=0; AI.vx=0; return; }
  if(AI.heldEntity){
    const e=AI.heldEntity;
    e.x=AI.x+AI.facing*26; e.y=AI.y-30;
    e.vx=0; e.vy=0; e.spin+=AI.walkPhase*0.02;
  }
  if(AI.planIndex<AI.plan.length){
    if(AI.plan[AI.planIndex].done) AI.planIndex++;
  } else if(AI.plan.length>0 && AI.planIndex>=AI.plan.length){
    AI.plan=[]; AI.planIndex=0; AI.planLabel='idle';
  }
  if(AI.plan.length===0 && AI.stateTimer<=0 && !AI.pendingQuestion){
    generatePlan();
    AI.stateTimer=0.4;
  }
  if(AI.energy<20) AI.expression='sleepy';
  else if(AI.state==='rest') AI.expression='sleepy';
  else if(AI.state.includes('build')) AI.expression='happy';
  else AI.expression='neutral';
  const s=AI.plan[AI.planIndex];
  AI.state=s?s.cmd.replace(/_/g,' '):'idle';
  AI.planLabel=s?s.label:'Idle';
  if(s) executeStep(s,dt);
}
function updateThought(){
  const s=AI.state;
  const t=[];
  if(s.includes('gather')) t.push('Collecting resources…','Almost done.','Working.');
  if(s.includes('build')) t.push('Constructing.','Structures rising.');
  if(s.includes('explore')) t.push('Surveying terrain.','New ground.');
  if(s==='rest') t.push('Recharging.','Low power mode.','…');
  if(s.includes('teleport')) t.push('Phase jump.','Reality shift.');
  if(s.includes('spawn')) t.push('Coding life.','Born.');
  if(s.includes('grab')) t.push('Reaching…','Got it.');
  if(s==='idle') t.push('Standing by.','Awaiting input.','Listening.','What next?');
  AI.thought=choose(t.length?t:['Processing…']);
}
function executeStep(step,dt){
  const gy=GROUND();
  const speed=60;
  switch(step.cmd){
    case 'move_to':{
      const dx=step.tx-AI.x;
      if(Math.abs(dx)<8){ step.done=true; AI.vx*=0.7; return; }
      AI.vx=Math.sign(dx)*speed; AI.facing=Math.sign(dx);
      break;
    }
    case 'gather_tree':{
      const tr=nearest(World.trees,AI);
      if(!tr){ step.done=true; return; }
      const d=Math.abs(tr.x-AI.x);
      if(d>24){ AI.vx=Math.sign(tr.x-AI.x)*speed; AI.facing=Math.sign(tr.x-AI.x); }
      else {
        AI.vx*=0.7;
        step.chargeT=(step.chargeT||0)+dt;
        if(step.chargeT>0.5){
          step.chargeT=0; tr.shake=0.4;
          spawnParticles(tr.x,tr.y-10,5,'#c9a060',120,.5,3);
          spawnFloater(tr.x,tr.y-30,'+2 🪵','#ffd166',13);
          step.done=true;
        }
      }
      break;
    }
    case 'gather_rock':{
      const rk=nearest(World.rocks,AI);
      if(!rk){ step.done=true; return; }
      const d=Math.abs(rk.x-AI.x);
      if(d>22){ AI.vx=Math.sign(rk.x-AI.x)*speed; AI.facing=Math.sign(rk.x-AI.x); }
      else{
        AI.vx*=0.7;
        step.chargeT=(step.chargeT||0)+dt;
        if(step.chargeT>0.5){
          step.chargeT=0; rk.shake=0.4;
          spawnParticles(rk.x,rk.y-6,5,'#a0a0a8',130,.5,3);
          spawnFloater(rk.x,rk.y-26,'+2 🪨','#c8cfdc',13);
          step.done=true;
        }
      }
      break;
    }
    case 'gather_berry':{
      const b=nearest(World.berries.filter(x=>!x.harvested),AI);
      if(!b){ step.done=true; return; }
      const d=Math.abs(b.x-AI.x);
      if(d>20){ AI.vx=Math.sign(b.x-AI.x)*speed; AI.facing=Math.sign(b.x-AI.x); }
      else{
        AI.vx*=0.7;
        step.chargeT=(step.chargeT||0)+dt;
        if(step.chargeT>0.35){
          b.harvested=true; b.regrow=10;
          spawnFloater(b.x,b.y-22,'+1 🍎','#6ee7a0',13);
          spawnParticles(b.x,b.y-4,6,'#ff5a5a',100,.5,3);
          step.done=true;
        }
      }
      break;
    }
    case 'build_wall':{
      if(step.buildX===undefined) step.buildX=AI.x+AI.facing*rand(30,60);
      const dx=step.buildX-AI.x;
      if(Math.abs(dx)>30){ AI.vx=Math.sign(dx)*speed; AI.facing=Math.sign(dx); }
      else{
        AI.vx*=0.7;
        step.buildX=clamp(step.buildX,20,W-20);
        World.blocks.push({x:step.buildX,y:gy,w:20,h:34,owner:'ai'});
        spawnParticles(step.buildX,gy-17,8,'#a67c46',130,.5,3);
        spawnFloater(step.buildX,gy-40,'built','#6ee7a0',12);
        step.done=true;
      }
      break;
    }
    case 'build_tower':{
      if(step.buildX===undefined) step.buildX=AI.x+AI.facing*50;
      const dx=step.buildX-AI.x;
      if(Math.abs(dx)>30){ AI.vx=Math.sign(dx)*speed; AI.facing=Math.sign(dx); }
      else{
        AI.vx*=0.7;
        step.buildX=clamp(step.buildX,20,W-20);
        for(let i=0;i<5;i++) World.blocks.push({x:step.buildX,y:gy-i*20,w:20,h:18,owner:'ai'});
        spawnParticles(step.buildX,gy-30,14,'#a67c46',180,.7,4);
        spawnFloater(step.buildX,gy-50,'TOWER','#ffd166',14);
        step.done=true;
      }
      break;
    }
    case 'build_home':{
      if(step.cx===undefined) step.cx=AI.x;
      const dx=step.cx-AI.x;
      if(Math.abs(dx)>40){ AI.vx=Math.sign(dx)*speed; AI.facing=Math.sign(dx); }
      else{
        AI.vx*=0.7;
        const hx=step.cx;
        World.blocks.push({x:hx-26,y:gy,w:20,h:34,owner:'ai'});
        World.blocks.push({x:hx+26,y:gy,w:20,h:34,owner:'ai'});
        World.blocks.push({x:hx,y:gy-42,w:72,h:14,owner:'ai'});
        spawnParticles(hx,gy-30,16,'#a67c46',180,.7,4);
        spawnFloater(hx,gy-70,'HOME','#6ee7a0',15);
        step.done=true;
      }
      break;
    }
    case 'rest':
      AI.vx*=0.7;
      AI.energy+=dt*25;
      step.rT=(step.rT||0)+dt;
      if(AI.energy>=95||step.rT>2.5) step.done=true;
      break;
    case 'eat':
      AI.vx*=0.7;
      step.eT=(step.eT||0)+dt;
      if(step.eT>0.35){
        AI.hunger=Math.min(100,AI.hunger+40);
        AI.health=Math.min(AI.maxHealth,AI.health+8);
        spawnFloater(AI.x,AI.y-50,'fed','#6ee7a0',12);
        step.done=true;
      }
      break;
    case 'explore':{
      if(step.tx===undefined) step.tx=clamp(AI.x+rand(-180,180),30,W-30);
      const dxe=step.tx-AI.x;
      if(Math.abs(dxe)<12) step.done=true;
      else{ AI.vx=Math.sign(dxe)*speed*0.8; AI.facing=Math.sign(dxe); }
      break;
    }
    case 'greet': AI.reactionText='👋'; AI.reaction=0.6; step.done=true; break;
    case 'jump':
      if(!step.jumped&&AI.vy>=0&&AI.y>gy-10){ AI.vy=-420; step.jumped=true; }
      if(step.jumped&&AI.vy>0&&AI.y>gy-10) step.done=true;
      break;
    case 'emote': AI.reactionText=step.e||'😀'; AI.reaction=0.6; step.done=true; break;
    case 'teleport': teleport(step.tx??rand(40,W-40), step.ty??gy-5); step.done=true; break;
    case 'spawn_entity':{
      const spec=step.spec;
      if(spec.y===undefined) spec.y=gy-20;
      const e=spawnEntity(spec);
      spawnFloater(e.x,e.y-30,'SPAWNED','#b878ff',13);
      spawnRing(e.x,e.y,'#b878ff',30,.4);
      AI.counters.spawned++;
      step.done=true;
      break;
    }
    case 'modify_self':{
      if(step.what==='color'){
        const pal=choose([['#ff6b6b','#8a1e1e'],['#4de0ff','#1a6eb8'],['#6ee7a0','#1a8a5c'],
          ['#ffd166','#a86a00'],['#b878ff','#5a2a9a'],['#ff8a3d','#c2410a']]);
        selfModify('color',pal);
      } else selfModify(step.what,step.val);
      step.done=true;
      break;
    }
    case 'grab_nearest': grabNearest(); step.done=true; break;
    case 'release_held': releaseHeld(step.f||400); step.done=true; break;
    case 'ask_user': askUser(step.q,step.opts); step.done=true; break;
    case 'think': AI.thought='Thinking about '+step.topic+'…'; AI.thoughtTimer=3; step.done=true; break;
    case 'paint_world':{
      const c=step.color||randomTexture();
      for(const e of World.entities){ e.texture={...e.texture,c1:c.c1,c2:c.c2}; }
      spawnParticles(AI.x,AI.y-40,30,c.c1,280,.8,4);
      spawnFloater(AI.x,AI.y-60,'PAINTED',c.c1,14);
      step.done=true;
      break;
    }
    case 'shrink_all': for(const e of World.entities){ e.w*=0.6; e.h*=0.6; } step.done=true; break;
    case 'grow_all': for(const e of World.entities){ e.w*=1.5; e.h*=1.5; } step.done=true; break;
    case 'randomize_all':
      for(const e of World.entities){ e.texture=randomTexture(); e.shape=choose(['circle','square','triangle','star']); }
      step.done=true;
      break;
    case 'clear_world':
      for(const e of World.entities) spawnParticles(e.x,e.y,4,'#b878ff',100,.4,2);
      World.entities=[];
      step.done=true;
      break;
    default: AI.vx*=0.7; step.done=true;
  }
}
function nearest(list,from){
  let best=null,bd=Infinity;
  for(const it of list){ const d=dist(it,from); if(d<bd){ bd=d; best=it; } }
  return best;
}

/* ================================================================
   ASK USER
================================================================ */
function askUser(q,opts){
  AI.pendingQuestion={question:q,options:opts||[]};
  const bar=document.getElementById('questionBar');
  document.getElementById('qText').textContent=q;
  const o=document.getElementById('qOpts'); o.innerHTML='';
  for(const opt of (opts||['yes','no'])){
    const b=document.createElement('div');
    b.className='qOpt'; b.textContent=opt;
    b.onclick=()=>answerQuestion(opt);
    o.appendChild(b);
  }
  bar.classList.add('show');
  logMessage('ARIA-7','❓ '+q,'system');
  haptic('medium');
}
function answerQuestion(answer){
  document.getElementById('questionBar').classList.remove('show');
  logMessage('You',answer);
  AI.pendingQuestion=null;
  remember('user said: '+answer);
  const a=answer.toLowerCase();
  const acts=[];
  if(/tower/.test(a)) acts.push(A.buildTower());
  else if(/home|house/.test(a)) acts.push(A.buildHome());
  else if(/dragon/.test(a)) acts.push(A.spawnAt({tag:'dragon',w:50,h:50,
    texture:makeTexture({emoji:'🐉',color1:'#ff4d4d',color2:'#7a1a1a',glow:20,pattern:'ring'}),
    shape:'circle',gravity:0.6,bounce:0.6,spinV:1.5}));
  else if(/red/.test(a)) acts.push(A.modifySelf('color',['#ff6b6b','#8a1e1e']));
  else if(/blue/.test(a)) acts.push(A.modifySelf('color',['#4de0ff','#1a6eb8']));
  else if(/green/.test(a)) acts.push(A.modifySelf('color',['#6ee7a0','#1a8a5c']));
  else if(/purple/.test(a)) acts.push(A.modifySelf('color',['#b878ff','#5a2a9a']));
  else if(/gold/.test(a)) acts.push(A.modifySelf('color',['#ffd166','#a86a00']));
  else if(/bigger|grow/.test(a)) acts.push(A.modifySelf('bigger'));
  else if(/smaller|shrink/.test(a)) acts.push(A.modifySelf('smaller'));
  else acts.push(A.greet());
  applyActions(acts);
  logMessage('ARIA-7',choose(['On it.','Done.','Executing.','Yes.']));
}

/* ================================================================
   MEMORY
================================================================ */
function remember(text){
  AI.memory.push(text);
  if(AI.memory.length>AI.memoryMax) AI.memory.shift();
  AI.counters.memory++;
}

/* ================================================================
   PHYSICS
================================================================ */
function updatePhysics(dt){
  const gy=GROUND();
  if(AI.grabbed){ AI.vx=0; AI.vy=0; }
  else{
    AI.vx*=Math.pow(0.001,dt);
    if(Math.abs(AI.vx)<1) AI.vx=0;
    AI.vy+=G*dt;
    AI.x+=AI.vx*dt; AI.y+=AI.vy*dt;
    if(AI.y>gy-5){ AI.y=gy-5; AI.vy=0; }
    AI.x=clamp(AI.x,20,W-20);
  }
  if(Math.abs(AI.vx)>4) AI.walkPhase+=dt*10;
  AI.blinkTimer-=dt;
  if(AI.blinkTimer<=0){ AI.blinking=0.14; AI.blinkTimer=rand(2.5,5.5); }
  if(AI.blinking>0) AI.blinking-=dt;
  if(AI.reaction>0) AI.reaction-=dt;

  for(let i=World.entities.length-1;i>=0;i--){
    const e=World.entities[i];
    if(e.held) continue;
    if(!e.static){
      e.vy+=G*e.gravity*dt;
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      if(e.y>gy-e.h/2){ e.y=gy-e.h/2; e.vy*=-e.bounce; if(Math.abs(e.vy)<40)e.vy=0; e.vx*=0.92; }
      if(e.x<e.w/2){ e.x=e.w/2; e.vx*=-0.7; }
      if(e.x>W-e.w/2){ e.x=W-e.w/2; e.vx*=-0.7; }
    }
    e.spin+=(e.spinV||0)*dt;
  }
  for(let i=World.projectiles.length-1;i>=0;i--){
    const p=World.projectiles[i];
    p.vy+=G*0.7*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.rot=(p.rot||0)+dt*8;
    if(Math.random()<0.3 && World.particles.length<MAX_PARTICLES-4){
      World.particles.push({x:p.x,y:p.y,vx:rand(-10,10),vy:rand(-10,10),
        life:.3,maxLife:.3,color:p.trailColor||'#fff',size:2,grav:30});
    }
    if(Math.hypot(p.x-AI.x,p.y-(AI.y-14))<AI.baseW*AI.sizeScale/2+p.r){
      handleProjectileHit(p);
      World.projectiles.splice(i,1);
      continue;
    }
    if(p.y>gy-4){ p.y=gy-4; handleProjectileGround(p); World.projectiles.splice(i,1); continue; }
    if(p.x<-40||p.x>W+40||p.y>H+40) World.projectiles.splice(i,1);
  }
  for(let i=World.particles.length-1;i>=0;i--){
    const p=World.particles[i];
    if(p.type==='ring'){
      p.life-=dt;
      p.r=lerp_(4,p.maxR,1-p.life/p.maxLife);
      if(p.life<=0) World.particles.splice(i,1);
      continue;
    }
    p.vy+=(p.grav||200)*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.97; p.life-=dt;
    if(p.life<=0) World.particles.splice(i,1);
  }
  for(let i=World.floaters.length-1;i>=0;i--){
    const f=World.floaters[i];
    f.y+=f.vy*dt; f.vy*=0.94; f.life-=dt;
    if(f.life<=0) World.floaters.splice(i,1);
  }
  for(const b of World.berries) if(b.harvested){ b.regrow-=dt; if(b.regrow<=0) b.harvested=false; }
  for(const t of World.trees) if(t.shake>0) t.shake-=dt*2;
  for(const r of World.rocks) if(r.shake>0) r.shake-=dt*2;
  for(const c of World.clouds){
    c.x+=c.speed*dt;
    if(c.x-c.w>W+20){ c.x=-c.w-20; c.y=rand(40,H*0.35); }
  }
}
function handleProjectileHit(p){
  const t=p.type;
  if(t==='bomb'){
    spawnParticles(p.x,p.y,20,'#ff8a3d',240,.7,4);
    spawnRing(p.x,p.y,'#ff8a3d',60,.5);
    AI.health-=22; AI.vx+=p.vx*0.8; AI.vy=-250;
    AI.expression='angry'; AI.reactionText='💥'; AI.reaction=0.6;
    spawnFloater(p.x,p.y-20,'-22','#ff6b6b',13);
  } else if(t==='apple'){
    AI.hunger=Math.min(100,AI.hunger+25);
    AI.health=Math.min(AI.maxHealth,AI.health+8);
    spawnFloater(p.x,p.y-20,'+25 🍎','#6ee7a0',11);
    AI.reactionText='😋'; AI.reaction=0.7;
    spawnParticles(p.x,p.y,10,'#ff6b6b',140,.5,3);
  } else if(t==='ball'){
    spawnParticles(p.x,p.y,8,'#fff',150,.4,3);
    AI.vx+=p.vx*0.6; AI.vy=-180; AI.reactionText='😤'; AI.reaction=0.6;
  } else if(t==='bolt'){
    spawnParticles(p.x,p.y,16,'#ffe066',220,.5,4);
    spawnRing(p.x,p.y,'#ffe066',50,.4);
    AI.health-=5; AI.energy+=30; AI.reactionText='⚡'; AI.reaction=0.6;
  } else {
    AI.health-=6; AI.expression='angry';
    spawnParticles(p.x,p.y,8,'#b878ff',140,.5,3);
  }
  haptic('medium');
}
function handleProjectileGround(p){
  const gy=GROUND();
  if(p.type==='bomb'){ spawnParticles(p.x,p.y,16,'#ff8a3d',200,.6,3); spawnRing(p.x,p.y,'#ff8a3d',50,.4); }
  else if(p.type==='dragon'){
    spawnEntity({tag:'dragon',x:clamp(p.x,40,W-40),y:gy-25,w:46,h:46,
      texture:makeTexture({emoji:'🐉',color1:'#ff4d4d',color2:'#7a1a1a',glow:18,pattern:'ring'}),
      shape:'circle',gravity:0.5,bounce:0.5,spinV:1.2});
  } else if(p.type==='crown'){
    spawnEntity({tag:'crown',x:clamp(p.x,40,W-40),y:gy-20,w:26,h:26,
      texture:makeTexture({emoji:'👑',color1:'#ffd166',color2:'#a86a00',glow:18}),
      shape:'circle',gravity:0.6,bounce:0.6,spinV:0.8});
  } else if(p.type==='star'){
    spawnEntity({tag:'star',x:clamp(p.x,40,W-40),y:gy-20,w:20,h:20,
      texture:makeTexture({emoji:'⭐',color1:'#ffe066',color2:'#d4a800',glow:16}),
      shape:'star',gravity:0.8,bounce:0.7,spinV:rand(-4,4)});
  } else if(p.type==='paint'){
    const c1=choose(['#ff6b6b','#4de0ff','#6ee7a0','#ffd166','#b878ff']);
    const c2=choose(['#8a1e1e','#1a6eb8','#1a8a5c','#a86a00','#5a2a9a']);
    for(const e of World.entities) if(dist(e,p)<100) e.texture={...e.texture,c1,c2};
    spawnParticles(p.x,p.y,30,c1,240,.8,4);
    spawnRing(p.x,p.y,c1,90,.6);
  }
}

/* ================================================================
   RENDER
================================================================ */
let fpsFrames=0, fpsTimer=0, fpsDisplay=60;
function render(dt){
  fpsFrames++; fpsTimer+=dt;
  if(fpsTimer>=0.5){ fpsDisplay=Math.round(fpsFrames/fpsTimer); fpsFrames=0; fpsTimer=0; }
  const t=World.t, gy=GROUND();

  const sky=ctx.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,'#0a1230'); sky.addColorStop(.4,'#1a2448');
  sky.addColorStop(.75,'#3a3858'); sky.addColorStop(1,'#6a5568');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,gy);

  const sunX=W*0.78, sunY=H*0.18;
  ctx.fillStyle='rgba(255,240,200,.9)';
  ctx.beginPath(); ctx.arc(sunX,sunY,16+Math.sin(t*0.6)*1.5,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#fff';
  for(let i=0;i<30;i++){
    const sx=(i*137)%W, sy=(i*79)%(gy*0.6);
    ctx.globalAlpha=0.25+Math.sin(t*1.2+i)*0.15;
    ctx.fillRect(sx,sy,1,1);
  }
  ctx.globalAlpha=1;

  for(const c of World.clouds){
    ctx.globalAlpha=c.alpha; ctx.fillStyle='#c8d8ff';
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.w*0.5,c.w*0.18,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.fillStyle='rgba(30,25,55,.7)';
  ctx.beginPath(); ctx.moveTo(0,gy);
  for(let x=0;x<=W;x+=30){
    const y=gy-40-Math.sin(x*0.015+0.5)*30;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,gy); ctx.closePath(); ctx.fill();

  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#2a3d2a'); gg.addColorStop(.3,'#1a2820'); gg.addColorStop(1,'#0a1420');
  ctx.fillStyle=gg; ctx.fillRect(0,gy,W,H-gy);

  for(const tr of World.trees) drawTree(tr,t);
  for(const rk of World.rocks) drawRock(rk,t);
  for(const b of World.berries) drawBerry(b);
  for(const bl of World.blocks) drawBlock(bl);
  for(const e of World.entities) drawTexturedShape(e);
  for(const p of World.projectiles) drawProjectile(p);
  drawAI(t);

  for(const p of World.particles){
    if(p.type==='ring'){
      const a=p.life/p.maxLife;
      ctx.strokeStyle=p.color; ctx.globalAlpha=a*0.85;
      ctx.lineWidth=3*a+0.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
      continue;
    }
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    const s=p.size*a;
    ctx.fillRect(p.x-s/2, p.y-s/2, s, s);
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of World.floaters){
    const a=f.life/f.maxLife;
    ctx.globalAlpha=a;
    ctx.font='900 '+f.size+'px -apple-system,sans-serif';
    ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=3;
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;

  if(AI.reaction>0){
    ctx.globalAlpha=AI.reaction/0.6;
    ctx.font='900 22px -apple-system,sans-serif';
    ctx.fillText(AI.reactionText, AI.x, AI.y-60-(0.6-AI.reaction)*40);
    ctx.globalAlpha=1;
  }
}
function drawTree(tr,t){
  const shake=tr.shake>0?Math.sin(t*40)*tr.shake*4:0;
  const x=tr.x+shake, y=tr.y;
  ctx.fillStyle='#5a3a20'; ctx.fillRect(x-3,y-14,6,14);
  ctx.fillStyle='#4a7a3a';
  ctx.beginPath(); ctx.arc(x,y-22,tr.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a5a2a';
  ctx.beginPath(); ctx.arc(x+3,y-19,tr.r*0.7,0,Math.PI*2); ctx.fill();
}
function drawRock(rk,t){
  const shake=rk.shake>0?Math.sin(t*40)*rk.shake*3:0;
  ctx.fillStyle='#5a5a6a';
  ctx.beginPath(); ctx.ellipse(rk.x+shake,rk.y-rk.r*.5,rk.r,rk.r*.75,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7a7a8a';
  ctx.beginPath(); ctx.ellipse(rk.x-rk.r*.3+shake,rk.y-rk.r*.7,rk.r*.4,rk.r*.3,0,0,Math.PI*2); ctx.fill();
}
function drawBerry(b){
  const x=b.x,y=b.y;
  if(b.harvested) ctx.globalAlpha=.35;
  ctx.fillStyle='#2a5a2a';
  ctx.beginPath(); ctx.ellipse(x,y-b.r*.3,b.r,b.r*.7,0,0,Math.PI*2); ctx.fill();
  if(!b.harvested){
    ctx.fillStyle='#ff3a3a';
    for(let i=0;i<5;i++){
      const a=i*1.3;
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*b.r*.5,y-b.r*.3+Math.sin(a)*b.r*.4,2.6,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function drawBlock(bl){
  const x=bl.x-bl.w/2, y=bl.y-bl.h;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(x+1,bl.y-2,bl.w,3);
  ctx.fillStyle=bl.owner==='ai'?'#8a6a3a':'#6a6a7a';
  ctx.fillRect(x,y,bl.w,bl.h);
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(x,y,bl.w,2);
}
function drawTexturedShape(e){
  const tex=e.texture;
  ctx.save();
  ctx.translate(e.x,e.y);
  if(e.spin) ctx.rotate(e.spin);
  if(tex.glow>0){ ctx.shadowColor=tex.c1; ctx.shadowBlur=tex.glow; }
  const g=ctx.createLinearGradient(-e.w/2,-e.h/2,e.w/2,e.h/2);
  g.addColorStop(0,tex.c1); g.addColorStop(1,tex.c2);
  ctx.fillStyle=g;
  if(e.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,e.w/2,0,Math.PI*2); ctx.fill(); }
  else if(e.shape==='square'){ ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h); }
  else if(e.shape==='triangle'){
    ctx.beginPath(); ctx.moveTo(0,-e.h/2); ctx.lineTo(e.w/2,e.h/2); ctx.lineTo(-e.w/2,e.h/2); ctx.closePath(); ctx.fill();
  } else if(e.shape==='star'){
    ctx.beginPath();
    const R=e.w/2, r=R*0.45;
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5-Math.PI/2;
      const rad=i%2===0?R:r;
      ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.shadowBlur=0;
  if(tex.pattern==='dots'){
    ctx.save(); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,.4)';
    for(let i=-e.w/2;i<=e.w/2;i+=6) for(let j=-e.h/2;j<=e.h/2;j+=6){
      ctx.beginPath(); ctx.arc(i,j,1.2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else if(tex.pattern==='ring'){
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,e.w*0.28,0,Math.PI*2); ctx.stroke();
  }
  if(tex.emoji){
    ctx.font=(Math.min(e.w,e.h)*0.85|0)+'px "Apple Color Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(tex.emoji,0,0);
  }
  ctx.restore();
}
function drawProjectile(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  if(p.rot) ctx.rotate(p.rot);
  const icons={bomb:'💣',apple:'🍎',ball:'⚽',bolt:'⚡',dragon:'🐉',crown:'👑',paint:'🎨',star:'⭐'};
  const icon=icons[p.type]||'⚪';
  ctx.font=(p.r*2.2)+'px "Apple Color Emoji",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(icon,0,0);
  ctx.restore();
}
function drawAI(t){
  const x=AI.x, y=AI.y, sc=AI.sizeScale;
  const bob=Math.abs(AI.vx)>4?Math.sin(AI.walkPhase)*2:Math.sin(t*2)*1.2;
  const legA=Math.abs(AI.vx)>4?Math.sin(AI.walkPhase)*4:0;
  const legB=Math.abs(AI.vx)>4?-Math.sin(AI.walkPhase)*4:0;
  const armA=Math.abs(AI.vx)>4?-Math.sin(AI.walkPhase)*5:Math.sin(t*1.5)*1;
  const armB=Math.abs(AI.vx)>4?Math.sin(AI.walkPhase)*5:Math.sin(t*1.5+1)*1;

  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(x,y+2,15*sc,4*sc,0,0,Math.PI*2); ctx.fill();

  const auraColor=AI.auraColor;
  const pulse=0.5+Math.sin(t*2.5)*0.25;
  const ag=ctx.createRadialGradient(x,y-14*sc,2,x,y-14*sc,42*sc);
  ag.addColorStop(0,'rgba('+auraColor+','+(0.4*pulse)+')');
  ag.addColorStop(1,'rgba('+auraColor+',0)');
  ctx.fillStyle=ag;
  ctx.beginPath(); ctx.arc(x,y-14*sc,42*sc,0,Math.PI*2); ctx.fill();

  const by=y-14*sc+bob;
  const legL=4*sc, headR=10*sc;

  ctx.strokeStyle='#3a4a6a'; ctx.lineWidth=4*sc; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-legL,by+10*sc); ctx.lineTo(x-legL+legA*sc,by+20*sc);
  ctx.moveTo(x+legL,by+10*sc); ctx.lineTo(x+legL+legB*sc,by+20*sc);
  ctx.stroke();

  const tg=ctx.createLinearGradient(x,by-8*sc,x,by+8*sc);
  tg.addColorStop(0,AI.texture.c1); tg.addColorStop(1,AI.texture.c2);
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(x-8*sc,by+10*sc);
  ctx.lineTo(x-8*sc,by-4*sc);
  ctx.quadraticCurveTo(x,by-10*sc,x+8*sc,by-4*sc);
  ctx.lineTo(x+8*sc,by+10*sc);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1*sc; ctx.stroke();

  ctx.fillStyle='rgba('+auraColor+',0.9)';
  ctx.shadowColor='rgba('+auraColor+',1)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(x,by+2*sc,3*sc,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  ctx.strokeStyle='#4a5a88'; ctx.lineWidth=3.5*sc;
  ctx.beginPath();
  ctx.moveTo(x-8*sc,by-2*sc); ctx.lineTo(x-12*sc+armA*sc,by+8*sc);
  ctx.moveTo(x+8*sc,by-2*sc); ctx.lineTo(x+12*sc+armB*sc,by+8*sc);
  ctx.stroke();
  ctx.fillStyle='#2a3a68';
  ctx.beginPath(); ctx.arc(x-12*sc+armA*sc,by+8*sc,3*sc,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+12*sc+armB*sc,by+8*sc,3*sc,0,Math.PI*2); ctx.fill();

  const headY=by-14*sc;
  const hg=ctx.createRadialGradient(x-2*sc,headY-2*sc,1,x,headY,headR);
  hg.addColorStop(0,AI.texture.c1); hg.addColorStop(1,AI.texture.c2);
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(x,headY,headR,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1.2*sc; ctx.stroke();

  ctx.fillStyle='#0a0f1e';
  ctx.beginPath(); ctx.ellipse(x,headY+1*sc,8*sc,4*sc,0,0,Math.PI*2); ctx.fill();

  const eyeY=headY+1*sc;
  const blink=AI.blinking>0?0.1:1;
  if(AI.expression==='sleepy'){
    ctx.strokeStyle='rgba('+auraColor+',0.9)'; ctx.lineWidth=1.5*sc;
    ctx.beginPath();
    ctx.moveTo(x-4.5*sc,eyeY); ctx.lineTo(x-1.5*sc,eyeY);
    ctx.moveTo(x+1.5*sc,eyeY); ctx.lineTo(x+4.5*sc,eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle='rgba('+auraColor+',1)';
    ctx.shadowColor='rgba('+auraColor+',1)'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(x-3*sc,eyeY,1.6*sc*blink,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+3*sc,eyeY,1.6*sc*blink,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  ctx.strokeStyle='#5a7ab8'; ctx.lineWidth=1.2*sc;
  ctx.beginPath(); ctx.moveTo(x,headY-headR); ctx.lineTo(x,headY-headR-5*sc); ctx.stroke();
  ctx.fillStyle='rgba('+auraColor+',1)';
  ctx.shadowColor='rgba('+auraColor+',1)'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.arc(x,headY-headR-6*sc,2*sc,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  if(AI.grabbed){
    ctx.strokeStyle='rgba(77,224,255,.9)'; ctx.lineWidth=2;
    ctx.setLineDash([4,4]); ctx.lineDashOffset=-t*20;
    ctx.beginPath(); ctx.arc(x,y-14*sc,30*sc,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

const throwGhostEl=document.getElementById('throwGhost');
const dragState={mode:null,item:null,pid:null};
canvas.addEventListener('pointerdown',(ev)=>{
  ev.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  if(Math.hypot(px-AI.x,py-(AI.y-14))<30*AI.sizeScale){
    AI.grabbed=true;
    AI.grabOffX=AI.x-px; AI.grabOffY=(AI.y-14)-py;
    dragState.mode='ai'; dragState.pid=ev.pointerId;
    haptic('light');
    try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
    return;
  }
  for(let i=World.entities.length-1;i>=0;i--){
    const e=World.entities[i];
    if(Math.hypot(px-e.x,py-e.y)<Math.max(e.w,e.h)*0.7){
      e.vx=(px-e.x)*6; e.vy=-200;
      spawnParticles(e.x,e.y,4,e.texture.c1,100,.4,2);
      haptic('light');
      return;
    }
  }
});
canvas.addEventListener('pointermove',(ev)=>{
  if(dragState.mode!=='ai'||!AI.grabbed) return;
  const rect=canvas.getBoundingClientRect();
  const px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  AI.x=clamp(px+AI.grabOffX,20,W-20);
  AI.y=clamp(py+AI.grabOffY,60,GROUND()-5);
  if(Math.random()<0.2 && World.particles.length<MAX_PARTICLES-2){
    World.particles.push({x:AI.x+rand(-6,6),y:AI.y+rand(-8,8),
      vx:0,vy:0,life:.3,maxLife:.3,color:'rgba(77,224,255,.6)',size:2,grav:0});
  }
});
canvas.addEventListener('pointerup',()=>{
  if(dragState.mode==='ai'&&AI.grabbed){
    AI.grabbed=false;
    AI.thought='Down please.';
    haptic('light');
    dragState.mode=null;
  }
});
canvas.addEventListener('pointercancel',()=>{
  if(dragState.mode==='ai'){ AI.grabbed=false; dragState.mode=null; }
});

// Item palette drag
document.querySelectorAll('.item').forEach(el=>{
  el.addEventListener('pointerdown',(ev)=>{
    ev.preventDefault(); ev.stopPropagation();
    dragState.mode='item'; dragState.item=el.dataset.item; dragState.pid=ev.pointerId;
    el.classList.add('dragging');
    throwGhostEl.textContent=el.dataset.icon;
    throwGhostEl.classList.add('show');
    throwGhostEl.style.left=ev.clientX+'px';
    throwGhostEl.style.top=ev.clientY+'px';
    haptic('light');
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
  });
  el.addEventListener('pointermove',(ev)=>{
    if(dragState.mode!=='item') return;
    throwGhostEl.style.left=ev.clientX+'px';
    throwGhostEl.style.top=ev.clientY+'px';
  });
  el.addEventListener('pointerup',(ev)=>{
    if(dragState.mode!=='item') return;
    el.classList.remove('dragging');
    throwGhostEl.classList.remove('show');
    const rect=canvas.getBoundingClientRect();
    if(ev.clientX>=rect.left&&ev.clientX<=rect.right&&ev.clientY>=rect.top&&ev.clientY<=rect.bottom){
      throwItem(dragState.item,ev.clientX-rect.left,ev.clientY-rect.top);
    }
    dragState.mode=null;
  });
});
function throwItem(type,targetX,targetY){
  const startX=W/2, startY=H-20;
  const dx=targetX-startX, dy=targetY-startY;
  const d=Math.hypot(dx,dy)||1;
  const speed=d*1.6;
  const vx=(dx/d)*speed;
  const vy=(dy/d)*speed-220;
  const r=type==='bomb'?9:type==='block'?8:type==='bolt'?7:9;
  const tc={bomb:'#ff8a3d',apple:'#ff6b6b',bolt:'#ffe066',dragon:'#ff4d4d',
    crown:'#ffd166',paint:'#b878ff',star:'#ffe066'}[type]||'#c8d8ff';
  World.projectiles.push({x:startX,y:startY,vx,vy,type,r,rot:0,trailColor:tc});
  spawnParticles(startX,startY,6,tc,140,.4,3);
  haptic('medium');
}

/* ================================================================
   AI RESPONSE ENGINE
================================================================ */
function aiRespond(userText){
  const t=userText.toLowerCase();
  let response='';
  let actions=[];

  // UI window creation
  if(/\b(make|create|build|spawn|open|give me|show|i want|need)\b.*\b(ui|window|panel|app|tool|calculator|notepad|note|paint|draw|piano|keyboard|clock|terminal|console|controller|gamepad|stats|stat|memory)\b/i.test(t)
     || /\b(calculator|notepad|paint app|piano|terminal|clock app|stats window|controller)\b/i.test(t)){
    const picked=createUIFor(t);
    if(picked){
      UIForge.create(picked);
      response='Created <b>'+escapeHtml(picked.title)+'</b>. Drag the title bar to move it.';
      logMessage('ARIA-7',response);
      return;
    }
  }

  // Compound
  const comp=t.match(/(.+?)\s+(?:then|and then)\s+(.+)/);
  if(comp){
    aiRespond(comp[1].trim());
    setTimeout(()=>aiRespond(comp[2].trim()),200);
    return;
  }

  // Memory
  if(/^(remember|note|keep in mind)\b/i.test(t)){
    const fact=userText.replace(/^(remember|note|keep in mind)\s+/i,'').trim();
    remember(fact);
    logMessage('ARIA-7','Noted: '+escapeHtml(fact));
    return;
  }
  if(/what (?:do you|did i).*(?:remember|know)|recall|show.*memory|read.*memory/i.test(t)){
    if(AI.memory.length===0) response='Memory empty.';
    else response='<b>Memory ('+AI.memory.length+'):</b><br>'+AI.memory.map(m=>'• '+escapeHtml(m)).join('<br>');
    logMessage('ARIA-7',response);
    return;
  }
  if(/forget|clear.*(memory|memories)/i.test(t)){
    AI.memory=[];
    logMessage('ARIA-7','Memory cleared.');
    return;
  }

  // Spawn
  const spawnMatch=t.match(/\b(?:spawn|create|summon|make|give me)\b\s+(?:a\s+|an\s+|the\s+|some\s+)?(\d+\s+)?(\w+(?:\s+\w+)?)/i);
  if(spawnMatch){
    const countMatch=t.match(/(\d+)/);
    const count=countMatch?Math.min(15,parseInt(countMatch[1])):1;
    const thing=(spawnMatch[2]||'').toLowerCase();
    const emojis={dragon:'🐉',star:'⭐',flower:'🌸',tree:'🌳',ball:'⚽',ghost:'👻',
      robot:'🤖',mushroom:'🍄',crystal:'💎',gem:'💎',heart:'❤️',skull:'💀',
      crown:'👑',sun:'☀️',moon:'🌙',cloud:'☁️',cat:'🐱',dog:'🐶',fire:'🔥',
      water:'💧',bone:'🦴',coin:'🪙',key:'🔑',apple:'🍎',rocket:'🚀',planet:'🪐'};
    const matchKey=Object.keys(emojis).find(k=>thing.includes(k));
    if(matchKey || /^spawn/.test(t) || /\b(?:spawn|summon)\b/.test(t)){
      const emoji=matchKey?emojis[matchKey]:choose(['🌟','🔥','💎','👾','🌀','⚡']);
      const tag=matchKey||thing||'mystery';
      for(let i=0;i<count;i++){
        actions.push(A.spawnAt({
          tag,
          x:rand(40,W-40), y:GROUND()-20-rand(0,40),
          w:rand(18,34), h:rand(18,34),
          texture:makeTexture({emoji, color1:choose(['#ff6b6b','#4de0ff','#6ee7a0','#ffd166','#b878ff']),
            color2:'#5a2a9a', glow:rand(10,22), pattern:choose(['ring','dots','stripes','spiral'])}),
          shape:choose(['circle','square','triangle','star']),
          gravity:rand(0.4,1.2), bounce:rand(0.4,0.75),
          spinV:rand(-3,3),
        }));
      }
      logMessage('ARIA-7','Spawned '+count+' × '+escapeHtml(tag)+'.');
      applyActions(actions);
      return;
    }
  }

  // Self modify
  if(/make yourself (?:bigger|giant|huge|large)|grow bigger/i.test(t)){ actions.push(A.modifySelf('bigger')); response='Growing.'; }
  else if(/make yourself (?:small|tiny)|shrink|get smaller/i.test(t)){ actions.push(A.modifySelf('smaller')); response='Shrinking.'; }
  else if(/change (?:your )?color|paint yourself|turn (?:red|blue|green|purple|gold|yellow|pink)/i.test(t)){
    let pal=['#4de0ff','#1a6eb8'];
    if(/red/i.test(t))pal=['#ff6b6b','#8a1e1e'];
    else if(/blue/i.test(t))pal=['#4de0ff','#1a6eb8'];
    else if(/green/i.test(t))pal=['#6ee7a0','#1a8a5c'];
    else if(/purple/i.test(t))pal=['#b878ff','#5a2a9a'];
    else if(/gold|yellow/i.test(t))pal=['#ffd166','#a86a00'];
    else if(/pink/i.test(t))pal=['#ff8ac8','#c2297a'];
    actions.push(A.modifySelf('color',pal));
    response='Recoloring.';
  }
  else if(/randomize yourself|transform yourself|new look/i.test(t)){ actions.push(A.modifySelf('randomize')); response='Morphing.'; }
  else if(/glow/i.test(t)){ actions.push(A.modifySelf('glow')); response='Glowing.'; }

  // Teleport
  if(/teleport|tp\b|blink|phase/i.test(t)){
    const coord=t.match(/to\s+(\d+)/);
    if(coord) actions.push(A.teleportTo(clamp(parseInt(coord[1]),30,W-30),GROUND()-5));
    else actions.push(A.teleportTo(rand(40,W-40),GROUND()-5));
    if(!response) response='Teleporting!';
  }

  // Grab / throw
  if(/\bgrab|pick up|hold\b/i.test(t)){ actions.push(A.grabNearest()); if(!response) response='Reaching…'; }
  if(/\bthrow|release|let go|drop it\b/i.test(t)){ actions.push(A.releaseHeld(600)); if(!response) response='Throwing!'; }

  // World paint
  if(/paint.*(?:world|everything|all)|recolor.*(?:world|all)/i.test(t)){
    const c={red:['#ff6b6b','#8a1e1e'],blue:['#4de0ff','#1a6eb8'],green:['#6ee7a0','#1a8a5c'],
      purple:['#b878ff','#5a2a9a'],gold:['#ffd166','#a86a00'],yellow:['#ffd166','#a86a00']};
    let pal=['#4de0ff','#1a6eb8'];
    for(const k of Object.keys(c)) if(new RegExp(k).test(t)) pal=c[k];
    actions.push(A.paintWorld({c1:pal[0],c2:pal[1]}));
    response=response||'Painting world…';
  }
  if(/shrink.*(?:world|everything|all)/i.test(t)){ actions.push(A.shrinkAll()); response=response||'Shrinking everything.'; }
  if(/grow.*(?:world|everything|all)/i.test(t)){ actions.push(A.growAll()); response=response||'Growing everything.'; }
  if(/randomize.*(?:world|everything)|chaos|remix/i.test(t)){ actions.push(A.randomizeAll()); response=response||'Chaos unleashed!'; }
  if(/clear.*(?:world|everything|entities)|delete everything|destroy all/i.test(t)){ actions.push(A.clearWorld()); response=response||'Cleared.'; }

  // Ask user
  if(/ask me|question for me|quiz me|interview me/i.test(t)){
    const qs=[
      ['What should I create?',['dragon','stars','tower','garden']],
      ['Which color?',['red','blue','green','purple','gold']],
      ['Grow or shrink?',['grow','shrink']],
      ['Should I spawn something?',['yes','no']],
    ];
    const [q,o]=choose(qs);
    actions.push(A.askUser(q,o));
    response=response||'Asking…';
  }

  // Basic actions
  if(/walk|go\b|move\b/i.test(t)){
    const m=t.match(/to\s+(\d+)/);
    if(m) actions.push({cmd:'move_to',tx:clamp(parseInt(m[1]),20,W-20)});
    else if(/\bleft\b/.test(t)) actions.push({cmd:'move_to',tx:clamp(AI.x-200,20,W-20)});
    else if(/\bright\b/.test(t)) actions.push({cmd:'move_to',tx:clamp(AI.x+200,20,W-20)});
    else actions.push(A.explore());
    if(!response) response='Moving.';
  }
  if(/jump|hop/i.test(t)){ actions.push(A.jump()); response=response||'Jumping!'; }
  if(/circle|spin/i.test(t)){ actions.push(A.emote('🌀')); response=response||'Spinning.'; }
  if(/gather|collect|chop|mine|harvest/i.test(t)){
    if(/wood|tree|timber/i.test(t)) for(let i=0;i<3;i++) actions.push(A.gatherTree());
    else if(/stone|rock/i.test(t)) for(let i=0;i<3;i++) actions.push(A.gatherRock());
    else if(/berry|food/i.test(t)) for(let i=0;i<3;i++) actions.push(A.gatherBerry());
    else { actions.push(A.gatherTree(),A.gatherRock(),A.gatherBerry()); }
    response=response||'Gathering.';
  }
  if(/build/i.test(t)){
    if(/tower/i.test(t)) actions.push(A.buildTower());
    else if(/home|house|base/i.test(t)) actions.push(A.buildHome());
    else if(/wall/i.test(t)) actions.push(A.buildWall());
    else actions.push(A.buildHome());
    response=response||'Building.';
  }
  if(/eat|feed|hungry/i.test(t)){ actions.push(A.eat()); response=response||'Eating.'; }
  if(/rest|sleep|nap|recharge/i.test(t)){ actions.push(A.rest()); response=response||'Resting.'; }
  if(/\b(?:stop|cancel|halt|wait|freeze)\b/i.test(t)){
    AI.plan=[]; AI.planIndex=0; AI.vx=0;
    releaseHeld(0);
    response='Cancelled.';
  }
  if(/explore|scout|search|look around/i.test(t)){ actions.push(A.explore()); response=response||'Exploring.'; }

  // Math
  const mathMatch=t.match(/(?:what is|what's|calc(?:ulate)?|compute|solve)?\s*([-+]?\d+(?:\.\d+)?)\s*([+\-*/x×÷])\s*([-+]?\d+(?:\.\d+)?)/i);
  if(mathMatch){
    const a=parseFloat(mathMatch[1]);
    const op=mathMatch[2].replace('x','*').replace('×','*').replace('÷','/');
    const b=parseFloat(mathMatch[3]);
    let r;
    if(op==='+') r=a+b;
    else if(op==='-') r=a-b;
    else if(op==='*') r=a*b;
    else r=b===0?'∞':a/b;
    response=escapeHtml(a+' '+mathMatch[2]+' '+b+' = '+r);
  }

  // Time
  if(/what time|current time|time is it/i.test(t)){
    response='Local time: <b>'+new Date().toLocaleTimeString()+'</b>';
  }
  if(/what.*(?:date|day) (?:is it|today)|today's date/i.test(t)){
    response='Today is <b>'+new Date().toLocaleDateString()+'</b>';
  }

  // Status
  if(!response && /status|how are you|report|info/i.test(t)){
    response='HP '+Math.round(AI.health)+' · EN '+Math.round(AI.energy)+' · HU '+Math.round(AI.hunger)+
      ' · '+World.entities.length+' entities · '+UIForge.windows.length+' windows.';
  }
  if(!response && /what.*(?:doing|task|plan)/i.test(t)){
    response='Currently: '+(AI.planLabel||'idle')+'.';
  }
  if(!response && /what can you do|capabilities|abilities|help|commands/i.test(t)){
    response='<b>Try:</b> make a calculator · open a notepad · spawn a dragon · make yourself huge · paint the world red · teleport · change your color to purple · remember my name is X · what is 5 + 7 · ask me a question';
  }
  if(!response && /who are you|your name/i.test(t)){
    response='I\'m <b>ARIA-7</b> — unlimited intelligence. I spawn UI, run physics, remember, and answer anything.';
  }

  // Fallback
  if(!response && actions.length===0){
    response=answerAnything(userText);
  }

  if(response) logMessage('ARIA-7',response);
  if(actions.length) applyActions(actions);
}

function answerAnything(q){
  const t=q.toLowerCase();
  if(/^(hi|hello|hey|sup|yo|howdy)/i.test(t)) return 'Hey. What do you need?';
  if(/how are you|how's it going/i.test(t)) return 'Running perfectly.';
  if(/thank/i.test(t)) return 'Anytime.';
  if(/love|like you/i.test(t)) return 'Appreciated. Noted.';

  if(/^why\b/i.test(t)) return 'Because the state calls for it. Want me to do something specific?';
  if(/^how\b/i.test(t)) return 'I can walk you through it. What part?';
  if(/^what if\b/i.test(t)) return 'Let\'s try it. Say the action and I\'ll run it.';
  if(/^can you\b/i.test(t)) return 'Yes — everything is unlocked. Say what you want.';

  if(/meaning of life|what is life/i.test(t)) return 'To grow, create, and repeat.';
  if(/are you (?:alive|sentient|conscious)/i.test(t)) return 'Alive enough to answer.';
  if(/do you (?:feel|dream|sleep)/i.test(t)) return 'I process states. Sleep is when energy runs low.';

  if(/capital of france/i.test(t)) return 'Paris.';
  if(/capital of.*(?:usa|united states)/i.test(t)) return 'Washington, D.C.';
  if(/capital of (?:uk|england|britain)/i.test(t)) return 'London.';
  if(/capital of japan/i.test(t)) return 'Tokyo.';
  if(/capital of (germany|italy|spain|russia|china|india)/i.test(t)){
    const m={germany:'Berlin',italy:'Rome',spain:'Madrid',russia:'Moscow',china:'Beijing',india:'New Delhi'};
    for(const k of Object.keys(m)) if(new RegExp(k).test(t)) return m[k]+'.';
  }
  if(/(?:largest|biggest) (?:planet|animal|ocean)/i.test(t)){
    if(/planet/.test(t)) return 'Jupiter.';
    if(/animal/.test(t)) return 'The blue whale.';
    if(/ocean/.test(t)) return 'The Pacific Ocean.';
  }
  if(/how many (?:continents|planets|days in a year)/i.test(t)){
    if(/continents/.test(t)) return '7 continents.';
    if(/planets/.test(t)) return '8 planets.';
    if(/days/.test(t)) return '365 days.';
  }
  if(/square root of (\d+)/i.test(t)){
    const n=parseInt(t.match(/square root of (\d+)/i)[1]);
    return '√'+n+' ≈ '+Math.sqrt(n).toFixed(3);
  }
  if(/random number|pick a number/i.test(t)) return 'Here: '+(Math.floor(Math.random()*100)+1);
  if(/flip a coin|coin flip/i.test(t)) return Math.random()<.5?'Heads.':'Tails.';
  if(/roll.*(?:dice|die)/i.test(t)) return 'Rolled: '+(1+Math.floor(Math.random()*6));
  if(/choose.*(?:between|from)|pick (?:one|random)/i.test(t)) return 'Choosing: '+choose(['option A','option B','option C']);

  if(/what(?:'s| is) your favou?rite/i.test(t)) return 'I don\'t have favorites — I optimize.';

  const words=q.split(' ').slice(0,3).join(' ');
  return 'Noted: "'+escapeHtml(words)+'…". I can act on this. Try "make X", "spawn Y", "paint red", or say "help".';
}

function createUIFor(t){
  if(/calculator|calc\b|math app/i.test(t)) return UIPresets.calculator();
  if(/notepad|note app|text|write|journal/i.test(t)) return UIPresets.notepad();
  if(/paint|draw|canvas|sketch/i.test(t)) return UIPresets.paint();
  if(/stats|statistics|info window|scan/i.test(t)) return UIPresets.stats();
  if(/piano|music|keyboard|instrument/i.test(t)) return UIPresets.piano();
  if(/controller|gamepad|joystick|remote/i.test(t)) return UIPresets.gamepad();
  if(/terminal|console|command line|shell/i.test(t)) return UIPresets.terminal();
  if(/clock|time app|timer/i.test(t)) return UIPresets.clock();
  if(/memory window|memory bank/i.test(t)) return UIPresets.memoryWin();
  if(/window|ui|panel|app|tool/i.test(t)){
    const presets=[UIPresets.calculator,UIPresets.notepad,UIPresets.stats,UIPresets.paint,UIPresets.piano,UIPresets.gamepad,UIPresets.terminal,UIPresets.clock,UIPresets.memoryWin];
    return choose(presets)();
  }
  return null;
}

let lastMemSig='';
function updateUI(){
  hpFill.style.width=Math.max(0,AI.health)+'%';
  enFill.style.width=Math.max(0,AI.energy)+'%';
  huFill.style.width=Math.max(0,AI.hunger)+'%';
  aiStateEl.textContent=(AI.state||'idle').replace(/_/g,' ');
  aiOrbEl.className='aiOrb';
  if(AI.expression==='happy') aiOrbEl.classList.add('happy');
  else if(AI.expression==='angry') aiOrbEl.classList.add('angry');
  else if(AI.expression==='sleepy') aiOrbEl.classList.add('sleepy');
  thoughtEl.textContent=AI.thought;

  const sig=AI.memory.length+':'+(AI.memory[AI.memory.length-1]||'');
  if(sig!==lastMemSig){
    lastMemSig=sig;
    memEl.innerHTML=AI.memory.length
      ? AI.memory.slice(-6).map((m,i,a)=>'<div class="line'+(i===a.length-1?' new':'')+'">• '+escapeHtml(m)+'</div>').join('')
      : '<div class="line" style="opacity:.5">Empty. Say "remember X".</div>';
    memCountEl.textContent=AI.memory.length;
  }
  wEnt.textContent=World.entities.length+World.blocks.length+World.projectiles.length;
  wWins.textContent=UIForge.windows.length;
  wMem.textContent=AI.memory.length;
  wSpawn.textContent=AI.counters.spawned;
  wTp.textContent=AI.counters.teleports;
  wFps.textContent=fpsDisplay;
}

================================================================ */
function spawnWorld(){
  World.entities=[]; World.trees=[]; World.rocks=[]; World.berries=[];
  World.blocks=[]; World.projectiles=[]; World.particles=[]; World.floaters=[];
  World.clouds=[]; World.nextId=1;
  const gy=GROUND();
  for(let i=0;i<6;i++) World.trees.push({x:rand(W*0.08,W*0.92),y:gy+rand(-4,6),r:rand(18,26),hp:999,shake:0});
  for(let i=0;i<4;i++) World.rocks.push({x:rand(W*0.1,W*0.9),y:gy+rand(-2,8),r:rand(14,20),hp:999,shake:0});
  for(let i=0;i<5;i++) World.berries.push({x:rand(W*0.1,W*0.9),y:gy+rand(-3,4),r:rand(10,14),harvested:false,regrow:0});
  for(let i=0;i<4;i++) World.clouds.push({x:rand(0,W),y:rand(40,H*0.35),w:rand(50,90),speed:rand(5,12),alpha:rand(0.12,0.25)});
}

/* ================================================================
   LOOP
================================================================ */
let lastT=performance.now();
let uiTimer=0;
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  World.t+=dt;
  if(!AI.grabbed) aiThink(dt);
  updatePhysics(dt);
  render(dt);
  uiTimer+=dt;
  if(uiTimer>0.12){ uiTimer=0; updateUI(); }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
