<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dlballs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#05060b;color:#e8e8e8;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#dl{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#1c1636 0%,#0a0a16 55%,#050507 100%)}
#dl-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.dl-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;z-index:10;
  display:flex;align-items:center;gap:6px;pointer-events:none}
.dl-pill{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  background:rgba(18,18,22,.66);border:1px solid rgba(255,255,255,.07);
  border-radius:13px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:11px;font-weight:600;pointer-events:auto}
.dl-pill .lbl{color:rgba(255,255,255,.32);font-size:9px;letter-spacing:.8px;font-weight:700}
.dl-pill .val{color:#fff;font-variant-numeric:tabular-nums;font-weight:800}
.dl-close{margin-left:auto;width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(255,255,255,.07);background:rgba(18,18,22,.66);
  color:rgba(255,255,255,.75);font-size:12px;cursor:pointer;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;transition:.15s;pointer-events:auto}
.dl-close:active{transform:scale(.9)}
.dl-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;z-index:10;
  display:flex;gap:8px}
.dl-btn{flex:1;height:38px;border-radius:12px;border:none;font-weight:700;font-size:13px;
  cursor:pointer;transition:.15s;font-family:inherit;display:flex;align-items:center;
  justify-content:center;letter-spacing:.2px}
.dl-btn:active{transform:scale(.97)}
.dl-btn:disabled{opacity:.32;pointer-events:none}
.dl-btn-buy{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.09)}
.dl-btn-launch{background:linear-gradient(135deg,#7b5cff,#a340ff);color:#fff;
  box-shadow:0 4px 20px rgba(123,92,255,.35)}
.dl-btn-launch:not(:disabled){animation:dlPulseBtn 2s ease-in-out infinite}
@keyframes dlPulseBtn{0%,100%{box-shadow:0 4px 20px rgba(123,92,255,.35)}
50%{box-shadow:0 4px 30px rgba(163,64,255,.6)}}
.dl-modal{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dl-modal.show{display:flex;animation:dlFade .2s ease}
@keyframes dlFade{from{opacity:0}to{opacity:1}}
.dl-sheet{width:100%;max-width:440px;background:#121216;border-radius:22px 22px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  border-top:1px solid rgba(255,255,255,.07);animation:dlSheetUp .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dl-grip{width:36px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 12px}
.dl-sheet h3{font-size:15px;font-weight:700;color:#fff;text-align:center;margin-bottom:14px}
.dl-seg{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.04);border-radius:11px;margin-bottom:14px}
.dl-seg button{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;
  color:rgba(255,255,255,.45);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.dl-seg button.on{background:rgba(123,92,255,.22);color:#fff}
.dl-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.dl-row label{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.9px;text-transform:uppercase;
  font-weight:700;padding-left:2px}
.dl-input{width:100%;height:42px;padding:0 14px;border-radius:11px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);
  color:#fff;font-size:15px;font-weight:700;text-align:center;outline:none;font-family:inherit;
  font-variant-numeric:tabular-nums;transition:.15s}
.dl-input:focus{border-color:rgba(123,92,255,.5);background:rgba(123,92,255,.06)}
.dl-hint{font-size:10.5px;color:rgba(255,255,255,.3);line-height:1.5;padding:0 2px}
.dl-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.dl-tier{padding:10px 2px;border-radius:10px;border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.03);color:#fff;cursor:pointer;
  font-size:10px;font-weight:800;text-align:center;font-family:inherit;line-height:1.35;transition:.15s}
.dl-tier b{font-size:14px;display:block;margin-bottom:1px}
.dl-tier small{font-size:9.5px;color:rgba(255,255,255,.4);font-weight:600}
.dl-tier.on{border-color:#7b5cff;background:rgba(123,92,255,.15)}
.dl-tier.on small{color:rgba(180,150,255,.9)}
.dl-actions{display:flex;gap:8px;margin-top:4px}
.dl-actions button{flex:1;height:42px;border-radius:11px;border:none;font-weight:700;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.dl-actions button:active{transform:scale(.97)}
.dl-cancel{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6)}
.dl-confirm{background:linear-gradient(135deg,#2ecc71,#1a9a52);color:#fff;
  box-shadow:0 4px 18px rgba(46,204,113,.3)}
.dl-r{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(6,6,11,.94);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px)}
.dl-r.show{display:flex}
.dl-r-title{font-size:12px;color:rgba(255,255,255,.45);letter-spacing:2.5px;
  text-transform:uppercase;font-weight:800;margin-bottom:18px}
.dl-r-stage{position:relative;width:100%;max-width:520px;height:190px}
.dl-r-stage canvas{display:block;width:100%;height:100%}
.dl-r-arrow{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  color:#fff;font-size:14px;text-shadow:0 0 14px rgba(255,255,255,.9);
  animation:dlArrowP 1s ease-in-out infinite}
@keyframes dlArrowP{0%,100%{transform:translateX(-50%) translateY(0);opacity:.7}
50%{transform:translateX(-50%) translateY(-4px);opacity:1}}
.dl-result{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px}
.dl-result.show{display:flex;animation:dlFade .25s ease}
.dl-result-box{width:100%;max-width:340px;background:#121216;border:1px solid rgba(255,255,255,.07);
  border-radius:22px;padding:26px 22px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.8);animation:dlPop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlPop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.dl-res-tag{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2px;
  text-transform:uppercase;font-weight:800}
.dl-res-amt{font-size:42px;font-weight:900;color:#7bffb8;margin:8px 0 2px;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(123,255,184,.3)}
.dl-res-amt.lose{color:#ff7b7b;text-shadow:0 0 30px rgba(255,123,123,.3)}
.dl-res-sub{font-size:11.5px;color:rgba(255,255,255,.4);margin-bottom:18px}
</style>
</head>
<body>

<div id="dl">
  <canvas id="dl-canvas"></canvas>

  <div class="dl-top">
    <div class="dl-pill"><span class="lbl">BAL</span><span class="val" id="dl-bal">0</span></div>
    <div class="dl-pill"><span class="lbl">HOLD</span><span class="val" id="dl-hold">0 · 0💎</span></div>
    <button class="dl-close" id="dl-close">✕</button>
  </div>

  <div class="dl-bottom">
    <button class="dl-btn dl-btn-buy" id="dl-buy">Buy Balls</button>
    <button class="dl-btn dl-btn-launch" id="dl-launch" disabled>Launch</button>
  </div>

  <div class="dl-modal" id="dl-buy-modal">
    <div class="dl-sheet">
      <div class="dl-grip"></div>
      <h3>Buy Balls</h3>
      <div class="dl-seg">
        <button class="on" data-tab="random">Random</button>
        <button data-tab="tier">Choose</button>
      </div>
      <div id="dl-pane-random">
        <div class="dl-row">
          <label>Amount to spend</label>
          <input class="dl-input" id="dl-rand-amt" value="100" inputmode="numeric">
        </div>
        <p class="dl-hint">Weighted roll — most balls land under 50💎, rare gold can hit 1000💎.</p>
      </div>
      <div id="dl-pane-tier" style="display:none">
        <div class="dl-tiers">
          <button class="dl-tier on" data-tier="gray"   data-price="10"><b>●</b>Gray<small>10💎</small></button>
          <button class="dl-tier" data-tier="silver" data-price="100"><b>●</b>Silver<small>100💎</small></button>
          <button class="dl-tier" data-tier="green"  data-price="500"><b>●</b>Green<small>500💎</small></button>
          <button class="dl-tier" data-tier="gold"   data-price="1000"><b>●</b>Gold<small>1000💎</small></button>
        </div>
        <div class="dl-row">
          <label>Quantity</label>
          <input class="dl-input" id="dl-tier-qty" value="1" inputmode="numeric">
        </div>
      </div>
      <div class="dl-actions">
        <button class="dl-cancel" id="dl-buy-cancel">Cancel</button>
        <button class="dl-confirm" id="dl-buy-go">Buy</button>
      </div>
    </div>
  </div>

  <div class="dl-r" id="dl-roulette">
    <div class="dl-r-title" id="dl-r-title">Rolling</div>
    <div class="dl-r-stage">
      <canvas id="dl-r-canvas"></canvas>
      <div class="dl-r-arrow">▲</div>
    </div>
  </div>

  <div class="dl-result" id="dl-result">
    <div class="dl-result-box">
      <div class="dl-res-tag" id="dl-res-tag">Result</div>
      <div class="dl-res-amt" id="dl-res-amt">+0 💎</div>
      <div class="dl-res-sub" id="dl-res-sub"></div>
      <button class="dl-btn dl-btn-launch" id="dl-res-ok" style="width:100%">Continue</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

let BALANCE = 5000;
try { if (window.__state?.balance) BALANCE = window.__state.balance; } catch(_){}

const TIER_MAT = {
  gray:   { color:0x9a9aa8, metalness:0.75, roughness:0.45, emissive:0x000000, eInt:0 },
  silver: { color:0xd8d8ee, metalness:1.00, roughness:0.14, emissive:0x1a1a30, eInt:0.3 },
  green:  { color:0x30c977, metalness:0.90, roughness:0.18, emissive:0x084a28, eInt:0.6 },
  gold:   { color:0xffcc33, metalness:1.00, roughness:0.10, emissive:0x6a3a08, eInt:0.8 },
};
function tierFor(v){ return v>=1000?'gold':v>=500?'green':v>=100?'silver':'gray'; }
function ballR(v){ return 7 + Math.log10(v+1)*1.9; }

/* ══════════ WORLD ══════════ */
const BOARD = { wallTopY: 420, wallBotY: 20, wallTopHalf: 205, wallBotHalf: 108, wallThick: 11, wallZ: 0 };
const PEG = { topY: 300, botY: 90, rows: 7, r: 8, z: 0 };
const TRI = { tipY: -50, baseY: -100, halfW: 50, slideRange: 62, speed: 105, z: 0 };
const FLOOR = { y: -140, halfW: 95 };
const SPIN = { cx: 0, cy: 500, cz: 0, R: 118, tube: 10 };

// Rims closer to holes now
const BOWL1 = {
  cx: 0, cz: 0, cy: -255,
  rimR: 92, wallH: 46, wallT: 14,
  holes: [
    { a:  Math.PI/2,           r: 46, mult: 3.0, red: true  },
    { a:  Math.PI/2 + 2.094,   r: 46, mult: 1.5, red: false },
    { a:  Math.PI/2 - 2.094,   r: 46, mult: 1.5, red: false },
  ],
  holeR: 22,
};
const BOWL2 = {
  cx: 0, cz: 0, cy: -375,
  rimR: 72, wallH: 40, wallT: 12,
  holes: [
    { a:  Math.PI/2, r: 36, mult: 6.0, red: true  },
    { a: -Math.PI/2, r: 36, mult: 3.0, red: false },
  ],
  holeR: 18,
};

/* ══════════ SCENE ══════════ */
const W0 = window.innerWidth, H0 = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W0/H0, 1, 6000);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
renderer.setSize(W0, H0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const canvasHost = document.getElementById('dl-canvas');
canvasHost.parentNode.replaceChild(renderer.domElement, canvasHost);
renderer.domElement.id = 'dl-canvas';

scene.add(new THREE.AmbientLight(0xffffff, 0.42));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(220, 800, 700);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -520; key.shadow.camera.right = 520;
key.shadow.camera.top = 800; key.shadow.camera.bottom = -700;
key.shadow.camera.near = 10; key.shadow.camera.far = 2500;
key.shadow.bias = -0.0011; key.shadow.radius = 3;
scene.add(key);
const pd = new THREE.DirectionalLight(0x8a5cff, 1.2);
pd.position.set(-420, 250, 350);
scene.add(pd);
const rim = new THREE.PointLight(0x6a2aff, 1.8, 1600);
rim.position.set(0, -320, 350); scene.add(rim);
const topGlow = new THREE.PointLight(0xb080ff, 0.9, 900);
topGlow.position.set(0, 500, 350); scene.add(topGlow);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(750, 1200),
  new THREE.MeshStandardMaterial({ color:0x0d0c1c, metalness:0.4, roughness:0.85 })
);
backdrop.position.set(0, -60, -150);
backdrop.receiveShadow = true;
scene.add(backdrop);

/* ══════════ FUNNEL ══════════ */
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x4a4a72, metalness: 0.88, roughness: 0.22,
  emissive: 0x1a1a44, emissiveIntensity: 0.55,
});
function buildFunnelWall(sign){
  const x1 = sign * BOARD.wallTopHalf, y1 = BOARD.wallTopY;
  const x2 = sign * BOARD.wallBotHalf, y2 = BOARD.wallBotY;
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);
  const geo = new THREE.BoxGeometry(len, BOARD.wallThick, 30);
  const m = new THREE.Mesh(geo, wallMat);
  m.position.set((x1+x2)/2, (y1+y2)/2, BOARD.wallZ);
  m.rotation.z = angle;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return { x1, y1, x2, y2, thick: BOARD.wallThick/2 };
}
const WALLS = [ buildFunnelWall(-1), buildFunnelWall(1) ];

/* ══════════ PEGS ══════════ */
const pegMatBase = new THREE.MeshStandardMaterial({
  color: 0xc8d0ee, metalness: 1.0, roughness: 0.14,
  emissive: 0x201a40, emissiveIntensity: 0.25,
});
const P = [];
(function buildPegs(){
  const rows = PEG.rows;
  for (let r=0; r<rows; r++){
    const t = r/(rows-1);
    const y = PEG.topY + (PEG.botY - PEG.topY)*t;
    const count = 6 + (r%2);
    const span = 340;
    const step = span/(count+1);
    const startX = -span/2 + step;
    for (let i=0; i<count; i++){
      const x = startX + i*step;
      const m = new THREE.Mesh(new THREE.SphereGeometry(PEG.r, 18, 12), pegMatBase.clone());
      m.position.set(x, y, PEG.z);
      m.castShadow = true;
      m.userData.hit = 0;
      scene.add(m);
      P.push({ mesh:m, x, y, r:PEG.r });
    }
  }
})();

/* ══════════ TRIANGLE ══════════ */
const triShape = new THREE.Shape();
triShape.moveTo(0, (TRI.tipY - TRI.baseY)/2);
triShape.lineTo(-TRI.halfW, (TRI.baseY - TRI.tipY)/2);
triShape.lineTo(TRI.halfW, (TRI.baseY - TRI.tipY)/2);
triShape.closePath();
const triGeo = new THREE.ExtrudeGeometry(triShape, {
  depth: 24, bevelEnabled: true, bevelThickness: 1.5, bevelSize: 1.5, bevelSegments: 2,
});
triGeo.translate(0, 0, -12);
const triMat = new THREE.MeshStandardMaterial({
  color: 0xf0c040, metalness: 0.92, roughness: 0.20,
  emissive: 0x6a3010, emissiveIntensity: 0.55,
});
const triMesh = new THREE.Mesh(triGeo, triMat);
triMesh.position.set(0, (TRI.tipY + TRI.baseY)/2, TRI.z);
triMesh.castShadow = true; triMesh.receiveShadow = true;
scene.add(triMesh);

/* ══════════ SPINNER ══════════ */
const spinMat = new THREE.MeshStandardMaterial({
  color: 0x8a5cff, metalness: 0.94, roughness: 0.14,
  emissive: 0x4a20a0, emissiveIntensity: 1.0,
});
const spinMesh = new THREE.Mesh(new THREE.TorusGeometry(SPIN.R, SPIN.tube, 16, 96), spinMat);
spinMesh.position.set(SPIN.cx, SPIN.cy, SPIN.cz);
spinMesh.castShadow = true; spinMesh.receiveShadow = true;
scene.add(spinMesh);

const spinRailMat = new THREE.MeshStandardMaterial({
  color: 0xb080ff, emissive: 0x6028d0, emissiveIntensity: 1.2,
  metalness: 0.6, roughness: 0.32,
});
const spinRail = new THREE.Mesh(new THREE.TorusGeometry(SPIN.R + 12, 1.4, 8, 96), spinRailMat);
spinRail.position.copy(spinMesh.position);
scene.add(spinRail);

const spinInner = new THREE.Mesh(
  new THREE.CircleGeometry(SPIN.R - SPIN.tube - 2, 48),
  new THREE.MeshBasicMaterial({ color: 0x1a1030, transparent: true, opacity: 0.32, side: THREE.DoubleSide })
);
spinInner.position.set(SPIN.cx, SPIN.cy, SPIN.cz - 4);
scene.add(spinInner);

function setSpinnerGap(gapAngle){
  const arc = Math.PI * 2 - gapAngle;
  if (arc < 0.15){ spinMesh.visible = false; spinRail.visible = false; return; }
  spinMesh.visible = true; spinRail.visible = true;
  spinMesh.geometry.dispose();
  spinMesh.geometry = new THREE.TorusGeometry(SPIN.R, SPIN.tube, 16, 96, arc);
  spinMesh.rotation.z = -Math.PI/2 + gapAngle/2;
  spinRail.geometry.dispose();
  spinRail.geometry = new THREE.TorusGeometry(SPIN.R + 12, 1.4, 8, 96, arc);
  spinRail.rotation.z = -Math.PI/2 + gapAngle/2;
}
setSpinnerGap(0);

/* ══════════ BOWL BUILDER ══════════ */
function buildBowl(cfg, accent){
  const group = new THREE.Group();
  group.position.set(cfg.cx, cfg.cy, cfg.cz);

  const rimMat = new THREE.MeshStandardMaterial({
    color: accent, metalness: 0.92, roughness: 0.16,
    emissive: 0x3a1a80, emissiveIntensity: 0.65,
    side: THREE.DoubleSide,
  });
  const rimGeo = new THREE.CylinderGeometry(
    cfg.rimR + cfg.wallT/2, cfg.rimR + cfg.wallT/2, cfg.wallH, 56, 1, true
  );
  const rimMesh = new THREE.Mesh(rimGeo, rimMat);
  rimMesh.position.y = cfg.wallH / 2;
  rimMesh.castShadow = true; rimMesh.receiveShadow = true;
  group.add(rimMesh);

  const floorShape = new THREE.Shape();
  floorShape.absarc(0, 0, cfg.rimR, 0, Math.PI * 2, false);
  for (const h of cfg.holes){
    const hp = new THREE.Path();
    hp.absarc(Math.cos(h.a) * h.r, Math.sin(h.a) * h.r, cfg.holeR, 0, Math.PI * 2, true);
    floorShape.holes.push(hp);
  }
  const floorGeo = new THREE.ExtrudeGeometry(floorShape, {
    depth: 5, bevelEnabled: false, curveSegments: 48,
  });
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x1a0f38, metalness: 0.55, roughness: 0.72,
    emissive: 0x2a1060, emissiveIntensity: 0.35,
    side: THREE.DoubleSide,
  });
  const floorMesh = new THREE.Mesh(floorGeo, floorMat);
  floorMesh.rotation.x = -Math.PI / 2;
  floorMesh.position.y = -2.5;
  floorMesh.receiveShadow = true;
  group.add(floorMesh);

  cfg.holes.forEach(h => {
    const hx = Math.cos(h.a) * h.r;
    const hz = Math.sin(h.a) * h.r;
    const badgeMat = new THREE.MeshStandardMaterial({
      color: h.red ? 0xff3355 : 0xa070ff,
      emissive: h.red ? 0xff1030 : 0x5020c0,
      emissiveIntensity: 1.4, metalness: 0.75, roughness: 0.28,
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(cfg.holeR, 2.4, 8, 28), badgeMat);
    ring.rotation.x = -Math.PI/2;
    ring.position.set(hx, 0.5, hz);
    ring.castShadow = true;
    group.add(ring);
    const holeDisc = new THREE.Mesh(
      new THREE.CircleGeometry(cfg.holeR - 0.5, 24),
      new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
    );
    holeDisc.rotation.x = -Math.PI/2;
    holeDisc.position.set(hx, -6, hz);
    group.add(holeDisc);
  });

  scene.add(group);
  return { ...cfg, group };
}
const B1 = buildBowl(BOWL1, 0x6a4aff);

function haptic(){ try{ navigator.vibrate?.(10); }catch(_){} }
function randomValue(){

  if (r < 0.45) return 1 + Math.floor(Math.random()*9);
  if (r < 0.72) return 10 + Math.floor(Math.random()*40);

/* ══════════ COLLISION ══════════ */
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, ls=dx*dx+dy*dy;
  if (ls<1e-6) return {x:ax, y:ay};
  let t = ((px-ax)*dx + (py-ay)*dy)/ls;
  t = Math.max(0, Math.min(1, t));
  return { x:ax+t*dx, y:ay+t*dy };
}
function collideSeg(b, ax,ay, bx,by, thick, rest){
  const c = closestOnSeg(b.x, b.y, ax,ay, bx,by);
  const dx = b.x - c.x, dy = b.y - c.y;
  const d2 = dx*dx + dy*dy;
  const minD = b.r + thick;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2);
  const nx = dx/d, ny = dy/d;
  b.x += nx*(minD - d); b.y += ny*(minD - d);
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+rest)*vn*nx;
    b.vy -= (1+rest)*vn*ny;
    b.squash = Math.min(1, Math.abs(vn)/620);
    return true;
  }
  return true;
}
function collideCircle(b, cx, cy, cr, rest){
  const dx = b.x - cx, dy = b.y - cy;
  const minD = b.r + cr;
  const d2 = dx*dx + dy*dy;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2);
  const nx = dx/d, ny = dy/d;
  b.x = cx + nx*minD; b.y = cy + ny*minD;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+rest)*vn*nx;
    b.vy -= (1+rest)*vn*ny;
    b.vx += (Math.random()-.5)*20;
    b.squash = Math.min(1, Math.abs(vn)/620);
    return true;
  }
  return false;
}

/* ── Point-in-triangle + full solid triangle resolution ── */
function pointInTri(px, py, ax, ay, bx, by, cx, cy){
  const d1 = (px-bx)*(ay-by) - (ax-bx)*(py-by);
  const d2 = (px-cx)*(by-cy) - (bx-cx)*(py-cy);
  const d3 = (px-ax)*(cy-ay) - (cx-ax)*(py-ay);
  const hasNeg = d1 < 0 || d2 < 0 || d3 < 0;
  const hasPos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(hasNeg && hasPos);
}

function resolveTriangle(b){
  const tipX = G.triX, tipY = TRI.tipY;
  const blx = G.triX - TRI.halfW, bly = TRI.baseY;
  const brx = G.triX + TRI.halfW, bry = TRI.baseY;

  // Fast reject — outside bounding box + margin
  const minX = Math.min(tipX, blx, brx) - b.r - 4;
  const maxX = Math.max(tipX, blx, brx) + b.r + 4;
  const minY = Math.min(tipY, bly, bry) - b.r - 4;
  const maxY = Math.max(tipY, bly, bry) + b.r + 4;
  if (b.x < minX || b.x > maxX || b.y < minY || b.y > maxY) return false;

  // Case 1: ball center is INSIDE the triangle → push out nearest edge
  if (pointInTri(b.x, b.y, tipX, tipY, blx, bly, brx, bry)){
    const edges = [
      { ax: tipX, ay: tipY, bx: blx, by: bly },
      { ax: tipX, ay: tipY, bx: brx, by: bry },
      { ax: blx,  ay: bly,  bx: brx, by: bry },
    ];
    let best = null, bestD = Infinity, bestC = null;
    for (const e of edges){
      const c = closestOnSeg(b.x, b.y, e.ax, e.ay, e.bx, e.by);
      const d = Math.hypot(b.x - c.x, b.y - c.y);
      if (d < bestD){ bestD = d; best = e; bestC = c; }
    }
    const dx = b.x - bestC.x, dy = b.y - bestC.y;
    const dd = Math.hypot(dx, dy) || 1;
    const nx = dx/dd, ny = dy/dd;
    b.x = bestC.x + nx * (b.r + 2);
    b.y = bestC.y + ny * (b.r + 2);
    const vn = b.vx*nx + b.vy*ny;
    if (vn < 0){
      b.vx -= (1 + REST_TRI) * vn * nx;
      b.vy -= (1 + REST_TRI) * vn * ny;
    } else {
      b.vx += nx * 100;
      b.vy += ny * 100;
    }
    // Add sideways push off the slopes
    const sdx = b.x - tipX;
    b.vx += Math.sign(sdx || 1) * 40;
    b.squash = 0.9;
    return true;
  }

  // Case 2: ball overlaps an edge → standard segment collision
  let hit = false;
  if (collideSeg(b, tipX, tipY, blx, bly, 2, REST_TRI)) hit = true;
  if (collideSeg(b, tipX, tipY, brx, bry, 2, REST_TRI)) hit = true;
  if (hit){
    const dx = b.x - tipX;
    if (Math.abs(dx) < 3) b.vx += (Math.random()<0.5?-1:1)*180;
    else                  b.vx += Math.sign(dx) * 70;
    b.squash = Math.max(b.squash, 0.8);
  }
  return hit;
}

/* ══════════ PHYSICS ══════════ */
const GRAV = 520;
const AIR  = 0.9992;
const REST_WALL = 0.42;
const REST_PEG  = 0.52;
const REST_TRI  = 0.58;

/* ══════════ BALL ══════════ */
function spawnBall(value, tier, spawnDelay){
  const inner = SPIN.R - SPIN.tube - 14;
  const a = Math.random() * Math.PI * 2;
  const rad = 24 + Math.random() * (inner - 34);
  const b = {
    value, tier, r: ballR(value),
    x: SPIN.cx + Math.cos(a) * rad,
    y: SPIN.cy + Math.sin(a) * rad * 0.85,
    z: SPIN.cz,
    vx: (Math.random()-0.5) * 90,
    vy: (Math.random()-0.5) * 90,
    state: 'held',
    popT: -(spawnDelay || 0),
    scale: 0,
    theta:0, rad:0, omega:0, bowlNum:0, orbitT:0,
    stall:0, squash:0, spin:0,
    mesh: makeBallMesh(value, tier),
    dead: false,
    dropTargetY: 0,
    holeTarget: null, holeT: 0,
    hoverT: 0, hoverDuration: 0.55,
    hoverStartTheta: 0, hoverEndTheta: 0,
    holeStartY: 0, holeStartScale: 1,
  };
  b.mesh.scale.setScalar(0.001);
  scene.add(b.mesh);
  return b;
}
function removeBall(b){
  scene.remove(b.mesh);
  if (b.mesh.material) b.mesh.material.dispose();
}
function easeOutBack(t){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

/* ══════════ HELD ══════════ */
function updateHeld(dt){
  const innerR = SPIN.R - SPIN.tube - 4;
  for (let i = G.held.length - 1; i >= 0; i--){
    const b = G.held[i];
    if (b.popT < 0){ b.popT += dt; continue; }
    if (b.popT < 0.55){
      b.popT += dt;
      const t = Math.min(b.popT / 0.55, 1);
      b.scale = Math.max(0.001, easeOutBack(t));
    } else b.scale = 1;

    b.vy -= 90 * dt;
    b.vx *= Math.pow(0.35, dt);
    b.vy *= Math.pow(0.35, dt);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.spin += (Math.abs(b.vx) + Math.abs(b.vy)) * 0.003;

    const dx = b.x - SPIN.cx, dy = b.y - SPIN.cy;
    const dist = Math.hypot(dx, dy);
    const maxDist = innerR - b.r;
    if (dist > maxDist && dist > 0.001){
      const nx = dx / dist, ny = dy / dist;
      b.x = SPIN.cx + nx * maxDist;
      b.y = SPIN.cy + ny * maxDist;
      const vn = b.vx * nx + b.vy * ny;
      if (vn > 0){
        b.vx -= 2 * vn * nx * 0.82;
        b.vy -= 2 * vn * ny * 0.82;
        if (Math.random() < 0.35){
          b.vx += (Math.random()-0.5) * 55;
          b.vy += (Math.random()-0.5) * 55;
        }
      }
    }
    for (let j = 0; j < G.held.length; j++){
      if (j === i) continue;
      const ob = G.held[j];
      if (ob.popT < 0) continue;
      const ddx = b.x - ob.x, ddy = b.y - ob.y;
      const dd = Math.hypot(ddx, ddy);
      const minD = b.r + ob.r;
      if (dd < minD && dd > 0.001){
        const nx = ddx / dd, ny = ddy / dd;
        const push = (minD - dd) * 0.5;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }
}

/* ══════════ FALLING — with physics substepping ══════════ */
function stepFalling(b, dt){
  // Adaptive substeps based on velocity to prevent tunneling
  const speed = Math.hypot(b.vx, b.vy);
  const SUBSTEPS = Math.min(8, Math.max(3, Math.ceil(speed / 90)));
  const subDt = dt / SUBSTEPS;

  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV * subDt;
    b.vx *= AIR;
    b.vy *= AIR;
    b.x += b.vx * subDt;
    b.y += b.vy * subDt;

    for (const w of WALLS)
      collideSeg(b, w.x1, w.y1, w.x2, w.y2, w.thick, REST_WALL);

    for (const p of P){
      if (Math.abs(p.x - b.x) > 40) continue;
      if (Math.abs(p.y - b.y) > 40) continue;
      if (collideCircle(b, p.x, p.y, p.r, REST_PEG)){
        p.mesh.userData.hit = Math.min(1, p.mesh.userData.hit + 0.7);
      }
    }

    resolveTriangle(b);
  }

  b.spin += (Math.abs(b.vx) + Math.abs(b.vy)) * 0.0035;

  if (b.y < FLOOR.y){
    if (Math.abs(b.x) < FLOOR.halfW){
      startBowlDrop(b, Math.random() < 0.30 ? 2 : 1);
      return;
    } else {
      if (b.x < 0) b.vx -= 280; else b.vx += 280;
      if (b.x < -80 || b.x > 80 || b.y < FLOOR.y - 260){
        b.state = 'lost'; b.dead = true;
        G.results.push({ value:b.value, mult:0 });
      }
    }
  }

  const spd = Math.hypot(b.vx, b.vy);
  if (spd < 40) b.stall += dt; else b.stall = 0;
  if (b.stall > 2.0){
    b.vx += (Math.random()-.5)*140;
    b.vy += 60;
    b.stall = 0;
  }
}

/* ══════════ DROP INTO BOWL ══════════ */
function startBowlDrop(b, bowlNum){
  const cfg = bowlNum === 1 ? BOWL1 : BOWL2;
  b.state = 'drop' + bowlNum;
  b.bowlNum = bowlNum;
  b.dropTargetY = cfg.cy + b.r + 3;

  // Force landing near the RIM so ball has to roll in — never on top of a hole
  const minR = cfg.holes[0].r + cfg.holeR + 8;
  const maxR = cfg.rimR - b.r - 6;
  const offA = Math.random() * Math.PI * 2;
  let offR;
  if (minR >= maxR){
    offR = (minR + maxR) * 0.5;
  } else {
    offR = minR + Math.random() * (maxR - minR);
  }
  b.x = cfg.cx + Math.cos(offA) * offR;
  b.z = cfg.cz + Math.sin(offA) * offR;
  b.y = cfg.cy + 240;
  b.vx = 0; b.vy = -60;
  b.spin = 0;
}

function updateDrop(b, dt){
  b.vy -= GRAV * 0.9 * dt;
  b.y += b.vy * dt;
  b.x += b.vx * dt;

  const cfg = b.bowlNum === 1 ? BOWL1 : BOWL2;
  const dx = b.x - cfg.cx, dz = b.z - cfg.cz;
  const r = Math.hypot(dx, dz);
  const maxR = cfg.rimR - b.r - 6;
  if (r > maxR){
    b.x = cfg.cx + (dx/r) * maxR;
    b.z = cfg.cz + (dz/r) * maxR;
  }

  if (b.y <= b.dropTargetY){
    b.y = b.dropTargetY;
    b.squash = 1.0;
    const dx2 = b.x - cfg.cx, dz2 = b.z - cfg.cz;
    b.theta = Math.atan2(dz2, dx2);
    b.rad = Math.max(Math.hypot(dx2, dz2), cfg.holes[0].r + cfg.holeR + 4);
    // Higher starting omega → multiple orbits before capture
    b.omega = (Math.random() > 0.5 ? 1 : -1) * (2.9 + Math.random() * 0.7);
    b.orbitT = 0;
    b.state = 'bowl' + b.bowlNum;
  }
}

/* ══════════ BOWL ROLLING ══════════ */
function updateOrbit(b, dt){
  const cfg = b.bowlNum === 1 ? BOWL1 : BOWL2;
  b.orbitT += dt;

  b.theta += b.omega * dt;
  // Slow decay: 0.85^dt — ball orbits for multiple revolutions
  b.omega *= Math.pow(0.85, dt);

  // Gentle spiral inward; stronger only when slow
  const spd = Math.abs(b.omega);
  const inwardFactor = spd < 1.2 ? (1.2 - spd) * 28 : 0;
  b.rad -= (3 + inwardFactor) * dt;

  const holeRing = cfg.holes[0].r;
  if (b.rad < holeRing) b.rad = holeRing;
  if (b.rad > cfg.rimR - b.r - 4) b.rad = cfg.rimR - b.r - 4;

  b.x = cfg.cx + Math.cos(b.theta) * b.rad;
  b.z = cfg.cz + Math.sin(b.theta) * b.rad;
  b.y = cfg.cy + b.r + 3;
  b.spin += Math.abs(b.omega) * dt * 6;

  // Must orbit for a minimum time so player sees rolling
  if (b.orbitT < 1.6) return;

  // Capture only when slow AND near a hole
  for (const h of cfg.holes){
    const hx = cfg.cx + Math.cos(h.a) * h.r;
    const hz = cfg.cz + Math.sin(h.a) * h.r;
    const dd = Math.hypot(b.x - hx, b.z - hz);
    if (dd < cfg.holeR * 0.75 && spd < 2.1){
      startHover(b, cfg, h);
      return;
    }
  }

  // Fallback — force settle if orbiting too long
  if (b.orbitT > 7.0){
    let best = cfg.holes[0], bd = Infinity;
    for (const h of cfg.holes){
      let da = b.theta - h.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < bd){ bd = Math.abs(da); best = h; }
    }
    b.theta = best.a;
    b.rad = best.r;
    startHover(b, cfg, best);
  }
}

/* ══════════ HOVER + SLOW FALL (dramatic) ══════════ */
function startHover(b, cfg, hole){
  b.state = 'hover';
  b.holeTarget = hole;
  b.hoverT = 0;
  b.holeStartY = cfg.cy + b.r + 3;
  b.hoverStartTheta = b.theta;
  b.hoverEndTheta = hole.a;
  while (b.hoverEndTheta - b.hoverStartTheta >  Math.PI) b.hoverEndTheta -= Math.PI * 2;
  while (b.hoverEndTheta - b.hoverStartTheta < -Math.PI) b.hoverEndTheta += Math.PI * 2;
  G.results.push({ value: b.value, mult: hole.mult });
  b.resultMult = hole.mult;
  G.shake = Math.min(1, G.shake + (hole.red ? 0.5 : 0.25));
}

function updateHover(b, dt){
  b.hoverT += dt;
  const t = Math.min(b.hoverT / b.hoverDuration, 1);
  const ease = t * t * (3 - 2 * t);
  b.theta = b.hoverStartTheta + (b.hoverEndTheta - b.hoverStartTheta) * ease;
  const cfg = b.bowlNum === 1 ? BOWL1 : BOWL2;
  const h = b.holeTarget;
  b.x = cfg.cx + Math.cos(b.theta) * h.r;
  b.z = cfg.cz + Math.sin(b.theta) * h.r;
  // Anticipation lift + wobble
  b.y = b.holeStartY + Math.sin(t * Math.PI) * 6;
  b.x += Math.sin(b.hoverT * 28) * 1.4;
  b.spin += dt * 5;
  if (t >= 1){
    b.state = 'hole';
    b.holeT = 0;
    b.holeStartY = cfg.cy + b.r + 3;
    b.holeStartScale = 1;
  }
}

function updateHoleDrop(b, dt){
  b.holeT += dt;
  const DUR = 1.15;
  const t = Math.min(b.holeT / DUR, 1);
  // Progressive acceleration curve
  const fall = t * t * (1.4 - t * 0.4);
  b.y = b.holeStartY - fall * 220;
  b.spin += dt * 9;
  b.scale = 1 - fall * 0.62;
  // Small wobble while falling
  const cfg = b.bowlNum === 1 ? BOWL1 : BOWL2;
  const h = b.holeTarget;
  b.x = cfg.cx + Math.cos(h.a) * h.r + Math.sin(b.holeT * 22) * 1.8;
  b.z = cfg.cz + Math.sin(h.a) * h.r + Math.cos(b.holeT * 22) * 1.8;
  if (t >= 1){
    b.state = 'settled';
    b.y = -9999;
  }
}

/* ══════════ UPDATE ══════════ */
function update(dt){
  G.time += dt;
  G.shake *= Math.pow(0.001, dt);

  if (G.phase === 'playing' || G.phase === 'ended'){
    G.triX += G.triDir * TRI.speed * dt;
    if (G.triX >  TRI.slideRange){ G.triX =  TRI.slideRange; G.triDir = -1; }
    if (G.triX < -TRI.slideRange){ G.triX = -TRI.slideRange; G.triDir =  1; }
    triMesh.position.x = G.triX;
  }

  updateHeld(dt);

  if (G.phase === 'launching'){
    G.launchT += dt;
    G.launchOpen = Math.min(1, G.launchT / 0.85);
    const gapAngle = G.launchOpen * Math.PI * 0.95;
    setSpinnerGap(gapAngle);

    if (G.launchT > 0.3){
      G.releaseTimer -= dt;
      if (G.releaseTimer <= 0 && G.held.length > 0){
        let idx = 0, minY = Infinity;
        for (let i=0; i<G.held.length; i++){
          if (G.held[i].y < minY){ minY = G.held[i].y; idx = i; }
        }
        const b = G.held.splice(idx, 1)[0];
        b.state = 'falling';
        b.vx = (Math.random() - 0.5) * 40;
        b.vy = -80;
        b.z = 0;
        b.stall = 0; b.squash = 0;
        G.active.push(b);
        G.releaseTimer = 0.14;
        haptic();
      }
    }

    if (G.launchT > 1.9 && G.held.length > 0){
      while (G.held.length){
        const b = G.held.pop();
        b.state = 'falling';
        b.vx = (Math.random()-0.5)*40;
        b.vy = -80;
        b.z = 0;
        G.active.push(b);
      }
    }

    if (G.launchT > 1.9 && G.held.length === 0){
      G.phase = 'playing';
      G._ending = false;
      updateHud();
    }
  }

  for (let i = G.active.length - 1; i >= 0; i--){
    const b = G.active[i];
    b.squash *= Math.pow(0.0008, dt);

    if (b.state === 'falling')                        stepFalling(b, dt);
    else if (b.state === 'drop1' || b.state === 'drop2') updateDrop(b, dt);
    else if (b.state === 'bowl1' || b.state === 'bowl2') updateOrbit(b, dt);
    else if (b.state === 'hover')                     updateHover(b, dt);
    else if (b.state === 'hole')                      updateHoleDrop(b, dt);

    if (b.dead){
      removeBall(b);
      G.active.splice(i, 1);
    }
  }

  for (const p of P){
    if (p.mesh.userData.hit > 0){
      p.mesh.userData.hit *= Math.pow(0.0005, dt);
      const h = p.mesh.userData.hit;
      p.mesh.material.emissive.setHSL(0.72, 1, 0.4);
      p.mesh.material.emissiveIntensity = h * 1.4;
      p.mesh.scale.setScalar(1 + h * 0.35);
    }
  }

  if (G.phase === 'playing'
      && G.held.length === 0
      && G.active.every(b => b.state === 'settled' || b.state === 'lost' || b.dead)
      && !G._ending){
    G._ending = true;
    setTimeout(finishRound, 900);
  }
}

/* ══════════ MESH SYNC ══════════ */
function syncMeshes(){
  G.held.forEach(b => {
    b.mesh.position.set(b.x, b.y, b.z);
    b.mesh.scale.setScalar(b.scale);
    b.mesh.rotation.y += 0.02;
  });
  G.active.forEach(b => {
    if (b.dead) return;
    if (b.state === 'settled'){ b.mesh.visible = false; return; }
    const sx = 1 + b.squash * 0.22;
    const sy = 1 - b.squash * 0.22;
    const sz = 1 + b.squash * 0.10;
    const sc = b.scale || 1;
    b.mesh.position.set(b.x, b.y, b.z);
    if (b.state === 'hole'){
      b.mesh.scale.setScalar(sc);
    } else {
      b.mesh.scale.set(sx * sc, sy * sc, sz * sc);
    }
    b.mesh.rotation.z = Math.sin(b.spin) * 0.4;
    b.mesh.rotation.x = Math.cos(b.spin * 0.7) * 0.3;
  });
}

/* ══════════ LOOP ══════════ */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 1000, 1/30);
  last = now;
  try {
    update(dt);
    syncMeshes();
    const sx = (Math.random()-.5) * G.shake * 8;
    const sy = (Math.random()-.5) * G.shake * 8;
    renderer.domElement.style.transform = `translate(${sx}px,${sy}px)`;
    renderer.render(scene, camera);
  } catch (e){ console.error(e); }
  requestAnimationFrame(loop);
}

/* ══════════ RESIZE ══════════ */
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  const yTop = 640, yBot = -450;
  const centre = (yTop + yBot)/2;
  const span = (yTop - yBot) * 1.10;
  const fovRad = camera.fov * Math.PI/180;
  const dist = span / (2 * Math.tan(fovRad/2));
  const angle = 18 * Math.PI/180;
  camera.position.set(0, centre + Math.sin(angle) * dist, Math.cos(angle) * dist);
  camera.lookAt(0, centre, 0);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  if (elRoulette.classList.contains('show')) sizeRoulette();
}
window.addEventListener('resize', onResize);

/* ══════════ BUY ══════════ */
let buyTab='random', buyTier='gray';
document.querySelectorAll('.dl-seg button').forEach(b => {
  b.addEventListener('click', () => {
    buyTab = b.dataset.tab;
    document.querySelectorAll('.dl-seg button').forEach(x => x.classList.toggle('on', x===b));
    document.getElementById('dl-pane-random').style.display = buyTab==='random'?'block':'none';
    document.getElementById('dl-pane-tier').style.display   = buyTab==='tier'  ?'block':'none';
  });
});
document.querySelectorAll('.dl-tier').forEach(b => {
  b.addEventListener('click', () => {
    buyTier = b.dataset.tier;
    document.querySelectorAll('.dl-tier').forEach(x => x.classList.toggle('on', x===b));
  });
});
elBuy.addEventListener('click', () => {
  if (G.phase !== 'idle') return;
  elBuyModal.classList.add('show');
});
document.getElementById('dl-buy-cancel').addEventListener('click', ()=>elBuyModal.classList.remove('show'));

document.getElementById('dl-buy-go').addEventListener('click', () => {
  let cost=0, balls=[];
  if (buyTab==='random'){
    cost = Math.max(10, Math.floor(Number(document.getElementById('dl-rand-amt').value)||0));
    if (cost > BALANCE) return flashResult('Oops','Not enough 💎', true);
    const n = Math.max(1, Math.min(10, Math.round(Math.sqrt(cost)/2.4)));
    for (let i=0;i<n;i++){ const v = randomValue(); balls.push({ value:v, tier:tierFor(v) }); }
  } else {
    const qty = Math.max(1, Math.min(20, Math.floor(Number(document.getElementById('dl-tier-qty').value)||1)));
    const price = Number(document.querySelector('.dl-tier.on')?.dataset.price || 10);
    cost = price * qty;
    if (cost > BALANCE) return flashResult('Oops','Not enough 💎', true);
    for (let i=0;i<qty;i++) balls.push({ value:price, tier:buyTier });
  }
  elBuyModal.classList.remove('show');
  BALANCE -= cost;
  updateHud();
  spinAll(balls, () => {
    balls.forEach((b, i) => G.held.push(spawnBall(b.value, b.tier, i * 0.16)));
    G.phase = 'holding';
    updateHud();
  });
});

/* ══════════ ROULETTE ══════════ */
function sizeRoulette(){
  const cv = document.getElementById('dl-r-canvas');
  const stage = cv.parentElement;
  const w = stage.clientWidth, h = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}

function spinAll(balls, done){
  let i = 0;
  const next = () => {
    if (i >= balls.length){ done(); return; }
    spinOne(balls[i++], () => setTimeout(next, 160));
  };
  next();
}

function spinOne(target, done){
  elRoulette.classList.add('show');
  sizeRoulette();
  const cv = document.getElementById('dl-r-canvas');
  const rc = cv.getContext('2d');
  const stage = cv.parentElement;
  const W = stage.clientWidth, H = stage.clientHeight;
  const strip = [];
  for (let i=0;i<40;i++){ const v = randomValue(); strip.push({ value:v, tier:tierFor(v) }); }
  const landIdx = 34;
  strip[landIdx] = { value:target.value, tier:target.tier };
  const itemW = 78;
  const y = H * 0.5;
  const totalShift = landIdx*itemW + itemW*0.5 - W*0.5;
  const DUR = 1.9;                            // longer, dramatic spin
  const startTime = performance.now();        // use REAL time, not assumed 60fps
  let raf;

  function frame(now){
    const elapsed = (now - startTime) / 1000;
    const p = Math.min(elapsed / DUR, 1);
    // Slow ease-out so it decelerates dramatically at the end
    const ease = 1 - Math.pow(1 - p, 4.2);
    const shift = totalShift * ease;
    rc.clearRect(0,0,W,H);

    for (let i=0;i<strip.length;i++){
      const x = i*itemW - shift + W*0.5 - landIdx*itemW + itemW*0.5;
      if (x < -itemW || x > W+itemW) continue;
      const distC = Math.abs(x - W*0.5)/(W*0.5);
      const scale = Math.max(0.68, 1 - distC * 0.28);
      const r = 28 * scale;
      drawRouletteBall(rc, x, y, r, strip[i].value, strip[i].tier);
      rc.save();
      rc.fillStyle = `rgba(255,255,255,${0.55 + scale * 0.45})`;
      rc.font = `800 ${Math.max(10, 13*scale)}px system-ui,sans-serif`;
      rc.textAlign = 'center';
      rc.textBaseline = 'top';
      rc.fillText('💎' + strip[i].value, x, y + r + 8);
      rc.restore();
    }
    // Minimal edge fade so balls never appear to vanish
    const lf = rc.createLinearGradient(0,0,W*0.06,0);
    lf.addColorStop(0,'rgba(6,6,11,0.9)'); lf.addColorStop(1,'rgba(6,6,11,0)');
    rc.fillStyle = lf; rc.fillRect(0,0,W*0.06,H);
    const rf = rc.createLinearGradient(W,0,W*0.94,0);
    rf.addColorStop(0,'rgba(6,6,11,0.9)'); rf.addColorStop(1,'rgba(6,6,11,0)');
    rc.fillStyle = rf; rc.fillRect(W*0.94,0,W*0.06,H);

    if (p >= 1){
      cancelAnimationFrame(raf);
      setTimeout(() => { elRoulette.classList.remove('show'); done(); }, 380);
      return;
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

function drawRouletteBall(c, x, y, r, value, tier){
  const cfg = TIER_MAT[tier] || TIER_MAT.gray;
  const baseCol = new THREE.Color(cfg.color);
  const hiCol = baseCol.clone().lerp(new THREE.Color(0xffffff), 0.85);
  const loCol = baseCol.clone().lerp(new THREE.Color(0x000000), 0.75);

  c.save();
  c.fillStyle = 'rgba(0,0,0,0.55)';
  c.beginPath();
  c.ellipse(x, y + r*0.98, r*0.85, r*0.22, 0, 0, Math.PI*2);
  c.fill();
  c.restore();

  const g = c.createRadialGradient(x - r*0.38, y - r*0.42, r*0.05, x, y, r);
  g.addColorStop(0, '#' + hiCol.getHexString());
  g.addColorStop(0.5, '#' + baseCol.getHexString());
  g.addColorStop(1, '#' + loCol.getHexString());
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();

  c.strokeStyle = 'rgba(0,0,0,0.35)';
  c.lineWidth = Math.max(0.8, r*0.09);
  c.beginPath(); c.arc(x, y, r*0.94, 0, Math.PI*2); c.stroke();

  const sg = c.createRadialGradient(x - r*0.42, y - r*0.48, 0, x - r*0.42, y - r*0.48, r*0.6);
  sg.addColorStop(0, 'rgba(255,255,255,0.95)');
  sg.addColorStop(0.45, 'rgba(255,255,255,0.35)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = sg;
  c.beginPath(); c.arc(x - r*0.42, y - r*0.48, r*0.6, 0, Math.PI*2); c.fill();

  c.fillStyle = 'rgba(255,255,255,0.9)';
  c.beginPath();
  c.arc(x - r*0.35, y - r*0.45, Math.max(1.6, r*0.09), 0, Math.PI*2);
  c.fill();

  if (r >= 10){
    c.font = `900 ${Math.max(10, r*0.72)}px system-ui,sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(0,0,0,0.45)';
    c.fillText(String(value), x + 1, y + 1.4);
    c.fillStyle = tier === 'gold' ? '#2a1400' : (tier === 'green' ? '#042a18' : '#0a0a14');
    c.fillText(String(value), x, y + 0.3);
  }
}

/* ══════════ LAUNCH ══════════ */
elLaunch.addEventListener('click', () => {
  if (G.phase !== 'holding' || G.held.length===0) return;
  G.phase = 'launching';
  G.launchT = 0;
  G.launchOpen = 0;
  G.releaseTimer = 0;
  setSpinnerGap(0);
  elLaunch.disabled = true;
  haptic();
});

/* ══════════ FINISH ══════════ */
function finishRound(){
  let total = 0, won = 0, lost = 0;
  for (const r of G.results){
    total += r.value * r.mult;
    if (r.mult === 0) lost++; else won++;
  }
  const winnings = Math.floor(total);
  BALANCE += winnings;
  updateHud();
  flashResult(
    winnings > 0 ? 'Round Results' : 'Round Over',
    (winnings>0?'+':'') + winnings + ' 💎',
    false,
    `${won} won · ${lost} lost`
  );
}
document.getElementById('dl-res-ok').addEventListener('click', () => {
  elResult.classList.remove('show');
  G.active.forEach(removeBall);
  G.active = []; G.held.forEach(removeBall); G.held = [];
  G.results = [];
  G.launchT = 0; G.launchOpen = 0; G._ending = false;
  G.phase = 'idle';
  setSpinnerGap(0);
  updateHud();
});
function flashResult(tag, amt, isLose, sub){
  elResTag.textContent = tag;
  elResAmt.textContent = amt;
  elResAmt.classList.toggle('lose', !!isLose);
  elResSub.textContent = sub || '';
  elResult.classList.add('show');
}

/* ══════════ CLOSE ══════════ */
document.getElementById('dl-close').addEventListener('click', () => {
  try {
    if (window.__state){
      window.__state.balance = BALANCE;
      window.__state.updateBalance?.();
    }
  } catch(_){}
  window.dispatchEvent(new CustomEvent('dlballs-close'));
});

/* ══════════ BOOT ══════════ */
onResize();
setSpinnerGap(0);
updateHud();
requestAnimationFrame(loop);
</script>
