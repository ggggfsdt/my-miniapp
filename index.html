<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Arena Puck Test</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: system-ui, sans-serif;
    }

    .arena {
      position: relative;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle at center, #222 0, #000 70%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }

    .puck {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      /* diagonal orange/blue background like your image */
      background: linear-gradient(135deg, #ff8a00 0%, #ff8a00 50%, #007bff 50%, #007bff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      cursor: grab;
      user-select: none;
    }

    .puck:active {
      cursor: grabbing;
    }

    .crosshair {
      position: relative;
      width: 60%;
      height: 60%;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
    }

    /* vertical line */
    .crosshair::before {
      width: 18%;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }

    /* horizontal line */
    .crosshair::after {
      width: 100%;
      height: 18%;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <div class="arena" id="arena">
    <div class="puck" id="puck">
      <div class="crosshair"></div>
    </div>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const puck = document.getElementById('puck');

    // start puck in center
    function centerPuck() {
      const rect = arena.getBoundingClientRect();
      const puckRect = puck.getBoundingClientRect();
      puck.style.left = (rect.width / 2 - puckRect.width / 2) + 'px';
      puck.style.top = (rect.height / 2 - puckRect.height / 2) + 'px';
    }
    centerPuck();

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    puck.addEventListener('mousedown', (e) => {
      dragging = true;
      const puckRect = puck.getBoundingClientRect();
      offsetX = e.clientX - puckRect.left;
      offsetY = e.clientY - puckRect.top;
    });

    document.addEventListener('mouseup', () => {
      dragging = false;
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;

      const arenaRect = arena.getBoundingClientRect();
      const puckRect = puck.getBoundingClientRect();

      let x = e.clientX - arenaRect.left - offsetX;
      let y = e.clientY - arenaRect.top - offsetY;

      // clamp inside arena
      x = Math.max(0, Math.min(arenaRect.width - puckRect.width, x));
      y = Math.max(0, Math.min(arenaRect.height - puckRect.height, y));

      puck.style.left = x + 'px';
      puck.style.top = y + 'px';
    });

    // touch support
    puck.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      dragging = true;
      const puckRect = puck.getBoundingClientRect();
      offsetX = touch.clientX - puckRect.left;
      offsetY = touch.clientY - puckRect.top;
    });

    document.addEventListener('touchend', () => {
      dragging = false;
    });

    document.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const touch = e.touches[0];

      const arenaRect = arena.getBoundingClientRect();
      const puckRect = puck.getBoundingClientRect();

      let x = touch.clientX - arenaRect.left - offsetX;
      let y = touch.clientY - arenaRect.top - offsetY;

      x = Math.max(0, Math.min(arenaRect.width - puckRect.width, x));
      y = Math.max(0, Math.min(arenaRect.height - puckRect.height, y));

      puck.style.left = x + 'px';
      puck.style.top = y + 'px';
    });
  </script>
</body>
</html>
