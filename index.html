<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Orbit · Your circle, in sync</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#07090d;--bg-2:#0d1117;
  --surface:rgba(255,255,255,.045);--surface-2:rgba(255,255,255,.08);--surface-3:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.12);
  --accent:#5b9dff;--accent-2:#8ecae6;--accent-glow:rgba(91,157,255,.45);
  --green:#4ade80;--red:#f87171;--gold:#fbbf24;--purple:#a78bfa;--pink:#f472b6;
  --text:#fff;--text-2:rgba(255,255,255,.62);--text-3:rgba(255,255,255,.35);
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;
  --ease:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
.em{display:inline-block;object-fit:contain;vertical-align:-.15em;pointer-events:none}

/* ============ LOADER ============ */
#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;
  background:radial-gradient(ellipse at center,#0d1117 0%,#050608 100%);transition:opacity .6s,visibility .6s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
#loader-grid{width:230px;height:230px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;position:relative}
.l-sq{background:rgba(255,255,255,.05);border-radius:16px;display:flex;align-items:center;justify-content:center;
  transform:scale(0) rotate(-8deg);opacity:0;transition:all .6s var(--ease);border:1px solid rgba(255,255,255,.06);
  box-shadow:0 4px 20px rgba(0,0,0,.5)}
.l-sq.in{transform:scale(1) rotate(0deg);opacity:1}
.l-sq.merge{transform:scale(.35) translate(0,0);opacity:0}
#loader-logo{font-size:36px;font-weight:800;letter-spacing:-1.5px;opacity:0;transform:scale(.5);
  background:linear-gradient(135deg,#5b9dff 0%,#8ecae6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:all .7s var(--ease);text-shadow:0 0 40px rgba(91,157,255,.3)}
#loader-logo.in{opacity:1;transform:scale(1)}
#loader-tag{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);
  opacity:0;transition:opacity .5s .3s}
#loader-tag.in{opacity:1}

/* ============ APP ============ */
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;
  background:radial-gradient(ellipse at 30% -10%,rgba(91,157,255,.08),transparent 60%),
             radial-gradient(ellipse at 80% 110%,rgba(167,139,250,.06),transparent 60%),var(--bg)}

/* ============ HEADER ============ */
#header{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 8px) 14px 8px;z-index:100;
  background:linear-gradient(180deg,rgba(7,9,13,.95),rgba(7,9,13,.4) 70%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.h-left{display:flex;align-items:center;gap:10px;min-width:0}
.h-av{position:relative;width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--surface-2)}
.h-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.h-av .dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--green);
  border:2px solid var(--bg);box-shadow:0 0 10px rgba(74,222,128,.7);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.75}}
.h-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.h-name{font-size:13.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-sub{font-size:10.5px;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px}
.h-brand span{font-size:15px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 0 20px rgba(91,157,255,.4)}
.h-right{display:flex;align-items:center;gap:8px}
.h-pill{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:800;cursor:pointer;
  transition:transform .15s var(--ease)}
.h-pill:active{transform:scale(.94)}
.h-pill .val{color:var(--gold)}

/* ============ MAIN ============ */
#main{position:absolute;inset:0;padding-top:calc(var(--safe-t) + 60px);padding-bottom:calc(var(--safe-b) + 82px);overflow:hidden}
.tab-page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 14px 20px;opacity:0;visibility:hidden;transform:translateX(24px);
  transition:opacity .3s,transform .4s var(--ease),visibility .3s}
.tab-page::-webkit-scrollbar{width:0;display:none}
.tab-page.active{opacity:1;visibility:visible;transform:translateX(0)}
.tab-page.exit{opacity:0;transform:translateX(-24px)}

/* ============ TABS ============ */
#tabs{position:absolute;bottom:0;left:0;right:0;padding:8px 10px calc(var(--safe-b) + 8px);z-index:100}
#tabs-inner{display:flex;align-items:center;background:rgba(20,24,32,.85);
  border:1px solid var(--border);border-radius:22px;padding:6px;height:58px;position:relative;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
#tab-indicator{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);
  background:linear-gradient(180deg,rgba(91,157,255,.22),rgba(91,157,255,.1));
  border:1px solid rgba(91,157,255,.35);border-radius:16px;
  transition:transform .42s var(--ease);z-index:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 20px rgba(91,157,255,.2)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;color:var(--text-3);padding:6px 4px;cursor:pointer;position:relative;z-index:2;
  font-family:inherit;transition:color .25s;height:100%}
.tab-btn.active{color:#fff}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s var(--ease)}
.tab-btn.active svg{transform:translateY(-1px) scale(1.08)}
.tab-btn .lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}

/* ============ COMMON ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;
  animation:fadeUp .5s var(--ease) both;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}.card:nth-child(4){animation-delay:.2s}
.card:nth-child(5){animation-delay:.25s}.card:nth-child(6){animation-delay:.3s}
.title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent)}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.5}

.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-size:14px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:transform .15s var(--ease),background .2s,box-shadow .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#5b9dff,#4a86e8);color:#fff;
  box-shadow:0 6px 20px rgba(91,157,255,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border-2)}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1000;
  box-shadow:0 6px 20px rgba(251,191,36,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:12px;border:1px solid var(--border)}
.seg button{flex:1;background:transparent;border:0;color:var(--text-3);font-family:inherit;font-size:12.5px;
  font-weight:800;padding:8px 4px;border-radius:10px;cursor:pointer;transition:all .25s var(--ease)}
.seg button.on{background:rgba(91,157,255,.18);color:var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 8px rgba(91,157,255,.15)}

/* ============ CIRCLE (Friends) ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);border-radius:14px;padding:11px 6px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(91,157,255,.4),transparent)}
.stat .v{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1}
.stat .v.accent{color:var(--accent)}.stat .v.green{color:var(--green)}
.stat .l{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-top:4px}

.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:11px 14px 11px 38px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border .2s}
.search input:focus{border-color:rgba(91,157,255,.5)}
.search input::placeholder{color:var(--text-3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round}

.actions{display:flex;gap:8px;margin-bottom:12px}
.actions .btn{flex:1;padding:10px 12px;font-size:12.5px}
.actions .icon-btn{flex:0 0 44px;padding:10px}

.friend-list{display:flex;flex-direction:column;gap:2px}
.friend{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:14px;
  transition:background .15s;position:relative;animation:fadeUp .4s var(--ease) both}
.friend:active{background:var(--surface)}
.friend+.friend::before{content:'';position:absolute;top:0;left:57px;right:8px;height:1px;background:rgba(255,255,255,.04)}
.f-av{position:relative;width:44px;height:44px;flex-shrink:0}
.f-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface-2);display:block}
.f-av .on{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg);box-shadow:0 0 8px var(--green)}
.f-av .off{background:var(--text-3);box-shadow:none}
.f-info{flex:1;min-width:0}
.f-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.f-handle{font-size:11.5px;color:var(--text-3);font-weight:500;margin-left:4px}
.f-prev{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.f-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.f-count{font-size:10.5px;font-weight:700;color:var(--text-3)}
.f-add{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:99px;
  padding:6px 11px;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;
  transition:all .18s var(--ease);white-space:nowrap}
.f-add:active{transform:scale(.94);background:rgba(91,157,255,.15)}
.f-added{color:var(--green);font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:3px;white-space:nowrap}
.f-time{font-size:10px;color:var(--text-3);font-weight:600}

/* ============ NOVA (Pet) ============ */
.nova-card{background:radial-gradient(ellipse at 50% 0%,rgba(91,157,255,.18),rgba(13,17,23,.95) 70%),
  var(--surface);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:20px 16px;text-align:center;
  position:relative;overflow:hidden;margin-bottom:12px}
.nova-card::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(167,139,250,.08),transparent 50%),
             radial-gradient(circle at 70% 80%,rgba(91,157,255,.08),transparent 50%);pointer-events:none}
.nova-em{position:relative;display:inline-block;margin-bottom:8px;animation:novaBob 3s ease-in-out infinite}
@keyframes novaBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.nova-em::before{content:'';position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,157,255,.3),transparent 70%);filter:blur(15px);z-index:-1;
  animation:novaGlow 3s ease-in-out infinite}
@keyframes novaGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.nova-name{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px;position:relative;z-index:1}
.nova-lvl{font-size:11.5px;color:var(--text-3);font-weight:700;letter-spacing:.5px;margin-bottom:16px;position:relative;z-index:1}
.nova-bars{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;position:relative;z-index:1}
.nbar{text-align:left}
.nbar-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.nbar-head .v{color:var(--text);font-variant-numeric:tabular-nums}
.nbar-track{height:8px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden;position:relative;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.nbar-fill{height:100%;border-radius:99px;transition:width .7s var(--ease);position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.nbar-fill::after{content:'';position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  animation:nbarShine 2s linear infinite;background-size:200% 100%}
@keyframes nbarShine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.nova-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.nova-actions .btn{padding:11px 4px;font-size:12px;flex-direction:column;gap:4px;min-height:64px}

.care-log{display:flex;flex-direction:column}
.care-item{display:flex;align-items:center;gap:10px;padding:8px 4px}
.care-item+.care-item{border-top:1px solid rgba(255,255,255,.05)}
.care-item .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:var(--surface-2);
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.care-item .av img{width:100%;height:100%;object-fit:cover}
.care-info{flex:1;min-width:0}
.care-name{font-size:12.5px;font-weight:700}
.care-text{font-size:11px;color:var(--text-3);margin-top:1px}

/* ============ SHOTS (Photos) ============ */
.challenge{background:linear-gradient(135deg,rgba(91,157,255,.15),rgba(167,139,250,.1));
  border:1px solid rgba(91,157,255,.3);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden;animation:fadeUp .5s var(--ease) both}
.challenge::before{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;
  background:radial-gradient(circle,rgba(91,157,255,.3),transparent 70%);filter:blur(30px);pointer-events:none}
.challenge-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);
  background:rgba(91,157,255,.15);border:1px solid rgba(91,157,255,.3);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.challenge-title{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;position:relative;z-index:1}
.challenge-sub{font-size:12px;color:var(--text-2);margin-bottom:14px;position:relative;z-index:1}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photo-tile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;padding:8px;
  transition:transform .15s var(--ease);animation:photoIn .5s var(--ease) both}
.photo-tile:active{transform:scale(.94)}
@keyframes photoIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.photo-tile .emwrap{flex:1;display:grid;place-items:center}
.photo-tile .by{font-size:9.5px;font-weight:800;text-align:right;text-shadow:0 1px 4px rgba(0,0,0,.7);color:#fff;position:relative;z-index:1}
.photo-tile .votes{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border-radius:99px;
  padding:2px 7px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:3px;
  backdrop-filter:blur(8px)}
.photo-tile.voted .votes{background:rgba(244,114,182,.4)}
.photo-tile .cam{position:absolute;top:6px;left:6px;font-size:14px;opacity:.85}

.frames-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.frames-scroll::-webkit-scrollbar{display:none}
.frame-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:0;color:var(--text-3);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;
  transition:color .2s}
.frame-btn.on{color:var(--accent)}
.frame-circle{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#5b9dff,#4a86e8);
  display:grid;place-items:center;font-size:18px;font-weight:800;color:#fff;
  position:relative;transition:box-shadow .25s,transform .15s var(--ease)}
.frame-btn:active .frame-circle{transform:scale(.92)}
.frame-btn.on .frame-circle{box-shadow:0 0 0 2.5px #07090d,0 0 0 4.5px var(--accent),0 0 20px rgba(91,157,255,.5)}
.frame-circle .badge{position:absolute;bottom:-3px;right:-3px;font-size:14px}

/* ============ ECHO (Anonymous) ============ */
.echo-friends{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.echo-friends::-webkit-scrollbar{display:none}
.echo-pick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:0;color:var(--text-3);font-family:inherit;font-size:10.5px;font-weight:700;
  cursor:pointer;transition:color .2s;width:60px}
.echo-pick .av{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  position:relative;transition:box-shadow .25s,transform .15s var(--ease)}
.echo-pick .av img{width:100%;height:100%;object-fit:cover}
.echo-pick:active .av{transform:scale(.92)}
.echo-pick.on{color:var(--accent)}
.echo-pick.on .av{box-shadow:0 0 0 2.5px #07090d,0 0 0 4.5px var(--accent),0 0 20px rgba(91,157,255,.5)}
.echo-pick .nm{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
.echo-pick .av::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.3))}

.echo-composer textarea{width:100%;min-height:80px;resize:none;background:var(--bg);border:1px solid var(--border-2);
  border-radius:12px;padding:12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;
  transition:border .2s}
.echo-composer textarea:focus{border-color:rgba(91,157,255,.5)}
.echo-composer textarea::placeholder{color:var(--text-3)}

.echo-inbox{display:flex;flex-direction:column;gap:10px}
.echo-msg{background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(167,139,250,.02));
  border:1px solid rgba(167,139,250,.2);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.echo-msg::before{content:'';position:absolute;top:-30%;right:-10%;width:100px;height:100px;

.event-icon{width:52px;height:52px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);opacity:0;

/* ============ TOAST ============ */

<script>

(function(){

const EMOJI_CDN = 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.0.1/img/apple/64/';
function E(char, size){
  size = size || 18;
  let code = '';
  for (const c of char){
    if (code) code += '-';
    code += c.codePointAt(0).toString(16).padStart(4, '0');
  }
  return `<img class="em" src="${EMOJI_CDN}${code}.png" style="width:${size}px;height:${size}px" alt="${char}" draggable="false">`;
}

/* ---------- Haptics ---------- */

function haptic(type){

/* ---------- Helpers ---------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
function avatarUrl(p){ return `https://i.pravatar.cc/150?img=${p}`; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts){
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  const d = Math.floor(h / 24);
  return d + 'd';
}
function barColor(v){ return v > 65 ? '#4ade80' : v > 35 ? '#fbbf24' : '#f87171'; }

/* ---------- Persistence ---------- */
function save(){
  try {
    const data = {
      friends: [...state.friends],
      nova: state.nova,
      frame: state.frame,
      myPhoto: state.myPhoto,
      votes: [...state.votes],
      echoSent: state.echoSent,
      echoOpened: [...state.echoOpened],
      balance: state.balance
    };
    localStorage.setItem(STORAGE, JSON.stringify(data));
  } catch(_) {}
}
function load(){
  try {
    const raw = localStorage.getItem(STORAGE);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.friends) state.friends = new Set(d.friends);
    if (d.nova) state.nova = { ...state.nova, ...d.nova };
    if (d.frame) state.frame = d.frame;
    if (d.myPhoto) state.myPhoto = d.myPhoto;
    if (d.votes) state.votes = new Set(d.votes);
    if (d.echoSent) state.echoSent = d.echoSent;
    if (d.echoOpened) state.echoOpened = new Set(d.echoOpened);
    if (typeof d.balance === 'number') state.balance = d.balance;
  } catch(_) {}
}

function initUser(){

}

/* ---------- TOAST ---------- */
let toastId = 0;
function toast(text, type, icon){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type !== 'info' ? type : '');
  el.id = 'toast_' + (++toastId);
  const iconHtml = type === 'success' ? E('✅', 18) : type === 'error' ? E('⚠️', 18) : (icon || E('✨', 18));
  el.innerHTML = `<div class="ti">${iconHtml}</div><div class="tm">${escapeHtml(text)}</div>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  }, 2800);
  haptic('light');
}

/* ---------- MODAL ---------- */
function showModal(title, text, okText, onOk, cancelText){
  const back = $('#modal-back');
  const modal = $('#modal');
  modal.innerHTML = `
    <div class="modal-title">${escapeHtml(title)}</div>
    <div class="modal-text">${text}</div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">${escapeHtml(cancelText || 'Cancel')}</button>
      <button class="btn primary" id="modal-ok">${escapeHtml(okText || 'OK')}</button>
    </div>`;
  back.classList.add('show');
  modal.classList.add('show');
  $('#modal-cancel').onclick = () => { hideModal(); };
  $('#modal-ok').onclick = () => { hideModal(); if (onOk) onOk(); };
  haptic('medium');
}
function hideModal(){
  $('#modal-back').classList.remove('show');

}

  const emojis = ['🚀','🌟','🛸','🪐','🌙','✨','⭐','💫','🌠'];

  emojis.forEach((em, i) => {
    const sq = document.createElement('div');
    sq.className = 'l-sq';
    sq.innerHTML = E(em, 28);
    grid.appendChild(sq);
  });

  const squares = Array.from(grid.children);
  squares.forEach((sq, i) => {
    setTimeout(() => sq.classList.add('in'), 80 + i * 70);
  });

  setTimeout(() => {
    squares.forEach((sq, i) => {
      setTimeout(() => sq.classList.add('merge'), i * 40);
    });
  }, 1100);

  setTimeout(() => {
    logo.classList.add('in');
    tag.classList.add('in');
  }, 1450);

  setTimeout(() => {
    loader.classList.add('out');
    setTimeout(() => {

  }, 2400);

    </div>`;

  renderFriendList();

  // wiring
  $$('.seg button[data-filter]').forEach(b => {
    b.addEventListener('click', () => {
      state.filter = b.dataset.filter;
      renderCircle();
      haptic('light');
    });
  });
  $('#search-input')?.addEventListener('input', e => {
    state.search = e.target.value;
    renderFriendList();
  });
  $('#add-all-btn')?.addEventListener('click', addAll);
  $('#add-random-btn')?.addEventListener('click', addRandom);
}

function getAddable(){
  return CONTACTS.filter(c => {
    const passFilter = state.filter === 'chatted' ? c.msgs > 0 : true;
    return passFilter && !state.friends.has(c.id);
  });

function renderFriendList(){
  const list = $('#friend-list');
  if (!list) return;
  const q = state.search.trim().toLowerCase();
  const visible = CONTACTS
    .filter(c => state.filter === 'chatted' ? c.msgs > 0 : true)
    .filter(c => !q || c.name.toLowerCase().includes(q) || c.username.toLowerCase().includes(q));

  if (!visible.length){
    list.innerHTML = `<div class="empty"><div class="ico">${E('🔍', 40)}</div><p>No one matches your search</p></div>`;
    return;
  }

  list.innerHTML = visible.map((c, i) => {
    const added = state.friends.has(c.id);
    const photo = avatarUrl(c.photo);
    const prev = c.msgs > 0
      ? escapeHtml(c.prev || 'You: ok') + ' · ' + c.msgs + ' msgs'
      : 'No messages yet';
    const time = timeAgo(c.last);
    return `
      <div class="friend" style="animation-delay:${i * 22}ms">
        <div class="f-av">
          <img src="${photo}" alt="" onerror="this.style.background='#232e3c'">
          <span class="${c.online ? 'on' : 'off'}" style="position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;border:2px solid #07090d;${c.online ? 'background:#4ade80;box-shadow:0 0 8px #4ade80' : 'background:rgba(255,255,255,.3)'}"></span>
        </div>
        <div class="f-info">
          <div class="f-name">${escapeHtml(c.name)}<span class="f-handle">@${escapeHtml(c.username)}</span></div>
          <div class="f-prev">${prev}</div>
        </div>
        <div class="f-meta">
          ${time ? `<div class="f-time">${time}</div>` : ''}
          ${added
            ? `<span class="f-added">${E('✅', 13)} Added</span>`
            : `<button class="f-add" data-add="${c.id}">Add</button>`}
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', () => addFriend(+b.dataset.add));
  });
}

function addFriend(id){
  if (state.friends.has(id)) return;
  state.friends.add(id);
  save();
  haptic('medium');
  const c = CONTACTS.find(x => x.id === id);
  toast((c ? c.name.split(' ')[0] : 'Friend') + ' added to Orbit ✨', 'success');
  renderCircle();
  updateHeaderBadge();
  if (state.tab === 'echo') renderEcho();
}
function addAll(){
  const addable = getAddable();
  if (!addable.length){ toast('Already added everyone', 'info'); return; }
  addable.forEach(c => state.friends.add(c.id));
  save();
  haptic('heavy');
  toast(`Added ${addable.length} friends to Orbit ✨`, 'success');
  renderCircle();
  updateHeaderBadge();
}
function addRandom(){
  const addable = getAddable();
  if (!addable.length){ toast('Already added everyone', 'info'); return; }
  const pick = addable[Math.floor(Math.random() * addable.length)];
  addFriend(pick.id);
}
function updateHeaderBadge(){
  // optionally re-render
}

/* ==================================================================
   RENDER: NOVA
   ================================================================== */
function renderNova(){
  const page = $('#page-nova');
  const n = state.nova;
  const friendsInOrbit = state.friends.size;

  page.innerHTML = `
    <div class="nova-card">
      <div class="nova-em">${E('🦊', 84)}</div>
      <div class="nova-name">${escapeHtml(n.name)}</div>
      <div class="nova-lvl">Level ${n.level} · ${friendsInOrbit} friends in orbit</div>

      <div class="nova-bars">
        ${renderBar('Food', '🍖', n.food, '#4ade80')}
        ${renderBar('Mood', '💚', n.happy, '#fbbf24')}
        ${renderBar('Energy', '⚡', n.energy, '#5b9dff')}
      </div>

      <div class="nova-actions">
        <button class="btn primary" data-care="feed">${E('🍖', 20)}<span>Feed</span></button>
        <button class="btn ghost" data-care="play">${E('🎾', 20)}<span>Play</span></button>
        <button class="btn ghost" data-care="sleep">${E('💤', 20)}<span>Sleep</span></button>
      </div>
    </div>

    <div class="card">
      <div class="title">Care log</div>
      <div class="care-log" id="care-log"></div>
    </div>

    <div class="card" style="background:linear-gradient(135deg,rgba(91,157,255,.1),rgba(167,139,250,.05));border-color:rgba(91,157,255,.25)">
      <div class="title" style="margin-bottom:8px">Grow together</div>
      <div class="hint" style="margin-bottom:12px">The more friends you add to Orbit, the more they can help care for ${escapeHtml(n.name)}. Every friend you add will occasionally feed or play with Nova.</div>
      <button class="btn gold full" id="nova-invite-btn">${E('✉️', 16)} Invite friends to feed Nova</button>
    </div>`;

  renderCareLog();

  page.querySelectorAll('[data-care]').forEach(b => {
    b.addEventListener('click', () => care(b.dataset.care));
  });
  $('#nova-invite-btn')?.addEventListener('click', () => {
    if (tg?.openTelegramLink){
      toast('Share link copied', 'success');
    } else {
      toast('Invite sent to your orbit ✨', 'success');
    }
    haptic('medium');
  });
}

function renderBar(label, emoji, value, color){
  return `
    <div class="nbar">
      <div class="nbar-head">
        <span>${E(emoji, 13)} ${label}</span>
        <span class="v">${Math.round(value)}%</span>
      </div>
      <div class="nbar-track">
        <div class="nbar-fill" style="width:${value}%;background:linear-gradient(90deg,${color}aa,${color})"></div>
      </div>
    </div>`;
}

const CARE_LOG = [];
function renderCareLog(){
  const el = $('#care-log');
  if (!el) return;
  if (!CARE_LOG.length){
    // seed with friend helpers if any
    const friendIds = [...state.friends].slice(0, 3);
    friendIds.forEach(id => {
      const c = CONTACTS.find(x => x.id === id);
      if (c) CARE_LOG.push({
        name: c.name.split(' ')[0],
        photo: avatarUrl(c.photo),
        text: ['fed Nova 🍖', 'played with Nova 🎾', 'put Nova to sleep 💤'][Math.floor(Math.random() * 3)],
        t: Math.floor(Math.random() * 20) + 1
      });
    });
  }
  if (!CARE_LOG.length){
    el.innerHTML = `<div class="hint">Nobody has helped yet. Add friends so they can join!</div>`;
    return;
  }
  el.innerHTML = CARE_LOG.slice(0, 6).map(l => `
    <div class="care-item">
      <div class="av"><img src="${l.photo}" alt="" onerror="this.style.display='none'"></div>
      <div class="care-info">
        <div class="care-name">${escapeHtml(l.name)}</div>
        <div class="care-text">${escapeHtml(l.text)} · ${l.t}m ago</div>
      </div>
    </div>`).join('');
}

function care(kind){
  const n = state.nova;
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));

  if (kind === 'feed'){
    n.food = clamp(n.food + 18);
    n.energy = clamp(n.energy - 5);
    CARE_LOG.unshift({ name: 'You', photo: state.user.photo || avatarUrl(12), text: 'fed Nova 🍖', t: 0 });
  } else if (kind === 'play'){
    n.happy = clamp(n.happy + 16);
    n.energy = clamp(n.energy - 12);
    n.food = clamp(n.food - 5);
    CARE_LOG.unshift({ name: 'You', photo: state.user.photo || avatarUrl(12), text: 'played with Nova 🎾', t: 0 });
  } else if (kind === 'sleep'){
    n.energy = clamp(n.energy + 22);
    n.food = clamp(n.food - 4);
    CARE_LOG.unshift({ name: 'You', photo: state.user.photo || avatarUrl(12), text: 'put Nova to sleep 💤', t: 0 });
  }

  // random friend helper
  if (state.friends.size && Math.random() < 0.5){
    const fids = [...state.friends];
    const pick = CONTACTS.find(x => x.id === fids[Math.floor(Math.random() * fids.length)]);
    if (pick){
      n.happy = clamp(n.happy + 4);
      CARE_LOG.unshift({ name: pick.name.split(' ')[0], photo: avatarUrl(pick.photo), text: 'helped Nova too', t: 0 });
    }
  }

  if ((n.food + n.happy + n.energy) / 3 > 78){
    n.level++;
    n.food = n.happy = n.energy = 60;
    toast(`Nova leveled up! Now level ${n.level} 🎉`, 'success');
    haptic('heavy');
  } else {
    haptic('light');
  }

  save();
  renderNova();
}

/* ==================================================================
   RENDER: SHOTS
   ================================================================== */
function renderShots(){
  const page = $('#page-shots');
  const myFrame = FRAMES.find(f => f.id === state.frame) || FRAMES[0];
  const initial = state.user.name.charAt(0).toUpperCase();

  page.innerHTML = `
    <div class="challenge">
      <span class="challenge-tag">${E('🔥', 12)} Today's challenge</span>
      <div class="challenge-title">"My desk setup"</div>
      <div class="challenge-sub">Ends in 6h 12m · ${PHOTO_DATA.length + (state.myPhoto ? 1 : 0)} people joined</div>
      <button class="btn primary full" id="join-challenge">${state.myPhoto ? '📸 You\'re in' : '📸 Join the challenge'}</button>
    </div>

    <div class="card" style="padding:12px 14px">
      <div class="title">Frame your avatar</div>
      <div class="frames-scroll" id="frames-scroll"></div>
      <div class="hint" style="margin-top:6px">Changes your profile picture frame across the app.</div>
    </div>

    <div class="card">
      <div class="title">Community feed</div>
      <div class="photo-grid" id="photo-grid"></div>
      <div class="hint">Tap a photo to vote ❤️</div>
    </div>`;

  // frames
  const fr = $('#frames-scroll');
  FRAMES.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'frame-btn' + (state.frame === f.id ? ' on' : '');
    btn.dataset.frame = f.id;
    const bg = f.id === 'none' ? 'linear-gradient(135deg,#5b9dff,#4a86e8)' : f.color;
    btn.innerHTML = `
      <div class="frame-circle" style="background:${bg}">
        ${initial}${f.emoji ? `<span class="badge">${E(f.emoji, 14)}</span>` : ''}
      </div>
      <span>${f.id === 'none' ? 'Default' : f.emoji}</span>`;
    btn.addEventListener('click', () => {
      state.frame = f.id;
      save();
      haptic('medium');
      renderShots();
      toast('Frame applied ✨', 'success');
    });
    fr.appendChild(btn);
  });

  renderPhotoGrid();

  $('#join-challenge')?.addEventListener('click', () => {
    if (state.myPhoto){ toast('You are already participating', 'info'); return; }
    state.myPhoto = true;
    save();
    haptic('heavy');
    toast('Your photo joined the challenge 📸', 'success');
    renderShots();
  });
}

function renderPhotoGrid(){
  const grid = $('#photo-grid');
  if (!grid) return;
  const all = [...PHOTO_DATA];
  if (state.myPhoto) all.push({ id: 99, emoji: '😎', by: 'You', photo: null, votes: 0, mine: true });

  const grads = ['g1','g2','g3','g4','g5','g6'];
  const gradColors = {
    g1:'linear-gradient(135deg,#ff9a6b,#ff5e8a)',
    g2:'linear-gradient(135deg,#5ec6ff,#7b6bff)',
    g3:'linear-gradient(135deg,#6ef2a8,#2ec5c5)',
    g4:'linear-gradient(135deg,#ffd36b,#ff8f4d)',
    g5:'linear-gradient(135deg,#ff9fe0,#b48bff)',
    g6:'linear-gradient(135deg,#8fa3b8,#4b6076)'
  };

  grid.innerHTML = all.map((p, i) => {
    const voted = state.votes.has(p.id);
    const grad = p.mine ? 'linear-gradient(135deg,#5b9dff,#4a86e8)' : gradColors[grads[i % grads.length]];
    return `
      <div class="photo-tile ${voted ? 'voted' : ''}" data-photo="${p.id}" style="background:${grad};animation-delay:${i * 40}ms">
        <div class="votes">${E('❤️', 11)} ${p.votes}</div>
        <div class="emwrap">${E(p.emoji, 32)}</div>
        <div class="by">${escapeHtml(p.by)}</div>
      </div>`;
  }).join('');

  grid.querySelectorAll('[data-photo]').forEach(el => {
    el.addEventListener('click', () => {
      const id = +el.dataset.photo;
      if (id === 99){ toast('Can\'t vote for yourself 🙂', 'info'); return; }
      if (state.votes.has(id)){ toast('Already voted', 'info'); return; }
      state.votes.add(id);
      const p = PHOTO_DATA.find(x => x.id === id);
      if (p) p.votes++;
      save();
      haptic('medium');
      renderPhotoGrid();
    });
  });
}

/* ==================================================================
   RENDER: ECHO
   ================================================================== */
function renderEcho(){
  const page = $('#page-echo');
  const friends = [...state.friends].map(id => CONTACTS.find(c => c.id === id)).filter(Boolean);

  const chips = friends.length
    ? friends.map(c => `
      <button class="echo-pick ${state.echoTo === c.id ? 'on' : ''}" data-echo="${c.id}">
        <div class="av"><img src="${avatarUrl(c.photo)}" alt=""></div>
        <span class="nm">${escapeHtml(c.name.split(' ')[0])}</span>
      </button>`).join('')
    : `<div class="hint" style="padding:8px">Add friends in Circle first to send anonymous messages.</div>`;

  const inbox = ECHO_INBOX.map(m => {
    const opened = state.echoOpened.has(m.id);
    return `
      <div class="echo-msg">
        <div class="echo-text">"${escapeHtml(m.text)}"</div>
        ${opened
          ? `<div class="echo-from">${E('👤', 12)} — ${escapeHtml(m.from)} · author revealed</div>`
          : `<button class="echo-btn" data-reveal="${m.id}">${E('🔓', 12)} Reveal author · 50 💎</button>`}
      </div>`;
  }).join('');

  const sent = state.echoSent.length
    ? `<div class="card">
        <div class="title">Sent</div>
        ${state.echoSent.map(s => `<div class="care-item"><div class="care-info"><div class="care-name">To ${escapeHtml(s.to)}</div><div class="care-text">${escapeHtml(s.text)}</div></div></div>`).join('')}
      </div>`
    : '';

  page.innerHTML = `
    <div class="card">
      <div class="title">Send anonymously</div>
      <div class="echo-friends" id="echo-friends">${chips}</div>
      <div class="echo-composer">
        <textarea id="echo-text" placeholder="Write something honest, funny or kind..."></textarea>
      </div>
      <button class="btn primary full" id="echo-send" style="margin-top:10px">${E('🔒', 16)} Send anonymously</button>
    </div>

    <div class="card">
      <div class="title">Inbox</div>
      <div class="echo-inbox">${inbox}</div>
    </div>

    ${sent}`;

  page.querySelectorAll('[data-echo]').forEach(b => {
    b.addEventListener('click', () => {
      state.echoTo = +b.dataset.echo;
      haptic('light');
      renderEcho();
    });
  });

  page.querySelectorAll('[data-reveal]').forEach(b => {
    b.addEventListener('click', () => {
      const id = +b.dataset.reveal;
      if (state.balance < 50){ toast('Not enough diamonds', 'error'); return; }
      state.balance -= 50;
      state.echoOpened.add(id);
      save();
      haptic('heavy');
      toast('Author revealed · 50 💎 spent', 'success');
      renderEcho();
      renderHeader();
    });
  });

  $('#echo-send')?.addEventListener('click', sendEcho);
}

function sendEcho(){
  const ta = $('#echo-text');
  const text = (ta?.value || '').trim();
  if (!state.echoTo){ toast('Pick a friend first', 'info'); return; }
  if (text.length < 2){ toast('Write at least 2 characters', 'info'); return; }
  const c = CONTACTS.find(x => x.id === state.echoTo);
  state.echoSent.unshift({ to: c.name.split(' ')[0], text });
  state.echoTo = null;
  save();
  haptic('heavy');
  toast('Anonymous message sent 🔒', 'success');
  renderEcho();
}

/* ==================================================================
   RENDER: FIESTA
   ================================================================== */

    <div class="event">

      <div class="title" style="margin-bottom:6px">${E('🎅', 12)} Next up</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:4px">Secret Santa</div>

  page.querySelectorAll('[data-event]').forEach(b => {
    b.addEventListener('click', () => {
      haptic('medium');
      toast(`"${b.dataset.event}" — room created ✨`, 'success');
    });
  });
}

/* ==================================================================
   TAB SWITCHING
   ================================================================== */
function switchTab(tab, animate){
  if (animate === undefined) animate = true;
  if (state.tab === tab) return;
  haptic('light');

  const oldPage = $('#page-' + state.tab);
  const newPage = $('#page-' + tab);

  if (animate && oldPage){
    oldPage.classList.remove('active');
    oldPage.classList.add('exit');
    setTimeout(() => oldPage.classList.remove('exit'), 400);
  } else if (oldPage){
    oldPage.classList.remove('active');
  }

  state.tab = tab;

  if (newPage) newPage.classList.add('active');

  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  updateIndicator();

  // refresh specific tabs
  if (tab === 'circle') renderCircle();
  if (tab === 'nova') renderNova();
  if (tab === 'shots') renderShots();
  if (tab === 'echo') renderEcho();
  if (tab === 'fiesta') renderFiesta();
}

/* ==================================================================
   RENDER ALL
   ================================================================== */
function renderAll(){
  renderHeader();
  renderCircle();
  renderNova();
  renderShots();
  renderEcho();
  renderFiesta();
}

/* ==================================================================
   INIT
   ================================================================== */
function init(){
  initUser();
  load();
  renderHeader();
  renderTabs();
  runLoader();
}

init();

})();
