<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Orbit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#0b0d12;--bg-2:#12151c;--bg-3:#181c25;
  --surface:#151922;--surface-2:#1c2130;--surface-3:#252b3b;
  --border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.1);
  --text:#eef1f7;--text-2:rgba(238,241,247,.62);--text-3:rgba(238,241,247,.4);--text-4:rgba(238,241,247,.24);
  --accent:#5b9dff;--accent-2:#7ab0ff;
  --green:#3ecf8e;--red:#f87171;--gold:#fbbf24;--purple:#a78bfa;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;
  --ease:cubic-bezier(.4,0,.2,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;font-size:14px}
.em{display:inline-block;object-fit:contain;vertical-align:-.15em;pointer-events:none}

/* ============ LOADER ============ */
#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:var(--bg);transition:opacity .35s var(--ease)}
#loader.out{opacity:0;pointer-events:none}
#loader-mark{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#fff;opacity:0;transform:translateY(6px);
  transition:opacity .35s var(--ease),transform .35s var(--ease)}
#loader-mark.in{opacity:1;transform:translateY(0)}
#loader-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0;
  animation:loaderPulse 1.2s ease-in-out infinite}
#loader-dot.in{opacity:1}
@keyframes loaderPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.6);opacity:1}}

/* ============ APP ============ */
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}

/* ============ HEADER ============ */
#header{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 6px) 16px 6px;z-index:100;
  background:rgba(11,13,18,.85);border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.h-left{display:flex;align-items:center;gap:10px;min-width:0}
.h-av{position:relative;width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--surface-2);overflow:hidden}
.h-av img{width:100%;height:100%;object-fit:cover;display:block}
.h-av .dot{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);
  border:2px solid var(--bg);box-shadow:0 0 8px rgba(62,207,142,.6)}
.h-info{display:flex;flex-direction:column;gap:0;min-width:0}
.h-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;letter-spacing:-.1px}
.h-sub{font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;font-weight:700;letter-spacing:-.2px;color:#fff}
.h-right{display:flex;align-items:center;gap:6px}
.h-pill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;
  transition:background .15s var(--ease)}
.h-pill:active{background:var(--surface-2)}
.h-pill svg{width:12px;height:12px}
.h-pill .val{color:var(--gold);font-weight:700}

/* ============ MAIN ============ */
#main{position:absolute;inset:0;padding-top:calc(var(--safe-t) + 56px);padding-bottom:calc(var(--safe-b) + 74px);overflow:hidden}
.tab-page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px;opacity:0;visibility:hidden;transform:translateX(12px);
  transition:opacity .22s var(--ease),transform .3s var(--ease),visibility .22s}
.tab-page::-webkit-scrollbar{width:0;display:none}
.tab-page.active{opacity:1;visibility:visible;transform:translateX(0)}

/* ============ TABS ============ */
#tabs{position:absolute;bottom:0;left:0;right:0;padding:6px 12px calc(var(--safe-b) + 10px);z-index:100;
  background:rgba(11,13,18,.85);border-top:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#tabs-inner{display:flex;align-items:center;height:50px;position:relative;max-width:440px;margin:0 auto}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-3);padding:6px 4px;cursor:pointer;position:relative;
  font-family:inherit;transition:color .2s var(--ease)}
.tab-btn.active{color:var(--accent)}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .2s var(--ease)}
.tab-btn.active svg{transform:scale(1.05)}
.tab-btn .lbl{font-size:9.5px;font-weight:600;letter-spacing:.1px}

/* ============ COMMON ============ */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text-3);text-transform:uppercase}
.section-action{font-size:11.5px;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 4px}
.section-action:active{opacity:.7}

.hint{font-size:12px;color:var(--text-3);line-height:1.45}

.btn{border:0;border-radius:var(--r-md);padding:11px 14px;font-size:13.5px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:transform .1s var(--ease),background .15s var(--ease);
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-2)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.ghost:active{background:var(--surface-3)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:var(--r-sm)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;background:transparent;border:0;color:var(--text-3);font-family:inherit;font-size:12.5px;
  font-weight:600;padding:7px 6px;border-radius:8px;cursor:pointer;transition:all .15s var(--ease)}
.seg button.on{background:var(--surface-3);color:var(--text)}

.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty svg{width:32px;height:32px;stroke:var(--text-4);fill:none;stroke-width:1.5;margin-bottom:12px;display:inline-block}
.empty p{font-size:12.5px;line-height:1.5}

/* ============ FRIENDS PAGE ============ */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{width:100%;padding:11px 14px 11px 38px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border .15s var(--ease)}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text-3)}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search-wrap .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;
  background:var(--surface-3);border:0;border-radius:50%;color:var(--text-2);cursor:pointer;display:none;
  align-items:center;justify-content:center;font-size:11px;font-weight:700}
.search-wrap .clear-btn.show{display:flex}

.search-badge{display:none;align-items:center;justify-content:space-between;padding:8px 12px;
  background:rgba(91,157,255,.1);border:1px solid rgba(91,157,255,.25);border-radius:10px;margin-bottom:10px;
  font-size:12px;color:var(--accent);font-weight:500}
.search-badge.show{display:flex}
.search-badge .count{color:var(--text-2);font-weight:600}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 8px;text-align:center}
.stat-v{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.3px;line-height:1;font-variant-numeric:tabular-nums}
.stat-v.green{color:var(--green)}
.stat-v.accent{color:var(--accent)}
.stat-l{font-size:9.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-top:4px}

.add-all-row{display:flex;gap:8px;margin-bottom:12px}
.add-all-row .btn{flex:1}
.add-all-row .btn.icon-only{flex:0 0 44px;padding:0}

.friends-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.friend-row{display:flex;align-items:center;gap:11px;padding:11px 14px;position:relative;
  transition:background .1s var(--ease);cursor:pointer}
.friend-row:active{background:var(--surface-2)}
.friend-row+.friend-row::before{content:'';position:absolute;top:0;left:60px;right:14px;height:1px;background:var(--border)}
.f-av{position:relative;width:42px;height:42px;flex-shrink:0}
.f-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface-2);display:block}
.f-av .dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;
  background:var(--text-4);border:2px solid var(--bg)}
.f-av .dot.on{background:var(--green);box-shadow:0 0 6px rgba(62,207,142,.5)}
.f-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.f-row1{display:flex;align-items:baseline;gap:6px;min-width:0}
.f-name{font-size:14px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-handle{font-size:11.5px;color:var(--text-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.f-row2{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-bio{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.f-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.f-time{font-size:10.5px;color:var(--text-3);font-weight:500}
.add-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:99px;
  padding:5px 11px;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
  transition:all .15s var(--ease);white-space:nowrap}
.add-btn:active{transform:scale(.94);background:rgba(91,157,255,.12)}
.added-tag{color:var(--green);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:3px;white-space:nowrap}
.added-tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ============ NOVA PAGE ============ */
.nova-hero{background:linear-gradient(160deg,rgba(91,157,255,.14),rgba(91,157,255,.02) 70%),var(--surface);
  border:1px solid rgba(91,157,255,.18);border-radius:var(--r-xl);padding:20px 16px 18px;text-align:center;
  position:relative;overflow:hidden;margin-bottom:12px}
.nova-hero::before{content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:200px;height:200px;
  background:radial-gradient(circle,rgba(91,157,255,.25),transparent 70%);filter:blur(30px);pointer-events:none}
.nova-em{position:relative;display:inline-block;margin-bottom:8px;z-index:1}
.nova-name{font-size:20px;font-weight:700;letter-spacing:-.4px;margin-bottom:2px;position:relative;z-index:1}
.nova-meta{font-size:11.5px;color:var(--text-3);font-weight:500;margin-bottom:18px;position:relative;z-index:1}
.nova-meta b{color:var(--text-2);font-weight:600}
.nova-bars{display:flex;flex-direction:column;gap:11px;margin-bottom:16px;position:relative;z-index:1;text-align:left}
.bar-row{display:flex;flex-direction:column;gap:5px}
.bar-head{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--text-2)}
.bar-head .v{color:var(--text);font-variant-numeric:tabular-nums}
.bar-track{height:6px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .45s var(--ease)}
.nova-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.nova-buttons .btn{padding:11px 6px;flex-direction:column;gap:4px;font-size:11.5px;min-height:58px}
.nova-buttons .btn svg{width:18px;height:18px}
.level-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.level-label{font-size:12px;color:var(--text-2);font-weight:500}
.level-value{font-size:13px;color:var(--text);font-weight:700}
.level-track{flex:1;height:5px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;max-width:120px}
.level-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .45s var(--ease)}

.care-list{display:flex;flex-direction:column}
.care-item{display:flex;align-items:center;gap:10px;padding:8px 0}
.care-item+.care-item{border-top:1px solid var(--border)}
.care-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--surface-2)}
.care-av img{width:100%;height:100%;object-fit:cover}
.care-body{flex:1;min-width:0}
.care-name{font-size:12.5px;font-weight:600}
.care-text{font-size:11.5px;color:var(--text-3);margin-top:1px}

/* ============ PULSE PAGE ============ */
.challenge{background:linear-gradient(160deg,rgba(251,191,36,.12),rgba(251,191,36,.02) 70%),var(--surface);
  border:1px solid rgba(251,191,36,.2);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.challenge-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;color:var(--gold);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25);padding:3px 9px;border-radius:99px;margin-bottom:10px}
.challenge-title{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.challenge-sub{font-size:12px;color:var(--text-2);margin-bottom:12px}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photo-tile{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;padding:7px;
  transition:transform .12s var(--ease)}
.photo-tile:active{transform:scale(.96)}
.photo-tile .emwrap{flex:1;display:grid;place-items:center}
.photo-tile .by{font-size:9.5px;font-weight:600;text-align:right;color:rgba(255,255,255,.9);position:relative;z-index:1}
.photo-tile .votes{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.55);border-radius:99px;
  padding:2px 6px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:3px;color:#fff}
.photo-tile.voted .votes{background:rgba(244,114,182,.6)}

.echo-pick-row{display:flex;gap:9px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.echo-pick-row::-webkit-scrollbar{display:none}
.echo-pick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:0;color:var(--text-3);font-family:inherit;font-size:10.5px;font-weight:600;
  cursor:pointer;transition:color .15s var(--ease);width:56px}
.echo-pick .av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  position:relative;transition:box-shadow .15s var(--ease)}
.echo-pick .av img{width:100%;height:100%;object-fit:cover}
.echo-pick.on{color:var(--accent)}
.echo-pick.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.echo-pick .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px}

.echo-input{width:100%;min-height:72px;resize:none;background:var(--bg-2);border:1px solid var(--border);
  border-radius:11px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;
  transition:border .15s var(--ease)}
.echo-input:focus{border-color:var(--accent)}
.echo-input::placeholder{color:var(--text-3)}

.echo-inbox{display:flex;flex-direction:column;gap:8px}
.echo-msg{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
.echo-msg-text{font-size:13px;line-height:1.5;font-style:italic;color:var(--text);margin-bottom:9px}
.echo-msg-from{font-size:11.5px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px}
.echo-reveal-btn{width:100%;padding:8px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--accent);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s var(--ease)}
.echo-reveal-btn:active{background:var(--surface-3)}

/* ============ PROFILE PAGE ============ */
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:20px 16px 18px;
  background:linear-gradient(160deg,rgba(91,157,255,.1),rgba(91,157,255,.02) 70%),var(--surface);
  border:1px solid var(--border);border-radius:var(--r-xl);text-align:center;margin-bottom:12px}
.profile-avatar{position:relative;width:88px;height:88px;margin-bottom:12px}
.profile-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--surface-2);display:block}
.profile-avatar .ring{position:absolute;inset:-3px;border-radius:50%;border:2.5px solid var(--accent);
  pointer-events:none;opacity:.6}
.profile-name{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.profile-handle{font-size:13px;color:var(--text-3);font-weight:500;margin-bottom:4px}
.profile-bio{font-size:12.5px;color:var(--text-2);line-height:1.4;max-width:280px;margin-top:6px}

.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.profile-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.profile-stat-v{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.3px;line-height:1}
.profile-stat-l{font-size:10px;font-weight:500;color:var(--text-3);margin-top:4px}

.frames-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.frames-row::-webkit-scrollbar{display:none}
.frame-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:0;color:var(--text-3);font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.frame-btn.on{color:var(--accent)}
.frame-preview{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  position:relative;transition:box-shadow .15s var(--ease)}
.frame-preview img{width:100%;height:100%;object-fit:cover}
.frame-btn.on .frame-preview{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.frame-badge{position:absolute;bottom:-2px;right:-2px;font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

.settings-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.setting-row{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative;cursor:pointer;
  transition:background .1s var(--ease)}
.setting-row:active{background:var(--surface-2)}
.setting-row+.setting-row::before{content:'';position:absolute;top:0;left:50px;right:0;height:1px;background:var(--border)}
.setting-icon{width:28px;height:28px;flex-shrink:0;border-radius:8px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center}
.setting-icon svg{width:15px;height:15px;stroke:var(--text-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setting-body{flex:1;min-width:0}
.setting-label{font-size:13.5px;font-weight:500;color:var(--text)}
.setting-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);cursor:pointer;
  transition:background .2s var(--ease)}
.switch .slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;
  background:#fff;transition:transform .22s var(--ease);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch input:checked ~ .slider{background:var(--accent)}
.switch input:checked ~ .slider::before{transform:translateX(16px)}

.logout-row{margin-top:16px}
.logout-btn{width:100%;padding:13px;border-radius:var(--r-md);background:var(--surface);
  border:1px solid rgba(248,113,113,.25);color:var(--red);font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:background .15s var(--ease)}
.logout-btn:active{background:rgba(248,113,113,.08)}

/* ============ TOAST ============ */
#toast-wrap{position:fixed;top:calc(var(--safe-t) + 66px);left:50%;transform:translateX(-50%);
  z-index:10000;display:flex;flex-direction:column;gap:6px;width:calc(100% - 32px);max-width:400px;
  pointer-events:none;align-items:center}
.toast{padding:10px 16px;border-radius:99px;background:rgba(28,33,48,.96);border:1px solid var(--border-2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  color:var(--text);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateY(-10px);transition:opacity .2s var(--ease),transform .3s var(--ease);
  pointer-events:auto;max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:rgba(62,207,142,.3);background:rgba(20,45,32,.96)}
.toast.error{border-color:rgba(248,113,113,.3);background:rgba(50,18,22,.96)}
.toast svg{width:14px;height:14px;flex-shrink:0;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.toast.success svg{stroke:var(--green)}
.toast.error svg{stroke:var(--red)}
.toast.info svg{stroke:var(--accent)}

/* ============ MODAL ============ */
.modal-back{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.75);opacity:0;visibility:hidden;
  transition:opacity .2s var(--ease),visibility .2s;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-back.show{opacity:1;visibility:visible}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);opacity:0;
  z-index:9001;width:calc(100% - 40px);max-width:320px;background:var(--bg-3);
  border:1px solid var(--border-2);border-radius:var(--r-lg);padding:20px 18px 16px;
  transition:opacity .2s var(--ease),transform .25s var(--ease)}
.modal.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:6px;letter-spacing:-.2px}
.modal-text{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:16px}
.modal-actions{display:flex;gap:8px}
.modal-actions .btn{flex:1}

function timeAgo(ts){
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  const d = Math.floor(h / 24);
  return d + 'd';
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* =============== PERSIST =============== */
function save(){
  try {
    localStorage.setItem(STORAGE, JSON.stringify({
      friends: [...state.friends],
      nova: state.nova,
      frame: state.frame,
      myPhoto: state.myPhoto,
      votes: [...state.votes],
      echoSent: state.echoSent,
      echoOpened: [...state.echoOpened],
      balance: state.balance,
      notifications: state.notifications,
      hapticsOn: state.hapticsOn
    }));
  } catch(_) {}
}
function load(){
  try {
    const raw = localStorage.getItem(STORAGE);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.friends) state.friends = new Set(d.friends);
    if (d.nova) state.nova = { ...state.nova, ...d.nova };
    if (d.frame) state.frame = d.frame;
    if (d.myPhoto) state.myPhoto = d.myPhoto;
    if (d.votes) state.votes = new Set(d.votes);
    if (d.echoSent) state.echoSent = d.echoSent;
    if (d.echoOpened) state.echoOpened = new Set(d.echoOpened);
    if (typeof d.balance === 'number') state.balance = d.balance;
    if (typeof d.notifications === 'boolean') state.notifications = d.notifications;
    if (typeof d.hapticsOn === 'boolean') state.hapticsOn = d.hapticsOn;
  } catch(_) {}
}

/* =============== TOAST =============== */
function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? ICON.check : type === 'error' ? ICON.x : ICON.bell;
  el.innerHTML = icon + `<span>${escapeHtml(text)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 2200);
  haptic('light');
}

/* =============== MODAL =============== */
function showModal(title, text, okText, onOk, cancelText){
  const back = $('#modal-back');
  const modal = $('#modal');
  modal.innerHTML = `
    <div class="modal-title">${escapeHtml(title)}</div>
    <div class="modal-text">${text}</div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">${escapeHtml(cancelText || 'Cancel')}</button>
      <button class="btn primary" id="modal-ok">${escapeHtml(okText || 'OK')}</button>
    </div>`;
  back.classList.add('show');
  modal.classList.add('show');
  $('#modal-cancel').onclick = hideModal;
  $('#modal-ok').onclick = () => { hideModal(); onOk && onOk(); };
  haptic('medium');
}
function hideModal(){
  $('#modal-back').classList.remove('show');
  $('#modal').classList.remove('show');
}

function renderTabs(){
  const wrap = $('#tabs-inner');

    const b = document.createElement('button');
    b.className = 'tab-btn';
    b.dataset.tab = t.id;

    b.addEventListener('click', () => switchTab(t.id));
    wrap.appendChild(b);
  });

/* =============== TAB SWITCH =============== */
function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');

  const oldPage = $('#page-' + state.tab);
  const newPage = $('#page-' + tab);

  if (oldPage) oldPage.classList.remove('active');
  state.tab = tab;
  if (newPage) newPage.classList.add('active');

  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  if (tab === 'friends') renderFriends();
  if (tab === 'nova') renderNova();
  if (tab === 'pulse') renderPulse();
  if (tab === 'profile') renderProfile();
}

    </div>

    <div class="seg">
      <button class="${state.filter === 'chats' ? 'on' : ''}" data-filter="chats">💬 From chats</button>
      <button class="${state.filter === 'all' ? 'on' : ''}" data-filter="all">👥 All contacts</button>
    </div>

    <div class="add-all-row">
      <button class="btn primary" id="add-all-btn">${ICON.plus} Add all visible (${getVisibleAddable().length})</button>
      <button class="btn ghost icon-only" id="add-random-btn">${ICON.dice}</button>
    </div>

    <div class="friends-list" id="friends-list"></div>

    <div class="hint" style="padding:12px 4px 0;text-align:center">
      "From chats" shows only contacts you've messaged. Search always checks everyone.
    </div>`;

  renderFriendList();

  $$('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      state.filter = b.dataset.filter;
      haptic('light');
      renderFriends();
    });
  });
  $('#search-input')?.addEventListener('input', e => {
    state.search = e.target.value;
    const clear = $('#search-clear');
    if (state.search) clear?.classList.add('show');
    else clear?.classList.remove('show');
    $('#search-badge')?.classList.toggle('show', !!state.search);
    renderFriendList();
    updateSearchBadge();
  });
  $('#search-clear')?.addEventListener('click', () => {
    state.search = '';
    const inp = $('#search-input');
    if (inp) inp.value = '';
    $('#search-clear')?.classList.remove('show');
    $('#search-badge')?.classList.remove('show');
    renderFriendList();
    haptic('light');
  });
  $('#add-all-btn')?.addEventListener('click', addAllVisible);
  $('#add-random-btn')?.addEventListener('click', addRandom);
}

/* SEARCH LOGIC — searches name OR username, overrides filter while typing */
function getFilteredContacts(){
  const q = state.search.trim().toLowerCase();
  if (q){
    const qUser = q.startsWith('@') ? q.slice(1) : q;
    return CONTACTS.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.username.toLowerCase().includes(qUser)
    );
  }
  return CONTACTS.filter(c => state.filter === 'chats' ? c.msgs > 0 : true);
}

function getVisibleAddable(){
  return getFilteredContacts().filter(c => !state.friends.has(c.id));
}

function updateSearchBadge(){
  if (!state.search) return;
  const count = getFilteredContacts().length;
  const el = $('#search-count');
  if (el) el.textContent = count + (count === 1 ? ' result' : ' results');
}

function renderFriendList(){
  const list = $('#friends-list');
  if (!list) return;
  const visible = getFilteredContacts();
  updateSearchBadge();

  if (!visible.length){
    list.innerHTML = `<div class="empty">${ICON.empty}<p>No contacts found${state.search ? ' for "' + escapeHtml(state.search) + '"' : ''}</p></div>`;
    return;
  }

  list.innerHTML = visible.map(c => {
    const added = state.friends.has(c.id);
    const photo = avatarUrl(c.photo);
    const lastMsg = c.msgs > 0 ? escapeHtml(c.prev || '') : '';
    const metaLine = c.msgs > 0
      ? `<div class="f-row2">${lastMsg}</div>`
      : `<div class="f-bio">${escapeHtml(c.bio || 'No messages yet')}</div>`;
    return `
      <div class="friend-row" data-contact="${c.id}">
        <div class="f-av">
          <img src="${photo}" alt="">
          <span class="dot ${c.online ? 'on' : ''}"></span>
        </div>
        <div class="f-body">
          <div class="f-row1">
            <span class="f-name">${escapeHtml(c.name)}</span>
            <span class="f-handle">@${escapeHtml(c.username)}</span>
          </div>
          ${metaLine}
        </div>
        <div class="f-right">
          ${c.last ? `<span class="f-time">${timeAgo(c.last)}</span>` : ''}
          ${added
            ? `<span class="added-tag">${ICON.check} Added</span>`
            : `<button class="add-btn" data-add="${c.id}">Add</button>`}
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); addFriend(+b.dataset.add); });
  });
  list.querySelectorAll('[data-contact]').forEach(row => {
    row.addEventListener('click', () => {
      const c = CONTACTS.find(x => x.id === +row.dataset.contact);
      if (!c) return;
      haptic('light');
      if (!state.friends.has(c.id)){
        toast(`Add @${c.username} to open a chat`, 'info');
      } else {
        toast(`Opening chat with ${c.name.split(' ')[0]}`, 'info');
      }
    });
  });
}

function addFriend(id){
  if (state.friends.has(id)) return;
  state.friends.add(id);
  save();
  haptic('medium');
  const c = CONTACTS.find(x => x.id === id);
  toast(`${c ? c.name.split(' ')[0] : 'Friend'} added to Orbit`, 'success');
  renderFriends();
  const addBtn = $('#add-all-btn');
  if (addBtn) addBtn.innerHTML = `${ICON.plus} Add all visible (${getVisibleAddable().length})`;
}

function addAllVisible(){
  const addable = getVisibleAddable();
  if (!addable.length){ toast('Everyone visible is already added', 'info'); return; }
  addable.forEach(c => state.friends.add(c.id));
  save();
  haptic('heavy');
  toast(`Added ${addable.length} contacts to Orbit`, 'success');
  renderFriends();
}

function addRandom(){
  const addable = getVisibleAddable();
  if (!addable.length){ toast('Everyone visible is already added', 'info'); return; }
  const pick = addable[Math.floor(Math.random() * addable.length)];
  addFriend(pick.id);
}

/* ==================================================================
   NOVA PAGE
   ================================================================== */
const CARE_LOG = [];
function renderNova(){
  const page = $('#page-nova');
  const n = state.nova;
  const friendCount = state.friends.size;
  const levelPct = Math.min(100, (n.xp / n.xpMax) * 100);

  page.innerHTML = `
    <div class="nova-hero">
      <div class="nova-em">${E('🦊', 72)}</div>
      <div class="nova-name">Nova</div>
      <div class="nova-meta">Level <b>${n.level}</b> · cared for by <b>${friendCount}</b> ${friendCount === 1 ? 'friend' : 'friends'}</div>

      <div class="nova-bars">
        ${renderBar('Food', n.food, '#3ecf8e')}
        ${renderBar('Mood', n.happy, '#fbbf24')}
        ${renderBar('Energy', n.energy, '#5b9dff')}
      </div>

      <div class="nova-buttons">
        <button class="btn primary" data-care="feed">${ICON.feed}<span>Feed</span></button>
        <button class="btn ghost" data-care="play">${ICON.play}<span>Play</span></button>
        <button class="btn ghost" data-care="sleep">${ICON.sleep}<span>Sleep</span></button>
      </div>
    </div>

    <div class="level-bar">
      <span class="level-label">Level ${n.level}</span>
      <div class="level-track"><div class="level-fill" style="width:${levelPct}%"></div></div>
      <span class="level-value">${n.xp}/${n.xpMax}</span>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Recent care</div></div>
      <div class="care-list" id="care-list"></div>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Grow together</div></div>
      <div class="hint" style="margin-bottom:12px">Friends you add can occasionally feed, play and put Nova to sleep. The bigger your Orbit, the faster Nova levels up.</div>
      <button class="btn ghost full" id="nova-invite">${ICON.people}<span>Invite more friends</span></button>
    </div>`;

  renderCareList();

  page.querySelectorAll('[data-care]').forEach(b => {
    b.addEventListener('click', () => care(b.dataset.care));
  });
  $('#nova-invite')?.addEventListener('click', () => {
    haptic('medium');
    if (state.friends.size === 0){ toast('Add friends from the Friends tab first', 'info'); switchTab('friends'); return; }
    toast('Invite link ready to share', 'success');
  });
}

function renderBar(label, value, color){
  return `
    <div class="bar-row">
      <div class="bar-head"><span>${label}</span><span class="v">${Math.round(value)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${value}%;background:${color}"></div></div>
    </div>`;
}

function renderCareList(){
  const el = $('#care-list');
  if (!el) return;

  if (!CARE_LOG.length){
    const friendIds = [...state.friends].slice(0, 3);
    friendIds.forEach(id => {
      const c = CONTACTS.find(x => x.id === id);
      if (c) CARE_LOG.push({
        name: c.name.split(' ')[0],
        photo: avatarUrl(c.photo),
        text: ['fed Nova', 'played with Nova', 'put Nova to sleep'][Math.floor(Math.random() * 3)],
        time: Math.floor(Math.random() * 20) + 1 + 'm ago'
      });
    });
  }

  if (!CARE_LOG.length){
    el.innerHTML = `<div class="hint">No care yet. Add friends to let them help.</div>`;
    return;
  }

  el.innerHTML = CARE_LOG.slice(0, 6).map(l => `
    <div class="care-item">
      <div class="care-av"><img src="${l.photo}" alt=""></div>
      <div class="care-body">
        <div class="care-name">${escapeHtml(l.name)}</div>
        <div class="care-text">${escapeHtml(l.text)} · ${l.time}</div>
      </div>
    </div>`).join('');
}

function care(kind){
  const n = state.nova;
  if (kind === 'feed'){
    n.food = clamp(n.food + 18, 0, 100);
    n.energy = clamp(n.energy - 5, 0, 100);
    n.xp += 15;
    CARE_LOG.unshift({ name: 'You', photo: state.user.photo || avatarUrl(12), text: 'fed Nova', time: 'now' });
  } else if (kind === 'play'){
    n.happy = clamp(n.happy + 16, 0, 100);
    n.energy = clamp(n.energy - 12, 0, 100);
    n.food = clamp(n.food - 5, 0, 100);
    n.xp += 20;
    CARE_LOG.unshift({ name: 'You', photo: state.user.photo || avatarUrl(12), text: 'played with Nova', time: 'now' });
  } else if (kind === 'sleep'){
    n.energy = clamp(n.energy + 22, 0, 100);
    n.food = clamp(n.food - 4, 0, 100);
    n.xp += 10;
    CARE_LOG.unshift({ name: 'You', photo: state.user.photo || avatarUrl(12), text: 'put Nova to sleep', time: 'now' });
  }

  if (state.friends.size && Math.random() < 0.5){
    const fids = [...state.friends];
    const pick = CONTACTS.find(x => x.id === fids[Math.floor(Math.random() * fids.length)]);
    if (pick){
      n.happy = clamp(n.happy + 4, 0, 100);
      CARE_LOG.unshift({ name: pick.name.split(' ')[0], photo: avatarUrl(pick.photo), text: 'helped Nova too', time: 'now' });
    }
  }

  if (n.xp >= n.xpMax){
    n.level++;
    n.xp = 0;
    n.xpMax = Math.round(n.xpMax * 1.2);
    n.food = n.happy = n.energy = 60;
    toast(`Nova leveled up to level ${n.level}`, 'success');
    haptic('heavy');
  } else {
    haptic('light');
  }

  save();
  renderNova();
}

/* ==================================================================
   PULSE PAGE
   ================================================================== */
function renderPulse(){
  const page = $('#page-pulse');
  const friends = [...state.friends].map(id => CONTACTS.find(c => c.id === id)).filter(Boolean);

  const echoChips = friends.length
    ? friends.map(c => `
      <button class="echo-pick ${state.echoTo === c.id ? 'on' : ''}" data-echo="${c.id}">
        <div class="av"><img src="${avatarUrl(c.photo)}" alt=""></div>
        <span class="nm">${escapeHtml(c.name.split(' ')[0])}</span>
      </button>`).join('')
    : `<div class="hint" style="padding:4px 0">Add friends to send anonymous messages.</div>`;

  const inbox = ECHO_INBOX.map(m => {
    const opened = state.echoOpened.has(m.id);
    return `
      <div class="echo-msg">
        <div class="echo-msg-text">"${escapeHtml(m.text)}"</div>
        ${opened
          ? `<div class="echo-msg-from">${ICON.check} ${escapeHtml(m.from)} · revealed</div>`
          : `<button class="echo-reveal-btn" data-reveal="${m.id}">Reveal author · 50 diamonds</button>`}
      </div>`;
  }).join('');

  page.innerHTML = `
    <div class="challenge">
      <span class="challenge-tag">${E('🔥', 11)} Daily challenge</span>
      <div class="challenge-title">"My desk setup"</div>
      <div class="challenge-sub">Ends in 6h 12m · ${PHOTOS.length + (state.myPhoto ? 1 : 0)} joined</div>
      <button class="btn primary full" id="join-challenge">${state.myPhoto ? 'You\'re in' : 'Join the challenge'}</button>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Community feed</div>
        <div class="section-action" style="pointer-events:none;color:var(--text-3)">Tap to vote</div>
      </div>
      <div class="photo-grid" id="photo-grid"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Anonymous</div>
      </div>
      <div class="echo-pick-row" id="echo-row">${echoChips}</div>
      <textarea class="echo-input" id="echo-text" placeholder="Write something honest or kind..." style="margin-top:8px"></textarea>
      <button class="btn primary full" id="echo-send" style="margin-top:8px">${ICON.lock}<span>Send anonymously</span></button>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Your inbox</div></div>
      <div class="echo-inbox" id="echo-inbox">${inbox}</div>
    </div>

    ${state.echoSent.length ? `
      <div class="section">
        <div class="section-head"><div class="section-title">Sent</div></div>
        <div class="care-list">
          ${state.echoSent.map(s => `<div class="care-item"><div class="care-av" style="background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700">A</div><div class="care-body"><div class="care-name">To ${escapeHtml(s.to)}</div><div class="care-text">${escapeHtml(s.text)}</div></div></div>`).join('')}
        </div>
      </div>` : ''}`;

  renderPhotoGrid();

  $('#join-challenge')?.addEventListener('click', () => {
    if (state.myPhoto){ toast('You are already in', 'info'); return; }
    state.myPhoto = true;
    save();
    haptic('heavy');
    toast('Your photo joined the challenge', 'success');
    renderPulse();
  });

  page.querySelectorAll('[data-echo]').forEach(b => {
    b.addEventListener('click', () => {
      state.echoTo = +b.dataset.echo;
      haptic('light');
      renderPulse();
    });
  });
  page.querySelectorAll('[data-reveal]').forEach(b => {
    b.addEventListener('click', () => {
      const id = +b.dataset.reveal;
      if (state.balance < 50){ toast('Not enough diamonds', 'error'); return; }
      state.balance -= 50;
      state.echoOpened.add(id);
      save();
      haptic('heavy');
      toast('Author revealed · 50 diamonds', 'success');
      renderHeader();
      renderPulse();
    });
  });
  $('#echo-send')?.addEventListener('click', () => {
    const ta = $('#echo-text');
    const text = (ta?.value || '').trim();
    if (!state.echoTo){ toast('Pick a friend first', 'info'); return; }
    if (text.length < 2){ toast('Write at least 2 characters', 'info'); return; }
    const c = CONTACTS.find(x => x.id === state.echoTo);
    state.echoSent.unshift({ to: c.name.split(' ')[0], text });
    state.echoTo = null;
    save();
    haptic('heavy');
    toast('Anonymous message sent', 'success');
    renderPulse();
  });
}

function renderPhotoGrid(){
  const grid = $('#photo-grid');
  if (!grid) return;
  const all = [...PHOTOS];
  if (state.myPhoto) all.push({ id: 99, emoji: '😎', by: 'You', photo: null, votes: 0, color: '#5b9dff', mine: true });

  grid.innerHTML = all.map(p => {
    const voted = state.votes.has(p.id);
    return `
      <div class="photo-tile ${voted ? 'voted' : ''}" data-photo="${p.id}" style="background:linear-gradient(160deg,${p.color}dd,${p.color}99)">
        <div class="votes">${E('❤️', 10)} ${p.votes}</div>
        <div class="emwrap">${E(p.emoji, 28)}</div>
        <div class="by">${escapeHtml(p.by)}</div>
      </div>`;
  }).join('');

  grid.querySelectorAll('[data-photo]').forEach(el => {
    el.addEventListener('click', () => {
      const id = +el.dataset.photo;
      if (id === 99){ toast('Can\'t vote for yourself', 'info'); return; }
      if (state.votes.has(id)){ toast('Already voted', 'info'); return; }
      state.votes.add(id);
      const p = PHOTOS.find(x => x.id === id);
      if (p) p.votes++;
      save();
      haptic('light');
      renderPhotoGrid();
    });
  });
}

/* ==================================================================
   PROFILE PAGE
   ================================================================== */
function renderProfile(){
  const page = $('#page-profile');
  const u = state.user;
  const fallback = `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(u.name)}&backgroundColor=5b9dff&textColor=ffffff`;
  const photo = u.photo || fallback;
  const curFrame = FRAMES.find(f => f.id === state.frame) || FRAMES[0];

  page.innerHTML = `
    <div class="profile-hero">
      <div class="profile-avatar">
        <img src="${escapeHtml(photo)}" alt="" onerror="this.src='${fallback}'">
        <div class="ring" style="${state.frame === 'none' ? 'display:none' : 'border-color:' + curFrame.color}"></div>
      </div>
      <div class="profile-name">${escapeHtml(u.name)}</div>
      <div class="profile-handle">${u.username ? '@' + escapeHtml(u.username) : 'no username'}</div>
      ${u.username ? '' : '<div class="profile-bio">Open this mini app inside Telegram to show your real account.</div>'}
    </div>

    <div class="profile-stats">
      <div class="profile-stat"><div class="profile-stat-v">${state.friends.size}</div><div class="profile-stat-l">Friends</div></div>
      <div class="profile-stat"><div class="profile-stat-v">${state.nova.level}</div><div class="profile-stat-l">Nova Lvl</div></div>
      <div class="profile-stat"><div class="profile-stat-v">${state.balance.toLocaleString()}</div><div class="profile-stat-l">Diamonds</div></div>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Avatar frame</div></div>
      <div class="frames-row" id="frames-row"></div>
    </div>

    <div class="settings-list">
      <div class="setting-row">
        <div class="setting-icon">${ICON.bell}</div>
        <div class="setting-body">
          <div class="setting-label">Notifications</div>
          <div class="setting-sub">Get updates from friends</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="notif-toggle" ${state.notifications ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-icon">${ICON.paw}</div>
        <div class="setting-body">
          <div class="setting-label">Haptic feedback</div>
          <div class="setting-sub">Vibrate on actions</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="haptic-toggle" ${state.hapticsOn ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-icon">${ICON.moon}</div>
        <div class="setting-body">
          <div class="setting-label">Dark theme</div>
          <div class="setting-sub">Always on</div>
        </div>
        <label class="switch">
          <input type="checkbox" checked disabled>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="setting-icon">${ICON.shield}</div>
        <div class="setting-body">
          <div class="setting-label">Privacy</div>
          <div class="setting-sub">Who can message you anonymously</div>
        </div>
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <div class="logout-row">
      <button class="logout-btn" id="reset-btn">Reset all data</button>
    </div>

    <div class="hint" style="padding:16px 8px;text-align:center">Orbit · v1.0 · made for Telegram</div>`;

  // frames
  const fr = $('#frames-row');
  FRAMES.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'frame-btn' + (state.frame === f.id ? ' on' : '');
    btn.dataset.frame = f.id;
    btn.innerHTML = `
      <div class="frame-preview">
        <img src="${escapeHtml(photo)}" alt="" onerror="this.src='${fallback}'">
        ${f.emoji ? `<span class="frame-badge">${E(f.emoji, 13)}</span>` : ''}
      </div>
      <span>${f.name}</span>`;
    btn.addEventListener('click', () => {
      state.frame = f.id;
      save();
      haptic('medium');
      renderProfile();
      renderHeader();
      toast(f.id === 'none' ? 'Default frame' : f.name + ' frame applied', 'success');
    });
    fr.appendChild(btn);
  });

  $('#notif-toggle')?.addEventListener('change', e => {
    state.notifications = e.target.checked;
    save();
    haptic('light');
    toast(state.notifications ? 'Notifications on' : 'Notifications off', 'success');
  });
  $('#haptic-toggle')?.addEventListener('change', e => {
    state.hapticsOn = e.target.checked;
    save();
    haptic('medium');
  });
  $('#reset-btn')?.addEventListener('click', () => {
    showModal(
      'Reset all data?',
      'This will remove your friends, Nova progress, and messages. This can\'t be undone.',
      'Reset',
      () => {
        try { localStorage.removeItem(STORAGE); } catch(_) {}
        state.friends = new Set();
        state.nova = { food: 68, happy: 54, energy: 41, level: 3, xp: 340, xpMax: 500 };
        state.myPhoto = false;
        state.votes = new Set();
        state.frame = 'none';
        state.echoSent = [];
        state.echoOpened = new Set();
        state.balance = 1250;
        CARE_LOG.length = 0;
        renderHeader();
        renderProfile();
        toast('All data reset', 'success');
        haptic('heavy');
      },
      'Cancel'
    );
  });
}

/* ==================================================================
   LOADER
   ================================================================== */
function runLoader(){
  const loader = $('#loader');
  const mark = $('#loader-mark');
  const dot = $('#loader-dot');
  setTimeout(() => { mark.classList.add('in'); dot.classList.add('in'); }, 100);
  setTimeout(() => {
    loader.classList.add('out');
    setTimeout(() => {
      renderHeader();
      renderTabs();
      renderFriends();
      switchTab('friends');
      setTimeout(() => loader.remove(), 400);
    }, 300);
  }, 700);
}

/* ==================================================================
   INIT
   ================================================================== */
function init(){
  initUser();
  load();
  runLoader();
  document.addEventListener('click', e => {
    if (e.target.id === 'modal-back') hideModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideModal();
  });
}

init();

})();
</script>
</body>
</html>
