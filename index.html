<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#0a0a0a;--surface-2:#141414;--surface-3:#1e1e1e;
  --text:#fff;--text-2:#a0a0a0;--text-3:#5a5a5a;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);
  --accent:#4d9fff;--accent-2:#6eb0ff;
  --green:#34d399;--gold:#fbbf24;--red:#f87171;
  --safe-top:max(env(safe-area-inset-top,0px),24px);
  --safe-bottom:max(env(safe-area-inset-bottom,0px),10px);
  --header-h:54px;--tabs-h:68px;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;touch-action:manipulation}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:calc(var(--safe-top) + var(--header-h));
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--safe-top) 16px 0;z-index:100;
  background:rgba(0,0,0,.94);border-bottom:.5px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.h-left{display:flex;align-items:center;gap:10px;min-width:0;height:var(--header-h)}
.h-av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.h-av img{width:100%;height:100%;object-fit:cover;display:block}
.h-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + var(--safe-top)/2));
  font-size:17px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);-webkit-background-clip:text;background-clip:text;
  color:transparent;pointer-events:none}
.h-right{font-size:12.5px;font-weight:600;color:var(--gold);height:var(--header-h);
  display:flex;align-items:center;gap:4px}

/* MAIN */
#main{position:fixed;top:calc(var(--safe-top) + var(--header-h));
  left:0;right:0;bottom:calc(var(--safe-bottom) + var(--tabs-h));overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px;opacity:0;visibility:hidden;
  transform:translateY(10px);transition:opacity .25s var(--ease),transform .3s var(--spring),visibility .25s}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;visibility:visible;transform:translateY(0)}

/* TABS - draggable slider */
#tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--safe-bottom) + var(--tabs-h));
  padding:8px 12px calc(var(--safe-bottom) + 8px);background:rgba(0,0,0,.94);
  border-top:.5px solid var(--border);z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  touch-action:none;user-select:none;-webkit-user-select:none}
#tabs-inner{position:relative;display:flex;align-items:center;height:52px;
  background:rgba(20,20,20,.7);border:1px solid var(--border);border-radius:16px;
  padding:5px;touch-action:none;overflow:hidden}
.tab-indicator{position:absolute;top:5px;bottom:5px;left:5px;
  width:calc((100% - 10px) / 4);background:rgba(77,159,255,.16);
  border:1px solid rgba(77,159,255,.35);border-radius:12px;pointer-events:none;
  transition:transform .45s var(--spring);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(77,159,255,.18);z-index:1}
.tab-indicator.dragging{transition:none}
.tab-btn{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;background:none;border:0;
  color:var(--text-3);font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:.2px;cursor:pointer;transition:color .2s var(--ease);
  height:42px;pointer-events:none}
.tab-btn.active{color:var(--accent)}
.tab-icon{position:relative;display:inline-flex;transition:transform .3s var(--spring)}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tab-btn.active .tab-icon{transform:scale(1.14) translateY(-1px)}
.tab-bell{position:absolute;top:-5px;right:-8px;font-size:10px;line-height:1;
  animation:bellWobble 2.4s ease-in-out infinite;transform-origin:50% 20%}
@keyframes bellWobble{0%,100%{transform:rotate(0)}8%{transform:rotate(14deg)}
  16%{transform:rotate(-12deg)}24%{transform:rotate(8deg)}32%{transform:rotate(-4deg)}40%{transform:rotate(0)}}
.tab-bell::before{content:'';position:absolute;top:-1px;right:-1px;width:5px;height:5px;
  background:var(--red);border-radius:50%;border:1px solid #000;box-shadow:0 0 6px rgba(248,113,113,.8)}

/* SEARCH */
.search-hero{margin-bottom:16px}
.search-title{font-size:24px;font-weight:800;letter-spacing:-.7px;margin-bottom:4px}
.search-sub{font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.4}
.search-wrap{position:relative}
.search-input{width:100%;padding:13px 44px 13px 44px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;color:var(--text);
  font-family:inherit;font-size:16px;outline:none;
  transition:border .2s var(--ease),background .2s var(--ease)}
.search-input:focus{border-color:var(--accent);background:var(--surface-2)}
.search-input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:var(--text-3);fill:none;stroke-width:2;
  stroke-linecap:round;pointer-events:none;transition:stroke .2s}
.search-input:focus~.search-icon{stroke:var(--accent)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border:none;background:var(--surface-3);border-radius:50%;
  color:var(--text-2);font-size:12px;cursor:pointer;display:none;
  align-items:center;justify-content:center}
.search-clear.show{display:flex}
.search-status{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--text-3);font-weight:600;display:none}
.search-status.show{display:block}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s var(--spring)}
.chip:active{transform:scale(.94);background:var(--surface-2);
  border-color:var(--accent);color:var(--accent)}

/* RESULT */
.results{margin-top:18px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin-bottom:14px;animation:resultIn .5s var(--spring) both}
@keyframes resultIn{from{opacity:0;transform:translateY(12px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.result-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.result-av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative}
.result-av img{width:100%;height:100%;object-fit:cover;display:block}
.result-av::after{content:'';position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.result-info{flex:1;min-width:0}
.result-name-row{display:flex;align-items:center;gap:6px}
.result-name{font-size:18px;font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-verified{flex-shrink:0;width:16px;height:16px;background:var(--accent);
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.result-verified svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.result-handle{font-size:13px;color:var(--text-3);margin-top:3px;font-weight:500}

/* PENDING / CONNECTED */
.pending-badge{padding:14px;background:rgba(251,191,36,.1);
  border:1px solid rgba(251,191,36,.3);border-radius:12px;text-align:center;
  font-size:13px;font-weight:600;color:var(--gold);
  display:flex;align-items:center;justify-content:center;gap:8px}
.connected-badge{padding:14px;background:rgba(52,211,153,.12);
  border:1px solid rgba(52,211,153,.3);border-radius:12px;text-align:center;
  font-size:13px;font-weight:600;color:var(--green);
  display:flex;align-items:center;justify-content:center;gap:8px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* LIQUID GLASS SLIDER */
.lg-slider{position:relative;height:58px;border-radius:29px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.4),
    inset 0 0 20px rgba(255,255,255,.02)}
.lg-slider::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(255,255,255,.1),transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 100%,rgba(77,159,255,.15),transparent 70%);
  border-radius:29px}
.lg-slider::after{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,.03) 1px,transparent 1px),
    radial-gradient(circle at 75% 70%,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:8px 8px;border-radius:29px;opacity:.5;mix-blend-mode:overlay}
.lg-fill{position:absolute;top:0;left:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(77,159,255,.3),rgba(77,159,255,.6),rgba(140,190,255,.7));
  border-radius:29px;pointer-events:none;
  box-shadow:0 0 30px rgba(77,159,255,.5),inset 0 0 20px rgba(255,255,255,.2)}
.lg-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.3px;
  pointer-events:none;transition:opacity .2s var(--ease)}
.lg-knob{position:absolute;left:4px;top:4px;width:50px;height:50px;
  will-change:transform;z-index:2}
.lg-knob-inner{width:100%;height:100%;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 45%),
    radial-gradient(circle at 70% 80%,rgba(255,255,255,.15),transparent 55%),
    linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 60%,rgba(200,220,255,.15));
  backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.7),
    inset 0 -3px 6px rgba(0,0,0,.15),
    inset -1px 0 2px rgba(255,255,255,.3),
    0 6px 20px rgba(0,0,0,.5),
    0 2px 8px rgba(0,0,0,.3),
    0 0 0 1px rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;cursor:grab;
  transition:transform .35s var(--spring);
  transform-origin:center center;position:relative;overflow:hidden}
.lg-knob-inner::before{content:'';position:absolute;top:15%;left:20%;right:20%;height:30%;
  background:radial-gradient(ellipse,rgba(255,255,255,.5),transparent 70%);
  border-radius:50%;filter:blur(2px);pointer-events:none}
.lg-knob-inner svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;position:relative;z-index:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.lg-knob.dragging .lg-knob-inner{cursor:grabbing;animation:knobJiggle .5s ease-in-out infinite}
@keyframes knobJiggle{
  0%,100%{transform:scale(1.18) rotate(-4deg) skewX(2deg)}
  25%{transform:scale(1.22) rotate(4deg) skewX(-2deg)}
  50%{transform:scale(1.18) rotate(-2deg) skewX(1deg)}
  75%{transform:scale(1.22) rotate(3deg) skewX(-1deg)}
}
.lg-knob.dragging .lg-knob-inner svg{transform:scale(1.15);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.lg-slider.completed .lg-knob-inner{
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 45%),
    linear-gradient(135deg,#34d399,#22c55e);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.7),
    0 6px 20px rgba(52,211,153,.6),
    0 0 0 1px rgba(255,255,255,.15)}

/* CONNECTIONS - chat style */
.chat-list{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;margin-bottom:14px}
.chat-list-head{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.chat-list-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-3)}
.chat-list-count{font-size:11px;color:var(--text-3);font-weight:600}
.chat-row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;
  cursor:pointer;transition:background .15s var(--ease);
  animation:chatIn .35s var(--spring) both}
.chat-row:active{background:var(--surface-2)}
@keyframes chatIn{from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}}
.chat-row+.chat-row::before{content:'';position:absolute;top:0;left:68px;right:16px;
  height:.5px;background:var(--border)}
.chat-av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative}
.chat-av img{width:100%;height:100%;object-fit:cover;display:block}
.chat-online{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;
  background:var(--green);border:2px solid var(--surface);
  box-shadow:0 0 8px rgba(52,211,153,.6)}
.chat-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.chat-name-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:-.1px}
.chat-time{font-size:11px;color:var(--text-3);font-weight:500;flex-shrink:0}
.chat-preview{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.chat-preview .you{color:var(--accent);font-weight:600}
.chat-preview .dot{width:3px;height:3px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.chat-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;padding:0 5px;flex-shrink:0}
.chat-empty{padding:32px 18px;text-align:center;font-size:13px;color:var(--text-3);
  line-height:1.5}

/* PENDING list */
.pending-list{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;margin-bottom:14px}
.pend-row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.pend-row+.pend-row::before{content:'';position:absolute;top:0;left:68px;right:16px;
  height:.5px;background:var(--border)}
.pend-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);opacity:.7}
.pend-av img{width:100%;height:100%;object-fit:cover;display:block}
.pend-body{flex:1;min-width:0}
.pend-name{font-size:14px;font-weight:600;opacity:.85}
.pend-handle{font-size:12px;color:var(--text-3);margin-top:1px}
.pend-status{font-size:11px;color:var(--gold);font-weight:600;
  display:flex;align-items:center;gap:4px}

/* STATE MSG */
.state-msg{text-align:center;padding:32px 20px;color:var(--text-3)}
.state-msg svg{width:44px;height:44px;stroke:var(--text-3);fill:none;stroke-width:1.4;
  margin-bottom:12px;opacity:.5}
.state-msg .state-title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.state-msg .state-text{font-size:13px;line-height:1.5}

/* NOVA / 3D ROOM */
.room-scene{position:relative;width:100%;height:420px;margin:0 auto 16px;
  perspective:900px;perspective-origin:50% 35%;
  overflow:hidden;border-radius:20px;
  background:radial-gradient(ellipse at 50% 25%,rgba(60,45,80,.35),rgba(0,0,0,.7) 75%);
  touch-action:none;user-select:none;-webkit-user-select:none;
  border:1px solid var(--border)}
.room-scene::after{content:'drag to rotate';position:absolute;bottom:8px;left:50%;
  transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.25);
  letter-spacing:.8px;text-transform:uppercase;pointer-events:none;font-weight:600}

.room{position:absolute;left:50%;top:55%;width:340px;height:340px;
  margin-left:-170px;margin-top:-100px;transform-style:preserve-3d;
  transform:rotateX(-18deg) rotateY(0deg);will-change:transform}

.wall{position:absolute;width:340px;height:170px;
  background:linear-gradient(180deg,#1a1d2a 0%,#0f1220 100%);
  border:1px solid rgba(255,255,255,.05)}
.wall::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 40px,
    rgba(255,255,255,.015) 40px 41px)}

.wall-back{transform:translate3d(0,85px,-170px)}
.wall-left{transform:translate3d(-170px,85px,0) rotateY(90deg)}
.wall-right{transform:translate3d(170px,85px,0) rotateY(-90deg)}

.floor{position:absolute;width:340px;height:340px;
  background:radial-gradient(ellipse at 50% 50%,#3a2c1e 0%,#1f1810 80%);
  transform:translate3d(0,170px,0) rotateX(90deg);
  transform-origin:center center}
.floor::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent 0 30px,
    rgba(255,255,255,.02) 30px 31px),
    repeating-linear-gradient(-45deg,transparent 0 30px,
    rgba(255,255,255,.02) 30px 31px)}

.rug{position:absolute;width:180px;height:180px;
  background:radial-gradient(circle,rgba(160,100,80,.65) 0%,rgba(100,60,50,.45) 70%,transparent 100%);
  border:2px solid rgba(200,150,120,.25);border-radius:50%;
  transform:translate3d(80px,169px,80px) rotateX(90deg);
  transform-origin:center center;pointer-events:none}
.rug::after{content:'';position:absolute;inset:20px;border-radius:50%;
  border:1px dashed rgba(255,200,150,.2)}

.window{position:absolute;width:80px;height:90px;
  background:linear-gradient(180deg,#0a1428 0%,#162a4a 100%);
  border:3px solid rgba(40,50,70,.9);border-radius:2px;
  transform:translate3d(-130px,60px,-169px);
  box-shadow:inset 0 0 30px rgba(100,150,255,.3),0 0 40px rgba(100,150,255,.15)}
.window::before{content:'';position:absolute;top:0;left:50%;width:2px;height:100%;
  background:rgba(40,50,70,.9);transform:translateX(-50%)}
.window::after{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;
  background:rgba(40,50,70,.9);transform:translateY(-50%)}
.window-stars{position:absolute;inset:0;pointer-events:none}
.window-star{position:absolute;width:2px;height:2px;border-radius:50%;
  background:rgba(200,220,255,.9);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

.poster{position:absolute;width:70px;height:70px;
  background:linear-gradient(135deg,#f472b6 0%,#a78bfa 100%);
  border:2px solid rgba(255,255,255,.15);border-radius:2px;
  transform:translate3d(100px,50px,-169px);
  box-shadow:0 4px 20px rgba(244,114,182,.3)}
.poster::after{content:'♥';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-size:24px;color:rgba(255,255,255,.6)}

.shelf{position:absolute;width:60px;height:8px;
  background:linear-gradient(180deg,#3a2c20 0%,#1f1810 100%);
  transform:translate3d(-160px,120px,60px) rotateY(90deg);pointer-events:none}

.bowl{position:absolute;width:36px;height:36px;font-size:28px;line-height:36px;
  text-align:center;transform:translate3d(120px,152px,120px);
  transform-origin:center bottom;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));pointer-events:none}
.ball{position:absolute;width:28px;height:28px;font-size:22px;line-height:28px;
  text-align:center;transform:translate3d(-120px,156px,-100px);
  transform-origin:center bottom;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));pointer-events:none;
  animation:ballRoll 4s ease-in-out infinite}
@keyframes ballRoll{0%,100%{transform:translate3d(-120px,156px,-100px) rotate(0)}
  50%{transform:translate3d(-100px,156px,-80px) rotate(180deg)}}

/* PET */
.pet-wrap{position:absolute;left:50%;top:55%;width:100px;height:100px;
  margin-left:-50px;margin-top:-100px;
  transform-style:preserve-3d;
  transform:translate3d(var(--px,0),160px,var(--pz,0))
    rotateY(calc(-1 * var(--ry,0deg)))
    rotateX(18deg);
  transform-origin:center bottom;
  cursor:grab;z-index:10;will-change:transform;transition:filter .2s ease}
.pet-wrap:active{cursor:grabbing}
.pet-wrap.dragging{filter:drop-shadow(0 12px 20px rgba(0,0,0,.8))}
.pet-wrap.dragging .pet-img{animation:petSquish .3s ease-in-out infinite}
@keyframes petSquish{0%,100%{transform:scale(1.15,1.15)}50%{transform:scale(1.22,1.08)}}
.pet-img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));
  animation:petBreathe 3s ease-in-out infinite;
  transition:transform .2s var(--spring);pointer-events:none}
@keyframes petBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.pet-shadow{position:absolute;width:70px;height:20px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);
  left:50%;bottom:-4px;transform:translateX(-50%);pointer-events:none;
  filter:blur(3px);transition:opacity .2s ease}
.pet-wrap.dragging .pet-shadow{opacity:.4}

/* HAND CURSOR */
#hand-cursor{position:fixed;pointer-events:none;z-index:99999;display:none;
  transform:translate(-8px,-8px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
#hand-cursor.active{display:block;animation:handAppear .25s var(--spring)}
@keyframes handAppear{from{transform:translate(-8px,-8px) scale(.5);opacity:0}
  to{transform:translate(-8px,-8px) scale(1);opacity:1}}
.hand-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:2px solid #fff;background:var(--surface-2);
  box-shadow:0 2px 10px rgba(0,0,0,.7)}
.hand-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hand-icon{font-size:24px;margin-top:-8px;margin-left:22px;line-height:1;
  animation:handGrab 1.5s ease-in-out infinite}
@keyframes handGrab{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(2deg)}}

/* NOVA INFO */
.nova-info{text-align:center;margin-bottom:16px}

.nova-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}

/* PULSE */
.anon-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;

.switch input:checked+.slider::before{transform:translateX(16px)}

/* TOAST */
#toast-wrap{position:fixed;top:calc(var(--safe-top) + var(--header-h) + 12px);left:50%;
  transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:6px;

  align-items:center;gap:9px;opacity:0;transform:translateY(-10px);

</head>
<body>

<div id="header"></div>
<main id="main">
  <section class="page" id="page-friends"></section>
  <section class="page" id="page-nova"></section>
  <section class="page" id="page-pulse"></section>
  <section class="page" id="page-profile"></section>
</main>
<nav id="tabs"><div id="tabs-inner"><div class="tab-indicator" id="tab-indicator"></div></div></nav>
<div id="toast-wrap"></div>
<div id="hand-cursor">
  <div class="hand-avatar"><img id="hand-avatar-img" src="" alt=""></div>
  <div class="hand-icon">🖐️</div>
</div>

<script>
(function(){
'use strict';

const tg = window.Telegram?.WebApp;
if (tg){ try{tg.ready()}catch(_){}; try{tg.expand()}catch(_){} }
function haptic(t){ try{tg?.HapticFeedback?.impactOccurred(t||'light')}catch(_){} }

const I = {
  people:'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  paw:'<svg viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="9" cy="10" r="2"/><path d="M9 14a4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4z"/></svg>',
  pulse:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  user:'<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  check:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  x:'<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  feed:'<svg viewBox="0 0 24 24"><path d="M4 5h16l-2 4H6zM6 9v10h12V9M9 13h6"/></svg>',
  play:'<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>',
  sleep:'<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  empty:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
};

const LS_KEY = 'orbit_v7';
const state = {
  tab: 'friends', query: '', result: null, error: null,
  connections: [], pending: new Map(), // username -> {name, photo, requestedAt}
  nova: { food: 68, happy: 54, energy: 41, level: 3, xp: 340, xpMax: 500,
    x: 0, y: 0 }, // floor coords
  balance: 1250, notifications: true
};
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({
    connections: state.connections,
    pending: [...state.pending.entries()],
    nova: state.nova, balance: state.balance, notifications: state.notifications
  })) }catch(_){}
}
function load(){
  try{ const r = localStorage.getItem(LS_KEY); if(!r) return;
    const d = JSON.parse(r);
    if (Array.isArray(d.connections)) state.connections = d.connections;
    if (Array.isArray(d.pending)) state.pending = new Map(d.pending);
    if (d.nova) state.nova = { ...state.nova, ...d.nova };
    if (typeof d.balance === 'number') state.balance = d.balance;
    if (typeof d.notifications === 'boolean') state.notifications = d.notifications;
  }catch(_){}
}

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

function getUserInfo(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? ((u.first_name||'')+(u.last_name?' '+u.last_name:'')).trim() : 'You';
  const photo = u?.photo_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=4d9fff&textColor=ffffff`;
  return { name, photo, username: u?.username || '' };
}

/* SEARCH */
const KNOWN = {
  durov:'Pavel Durov', telegram:'Telegram', botfather:'BotFather',
  tginfo:'Telegram Info', stickers:'Stickers', premium:'Telegram Premium', gif:'GIF'
};
function search(q){
  const clean = String(q).replace(/^@/, '').trim().toLowerCase();
  if (!clean) return { error: 'empty' };
  if (clean.length < 2) return { error: 'too_short' };
  if (!/^[a-z0-9_]{2,32}$/i.test(clean)) return { error: 'invalid' };
  const isKnown = clean in KNOWN;
  return { ok: true, user: {
    username: clean,
    name: isKnown ? KNOWN[clean] : clean.charAt(0).toUpperCase() + clean.slice(1),
    photo: `https://unavatar.io/telegram/${clean}`,
    fallbackPhoto: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(clean)}&backgroundColor=4d9fff&textColor=ffffff`,
    verified: isKnown
  }};
}

/* TYPEWRITER */
function typeText(el, text, speed = 40, onDone){
  if (!el) return;
  el.innerHTML = '';
  let i = 0;
  const bar = document.createElement('span');
  bar.className = 'cursor-bar';
  el.appendChild(bar);
  function tick(){
    if (i >= text.length){ setTimeout(() => bar.remove(), 500); onDone && onDone(); return; }
    const ch = text[i++];
    const span = document.createElement('span');
    span.className = 'type-char';
    span.textContent = ch;
    el.insertBefore(span, bar);
    setTimeout(tick, speed);
  }
  tick();
}

/* TOAST */
function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?I.check:type==='error'?I.x:I.search) + `<span>${esc(text)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),280); }, 2400);
  haptic('light');
}

/* HEADER */
function renderHeader(){
  const u = getUserInfo();
  $('#header').innerHTML = `
    <div class="h-left">
      <div class="h-av"><img src="${esc(u.photo)}" alt=""></div>
      <div class="h-name">${esc(u.name)}</div>
    </div>
    <div class="h-brand">Orbit</div>
    <div class="h-right">${state.balance.toLocaleString()} 💎</div>`;
}

/* TABS */
const TABS = [
  {id:'friends', label:'Friends', icon:'people', bell:true},
  {id:'nova', label:'Nova', icon:'paw'},
  {id:'pulse', label:'Pulse', icon:'pulse'},
  {id:'profile', label:'Profile', icon:'user'}
];
let tabWidth = 0;

function renderTabs(){
  const inner = $('#tabs-inner');
  inner.querySelectorAll('.tab-btn').forEach(b => b.remove());
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.tab===t.id?' active':'');
    b.dataset.tab = t.id;
    b.innerHTML = `<span class="tab-icon">${I[t.icon]}${t.bell?'<span class="tab-bell">🔔</span>':''}</span><span>${t.label}</span>`;
    inner.appendChild(b);
  });
  requestAnimationFrame(() => {
    tabWidth = (inner.clientWidth - 10) / TABS.length;
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
  });
}

function setTabIndicator(idx, animate){
  const ind = $('#tab-indicator');
  if (!ind) return;
  if (!animate) ind.classList.add('dragging');
  else ind.classList.remove('dragging');
  ind.style.transform = `translateX(${idx * tabWidth}px)`;
  if (!animate) { void ind.offsetWidth; requestAnimationFrame(()=>ind.classList.remove('dragging')); }
}

function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');
  $('#page-'+state.tab)?.classList.remove('active');
  state.tab = tab;
  $('#page-'+tab).classList.add('active');
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  setTabIndicator(TABS.findIndex(t => t.id === tab), true);
  if (tab==='friends') renderFriends();
  if (tab==='nova') renderNova();
  if (tab==='pulse') renderPulse();
  if (tab==='profile') renderProfile();
}

/* TAB SLIDER - fixed for mobile */
function initTabSlider(){
  const inner = $('#tabs-inner');
  const ind = $('#tab-indicator');
  let dragging = false, moved = false, startX = 0, startIdx = 0;

  function getX(e){
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return e.clientX;
  }
  function getY(e){
    if (e.touches && e.touches.length) return e.touches[0].clientY;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
    return e.clientY;
  }

  function onDown(e){
    const x = getX(e);
    const y = getY(e);
    dragging = true;
    moved = false;
    startX = x;
    startIdx = TABS.findIndex(t => t.id === state.tab);
    ind.classList.add('dragging');
  }

  function onMove(e){
    if (!dragging) return;
    const x = getX(e);
    const dx = x - startX;
    if (Math.abs(dx) > 6) moved = true;
    if (moved){
      e.preventDefault();
      const w = tabWidth;
      const maxX = (TABS.length - 1) * w;
      const target = clamp(startIdx * w + dx, 0, maxX);
      ind.style.transform = `translateX(${target}px)`;
    }
  }

  function onUp(e){
    if (!dragging) return;
    dragging = false;
    ind.classList.remove('dragging');
    const x = getX(e);
    const innerRect = inner.getBoundingClientRect();
    const relX = x - innerRect.left - 5;
    let idx;
    if (!moved){
      idx = Math.floor(relX / tabWidth);
    } else {
      idx = Math.round(relX / tabWidth);
    }
    idx = clamp(idx, 0, TABS.length - 1);
    ind.style.transform = `translateX(${idx * tabWidth}px)`;
    if (TABS[idx].id !== state.tab){
      haptic('medium');
      switchTab(TABS[idx].id);
    } else {
      setTabIndicator(idx, true);
    }
  }

  inner.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', () => {
    if (!dragging) return;
    dragging = false;
    ind.classList.remove('dragging');
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), true);
  });
  // Fallback for browsers without pointer events
  inner.addEventListener('touchstart', onDown, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onUp);
  window.addEventListener('resize', () => {
    tabWidth = (inner.clientWidth - 10) / TABS.length;
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
  });
}

/* FRIENDS PAGE */
let lastResultUsername = null;
let searchTimer = null;
let searchPending = false;

function renderFriends(){
  const page = $('#page-friends');

  let resultHtml = '';
  if (state.error){
    const t = {empty:'Type a username',too_short:'Too short',invalid:'Invalid username'};
    const x = {empty:'Enter a @username.',too_short:'At least 2 characters.',
      invalid:'Only letters, numbers, underscore.'};
    resultHtml = `<div class="results"><div class="state-msg">${I.empty}
      <div class="state-title">${t[state.error]||'Error'}</div>
      <div class="state-text">${x[state.error]||''}</div></div></div>`;
  } else if (state.result){
    resultHtml = `<div class="results">${renderResultCard(state.result)}</div>`;
  }

  // Pending list
  const pendingArr = [...state.pending.entries()];
  const pendingHtml = pendingArr.length
    ? `<div class="pending-list">
        <div class="chat-list-head">
          <div class="chat-list-title">Pending requests</div>
          <div class="chat-list-count">${pendingArr.length}</div>
        </div>
        ${pendingArr.map(([username, data]) => `
          <div class="pend-row">
            <div class="pend-av"><img src="${esc(data.photo)}" alt=""
              onerror="this.src='${esc(data.fallbackPhoto||'')}'"></div>
            <div class="pend-body">
              <div class="pend-name">${esc(data.name)}</div>
              <div class="pend-handle">@${esc(username)}</div>
            </div>
            <div class="pend-status"><span class="spin">⏳</span> Waiting</div>
          </div>`).join('')}
      </div>`
    : '';

  // Chat-style connections
  const connHtml = state.connections.length
    ? `<div class="chat-list">
        <div class="chat-list-head">
          <div class="chat-list-title">Your connections</div>
          <div class="chat-list-count">${state.connections.length}</div>
        </div>
        ${state.connections.map((c, i) => {
          const previews = [
            'Tap to open chat',
            'Say hi 👋',
            'Message on Telegram',
            'Start a conversation'
          ];
          const preview = previews[i % previews.length];
          const isOnline = Math.random() > 0.5;
          const timeAgo = ['now', '2m', '5m', '12m', '1h'][i % 5];
          return `
          <div class="chat-row" data-open="${esc(c.username)}" style="animation-delay:${i*50}ms">
            <div class="chat-av">
              <img src="${esc(c.photo)}" alt=""
                onerror="this.src='${esc(c.fallbackPhoto||'')}'">
              ${isOnline ? '<span class="chat-online"></span>' : ''}
            </div>
            <div class="chat-body">
              <div class="chat-name-row">
                <div class="chat-name">${esc(c.name)}</div>
                <div class="chat-time">${timeAgo}</div>
              </div>
              <div class="chat-preview">
                <span>${esc(preview)}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`
    : `<div class="chat-list">
        <div class="chat-list-head">
          <div class="chat-list-title">Your connections</div>
          <div class="chat-list-count">0</div>
        </div>
        <div class="chat-empty">Nobody yet.<br>Search a username above to send your first request.</div>
      </div>`;

  page.innerHTML = `
    <div class="search-hero">
      <div class="search-title">Find people</div>
      <div class="search-sub">Search any Telegram user by @username</div>
      <div class="search-wrap">
        ${I.search}
        <input class="search-input" id="search-input" placeholder="@durov"
          value="${esc(state.query)}" autocomplete="off" autocapitalize="none"
          autocorrect="off" spellcheck="false">
        <button class="search-clear ${state.query?'show':''}" id="search-clear">✕</button>
        <div class="search-status" id="search-status">typing…</div>
      </div>
      <div class="chips">
        <button class="chip" data-try="durov">⭐ @durov</button>
        <button class="chip" data-try="telegram">💬 @telegram</button>
        <button class="chip" data-try="botfather">🤖 @botfather</button>
      </div>
    </div>
    ${resultHtml}
    ${pendingHtml}
    ${connHtml}`;

  wireFriends();

  if (state.result && state.result.username !== lastResultUsername){
    lastResultUsername = state.result.username;
    const nameEl = document.getElementById('result-name');
    if (nameEl) typeText(nameEl, state.result.name, 55);
  }
  if (!state.result) lastResultUsername = null;
}

function wireFriends(){
  const input = $('#search-input');
  if (!input) return;

  input.addEventListener('input', e => {
    state.query = e.target.value;
    $('#search-clear')?.classList.toggle('show', !!state.query);
    clearTimeout(searchTimer);

    // Show "typing…" indicator while waiting
    const status = $('#search-status');
    if (status) status.classList.toggle('show', !!state.query.trim());

    if (!state.query.trim()){
      state.result = null; state.error = null;
      renderFriends();
      return;
    }

    // Longer debounce (700ms) so user can finish typing without result flashing
    searchTimer = setTimeout(() => {
      if (status) status.classList.remove('show');
      doSearch(state.query);
    }, 700);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      clearTimeout(searchTimer);
      $('#search-status')?.classList.remove('show');
      doSearch(state.query);
      input.blur();
    }
  });

  $('#search-clear')?.addEventListener('click', () => {
    state.query = ''; state.result = null; state.error = null;
    renderFriends();
  });

  $$('[data-try]').forEach(chip => chip.addEventListener('click', () => {
    clearTimeout(searchTimer);
    state.query = '@' + chip.dataset.try;
    doSearch(chip.dataset.try);
  }));

  $$('[data-open]').forEach(row => row.addEventListener('click', () => openChat(row.dataset.open)));

  const sliderEl = $('#lg-slider');
  if (sliderEl) setupLiquidSlider(sliderEl, () => sendRequest(state.result));
}

function doSearch(q){
  const r = search(q);
  if (r.error){ state.error = r.error; state.result = null; }
  else { state.result = r.user; state.error = null; haptic('medium'); }
  renderFriends();
}

function renderResultCard(u){
  const isPending = state.pending.has(u.username);
  const isConnected = state.connections.some(c => c.username.toLowerCase() === u.username.toLowerCase());

  let actionHtml;
  if (isConnected){
    actionHtml = `<div class="connected-badge">${I.check}<span>Connected</span></div>`;
  } else if (isPending){
    actionHtml = `<div class="pending-badge"><span class="spin">⏳</span><span>Request sent · waiting for acceptance</span></div>`;
  } else {
    actionHtml = `<div class="lg-slider" id="lg-slider">
      <div class="lg-fill"></div>
      <div class="lg-text">Slide to send request</div>
      <div class="lg-knob"><div class="lg-knob-inner">${I.arrow}</div></div>
    </div>`;
  }

  return `
    <div class="result-card">
      <div class="result-header">
        <div class="result-av">
          <img src="${esc(u.photo)}" alt=""
            onerror="this.onerror=null;this.src='${esc(u.fallbackPhoto)}'">
        </div>
        <div class="result-info">
          <div class="result-name-row">
            <div class="result-name" id="result-name">${esc(u.name)}</div>
            ${u.verified ? `<span class="result-verified"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>` : ''}
          </div>
          <div class="result-handle">@${esc(u.username)}</div>
        </div>
      </div>
      ${actionHtml}
    </div>`;
}

/* SEND REQUEST */
function sendRequest(user){
  if (!user) return;
  if (state.connections.some(c => c.username.toLowerCase() === user.username.toLowerCase())){
    toast('Already connected', 'info'); return;
  }
  if (state.pending.has(user.username)){ toast('Request already sent', 'info'); return; }

  state.pending.set(user.username, {
    name: user.name,
    photo: user.photo,
    fallbackPhoto: user.fallbackPhoto,
    requestedAt: Date.now()
  });
  save();
  haptic('heavy');
  toast(`Request sent to @${user.username}`, 'success');
  renderFriends();

  // Simulate acceptance
  const delay = 8000 + Math.random() * 7000;
  setTimeout(() => {
    if (!state.pending.has(user.username)) return;
    state.pending.delete(user.username);
    state.connections.unshift({
      username: user.username,
      name: user.name,
      photo: user.photo,
      fallbackPhoto: user.fallbackPhoto,
      connectedAt: Date.now()
    });
    save();
    haptic('heavy');
    toast(`@${user.username} accepted your request`, 'success');
    if (state.tab === 'friends') renderFriends();
    if (state.tab === 'profile') renderProfile();
  }, delay);
}

function openChat(username){
  const clean = String(username).replace(/^@/, '');
  haptic('medium');
  try {
    if (tg?.openTelegramLink){ tg.openTelegramLink('https://t.me/' + clean); return; }
  } catch(_){}
  window.open('https://t.me/' + clean, '_blank');
}

/* LIQUID GLASS SLIDER */
function setupLiquidSlider(el, onComplete){
  const knob = el.querySelector('.lg-knob');
  const fill = el.querySelector('.lg-fill');
  const text = el.querySelector('.lg-text');
  let dragging = false, startX = 0, currentX = 0, maxX = 0;

  function measure(){ maxX = el.offsetWidth - knob.offsetWidth - 8; }
  requestAnimationFrame(measure);
  window.addEventListener('resize', measure);

  function getX(e){
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return e.clientX;
  }

  function onDown(e){
    dragging = true;
    startX = getX(e) - currentX;
    knob.style.transition = 'none';
    fill.style.transition = 'none';
    knob.classList.add('dragging');
    haptic('light');
  }
  function onMove(e){
    if (!dragging) return;
    e.preventDefault();
    currentX = clamp(getX(e) - startX, 0, maxX);
    knob.style.transform = `translateX(${currentX}px)`;
    fill.style.width = (currentX + knob.offsetWidth + 4) + 'px';
    text.style.opacity = String(Math.max(0, 1 - currentX / (maxX * 0.4)));
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    knob.classList.remove('dragging');
    knob.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)';
    fill.style.transition = 'width .5s cubic-bezier(.34,1.56,.64,1)';
    if (currentX >= maxX * 0.8){
      currentX = maxX;
      knob.style.transform = `translateX(${maxX}px)`;
      fill.style.width = '100%';
      el.classList.add('completed');
      haptic('heavy');
      setTimeout(() => onComplete && onComplete(), 280);
    } else {
      currentX = 0;
      knob.style.transform = 'translateX(0)';
      fill.style.width = '0px';
      text.style.opacity = '1';
      haptic('light');
    }
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('touchstart', onDown, { passive: true });
  el.addEventListener('touchmove', onMove, { passive: false });
  el.addEventListener('touchend', onUp);
}

/* ============================================
   NOVA - 3D rotatable room + GIF pet
   ============================================ */
const PET_GIF = 'https://i.postimg.cc/fRqXk2SR/ezgif-21ab08378515e1ba.gif';
let roomY = 0;
let rotating = false;
let rotateStartX = 0, rotateStartY = 0, rotateStartVal = 0;

function renderNova(){
  const n = state.nova;
  const pct = Math.min(100, (n.xp / n.xpMax) * 100);
  $('#page-nova').innerHTML = `
    <div class="room-scene" id="room-scene">

        <div class="wall wall-back"></div>
        <div class="wall wall-left"></div>
        <div class="wall wall-right"></div>

        <div class="rug"></div>
        <div class="window">
          <div class="window-stars">
            <div class="window-star" style="top:20%;left:30%"></div>
            <div class="window-star" style="top:40%;left:70%;animation-delay:.5s"></div>
            <div class="window-star" style="top:65%;left:25%;animation-delay:1s"></div>
            <div class="window-star" style="top:75%;left:65%;animation-delay:1.5s"></div>
          </div>
        </div>
        <div class="poster"></div>
        <div class="bowl">🍖</div>
        <div class="ball">⚽</div>
      </div>
      <div class="pet-wrap" id="pet-wrap" style="--px:${n.x}px;--pz:${n.y}px;--ry:${roomY}deg">
        <div class="pet-shadow"></div>
        <img class="pet-img" id="pet-img" src="${PET_GIF}" alt="Nova">
      </div>
    </div>

    <div class="nova-info">
      <div class="nova-name">Nova</div>
      <div class="nova-meta">Level ${n.level} · ${state.connections.length} friends</div>
    </div>

    <div class="nova-bars">
      ${['food','happy','energy'].map((k,i)=>`
        <div class="bar-row">
          <div class="bar-head"><span>${k[0].toUpperCase()+k.slice(1)}</span><span>${n[k]}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${n[k]}%;background:${['#34d399','#fbbf24','#4d9fff'][i]}"></div></div>
        </div>`).join('')}
    </div>

    <div class="nova-btns">
      <button data-care="feed">${I.feed}<span>Feed</span></button>
      <button data-care="play">${I.play}<span>Play</span></button>
      <button data-care="sleep">${I.sleep}<span>Sleep</span></button>
    </div>

    <div class="chat-list" style="margin-top:16px">
      <div class="chat-list-head">
        <div class="chat-list-title">Level progress</div>
        <div class="chat-list-count">${n.xp}/${n.xpMax}</div>
      </div>
      <div style="padding:0 18px 16px">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      </div>
    </div>`;

  $$('[data-care]').forEach(b => b.addEventListener('click', () => care(b.dataset.care)));
  initRoomInteraction();
  updatePetPosition();
}

function initRoomInteraction(){
  const scene = $('#room-scene');
  const room = $('#room');
  const pet = $('#pet-wrap');
  if (!scene || !room || !pet) return;

  let petDragging = false;
  let petStartX = 0, petStartY = 0;
  let petStartPX = state.nova.x, petStartPZ = state.nova.y;

  function getPt(e){
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  // Room rotation - drag anywhere on scene except pet
  scene.addEventListener('pointerdown', e => {
    if (e.target.closest('#pet-wrap')) return;
    rotating = true;
    const p = getPt(e);
    rotateStartX = p.x;
    rotateStartY = p.y;
    rotateStartVal = roomY;
    scene.style.cursor = 'grabbing';
  });

  // Pet drag
  pet.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    petDragging = true;
    const p = getPt(e);
    petStartX = p.x;
    petStartY = p.y;
    petStartPX = state.nova.x;
    petStartPZ = state.nova.y;
    pet.classList.add('dragging');
    showHand(p.x, p.y);
    haptic('medium');
  });

  document.addEventListener('pointermove', e => {
    const p = getPt(e);

    if (rotating){
      const dx = p.x - rotateStartX;
      roomY = clamp(rotateStartVal + dx * 0.45, -50, 50);
      room.style.transform = `rotateX(-18deg) rotateY(${roomY}deg)`;
      updatePetPosition();
    }

    if (petDragging){
      updateHandPos(p.x, p.y);
      const dx = p.x - petStartX;
      const dy = p.y - petStartY;
      const theta = roomY * Math.PI / 180;
      // Inverse rotation to convert screen delta to floor coords
      const dfx = dx * Math.cos(theta) + (dy / 0.45) * Math.sin(theta);
      const dfz = -dx * Math.sin(theta) + (dy / 0.45) * Math.cos(theta);
      state.nova.x = clamp(petStartPX + dfx, -100, 100);
      state.nova.y = clamp(petStartPZ + dfz, -100, 100);
      pet.style.setProperty('--px', state.nova.x + 'px');
      pet.style.setProperty('--pz', state.nova.y + 'px');
    }
  }, { passive: false });

  document.addEventListener('pointerup', () => {
    if (rotating){
      rotating = false;
      scene.style.cursor = '';
    }
    if (petDragging){
      petDragging = false;
      pet.classList.remove('dragging');
      hideHand();
      save();
      haptic('light');
    }
  });

  // Touch fallback
  scene.addEventListener('touchstart', e => {
    if (e.target.closest('#pet-wrap')) return;
    rotating = true;
    const p = getPt(e);
    rotateStartX = p.x;
    rotateStartY = p.y;
    rotateStartVal = roomY;
  }, { passive: true });
  pet.addEventListener('touchstart', e => {
    e.preventDefault();
    petDragging = true;
    const p = getPt(e);
    petStartX = p.x;
    petStartY = p.y;
    petStartPX = state.nova.x;
    petStartPZ = state.nova.y;
    pet.classList.add('dragging');
    showHand(p.x, p.y);
    haptic('medium');
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    const p = getPt(e);
    if (rotating){
      e.preventDefault();
      const dx = p.x - rotateStartX;
      roomY = clamp(rotateStartVal + dx * 0.45, -50, 50);
      room.style.transform = `rotateX(-18deg) rotateY(${roomY}deg)`;
      updatePetPosition();
    }
    if (petDragging){
      e.preventDefault();
      updateHandPos(p.x, p.y);
      const dx = p.x - petStartX;
      const dy = p.y - petStartY;
      const theta = roomY * Math.PI / 180;
      const dfx = dx * Math.cos(theta) + (dy / 0.45) * Math.sin(theta);
      const dfz = -dx * Math.sin(theta) + (dy / 0.45) * Math.cos(theta);
      state.nova.x = clamp(petStartPX + dfx, -100, 100);
      state.nova.y = clamp(petStartPZ + dfz, -100, 100);
      pet.style.setProperty('--px', state.nova.x + 'px');
      pet.style.setProperty('--pz', state.nova.y + 'px');
    }
  }, { passive: false });
  document.addEventListener('touchend', () => {
    if (rotating){ rotating = false; }
    if (petDragging){
      petDragging = false;
      pet.classList.remove('dragging');
      hideHand();
      save();
    }
  });
}

function updatePetPosition(){
  const pet = $('#pet-wrap');
  if (!pet) return;
  pet.style.setProperty('--ry', roomY + 'deg');
}

function showHand(x, y){
  const h = $('#hand-cursor');
  const u = getUserInfo();
  $('#hand-avatar-img').src = u.photo;
  h.classList.add('active');
  updateHandPos(x, y);
}
function updateHandPos(x, y){
  const h = $('#hand-cursor');
  h.style.left = (x + 12) + 'px';
  h.style.top = (y + 12) + 'px';
}
function hideHand(){
  $('#hand-cursor').classList.remove('active');
}

/* NOVA actions */
function care(kind){
  const n = state.nova;
  if (kind==='feed'){ n.food=clamp(n.food+18,0,100); n.energy=clamp(n.energy-5,0,100); n.xp+=15; }
  if (kind==='play'){ n.happy=clamp(n.happy+16,0,100); n.energy=clamp(n.energy-12,0,100); n.xp+=20; }
  if (kind==='sleep'){ n.energy=clamp(n.energy+22,0,100); n.food=clamp(n.food-4,0,100); n.xp+=10; }
  if (n.xp >= n.xpMax){ n.level++; n.xp=0; n.xpMax=Math.round(n.xpMax*1.2);
    toast('Nova leveled up', 'success'); haptic('heavy'); }
  else haptic('light');
  save(); renderNova();
}
