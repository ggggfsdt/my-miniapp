<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<title>Mini Royale</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#06080f;color:#e8eefc;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;
    background:radial-gradient(120% 75% at 50% -10%,#233a6e 0%,transparent 52%),radial-gradient(90% 55% at 50% 118%,#3a1c66 0%,transparent 55%),linear-gradient(180deg,#050810 0%,#0a1020 100%);
    z-index:10;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px);overflow:hidden}
  .screen.show{display:flex}
  #screenMenu .logoWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:24px;position:relative}

  @keyframes menuOrb{0%,100%{transform:scale(1) rotate(0);opacity:.8}50%{transform:scale(1.18) rotate(180deg);opacity:1}}
  #screenMenu .logo{font-size:46px;font-weight:900;letter-spacing:3px;line-height:.95;background:linear-gradient(180deg,#fff 0%,#a8e8ff 40%,#3a86ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 28px rgba(80,180,255,.55));animation:logoFloat 3.2s ease-in-out infinite;position:relative;z-index:1;text-align:center}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #screenMenu .sub{font-size:11px;letter-spacing:9px;opacity:.6;font-weight:900;padding-left:10px;position:relative;z-index:1;padding-bottom:8px}
  #screenMenu .crownRow{margin-top:32px;display:flex;gap:12px;align-items:center;padding:12px 26px;border-radius:26px;background:linear-gradient(180deg,rgba(255,215,100,.14),rgba(255,215,100,.03));border:1.5px solid rgba(255,215,100,.4);box-shadow:0 10px 30px rgba(255,180,80,.24),inset 0 1px 0 rgba(255,255,255,.2);position:relative;z-index:1}

  #screenMenu .crownRow .n{font-size:22px;font-weight:900;color:#ffd166;text-shadow:0 0 18px rgba(255,209,102,.7);font-variant-numeric:tabular-nums}
  #screenMenu .crownRow .lbl{font-size:9px;font-weight:900;letter-spacing:2.5px;opacity:.7}
  .menuBtns{display:flex;flex-direction:column;gap:12px;padding:0 34px 44px;position:relative;z-index:1}
  .btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:15px;font-weight:900;letter-spacing:1.6px;cursor:pointer;transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit}
  .btn:active{transform:translateY(3px)}
  .btn-primary{color:#03121e;background:linear-gradient(180deg,#b0f0ff 0%,#5ec3f8 50%,#2b8fd0 100%);box-shadow:0 5px 0 #175a8a,0 14px 30px rgba(60,170,240,.5),inset 0 1px 0 rgba(255,255,255,.65)}
  .btn-primary:active{box-shadow:0 2px 0 #175a8a,0 4px 12px rgba(60,170,240,.4)}
  .btn-secondary{color:#dfe7f5;background:linear-gradient(180deg,#3d4d69 0%,#1c2436 100%);box-shadow:0 5px 0 #0b0f1a,0 14px 30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);border:1px solid rgba(120,180,255,.22)}
  .btn-secondary:active{box-shadow:0 2px 0 #0b0f1a}
  .btn-danger{color:#fff;background:linear-gradient(180deg,#ff8a8a 0%,#d63030 100%);box-shadow:0 5px 0 #7a1515,0 14px 30px rgba(255,80,80,.4),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-ghost{background:transparent;color:#8fa8c8;box-shadow:none;border:1.5px solid rgba(120,180,255,.2);padding:11px;font-size:11px;letter-spacing:1px}
  .scrTop{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 14px 10px;gap:10px}
  .scrTitle{font-size:20px;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,#fff,#9ab8e0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .iconBtn{width:40px;height:40px;border-radius:13px;border:1.5px solid rgba(120,180,255,.32);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));color:#dfe7f5;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;backdrop-filter:blur(8px)}
  .deckBar{flex:0 0 auto;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:6px 12px 4px}
  .deckSlot{aspect-ratio:1/1.35;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1.5px dashed rgba(120,180,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.4;transition:all .2s;position:relative;overflow:hidden}
  .deckSlot.filled{opacity:1;border:1.5px solid var(--c);background:radial-gradient(circle at 50% 32%,var(--cl) 0%,transparent 72%),linear-gradient(180deg,var(--c2),var(--c1));box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2),0 0 10px var(--cg)}
  .deckInfo{flex:0 0 auto;text-align:center;font-size:10px;opacity:.6;padding:4px 0 6px;letter-spacing:1.5px;font-weight:900}
  .deckInfo b{color:#7fd6ff;font-weight:900;font-size:12px}
  .deckInfo b.full{color:#6ee7a0;text-shadow:0 0 10px rgba(110,231,160,.6)}
  .deckInfo .hint{display:block;font-size:9px;opacity:.55;letter-spacing:.5px;margin-top:2px;font-weight:600;color:#8fa8c8}
  .deckActions{display:flex;gap:6px;padding:0 12px 8px;flex:0 0 auto}
  .deckActions .btn{flex:1;padding:10px;font-size:10px;letter-spacing:.8px}
  .cardGrid{flex:1 1 auto;overflow-y:auto;padding:2px 10px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;-webkit-overflow-scrolling:touch}
  .cardGrid::-webkit-scrollbar{width:0}
  .gridCard{position:relative;aspect-ratio:1/1.35;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,#20293c,#0d1320);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,box-shadow .2s;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);border-width:2px;border-style:solid}
  .gridCard.rarity-common{border-color:#8892a4}.gridCard.rarity-rare{border-color:#3a86ff;box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 12px rgba(94,184,255,.35)}
  .gridCard.rarity-epic{border-color:#8b2fe0;box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 14px rgba(201,165,255,.5)}
  .gridCard.rarity-legendary{border-color:#d8801a;box-shadow:0 4px 10px rgba(0,0,0,.55),0 0 16px rgba(255,184,77,.6)}
  .gridCard.rarity-holy{border-color:#d4a800;background:linear-gradient(180deg,#2a2418,#1a1508);box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 22px rgba(255,224,102,.85),inset 0 0 16px rgba(255,224,102,.2);animation:holyPulse 2.4s ease-in-out infinite}
  @keyframes holyPulse{0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 22px rgba(255,224,102,.85),inset 0 0 16px rgba(255,224,102,.2)}50%{box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 34px rgba(255,224,102,1),inset 0 0 24px rgba(255,224,102,.35)}}

  .gridCard::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
  .gridCard.inDeck{border-color:#ffd166 !important;box-shadow:0 0 16px rgba(255,209,102,.7),0 4px 10px rgba(0,0,0,.55) !important;animation:none}
  .gridCard .gcCost{position:absolute;top:4px;left:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:linear-gradient(180deg,#d874ff,#7a1fd0);border:1.5px solid #1b1128;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;z-index:3;box-shadow:0 2px 6px rgba(160,50,255,.75)}
  .gridCard .gcCost.cheap{background:linear-gradient(180deg,#8fffbc,#22a55c)}
  .gridCard .gcCost.boss{background:linear-gradient(180deg,#ffb0ff,#d030d0)}
  .gridCard .gcCost.holy{background:linear-gradient(180deg,#fff2b0,#d4a800);color:#2a1a00}
  .gridCard .gcInDeck{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:linear-gradient(180deg,#ffd166,#e09a2a);color:#3a1f00;font-size:10px;font-weight:900;display:none;align-items:center;justify-content:center;z-index:3}
  .gridCard.inDeck .gcInDeck{display:flex}
  .gridCard .gcIcon{font-size:26px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7));position:relative;z-index:2}
  .gridCard .gcName{font-size:7px;font-weight:900;opacity:.95;margin-top:4px;text-transform:uppercase;letter-spacing:.2px;text-align:center;padding:0 2px;position:relative;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.95);line-height:1.1}
  .gridCard .gcTag{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:6px;font-weight:900;padding:1.5px 4px;border-radius:4px;background:rgba(0,0,0,.75);color:#7fd6ff;text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(120,220,255,.35);z-index:2;white-space:nowrap}
  .gridCard.rarity-holy .gcTag{color:#ffe066;border-color:rgba(255,224,102,.7)}
  #cardDetail{position:fixed;inset:0;display:none;flex-direction:column;background:radial-gradient(120% 65% at 50% 0%,rgba(120,180,255,.14),transparent 60%),linear-gradient(180deg,#050810 0%,#0a1020 100%);z-index:100;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px)}
  #cardDetail.show{display:flex;animation:cdIn .28s cubic-bezier(.34,1.3,.64,1)}
  @keyframes cdIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .cdHead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:12px}
  .cdTitle{font-size:22px;font-weight:900;letter-spacing:.8px;background:linear-gradient(180deg,#fff,#9ab8e0);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
  .cdRarityRow{display:flex;gap:6px;margin-top:6px;align-items:center}
  .cdRarity{display:inline-block;font-size:8.5px;letter-spacing:2.5px;font-weight:900;padding:2.5px 9px;border-radius:7px;color:#0a1420}
  .cdRarity.r-common{background:linear-gradient(180deg,#c8cfdc,#8892a4)}.cdRarity.r-rare{background:linear-gradient(180deg,#9beaff,#3a86ff);color:#fff}.cdRarity.r-epic{background:linear-gradient(180deg,#e0c0ff,#8b2fe0);color:#fff}.cdRarity.r-legendary{background:linear-gradient(180deg,#ffd88a,#d8801a);color:#fff}.cdRarity.r-holy{background:linear-gradient(180deg,#fff6c2,#d4a800);color:#2a1a00;box-shadow:0 0 14px rgba(255,224,102,.85)}
  .cdSub{display:inline-block;font-size:8.5px;letter-spacing:2.5px;font-weight:900;color:#0a1420;background:linear-gradient(180deg,#9beaff,#4ab8f0);padding:2.5px 9px;border-radius:7px}
  .cdPreviewWrap{flex:0 0 auto;border-radius:14px;overflow:hidden;border:1.5px solid rgba(120,180,255,.4);background:#0a1020;margin:4px 0 10px;position:relative;box-shadow:0 14px 46px rgba(0,0,0,.8),inset 0 0 80px rgba(80,180,255,.08)}
  #previewCanvas{display:block;width:100%;height:auto}
  .cdPreviewLabel{position:absolute;top:7px;left:9px;font-size:8px;font-weight:900;letter-spacing:2px;opacity:.75;color:#9beaff;pointer-events:none;z-index:2}
  .cdPreviewLabel::before{content:'●';color:#6ee7a0;margin-right:4px;animation:blinkDot 1.2s infinite}
  @keyframes blinkDot{50%{opacity:.3}}
  .cdStats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:2px 0 8px}
  .statRow{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(120,180,255,.12);font-size:10.5px}
  .statRow .lbl{opacity:.65;font-weight:900;letter-spacing:1px;font-size:8.5px}
  .statRow .val{font-weight:900;color:#dfe7f5;font-size:12px}
  .cdDesc{flex:1 1 auto;overflow-y:auto;font-size:12px;line-height:1.55;opacity:.92;padding:12px 14px;border-radius:12px;background:linear-gradient(180deg,rgba(120,180,255,.08),rgba(120,180,255,.02));border-left:3px solid #7fd6ff;margin-bottom:10px}
  .cdDesc::-webkit-scrollbar{width:0}
  .cdDesc .tip-block{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(120,180,255,.2);font-size:11px}
  .cdDesc .tip-block b{color:#6ee7a0}
  .cdActions{display:flex;gap:10px;flex:0 0 auto}
  #app{position:fixed;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% 0%,#16233f 0%,#050810 100%);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  #app.show{display:flex}
  .topbar{flex:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:800;padding-top:env(safe-area-inset-top);gap:6px}
  .crowns{display:flex;align-items:center;gap:5px;font-size:13px;padding:4px 8px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));backdrop-filter:blur(6px)}
  .crowns.p{border:1.5px solid rgba(80,150,255,.55)}.crowns.e{border:1.5px solid rgba(255,90,90,.55)}
  .crowns b{font-size:13px;font-weight:900}
  .crowns.p b.crowns-num{color:#7fb6ff;text-shadow:0 0 10px rgba(80,150,255,.7)}
  .crowns.e b.crowns-num{color:#ff8a8a;text-shadow:0 0 10px rgba(255,90,90,.7)}
  .elixirMini{display:inline-flex;align-items:center;gap:2px;padding:1.5px 6px;border-radius:10px;background:linear-gradient(180deg,rgba(180,90,255,.5),rgba(120,50,200,.3));border:1px solid rgba(200,120,255,.65);font-size:11px;font-weight:900;color:#f0c0ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 8px rgba(200,90,255,.4);text-shadow:0 0 6px rgba(200,90,255,.8);margin-left:5px}
  .crowns.p .elixirMini{margin-left:0;margin-right:5px}
  .elixirMini b{font-size:11px;font-weight:900;font-variant-numeric:tabular-nums;min-width:10px;text-align:center}
  .timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:900;color:#dfe7f5;text-shadow:0 0 16px rgba(120,180,255,.55);padding:4px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1.5px solid rgba(120,180,255,.25);letter-spacing:1px;flex-shrink:0}
  .timer.low{color:#ff6b6b;animation:pulse .8s infinite}
  @keyframes pulse{50%{opacity:.5;transform:scale(.96)}}
  .stage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}
  #game{position:absolute;inset:0;display:block;touch-action:none}
  /* MOD MENU */
  .modBtn{position:absolute;top:56px;right:12px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,200,80,.7);
    background:radial-gradient(circle at 35% 30%,#ffe066 0%,#d4a800 60%,#7a5a00 100%);
    box-shadow:0 0 14px rgba(255,220,80,.7),inset 0 2px 0 rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:8}
  .modBtn:active{transform:scale(.9)}
  .modBtn.on{animation:modPulse 1.2s ease-in-out infinite}
  @keyframes modPulse{50%{box-shadow:0 0 30px rgba(255,220,80,1),0 0 50px rgba(255,120,255,.6),inset 0 2px 0 rgba(255,255,255,.5)}}
  .modPanel{position:absolute;top:106px;right:12px;width:210px;padding:12px;border-radius:14px;
    background:linear-gradient(180deg,rgba(30,20,50,.98),rgba(15,10,30,.98));
    border:1.5px solid rgba(255,200,80,.5);box-shadow:0 12px 30px rgba(0,0,0,.7),0 0 20px rgba(255,200,80,.3);
    z-index:9;display:none;animation:cdIn .22s}
  .modPanel.show{display:block}
  .modTitle{font-size:11px;font-weight:900;letter-spacing:2px;color:#ffd166;margin-bottom:8px;text-align:center;text-shadow:0 0 8px rgba(255,200,80,.7)}
  .modRow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.05);margin-bottom:6px;font-size:11px;font-weight:800}
  .modRow:last-child{margin-bottom:0}
  .modToggle{width:42px;height:22px;border-radius:11px;background:#333;position:relative;cursor:pointer;transition:background .2s;border:1px solid rgba(255,255,255,.1)}
  .modToggle::after{content:'';position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:#888;transition:transform .2s,background .2s}
  .modToggle.on{background:linear-gradient(180deg,#ffe066,#d4a800)}
  .modToggle.on::after{transform:translateX(20px);background:#fff}
  .specialBtn{position:absolute;right:14px;bottom:calc(100% + 8px);width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#e0c0ff 0%,#a878ff 45%,#6a2fd8 100%);box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 20px rgba(180,120,255,.8),0 6px 18px rgba(80,30,160,.7),inset 0 2px 0 rgba(255,255,255,.5);display:none;align-items:center;justify-content:center;z-index:6;color:#fff;transition:transform .12s;animation:specFloat 2.4s ease-in-out infinite}

  .specialBtn:active{transform:scale(.92)}
  .specialBtn .specIcon{font-size:24px}
  .specialBtn .specLabel{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:7.5px;font-weight:900;letter-spacing:1.2px;color:#e0c0ff;white-space:nowrap}

  .elixirRow{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:6px 14px 3px}
  .elixirTrack{position:relative;flex:1;height:17px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#1a1030,#0f0720);border:1.5px solid #4a2e70}
  .elixirFill{height:100%;width:50%;border-radius:8px;background:linear-gradient(90deg,#8b2fe0,#c94dff,#e97bff,#ff9fff);box-shadow:0 0 18px rgba(200,90,255,.85);transition:width .08s linear}
  .elixirTicks{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.6) calc(10% - 1px),rgba(0,0,0,.6) 10%)}
  .elixirNum{min-width:26px;text-align:center;font-size:17px;font-weight:900;color:#e6a8ff;text-shadow:0 0 14px rgba(200,90,255,.9);font-variant-numeric:tabular-nums}
  .dock{flex:0 0 auto;height:104px;display:flex;gap:8px;padding:8px 12px 12px}
  .hand{display:flex;gap:5px;flex:1;height:100%}
  .card{position:relative;flex:1;height:100%;border-radius:12px;background:linear-gradient(180deg,#202838 0%,#0d1220 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.34,1.56,.64,1),border-color .15s,box-shadow .2s,filter .15s;box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;touch-action:none;border-width:2px;border-style:solid}
  .card.rarity-common{border-color:#8892a4}.card.rarity-rare{border-color:#3a86ff}.card.rarity-epic{border-color:#8b2fe0}.card.rarity-legendary{border-color:#d8801a}
  .card.rarity-holy{border-color:#d4a800;background:linear-gradient(180deg,#2a2418,#1a1508);box-shadow:0 4px 12px rgba(0,0,0,.6),0 0 14px rgba(255,224,102,.7)}
  .card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,var(--c,#4a90ff) 0%,transparent 72%);opacity:.3;pointer-events:none}

const SFX = {
  ctx:null,master:null,enabled:true,volume:.3,_recent:[],
  init(){ if(this.ctx)return; try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=this.volume;this.master.connect(this.ctx.destination);}catch(e){} },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  beep(f,d,t='sine',v=.3,sw=null,dl=0){ if(!this.enabled||!this.ctx)return;const n=this.ctx.currentTime+dl;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(sw)o.frequency.exponentialRampToValueAtTime(Math.max(1,sw),n+d);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(this.master);o.start(n);o.stop(n+d+.04); },
  noise(d,v=.3,ff=1000,q=1,sw=null,dl=0){ if(!this.enabled||!this.ctx)return;const n=this.ctx.currentTime+dl;const len=Math.max(1,Math.floor(this.ctx.sampleRate*d));const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const dt=buf.getChannelData(0);for(let i=0;i<len;i++)dt[i]=Math.random()*2-1;const src=this.ctx.createBufferSource();src.buffer=buf;const fl=this.ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(ff,n);fl.Q.value=q;if(sw)fl.frequency.exponentialRampToValueAtTime(sw,n+d);const g=this.ctx.createGain();g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+d);src.connect(fl);fl.connect(g);g.connect(this.master);src.start(n);src.stop(n+d+.04); },

    const types=['fireball','ice','chain','mortar','poison','sword','holybeam','dragonbreath','necrobolt','hook','punch','boomerang'];
    const t=types[Math.floor(Math.random()*types.length)];
    const fn={fireball:()=>this.noise(.32,.22,1300,1,300),ice:()=>this.beep(1500,.14,'triangle',.15,850),chain:()=>this.noise(.14,.2,5200,10),mortar:()=>{this.beep(70,.4,'sine',.3,25);this.noise(.32,.22,300,1,100)},poison:()=>this.beep(220,.28,'sine',.12,100),sword:()=>{this.beep(880,.09,'triangle',.16,1600);this.noise(.08,.12,4200,4)},holybeam:()=>this.beep(1318,.3,'sine',.22,1975),dragonbreath:()=>{this.noise(.4,.3,600,1,180);this.beep(110,.35,'sawtooth',.24,60)},necrobolt:()=>this.beep(140,.25,'sawtooth',.18,60),hook:()=>{this.noise(.16,.18,1500,3,400);this.beep(200,.15,'sawtooth',.14,80)},punch:()=>{this.beep(180,.1,'square',.16,120);this.noise(.08,.14,900)},boomerang:()=>this.noise(.2,.16,1400,3,300)}[t];
    if(fn)fn();
  }
};

function lighten(hex,amt=.35){if(hex.startsWith('rgb'))return hex;const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);return `rgb(${r},${g},${b})`;}
function darken(hex,amt=.3){if(hex.startsWith('rgb'))return hex;const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r*(1-amt));g=Math.round(g*(1-amt));b=Math.round(b*(1-amt));return `rgb(${r},${g},${b})`;}

function resizeGame(){
  const r=stage.getBoundingClientRect();if(r.width<10)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  gameCanvas.width=Math.round(r.width*dpr);gameCanvas.height=Math.round(r.height*dpr);
  gameCanvas.style.width=r.width+'px';gameCanvas.style.height=r.height+'px';
  const s=Math.min(r.width/W,r.height/H);
  view.dpr=dpr;view.scale=s*dpr;
  view.ox=(gameCanvas.width-W*view.scale)/2;view.oy=(gameCanvas.height-H*view.scale)/2;
}
function resizePreview(){
  const r=previewCanvas.getBoundingClientRect();if(r.width<10)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  previewCanvas.width=Math.round(r.width*dpr);
  previewCanvas.height=Math.round(r.width*(PREVIEW_H/PREVIEW_W)*dpr);
  previewView.dpr=dpr;previewView.scale=(r.width*dpr)/PREVIEW_W;
}

function queueDeploy(side,key,x,y,handIndex){
  const c=CARDS[key];
  if(G.elixir[side]<c.cost)return false;
  if(side==='player'&&MOD.infiniteElixir){}else{G.elixir[side]-=c.cost;}
  const q=G.queue[side];
  if(handIndex!==undefined&&handIndex>=0&&handIndex<q.length){
    const k=q[handIndex];q.splice(handIndex,1);q.push(k);
  }
  const dt=getDeployTime(c.cost);
  G.pendingSpawns.push({side,key,x,y,timer:dt,maxTimer:dt,cost:c.cost});

function swapIllusionerWithClone(u){

function triggerMirrorSpecial(){
  const ill=G.units.find(u=>u.alive&&!u.isClone&&u.key==='illusioner'&&u.side==='player');

  for(let i=0;i<2;i++)spawnIllusionerClone(ill);

/* ================================================================
   TARGETING with LOCKING
================================================================ */
function findTarget(u){
  const foe=u.side==='player'?'enemy':'player';
  // For units-only, skip towers
  const skipTowers = u.targets==='units';
  // For buildings-only, skip units
  const skipUnits = u.targets==='buildings';

  // Check if locked target is still valid
  if (u.lockedTarget){
    const t = u.lockedTarget;
    if (t.alive && !t.untargetable && dist(u,t) < 400) {
      // Still valid
      return t;
    } else {
      u.lockedTarget = null;
    }
  }

  let best=null,bestD=Infinity;
  const searchR=Math.max(180,(u.range||0)+40);

  if(!skipUnits){
    for(const o of G.units){
      if(!o.alive||o.side!==foe||o.untargetable)continue;
      const d=dist(u,o)-o.r;
      if(d<searchR&&d<bestD){bestD=d;best=o;}
    }
  }
  if(!best && !skipTowers){
    for(const t of G.towers){
      if(!t.alive||t.side!==foe||t.carried)continue;
      let d=dist(u,t)-t.r;
      if(t.kind==='king')d+=70;
      if(d<bestD){bestD=d;best=t;}
    }
  }
  // Lock onto new target
  if (best) u.lockedTarget = best;
  return best;
}
function getGoal(u,t){
  const uTop=u.y<RIVER_Y,tTop=t.y<RIVER_Y;
  if(uTop!==tTop){
    const bx=u.lane==='L'?BRIDGES[0]:BRIDGES[1];
    if(Math.abs(u.x-bx)>9)return{x:bx,y:u.y};
    return{x:bx,y:uTop?RIVER_Y+46:RIVER_Y-46};
  }
  return{x:t.x,y:t.y};
}

/* ================================================================
   DAMAGE + KNOCKBACK VELOCITY
================================================================ */
function damage(t,amount,source){
  if(!t||!t.alive)return;
  if (MOD.oneHitKills && source && source.side === 'player') amount = 999999;
  if(t.shield>0){
    const abs=Math.min(t.shield,amount);
    t.shield-=abs;amount-=abs;t.hitFlash=.12;
    if(t.shield<=0)addParticles(t.x,t.y,7,'#9fd8ff',90,.4,2.5);
  }
  if(amount<=0)return;
  t.hp-=amount;t.hitFlash=.12;
  if(t.isTower&&t.kind==='king')t.active=true;
  if(source&&source.card&&source.card.lifesteal&&!t.isTower){
    source.hp=Math.min(source.maxHp,source.hp+amount*source.card.lifesteal);
  }
  if(t.hp<=0){
    t.hp=0;
    if(!t.isTower&&t.card&&t.card.revive&&!t.revived){
      t.revived=true;t.hp=t.maxHp*(t.card.reviveHpPct||.5);
      addRing(t.x,t.y,40,'#ff9548',.6);
      addParticles(t.x,t.y,24,'#ff9548',180,.7,4);
      addShake(5);
      SFX.beep(700,.4,'sawtooth',.25,1400);return;
    }
    // Necromancer raises
    if(!t.isTower&&t.side!==undefined){
      const necros=G.units.filter(u=>u.alive&&u.key==='necromancer'&&u.side!==t.side);
      for(const n of necros){
        if(dist(n,t)<=n.card.raiseRange){
          const sk=spawnUnit(n.side,'skeleton',t.x,t.y);
          sk.r=9;sk.spawnAnim=0;
          addRing(t.x,t.y,30,'#6a3dd9',.5);
          break;
        }
      }
    }
    // Golem split
    if(!t.isTower&&t.card&&t.card.splitsOnDeath){
      for(let i=0;i<2;i++){
        const ang=Math.random()*Math.PI*2;
        const gx=clamp(t.x+Math.cos(ang)*20,20,W-20);
        const gy=clamp(t.y+Math.sin(ang)*20,20,H-20);
        const gm=spawnUnit(t.side,'golem',gx,gy);
        gm.hp=gm.maxHp=800;gm.r=11;gm.dmg=60;gm.speed=44;
        gm.spawnAnim=.6;
      }
      addRing(t.x,t.y,50,'#a89080',.6);
      addParticles(t.x,t.y,26,'#a89080',180,.7,4);
      addShake(10);
    }
    // Balloon death bomb
    if(!t.isTower&&t.card&&t.card.deathBomb){
      splashDamage(t.side,t.x,t.y,80,t.card.deathBomb,t);
      addRing(t.x,t.y,80,'#ff6b3d',.7);
      addParticles(t.x,t.y,30,'#ff8a4a',220,.8,4.5);
      addParticles(t.x,t.y,14,'#fff2c2',160,.6,3.5);
      addShake(18);
      SFX.beep(70,.6,'sine',.3,25);
    }
    t.alive=false;
    if(t.isTower){
      if(t.carriedBy){
        // Tower being carried gets dropped
      }
      SFX.towerDie();addRing(t.x,t.y,52,'#ffcc55',.6);
      addParticles(t.x,t.y,24,'#ffb347',180,.75,4);
      addShake(14);
      if(t.side==='player')G.crowns.enemy++;else G.crowns.player++;
      if(t.side==='enemy'&&t.kind==='princess'){
        if(t.x<W/2)G.leftLaneOpen=true;else G.rightLaneOpen=true;
        addRing(t.x,t.y,130,'#7fd6ff',1.2);
        addParticles(t.x,t.y,20,'#7fd6ff',180,.9,4);
        toast('LANE OPENED!');
      }
      const king=G.towers.find(x=>x.side===t.side&&x.kind==='king');
      if(king)king.active=true;
      if(t.kind==='king')endGame(t.side==='player'?'defeat':'victory');
    }else{
      SFX.unitDie();addParticles(t.x,t.y,11,t.card.color,115,.5,3);
      addRing(t.x,t.y,22,t.card.color,.32);
    }
  }
}
function splashDamage(side,x,y,radius,dmg,source){
  const foe=side==='player'?'enemy':'player';
  for(const u of G.units){
    if(!u.alive||u.side!==foe||u.untargetable)continue;
    if(Math.hypot(u.x-x,u.y-y)<=radius+u.r)damage(u,dmg,source);
  }
}

/* ================================================================
   PROJECTILES
================================================================ */
function fireProjectile(from,target,dmg,side,splash,attackType,opts={}){
  const t=attackType||'projectile';
  G.projectiles.push({
    x:from.x,y:from.y-6,sx:from.x,sy:from.y-6,lx:target.x,ly:target.y,target,dmg,splash,side,attackType:t,
    speed:t==='mortar'?0:(t==='sniper'?900:340),color:side==='player'?'#a8e0ff':'#ffb8b8',
    life:3,dead:false,arc:t==='mortar'?52:0,t:0,dur:t==='mortar'?.75:0,
    pierce:from.card?.pierce||false,hitSet:new Set(),source:from,
    spinAngle:Math.random()*Math.PI*2,spinRate:12+Math.random()*6,
    isClone:from.isClone||false,returning:false,
  });
}
function projectileLanded(p){
  const src=p.source;
  switch(p.attackType){
    case 'fireball':
      if(p.target&&p.target.alive)damage(p.target,p.dmg,src);
      G.zones.push({x:p.x,y:p.y,r:CARDS.pyromancer.zoneRadius,dps:CARDS.pyromancer.burnDps,timer:CARDS.pyromancer.burnDuration,side:p.side,color:'#ff6b3d',maxTimer:CARDS.pyromancer.burnDuration});
      addRing(p.x,p.y,40,'#ff6b3d',.5);
      addParticles(p.x,p.y,14,'#ff9b5d',130,.55,3.5);SFX.impact();break;
    case 'ice':
      if(p.target&&p.target.alive){
        damage(p.target,p.dmg,src);
        if(!p.isClone){p.target.slowTimer=CARDS.frostmage.slowDuration;p.target.slowMult=CARDS.frostmage.slowMult;}
      }
      addParticles(p.x,p.y,10,'#a8e0ff',90,.45,2.8);SFX.impact();break;
    case 'poison':
      if(p.target&&p.target.alive){
        damage(p.target,p.dmg,src);
        if(!p.isClone){p.target.poisonTimer=CARDS.plague.poisonDuration;p.target.poisonDps=CARDS.plague.poisonDps;}
      }
      addParticles(p.x,p.y,8,'#7fd96f',80,.5,2.5);SFX.impact();break;
    case 'mortar':
      splashDamage(p.side,p.x,p.y,p.splash,p.dmg,src);
      addRing(p.x,p.y,p.splash,'#ffb060',.55);
      addParticles(p.x,p.y,18,'#ffb060',160,.65,4);addShake(8);SFX.impact();break;
    case 'bomb':
      splashDamage(p.side,p.x,p.y,p.splash,p.dmg,src);
      addRing(p.x,p.y,p.splash,'#ffd166',.5);
      addParticles(p.x,p.y,16,'#ffb060',150,.6,3.8);addShake(5);SFX.impact();break;
    case 'icespirit':
      splashDamage(p.side,p.x,p.y,p.splash,p.dmg,src);
      if(!p.isClone){
        const foe=p.side==='player'?'enemy':'player';
        for(const u of G.units){
          if(!u.alive||u.side!==foe||u.untargetable)continue;
          if(Math.hypot(u.x-p.x,u.y-p.y)<=p.splash+u.r)u.stunTimer=CARDS.icespirit.stunDuration;
        }
      }
      addRing(p.x,p.y,p.splash+10,'#a8f0ff',.6);
      addParticles(p.x,p.y,22,'#a8f0ff',130,.65,3);SFX.impact();break;
    case 'sword':
      if(p.target&&p.target.alive)damage(p.target,p.dmg,src);
      addSlash(p.x,p.y,p.spinAngle,'#c9a5ff',24);
      addParticles(p.x,p.y,8,'#c9a5ff',110,.4,3);SFX.impact();break;
    case 'chainTrap':
      if(p.target&&p.target.alive){
        damage(p.target,p.dmg,src);
        if(!p.isClone&&!p.target.isTower){p.target.stunTimer=1.6;addRing(p.target.x,p.target.y,22,'#a888ff',.55);}
      }
      addParticles(p.x,p.y,8,'#a888ff',100,.4,2.5);SFX.impact();break;
    case 'hook':
      if(p.target&&p.target.alive&&!p.target.isTower){
        damage(p.target,p.dmg,src);
        const dx=src.x-p.target.x,dy=src.y-p.target.y,d=Math.hypot(dx,dy)||1;
        const pullDist=Math.min(d-20,95);
        p.target.x+=(dx/d)*pullDist;p.target.y+=(dy/d)*pullDist;
        p.target.stunTimer=Math.max(p.target.stunTimer,0.4);
      }
      addParticles(p.x,p.y,8,'#8ecf9a',100,.35,2.5);SFX.impact();break;
    case 'stretch':
      if(p.target&&p.target.alive)damage(p.target,p.dmg,src);
      addParticles(p.x,p.y,6,'#f0a8c8',90,.35,3);SFX.impact();break;
    case 'electro':{
      const foe=p.side==='player'?'enemy':'player';
      let current=p.target;const hit=new Set();
      const pts=[{x:src.x,y:src.y-6}];
      let dmg=p.dmg;
      for(let i=0;i<3&&current&&current.alive&&!hit.has(current);i++){
        hit.add(current);damage(current,dmg,src);
        if(!current.isTower)current.stunTimer=Math.max(current.stunTimer,1.1);
        pts.push({x:current.x,y:current.y});dmg*=.75;
        let next=null,bd=60;
        for(const e of G.units){
          if(!e.alive||e.side!==foe||hit.has(e))continue;
          const dd=Math.hypot(e.x-current.x,e.y-current.y);
          if(dd<bd){bd=dd;next=e;}
        }
        current=next;
      }
      G.chains.push({points:pts,life:.3,maxLife:.3});
      addParticles(p.x,p.y,10,'#7dd8ff',130,.4,2.8);SFX.impact();break;
    }
    case 'boomerang':{
      const foe=p.side==='player'?'enemy':'player';
      for(const e of G.units){
        if(!e.alive||e.side!==foe||e.untargetable)continue;
        if(Math.hypot(e.x-p.x,e.y-p.y)<=e.r+10){
          damage(e,p.dmg,src);damage(e,p.dmg*.6,src);
        }
      }
      addParticles(p.x,p.y,14,'#d06060',150,.5,3.5);
      addRing(p.x,p.y,34,'#d06060',.4);SFX.impact();break;
    }
    case 'holy':{
      splashDamage(p.side,p.x,p.y,34,p.dmg,src);
      if(src&&src.alive){
        for(const a of G.units){
          if(!a.alive||a.side!==src.side)continue;
          if(Math.hypot(a.x-src.x,a.y-src.y)<=(src.card.healRadius||100))a.hp=Math.min(a.maxHp,a.hp+(src.card.healAmount||40)*.4);
        }
      }
      addRing(p.x,p.y,40,'#ffe066',.55);
      addParticles(p.x,p.y,20,'#ffe066',160,.6,4);SFX.impact();break;
    }
    case 'dragonbreath':{
      const foe=p.side==='player'?'enemy':'player';
      const srcAng=Math.atan2(p.ly-p.sy,p.lx-p.sx);
      for(const e of G.units){
        if(!e.alive||e.side!==foe||e.untargetable)continue;
        const dx=e.x-p.sx,dy=e.y-p.sy,d=Math.hypot(dx,dy);
        if(d>130)continue;
        const ang=Math.atan2(dy,dx);
        let diff=ang-srcAng;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
        if(Math.abs(diff)<Math.PI*.6){
          damage(e,p.dmg,src);
          if(!e.isTower){e.burnTimer=Math.max(e.burnTimer,src.card.burnDuration);e.burnDps=Math.max(e.burnDps,src.card.burnDps);}
        }
      }
      for(let i=0;i<5;i++){
        const a=srcAng+(Math.random()-.5)*1.2,r=40+Math.random()*80;
        addParticles(p.sx+Math.cos(a)*r,p.sy+Math.sin(a)*r,4,'#ff7a3d',100,.55,3.5);
      }
      addRing(p.sx,p.sy,30,'#ff7a3d',.5);addShake(4);SFX.impact();break;
    }
    case 'necrobolt':
      if(p.target&&p.target.alive)damage(p.target,p.dmg,src);
      addRing(p.x,p.y,26,'#6a3dd9',.5);
      addParticles(p.x,p.y,12,'#c9a5ff',120,.5,3.5);SFX.impact();break;
    default:
      if(p.splash>0)splashDamage(p.side,p.x,p.y,p.splash,p.dmg,src);
      else if(p.target&&p.target.alive)damage(p.target,p.dmg,src);
      addParticles(p.x,p.y,5,p.color,85,.3,2.4);SFX.impact();
  }
}

/* ================================================================
   ATTACKS
================================================================ */
function doHeal(u){
  const c=u.card;
  for(const a of G.units){
    if(!a.alive||a.side!==u.side||a===u)continue;
    if(dist(a,u)<=c.healRadius&&a.hp<a.maxHp){
      a.hp=Math.min(a.maxHp,a.hp+c.healAmount);
      addParticles(a.x,a.y-4,4,'#a8ffb0',40,.5,2.2);
    }
  }
  if(u.hp<u.maxHp)u.hp=Math.min(u.maxHp,u.hp+c.healAmount*.6);
  addRing(u.x,u.y,c.healRadius,'#a8ffb0',.55);
}
function doChainAttack(u,target){
  const c=u.card;
  const hit=new Set();let current=target;
  const pts=[{x:u.x,y:u.y-8}];let dmg=u.dmg;
  for(let i=0;i<c.chainCount;i++){
    if(!current||!current.alive||hit.has(current))break;
    hit.add(current);damage(current,u.isClone?0:dmg,u);
    pts.push({x:current.x,y:current.y-6});
    dmg*=(1-c.chainFalloff);
    let next=null,bd=c.chainRange;
    for(const e of G.units){
      if(!e.alive||e.side===u.side||hit.has(e))continue;
      const d=Math.hypot(e.x-current.x,e.y-current.y);
      if(d<bd){bd=d;next=e;}
    }
    current=next;
  }
  G.chains.push({points:pts,life:.3,maxLife:.3});
}
function doIllusionerAttack(u,target){
  const cycle=u.attackCycle%3;
  u.attackCycle=(u.attackCycle+1)%3;
  if(cycle===0){
    fireProjectile(u,target,u.dmg,u.side,0,'sword');
    addSlash(u.x+Math.cos(u.attackAngle)*12,u.y+Math.sin(u.attackAngle)*12,u.attackAngle,'#c9a5ff',16);
  }else if(cycle===1){
    if(u.isClone){addParticles(target.x,target.y,6,'#ffe9a8',80,.35,2.5);return;}
    damage(target,u.dmg,u);
    if(!target.isTower){
      const dx=target.x-u.x,dy=target.y-u.y,d=Math.hypot(dx,dy)||1;
      // Knockback velocity, not teleport
      target.kbVx=(dx/d)*260;target.kbVy=(dy/d)*260;
      target.atkTimer=Math.max(target.atkTimer||0,.5);
    }
    addSlash(target.x,target.y,u.attackAngle,'#ffd166',22);
  }else{
    fireProjectile(u,target,u.dmg*.8,u.side,0,'chainTrap');
  }
}
/* TITAN actions */
function doTitanAttack(u,target){
  // Stretch hand out to target
  u.handStretch = 1;
  u.handStretchTarget = {x:target.x,y:target.y};
  const delay = 0.12; // hand extends, then hit
  // Damage happens on the peak of the reach animation handled in update
  u._pendingTitanHit = {
    target: target,
    timer: delay,
    dmg: u.dmg,
  };
}
function doTitanGrab(u){
  const foe=u.side==='player'?'enemy':'player';
  let grabTarget=null,bestD=60;
  for(const e of G.units){
    if(!e.alive||e.side!==foe||e.untargetable)continue;
    const d=dist(u,e);
    if(d<bestD){bestD=d;grabTarget=e;}
  }
  if(grabTarget){
    u.grabbedTarget=grabTarget;
    u.grabTimer=1.0;
    grabTarget.stunTimer=Math.max(grabTarget.stunTimer,1.0);
    grabTarget.grabbed=true;
    addRing(grabTarget.x,grabTarget.y,30,'#7a4dc9',.5);
    SFX.beep(160,.35,'sine',.3,300);
  }
}
function releaseTitanGrab(u){
  const t=u.grabbedTarget;
  if(!t||!t.alive){u.grabbedTarget=null;return;}
  const dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy)||1;
  // THROW: give huge velocity (slides)
  t.kbVx=(dx/d)*500;t.kbVy=(dy/d)*500;
  t.stunTimer=Math.max(t.stunTimer,0.7);
  t.grabbed=false;
  addRing(t.x,t.y,32,'#7a4dc9',.55);
  addParticles(t.x,t.y,16,'#a888ff',160,.6,4);
  addShake(12);
  SFX.beep(120,.3,'sawtooth',.28,60);
  u.grabbedTarget=null;
}
function doTitanPull(u){
  const foe=u.side==='player'?'enemy':'player';
  addRing(u.x,u.y,140,'#7a4dc9',.6);
  addShockwave(u.x,u.y,140,'#7a4dc9',.6);
  addParticles(u.x,u.y,22,'#a888ff',200,.7,4);
  for(const e of G.units){
    if(!e.alive||e.side!==foe||e.untargetable||e.isTower)continue;
    const dx=u.x-e.x,dy=u.y-e.y,d=Math.hypot(dx,dy);
    if(d<140&&d>5){
      const pullDist=Math.min(d-30,80);
      e.kbVx+=(dx/d)*120;e.kbVy+=(dy/d)*120;
      e.stunTimer=Math.max(e.stunTimer,0.3);
    }
  }
  SFX.beep(90,.4,'sine',.28,200);
}
function doTitanJump(u,target){
  const dx=target.x-u.x,dy=target.y-u.y;
  const d=Math.hypot(dx,dy)||1;
  const jumpDist=Math.min(d-30,170);
  u._titanJumpStart = {x:u.x,y:u.y};
  u._titanJumpEnd = {x:clamp(u.x+(dx/d)*jumpDist,14,W-14),y:clamp(u.y+(dy/d)*jumpDist,14,H-14)};
  u._titanJumpT = 0;
  u._titanJumpDur = 0.55;
  u._titanJumping = true;
  u.titanJumpZ = 0;
}
/* TITAN rips tower */
function tryTitanRipTower(u){
  if (u.carriedTower) return false;
  const foe = u.side === 'player' ? 'enemy' : 'player';
  for (const t of G.towers){
    if (!t.alive || t.side !== foe || t.kind !== 'princess') continue;
    const d = dist(u, t);
    if (d < 60){
      // RIP IT!
      u.carriedTower = t;
      t.carried = true;
      t.carriedBy = u;
      // Deal huge damage to tower (but don't kill it yet - it's carried)
      t.hp = Math.max(1, t.hp - t.maxHp * 0.4);
      addShake(20);
      addRing(t.x, t.y, 60, '#7a4dc9', .8);
      addParticles(t.x, t.y, 40, '#a888ff', 220, .9, 5);
      addParticles(t.x, t.y, 20, '#fff', 180, .6, 3.5);
      SFX.beep(60, .6, 'sawtooth', .35, 25);
      haptic('heavy');
      toast('TITAN RIPPED A TOWER!');
      return true;
    }
  }
  return false;
}
function throwCarriedTower(u){
  const t = u.carriedTower;
  if (!t) return;
  t.carried = false;
  t.carriedBy = null;
  // Tower flies away
  const target = u.target || { x: u.x, y: u.y - 60 };
  const dx = target.x - u.x, dy = target.y - u.y;
  const d = Math.hypot(dx, dy) || 1;
  // Kill tower (grants crown)
  t.alive = false;
  if (t.side === 'player') G.crowns.enemy++; else G.crowns.player++;
  // Explode damage
  const throwDist = 120;
  const ex = clamp(u.x + (dx/d)*throwDist, 20, W-20);
  const ey = clamp(u.y + (dy/d)*throwDist, 20, H-20);
  const foe = u.side === 'player' ? 'enemy' : 'player';
  for (const e of G.units){
    if (!e.alive || e.side !== foe || e.untargetable) continue;
    if (Math.hypot(e.x - ex, e.y - ey) <= 100){
      damage(e, 700, u);
      // Knockback slide
      const kdx = e.x - ex, kdy = e.y - ey;
      const kd = Math.hypot(kdx, kdy) || 1;
      e.kbVx = (kdx/kd) * 400;
      e.kbVy = (kdy/kd) * 400;
    }
  }
  // Big explosion
  addShockwave(ex, ey, 130, '#7a4dc9', .9);
  addRing(ex, ey, 100, '#ffcc55', .7);
  addParticles(ex, ey, 40, '#a888ff', 260, .9, 5);
  addParticles(ex, ey, 20, '#ffb347', 200, .7, 4);
  addShake(35);
  SFX.towerDie();
  haptic('heavy');
  u.carriedTower = null;
}

/* ================================================================
   DO ATTACK
================================================================ */
function doAttack(u,target){
  const atkType=u.card.attackType||'melee';
  const now=performance.now();
  if(now-u._lastAttackSound>130){
    SFX.attack?.(u.key);
    u._lastAttackSound=now;
  }
  if(u.key==='illusioner'){doIllusionerAttack(u,target);return;}
  if(u.key==='titan'){doTitanAttack(u,target);return;}
  if(u.key==='seraph'){
    for(const a of G.units){
      if(!a.alive||a.side!==u.side)continue;
      if(Math.hypot(a.x-u.x,a.y-u.y)<=(u.card.healRadius||100))a.hp=Math.min(a.maxHp,a.hp+(u.card.healAmount||40)*.5);
    }
    addRing(u.x,u.y,u.card.healRadius||100,'#ffe066',.55);
    fireProjectile(u,target,u.dmg,u.side,0,'holy');
    return;
  }
  if(atkType==='heal'){doHeal(u);return;}
  if(atkType==='chain'){doChainAttack(u,target);return;}
  if(atkType==='mortar'){fireProjectile(u,target,u.dmg,u.side,u.card.splash,'mortar');return;}
  if(atkType==='bomb'){fireProjectile(u,target,u.dmg,u.side,u.card.splash,'bomb');return;}
  if(atkType==='icespirit'){fireProjectile(u,target,u.dmg,u.side,u.card.splash,'icespirit');return;}
  if(atkType==='fireball'){fireProjectile(u,target,u.dmg,u.side,0,'fireball');return;}
  if(atkType==='ice'){fireProjectile(u,target,u.dmg,u.side,0,'ice');return;}
  if(atkType==='poison'){fireProjectile(u,target,u.dmg,u.side,0,'poison');return;}
  if(atkType==='hook'){fireProjectile(u,target,u.dmg,u.side,0,'hook');return;}
  if(atkType==='stretch'){u.stretchAmount=1;fireProjectile(u,target,u.dmg,u.side,0,'stretch');return;}
  if(atkType==='electro'){fireProjectile(u,target,u.dmg,u.side,0,'electro');return;}
  if(atkType==='boomerang'){fireProjectile(u,target,u.dmg,u.side,0,'boomerang');return;}
  if(atkType==='holy'){fireProjectile(u,target,u.dmg,u.side,0,'holy');return;}
  if(atkType==='dragonbreath'){fireProjectile(u,target,u.dmg,u.side,0,'dragonbreath');return;}
  if(atkType==='necrobolt'){fireProjectile(u,target,u.dmg,u.side,0,'necrobolt');return;}
  if(atkType==='projectile'){
    fireProjectile(u,target,u.dmg,u.side,u.splash||0,'projectile');
    if(u.card.curseDuration&&target&&!target.isTower&&!u.isClone){target.curseTimer=u.card.curseDuration;target.curseMult=u.card.curseMult;}
    return;
  }
  if(atkType==='tesla'){
    const foe=u.side==='player'?'enemy':'player';
    for(const e of G.units){
      if(!e.alive||e.side!==foe||e.untargetable)continue;
      if(Math.hypot(e.x-u.x,e.y-u.y)<=u.range+e.r)damage(e,u.dmg,u);
    }
    addRing(u.x,u.y,u.range,'#7fd9d9',.4);
    addParticles(u.x,u.y,8,'#7fd9d9',100,.4,2.5);
    return;
  }
  if(atkType==='suicide'){
    splashDamage(u.side,u.x,u.y,u.card.splash,u.dmg,u);
    addRing(u.x,u.y,u.card.splash+20,u.key==='firespirit'?'#ff8a3d':'#ffb060',.65);
    addParticles(u.x,u.y,30,u.key==='firespirit'?'#ff8a3d':'#ff9048',220,.8,4.5);
    addShake(10);
    u.hp=0;u.alive=false;return;
  }
  // MELEE
  let dmg=u.isClone?0:u.dmg;
  if(u.key==='ramrider'&&u.chargeTimer>0&&!u.chargeUsed&&!u.isClone){
    dmg+=u.card.chargeDamage;u.chargeUsed=true;u.chargeTimer=0;
    addRing(target.x,target.y,34,'#ffcc66',.45);
    if(!target.isTower){
      const dx=target.x-u.x,dy=target.y-u.y,d=Math.hypot(dx,dy)||1;
      target.kbVx=(dx/d)*u.card.knockback*6;
      target.kbVy=(dy/d)*u.card.knockback*6;
    }
    addShake(8);
  }
  if(u.key==='ninja'&&u._dashHit&&!u.isClone){dmg+=u.card.dashDamage;u._dashHit=false;}
  if(u.splash>0){
    splashDamage(u.side,target.x,target.y,u.splash,dmg,u);
    addRing(target.x,target.y,u.splash,u.color,.3);
  }else damage(target,dmg,u);
  addParticles(u.x+Math.cos(u.attackAngle)*14,u.y+Math.sin(u.attackAngle)*14,4,'#ffe9a8',75,.28,2.5);
}

function updateElixir(dt){
  if (MOD.infiniteElixir){
    G.elixir.player = 10;
    return;
  }
  const rate = MOD.fastRefill ? 1 : (G.timeLeft<60?1/1.4:1/2.8);
  G.elixir.player=Math.min(10,G.elixir.player+rate*dt);
  G.elixir.enemy=Math.min(10,G.elixir.enemy+rate*dt);
}
function updateTowers(dt){
  for(const t of G.towers){
    if(!t.alive)continue;
    if(t.carried){
      // Tower is being carried by titan - position updated elsewhere
      continue;
    }
    if(t.hitFlash>0)t.hitFlash-=dt;
    if(t.recoil>0)t.recoil-=dt;
    if(!t.active)continue;
    t.cd-=dt;
    const foe=t.side==='player'?'enemy':'player';
    // Lock target
    let target = null;
    if (t.lockedTarget){
      const lt = t.lockedTarget;
      if (lt.alive && !lt.untargetable && dist(t, lt) < t.range * 1.6){
        target = lt;
      } else {
        t.lockedTarget = null;
      }
    }
    if (!target){
      let best=null,bd=Infinity;
      for(const u of G.units){
        if(!u.alive||u.side!==foe||u.untargetable)continue;
        const d=dist(t,u)-u.r;
        if(d<t.range&&d<bd){bd=d;best=u;}
      }
      if (best) t.lockedTarget = best;
      target = best;
    }
    if(target&&t.cd<=0){
      t.cd=t.atk;t.recoil=.25;
      fireProjectile(t,target,t.dmg,t.side,0,'projectile');
    }
  }
}
function updatePendingSpawns(dt){
  for(const p of G.pendingSpawns){
    p.timer-=dt;
    if(Math.random()<0.8){
      const a=Math.random()*Math.PI*2,r=Math.random()*22;
      addParticles(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,1,p.side==='player'?'#7fd6ff':'#ff8a8a',30,.5,2.2);
    }
    if(p.timer<=0){
      spawnCard(p.side,p.key,p.x,p.y);
      addRing(p.x,p.y,32,p.side==='player'?'#9beaff':'#ffb0b0',.35);
      addParticles(p.x,p.y,12,p.side==='player'?'#9beaff':'#ffb0b0',130,.5,3);
      p.done=true;
    }
  }
  if(G.pendingSpawns.some(p=>p.done))G.pendingSpawns=G.pendingSpawns.filter(p=>!p.done);
}
function updateUnits(dt){
  for(const u of G.units){
    if(!u.alive)continue;
    // Apply knockback velocity (SLIDING)
    if(Math.abs(u.kbVx) > 1 || Math.abs(u.kbVy) > 1){
      u.x += u.kbVx * dt;
      u.y += u.kbVy * dt;
      // Friction
      u.kbVx *= Math.pow(0.02, dt); // fast decay
      u.kbVy *= Math.pow(0.02, dt);
      // Trail particles while sliding fast
      if (Math.hypot(u.kbVx, u.kbVy) > 80 && Math.random() < 0.5){
        addParticles(u.x, u.y + u.r*0.5, 1, '#ffe9a8', 40, .3, 2.2);
      }
      u.x = clamp(u.x, 14, W-14);
      u.y = clamp(u.y, 14, H-14);
    }
    if(u.spawnAnim>0)u.spawnAnim-=dt*3.4;
    if(u.hitFlash>0)u.hitFlash-=dt;
    if(u.attackAnim>0)u.attackAnim-=dt;
    if(u.atkTimer>0)u.atkTimer-=dt;
    if(u.dashCd>0)u.dashCd-=dt;
    if(u.curseTimer>0)u.curseTimer-=dt;
    if(u.stretchAmount>0)u.stretchAmount=Math.max(0,u.stretchAmount-dt*3.5);
    if(u.handStretch>0)u.handStretch=Math.max(0,u.handStretch-dt*2.2);
    if(u.stealthTimer>0){u.stealthTimer-=dt;if(u.stealthTimer<=0)u.untargetable=false;}

    // TITAN pending hit (stretching hand anim)
    if (u._pendingTitanHit){
      u._pendingTitanHit.timer -= dt;
      if (u._pendingTitanHit.timer <= 0){
        const tgt = u._pendingTitanHit.target;
        if (tgt && tgt.alive){
          damage(tgt, u._pendingTitanHit.dmg, u);
          if (!tgt.isTower){
            const dx = tgt.x - u.x, dy = tgt.y - u.y, d = Math.hypot(dx,dy)||1;
            tgt.kbVx = (dx/d)*140;
            tgt.kbVy = (dy/d)*140;
          }
          addParticles(tgt.x, tgt.y, 12, '#a888ff', 160, .5, 3.5);
          addRing(tgt.x, tgt.y, u.card.splash+18, '#7a4dc9', .5);
          splashDamage(u.side, tgt.x, tgt.y, u.card.splash, u.dmg*0.4, u);
          addShake(6);
        }
        u._pendingTitanHit = null;
      }
    }
    if(u.stunTimer>0){u.stunTimer-=dt;u.moving=false;continue;}
    if(u.grabbedTarget){
      u.grabTimer-=dt;
      if(u.grabbedTarget.alive){
        u.grabbedTarget.x=u.x+4;
        u.grabbedTarget.y=u.y-26;
        u.grabbedTarget.moving=false;
      }
      if(u.grabTimer<=0)releaseTitanGrab(u);
      continue;
    }
    // Titan jump animation
    if (u._titanJumping){
      u._titanJumpT += dt;
      const prog = Math.min(1, u._titanJumpT / u._titanJumpDur);
      const sx = u._titanJumpStart.x, sy = u._titanJumpStart.y;
      const ex = u._titanJumpEnd.x, ey = u._titanJumpEnd.y;
      u.x = sx + (ex-sx)*prog;
      u.y = sy + (ey-sy)*prog;
      // Vertical arc
      u.titanJumpZ = Math.sin(prog*Math.PI) * 60;
      // Trail
      if (Math.random() < 0.7){
        addParticles(u.x, u.y - u.titanJumpZ, 2, '#a888ff', 60, .5, 3);
      }
      if (prog >= 1){
        u._titanJumping = false;
        u.titanJumpZ = 0;
        // LANDING - screen shake + damage + shockwave
        addShake(28);
        addShockwave(u.x, u.y, 90, '#7a4dc9', .7);
        addRing(u.x, u.y, 70, '#a888ff', .6);
        addParticles(u.x, u.y, 30, '#a888ff', 200, .8, 4.5);
        addParticles(u.x, u.y, 15, '#fff', 150, .5, 3);
        splashDamage(u.side, u.x, u.y, 55, u.dmg * 1.2, u);
        // Knockback nearby
        const foe = u.side === 'player' ? 'enemy' : 'player';
        for (const e of G.units){
          if (!e.alive || e.side !== foe || e.untargetable) continue;
          const d = dist(u, e);
          if (d < 90){
            const dx = e.x - u.x, dy = e.y - u.y, dd = Math.hypot(dx,dy)||1;
            e.kbVx = (dx/dd)*260;
            e.kbVy = (dy/dd)*260;
          }
        }
        SFX.beep(80, .5, 'sawtooth', .32, 30);
      }
      continue;
    }
    // Titan carried tower follows
    if (u.carriedTower){
      u.carriedTower.x = u.x;
      u.carriedTower.y = u.y - 46;
      u.carriedTowerTimer += dt;
      // Auto-throw after 4s
      if (u.carriedTowerTimer > 4){
        throwCarriedTower(u);
      }
    }
    let speedMult=1;
    if(u.slowTimer>0){u.slowTimer-=dt;speedMult=u.slowMult;}
    if(u.burnTimer>0){u.burnTimer-=dt;damage(u,u.burnDps*dt);}
    if(u.poisonTimer>0){u.poisonTimer-=dt;damage(u,u.poisonDps*dt);}
    if(u.maxShield>0&&u.shield<u.maxShield)u.shield=Math.min(u.maxShield,u.shield+u.card.shieldRegen*dt);
    if(u.key==='ramrider'&&u.chargeTimer>0){u.chargeTimer-=dt;speedMult*=u.card.chargeSpeedMult;}
    // Footstep particles
    if (u.moving){
      u.stepTimer -= dt;
      if (u.stepTimer <= 0 && u.r > 8){
        u.stepTimer = 0.35;
        addParticles(u.x, u.y + u.r*0.8, 2, 'rgba(200,200,180,0.6)', 30, .35, 2);
      }
    }
    // Illusioner
    if(u.key==='illusioner'&&!u.isClone){
      u.cloneTimer-=dt;
      if(u.cloneTimer<=0){
        u.cloneTimer=4.2;
        const cc=G.units.filter(x=>x.alive&&x.isClone&&x.side===u.side&&x.key==='illusioner').length;
        if(cc<3)spawnIllusionerClone(u);
      }
      u.swapTimer-=dt;
      if(u.swapTimer<=0){u.swapTimer=3.5;swapIllusionerWithClone(u);}
    }
    // TITAN abilities
    if(u.key==='titan'){
      // If carrying tower, throw it at the nearest enemy cluster
      if (u.carriedTower && u.carriedTowerTimer > 1.2){
        // Find best throw target
        const foe = u.side === 'player' ? 'enemy' : 'player';
        let throwTarget = null;
        let bestCount = 0;
        for (const e of G.units){
          if (!e.alive || e.side !== foe || e.untargetable) continue;
          let cnt = 1;
          for (const e2 of G.units){
            if (e2 === e || !e2.alive || e2.side !== foe) continue;
            if (dist(e, e2) < 60) cnt++;
          }
          if (cnt > bestCount){ bestCount = cnt; throwTarget = e; }
        }
        if (throwTarget || u.carriedTowerTimer > 2.5){
          u.target = throwTarget || {x: u.x + (u.side === 'player' ? -40 : 40), y: u.y};
          throwCarriedTower(u);
          u.carriedTowerTimer = 0;
        }
      }
      u.titanAbilityCd-=dt;
      if(u.titanAbilityCd<=0){
        u.titanAbilityCd=6;
        const foe=u.side==='player'?'enemy':'player';
        // Try rip a tower first
        if (tryTitanRipTower(u)){
          // Successfully ripped - reset cooldown shorter
          u.titanAbilityCd = 3;
        } else {
          // Otherwise grab or pull
          let meleeTgt=null,meleeD=60;
          for(const e of G.units){
            if(!e.alive||e.side!==foe||e.untargetable)continue;
            const d=dist(u,e);
            if(d<meleeD){meleeD=d;meleeTgt=e;}
          }
          if(meleeTgt&&!meleeTgt.isTower){doTitanGrab(u);u.titanAbilityCd=7;}
          else doTitanPull(u);
        }
      }
      u.titanJumpCd-=dt;u.titanRollCd-=dt;
      // Don't jump while carrying
      if (!u.carriedTower){
        const tgt=findTarget(u);
        if(tgt){
          const d=dist(u,tgt);
          if(u.titanJumpCd<=0&&d>100&&d<260){
            u.titanJumpCd=6;
            doTitanJump(u,tgt);
          }else if(u.titanRollCd<=0&&d>240){
            u.titanRollCd=12;
            u.titanRollTimer=0.8;
            addParticles(u.x,u.y,12,'#a888ff',120,.55,3.5);
            SFX.beep(140,.3,'sawtooth',.22,60);
          }
        }
      }
    }
    if(u.titanRollTimer>0){u.titanRollTimer-=dt;speedMult*=3.2;}
    if(u.stationary){
      u.moving=false;
      const tgt=findTarget(u);u.target=tgt;
      if(tgt){
        const d=dist(u,tgt)-tgt.r;
        if(d<=u.range&&d>=(u.card.minRange||0)){
          u.attackAngle=Math.atan2(tgt.y-u.y,tgt.x-u.x);
          if(u.atkTimer<=0){u.atkTimer=u.atkSpeed;u.attackAnim=.25;doAttack(u,tgt);}
        }
      }
      continue;
    }
    if(u.key==='ninja'&&u.dashCd<=0&&!u.isClone){
      const tgt=findTarget(u);
      if(tgt&&!tgt.isTower){
        const d=dist(u,tgt);
        if(d>30&&d<u.card.dashRange){
          const dx=tgt.x-u.x,dy=tgt.y-u.y,dd=Math.hypot(dx,dy);
          const dashDist=Math.min(dd-22,u.card.dashRange);
          addParticles(u.x,u.y,8,'#c9a5ff',100,.4,2.5);
          u.x+=(dx/dd)*dashDist;u.y+=(dy/dd)*dashDist;
          u.dashCd=u.card.dashCooldown;u._dashHit=true;u.atkTimer=0;
        }
      }
    }
    const target=findTarget(u);
    u.target=target;
    if(!target){u.moving=false;continue;}
    const dx=target.x-u.x,dy=target.y-u.y;
    const cd=Math.hypot(dx,dy);
    const edgeDist=cd-(u.r+target.r);
    const ang=Math.atan2(dy,dx);
    let atkSpeed=u.atkSpeed;
    if(u.card.rageThresholds){
      const hf=u.hp/u.maxHp;
      for(const th of u.card.rageThresholds){if(hf<th.hp)atkSpeed/=(1+th.bonus);}
    }
    if(edgeDist<=u.range){
      u.moving=false;u.attackAngle=ang;
      if(u.atkTimer<=0){u.atkTimer=atkSpeed;u.attackAnim=.22;doAttack(u,target);}
    }else{
      u.moving=true;
      const goal=getGoal(u,target);
      let gx=goal.x-u.x,gy=goal.y-u.y;
      const gl=Math.hypot(gx,gy);
      if(gl>0.6){
        gx/=gl;gy/=gl;
        u.x+=gx*u.speed*speedMult*dt;
        u.y+=gy*u.speed*speedMult*dt;
        u.facing=Math.atan2(gy,gx);
      }
    }
  }
}
function separate(){
  const arr=G.units;
  for(let i=0;i<arr.length;i++){
    const a=arr[i];
    if(!a.alive||a.stationary||a.phasing||a.grabbed||a._titanJumping)continue;
    for(let j=i+1;j<arr.length;j++){
      const b=arr[j];
      if(!b.alive||b.stationary||b.phasing||b.grabbed||b._titanJumping)continue;
      let dx=b.x-a.x,dy=b.y-a.y;
      let d=Math.hypot(dx,dy);
      const min=a.r+b.r-3;
      if(d<min){
        if(d<0.001){dx=1;dy=0;d=1;}
        const push=(min-d)/2;dx/=d;dy/=d;
        a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push;
      }
    }
    if(!a.grabbed){
      a.x=clamp(a.x,14,W-14);a.y=clamp(a.y,14,H-14);
    }
  }
}
function updateProjectiles(dt){
  for(const p of G.projectiles){
    p.life-=dt;p.spinAngle+=p.spinRate*dt;
    const t=p.target;
    if(t&&t.alive){p.lx=t.x;p.ly=t.y;}
    if(p.arc>0){
      p.t+=dt;
      const prog=Math.min(1,p.t/p.dur);
      p.x=p.sx+(p.lx-p.sx)*prog;
      p.y=p.sy+(p.ly-p.sy)*prog-Math.sin(prog*Math.PI)*p.arc;
      if(prog>=1)p.dead=true;
    }else{
      const dx=p.lx-p.x,dy=p.ly-p.y;
      const d=Math.hypot(dx,dy);
      const step=p.speed*dt;
      if(p.pierce){
        const foe=p.side==='player'?'enemy':'player';
        for(const u of G.units){
          if(!u.alive||u.side!==foe||p.hitSet.has(u)||u.untargetable)continue;
          if(Math.hypot(u.x-p.x,u.y-p.y)<=u.r+5){damage(u,p.dmg,p.source);p.hitSet.add(u);}
        }
      }
      if(p.attackType==='boomerang'){
        if(!p.returning&&d<20){p.returning=true;p.hitSet.clear();}
        if(p.returning){
          if(!p.source||!p.source.alive){p.dead=true;}
          else{
            p.lx=p.source.x;p.ly=p.source.y;
            const rdx=p.lx-p.x,rdy=p.ly-p.y;
            const rd=Math.hypot(rdx,rdy);
            if(rd<15){p.dead=true;}
          }
        }
      }
      if(d<=step||d<1.2){p.x=p.lx;p.y=p.ly;p.dead=true;}
      else{p.x+=(dx/d)*step;p.y+=(dy/d)*step;}
    }
    if(p.dead)projectileLanded(p);
    if(p.life<=0)p.dead=true;
  }
  if(G.projectiles.some(p=>p.dead))G.projectiles=G.projectiles.filter(p=>!p.dead);
}
function updateZones(dt){
  for(const z of G.zones){
    z.timer-=dt;
    const foe=z.side==='player'?'enemy':'player';
    for(const u of G.units){
      if(!u.alive||u.side!==foe||u.untargetable)continue;
      if(Math.hypot(u.x-z.x,u.y-z.y)<=z.r)damage(u,z.dps*dt);
    }
    if(Math.random()<0.5){
      const a=Math.random()*Math.PI*2,r=Math.random()*z.r*0.85;
      addParticles(z.x+Math.cos(a)*r,z.y+Math.sin(a)*r,1,'#ff9b5d',25,.5,2.5);
    }
  }
  if(G.zones.length)G.zones=G.zones.filter(z=>z.timer>0);
}
function updateChains(dt){for(const c of G.chains)c.life-=dt;if(G.chains.length)G.chains=G.chains.filter(c=>c.life>0);}
function updateSlashFx(dt){for(const s of G.slashFx)s.life-=dt;if(G.slashFx.length)G.slashFx=G.slashFx.filter(s=>s.life>0);}
function updateShockwaves(dt){for(const s of G.shockwaves)s.life-=dt;if(G.shockwaves.length)G.shockwaves=G.shockwaves.filter(s=>s.life>0);}
function updateFX(dt){
  for(const p of G.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;p.vx*=.95;p.life-=dt;}
  if(G.particles.length)G.particles=G.particles.filter(p=>p.life>0);
  for(const r of G.rings)r.life-=dt;
  if(G.rings.length)G.rings=G.rings.filter(r=>r.life>0);
  if (G.shake > 0) G.shake *= Math.pow(0.001, dt * 3);
  if (G.shake < 0.3) G.shake = 0;
}

function aiUpdate(dt){
  G.aiTimer-=dt;
  if(G.aiTimer>0)return;
  G.aiTimer=.6+Math.random()*1;
  const e=G.elixir.enemy,hand=G.queue.enemy;
  const affordable=[];
  for(let i=0;i<4;i++)if(CARDS[hand[i]].cost<=e)affordable.push(i);
  if(!affordable.length)return;
  const threats=G.units.filter(u=>u.alive&&u.side==='player'&&u.y<RIVER_Y+130&&!u.untargetable);
  if(threats.length){
    threats.sort((a,b)=>a.y-b.y);
    const t=threats[0];
    affordable.sort((a,b)=>CARDS[hand[b]].cost-CARDS[hand[a]].cost);
    const idx=Math.random()<.75?affordable[0]:affordable[Math.floor(Math.random()*affordable.length)];
    const x=clamp(t.x+(Math.random()*46-23),28,W-28);
    const y=clamp(t.y-70-Math.random()*40,28,RIVER_Y-34);
    const key=hand[idx];
    if(queueDeploy('enemy',key,x,y,idx))return;
    return;
  }
  if(e<7.5&&Math.random()<.55)return;
  const idx=affordable[Math.floor(Math.random()*affordable.length)];
  const lane=Math.random()<.5?0:1;
  const x=clamp(BRIDGES[lane]+(Math.random()*34-17),28,W-28);
  const y=RIVER_Y-62-Math.random()*70;
  const key=hand[idx];
  queueDeploy('enemy',key,x,y,idx);
}

function endGame(result){
  if(G.over)return;
  G.over=true;G.result=result;
  if(result==='victory'){bumpWins();SFX.victory();}
  else if(result==='defeat'){SFX.defeat();}
  else SFX.uiOpen();
  notify(result==='victory'?'success':result==='defeat'?'error':'warning');
  setTimeout(showOverlay,700);
}
function checkTimeUp(){
  if(G.timeLeft>0||G.over)return;
  if(G.crowns.player>G.crowns.enemy)endGame('victory');
  else if(G.crowns.enemy>G.crowns.player)endGame('defeat');
  else{
    let ph=0,eh=0;
    for(const t of G.towers){if(!t.alive)continue;if(t.side==='player')ph+=t.hp;else eh+=t.hp;}
    endGame(ph>eh?'victory':eh>ph?'defeat':'draw');
  }
}
function showOverlay(){
  const ov=document.getElementById('overlay');

  else{title.textContent='🤝 DRAW';title.classList.add('draw');sub.textContent='Time ran out.';}

}

function update(dt){
  G.t+=dt;
  G.timeLeft=Math.max(0,G.timeLeft-dt);
  updateElixir(dt);
  updateTowers(dt);
  updatePendingSpawns(dt);
  updateUnits(dt);
  separate();
  updateProjectiles(dt);
  updateZones(dt);
  updateChains(dt);
  updateSlashFx(dt);
  updateShockwaves(dt);

/* ================================================================
   DRAW ARENA
================================================================ */
function drawArena(){
  let g=ctx.createLinearGradient(0,0,0,RIVER_Y);
  g.addColorStop(0,'#23502c');g.addColorStop(1,'#2f6b3d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,RIVER_Y);
  g=ctx.createLinearGradient(0,RIVER_Y,0,H);
  g.addColorStop(0,'#358043');g.addColorStop(1,'#275c33');
  ctx.fillStyle=g;ctx.fillRect(0,RIVER_Y,W,H-RIVER_Y);
  ctx.save();ctx.globalAlpha=.045;ctx.fillStyle='#fff';
  for(let y=0;y<H;y+=44)ctx.fillRect(0,y,W,22);ctx.restore();
  ctx.save();ctx.globalAlpha=.07;ctx.strokeStyle='#fff';ctx.lineWidth=1;
  for(const bx of BRIDGES){
    ctx.beginPath();
    ctx.moveTo(bx,0);ctx.lineTo(bx,RIVER_Y-RIVER_H/2);
    ctx.moveTo(bx,RIVER_Y+RIVER_H/2);ctx.lineTo(bx,H);
    ctx.stroke();
  }
  ctx.restore();
  const rt=RIVER_Y-RIVER_H/2,rb=RIVER_Y+RIVER_H/2;
  const rg=ctx.createLinearGradient(0,rt,0,rb);
  rg.addColorStop(0,'#1a4a73');rg.addColorStop(.5,'#2f80bb');rg.addColorStop(1,'#1a4a73');
  ctx.fillStyle=rg;ctx.fillRect(0,rt,W,RIVER_H);
  ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#c9edff';ctx.lineWidth=1.4;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    for(let x=0;x<=W;x+=8){
      const y=rt+8+i*11+Math.sin(x*.055+G.t*2.1+i*1.7)*2.4;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.fillRect(0,rt-2,W,2);ctx.fillRect(0,rb,W,2);
  for(const bx of BRIDGES){
    const bw=52;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.3)';
    roundRect(ctx,bx-bw/2+2,rt-6+3,bw,RIVER_H+12,7);ctx.fill();
    ctx.fillStyle='#7d5730';
    roundRect(ctx,bx-bw/2,rt-6,bw,RIVER_H+12,7);ctx.fill();
    ctx.fillStyle='#a67c46';
    const planks=6;
    for(let i=0;i<planks;i++){
      const ph=(RIVER_H+12)/planks;
      ctx.fillRect(bx-bw/2+3,rt-6+i*ph+1.5,bw-6,ph-3);
    }
    ctx.restore();
  }
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=4;
  ctx.strokeRect(2,2,W-4,H-4);
}
function getPlacementZones(){
  const zones=[{x1:18,y1:RIVER_Y+22,x2:W-18,y2:H-16}];
  if(G.leftLaneOpen)zones.push({x1:18,y1:90,x2:W/2-4,y2:H-16});
  if(G.rightLaneOpen)zones.push({x1:W/2+4,y1:90,x2:W-18,y2:H-16});
  return zones;
}
function drawPlacement(){
  if(G.selected<0||G.over)return;
  const selectedKey=G.queue.player[G.selected];
  const isMiner=selectedKey==='miner';
  const zones=getPlacementZones();
  for(const z of zones){
    ctx.save();
    ctx.fillStyle='rgba(110,200,255,0.09)';
    roundRect(ctx,z.x1,z.y1,z.x2-z.x1,z.y2-z.y1,10);ctx.fill();
    ctx.strokeStyle='rgba(130,215,255,0.65)';
    ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.lineDashOffset=-G.t*22;
    roundRect(ctx,z.x1,z.y1,z.x2-z.x1,z.y2-z.y1,10);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  if(isMiner){
    ctx.save();
    ctx.strokeStyle='rgba(201,160,96,0.7)';ctx.lineWidth=2;
    ctx.setLineDash([5,5]);ctx.lineDashOffset=-G.t*22;
    roundRect(ctx,14,20,W-28,H-40,12);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(201,160,96,0.08)';
    roundRect(ctx,14,20,W-28,H-40,12);ctx.fill();
    ctx.restore();
  }
}
const ghostFromSelected={x:0,y:0,show:false};
function drawGhostPreview(){
  if(G.over)return;
  const showDrag=drag.active;
  const showSelected=G.selected>=0&&ghostFromSelected.show;
  if(!showDrag&&!showSelected)return;
  const key=showDrag?G.queue.player[drag.cardIdx]:G.queue.player[G.selected];
  if(!key)return;
  const c=CARDS[key];
  const x=showDrag?drag.x:ghostFromSelected.x;
  const y=showDrag?drag.y:ghostFromSelected.y;
  const valid=isValidPlacement(x,y);
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);
  ctx.fillStyle=valid?'rgba(110,220,255,.15)':'rgba(255,90,90,.15)';
  ctx.fill();
  ctx.strokeStyle=valid?'rgba(150,230,255,.9)':'rgba(255,110,110,.9)';
  ctx.lineWidth=2.5;ctx.setLineDash([6,6]);ctx.lineDashOffset=-G.t*30;
  ctx.stroke();ctx.setLineDash([]);
  const pulse=.6+Math.sin(G.t*6)*.4;
  ctx.beginPath();ctx.arc(x,y,18*pulse+8,0,Math.PI*2);
  ctx.strokeStyle=valid?`rgba(180,240,255,${.6*pulse})`:`rgba(255,150,150,${.6*pulse})`;
  ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='22px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=.9;
  ctx.fillText(c.icon,x,y+1);
  if(c.count>1){
    for(let i=0;i<c.count;i++){
      const a=(i/c.count)*Math.PI*2-Math.PI/2;
      const px=x+Math.cos(a)*13,py=y+Math.sin(a)*13;
      ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);
      ctx.fillStyle=valid?'rgba(180,240,255,.7)':'rgba(255,150,150,.7)';
      ctx.fill();
    }
  }
  ctx.restore();
}
function isValidPlacement(x,y){
  if(y<20||y>H-16)return false;
  if(x<18||x>W-18)return false;
  const selectedKey=G.selected>=0?G.queue.player[G.selected]:null;
  const dragKey=drag.active&&drag.cardIdx>=0?G.queue.player[drag.cardIdx]:null;
  if(selectedKey==='miner'||dragKey==='miner')return true;
  const zones=getPlacementZones();
  for(const z of zones){
    if(x>=z.x1&&x<=z.x2&&y>=z.y1&&y<=z.y2)return true;
  }
  return false;
}
function drawHpBar(cx,cy,w,pct,side){
  const h=4.5;
  const x=cx-w/2,y=cy-h/2;
  ctx.fillStyle='rgba(0,0,0,.62)';
  roundRect(ctx,x-1.5,y-1.5,w+3,h+3,3);ctx.fill();
  const p=clamp(pct,0,1);
  if(p>0){
    ctx.fillStyle=side==='player'?'#4ea3ff':'#ff5555';
    roundRect(ctx,x,y,w*p,h,2.2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.32)';
    roundRect(ctx,x,y,w*p,h*.45,2);ctx.fill();
  }
}
function drawShadow(u,x,y,r){
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath();
  ctx.ellipse(x,y+r*0.75,r*0.95,r*0.36,0,0,Math.PI*2);

/* ================================================================
   WEAPON DRAW HELPER
================================================================ */
function drawWeapon(u, x, y, r, t){
  const w = u.weapon;
  if (!w || w === 'none') return;
  // Position: in front of the unit, in direction of attack (or facing)
  const dir = u.attackAngle || u.facing || 0;
  const atkP = u.attackAnim > 0 ? Math.sin((1 - u.attackAnim/0.22)*Math.PI) : 0;
  // Hand position offset
  const handDist = r * 1.35 + atkP * r * 0.5;
  const hx = x + Math.cos(dir) * handDist;
  const hy = y - r*0.2 + Math.sin(dir) * handDist;

  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(dir);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Trail particles on swing
  if (atkP > 0.5 && Math.random() < 0.5){
    addParticles(hx, hy, 1, '#ffe9a8', 60, .25, 2);
  }

  switch(w){
    case 'sword': {
      // Blade
      ctx.strokeStyle = '#e8e8f0'; ctx.lineWidth = r*0.14;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*1.4, 0); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = r*0.05;
      ctx.beginPath(); ctx.moveTo(r*0.2, 0); ctx.lineTo(r*1.35, 0); ctx.stroke();
      // Guard
      ctx.strokeStyle = '#8a6a30'; ctx.lineWidth = r*0.16;
      ctx.beginPath(); ctx.moveTo(0, -r*0.28); ctx.lineTo(0, r*0.28); ctx.stroke();
      // Handle
      ctx.strokeStyle = '#4a3020'; ctx.lineWidth = r*0.14;
      ctx.beginPath(); ctx.moveTo(-r*0.45, 0); ctx.lineTo(0, 0); ctx.stroke();
      break;
    }
    case 'katana': {
      ctx.strokeStyle = '#c8c8d8'; ctx.lineWidth = r*0.1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(r*0.7, -r*0.1, r*1.5, -r*0.2);
      ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = r*0.03;
      ctx.beginPath();
      ctx.moveTo(r*0.2, -r*0.02);
      ctx.quadraticCurveTo(r*0.8, -r*0.1, r*1.45, -r*0.19);
      ctx.stroke();
      ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = r*0.12;
      ctx.beginPath(); ctx.moveTo(-r*0.35, 0); ctx.lineTo(0, 0); ctx.stroke();
      break;
    }
    case 'axe': {
      // Handle
      ctx.strokeStyle = '#6a4a30'; ctx.lineWidth = r*0.16;
      ctx.beginPath(); ctx.moveTo(-r*0.4, 0); ctx.lineTo(r*0.9, 0); ctx.stroke();
      // Head
      ctx.fillStyle = '#a8a8b0';
      ctx.beginPath();
      ctx.moveTo(r*0.7, -r*0.35);
      ctx.quadraticCurveTo(r*1.1, -r*0.45, r*1.2, -r*0.1);
      ctx.lineTo(r*1.2, r*0.2);
      ctx.quadraticCurveTo(r*1.0, r*0.4, r*0.7, r*0.35);
      ctx.lineTo(r*0.6, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
      break;
    }
    case 'hammer': {
      ctx.strokeStyle = '#6a4a30'; ctx.lineWidth = r*0.18;
      ctx.beginPath(); ctx.moveTo(-r*0.4, 0); ctx.lineTo(r*0.8, 0); ctx.stroke();
      ctx.fillStyle = '#a8a8b0';
      roundRect(ctx, r*0.7, -r*0.4, r*0.55, r*0.8, r*0.1);
      ctx.fill();
      ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
      break;
    }
    case 'pickaxe': {
      ctx.strokeStyle = '#6a4a30'; ctx.lineWidth = r*0.16;
      ctx.beginPath(); ctx.moveTo(-r*0.3, 0); ctx.lineTo(r*0.9, 0); ctx.stroke();
      ctx.strokeStyle = '#a8a8b0'; ctx.lineWidth = r*0.12;
      ctx.beginPath();
      ctx.moveTo(r*0.7, -r*0.4);
      ctx.quadraticCurveTo(r*1.1, 0, r*0.7, r*0.4);
      ctx.stroke();
      break;
    }
    case 'lance': {
      ctx.strokeStyle = '#6a4a30'; ctx.lineWidth = r*0.14;
      ctx.beginPath(); ctx.moveTo(-r*0.6, 0); ctx.lineTo(r*1.4, 0); ctx.stroke();
      ctx.fillStyle = '#c8c8d8';
      ctx.beginPath();
      ctx.moveTo(r*1.4, 0);
      ctx.lineTo(r*1.1, -r*0.15);
      ctx.lineTo(r*1.1, r*0.15);
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'staff': {
      ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = r*0.14;
      ctx.beginPath(); ctx.moveTo(-r*0.5, -r*0.6); ctx.lineTo(r*0.6, r*0.9); ctx.stroke();
      // Orb at top
      ctx.fillStyle = lighten(u.color, .3);
      ctx.shadowColor = u.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(-r*0.5, -r*0.7, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'bow': {
      ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = r*0.1;
      ctx.beginPath();
      ctx.arc(r*0.5, 0, r*0.5, -Math.PI*0.6, Math.PI*0.6);
      ctx.stroke();
      // String
      ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1;
      const tipTopY = -Math.sin(Math.PI*0.6) * r*0.5;
      const tipBotY = Math.sin(Math.PI*0.6) * r*0.5;
      const tipX = r*0.5 + Math.cos(Math.PI*0.6) * r*0.5;
      ctx.beginPath(); ctx.moveTo(tipX, tipTopY); ctx.lineTo(tipX, tipBotY); ctx.stroke();
      // Arrow
      if (atkP > 0.3){
        ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = r*0.06;
        ctx.beginPath(); ctx.moveTo(tipX-r*0.4, 0); ctx.lineTo(r*1.2, 0); ctx.stroke();
        ctx.fillStyle = '#c8c8d8';
        ctx.beginPath();
        ctx.moveTo(r*1.3, 0); ctx.lineTo(r*1.05, -r*0.1); ctx.lineTo(r*1.05, r*0.1);
        ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'rifle': {
      // Long barrel
      ctx.fillStyle = '#3a3a42';
      roundRect(ctx, -r*0.3, -r*0.1, r*1.7, r*0.2, r*0.04);
      ctx.fill();
      ctx.fillStyle = '#6a4a30';
      roundRect(ctx, -r*0.5, -r*0.06, r*0.3, r*0.15, r*0.03);
      ctx.fill();
      // Muzzle flash
      if (atkP > 0.7){
        ctx.fillStyle = '#ffe066';
        ctx.shadowColor = '#ffdd44'; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(r*1.5, 0, r*0.2 * (1-atkP), 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      break;
    }
    case 'cannon': {
      ctx.fillStyle = '#3a3a42';
      roundRect(ctx, -r*0.3, -r*0.18, r*1.2, r*0.36, r*0.08);
      ctx.fill();
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(r*0.95, 0, r*0.16, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'coil': {
      ctx.strokeStyle = u.color; ctx.lineWidth = r*0.1;
      ctx.shadowColor = u.color; ctx.shadowBlur = 8;
      for (let i=0;i<3;i++){
        ctx.beginPath();
        ctx.arc(r*0.3+i*r*0.2, 0, r*0.15, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      break;
    }
    case 'orb': {
      ctx.fillStyle = u.color;
      ctx.shadowColor = u.color; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(r*0.5, 0, r*0.25 + Math.sin(t*6)*r*0.04, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      break;
    }
    case 'flask': {
      ctx.fillStyle = 'rgba(120,230,140,0.9)';
      roundRect(ctx, r*0.2, -r*0.25, r*0.5, r*0.5, r*0.15);
      ctx.fill();
      ctx.strokeStyle = '#2a5a2a'; ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'hook': {
      ctx.strokeStyle = '#8a8a94'; ctx.lineWidth = r*0.08;
      for (let i = 0; i < 3; i++){
        ctx.beginPath();
        ctx.ellipse(r*0.15+i*r*0.2, 0, r*0.08, r*0.06, 0, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.strokeStyle = '#d0d0d8'; ctx.lineWidth = r*0.1;
      ctx.beginPath();
      ctx.arc(r*0.85, 0, r*0.15, -Math.PI*0.7, Math.PI*0.7);
      ctx.stroke();
      break;
    }
    case 'bomb': {
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(r*0.4, 0, r*0.3, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
      ctx.stroke();
      // Fuse
      ctx.fillStyle = '#ffcc44';
      ctx.beginPath();
      ctx.arc(r*0.65, -r*0.2, r*0.08, 0, Math.PI*2);
      ctx.fill();
      break;
    }
    case 'fist': {
      // Just a fist
      ctx.fillStyle = lighten(u.color, .3);
      ctx.beginPath();
      ctx.arc(r*0.5, 0, r*0.28 + atkP*r*0.15, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = darken(u.color, .4); ctx.lineWidth = 1;
      ctx.stroke();
      break;
    }
    case 'claw': {
      ctx.strokeStyle = '#e0e0e8'; ctx.lineWidth = r*0.06;
      for (let i = -1; i <= 1; i++){
        ctx.beginPath();
        ctx.moveTo(r*0.2, i*r*0.15);
        ctx.quadraticCurveTo(r*0.5, i*r*0.2, r*0.7, i*r*0.25);
        ctx.stroke();
      }
      break;
    }
    case 'book': {
      ctx.fillStyle = '#e8d8a0';
      roundRect(ctx, r*0.15, -r*0.3, r*0.5, r*0.6, r*0.05);
      ctx.fill();
      ctx.strokeStyle = '#8a6a30'; ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r*0.4, -r*0.3); ctx.lineTo(r*0.4, r*0.3);
      ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

   CHARACTER RENDERERS

function drawHumanoid(u, x, y, r, t){
  const wp = u.moving ? Math.sin(t*10 + u.bob) : Math.sin(t*2 + u.bob)*0.15;
  const lo = wp * 2.5, aw = wp * 2.2;
  const ap = u.attackAnim > 0 ? Math.sin((1 - u.attackAnim/0.22)*Math.PI) : 0;
  ctx.strokeStyle = darken(u.color, .35); ctx.lineWidth = Math.max(2, r*0.32); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r*0.35, y + r*0.5); ctx.lineTo(x - r*0.35 + lo, y + r*1.15);
  ctx.moveTo(x + r*0.35, y + r*0.5); ctx.lineTo(x + r*0.35 - lo, y + r*1.15);
  ctx.stroke();
  const bg = ctx.createLinearGradient(x, y-r*0.5, x, y+r*0.5);
  bg.addColorStop(0, lighten(u.color, .3)); bg.addColorStop(1, u.color);
  ctx.fillStyle = bg;
  roundRect(ctx, x - r*0.72, y - r*0.75, r*1.44, r*1.4, r*0.4); ctx.fill();
  ctx.strokeStyle = darken(u.color, .4); ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = darken(u.color, .25); ctx.lineWidth = Math.max(2, r*0.28);
  ctx.beginPath();
  ctx.moveTo(x - r*0.72, y - r*0.4);
  ctx.lineTo(x - r*1.15 - aw*0.5, y - r*0.1 + ap*r*0.3);
  ctx.moveTo(x + r*0.72, y - r*0.4);
  ctx.lineTo(x + r*1.15 + aw*0.5 + ap*r*0.9, y - r*0.1 - ap*r*0.3);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y - r*1.1, r*0.55, 0, Math.PI*2);
  const hg = ctx.createRadialGradient(x - r*0.15, y - r*1.25, r*0.05, x, y - r*1.1, r*0.55);
  hg.addColorStop(0, lighten(u.color, .55)); hg.addColorStop(1, lighten(u.color, .1));
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = darken(u.color, .4); ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.8)';
  ctx.beginPath();
  ctx.arc(x - r*0.18, y - r*1.15, r*0.08, 0, Math.PI*2);
  ctx.arc(x + r*0.18, y - r*1.15, r*0.08, 0, Math.PI*2);
  ctx.fill();
  drawWeapon(u, x, y, r, t);
