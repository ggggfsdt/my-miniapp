    const winnerIdx = (Math.random() * ROULETTE_N) | 0;
    items[winnerIdx] = {value: ball.value, tier: ball.tier};
    const ballEls = new Array(ROULETTE_N), ballData = new Array(ROULETTE_N);
    for (let k = 0; k < ROULETTE_N; k++){
      const it = items[k];
      const d = document.createElement('div');
      d.className = 'dl-r-ball ' + it.tier; d.textContent = it.value;
      d.style.width = ballSize + 'px'; d.style.height = ballSize + 'px';
      d.style.marginLeft = (-ballSize / 2) + 'px'; d.style.marginTop = (-ballSize / 2) + 'px';
      d.style.fontSize = fontSize + 'px'; d.style.visibility = 'hidden';
      vpEl.appendChild(d); ballEls[k] = d;
      ballData[k] = { lastZ: -1, lastO: -1, lastVisible: false };
    }
    frag.appendChild(rowEl);
    rows.push({ ballEls, ballData, winnerIdx, endW: -baseAngles[winnerIdx] - 360 * (4 + ((Math.random() * 4) | 0)) });
  }
  elRRows.appendChild(frag);
  function applyRow(rowData, W){
    const els = rowData.ballEls, dat = rowData.ballData;
    for (let i = 0; i < ROULETTE_N; i++){
      const A = (W + baseAngles[i]) * DEG2RAD;
      const c = Math.cos(A), s = Math.sin(A);
      const depth = (c + 1) * 0.5;
      const el = els[i], dt = dat[i];
      const visible = depth > 0.28;
      if (dt.lastVisible !== visible){ el.style.visibility = visible ? 'visible' : 'hidden'; dt.lastVisible = visible; }
      if (!visible) continue;
      const x = s * RADIUS;
      const scale = 0.55 + 0.45 * depth;
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0) scale(' + scale.toFixed(3) + ')';
      const z = (depth * 1000) | 0;
      if (Math.abs(dt.lastZ - z) > 30){ el.style.zIndex = z; dt.lastZ = z; }
      const op = 0.42 + 0.58 * depth;
      if (Math.abs(dt.lastO - op) > 0.06){ el.style.opacity = op.toFixed(2); dt.lastO = op; }
    }
  }
  const eoQ = t => 1 - Math.pow(1 - t, 5);
  const eoB = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const DURATION = FAST_SPIN ? 1000 : 2100;
  const t0 = performance.now();
  for (let i = 0; i < rows.length; i++) applyRow(rows[i], 0);
  function frame(now){
    if (myToken !== spinToken) return;
    const p = Math.min((now - t0) / DURATION, 1);
    const eased = p < 0.9 ? eoQ(p / 0.9) * 0.985 : 0.985 + eoB((p - 0.9) / 0.1) * 0.015;
    for (let i = 0; i < rows.length; i++) applyRow(rows[i], rows[i].endW * eased);
    if (p >= 1){
      for (let i = 0; i < rows.length; i++){
        const r = rows[i];
        applyRow(r, r.endW);
        const wEl = r.ballEls[r.winnerIdx];
        if (wEl.style.visibility === 'hidden'){
          wEl.style.visibility = 'visible';
          const A = (r.endW + baseAngles[r.winnerIdx]) * DEG2RAD;
          const s = Math.sin(A), c = Math.cos(A);
          const depth = (c + 1) * 0.5;
          wEl.style.transform = 'translate3d(' + (s * RADIUS).toFixed(1) + 'px,0,0) scale(' + (0.55 + 0.45*depth).toFixed(3) + ')';
          wEl.style.opacity = (0.42 + 0.58 * depth).toFixed(2);
        }
        wEl.classList.add('winner');
      }
      setTimeout(() => {
        if (myToken !== spinToken) return;
        elRTitle.textContent = 'You got';
        let totalVal = 0;
        for (let i = 0; i < balls.length; i++) totalVal += balls[i].value;
        elRAmount.innerHTML = '<img src="' + DIAMOND_GIF + '"><span>' + totalVal + '</span>';
        elRAmount.classList.add('show'); haptic();
      }, 250);
      setTimeout(() => {
        if (myToken !== spinToken) return;
        elRoulette.classList.remove('show');
        elRRows.innerHTML = '';
        done();
      }, FAST_SPIN ? 900 : 1500);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============ SINGLE-BALL ARENA (trapezoid segments, bright colors) ============ */
const ARENA = {
  mode: '2d',
  spinning: false,
  svg: null, three: null,
  segs: [], winnerIdx: 0,
  puck: null,
  topXs: [], botXs: [],
  puckR: 20,
  readyBalls: null,
  readyDone: null,
  t0: 0, duration: 0,
};

elAMode.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (ARENA.spinning) return;
  const mode = btn.dataset.mode;
  if (mode === ARENA.mode) return;
  ARENA.mode = mode;
  elAMode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (ARENA.svg && ARENA.three){
    ARENA.svg.svg.style.display = mode === '2d' ? 'block' : 'none';
    ARENA.three.canvas.style.display = mode === '3d' ? 'block' : 'none';
    if (mode === '3d'){
      const w = elABoard.clientWidth, h = elABoard.clientHeight;
      ARENA.three.rend.setSize(w, h, false);
      const aspect = w / h;
      ARENA.three.cam.aspect = aspect;
      ARENA.three.cam.updateProjectionMatrix();
    }
  }
  haptic();
});

elASpin.addEventListener('click', () => {
  if (ARENA.spinning || !ARENA.readyBalls) return;
  startArenaSpin();
});

function buildArenaSegments(value, count){
  const items = [];
  for (let i = 0; i < count - 1; i++) items.push(randomValue());
  const winnerPos = Math.floor(Math.random() * count);
  items.splice(winnerPos, 0, value);
  const raw = items.map(v => {
    let w;
    if (v < 10) w = 12;
    else if (v < 50) w = 7;
    else if (v < 200) w = 4;
    else if (v < 500) w = 2.5;
    else w = 1.2;
    w *= 0.85 + Math.random() * 0.3;
    // Random bright color per segment
    const color = ARENA_COLORS[Math.floor(Math.random() * ARENA_COLORS.length)];
    return { value: v, tier: tierFor(v), weight: w, color };
  });
  const total = raw.reduce((s, x) => s + x.weight, 0);
  let acc = 0;
  const segs = raw.map(x => {
    const prob = x.weight / total;
    const a0 = acc; acc += prob;
    const a1 = acc;
    return { value: x.value, tier: x.tier, a0, a1, ac: (a0+a1)*0.5, prob, color: x.color };
  });
  return { segs, winnerIdx: winnerPos };
}
function pickWeighted(segs){
  let r = Math.random();
  for (let i = 0; i < segs.length; i++){ if (r < segs[i].prob) return i; r -= segs[i].prob; }
  return segs.length - 1;
}

// Compute slanted boundary arrays (top and bottom X for each boundary)
function computeBoundsArrays(segs, W){
  const n = segs.length;
  const topXs = [0], botXs = [0];
  let cumProb = 0;
  for (let i = 0; i < n; i++){
    cumProb += segs[i].prob;
    if (i < n - 1){
      const ideal = cumProb * W;
      const jT = (Math.random() - 0.5) * (W / 10);
      const jB = (Math.random() - 0.5) * (W / 10);
      let tX = Math.max(topXs[i] + W/n * 0.5, Math.min(W - (n - i - 1) * W/n * 0.5, ideal + jT));
      let bX = Math.max(botXs[i] + W/n * 0.5, Math.min(W - (n - i - 1) * W/n * 0.5, ideal + jB));
      topXs.push(tX);
      botXs.push(bX);
    } else {
      topXs.push(W);
      botXs.push(W);
    }
  }
  return { topXs, botXs };
}

function buildArenaSvg(segs, topXs, botXs, w, h){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  const pad = 6;
  const RX = pad, RY = pad;
  const RW = w - pad*2, RH = h - pad*2;
  const segPolys = [], segCenters = [];
  for (let i = 0; i < segs.length; i++){
    const s = segs[i];
    const tl = topXs[i] * RW/RW; // normalized 0..RW is our W
    // We defined topXs in terms of W = RW. Good.
    const tlx = RX + topXs[i];
    const trx = RX + topXs[i+1];
    const blx = RX + botXs[i];
    const brx = RX + botXs[i+1];
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', `${tlx},${RY} ${trx},${RY} ${brx},${RY+RH} ${blx},${RY+RH}`);
    poly.setAttribute('fill', s.color);
    poly.setAttribute('fill-opacity', '0.92');
    svg.appendChild(poly);
    segPolys.push(poly);
    // Center X at mid height for text/icon placement
    const cT = (topXs[i] + topXs[i+1]) / 2;
    const cB = (botXs[i] + botXs[i+1]) / 2;
    segCenters.push({ topX: RX + cT, botX: RX + cB });
    // Value text
    const midX = RX + (cT + cB) / 2;
    const sw = Math.max(topXs[i+1]-topXs[i], botXs[i+1]-botXs[i]);
    if (sw > 22){
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', midX);
      t.setAttribute('y', RY + RH * 0.55);
      t.setAttribute('fill', '#0a0a10');
      t.setAttribute('font-size', Math.max(11, Math.min(sw * 0.28, 18)));
      t.setAttribute('font-weight', '900');
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'middle');
      t.setAttribute('paint-order', 'stroke');
      t.setAttribute('stroke', 'rgba(255,255,255,0.4)');
      t.setAttribute('stroke-width', '1.5');
      t.textContent = s.value;
      svg.appendChild(t);
    }
    // Ball icon
    if (sw > 30){
      const iconR = Math.min(sw * 0.2, 14);
      const ic = document.createElementNS(NS, 'circle');
      ic.setAttribute('cx', midX); ic.setAttribute('cy', RY + RH * 0.2);
      ic.setAttribute('r', iconR);
      ic.setAttribute('fill', '#ffffff');
      ic.setAttribute('fill-opacity', '0.85');
      ic.setAttribute('stroke', 'rgba(0,0,0,0.5)');
      ic.setAttribute('stroke-width', '1.5');
      svg.appendChild(ic);
    }
  }
  // Outer border
  const border = document.createElementNS(NS, 'rect');
  border.setAttribute('x', RX); border.setAttribute('y', RY);
  border.setAttribute('width', RW); border.setAttribute('height', RH);
  border.setAttribute('fill', 'none');
  border.setAttribute('stroke', 'rgba(255,255,255,0.55)');
  border.setAttribute('stroke-width', '2.5');
  border.setAttribute('rx', '10');
  svg.appendChild(border);

  // Puck
  const puck = document.createElementNS(NS, 'g');
  const pr = Math.min(w, h) * 0.075;
  const pc = document.createElementNS(NS, 'circle');
  pc.setAttribute('cx', 0); pc.setAttribute('cy', 0); pc.setAttribute('r', pr);
  pc.setAttribute('fill', 'rgba(255,255,255,0.15)');
  pc.setAttribute('stroke', '#ffffff');
  pc.setAttribute('stroke-width', '4.5');
  puck.appendChild(pc);
  const ch = pr * 0.7;
  const l1 = document.createElementNS(NS, 'line');
  l1.setAttribute('x1', -ch); l1.setAttribute('y1', 0);
  l1.setAttribute('x2', ch); l1.setAttribute('y2', 0);
  l1.setAttribute('stroke', '#ffffff'); l1.setAttribute('stroke-width', '3.5'); l1.setAttribute('stroke-linecap', 'round');
  puck.appendChild(l1);
  const l2 = document.createElementNS(NS, 'line');
  l2.setAttribute('x1', 0); l2.setAttribute('y1', -ch);
  l2.setAttribute('x2', 0); l2.setAttribute('y2', ch);
  l2.setAttribute('stroke', '#ffffff'); l2.setAttribute('stroke-width', '3.5'); l2.setAttribute('stroke-linecap', 'round');
  puck.appendChild(l2);
  svg.appendChild(puck);

  return { svg, puck, segPolys, segCenters, bounds: { x: RX, y: RY, w: RW, h: RH }, puckR: pr };
}

// True 3D: trapezoid segments as extruded 3D meshes, perspective camera
function buildArena3d(segs, topXs, botXs, w, h){
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:none';
  elABoard.appendChild(canvas);

  const rend = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  rend.setPixelRatio(Math.min(devicePixelRatio, 2));
  rend.setSize(w, h, false);

  const scn = new THREE.Scene();
  // Perspective camera looking at the arena from an angle
  const aspect = w / h;
  const cam = new THREE.PerspectiveCamera(46, aspect, 1, 2000);

  // Arena dimensions in 3D world space
  const viewH = 120;
  const viewW = viewH * aspect;
  const pad = 6;
  const RX = -viewW/2 + pad, RY = -viewH/2 + pad;
  const RW = viewW - pad*2, RH = viewH - pad*2;

  // Camera position: tilted up + slightly to the side + in front
  cam.position.set(viewW * 0.10, -viewH * 0.15, viewH * 1.55);
  cam.lookAt(0, -viewH * 0.05, 0);

  scn.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dl1 = new THREE.DirectionalLight(0xffffff, 1.3); dl1.position.set(0.6, 0.9, 1.2); scn.add(dl1);
  const dl2 = new THREE.DirectionalLight(0xaaccff, 0.5); dl2.position.set(-0.6, 0.4, 0.6); scn.add(dl2);

  // Background panel behind the arena
  const bgGeo = new THREE.PlaneGeometry(RW + 20, RH + 20);
  const bgMat = new THREE.MeshStandardMaterial({color: 0x1a1a22, roughness: 0.9, metalness: 0});
  const bg = new THREE.Mesh(bgGeo, bgMat);
  bg.position.set(0, 0, -8);
  scn.add(bg);

  const segMeshes = [], segCenters = [];
  const depth = 6;
  for (let i = 0; i < segs.length; i++){
    const s = segs[i];
    // Trapezoid polygon in local coords
    const tlx = RX + topXs[i];
    const trx = RX + topXs[i+1];
    const blx = RX + botXs[i];
    const brx = RX + botXs[i+1];
    const shape = new THREE.Shape();
    shape.moveTo(tlx, -RY - RH);
    shape.lineTo(trx, -RY - RH);
    shape.lineTo(brx, -RY);
    shape.lineTo(blx, -RY);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
    // Extrude puts shape in XY, extrudes toward +Z. Shift so front face is at z=0.
    geo.translate(0, 0, -depth);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(s.color),
      roughness: 0.35, metalness: 0.15,
      emissive: new THREE.Color(s.color),
      emissiveIntensity: 0.12,
    });
    const mesh = new THREE.Mesh(geo, mat);
    // Position the shape in world coords: our shape is already using RX..RX+RW
    // and y from -RY-RH to -RY. Wait, we used negative Y. Let me recenter.
    // Actually just position group directly — the coordinates were created with RX offsets
    // in a Y-inverted way to match SVG's top-left origin. Let me just accept the shape
    // as-is and adjust Y sign: shape's Y increases upward, but the trapezoid was defined
    // with -RY-RH at top and -RY at bottom... this is confusing. Let me rebuild.
    mesh.geometry.dispose();
    // Rebuild cleaner: define shape with proper Y (positive up)
    const shape2 = new THREE.Shape();
    const topY = -RY;         // top (was -RY-RH, but let's flip)
    // Actually the arena Y in 3D: +Y is UP. Top of arena should be +Y.
    // SVG y=0 is top, y=RH is bottom. In 3D, top y = +RH/2, bottom y = -RH/2.
    const yTop = RH/2, yBot = -RH/2;
    const xTl = RX + topXs[i];
    const xTr = RX + topXs[i+1];
    const xBl = RX + botXs[i];
    const xBr = RX + botXs[i+1];
    shape2.moveTo(xTl, yTop);
    shape2.lineTo(xTr, yTop);
    shape2.lineTo(xBr, yBot);
    shape2.lineTo(xBl, yBot);
    shape2.closePath();
    const geo2 = new THREE.ExtrudeGeometry(shape2, { depth, bevelEnabled: false });
    geo2.translate(0, 0, -depth);
    const mesh2 = new THREE.Mesh(geo2, mat);
    scn.add(mesh2);
    segMeshes.push(mesh2);
    const cT = (topXs[i] + topXs[i+1]) / 2;
    const cB = (botXs[i] + botXs[i+1]) / 2;
    segCenters.push({ topX: RX + cT, botX: RX + cB, midX: RX + (cT + cB)/2 });
  }

  // Border frame
  const borderGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(RW, RH, depth));
  const borderLine = new THREE.LineSegments(borderGeo, new THREE.LineBasicMaterial({color:0xffffff, opacity:0.5, transparent:true}));
  scn.add(borderLine);

  // Puck — real 3D cylinder
  const puckGroup = new THREE.Group();
  const pr = Math.min(viewW, viewH) * 0.075;
  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(pr, pr, 8, 28),
    new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:0.3, metalness:0.6, roughness:0.35})
  );
  disc.rotation.x = Math.PI / 2;
  puckGroup.add(disc);
  const crossMat = new THREE.MeshBasicMaterial({color:0x111111});
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(pr*1.5, 2, 2), crossMat));
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(2, pr*1.5, 2), crossMat));
  puckGroup.position.z = 5;
  scn.add(puckGroup);

  rend.render(scn, cam);

  return {
    rend, scn, cam, puckGroup, canvas, segMeshes, segCenters,
    bounds: { x: RX, y: RY, w: RW, h: RH },
    viewW, viewH, puckR: pr, depth
  };
}

function spinArena(balls, done){
  ARENA.readyBalls = balls;
  ARENA.readyDone = done;
  ARENA.spinning = false;

  const ball = balls[0];
  const count = 8 + Math.floor(Math.random() * 4);
  const { segs } = buildArenaSegments(ball.value, count);
  const winIdx = pickWeighted(segs);
  ARENA.segs = segs;
  ARENA.winnerIdx = winIdx;

  elABoard.innerHTML = '';
  elATitle.textContent = 'Press SPIN';
  elAAmount.classList.remove('show');
  elAAmount.innerHTML = '';
  elASpin.disabled = false;
  elASpin.textContent = 'SPIN';
  elAMode.classList.remove('locked');
  elArena.classList.add('show');

  requestAnimationFrame(() => {
    const w = elABoard.clientWidth || 320;
    const h = elABoard.clientHeight || 220;

    // Compute slanted boundaries
    const pad = 6;
    const W = w - pad*2;
    const { topXs, botXs } = computeBoundsArrays(segs, W);
    ARENA.topXs = topXs;
    ARENA.botXs = botXs;

    // 2D SVG
    ARENA.svg = buildArenaSvg(segs, topXs, botXs, w, h);
    ARENA.svg.svg.style.display = ARENA.mode === '2d' ? 'block' : 'none';
    elABoard.appendChild(ARENA.svg.svg);

    // 3D
    ARENA.three = buildArena3d(segs, topXs, botXs, w, h);
    ARENA.three.canvas.style.display = ARENA.mode === '3d' ? 'block' : 'none';

    // Puck at center
    const bnd = ARENA.svg.bounds;
    ARENA.puck = {
      x: bnd.x + bnd.w/2,
      y: bnd.y + bnd.h/2,
      vx: 0, vy: 0,
      r: ARENA.svg.puckR,
      phase: 'ready',
      t: 0,
      highlight: winIdx,
      winner: segs[winIdx], winnerIdx: winIdx,
    };
    renderArenaPuck();
    updateArenaHighlight();
  });
}

function startArenaSpin(){
  if (!ARENA.puck || ARENA.spinning) return;
  ARENA.spinning = true;
  elAMode.classList.add('locked');
  elASpin.disabled = true;
  elASpin.textContent = 'SPINNING...';
  elATitle.textContent = 'Rolling';
  ARENA.t0 = performance.now();
  ARENA.duration = FAST_SPIN ? 2400 : 3400;

  const bnd = ARENA.svg.bounds;
  const p = ARENA.puck;
  // Random start position
  p.x = bnd.x + bnd.w * (0.3 + Math.random() * 0.4);
  p.y = bnd.y + bnd.h * (0.3 + Math.random() * 0.4);
  // Very fast initial velocity — keeps speed longer
  const ang = Math.random() * Math.PI * 2;
  const spd = 1400 + Math.random() * 400;
  p.vx = Math.cos(ang) * spd;
  p.vy = Math.sin(ang) * spd;
  p.phase = 'launch';
  p.t = 0;

  requestAnimationFrame(arenaFrame);
}

function arenaFrame(now){
  const dt = Math.min(0.033, (now - (arenaFrame._last || now)) / 1000);
  arenaFrame._last = now;
  stepArenaPuck(dt);
  renderArenaPuck();
  updateArenaHighlight();

  const elapsed = now - ARENA.t0;
  if (ARENA.puck.phase === 'done' || elapsed > ARENA.duration + 900){
    const balls = ARENA.readyBalls;
    const done = ARENA.readyDone;
    const totalVal = balls.reduce((s, x) => s + x.value, 0);
    elATitle.textContent = 'You got';
    elAAmount.innerHTML = '<img src="' + DIAMOND_GIF + '"><span>' + totalVal + '</span>';
    elAAmount.classList.add('show');
    haptic();
    setTimeout(() => {
      ARENA.spinning = false;
      elAMode.classList.remove('locked');
      elASpin.disabled = false;
      elASpin.textContent = 'SPIN';
      elArena.classList.remove('show');
      elABoard.innerHTML = '';
      if (ARENA.three){ ARENA.three.rend.dispose(); ARENA.three = null; }
      ARENA.svg = null;
      ARENA.puck = null;
      ARENA.readyBalls = null;
      const d = done;
      ARENA.readyDone = null;
      try { d(); } catch(e){ console.error('done', e); }
    }, FAST_SPIN ? 700 : 1200);
    return;
  }
  requestAnimationFrame(arenaFrame);
}

function stepArenaPuck(dt){
  const p = ARENA.puck;
  if (!p || p.phase === 'ready' || p.phase === 'done') return;
  const bnd = ARENA.svg.bounds;
  const minX = bnd.x + p.r + 3, maxX = bnd.x + bnd.w - p.r - 3;
  const minY = bnd.y + p.r + 3, maxY = bnd.y + bnd.h - p.r - 3;

  if (p.phase === 'launch'){
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    // Bounce off outer rectangle
    if (p.x < minX){ p.x = minX; p.vx = Math.abs(p.vx) * 0.96; }
    if (p.x > maxX){ p.x = maxX; p.vx = -Math.abs(p.vx) * 0.96; }
    if (p.y < minY){ p.y = minY; p.vy = Math.abs(p.vy) * 0.96; }
    if (p.y > maxY){ p.y = maxY; p.vy = -Math.abs(p.vy) * 0.96; }

    // Very low friction for the first 1.8s, then stronger
    const spd = Math.hypot(p.vx, p.vy);
    let frictionFactor;
    if (p.t < 1.8){
      frictionFactor = 0.985;  // very slight slowing
    } else if (p.t < 2.8){
      const k = (p.t - 1.8) / 1.0;
      frictionFactor = 0.985 - k * 0.35; // 0.985 → 0.635
    } else {
      frictionFactor = 0.45;  // stronger at end
    }
    p.vx *= Math.pow(frictionFactor, dt * 60);
    p.vy *= Math.pow(frictionFactor, dt * 60);

    // After 2.4s or speed below 200, transition to settle
    if (p.t > 2.4 || spd < 180){
      p.phase = 'settle'; p.t = 0;
    }
  } else if (p.phase === 'settle'){
    p.t += dt;
    // Target: mid X of the winning segment, mid Y
    const c = ARENA.svg.segCenters[p.winnerIdx];
    const cx = c.midX;
    const cy = bnd.y + bnd.h / 2;
    // Smooth ease-in toward target over ~0.85s
    const totalT = 0.85;
    const k = Math.min(1, p.t / totalT);
    const ease = k * k * (3 - 2 * k); // smoothstep
    // Store starting position on first frame
    if (p.settleStartX === undefined){
      p.settleStartX = p.x;
      p.settleStartY = p.y;
    }
    p.x = p.settleStartX + (cx - p.settleStartX) * ease;
    p.y = p.settleStartY + (cy - p.settleStartY) * ease;
    if (k >= 1){
      p.x = cx; p.y = cy;
      p.phase = 'done';
    }
  }
}

function renderArenaPuck(){
  const p = ARENA.puck;
  if (!p) return;
  if (ARENA.mode === '2d' && ARENA.svg){
    ARENA.svg.puck.setAttribute('transform', `translate(${p.x} ${p.y})`);
  } else if (ARENA.mode === '3d' && ARENA.three){
    const bnd3 = ARENA.three.bounds;
    const bnd = ARENA.svg.bounds;
    const nx = (p.x - bnd.x) / bnd.w;
    const ny = (p.y - bnd.y) / bnd.h;
    const tx = bnd3.x + nx * bnd3.w;
    // Flip Y: SVG y increases downward; 3D y increases upward
    const ty = bnd3.y + bnd3.h - ny * bnd3.h;
    ARENA.three.puckGroup.position.x = tx;
    ARENA.three.puckGroup.position.y = ty;
    ARENA.three.rend.render(ARENA.three.scn, ARENA.three.cam);
  }
}

function updateArenaHighlight(){
  const p = ARENA.puck;
  if (!p) return;
  const bnd = ARENA.svg.bounds;
  const norm = (p.x - bnd.x) / bnd.w;
  // Determine which segment the puck is over (based on its y position for slant)
  const ny = (p.y - bnd.y) / bnd.h;
  const topX = ARENA.topXs, botX = ARENA.botXs;
  let idx = 0;
  for (let i = 0; i < ARENA.segs.length; i++){
    const lX = topX[i] + (botX[i] - topX[i]) * ny;
    const rX = topX[i+1] + (botX[i+1] - topX[i+1]) * ny;
    const lN = lX / bnd.w;
    const rN = rX / bnd.w;
    if (norm >= lN && norm < rN){ idx = i; break; }
  }
  p.highlight = idx;
  if (ARENA.mode === '2d' && ARENA.svg){
    const polys = ARENA.svg.segPolys;
    for (let i = 0; i < polys.length; i++){
      const want = i === idx ? '1' : '0.82';
      if (polys[i]._op !== want){ polys[i].setAttribute('fill-opacity', want); polys[i]._op = want; }
    }
  } else if (ARENA.mode === '3d' && ARENA.three){
    const meshes = ARENA.three.segMeshes;
    for (let i = 0; i < meshes.length; i++){
      const want = i === idx ? 0.55 : 0.12;
      if (meshes[i].material.emissiveIntensity !== want) meshes[i].material.emissiveIntensity = want;
    }
  }
}

elLaunch.addEventListener('click', () => {
  if (G.phase !== 'holding' || G.held.length === 0) return;
  G.phase = 'launching'; G.launchT = 0; G.launchOpen = 0;
  setSpinnerGap(0); elLaunch.disabled = true; haptic();
});

function finishRound(){
  let total = 0, won = 0, lost = 0;
  for (const r of G.results){ total += r.value * r.mult; if (r.mult === 0) lost++; else won++; }
  const winnings = Math.floor(total);
  BALANCE += winnings;
  const mult = G.wagered > 0 ? (winnings/G.wagered) : 0;
  G.wagered = 0;
  updateHud();
  if (winnings > 0) addTickerChip(winnings, mult, '');
  elResTag.textContent = winnings > 0 ? 'Round Results' : 'Round Over';
  elResAmt.innerHTML = `<img src="${DIAMOND_GIF}"><span>${(winnings>0?'+':'')+winnings}</span>`;
  elResAmt.classList.toggle('lose', winnings === 0);
  elResMult.textContent = '×' + mult.toFixed(2);
  elResMult.classList.toggle('lose', winnings === 0);
  elResSub.textContent = `${won} won · ${lost} lost`;
  elResult.classList.add('show');
}

document.getElementById('dl-res-ok').addEventListener('click', () => {
  elResult.classList.remove('show');
  G.active.forEach(b=>removeBall(b)); G.held.forEach(b=>removeBall(b));
  G.active = []; G.held = [];
  for (const p of G.particles) scene.remove(p.mesh);
  G.particles = []; G.results = [];
  G.launchT = 0; G.launchOpen = 0; G._ending = false;
  G.phase = 'idle';
  slowMo.active = false; slowMo.ball = null; slowMo.t = 0;
  goldL1.visible = false; goldL2.visible = false; goldL1.intensity = 0; goldL2.intensity = 0;
  setSpinnerGap(0);
  if (featured.arrow) featured.arrow.visible = false;
  featured.ball = null;
  regenerateMap(); buildMap();
  G.triX = 0; G.triDir = 1;
  camState.lookY = MAP.spinCy - 100; camState.targetLookY = MAP.spinCy - 100;
  camDrag.targetYaw = CAM_DEFAULT_YAW; camDrag.targetPitch = CAM_DEFAULT_PITCH;
  document.querySelectorAll('.dl-modal,.dl-r,.dl-a,.dl-result').forEach(el => el.classList.remove('show'));
  updateHud();
});
function flashResult(tag, amt, isLose, sub){
  elResTag.textContent = tag;
  elResAmt.innerHTML = `<span>${amt}</span>`;
  elResAmt.classList.toggle('lose', !!isLose);
  elResMult.textContent = ''; elResSub.textContent = sub || '';
  elResult.classList.add('show');
}

document.getElementById('dl-close').addEventListener('click', () => {
  try { if (window.__state){ window.__state.balance = BALANCE; window.__state.updateBalance?.(); } } catch(_){}
  window.dispatchEvent(new CustomEvent('dlballs-close'));
});

regenerateMap(); buildMap(); onResize(); updateHud();
requestAnimationFrame(loop);
</script>
