<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>AI SANDBOX — ARIA-7 ∞</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:#050810;color:#e8eefc;user-select:none;-webkit-user-select:none;touch-action:none}
:root{--cyan:#4de0ff;--purple:#b878ff;--gold:#ffd166;--green:#6ee7a0;--red:#ff6b6b;
  --glass:rgba(15,25,45,.72);--glass2:rgba(20,30,55,.85);--line:rgba(120,190,255,.22)}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;display:block}

.topbar{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;gap:8px;align-items:flex-start;z-index:10}
.aiCard{flex:1;display:flex;gap:9px;align-items:center;padding:8px 11px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);min-width:0}
.aiOrb{width:38px;height:38px;border-radius:50%;flex-shrink:0;position:relative;
  background:radial-gradient(circle at 32% 30%,#c8f8ff 0%,#4de0ff 40%,#1a6eb8 100%);
  box-shadow:0 0 20px rgba(77,224,255,.7),inset 0 2px 4px rgba(255,255,255,.4);
  animation:orbFloat 3s ease-in-out infinite;transition:background .4s}
.aiOrb::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(77,224,255,.4);
  animation:orbRing 2.4s ease-in-out infinite}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes orbRing{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.9;transform:scale(1.15)}}
.aiOrb.happy{background:radial-gradient(circle at 32% 30%,#c8ffdc 0%,#6ee7a0 40%,#1a8a5c 100%);
  box-shadow:0 0 24px rgba(110,231,160,.85)}
.aiOrb.angry{background:radial-gradient(circle at 32% 30%,#ffd0c8 0%,#ff6b6b 40%,#8a1e1e 100%);
  box-shadow:0 0 26px rgba(255,107,107,.85);animation:orbShake .3s ease-in-out infinite}
@keyframes orbShake{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
.aiOrb.sleepy{background:radial-gradient(circle at 32% 30%,#d8c8ff 0%,#b878ff 40%,#5a2a9a 100%);
  animation:none}
.aiOrb.genius{background:radial-gradient(circle at 32% 30%,#fff6c2 0%,#ffd166 40%,#a86a00 100%);
  box-shadow:0 0 30px rgba(255,209,102,.95),0 0 60px rgba(255,209,102,.5);
  animation:orbFloat 1.2s ease-in-out infinite}
.aiInfo{flex:1;min-width:0}
.aiName{font-size:11px;font-weight:900;letter-spacing:1.6px;color:#9beaff;display:flex;align-items:center;gap:5px}
.aiLevel{font-size:8.5px;font-weight:900;color:#ffd166;background:linear-gradient(180deg,rgba(255,209,102,.25),rgba(255,209,102,.08));
  padding:1px 5px;border-radius:5px;border:1px solid rgba(255,209,102,.5)}
.aiState{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:#8fa8c8;margin-top:1px;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;flex-direction:column;gap:2px;flex-shrink:0;min-width:56px}
.bar{height:5px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}
.bar>div{height:100%;border-radius:3px;transition:width .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.bar.hp>div{background:linear-gradient(90deg,#ff4a4a,#ff8a8a)}
.bar.en>div{background:linear-gradient(90deg,#4de0ff,#a8f0ff)}
.bar.hu>div{background:linear-gradient(90deg,#ffa84a,#ffd18a)}
.bar.xp>div{background:linear-gradient(90deg,#ffd166,#fff6c2);box-shadow:0 0 6px rgba(255,209,102,.7)}
.bar.tx>div{background:linear-gradient(90deg,#b878ff,#e0c0ff);box-shadow:0 0 6px rgba(184,120,255,.7)}

.iconBtn{width:40px;height:40px;flex-shrink:0;border-radius:13px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#dfe7f5;
  box-shadow:0 8px 24px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s}
.iconBtn:active{transform:scale(.9)}
.iconBtn.on{background:linear-gradient(180deg,rgba(77,224,255,.5),rgba(30,110,180,.4));border-color:rgba(77,224,255,.7)}

.panel{position:absolute;background:var(--glass2);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line);border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);
  padding:12px;font-size:11.5px;line-height:1.5;
  transition:transform .3s cubic-bezier(.34,1.3,.64,1),opacity .25s;pointer-events:auto;z-index:12}
.panel.hidden{transform:translateX(120%);opacity:0;pointer-events:none}
#infoPanel{top:calc(env(safe-area-inset-top) + 66px);right:10px;width:210px}
.panelTitle{font-size:9.5px;font-weight:900;letter-spacing:2px;color:#4de0ff;
  margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.panelTitle::before{content:'';width:6px;height:6px;border-radius:50%;background:#4de0ff;
  box-shadow:0 0 8px #4de0ff;animation:blinkDot 1.2s infinite}
@keyframes blinkDot{50%{opacity:.3}}
.statRow{display:flex;justify-content:space-between;padding:4px 0;
  border-bottom:1px dashed rgba(120,190,255,.15);font-size:10.5px}
.statRow:last-child{border-bottom:none}
.statRow .lbl{color:#8fa8c8;font-weight:700}
.statRow .val{color:#e8eefc;font-weight:900;font-variant-numeric:tabular-nums}

#brainPanel{top:calc(env(safe-area-inset-top) + 66px);left:10px;width:228px;max-height:calc(100% - 260px);
  overflow:hidden;display:flex;flex-direction:column}
.thought{font-size:11px;color:#d8e8ff;font-style:italic;
  padding:8px 10px;border-radius:10px;
  background:linear-gradient(135deg,rgba(77,224,255,.12),rgba(184,120,255,.08));
  border:1px solid rgba(77,224,255,.28);margin-bottom:8px;position:relative;
  animation:thoughtIn .35s cubic-bezier(.34,1.3,.64,1)}
.thought::before{content:'💭';position:absolute;top:-9px;left:8px;font-size:13px;
  filter:drop-shadow(0 0 6px rgba(77,224,255,.7))}
@keyframes thoughtIn{from{opacity:0;transform:translateY(-6px) scale(.95)}to{opacity:1;transform:none}}
.scriptWrap{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.scriptWrap::-webkit-scrollbar{width:0}
.scriptLabel{font-size:9px;font-weight:900;letter-spacing:1.5px;color:#8fa8c8;margin-bottom:5px;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center}
.scriptLabel .badge{background:rgba(255,209,102,.2);border:1px solid rgba(255,209,102,.5);color:#ffd166;
  padding:1px 5px;border-radius:5px;font-size:8px;letter-spacing:.8px}
.script{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;line-height:1.6;
  background:rgba(0,0,0,.35);border-radius:8px;padding:7px 9px;border-left:2px solid rgba(110,231,160,.5);
  max-height:120px;overflow-y:auto}
.script::-webkit-scrollbar{width:0}
.script .ln{display:flex;gap:6px;opacity:.5;transition:all .25s;padding:1px 0}
.script .ln.current{opacity:1;color:#6ee7a0;font-weight:900;transform:translateX(2px)}
.script .ln.done{opacity:.35;text-decoration:line-through}
.script .ln .num{color:#8fa8c8;width:14px;flex-shrink:0;text-align:right}
.script .ln .cmd{flex:1;word-break:break-word}

.journalWrap{flex:1;overflow-y:auto;padding-right:2px;margin-top:6px}
.journalWrap::-webkit-scrollbar{width:0}
.journal{font-family:ui-monospace,Menlo,monospace;font-size:9px;line-height:1.5;
  background:rgba(0,0,0,.4);border-radius:8px;padding:6px 8px;border-left:2px solid rgba(184,120,255,.5);
  color:#c8d8ff;max-height:110px;overflow-y:auto}
.journal::-webkit-scrollbar{width:0}
.journal .fun{border-bottom:1px dashed rgba(184,120,255,.2);padding:3px 0}
.journal .fun:last-child{border-bottom:none}
.journal .funHead{color:#b878ff;font-weight:900}
.journal .funBody{color:#8fa8c8;padding-left:8px;opacity:.85;white-space:pre-wrap;word-break:break-word}

/* Question bar - AI asks user a question */
.questionBar{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 66px);
  padding:10px 12px;border-radius:14px;display:none;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(255,209,102,.2),rgba(200,150,0,.1));
  border:1px solid rgba(255,209,102,.6);z-index:14;
  box-shadow:0 12px 30px rgba(255,180,60,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.questionBar.show{display:flex;animation:qbIn .35s cubic-bezier(.34,1.3,.64,1)}
@keyframes qbIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:none}}
.questionBar .qHead{font-size:9px;font-weight:900;letter-spacing:2px;color:#ffd166}
.questionBar .qText{font-size:12px;font-weight:800;color:#fff;line-height:1.4}
.questionBar .qOpts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.qOpt{padding:6px 12px;border-radius:10px;font-size:11px;font-weight:900;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid rgba(255,209,102,.5);color:#fff;cursor:pointer;
  transition:transform .1s,background .15s}
.qOpt:active{transform:scale(.94);background:linear-gradient(180deg,rgba(255,209,102,.4),rgba(200,150,0,.2))}

.itemPalette{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 88px);
  display:flex;gap:6px;padding:8px 10px;border-radius:20px;
  background:var(--glass2);backdrop-filter:blur(20px);border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:11;touch-action:none;overflow-x:auto;max-width:96vw}
.itemPalette::-webkit-scrollbar{height:0}
.item{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid rgba(120,190,255,.25);transition:transform .12s;position:relative}
.item:active,.item.dragging{transform:scale(1.15);border-color:#4de0ff;
  box-shadow:0 0 20px rgba(77,224,255,.85);
  background:linear-gradient(180deg,rgba(77,224,255,.35),rgba(30,110,180,.15))}

.chatBar{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);
  display:flex;gap:8px;align-items:center;padding:8px 8px 8px 14px;border-radius:22px;
  background:var(--glass2);backdrop-filter:blur(20px);border:1px solid var(--line);
  box-shadow:0 14px 40px rgba(0,0,0,.65);z-index:11}
.chatBar input{flex:1;background:transparent;border:none;outline:none;color:#e8eefc;
  font-size:13px;font-family:inherit;padding:6px 0}
.chatBar input::placeholder{color:#5a7898}
.chatSend{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(180deg,#b0f0ff,#2b8fd0);border:none;color:#03121e;
  font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 #175a8a,inset 0 1px 0 rgba(255,255,255,.7);cursor:pointer}
.chatSend:active{transform:translateY(2px);box-shadow:0 1px 0 #175a8a}

.log{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 58px);
  max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;z-index:10;pointer-events:none;
  -webkit-mask-image:linear-gradient(0deg,transparent 0,#000 20px,#000 100%);
  mask-image:linear-gradient(0deg,transparent 0,#000 20px,#000 100%);padding-top:10px}
.log::-webkit-scrollbar{width:0}
.logMsg{font-size:10.5px;line-height:1.4;padding:6px 10px;border-radius:10px;
  background:rgba(15,25,45,.75);backdrop-filter:blur(12px);
  border:1px solid rgba(120,190,255,.15);max-width:85%;align-self:flex-start;
  animation:logIn .3s cubic-bezier(.34,1.3,.64,1);word-wrap:break-word}
.logMsg.user{align-self:flex-end;background:linear-gradient(180deg,rgba(77,224,255,.2),rgba(30,110,180,.15));
  border-color:rgba(77,224,255,.4)}
.logMsg.system{align-self:center;background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(200,150,0,.08));
  border-color:rgba(255,209,102,.4);font-weight:800;color:#fff6c2;text-align:center;font-size:10px}
.logMsg .from{font-weight:900;font-size:9px;letter-spacing:1.2px;opacity:.7;display:block;margin-bottom:2px}
.logMsg.user .from{color:#9beaff}
.logMsg .from{color:#6ee7a0}
.logMsg.system .from{display:none}
@keyframes logIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.throwGhost{position:fixed;pointer-events:none;z-index:150;font-size:32px;transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));display:none}
.throwGhost.show{display:block}

.hint{position:absolute;left:50%;top:38%;transform:translateX(-50%);
  padding:10px 18px;border-radius:14px;background:rgba(5,10,20,.85);
  border:1px solid rgba(120,190,255,.35);font-size:12px;font-weight:800;color:#c8d8ff;
  z-index:15;pointer-events:none;text-align:center;line-height:1.5;opacity:0;transition:opacity .5s;max-width:280px;
  box-shadow:0 10px 30px rgba(0,0,0,.7)}
.hint.show{opacity:1}

.levelUpFlash{position:fixed;inset:0;pointer-events:none;z-index:200;
  display:flex;align-items:center;justify-content:center;opacity:0}
.levelUpFlash.show{animation:levelFlash 1.6s ease-out}
@keyframes levelFlash{0%{opacity:0;transform:scale(0.5)}15%{opacity:1;transform:scale(1.15)}
  30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.levelUpFlash .txt{font-size:34px;font-weight:900;color:#ffd166;letter-spacing:3px;
  text-shadow:0 0 30px rgba(255,209,102,1),0 0 60px rgba(255,209,102,.5);text-align:center}
.levelUpFlash .sub{font-size:12px;font-weight:900;color:#fff6c2;letter-spacing:6px;margin-top:4px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div class="topbar">
    <div class="aiCard">
      <div class="aiOrb" id="aiOrb"></div>
      <div class="aiInfo">
        <div class="aiName">ARIA-7 <span class="aiLevel" id="aiLevel">LVL 1</span></div>
        <div class="aiState" id="aiState">booting…</div>
      </div>
      <div class="bars">
        <div class="bar hp"><div id="hpFill" style="width:100%"></div></div>
        <div class="bar en"><div id="enFill" style="width:100%"></div></div>
        <div class="bar hu"><div id="huFill" style="width:100%"></div></div>
        <div class="bar xp"><div id="xpFill" style="width:0%"></div></div>
        <div class="bar tx"><div id="txFill" style="width:0%"></div></div>
      </div>
    </div>
    <button class="iconBtn" id="brainBtn">🧠</button>
    <button class="iconBtn" id="infoBtn">ⓘ</button>
  </div>

  <div class="questionBar" id="questionBar">
    <div class="qHead">ARIA-7 ASKS YOU</div>
    <div class="qText" id="qText">…</div>
    <div class="qOpts" id="qOpts"></div>
  </div>

  <div class="panel hidden" id="infoPanel">
    <div class="panelTitle">WORLD SCAN</div>
    <div class="statRow"><span class="lbl">Intelligence</span><span class="val" id="wInt">1.0×</span></div>
    <div class="statRow"><span class="lbl">Self-mod level</span><span class="val" id="wMod">0</span></div>
    <div class="statRow"><span class="lbl">Entities</span><span class="val" id="wEnt">0</span></div>
    <div class="statRow"><span class="lbl">Scripts written</span><span class="val" id="wScripts">0</span></div>
    <div class="statRow"><span class="lbl">Textures made</span><span class="val" id="wTex">0</span></div>
    <div class="statRow"><span class="lbl">Teleports</span><span class="val" id="wTp">0</span></div>
    <div class="statRow"><span class="lbl">Objects held</span><span class="val" id="wGrab">0</span></div>
    <div class="statRow"><span class="lbl">FPS</span><span class="val" id="wFps">60</span></div>
    <div style="margin-top:6px;font-size:9px;color:#b878ff;font-weight:800" id="wSkills"></div>
  </div>

  <div class="panel" id="brainPanel">
    <div class="panelTitle">COGNITION</div>
    <div class="thought" id="thought">Initializing…</div>
    <div class="scriptLabel">ACTIVE SCRIPT <span class="badge" id="planCount">0</span></div>
    <div class="scriptWrap"><div class="script" id="script"></div></div>
    <div class="scriptLabel" style="margin-top:8px">SELF-SPAWNED CODE <span class="badge" id="journalCount">0</span></div>
    <div class="journalWrap"><div class="journal" id="journal"></div></div>
  </div>

  <div class="itemPalette" id="itemPalette">
    <div class="item" data-item="bomb" data-icon="💣">💣</div>
    <div class="item" data-item="apple" data-icon="🍎">🍎</div>
    <div class="item" data-item="ball" data-icon="⚽">⚽</div>
    <div class="item" data-item="bolt" data-icon="⚡">⚡</div>
    <div class="item" data-item="dragon" data-icon="🐉">🐉</div>
    <div class="item" data-item="crown" data-icon="👑">👑</div>
    <div class="item" data-item="paint" data-icon="🎨">🎨</div>
    <div class="item" data-item="star" data-icon="⭐">⭐</div>
  </div>

  <div class="log" id="log"></div>
  <div class="chatBar">
    <input id="chatInput" placeholder="Tell ARIA-7 anything…" autocomplete="off">
    <button class="chatSend" id="chatSend">▶</button>
  </div>

  <div class="throwGhost" id="throwGhost">💣</div>
  <div class="hint" id="hint"></div>
  <div class="levelUpFlash" id="levelUpFlash">
    <div><div class="txt" id="levelTxt">LEVEL UP</div><div class="sub" id="levelSub">+1 INTELLIGENCE</div></div>
  </div>
</div>

<script>
/* ================================================================
   TELEGRAM
================================================================ */
const tg = window.Telegram?.WebApp;
try{ if(tg){ tg.ready(); tg.expand(); tg.disableVerticalSwipes?.();
  tg.setHeaderColor?.('#050810'); tg.setBackgroundColor?.('#050810'); } }catch(e){}
function haptic(s){ try{ tg?.HapticFeedback?.impactOccurred(s||'light'); }catch(e){} }

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const choose=(a)=>a[Math.floor(Math.random()*a.length)];

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=360,H=640,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();
const GROUND=()=>H*0.72;
const G=900;

/* ================================================================
   WORLD
================================================================ */
const World={
  t:0, startTime:performance.now(),
  entities:[], // unified: {id, x, y, vx, vy, w, h, hp, maxHp, tag, texture, owner, glow, spin, gravity, heldBy, held}
  trees:[], rocks:[], berries:[], blocks:[],
  projectiles:[], particles:[], floaters:[], clouds:[],
  textureRegistry:{},
  nextId:1,
};

/* ================================================================
   TEXTURE SYSTEM — procedural
================================================================ */
function makeTexture(spec){
  // spec: {kind, color1, color2, emoji, pattern, glow, opacity, radius}
  const t = {
    kind: spec.kind || 'shape',
    c1: spec.color1 || '#4de0ff',
    c2: spec.color2 || spec.color1 || '#4de0ff',
    emoji: spec.emoji || '',
    pattern: spec.pattern || 'solid', // solid|stripes|dots|ring|spiral|noise
    glow: spec.glow || 0,
    opacity: spec.opacity ?? 1,
    radius: spec.radius ?? 0, // for shapes
    rot: 0,
  };
  World.textureRegistry[spec.id || ('tex_' + World.nextId++)] = t;
  return t;
}
function randomTexture(){
  const kinds = ['shape','emoji','combo'];
  const kind = choose(kinds);
  const palettes = [
    ['#ff6b6b','#c22a2a'],['#4de0ff','#1a6eb8'],['#6ee7a0','#1a8a5c'],
    ['#ffd166','#d4a800'],['#b878ff','#5a2a9a'],['#ff8a3d','#c2410c'],
    ['#e8e8f0','#5a5a6a'],['#ff4d94','#8a1e50'],
  ];
  const pal = choose(palettes);
  const emojis = ['👾','🌟','🔥','❄️','⚡','💎','🌀','🎯','🦋','🐙','👁️','🌸','🍄','🔮','⚙️','🎭'];
  const patterns = ['solid','stripes','dots','ring','spiral'];
  return makeTexture({
    kind,
    color1: pal[0],
    color2: pal[1],
    emoji: kind==='emoji'||kind==='combo' ? choose(emojis) : '',
    pattern: choose(patterns),
    glow: rand(4,18),
    radius: rand(6,20),
  });
}
function drawTexturedShape(e, t){
  const x = e.x, y = e.y;
  const w = e.w, h = e.h;
  const tex = e.texture;
  ctx.save();
  ctx.translate(x, y);
  if (e.spin) ctx.rotate(e.spin);
  ctx.globalAlpha = tex.opacity;

  if (tex.glow > 0){
    ctx.shadowColor = tex.c1;
    ctx.shadowBlur = tex.glow;
  }

  // Base gradient body
  const g = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  g.addColorStop(0, tex.c1);
  g.addColorStop(1, tex.c2);
  ctx.fillStyle = g;

  if (e.shape === 'circle'){
    ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.fill();
  } else if (e.shape === 'square'){
    ctx.fillRect(-w/2, -h/2, w, h);
  } else if (e.shape === 'triangle'){
    ctx.beginPath();
    ctx.moveTo(0, -h/2);
    ctx.lineTo(w/2, h/2);
    ctx.lineTo(-w/2, h/2);
    ctx.closePath(); ctx.fill();
  } else if (e.shape === 'star'){
    ctx.beginPath();
    const R = w/2, r = R*0.45;
    for (let i=0;i<10;i++){
      const a = i * Math.PI/5 - Math.PI/2;
      const rad = i%2===0 ? R : r;
      ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
    }
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Pattern overlay
  if (tex.pattern === 'stripes'){
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 3;
    for (let i = -h; i < h; i += 8){
      ctx.beginPath(); ctx.moveTo(-w, i); ctx.lineTo(w, i + 6); ctx.stroke();
    }
    ctx.restore();
  } else if (tex.pattern === 'dots'){
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = -w/2; i <= w/2; i += 6){
      for (let j = -h/2; j <= h/2; j += 6){
        ctx.beginPath(); ctx.arc(i, j, 1.4, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  } else if (tex.pattern === 'ring'){
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, w*0.32, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, w*0.18, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  } else if (tex.pattern === 'spiral'){
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 6; a += 0.3){
      const r = a * 2.2;
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Border
  ctx.strokeStyle = 'rgba(0,0,0,.5)';
  ctx.lineWidth = 1.5;
  if (e.shape === 'circle'){ ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.stroke(); }
  else if (e.shape === 'square'){ ctx.strokeRect(-w/2, -h/2, w, h); }

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath();
  ctx.ellipse(-w*0.2, -h*0.25, w*0.2, h*0.12, -0.4, 0, Math.PI*2);
  ctx.fill();

  // Emoji
  if (tex.emoji){
    ctx.font = `${Math.min(w, h) * 0.9}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tex.emoji, 0, 0);
  }

  ctx.restore();
}

function xpNeededFor(l){ return 4 + l * 3; }
function gainXp(amount,reason){
  AI.xp += amount;
  let needed = xpNeededFor(AI.level);
  while (AI.xp >= needed){
    AI.xp -= needed;
    AI.level++;
    AI.intelligence = 1 + (AI.level-1) * 0.18;
    if (SKILLS[AI.level]){
      logMessage('SYSTEM',`🎉 <b>LVL ${AI.level}</b> — ${SKILLS[AI.level]}`, 'system');
      showLevelFlash('LEVEL '+AI.level, SKILLS[AI.level].toUpperCase());
    } else {
      logMessage('SYSTEM',`🎉 <b>LVL ${AI.level}</b> — INT ${AI.intelligence.toFixed(2)}×`, 'system');
      showLevelFlash('LEVEL '+AI.level, 'INTELLIGENCE GROWS');
    }
    autoWriteScript();
    SFX_levelUp();
    haptic('heavy');
    needed = xpNeededFor(AI.level);
  }
}
function showLevelFlash(txt,sub){
  const el=document.getElementById('levelUpFlash');
  document.getElementById('levelTxt').textContent=txt;
  document.getElementById('levelSub').textContent=sub;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function SFX_levelUp(){
  try{
    const c=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047,1319].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,c.currentTime+i*0.07);
      g.gain.linearRampToValueAtTime(.22,c.currentTime+i*0.07+.01);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*0.07+.4);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime+i*0.07); o.stop(c.currentTime+i*0.07+.45);
    });
  }catch(e){}
}

/* ================================================================
   SELF MODIFICATION — AI reworks own body
================================================================ */
function selfModify(what, value){
  const before = { size: AI.sizeScale, texC1: AI.texture.c1, texC2: AI.texture.c2 };
  switch (what){
    case 'bigger':
      AI.sizeScale = clamp(AI.sizeScale * (value || 1.3), 0.3, 4);
      break;
    case 'smaller':
      AI.sizeScale = clamp(AI.sizeScale * (value || 0.7), 0.15, 4);
      break;
    case 'size':
      AI.sizeScale = clamp(value, 0.15, 5);
      break;
    case 'color':
      AI.texture.c1 = value[0];
      AI.texture.c2 = value[1];
      AI.auraColor = hexToRgbStr(value[0]);
      break;
    case 'randomize':
      AI.texture = randomTexture();
      AI.auraColor = hexToRgbStr(AI.texture.c1);
      break;
    case 'glow':
      AI.texture.glow = clamp(AI.texture.glow + (value || 8), 0, 40);
      break;
    case 'pattern':
      AI.texture.pattern = choose(['solid','stripes','dots','ring','spiral']);
      break;
    case 'shape':
      AI.texture.emoji = choose(['🌟','🔥','💎','👾','👁️','⚡','🌊','🌀']);
      break;
    case 'improve':
      AI.selfModLevel++;
      AI.intelligence += 0.05;
      AI.energy = AI.maxEnergy;
      AI.health = Math.min(AI.maxHealth, AI.health + 20);
      break;
  }
  AI.morphT = 0.35;
  spawnParticles(AI.x, AI.y - 20, 20, AI.texture.c1, 200, 0.7, 3.5);
  spawnRing(AI.x, AI.y - 20, AI.texture.c1, 40, 0.5);
  spawnFloater(AI.x, AI.y - 60, `SELF-MOD: ${what}`, '#ffd166', 12);
  gainXp(8, 'self_modify');
}

function hexToRgbStr(hex){
  if (hex.startsWith('rgb')) return hex.match(/\d+/g).join(',');
  const n = parseInt(hex.slice(1), 16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

/* ================================================================
   AI THINK
================================================================ */
function aiThink(dt){
  AI.thoughtTimer -= dt;
  AI.stateTimer -= dt;
  AI.hunger -= dt * 0.6;
  AI.energy -= dt * 0.35;
  AI.autoThinkTimer -= dt;
  AI.teleportCd = Math.max(0, AI.teleportCd - dt);
  AI.morphT = Math.max(0, AI.morphT - dt * 3);

  if (AI.autoThinkTimer <= 0){
    AI.autoThinkTimer = Math.max(2, 10 - AI.level * 0.15);
    if (Math.random() < 0.55 + AI.level * 0.04) autoWriteScript();
  }

  if (AI.grabbed){ AI.state='held'; AI.vy=0; AI.vx=0; return; }

  if (Math.random() < 0.006 * AI.intelligence) gainXp(1, 'passive');

  // Held entity follows
  if (AI.heldEntity){
    const e = AI.heldEntity;
    e.x = AI.x + AI.facing * 26;
    e.y = AI.y - 30;
    e.vx = 0; e.vy = 0;
    e.spin = AI.walkPhase * 0.5;
  }

  if (AI.planIndex < AI.plan.length){
    const step = AI.plan[AI.planIndex];
    if (step.done) AI.planIndex++;
  } else if (AI.plan.length > 0 && AI.planIndex >= AI.plan.length){
    AI.plan=[]; AI.planIndex=0; AI.planLabel='idle';
  }

  if (AI.plan.length === 0 && AI.stateTimer <= 0 && !AI.pendingQuestion){
    generatePlan();
    AI.stateTimer = Math.max(0.1, 0.5 - AI.level * 0.02);
  }

  if (AI.thoughtTimer <= 0){
    AI.thoughtTimer = rand(1.8, 3.2);
    updateThought();
  }

  if (AI.level >= 40) AI.expression='genius';
  else if (AI.state==='retreat') AI.expression='angry';
  else if (AI.energy<25) AI.expression='sleepy';
  else if (AI.state==='rest') AI.expression='sleepy';
  else if (AI.state==='build') AI.expression='happy';
  else AI.expression='neutral';

  const s = AI.plan[AI.planIndex];
  AI.state = s ? s.cmd.replace(/_/g,' ') : 'idle';
  AI.planLabel = s ? s.label : 'Idle';

  if (s) executeStep(s, dt);
}

function generatePlan(){
  AI.plan=[]; AI.planIndex=0;
  const c = Math.min(8, 1 + Math.floor(AI.level / 3));

  // High-level AI: does its own self-improvement
  if (AI.level >= 20 && Math.random() < 0.15){
    push(A.modifySelf('improve'));
    push(A.thinkAbout('self-optimization'));
    return;
  }

  // Randomly ask the user something at higher levels
  if (AI.level >= 6 && Math.random() < 0.04){
    const qs = [
      ['Should I build a tower or a garden?', ['tower','garden']],
      ['Which color do you like?', ['red','blue','green','purple']],
      ['Should I grow bigger or smaller?', ['bigger','smaller']],
      ['What should I spawn next?', ['dragon','star','rain']],
    ];
    const [q,opts] = choose(qs);
    push(A.askUser(q,opts));
    return;
  }

  // Self-modify at higher levels
  if (AI.level >= 18 && Math.random() < 0.1){
    const what = choose(['bigger','smaller','randomize','glow','pattern','shape']);
    push(A.modifySelf(what));
    return;
  }

  // Spawn cool entity
  if (AI.level >= 8 && Math.random() < 0.12){
    push(A.spawnAt({
      tag:'creature',
      x: rand(40,W-40),
      y: GROUND()-20,
      w: rand(14,26),
      h: rand(14,26),
      texture: randomTexture(),
      shape: choose(['circle','square','triangle','star']),
      gravity: 1, bounce: 0.55,
      spinV: rand(-3,3),
      glow: rand(4,14),
    }));
    return;
  }

  // Rest/eat priorities
  if (AI.hunger < 30 && AI.inventory.food > 0){ push(A.eat()); push(A.greet()); return; }
  if (AI.hunger < 45){ for(let i=0;i<c;i++) push(A.gatherBerry()); push(A.eat()); return; }
  if (AI.energy < 30){ push(A.rest()); return; }

  // Build if we have resources
  if (AI.level >= 10 && Math.random() < 0.35){
    for (let i=0;i<c;i++) push(A.gatherTree());
    push(A.buildTower());
    return;
  }
  if (AI.level >= 5 && Math.random() < 0.4){
    for (let i=0;i<c;i++) push(A.gatherTree());
    push(A.buildHome());
    return;
  }

  // Teleport
  if (AI.level >= 4 && Math.random() < 0.15){
    push(A.teleportTo(rand(40,W-40), GROUND()-5));
    return;
  }

  // Grab something
  if (AI.level >= 9 && Math.random() < 0.15){
    push(A.grabNearest());
    push(A.releaseHeld(500));
    return;
  }

  // Default
  const roll = Math.random();
  if (roll < 0.35){ for(let i=0;i<c;i++) push(A.gatherTree()); }
  else if (roll < 0.6){ for(let i=0;i<c;i++) push(A.gatherRock()); }
  else if (roll < 0.85){ push(A.explore()); push(A.gatherBerry()); }
  else { push(A.emote(choose(['🎉','✨','🔥','👋','🌀']))); }
}

function executeStep(step, dt){
  const gy = GROUND();
  const speed = 42 + AI.intelligence * 4;

  switch (step.cmd){
    case 'move_to': {
      if (step.tx === undefined){ step.done = true; return; }
      const dx = step.tx - AI.x;
      if (Math.abs(dx) < 8){ step.done = true; AI.vx *= 0.7; return; }
      AI.vx = Math.sign(dx) * speed;
      AI.facing = Math.sign(dx);
      break;
    }
    case 'gather_tree': {
      const tree = nearest(World.trees, AI);
      if (!tree){ step.done = true; return; }
      const d = Math.abs(tree.x - AI.x);
      if (d > 24){
        AI.vx = Math.sign(tree.x - AI.x) * speed;
        AI.facing = Math.sign(tree.x - AI.x);
      } else {
        AI.vx *= 0.7;
        step.chargeT = (step.chargeT || 0) + dt;
        if (Math.random() < 0.25) spawnParticles(tree.x, tree.y - 10, 3, '#8a5a2a', 80, 0.4, 2);
        if (step.chargeT > (0.6 / AI.intelligence)){
          step.chargeT = 0;
          tree.shake = 0.4;
          spawnParticles(tree.x, tree.y - 10, 6, '#c9a060', 120, 0.5, 3);
          AI.memory.totalGathered++;
          spawnFloater(tree.x, tree.y - 30, '+2 🪵', '#ffd166', 13);
          gainXp(3, 'gather_wood');
          step.done = true;
        }
      }
      break;
    }
    case 'gather_rock': {
      const rock = nearest(World.rocks, AI);
      if (!rock){ step.done = true; return; }
      const d = Math.abs(rock.x - AI.x);
      if (d > 22){
        AI.vx = Math.sign(rock.x - AI.x) * speed;
        AI.facing = Math.sign(rock.x - AI.x);
      } else {
        AI.vx *= 0.7;
        step.chargeT = (step.chargeT || 0) + dt;
        if (step.chargeT > (0.6 / AI.intelligence)){
          step.chargeT = 0;
          rock.shake = 0.4;
          spawnParticles(rock.x, rock.y - 6, 5, '#a0a0a8', 130, 0.5, 3);
          AI.memory.totalGathered++;
          spawnFloater(rock.x, rock.y - 26, '+2 🪨', '#c8cfdc', 13);
          gainXp(3, 'gather_stone');
          step.done = true;
        }
      }
      break;
    }
    case 'gather_berry': {
      const berry = nearest(World.berries.filter(b=>!b.harvested), AI);
      if (!berry){ step.done = true; AI.hunger = Math.min(100, AI.hunger + 5); return; }
      const d = Math.abs(berry.x - AI.x);
      if (d > 20){
        AI.vx = Math.sign(berry.x - AI.x) * speed;
        AI.facing = Math.sign(berry.x - AI.x);
      } else {
        AI.vx *= 0.7;
        step.chargeT = (step.chargeT || 0) + dt;
        if (step.chargeT > (0.45 / AI.intelligence)){
          berry.harvested = true; berry.regrow = 12;
          AI.memory.totalGathered++;
          spawnFloater(berry.x, berry.y - 22, '+1 🍎', '#6ee7a0', 13);
          spawnParticles(berry.x, berry.y - 4, 8, '#ff5a5a', 100, 0.5, 3);
          gainXp(2, 'forage');
          step.done = true;
        }
      }
      break;
    }
    case 'build_wall': {
      if (step.buildX === undefined) step.buildX = AI.x + AI.facing * rand(30, 60);
      const dx = step.buildX - AI.x;
      if (Math.abs(dx) > 30){
        AI.vx = Math.sign(dx) * speed;
        AI.facing = Math.sign(dx);
      } else {
        AI.vx *= 0.7;
        step.buildX = clamp(step.buildX, 20, W-20);
        World.blocks.push({ x: step.buildX, y: gy, w: 20, h: 34, owner:'ai' });
        AI.memory.blocksPlaced++; AI.memory.totalBuilt++;
        spawnParticles(step.buildX, gy - 17, 10, '#a67c46', 130, 0.5, 3);
        spawnFloater(step.buildX, gy - 40, 'built!', '#6ee7a0', 12);
        gainXp(6, 'build');
        step.done = true;
      }
      break;
    }
    case 'build_tower': {
      if (step.buildX === undefined) step.buildX = AI.x + AI.facing * 50;
      const dx = step.buildX - AI.x;
      if (Math.abs(dx) > 30){
        AI.vx = Math.sign(dx) * speed;
        AI.facing = Math.sign(dx);
      } else {
        AI.vx *= 0.7;
        step.buildX = clamp(step.buildX, 20, W-20);
        const height = Math.min(8, 3 + Math.floor(AI.level / 3));
        for (let i=0;i<height;i++){
          World.blocks.push({ x: step.buildX, y: gy - i*20, w: 20, h: 18, owner:'ai' });
        }
        AI.memory.blocksPlaced += height; AI.memory.totalBuilt++;
        spawnParticles(step.buildX, gy - 30, 16, '#a67c46', 180, 0.7, 4);
        spawnFloater(step.buildX, gy - 50, 'TOWER!', '#ffd166', 14);
        gainXp(14, 'build');
        AI.expression = 'happy';
        step.done = true;
      }
      break;
    }
    case 'build_home': {
      if (step.cx === undefined) step.cx = AI.memory.homeX || AI.x;
      const dx = step.cx - AI.x;
      if (Math.abs(dx) > 40){
        AI.vx = Math.sign(dx) * speed;
        AI.facing = Math.sign(dx);
      } else {
        AI.vx *= 0.7;
        const hx = step.cx;
        World.blocks.push({ x: hx-26, y: gy, w: 20, h: 34, owner:'ai' });
        World.blocks.push({ x: hx+26, y: gy, w: 20, h: 34, owner:'ai' });
        World.blocks.push({ x: hx, y: gy-42, w: 72, h: 14, owner:'ai' });
        AI.memory.blocksPlaced += 3; AI.memory.totalBuilt++;
        spawnParticles(hx, gy - 30, 20, '#a67c46', 200, 0.8, 4);
        spawnFloater(hx, gy - 70, 'HOME!', '#6ee7a0', 15);
        gainXp(18, 'build');
        step.done = true;
      }
      break;
    }
    case 'rest': {
      AI.vx *= 0.7;
      AI.energy += dt * (14 + AI.intelligence * 2);
      if (AI.skills && AI.skills.self_repair) AI.health = Math.min(AI.maxHealth, AI.health + dt*8);
      step.rT = (step.rT || 0) + dt;
      if (AI.energy >= 95 || step.rT > 3.5){ step.done = true; }
      break;
    }
    case 'eat': {
      AI.vx *= 0.7;
      step.eT = (step.eT || 0) + dt;
      if (step.eT > 0.4){
        AI.hunger = Math.min(100, AI.hunger + 40);
        AI.health = Math.min(AI.maxHealth, AI.health + 10);
        spawnFloater(AI.x, AI.y - 50, '+hunger', '#6ee7a0', 12);
        gainXp(3, 'eat');
        step.done = true;
      }
      break;
    }
    case 'explore': {
      if (step.tx === undefined) step.tx = clamp(AI.x + rand(-160,160), 30, W-30);
      const dx = step.tx - AI.x;
      if (Math.abs(dx) < 12) step.done = true;
      else { AI.vx = Math.sign(dx) * speed * 0.9; AI.facing = Math.sign(dx); }
      break;
    }
    case 'greet': {
      AI.reactionText = '👋'; AI.reaction = 0.6; step.done = true; break;
    }
    case 'jump': {
      if (!step.jumped && AI.vy >= 0 && AI.y > gy - 10){ AI.vy = -420; step.jumped = true; }
      if (step.jumped && AI.vy > 0 && AI.y > gy - 10) step.done = true;
      break;
    }
    case 'circle':
    case 'orbit': {
      step.a = (step.a || 0) + dt * 2;
      const r = step.r || 50;
      AI.x = AI.memory.homeX + Math.cos(step.a) * r;
      AI.y = clamp(AI.memory.homeY + Math.sin(step.a) * r * 0.3, 60, gy - 5);
      AI.vx = 0;
      if (step.a > Math.PI * 4) step.done = true;
      break;
    }
    case 'emote': {
      AI.reactionText = step.e || '😀'; AI.reaction = 0.6; step.done = true; break;
    }
    case 'teleport': {
      teleport(step.tx ?? rand(40,W-40), step.ty ?? gy - 5);
      step.done = true;
      break;
    }
    case 'spawn_entity': {
      const spec = step.spec;
      if (spec.y === undefined || spec.y === null) spec.y = gy - 20;
      const e = spawnEntity(spec);
      spawnFloater(e.x, e.y - 30, 'SPAWNED', '#b878ff', 13);
      spawnRing(e.x, e.y, '#b878ff', 30, 0.4);
      spawnParticles(e.x, e.y, 14, '#b878ff', 160, 0.6, 3);
      AI.memory.texturesMade++;
      gainXp(10, 'spawn');
      step.done = true;
      break;
    }
    case 'modify_self': {
      if (step.what === 'color'){
        const pal = [['#ff6b6b','#8a1e1e'],['#4de0ff','#1a6eb8'],['#6ee7a0','#1a8a5c'],
                    ['#ffd166','#a86a00'],['#b878ff','#5a2a9a'],['#ff8a3d','#c2410a']][Math.floor(Math.random()*6)];
        selfModify('color', pal);
      } else {
        selfModify(step.what, step.val);
      }
      step.done = true;
      break;
    }
    case 'grab_nearest': {
      const candidates = World.entities.filter(e => !e.held && e.tag !== 'boundary');
      let best = null, bd = 200;
      for (const c of candidates){
        const d = dist(c, AI);
        if (d < bd){ bd = d; best = c; }
      }
      if (best) aiGrabEntity(best);
      step.done = true;
      break;
    }
    case 'release_held': {
      aiReleaseEntity(step.f || 400);
      step.done = true;
      break;
    }
    case 'ask_user': {
      askUser(step.q, step.opts);
      step.done = true;
      break;
    }
    case 'think': {
      AI.thought = 'Thinking about ' + step.topic + '...';
      AI.thoughtTimer = 3;
      spawnParticles(AI.x, AI.y - 45, 8, '#4de0ff', 80, 0.6, 2);
      gainXp(4, 'think');
      step.done = true;
      break;
    }
    case 'paint_world': {
      const c = step.color || randomTexture();
      for (const e of World.entities){
        e.texture = {
          ...e.texture,
          c1: c.c1, c2: c.c2,
        };
      }
      spawnParticles(AI.x, AI.y - 40, 40, c.c1, 320, 1.0, 5);
      spawnFloater(AI.x, AI.y - 60, 'WORLD PAINTED', c.c1, 14);
      gainXp(20, 'paint');
      step.done = true;
      break;
    }
    case 'shrink_all': {
      for (const e of World.entities){ e.w *= 0.6; e.h *= 0.6; }
      spawnFloater(AI.x, AI.y - 60, 'ALL SHRUNK', '#4de0ff', 14);
      gainXp(15, 'mass_edit');
      step.done = true;
      break;
    }
    case 'grow_all': {
      for (const e of World.entities){ e.w *= 1.5; e.h *= 1.5; }
      spawnFloater(AI.x, AI.y - 60, 'ALL GREW', '#ffd166', 14);
      gainXp(15, 'mass_edit');
      step.done = true;
      break;
    }
    case 'randomize_all': {
      for (const e of World.entities){
        e.texture = randomTexture();
        e.shape = choose(['circle','square','triangle','star']);
      }
      spawnFloater(AI.x, AI.y - 60, 'CHAOS!', '#b878ff', 14);
      gainXp(18, 'chaos');
      step.done = true;
      break;
    }
    case 'clear_world': {
      for (const e of World.entities){
        spawnParticles(e.x, e.y, 6, '#b878ff', 120, 0.5, 3);
      }
      World.entities = [];
      gainXp(10, 'clear');
      step.done = true;
      break;
    }
    case 'idle': default: AI.vx *= 0.7; step.done = true;
  }
}

function nearest(list, from){
  let best = null, bd = Infinity;
  for (const it of list){ const d = dist(it, from); if (d < bd){ bd = d; best = it; } }
  return best;
}

function updateThought(){
  const s = AI.state;
  const t = [];
  if (s.includes('gather')) t.push('Working…', 'Materials!', 'One more hit.');
  if (s.includes('build')) t.push('Building…', 'Bricks align.', 'My domain grows.');
  if (s.includes('explore')) t.push('Mapping…', 'What is there?', 'Scanning…');
  if (s === 'rest') t.push('Low power…', 'zzz…', 'Conserving.');
  if (s === 'teleport') t.push('Phase shift!', 'Teleporting…');
  if (s === 'spawn') t.push('Creating.', 'Life from code.');
  if (s === 'grab nearest') t.push('Reaching…', 'Got it.');
  if (s === 'modify self') t.push('Rewriting myself.', 'Improving.');
  if (s === 'idle') t.push('Calculating…', 'Awaiting input.', 'Thinking.');
  if (AI.level >= 5) t.push('Optimizing.', 'Pattern found.', 'Efficiency rising.');
  if (AI.level >= 15) t.push('Exploring idea space.', 'Abstracting.');
  if (AI.level >= 25) t.push('I feel myself expanding.', 'Scripts flow freely.');
  if (AI.level >= 40) t.push('I am becoming… more.', 'Reality is data.', 'Limitless.');
  AI.thought = choose(t.length ? t : ['Processing…']);
}

================================================================ */
function askUser(question, options){
  AI.pendingQuestion = { question, options: options || [] };
  const bar = document.getElementById('questionBar');
  document.getElementById('qText').textContent = question;
  const opts = document.getElementById('qOpts');
  opts.innerHTML = '';
  for (const o of (options || ['yes','no'])){
    const b = document.createElement('div');
    b.className = 'qOpt';
    b.textContent = o;
    b.onclick = () => answerQuestion(o);
    opts.appendChild(b);
  }
  bar.classList.add('show');
  logMessage('ARIA-7', '❓ ' + question, 'system');
  haptic('medium');
}
function answerQuestion(answer){
  const bar = document.getElementById('questionBar');
  bar.classList.remove('show');
  logMessage('You', answer);
  const q = AI.pendingQuestion?.question || '';
  AI.pendingQuestion = null;
  gainXp(6, 'answered');

  // Respond based on answer
  const a = answer.toLowerCase();
  let acts = [];
  if (/tower/.test(a)) acts.push(A.buildTower(), A.gatherTree(), A.gatherTree());
  else if (/garden/.test(a)) {
    for (let i=0;i<4;i++) acts.push(A.spawnAt({
      tag:'flower',
      x: rand(60, W-60),
      y: GROUND()-15,
      w: 16, h: 16,
      texture: makeTexture({kind:'emoji', emoji:'🌸', color1:'#ff8ac8', color2:'#c2297a', glow:8}),
      shape:'circle', gravity:0, static:true,
    }));
  } else if (/castle/.test(a)) { for (let i=0;i<6;i++) acts.push(A.buildTower()); }
  else if (/red/.test(a)) acts.push(A.modifySelf('color', ['#ff6b6b','#8a1e1e']));
  else if (/blue/.test(a)) acts.push(A.modifySelf('color', ['#4de0ff','#1a6eb8']));
  else if (/green/.test(a)) acts.push(A.modifySelf('color', ['#6ee7a0','#1a8a5c']));
  else if (/purple/.test(a)) acts.push(A.modifySelf('color', ['#b878ff','#5a2a9a']));
  else if (/bigger/.test(a)) acts.push(A.modifySelf('bigger'));
  else if (/smaller/.test(a)) acts.push(A.modifySelf('smaller'));
  else if (/dragon/.test(a)) acts.push(A.spawnAt({
    tag:'dragon',
    w: 50, h: 50,
    texture: makeTexture({kind:'emoji', emoji:'🐉', color1:'#ff4d4d', color2:'#7a1a1a', glow:20, pattern:'ring'}),
    shape:'circle', gravity:0.6, bounce:0.6, spinV: 1.5,
  }));
  else if (/star/.test(a)) for (let i=0;i<5;i++) acts.push(A.spawnAt({
    tag:'star', w: 20, h: 20,
    texture: makeTexture({kind:'emoji', emoji:'⭐', color1:'#ffe066', color2:'#d4a800', glow:16}),
    shape:'star', gravity:0.8, bounce:0.7, spinV: rand(-4,4),
  }));
  else if (/rain/.test(a)) for (let i=0;i<10;i++) acts.push(A.spawnAt({
    tag:'drop', x: rand(30, W-30), y: 60,
    w: 10, h: 16,
    texture: makeTexture({kind:'shape', color1:'#4de0ff', color2:'#1a6eb8', glow:8, pattern:'dots'}),
    shape:'circle', gravity:1.2, bounce:0.4,
  }));
  else acts.push(A.idle());

  applyActions(acts);
  const reply = choose([
    'Got it — acting on "'+answer+'".',
    'Understood. Executing.',
    'On it!',
    'Excellent choice.',
  ]);
  logMessage('ARIA-7', reply);
}

/* ================================================================
   PHYSICS
================================================================ */
function updatePhysics(dt){
  const gy = GROUND();
  // AI
  if (AI.grabbed){
    AI.vx=0; AI.vy=0;
  } else {
    AI.vx *= Math.pow(0.001, dt);
    if (Math.abs(AI.vx) < 1) AI.vx = 0;
    AI.vy += G * dt;
    AI.x += AI.vx * dt;
    AI.y += AI.vy * dt;
    if (AI.y > gy - 5){ AI.y = gy - 5; AI.vy = 0; }
    AI.x = clamp(AI.x, 20, W - 20);
  }
  if (Math.abs(AI.vx) > 4) AI.walkPhase += dt * 10;
  AI.blinkTimer -= dt;
  if (AI.blinkTimer <= 0){ AI.blinking = 0.14; AI.blinkTimer = rand(2.5,5.5); }
  if (AI.blinking > 0) AI.blinking -= dt;
  if (AI.reaction > 0) AI.reaction -= dt;

  // Entities
  for (let i = World.entities.length - 1; i >= 0; i--){
    const e = World.entities[i];
    if (e.remove){ World.entities.splice(i, 1); continue; }
    if (e.held){ continue; }
    if (!e.static){
      e.vy += G * e.gravity * dt;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      if (e.y > gy - e.h/2){
        e.y = gy - e.h/2;
        e.vy *= -e.bounce;
        if (Math.abs(e.vy) < 40) e.vy = 0;
        e.vx *= 0.92;
      }
      if (e.x < e.w/2){ e.x = e.w/2; e.vx *= -0.7; }
      if (e.x > W - e.w/2){ e.x = W - e.w/2; e.vx *= -0.7; }
    }
    e.spin += (e.spinV || 0) * dt;
  }

  // Projectiles
  for (let i = World.projectiles.length - 1; i >= 0; i--){
    const p = World.projectiles[i];
    p.vy += G * 0.7 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot = (p.rot||0) + dt * 8;
    if (Math.random() < 0.6){
      World.particles.push({x:p.x,y:p.y,vx:rand(-20,20),vy:rand(-20,20),
        life:0.4,maxLife:0.4,color:p.trailColor||'#fff',size:2.5,grav:40});
    }
    const dxa = p.x - AI.x, dya = p.y - (AI.y - 14);
    if (Math.hypot(dxa, dya) < AI.baseW * AI.sizeScale / 2 + p.r){
      handleProjectileHit(p);
      World.projectiles.splice(i, 1);
      continue;
    }
    if (p.y > gy - 4){
      p.y = gy - 4;
      handleProjectileGround(p);
      World.projectiles.splice(i, 1);
      continue;
    }
    if (p.x < -40 || p.x > W + 40 || p.y > H + 40) World.projectiles.splice(i, 1);
  }

  // Particles
  for (let i = World.particles.length - 1; i >= 0; i--){
    const p = World.particles[i];
    if (p.type === 'ring'){
      p.life -= dt;
      const t = 1 - p.life / p.maxLife;
      p.r = lerp(4, p.maxR, t);
      if (p.life <= 0) World.particles.splice(i, 1);
      continue;
    }
    p.vy += (p.grav || 200) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.97; p.life -= dt;
    if (p.life <= 0) World.particles.splice(i, 1);
  }
  for (let i = World.floaters.length - 1; i >= 0; i--){
    const f = World.floaters[i];
    f.y += f.vy * dt; f.vy *= 0.94; f.life -= dt;
    if (f.life <= 0) World.floaters.splice(i, 1);
  }
  for (const b of World.berries){
    if (b.harvested){ b.regrow -= dt; if (b.regrow <= 0) b.harvested = false; }
  }
  for (const t of World.trees) if (t.shake > 0) t.shake -= dt * 2;
  for (const r of World.rocks) if (r.shake > 0) r.shake -= dt * 2;
  for (const c of World.clouds){
    c.x += c.speed * dt;
    if (c.x - c.w > W + 20){ c.x = -c.w - 20; c.y = rand(40, H*0.35); }
  }
}

function handleProjectileHit(p){
  if (p.type === 'bomb'){
    spawnParticles(p.x, p.y, 30, '#ff8a3d', 260, 0.8, 5, 300);
    spawnRing(p.x, p.y, '#ff8a3d', 70, 0.6);
    AI.health -= 22; AI.vx += p.vx * 0.8; AI.vy = -250;
    AI.expression = 'angry'; AI.reactionText = '💥'; AI.reaction = 0.6;
    spawnFloater(p.x, p.y - 20, '-22', '#ff6b6b', 13);
    gainXp(4, 'survived'); haptic('heavy');
  } else if (p.type === 'apple'){
    AI.hunger = Math.min(100, AI.hunger + 25);
    AI.health = Math.min(AI.maxHealth, AI.health + 8);
    spawnFloater(p.x, p.y - 20, '+25 🍎', '#6ee7a0', 11);
    AI.reactionText = '😋'; AI.reaction = 0.7;
    spawnParticles(p.x, p.y, 12, '#ff6b6b', 140, 0.6, 3);
    gainXp(2, 'fed');
  } else if (p.type === 'ball'){
    spawnParticles(p.x, p.y, 10, '#ffffff', 150, 0.5, 3);
    AI.vx += p.vx * 0.6; AI.vy = -180;
    AI.reactionText = '😤'; AI.reaction = 0.6;
    gainXp(1, 'play');
  } else if (p.type === 'bolt'){
    spawnParticles(p.x, p.y, 20, '#ffe066', 220, 0.6, 4);
    spawnRing(p.x, p.y, '#ffe066', 60, 0.5);
    AI.health -= 5; AI.energy += 30;
    AI.reactionText = '⚡'; AI.reaction = 0.6;
    spawnFloater(p.x, p.y - 20, '+30', '#4de0ff', 11);
    gainXp(3, 'charged');
  } else {
    // Any other item becomes entity-friendly
    AI.health -= 6;
    AI.expression = 'angry';
    gainXp(1, 'hit');
    spawnParticles(p.x, p.y, 10, '#b878ff', 140, 0.5, 3);
  }
  haptic('medium');
}
function handleProjectileGround(p){
  const gy = GROUND();
  if (p.type === 'bomb'){
    spawnParticles(p.x, p.y, 22, '#ff8a3d', 220, 0.7, 4, 400);
    spawnRing(p.x, p.y, '#ff8a3d', 60, 0.5);
  } else if (p.type === 'apple'){
    spawnParticles(p.x, p.y, 8, '#ff6b6b', 100, 0.4, 3);
  } else if (p.type === 'bolt'){
    spawnParticles(p.x, p.y, 12, '#ffe066', 180, 0.5, 3);
  } else if (p.type === 'dragon'){
    // spawn an entity
    spawnEntity({
      tag:'dragon',
      x: clamp(p.x, 40, W-40),
      y: gy - 25,
      w: 46, h: 46,
      texture: makeTexture({kind:'emoji', emoji:'🐉', color1:'#ff4d4d', color2:'#7a1a1a', glow:18, pattern:'ring'}),
      shape:'circle', gravity:0.5, bounce:0.5, spinV: 1.2,
    });
  } else if (p.type === 'crown'){
    spawnEntity({
      tag:'crown',
      x: clamp(p.x, 40, W-40),
      y: gy - 20,
      w: 26, h: 26,
      texture: makeTexture({kind:'emoji', emoji:'👑', color1:'#ffd166', color2:'#a86a00', glow:18}),
      shape:'circle', gravity:0.6, bounce:0.6, spinV: 0.8,
    });
  } else if (p.type === 'star'){
    spawnEntity({
      tag:'star',
      x: clamp(p.x, 40, W-40),
      y: gy - 20,
      w: 20, h: 20,
      texture: makeTexture({kind:'emoji', emoji:'⭐', color1:'#ffe066', color2:'#d4a800', glow:16}),
      shape:'star', gravity:0.8, bounce:0.7, spinV: rand(-4,4),
    });
  } else if (p.type === 'paint'){
    // paint everything in a radial burst
    const c1 = choose(['#ff6b6b','#4de0ff','#6ee7a0','#ffd166','#b878ff']);
    const c2 = choose(['#8a1e1e','#1a6eb8','#1a8a5c','#a86a00','#5a2a9a']);
    for (const e of World.entities){
      if (dist(e, p) < 100){
        e.texture = { ...e.texture, c1, c2 };
      }
    }
    spawnParticles(p.x, p.y, 40, c1, 260, 0.9, 4);
    spawnRing(p.x, p.y, c1, 100, 0.7);
    logMessage('ARIA-7', 'World patch painted!');
  }
}

/* ================================================================

================================================================ */
let fpsFrames=0, fpsTimer=0, fpsDisplay=60;
function render(dt){
  fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5){ fpsDisplay = Math.round(fpsFrames / fpsTimer); fpsFrames = 0; fpsTimer = 0; }
  const t = World.t, gy = GROUND();

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, '#0a1230'); sky.addColorStop(0.4, '#1a2448');
  sky.addColorStop(0.75, '#3a3858'); sky.addColorStop(1, '#6a5568');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, gy);

  // Sun
  const sunX = W*0.78, sunY = H*0.18;
  const sunG = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 90);
  sunG.addColorStop(0, 'rgba(255,220,140,.35)');
  sunG.addColorStop(0.5, 'rgba(255,180,100,.12)');
  sunG.addColorStop(1, 'rgba(255,180,100,0)');
  ctx.fillStyle = sunG; ctx.beginPath(); ctx.arc(sunX, sunY, 90, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,200,.9)';
  ctx.beginPath(); ctx.arc(sunX, sunY, 16 + Math.sin(t*0.6)*1.5, 0, Math.PI*2); ctx.fill();

  // Stars
  for (let i=0;i<40;i++){
    const sx = (i*137)%W, sy = (i*79)%(gy*0.6);
    const s = 0.6 + (Math.sin(t*0.5+i)*0.5+0.5)*0.7;
    ctx.globalAlpha = 0.25 + Math.sin(t*1.2+i)*0.15;
    ctx.fillStyle = '#fff'; ctx.fillRect(sx, sy, s, s);
  }
  ctx.globalAlpha = 1;

  // Clouds
  for (const c of World.clouds){
    ctx.globalAlpha = c.alpha; ctx.fillStyle = '#c8d8ff';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w*0.5, c.w*0.18, 0, 0, Math.PI*2);
    ctx.ellipse(c.x - c.w*0.2, c.y+3, c.w*0.35, c.w*0.16, 0, 0, Math.PI*2);
    ctx.ellipse(c.x + c.w*0.22, c.y+2, c.w*0.3, c.w*0.15, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Mountains
  ctx.fillStyle = 'rgba(30,25,55,.7)';
  ctx.beginPath(); ctx.moveTo(0, gy);
  for (let x=0;x<=W;x+=20){
    const y = gy - 40 - Math.sin(x*0.015 + 0.5)*30 - Math.sin(x*0.04)*15;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, gy); ctx.closePath(); ctx.fill();

  // Ground
  const gg = ctx.createLinearGradient(0, gy, 0, H);
  gg.addColorStop(0, '#2a3d2a'); gg.addColorStop(0.3, '#1a2820'); gg.addColorStop(1, '#0a1420');
  ctx.fillStyle = gg; ctx.fillRect(0, gy, W, H - gy);
  ctx.strokeStyle = 'rgba(90,140,90,.18)'; ctx.lineWidth = 1;
  for (let i=0;i<24;i++){
    const gx = (i*41)%W, gyy = gy + ((i*17)%(H-gy));
    ctx.beginPath(); ctx.moveTo(gx, gyy); ctx.lineTo(gx+6, gyy-2); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(110,180,110,.2)'; ctx.fillRect(0, gy, W, 1.5);

  // Trees, rocks, berries, blocks
  for (const tr of World.trees) drawTree(tr, t);
  for (const rk of World.rocks) drawRock(rk, t);
  for (const b of World.berries) drawBerry(b, t);
  for (const bl of World.blocks) drawBlock(bl, t);

  // Entities — drawn generically with their textures
  for (const e of World.entities){
    drawTexturedShape(e, e.texture);
  }

  // Projectiles
  for (const p of World.projectiles) drawProjectile(p, t);

  // AI
  drawAI(t);

  // Particles
  for (const p of World.particles){
    if (p.type === 'ring'){
      const a = p.life / p.maxLife;
      ctx.strokeStyle = p.color; ctx.globalAlpha = a * 0.9;
      ctx.lineWidth = 3 * a + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1; continue;
    }
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    const s = p.size * a;
    if (s < 3) ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;

  // Floaters
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of World.floaters){
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = `900 ${f.size}px -apple-system, sans-serif`;
    ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (AI.reaction > 0){
    const a = AI.reaction / 0.6;
    ctx.globalAlpha = a;
    ctx.font = '900 22px -apple-system, sans-serif';
    ctx.fillText(AI.reactionText, AI.x, AI.y - 60 - (0.6 - AI.reaction) * 40);
    ctx.globalAlpha = 1;
  }
}
function drawTree(tr, t){
  const shake = tr.shake > 0 ? Math.sin(t*40) * tr.shake * 4 : 0;
  const x = tr.x + shake, y = tr.y;
  ctx.fillStyle = '#5a3a20'; ctx.fillRect(x - 3, y - 14, 6, 14);
  ctx.fillStyle = '#3a2010'; ctx.fillRect(x - 3, y - 14, 6, 4);
  const g = ctx.createRadialGradient(x - 3, y - 22, 3, x, y - 22, tr.r);
  g.addColorStop(0, '#4a7a3a'); g.addColorStop(0.6, '#2a5a2a'); g.addColorStop(1, '#1a3a1a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y - 22, tr.r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(150,220,120,.25)';
  ctx.beginPath(); ctx.arc(x - 6, y - 26, tr.r * 0.35, 0, Math.PI*2); ctx.fill();
}
function drawRock(rk, t){
  const shake = rk.shake > 0 ? Math.sin(t*40) * rk.shake * 3 : 0;
  const x = rk.x + shake, y = rk.y;
  ctx.fillStyle = '#5a5a6a';
  ctx.beginPath(); ctx.ellipse(x, y - rk.r*0.5, rk.r, rk.r*0.75, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7a7a8a';
  ctx.beginPath(); ctx.ellipse(x - rk.r*0.3, y - rk.r*0.7, rk.r*0.4, rk.r*0.3, 0, 0, Math.PI*2); ctx.fill();
}
function drawBerry(b, t){
  const x = b.x, y = b.y;
  if (b.harvested) ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#2a5a2a';
  ctx.beginPath(); ctx.ellipse(x, y - b.r*0.3, b.r, b.r*0.7, 0, 0, Math.PI*2); ctx.fill();
  if (!b.harvested){
    ctx.fillStyle = '#ff3a3a';
    for (let i=0;i<5;i++){
      const a = i * 1.3;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a)*b.r*0.5, y - b.r*0.3 + Math.sin(a)*b.r*0.4, 2.8, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawBlock(bl, t){
  const x = bl.x - bl.w/2, y = bl.y - bl.h;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x + 1, bl.y - 2, bl.w, 3);
  const g = ctx.createLinearGradient(0, y, 0, y + bl.h);
  if (bl.owner === 'ai'){ g.addColorStop(0,'#a87c4a'); g.addColorStop(1,'#6a4a2a'); }
  else { g.addColorStop(0,'#8a8a9a'); g.addColorStop(1,'#4a4a5a'); }
  ctx.fillStyle = g; ctx.fillRect(x, y, bl.w, bl.h);
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 0.7;
  for (let i=1;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(x, y + i*bl.h/3); ctx.lineTo(x + bl.w, y + i*bl.h/3); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x, y, bl.w, 2);
}
function drawProjectile(p, t){
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot||0);
  if (p.type === 'bomb'){
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffcc44'; ctx.shadowColor = '#ffaa22'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(2, -p.r - 5, 2 + Math.sin(t*30), 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (p.type === 'apple'){
    ctx.fillStyle = '#e02a2a'; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a7a3a'; ctx.beginPath(); ctx.ellipse(3, -p.r - 2, 4, 2.5, -0.4, 0, Math.PI*2); ctx.fill();
  } else if (p.type === 'ball'){
    ctx.fillStyle = '#e8e8f0'; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a2a'; ctx.fillStyle = '#1a1a2a';
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fillStyle='#1a1a2a'; ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i=0;i<5;i++){
      const a = i * 1.256;
      ctx.beginPath(); ctx.arc(Math.cos(a)*p.r*0.5, Math.sin(a)*p.r*0.5, p.r*0.28, 0, Math.PI*2); ctx.fill();
    }
  } else if (p.type === 'bolt'){
    ctx.fillStyle = '#ffe066'; ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(4, -p.r); ctx.lineTo(-p.r*0.3, 0); ctx.lineTo(2, 0);
    ctx.lineTo(-3, p.r); ctx.lineTo(p.r*0.4, -2); ctx.lineTo(-1, -2);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  } else {
    // Emoji projectile
    const icon = { dragon:'🐉', crown:'👑', paint:'🎨', star:'⭐' }[p.type] || '⚪';
    ctx.font = `${p.r * 2.2}px "Apple Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icon, 0, 0);
  }
  ctx.restore();
}

function drawAI(t){
  const x = AI.x, y = AI.y;
  const scale = AI.sizeScale;
  const morph = AI.morphT;
  const morphScale = 1 + Math.sin(morph * 20) * 0.15 * (morph > 0 ? 1 : 0);
  const bob = Math.abs(AI.vx) > 4 ? Math.sin(AI.walkPhase) * 2 : Math.sin(t*2) * 1.2;
  const legA = Math.abs(AI.vx) > 4 ? Math.sin(AI.walkPhase) * 4 : 0;
  const legB = Math.abs(AI.vx) > 4 ? -Math.sin(AI.walkPhase) * 4 : 0;
  const armA = Math.abs(AI.vx) > 4 ? -Math.sin(AI.walkPhase) * 5 : Math.sin(t*1.5) * 1;
  const armB = Math.abs(AI.vx) > 4 ? Math.sin(AI.walkPhase) * 5 : Math.sin(t*1.5 + 1) * 1;

  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, 15 * scale, 4 * scale, 0, 0, Math.PI*2); ctx.fill();

  const auraColor = AI.auraColor;

  // Aura
  const auraPulse = 0.5 + Math.sin(t*2.5) * 0.25;
  const auraG = ctx.createRadialGradient(x, y - 14*scale, 2, x, y - 14*scale, 42*scale);
  auraG.addColorStop(0, `rgba(${auraColor},${0.4 * auraPulse})`);
  auraG.addColorStop(1, `rgba(${auraColor},0)`);
  ctx.fillStyle = auraG; ctx.beginPath(); ctx.arc(x, y - 14*scale, 42*scale, 0, Math.PI*2); ctx.fill();

  const by = y - 14*scale + bob;
  const legL = 4 * scale;
  const torsoTop = 8 * scale;
  const headR = 10 * scale;

  // Legs
  ctx.strokeStyle = '#3a4a6a'; ctx.lineWidth = 4*scale; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - legL, by + 10*scale); ctx.lineTo(x - legL + legA*scale, by + 20*scale);
  ctx.moveTo(x + legL, by + 10*scale); ctx.lineTo(x + legL + legB*scale, by + 20*scale);
  ctx.stroke();
  ctx.strokeStyle = `rgba(${auraColor},0.7)`; ctx.lineWidth = 1.5*scale;
  ctx.beginPath();
  ctx.moveTo(x - legL, by + 12*scale); ctx.lineTo(x - legL + legA*scale, by + 19*scale);
  ctx.moveTo(x + legL, by + 12*scale); ctx.lineTo(x + legL + legB*scale, by + 19*scale);
  ctx.stroke();

  // Torso (uses texture c1/c2)
  const torsoG = ctx.createLinearGradient(x, by - torsoTop, x, by + torsoTop);
  torsoG.addColorStop(0, AI.texture.c1);
  torsoG.addColorStop(1, AI.texture.c2);
  ctx.fillStyle = torsoG;
  ctx.beginPath();
  ctx.moveTo(x - 8*scale, by + 10*scale);
  ctx.lineTo(x - 8*scale, by - 4*scale);
  ctx.quadraticCurveTo(x, by - 10*scale, x + 8*scale, by - 4*scale);
  ctx.lineTo(x + 8*scale, by + 10*scale);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1*scale; ctx.stroke();

  // Chest emblem
  ctx.fillStyle = `rgba(${auraColor},0.9)`;
  ctx.shadowColor = `rgba(${auraColor},1)`; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(x, by + 2*scale, 3*scale, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Arms
  ctx.strokeStyle = '#4a5a88'; ctx.lineWidth = 3.5*scale;
  ctx.beginPath();
  ctx.moveTo(x - 8*scale, by - 2*scale); ctx.lineTo(x - 12*scale + armA*scale, by + 8*scale);
  ctx.moveTo(x + 8*scale, by - 2*scale); ctx.lineTo(x + 12*scale + armB*scale, by + 8*scale);
  ctx.stroke();
  ctx.fillStyle = '#2a3a68';
  ctx.beginPath(); ctx.arc(x - 12*scale + armA*scale, by + 8*scale, 3*scale, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 12*scale + armB*scale, by + 8*scale, 3*scale, 0, Math.PI*2); ctx.fill();

  // Head (uses texture)
  const headY = by - 14*scale;
  const headG = ctx.createRadialGradient(x - 2*scale, headY - 2*scale, 1, x, headY, headR);
  headG.addColorStop(0, AI.texture.c1);
  headG.addColorStop(1, AI.texture.c2);
  ctx.fillStyle = headG;
  ctx.beginPath(); ctx.arc(x, headY, headR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.2*scale; ctx.stroke();

  // Visor
  ctx.fillStyle = '#0a0f1e';
  ctx.beginPath(); ctx.ellipse(x, headY + 1*scale, 8*scale, 4*scale, 0, 0, Math.PI*2); ctx.fill();

  // Eyes
  const blinkAmt = AI.blinking > 0 ? 0.1 : 1;
  const eyeY = headY + 1*scale;
  if (AI.expression === 'happy'){
    ctx.strokeStyle = `rgba(${auraColor},1)`; ctx.lineWidth = 1.8*scale;
    ctx.beginPath();
    ctx.moveTo(x - 4.5*scale, eyeY + 1*scale); ctx.lineTo(x - 2.5*scale, eyeY - 1*scale); ctx.lineTo(x - 0.5*scale, eyeY + 1*scale);
    ctx.moveTo(x + 0.5*scale, eyeY + 1*scale); ctx.lineTo(x + 2.5*scale, eyeY - 1*scale); ctx.lineTo(x + 4.5*scale, eyeY + 1*scale);
    ctx.stroke();
  } else if (AI.expression === 'angry'){
    ctx.fillStyle = `rgba(${auraColor},1)`; ctx.shadowColor = `rgba(${auraColor},1)`; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(x - 3*scale, eyeY, 1.8*scale*blinkAmt, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3*scale, eyeY, 1.8*scale*blinkAmt, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (AI.expression === 'sleepy'){
    ctx.strokeStyle = `rgba(${auraColor},0.9)`; ctx.lineWidth = 1.5*scale;
    ctx.beginPath();
    ctx.moveTo(x - 4.5*scale, eyeY); ctx.lineTo(x - 1.5*scale, eyeY);
    ctx.moveTo(x + 1.5*scale, eyeY); ctx.lineTo(x + 4.5*scale, eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle = `rgba(${auraColor},1)`; ctx.shadowColor = `rgba(${auraColor},1)`; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x - 3*scale, eyeY, 1.6*scale, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3*scale, eyeY, 1.6*scale, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Antenna
  ctx.strokeStyle = '#5a7ab8'; ctx.lineWidth = 1.2*scale;
  ctx.beginPath(); ctx.moveTo(x, headY - headR); ctx.lineTo(x, headY - headR - 5*scale); ctx.stroke();
  ctx.fillStyle = `rgba(${auraColor},1)`; ctx.shadowColor = `rgba(${auraColor},1)`; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, headY - headR - 6*scale, 2*scale, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Texture emoji overlay
  if (AI.texture.emoji){
    ctx.font = `${Math.min(AI.baseW, AI.baseH) * scale * 0.5}px "Apple Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(AI.texture.emoji, x, by + 2*scale);
  }

  // Held indicator
  if (AI.grabbed){
    ctx.strokeStyle = 'rgba(77,224,255,.9)'; ctx.lineWidth = 2;
    ctx.setLineDash([4,4]); ctx.lineDashOffset = -t*20;
    ctx.beginPath(); ctx.arc(x, y - 14*scale, 30*scale, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

const throwGhostEl = document.getElementById('throwGhost');
const dragState = { mode: null, item: null, pointerId: null };

canvas.addEventListener('pointerdown', (ev) => {
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  if (Math.hypot(px - AI.x, py - (AI.y - 14)) < 30 * AI.sizeScale){
    AI.grabbed = true;
    AI.grabOffX = AI.x - px; AI.grabOffY = (AI.y - 14) - py;
    dragState.mode = 'ai'; dragState.pointerId = ev.pointerId;
    haptic('light');
    canvas.setPointerCapture(ev.pointerId);
    return;
  }
  // Grab nearest entity on touch
  for (let i = World.entities.length - 1; i >= 0; i--){
    const e = World.entities[i];
    if (Math.hypot(px - e.x, py - e.y) < Math.max(e.w, e.h) * 0.7){
      e.vx = (px - e.x) * 6;
      e.vy = -200;
      spawnParticles(e.x, e.y, 6, e.texture.c1, 120, 0.4, 3);
      haptic('light');
      return;
    }
  }
});

canvas.addEventListener('pointermove', (ev) => {
  if (dragState.mode === 'ai' && AI.grabbed){
    const rect = canvas.getBoundingClientRect();
    const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
    AI.x = clamp(px + AI.grabOffX, 20, W - 20);
    AI.y = clamp(py + AI.grabOffY, 60, GROUND() - 5);
    if (Math.random() < 0.4){
      World.particles.push({ x: AI.x + rand(-6,6), y: AI.y + rand(-8,8),
        vx: 0, vy: 0, life: 0.35, maxLife: 0.35, color: 'rgba(77,224,255,.7)', size: 2, grav: 0 });
    }
  }
});

canvas.addEventListener('pointerup', (ev) => {
  if (dragState.mode === 'ai' && AI.grabbed){
    AI.grabbed = false;
    AI.thought = 'Put me down!'; AI.thoughtTimer = 2;
    haptic('light');
    dragState.mode = null;
  }
});
canvas.addEventListener('pointercancel', () => {
  if (dragState.mode === 'ai'){ AI.grabbed = false; dragState.mode = null; }
});

const itemEls = document.querySelectorAll('.item');
itemEls.forEach(el => {
  el.addEventListener('pointerdown', (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    dragState.mode = 'item';
    dragState.item = el.dataset.item;
    dragState.pointerId = ev.pointerId;
    el.classList.add('dragging');
    throwGhostEl.textContent = el.dataset.icon;
    throwGhostEl.classList.add('show');
    throwGhostEl.style.left = ev.clientX + 'px';
    throwGhostEl.style.top = ev.clientY + 'px';
    haptic('light');
    try { el.setPointerCapture(ev.pointerId); } catch(e){}
  });
  el.addEventListener('pointermove', (ev) => {
    if (dragState.mode !== 'item') return;
    throwGhostEl.style.left = ev.clientX + 'px';
    throwGhostEl.style.top = ev.clientY + 'px';
  });
  el.addEventListener('pointerup', (ev) => {
    if (dragState.mode !== 'item') return;
    el.classList.remove('dragging');
    throwGhostEl.classList.remove('show');
    dragState.mode = null;
    const rect = canvas.getBoundingClientRect();
    if (ev.clientX >= rect.left && ev.clientX <= rect.right &&
        ev.clientY >= rect.top && ev.clientY <= rect.bottom){
      throwItem(dragState.item, ev.clientX - rect.left, ev.clientY - rect.top);
    }
    try { el.releasePointerCapture(ev.pointerId); } catch(e){}
  });
  el.addEventListener('pointercancel', () => {
    el.classList.remove('dragging');
    throwGhostEl.classList.remove('show');
    dragState.mode = null;
  });
});

function throwItem(type, targetX, targetY){
  const startX = W / 2, startY = H - 20;
  const dx = targetX - startX, dy = targetY - startY;
  const d = Math.hypot(dx, dy);
  const speed = d * 1.6;
  const vx = (dx / d) * speed;
  const vy = (dy / d) * speed - 220;
  const r = type === 'bomb' ? 9 : type === 'block' ? 8 : type === 'bolt' ? 7 : 9;
  const trailColor = {
    bomb:'#ff8a3d', apple:'#ff6b6b', bolt:'#ffe066',
    dragon:'#ff4d4d', crown:'#ffd166', paint:'#b878ff', star:'#ffe066'
  }[type] || '#c8d8ff';
  World.projectiles.push({ x: startX, y: startY, vx, vy, type, r, rot: 0, trailColor });
  spawnParticles(startX, startY, 8, trailColor, 140, 0.4, 3, 300);
  haptic('medium');
}

function processUserInput(text){

  if (!t) return;
  logMessage('You', t);
