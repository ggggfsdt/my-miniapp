<!DOCTYPE html>
<html lang="en" data-theme="onyx">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>dllump · mines</title>
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<script>
  // Apply saved theme before render to avoid flash
  (function(){
    try {
      var t = localStorage.getItem('dllump_mines_theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch(_){}
  })();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{
    --bg-base:#0a0a0a;
    --surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.08);--surface3:rgba(255,255,255,.12);
    --primary:#5b9dff;
    --text:#f5f5f5;--text2:#9a9a9a;--text3:#5a5a5a;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
    --gold:#d4b46a;--red:#e0556b;--green:#4CC38A;
    --accent-1:#6da9ff;
    --accent-2:#4a86e8;
    --accent-rgb:91,157,255;
    --glow-1:rgba(91,157,255,.08);
    --glow-2:rgba(76,195,138,.05);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
    --r-sm:14px;--r-md:16px;--r-lg:20px;--r-xl:22px;--r-pill:99px;
  }

  /* ============ THEMES ============ */
  html[data-theme="midnight"]{
    --bg-base:#060b1a;
    --accent-1:#6da9ff;--accent-2:#3558b8;--accent-rgb:91,157,255;
    --glow-1:rgba(91,157,255,.12);--glow-2:rgba(60,120,255,.06);
  }
  html[data-theme="forest"]{
    --bg-base:#061208;
    --accent-1:#6dcc8a;--accent-2:#2ea05a;--accent-rgb:108,204,138;
    --glow-1:rgba(108,204,138,.12);--glow-2:rgba(76,195,138,.06);
  }
  html[data-theme="crimson"]{
    --bg-base:#14060a;
    --accent-1:#ff6d7a;--accent-2:#c8303f;--accent-rgb:255,109,122;
    --glow-1:rgba(255,109,122,.12);--glow-2:rgba(224,85,107,.06);
  }
  html[data-theme="royal"]{
    --bg-base:#0e0618;
    --accent-1:#b47aff;--accent-2:#7a3fd4;--accent-rgb:180,122,255;
    --glow-1:rgba(180,122,255,.12);--glow-2:rgba(139,93,220,.06);
  }
  html[data-theme="amber"]{
    --bg-base:#140a02;
    --accent-1:#ffb066;--accent-2:#d47a1e;--accent-rgb:255,176,102;
    --glow-1:rgba(255,176,102,.12);--glow-2:rgba(255,157,77,.06);
  }

  html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg-base);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}

  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:440px;margin:0 auto;
    position:relative;background:var(--bg-base);overflow:hidden;isolation:isolate}
  #app::before{content:'';position:absolute;inset:-40px;z-index:0;
    background:radial-gradient(ellipse at 30% 15%, var(--glow-1), transparent 55%),
               radial-gradient(ellipse at 80% 90%, var(--glow-2), transparent 55%);
    filter:blur(30px);pointer-events:none}
  #app::after{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(circle at 30% 20%, rgba(0,0,0,.25), rgba(0,0,0,.7) 70%);pointer-events:none}
  #app > *{position:relative;z-index:1}

  /* ============== TOPBAR ============== */
  #topbar{display:flex;align-items:center;gap:8px;
    padding:calc(14px + var(--safe-top)) 12px 10px;flex-shrink:0}
  .back-btn{width:38px;height:38px;border-radius:var(--r-sm);border:.5px solid var(--border);
    background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .18s var(--ease-spring),background .2s,color .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  .back-btn:active{transform:scale(.9) rotate(35deg);background:var(--surface3);color:var(--accent-1)}
  .back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #topbar .title{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px;min-height:20px;
    background:linear-gradient(180deg,#fff,#b8c8e0);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent}
  #topbar .title .caret{display:inline-block;width:1.5px;height:14px;background:#8fb8ff;
    margin-left:2px;vertical-align:-2px;animation:caretBlink 1s steps(1,end) infinite;border-radius:2px}
  @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .balance-pill{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:var(--r-pill);
    background:var(--surface2);border:.5px solid var(--border);flex-shrink:0}
  .balance-pill img{width:18px;height:18px;display:block;object-fit:contain}
  .balance-pill span{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  /* ============== MULTIPLIER BAR ============== */
  #mult-bar-outer{flex-shrink:0;margin-bottom:6px;display:flex;align-items:center;gap:8px;padding:0 12px 0 0}
  #mult-bar-wrap{flex:1;min-width:0;position:relative;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
  #mult-bar{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  #mult-bar::-webkit-scrollbar{display:none}
  .mult-inner{display:flex;gap:8px;padding:10px 24px;position:relative;width:max-content}

  #mult-indicator{position:absolute;top:10px;bottom:10px;left:0;width:0;
    border-radius:18px;
    background:linear-gradient(180deg,#4CC38A,#2fa86f);
    box-shadow:0 6px 18px rgba(76,195,138,.32),inset 0 1px 0 rgba(255,255,255,.25);
    transition:left .5s var(--ease-spring),width .5s var(--ease-spring),
               background .45s ease,box-shadow .45s ease;
    z-index:0;pointer-events:none}
  #mult-indicator.tier-blue{background:linear-gradient(180deg,#6db3ff,#3a7fd4);
    box-shadow:0 6px 20px rgba(91,157,255,.5),inset 0 1px 0 rgba(255,255,255,.3)}
  #mult-indicator.tier-purple{background:linear-gradient(180deg,#c193ff,#8b5ddc);
    box-shadow:0 6px 22px rgba(180,122,255,.55),inset 0 1px 0 rgba(255,255,255,.3)}
  #mult-indicator.tier-yellow{background:linear-gradient(180deg,#ffe68a,#d4b02e);
    box-shadow:0 6px 24px rgba(245,215,110,.55),inset 0 1px 0 rgba(255,255,255,.35)}
  #mult-indicator.tier-orange{background:linear-gradient(180deg,#ffb877,#e07c1e);
    box-shadow:0 6px 26px rgba(255,157,77,.6),inset 0 1px 0 rgba(255,255,255,.32)}

  .mult-item{position:relative;z-index:1;padding:10px 16px;border-radius:18px;
    color:rgba(255,255,255,.4);
    font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.1px;
    white-space:nowrap;
    transition:color .4s ease,transform .4s var(--ease-spring),opacity .3s ease}
  .mult-item.tier-blue{color:#5b9dff}
  .mult-item.tier-purple{color:#b47aff}
  .mult-item.tier-yellow{color:#f5d76e}
  .mult-item.tier-orange{color:#ff9d4d}
  .mult-item.active{color:#fff !important;transform:scale(1.08);text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .mult-item.done{opacity:.68}

  #mult-max{
    position:relative;overflow:hidden;
    flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:70px;padding:8px 14px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.16),
      inset 0 -1px 0 rgba(0,0,0,.4),
      0 4px 14px rgba(0,0,0,.3);
    transition:box-shadow .4s ease}
  #mult-max .mm-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(180deg,#4CC38A,#2fa86f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
    transition:width .55s var(--ease-spring),background .4s ease;
    z-index:0;pointer-events:none}
  #mult-max.tier-blue .mm-fill{background:linear-gradient(180deg,#6db3ff,#3a7fd4)}
  #mult-max.tier-purple .mm-fill{background:linear-gradient(180deg,#c193ff,#8b5ddc)}
  #mult-max.tier-yellow .mm-fill{background:linear-gradient(180deg,#ffe68a,#d4b02e)}
  #mult-max.tier-orange .mm-fill{background:linear-gradient(180deg,#ffb877,#e07c1e)}

  #mult-max .mm-label{position:relative;z-index:1;
    font-size:8px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
    color:rgba(255,255,255,.55);line-height:1;margin-bottom:3px;
    transition:color .4s ease}
  #mult-max .mm-value{position:relative;z-index:1;
    font-size:14px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;
    letter-spacing:-.3px;line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.65),0 0 8px rgba(0,0,0,.35);
    transition:color .4s ease,text-shadow .4s ease}
  #mult-max.pulse .mm-value{animation:mmPulse .55s var(--ease-spring)}
  @keyframes mmPulse{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

  #next-2x-hint{
    position:absolute;top:-8px;
    width:34px;height:34px;object-fit:contain;
    transform:translateX(-50%) translateY(-100%) scale(.4);
    opacity:0;pointer-events:none;
    transition:opacity .35s ease,transform .5s var(--ease-spring);
    filter:drop-shadow(0 4px 10px rgba(91,157,255,.55));
    z-index:5;
  }
  #next-2x-hint.show{opacity:1;transform:translateX(-50%) translateY(-100%) scale(1);
    animation:nextHintBounce 1.4s ease-in-out infinite}
  @keyframes nextHintBounce{
    0%,100%{transform:translateX(-50%) translateY(-100%) scale(1)}
    50%{transform:translateX(-50%) translateY(calc(-100% - 5px)) scale(1.1)}
  }

  /* ============== GRID ============== */
  #grid-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
    padding:0 12px;position:relative;overflow:hidden}

  #grid-frame{
    position:relative;padding:12px;border-radius:24px;
    background:linear-gradient(180deg,#252a34 0%,#171b22 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -4px 0 rgba(0,0,0,.55),
      0 10px 30px rgba(0,0,0,.5);
    transition:transform .45s var(--ease-spring),opacity .3s ease;
    z-index:1}
  #grid-frame.exiting{transform:scale(.55) rotate(-8deg);opacity:0;
    transition:transform .26s cubic-bezier(.5,0,.75,0),opacity .22s ease}
  #grid-frame.swapping{animation:gridSwapIn .58s var(--ease-spring)}
  @keyframes gridSwapIn{
    0%{transform:scale(.86);opacity:.4}
    55%{transform:scale(1.03);opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  #grid-frame.shaking{animation:gridShake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes gridShake{
    0%,100%{transform:translate(0,0)}
    15%{transform:translate(-8px,3px)}
    30%{transform:translate(7px,-3px)}
    45%{transform:translate(-6px,2px)}
    60%{transform:translate(5px,-2px)}
    75%{transform:translate(-3px,1px)}
    90%{transform:translate(2px,0)}
  }

  #mines-grid{display:grid;position:relative}
  .tile{
    position:relative;aspect-ratio:1/1;padding:0;cursor:pointer;
    border:0;background:none;outline:0;
    -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;
    font-family:inherit;
    animation:tileSlideUp .62s cubic-bezier(.22,.9,.28,1.05) backwards;
  }
  .tile.no-anim{animation:none!important}
  .tile:focus,.tile:focus-visible,.tile:active,.tile::-moz-focus-inner{outline:0!important;border:0!important}
  @keyframes tileSlideUp{
    0%{opacity:0;transform:translateY(60px) scale(.86)}
    55%{opacity:1;transform:translateY(-4px) scale(1.03)}
    78%{transform:translateY(2px) scale(.99)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .tile.milestone{animation:milestoneShake .62s cubic-bezier(.36,.07,.19,.97)}
  @keyframes milestoneShake{
    0%{transform:translate(0,0) scale(1)}10%{transform:translate(-2px,1px) scale(1.04)}
    20%{transform:translate(3px,-2px) scale(1.02)}30%{transform:translate(-3px,2px) scale(1.05)}
    40%{transform:translate(3px,-1px) scale(1.02)}50%{transform:translate(-2px,2px) scale(1.04)}
    60%{transform:translate(2px,-2px) scale(1.02)}70%{transform:translate(-2px,1px) scale(1.03)}
    80%{transform:translate(1px,-1px) scale(1.01)}100%{transform:translate(0,0) scale(1)}
  }

  .tile-face{
    position:absolute;inset:0;border-radius:var(--tile-radius,14px);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:0;outline:0;
    transition:opacity .32s ease,transform .38s var(--ease-spring);
    will-change:opacity,transform}

  .tile-front{
    background:linear-gradient(180deg,#3a3e46 0%,#2a2d34 100%);
    box-shadow:
      0 5px 0 0 #101216,
      0 7px 10px rgba(0,0,0,.4);
    opacity:1;transform:scale(1);z-index:2;
  }
  .tile:not(.revealed):active .tile-front{
    transform:translateY(3px) scale(.99);
    box-shadow:0 2px 0 0 #101216,0 3px 5px rgba(0,0,0,.35);
  }

  .gift-ic{
    width:62%;height:62%;display:block;object-fit:contain;
    filter:brightness(0) invert(.72) drop-shadow(0 2px 3px rgba(0,0,0,.45));
    opacity:.9;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 32%,rgba(0,0,0,.78) 55%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.12) 100%);
    mask-image:linear-gradient(180deg,#000 0%,#000 32%,rgba(0,0,0,.78) 55%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.12) 100%);
    pointer-events:none;transition:transform .3s var(--ease-spring);
  }
  .tile:not(.revealed):active .gift-ic{transform:scale(.9)}

  .tile.revealed .tile-front{opacity:0;transform:scale(.82);pointer-events:none}
  .tile-back{background:#1c1f25;opacity:0;transform:scale(.82);z-index:1;transition-delay:.06s}
  .tile.revealed .tile-back{opacity:1;transform:scale(1)}
  .tile.gem .tile-back{background:linear-gradient(180deg,#1a4432,#0c2018);
    box-shadow:0 5px 0 0 #061008,0 0 22px rgba(76,195,138,.4)}
  .tile.mine .tile-back{background:linear-gradient(180deg,#4a1524,#20060c);
    box-shadow:0 5px 0 0 #140307,0 0 24px rgba(224,85,107,.5)}
  .tile.mine.revealed .tile-back{animation:minePulse .6s ease}
  @keyframes minePulse{
    0%{box-shadow:0 5px 0 0 #140307,0 0 0 rgba(224,85,107,0)}
    40%{box-shadow:0 5px 0 0 #140307,0 0 55px rgba(224,85,107,.9)}
    100%{box-shadow:0 5px 0 0 #140307,0 0 24px rgba(224,85,107,.5)}
  }
  .tile-back .ic{
    position:absolute;top:20%;left:20%;width:60%;height:60%;object-fit:contain;display:block;
    opacity:0;transform:scale(.35);
    transition:opacity .35s ease .12s,transform .45s var(--ease-spring) .12s;
    pointer-events:none;
  }
  .tile.gem .ic-gem,.tile.mine .ic-mine{opacity:1;transform:scale(1)}
  .tile.mine .ic-mine{animation:minePop .6s var(--ease-spring) .12s both}
  @keyframes minePop{
    0%{transform:scale(.15) rotate(-35deg);opacity:0}
    50%{transform:scale(1.25) rotate(8deg);opacity:1}
    75%{transform:scale(.92) rotate(-3deg)}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .tile.hide-gem .ic-gem{opacity:0!important;transform:scale(.4)!important;
    transition:opacity .25s ease,transform .35s ease!important}
  .tile.dimmed{opacity:.32;transition:opacity .5s ease}
  .tile.dimmed .tile-front{opacity:0;pointer-events:none}
  .tile.dimmed .tile-back{opacity:1;transform:scale(1)}
  .tile.post-reveal-mine .tile-back{opacity:.85;filter:saturate(.7) brightness(.85)}

  .special-gif{
    position:absolute;top:10%;left:10%;width:80%;height:80%;object-fit:contain;
    pointer-events:none;z-index:10;opacity:0;transform:scale(.4);
    transition:opacity .3s ease,transform .55s var(--ease-spring)}
  .special-gif.show{opacity:1;transform:scale(1)}

  /* ============== CONTROLS ============== */
  #controls{flex-shrink:0;padding:8px 12px calc(14px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:10px;position:relative}

  #opts-row{display:flex;gap:8px;position:relative}
  .opt-wrap{flex:1;position:relative}
  .opt-btn{width:100%;height:54px;border-radius:var(--r-xl);
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    color:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;font-family:inherit;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
    transition:transform .18s var(--ease-spring),background .2s,border-color .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  .opt-btn:active{transform:scale(.97);background:rgba(255,255,255,.08)}
  .opt-btn.open{border-color:rgba(255,255,255,.22);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03))}
  .opt-content{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;pointer-events:none}
  .opt-label{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
    color:rgba(255,255,255,.4);font-weight:900}
  .opt-value{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;
    transition:transform .3s var(--ease-spring),opacity .25s ease}
  .opt-value.changing{animation:valSwap .42s var(--ease-spring)}
  @keyframes valSwap{
    0%{transform:translateY(-8px) scale(.85);opacity:0}
    60%{transform:translateY(2px) scale(1.06);opacity:1}
    100%{transform:translateY(0) scale(1);opacity:1}
  }
  .opt-chev{width:13px;height:13px;stroke:rgba(255,255,255,.5);fill:none;
    stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
    transition:transform .35s var(--ease-spring),stroke .2s;pointer-events:none}
  .opt-btn.open .opt-chev{transform:rotate(180deg);stroke:#fff}

  .popup{position:absolute;bottom:calc(100% + 10px);left:0;right:0;
    padding:10px;border-radius:24px;
    background:linear-gradient(180deg, rgba(22,22,24,.98), rgba(10,10,12,.99));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 50px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    opacity:0;transform:translateY(12px) scale(.94);
    pointer-events:none;transform-origin:bottom center;
    transition:opacity .28s ease,transform .35s var(--ease-spring);
    z-index:200}
  .popup.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .popup button{padding:14px 6px;border-radius:18px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.03);
    color:rgba(255,255,255,.85);
    font-family:inherit;font-size:13.5px;font-weight:800;
    letter-spacing:.2px;cursor:pointer;
    transition:transform .16s var(--ease-spring),background .2s,border-color .2s,color .2s;
    -webkit-appearance:none;appearance:none;outline:none;
    opacity:0;transform:translateY(14px) scale(.86)}
  .popup.open button{animation:popupBtnIn .42s var(--ease-spring) forwards}
  .popup.open button:nth-child(1){animation-delay:40ms}
  .popup.open button:nth-child(2){animation-delay:75ms}
  .popup.open button:nth-child(3){animation-delay:110ms}
  .popup.open button:nth-child(4){animation-delay:145ms}
  .popup.open button:nth-child(5){animation-delay:180ms}
  .popup.open button:nth-child(6){animation-delay:215ms}
  @keyframes popupBtnIn{
    0%{opacity:0;transform:translateY(14px) scale(.86)}
    65%{opacity:1;transform:translateY(-2px) scale(1.03)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .popup button:active{transform:scale(.93)}
  .popup button.active{
    background:linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.07));
    border-color:rgba(255,255,255,.45);color:#fff;
    box-shadow:0 0 14px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.28)}
  .popup button.pick{animation:chipPick .46s var(--ease-spring)}
  @keyframes chipPick{
    0%{transform:scale(1)}
    35%{transform:scale(1.18);box-shadow:0 0 22px rgba(255,255,255,.5)}

<script>
(function(){
  'use strict';

  const TG = window.Telegram?.WebApp;
  if (TG) {
    try { TG.expand(); } catch(_){}
    try { TG.setHeaderColor?.('#0a0a0a'); } catch(_){}
    try { TG.setBackgroundColor?.('#0a0a0a'); } catch(_){}
    try { TG.disableVerticalSwipes?.(); } catch(_){}
  }
  function haptic(style){
    try {
      if (TG?.HapticFeedback) TG.HapticFeedback.impactOccurred(style || 'light');
      else if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 30 : 12);
    } catch(_){}
  }

  const $ = s => document.querySelector(s);

  /* ============ ASSETS ============ */
  const GIF_DIAMOND = 'https://i.postimg.cc/fRj0QRKq/diamond-elegant.gif';
  const GIF_BOMB    = 'https://i.postimg.cc/J7GYqGck/bomb-bomba.gif';
  const GIF_GIFT    = 'https://i.postimg.cc/SsNS5WNq/better-gift-box.png';
  const GIF_2X      = [
    'https://i.postimg.cc/RFqdXDtD/ezgif-2655c04bfa645c12.gif',
    'https://i.postimg.cc/kM0svwgT/ezgif-518e555f632c11bf.gif'
  ];

  /* ============ AUDIO ============ */
  const Sound = (function(){
    let ctx=null,unlocked=false,master=null;
    function ensure(){
      if(!ctx){ try{ const AC=window.AudioContext||window.webkitAudioContext;
        if(AC){ ctx=new AC(); master=ctx.createGain(); master.gain.value=.35; master.connect(ctx.destination);} }catch(_){} }
      if(ctx&&ctx.state==='suspended') ctx.resume().catch(()=>{});
      return ctx;
    }
    function unlock(){ if(unlocked)return; const c=ensure(); if(!c)return; unlocked=true; }
    ['pointerdown','touchstart','keydown'].forEach(e=>document.addEventListener(e,unlock,{once:true,passive:true}));
    function tone(freq,dur,type,vol,when,sweepTo){
      const c=ensure(); if(!c||!unlocked)return;
      const t0=when||c.currentTime, o=c.createOscillator(), g=c.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
      if(sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,sweepTo),t0+dur);
      const v=vol==null?.22:vol;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.008);
      g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.03);
    }
    function noise(dur,vol,when,ff){
      const c=ensure(); if(!c||!unlocked)return;
      const t0=when||c.currentTime, len=Math.max(1,Math.floor(c.sampleRate*dur));
      const buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
      const s=c.createBufferSource(); s.buffer=buf;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ff||1200;
      const g=c.createGain(); g.gain.value=vol==null?.22:vol;
      s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+.03);
    }
    return {
      unlock, click(){ tone(720,.035,'sine',.11,null,520); },
      reveal(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(620,.10,'sine',.16,t,900); tone(950,.14,'sine',.11,t+.045,1250); },
      mine(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(120,.35,'sawtooth',.32,t,45); tone(80,.5,'triangle',.22,t+.02,30);
        noise(.35,.24,t,900); tone(280,.25,'square',.09,t+.05,90); },
      milestone(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(900,.35,'sine',.18,t,2400); tone(1350,.4,'triangle',.14,t+.05,3000);
        tone(1800,.6,'sine',.12,t+.12); tone(2400,.55,'sine',.09,t+.15); },
      cashout(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
          tone(f,.28,'triangle',.16,t+i*.06); tone(f*2,.22,'sine',.06,t+i*.06+.01); });
        tone(1567.98,.55,'sine',.12,t+.28,2100); },
      lose(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(400,.35,'triangle',.18,t,180); tone(220,.5,'sine',.14,t+.12,90); },
      start(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(440,.1,'sine',.15,t,660); tone(660,.14,'sine',.13,t+.06,990); },
      coin(){ const c=ensure(); if(!c||!unlocked)return; const t=c.currentTime;
        tone(1180,.08,'triangle',.14,t); tone(1560,.12,'triangle',.11,t+.05);
        tone(2100,.16,'sine',.08,t+.09); }
    };
  })();

  /* ============ CONFIG ============ */
  const HOUSE_EDGE = 0.01;
  const MIN_BET = 10;
  const GRID_OPTIONS = [3, 4, 5];

  const MINE_PRESETS = {
    3: [1, 2, 3, 4],
    4: [1, 2, 4, 6],
    5: [1, 3, 5, 10],
  };

  /* ============ THEMES ============ */
  const THEMES = [
    { key:'onyx',     name:'Onyx',     bg:'#0a0a0a', accent:'#6da9ff' },
    { key:'midnight', name:'Midnight', bg:'#060b1a', accent:'#6da9ff' },
    { key:'forest',   name:'Forest',   bg:'#061208', accent:'#6dcc8a' },
    { key:'crimson',  name:'Crimson',  bg:'#14060a', accent:'#ff6d7a' },
    { key:'royal',    name:'Royal',    bg:'#0e0618', accent:'#b47aff' },
    { key:'amber',    name:'Amber',    bg:'#140a02', accent:'#ffb066' },
  ];
  let currentTheme = 'onyx';
  try {
    const t = localStorage.getItem('dllump_mines_theme');
    if (t && THEMES.some(x => x.key === t)) currentTheme = t;
  } catch(_){}

  function applyTheme(key){
    if (!THEMES.some(t => t.key === key)) return;
    currentTheme = key;
    document.documentElement.setAttribute('data-theme', key);
    try { localStorage.setItem('dllump_mines_theme', key); } catch(_){}
    updateThemeGrid();
  }
  function buildThemeGrid(){
    const grid = document.getElementById('theme-grid');
    if (!grid) return;
    grid.innerHTML = '';
    THEMES.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'theme-swatch';
      btn.dataset.key = t.key;
      btn.style.setProperty('--sw-bg', t.bg);
      btn.style.setProperty('--sw-accent', t.accent);
      btn.innerHTML =
        '<div class="swatch-bg"></div>' +
        '<div class="swatch-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>' +
        '<div class="swatch-dot"></div>' +
        '<div class="swatch-label">' + t.name + '</div>';
      btn.addEventListener('click', () => {
        haptic('light'); Sound.click();
        applyTheme(t.key);
      });
      grid.appendChild(btn);
    });
    updateThemeGrid();
  }
  function updateThemeGrid(){
    const grid = document.getElementById('theme-grid');
    if (!grid) return;
    grid.querySelectorAll('.theme-swatch').forEach(el => {
      el.classList.toggle('active', el.dataset.key === currentTheme);
    });
  }

  /* ============ STATE ============ */
  const state = {
    gridSize: 5,
    mines: 3,
    bet: 10,
    balance: 1000,
    playing: false,
    revealed: 0,
    mineSet: new Set(),
    multipliers: [],
    busy: false,
    shown2xGif: false,
    rebuilding: false,
  };

  try {
    const b = localStorage.getItem('dllump_mines_balance');
    if (b !== null) state.balance = Math.max(0, parseInt(b, 10) || 0);
  } catch(_){}
  function persistBalance(){
    try { localStorage.setItem('dllump_mines_balance', String(state.balance)); } catch(_){}
  }

  /* ============ DOM ============ */
  const gridEl        = $('#mines-grid');
  const gridFrame     = $('#grid-frame');
  const gridStage     = $('#grid-stage');
  const stageEl       = gridStage;
  const multBar       = $('#mult-bar');
  const multInner     = $('#mult-inner');
  const multIndicator = $('#mult-indicator');
  const multMaxEl     = $('#mult-max');
  const multMaxVal    = $('#mult-max-value');
  const multMaxFill   = $('#mult-max-fill');
  const next2xHint    = $('#next-2x-hint');
  const balanceEl     = $('#balance-val');
  const topbarTitle   = $('#topbar-title');
  const gridBtn       = $('#grid-btn');
  const minesBtn      = $('#mines-btn');
  const gridVal       = $('#grid-val');
  const minesVal      = $('#mines-val');
  const gridPopup     = $('#grid-popup');
  const minesPopup    = $('#mines-popup');
  const betInput      = $('#bet-input');
  const allInBtn      = $('#allin-btn');
  const actionBtn     = $('#action-btn');
  const resultPanel   = $('#result-panel');
  const resultTitle   = $('#result-title');
  const resultMult    = $('#result-mult');
  const resultAmt     = $('#result-amt');
  const resultCont    = $('#result-continue');
  const toastEl       = $('#toast');

  next2xHint.src = GIF_2X[Math.floor(Math.random() * GIF_2X.length)];

  /* ============ MATH ============ */
  function computeMultipliers(totalTiles, mines){
    const arr = [1];
    let raw = 1;
    const safeMax = totalTiles - mines;
    for (let k = 1; k <= safeMax; k++){
      raw = raw * (totalTiles - k + 1) / (totalTiles - mines - k + 1);
      arr.push((1 - HOUSE_EDGE) * raw);
    }
    return arr;
  }
  function fmtMult(v){
    if (!isFinite(v)) return 'x∞';
    return 'x' + v.toFixed(2);
  }
  function fmtMoney(v){
    const n = Math.floor(v * 100) / 100;
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(2);
  }
  function getTierClass(m){
    if (m >= 21) return 'tier-orange';
    if (m >= 10) return 'tier-yellow';
    if (m >= 4)  return 'tier-purple';
    if (m >= 2)  return 'tier-blue';
    return '';
  }

  /* ============ TYPEWRITER ============ */
  function typeText(el, text, speed){
    if (el._typeTimer) { clearTimeout(el._typeTimer); el._typeTimer = null; }
    el.textContent = '';
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);
    let i = 0;
    function step(){
      if (i >= text.length){
        el._typeTimer = null;
        setTimeout(() => { if (caret.parentNode) caret.remove(); }, 700);
        return;
      }
      el.insertBefore(document.createTextNode(text.charAt(i++)), caret);
      el._typeTimer = setTimeout(step, speed || 55);
    }
    step();
  }
  function animateValue(el, newText){
    if (el.textContent === newText) return;
    el.textContent = newText;
    el.classList.remove('changing');
    void el.offsetWidth;
    el.classList.add('changing');
  }

  /* ============ UI ============ */
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function updateBalance(animate){
    const target = Math.floor(state.balance);
    if (animate){
      const from = parseInt(balanceEl.textContent.replace(/,/g, ''), 10) || 0;
      if (from !== target){
        const start = performance.now();
        const dur = 520;
        function step(t){
          const p = Math.min(1, (t - start) / dur);
          const e = 1 - Math.pow(1 - p, 3);
          balanceEl.textContent = Math.round(from + (target - from) * e).toLocaleString('en-US');
          if (p < 1) requestAnimationFrame(step);
          else balanceEl.textContent = target.toLocaleString('en-US');
        }
        requestAnimationFrame(step);
        return;
      }
    }
    balanceEl.textContent = target.toLocaleString('en-US');
  }

  /* ============ MULT BAR ============ */
  function buildMultBar(){
    multInner.querySelectorAll('.mult-item').forEach(el => el.remove());
    const activeIdx = state.playing ? state.revealed : 0;
    const frag = document.createDocumentFragment();
    state.multipliers.forEach((m, i) => {
      const item = document.createElement('div');
      item.className = 'mult-item';
      const tier = getTierClass(m);
      if (tier) item.classList.add(tier);
      if (i === activeIdx) item.classList.add('active');
      else if (state.playing && i < activeIdx) item.classList.add('done');
      item.textContent = i === 0 ? 'x1.00' : fmtMult(m);
      frag.appendChild(item);
    });
    multInner.appendChild(frag);
    multIndicator.style.transition = 'none';
    moveIndicator(false);
    void multIndicator.offsetWidth;
    multIndicator.style.transition = '';
    updateNext2xHint();
    updateMaxMultiplierDisplay();
  }

  function applyIndicatorTier(){
    const items = multInner.querySelectorAll('.mult-item');
    const idx = state.playing ? state.revealed : 0;
    const item = items[idx];
    if (!item) return;
    multIndicator.classList.remove('tier-blue','tier-purple','tier-yellow','tier-orange');
    const curMult = state.multipliers[idx] || 1;
    const tier = getTierClass(curMult);
    if (tier) multIndicator.classList.add(tier);
  }

  function moveIndicator(scroll){
    const items = multInner.querySelectorAll('.mult-item');
    const idx = state.playing ? state.revealed : 0;
    const item = items[idx];
    if (!item) return;
    multIndicator.style.left = item.offsetLeft + 'px';
    multIndicator.style.width = item.offsetWidth + 'px';
    applyIndicatorTier();
    if (scroll){
      const target = item.offsetLeft - multBar.clientWidth / 2 + item.offsetWidth / 2;
      multBar.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    }
  }

  function updateNext2xHint(){
    if (!state.playing){
      next2xHint.classList.remove('show');
      return;
    }
    const nextIdx = state.revealed + 1;
    const curIdx  = state.revealed;
    const curMult = state.multipliers[curIdx] || 1;
    const nextMult = state.multipliers[nextIdx];
    if (nextMult == null || curMult >= 2 || nextMult < 2){
      next2xHint.classList.remove('show');
      return;
    }
    const items = multInner.querySelectorAll('.mult-item');
    const item = items[nextIdx];
    if (!item){ next2xHint.classList.remove('show'); return; }
    next2xHint.style.left = (item.offsetLeft + item.offsetWidth / 2) + 'px';
    next2xHint.classList.add('show');
  }

  function updateMultBar(){
    const items = multInner.querySelectorAll('.mult-item');
    const idx = state.playing ? state.revealed : 0;
    items.forEach((it, i) => {
      it.classList.toggle('active', i === idx);
      it.classList.toggle('done', state.playing && i < idx);
    });
    moveIndicator(true);
    updateNext2xHint();
    updateMaxFill();
  }

  function updateMaxFill(){
    const totalCells = state.gridSize * state.gridSize;
    const minesForCalc = state.mines || 3;
    const mults = computeMultipliers(totalCells, Math.min(minesForCalc, totalCells - 1));
    const maxMult = mults[mults.length - 1] || 1;
    const curMult = state.playing ? (state.multipliers[state.revealed] ?? 1) : 1;
    const pct = Math.max(0, Math.min(1, curMult / maxMult)) * 100;
    if (multMaxFill) multMaxFill.style.width = pct + '%';
  }

  function updateMaxMultiplierDisplay(){
    const totalCells = state.gridSize * state.gridSize;
    const minesForCalc = state.mines || 3;
    const mults = computeMultipliers(totalCells, Math.min(minesForCalc, totalCells - 1));
    const maxMult = mults[mults.length - 1] || 1;
    multMaxVal.textContent = fmtMult(maxMult);
    multMaxEl.classList.remove('tier-blue','tier-purple','tier-yellow','tier-orange');
    const tier = getTierClass(maxMult);
    if (tier) multMaxEl.classList.add(tier);
    multMaxEl.classList.remove('pulse');
    void multMaxEl.offsetWidth;
    multMaxEl.classList.add('pulse');
    updateMaxFill();
  }

  /* ============ POPUPS ============ */
  function renderGridChips(){
    gridPopup.innerHTML = '';
    GRID_OPTIONS.forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = n + '×' + n;
      if (n === state.gridSize) b.classList.add('active');
      b.addEventListener('click', (e) => { e.stopPropagation(); selectGrid(n, b); });
      gridPopup.appendChild(b);
    });
  }

  function renderMineChips(){
    const presets = MINE_PRESETS[state.gridSize] || [1];
    if (!presets.includes(state.mines)) {
      state.mines = presets[Math.min(2, presets.length - 1)];
    }
    minesPopup.innerHTML = '';
    presets.forEach(m => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = m;
      if (m === state.mines) b.classList.add('active');
      b.addEventListener('click', (e) => { e.stopPropagation(); selectMines(m, b); });
      minesPopup.appendChild(b);
    });
  }

  function pulseChip(btn){
    if (!btn) return;
    btn.classList.remove('pick');
    void btn.offsetWidth;
    btn.classList.add('pick');
    setTimeout(() => btn.classList.remove('pick'), 480);
  }

  function selectGrid(n, btn){
    if (state.playing || state.busy || state.rebuilding) { closePopups(); return; }
    if (n === state.gridSize) { pulseChip(btn); closePopups(); return; }
    haptic('light'); Sound.click(); pulseChip(btn);
    state.gridSize = n;
    animateValue(gridVal, n + ' × ' + n);
    state.multipliers = computeMultipliers(n * n, state.mines);
    renderGridChips();
    renderMineChips();
    minesVal.textContent = state.mines;
    setTimeout(() => {
      closePopups();
      renderGrid(true);
      buildMultBar();
      updateActionButton();
    }, 180);
  }

  function selectMines(m, btn){
    if (state.playing || state.busy || state.rebuilding) { closePopups(); return; }
    if (m === state.mines) { pulseChip(btn); closePopups(); return; }
    haptic('light'); Sound.click(); pulseChip(btn);
    state.mines = m;
    animateValue(minesVal, String(m));
    state.multipliers = computeMultipliers(state.gridSize * state.gridSize, m);
    renderMineChips();
    setTimeout(() => {
      closePopups();
      buildMultBar();
      updateActionButton();
    }, 180);
  }

  function openPopup(which){
    closePopups();
    const popup = which === 'grid' ? gridPopup : minesPopup;
    const btn   = which === 'grid' ? gridBtn   : minesBtn;
    popup.classList.add('open');
    btn.classList.add('open');
    haptic('light');
    Sound.click();
  }
  function closePopups(){
    gridPopup.classList.remove('open');
    minesPopup.classList.remove('open');
    gridBtn.classList.remove('open');
    minesBtn.classList.remove('open');
  }

  gridBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.playing || state.busy) return;
    if (gridPopup.classList.contains('open')) closePopups();
    else openPopup('grid');
  });
  minesBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.playing || state.busy) return;
    if (minesPopup.classList.contains('open')) closePopups();
    else openPopup('mines');
  });

  document.addEventListener('pointerdown', (e) => {
    const anyOpen = gridPopup.classList.contains('open') || minesPopup.classList.contains('open');
    if (!anyOpen) return;
    if (e.target.closest('.opt-wrap')) return;
    closePopups();
  }, true);

  /* ============ GRID ============ */
  function renderGrid(animate){
    if (animate && gridEl.children.length > 0){
      state.rebuilding = true;
      gridFrame.classList.add('exiting');
      setTimeout(() => {
        _doRenderGrid();
        void gridFrame.offsetWidth;
        gridFrame.classList.remove('exiting');
        gridFrame.classList.add('swapping');
        setTimeout(() => gridFrame.classList.remove('swapping'), 620);
        setTimeout(() => { state.rebuilding = false; }, 620);
      }, 240);
    } else {
      _doRenderGrid();
    }
  }

  function _doRenderGrid(){
    const n = state.gridSize;
    const total = n * n;
    const gapPx = Math.max(5, Math.round(30 / n));
    const radiusPx = Math.max(9, Math.round(72 / n));

    gridEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    gridEl.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';
    gridEl.style.gap = gapPx + 'px';
    gridEl.style.setProperty('--tile-radius', radiusPx + 'px');
    gridEl.innerHTML = '';

    const STEP_MS = Math.max(18, Math.round(120 / n));

    for (let i = 0; i < total; i++){
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'tile';
      t.dataset.i = i;
      t.style.animationDelay = (i * STEP_MS) + 'ms';
      t.innerHTML =
        '<div class="tile-face tile-front">' +
          '<img class="gift-ic" src="' + GIF_GIFT + '" alt="" draggable="false">' +
        '</div>' +
        '<div class="tile-face tile-back">' +
          '<img class="ic ic-gem" src="' + GIF_DIAMOND + '" alt="" draggable="false">' +
          '<img class="ic ic-mine" src="' + GIF_BOMB + '" alt="" draggable="false">' +
        '</div>';
      t.addEventListener('click', () => onTileClick(i, t));
      gridEl.appendChild(t);
    }
    sizeGrid();
  }

  function sizeGrid(){
    const rect = stageEl.getBoundingClientRect();
    const size = Math.max(120, Math.floor(Math.min(rect.width, rect.height) - 40));
    gridEl.style.width  = size + 'px';
    gridEl.style.height = size + 'px';
  }

  /* ============ GAME ============ */
  function generateMines(n, m){
    const total = n * n;
    const set = new Set();
    while (set.size < m) set.add(Math.floor(Math.random() * total));
    return set;
  }

  function updateActionButton(){
    if (state.playing){
      const mult = state.multipliers[state.revealed] ?? 1;
      const cash = state.bet * mult;
      actionBtn.classList.add('cashout');
      actionBtn.innerHTML = 'Cashout <span class="co-amount">· ' + fmtMoney(cash) + '</span>';
      actionBtn.disabled = state.revealed === 0 || state.busy;
    } else {
      actionBtn.classList.remove('cashout');
      actionBtn.textContent = 'Start';
      actionBtn.disabled = state.balance < Math.max(MIN_BET, state.bet) || state.busy;
    }
  }

  function startGame(rebuildGrid){
    if (state.busy || state.rebuilding) return false;
    const bet = Math.max(MIN_BET, Math.floor(state.bet));
    if (bet > state.balance){
      showToast('Insufficient balance');
      haptic('light');
      return false;
    }

    state.busy = true;
    state.balance -= bet;
    state.bet = bet;
    persistBalance();
    updateBalance(true);

    state.multipliers = computeMultipliers(state.gridSize * state.gridSize, state.mines);
    state.mineSet = generateMines(state.gridSize, state.mines);
    state.playing = true;
    state.revealed = 0;
    state.shown2xGif = false;

    if (rebuildGrid !== false) renderGrid();
    buildMultBar();

    betInput.disabled = true;
    allInBtn.disabled = true;
    gridBtn.disabled = true;
    minesBtn.disabled = true;

    haptic('medium');
    Sound.start();
    updateMultBar();
    updateActionButton();

    setTimeout(() => { state.busy = false; updateActionButton(); }, 320);
    return true;
  }

  function onTileClick(i, el){
    if (!state.playing && !state.busy && !state.rebuilding){
      const ok = startGame(false);
      if (ok){
        setTimeout(() => {
          const tiles = gridEl.querySelectorAll('.tile');
          const target = tiles[i];
          if (target) revealTile(i, target);
        }, 240);
      }
      return;
    }
    if (!state.playing || state.busy) return;
    revealTile(i, el);
  }

  function revealTile(i, el){
    if (!el || el.classList.contains('revealed')) return;

    if (state.mineSet.has(i)){
      el.classList.add('revealed', 'mine');
      haptic('heavy');
      Sound.mine();
      loseGame();
      return;
    }
    el.classList.add('revealed', 'gem');
    state.revealed++;
    haptic('light');
    Sound.reveal();
    spawnGemBurst(el);

    const curMult = state.multipliers[state.revealed];
    const prevMult = state.multipliers[state.revealed - 1];
    if (!state.shown2xGif && curMult >= 2 && prevMult < 2){
      state.shown2xGif = true;
      show2xGif(el);
    }
    updateMultBar();
    updateActionButton();

    const totalSafe = state.gridSize * state.gridSize - state.mines;
    if (state.revealed >= totalSafe){
      setTimeout(() => cashout(true), 380);
    }
  }

  function show2xGif(el){
    el.classList.add('hide-gem');
    el.classList.remove('milestone');
    void el.offsetWidth;
    el.classList.add('milestone');

    const gif = document.createElement('img');
    gif.src = GIF_2X[Math.floor(Math.random() * GIF_2X.length)];
    gif.className = 'special-gif';
    gif.alt = '';
    gif.draggable = false;
    el.appendChild(gif);

    requestAnimationFrame(() => requestAnimationFrame(() => gif.classList.add('show')));
    haptic('heavy');
    Sound.milestone();

    setTimeout(() => {
      gif.classList.remove('show');
      setTimeout(() => {
        gif.remove();
        el.classList.remove('hide-gem');
        el.classList.remove('milestone');
      }, 400);
    }, 2500);
  }

  function loseGame(){
    state.busy = true;
    gridFrame.classList.add('shaking');
    setTimeout(() => gridFrame.classList.remove('shaking'), 520);

    const tiles = gridEl.querySelectorAll('.tile');
    const mineIdx = [...state.mineSet].sort((a, b) => a - b);
    mineIdx.forEach((idx, k) => {
      const t = tiles[idx];
      if (!t || t.classList.contains('revealed')) return;
      setTimeout(() => { t.classList.add('revealed', 'mine'); Sound.mine(); }, 90 + k * 55);
    });
    tiles.forEach((t, idx) => {
      if (state.mineSet.has(idx)) return;
      setTimeout(() => t.classList.add('dimmed'), 280);
    });

    setTimeout(() => {
      Sound.lose();
      showResult(false, 0, state.bet);
      state.busy = false;
      state.playing = false;
      unlockControls();
      updateActionButton();
      updateMultBar();
    }, 680);
  }

  function cashout(perfect){
    if (!state.playing) return;
    const mult = state.multipliers[state.revealed] ?? 1;
    const payout = state.bet * mult;
    state.balance += payout;
    persistBalance();
    updateBalance(true);
    haptic('heavy');

    const tiles = gridEl.querySelectorAll('.tile');
    const mineIdx = [...state.mineSet].sort((a, b) => a - b);
    mineIdx.forEach((idx, k) => {
      const t = tiles[idx];
      if (!t || t.classList.contains('revealed')) return;
      setTimeout(() => {
        t.classList.add('revealed', 'mine', 'post-reveal-mine', 'dimmed');
      }, 60 + k * 55);
    });
    tiles.forEach((t, idx) => {
      if (t.classList.contains('revealed')) return;
      if (state.mineSet.has(idx)) return;
      setTimeout(() => t.classList.add('dimmed'), 240);
    });

    Sound.cashout();
    spawnConfetti(perfect ? 60 : 40);
    showResult(true, mult, payout);

    state.playing = false;
    state.busy = false;
    unlockControls();
    updateActionButton();
    updateMultBar();
  }

  function unlockControls(){
    betInput.disabled = false;
    allInBtn.disabled = false;
    gridBtn.disabled = false;
    minesBtn.disabled = false;
  }

  function resetRound(){
    state.playing = false;
    state.revealed = 0;
    state.mineSet.clear();
    state.busy = false;
    state.shown2xGif = false;
    resultPanel.classList.remove('show', 'win', 'lose');
    unlockControls();
    state.multipliers = computeMultipliers(state.gridSize * state.gridSize, state.mines);
    renderGrid(true);
    buildMultBar();
    updateActionButton();
    updateMaxFill();
  }

  /* ============ RESULT ============ */
  function showResult(isWin, mult, amount){
    resultPanel.classList.remove('win', 'lose');
    resultPanel.classList.add(isWin ? 'win' : 'lose');
    typeText(resultTitle, isWin ? 'CASHED OUT' : 'BOOM', 40);
    resultMult.textContent = isWin ? fmtMult(mult) : 'x0.00';
    resultAmt.textContent  = isWin ? fmtMoney(amount) : ('-' + fmtMoney(amount));
    requestAnimationFrame(() => resultPanel.classList.add('show'));
  }

  function spawnConfetti(count){
    const rect = gridEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const colors = ['#4CC38A', '#8ef0b8', '#5b9dff', '#d4b46a', '#ffffff'];
    for (let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'confetti';
      const angle = Math.random() * Math.PI * 2;
      const dist  = 90 + Math.random() * 220;
      p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist + 60).toFixed(1) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.background = colors[(Math.random() * colors.length) | 0];
      p.style.width = (5 + Math.random() * 5).toFixed(1) + 'px';
      p.style.height = (4 + Math.random() * 5).toFixed(1) + 'px';
      p.style.animationDelay = (Math.random() * 90).toFixed(0) + 'ms';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1400);
    }
  }

  function spawnGemBurst(el){
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 6; i++){
      const p = document.createElement('div');
      p.className = 'confetti';
      const angle = (i / 6) * Math.PI * 2 + Math.random() * .4;
      const dist  = 26 + Math.random() * 34;
      p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
      p.style.setProperty('--rot', (Math.random() * 360 - 180).toFixed(0) + 'deg');
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.background = i % 2 ? '#8ef0b8' : '#4fd6ff';
      p.style.width = '4px';
      p.style.height = '4px';
      p.style.borderRadius = '50%';
      p.style.animationDuration = '.7s';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 900);
    }
  }

  /* ============ BET INPUT ============ */
  function clampBet(){
    let v = parseInt(betInput.value.replace(/[^\d]/g, ''), 10);
    if (!Number.isFinite(v) || v < MIN_BET) v = MIN_BET;
    if (v > Math.floor(state.balance)) v = Math.max(MIN_BET, Math.floor(state.balance));
    state.bet = v;
    betInput.value = v;
    updateActionButton();
  }

  betInput.addEventListener('input', () => {
    betInput.value = betInput.value.replace(/[^\d]/g, '').slice(0, 9);
  });
  betInput.addEventListener('blur', clampBet);
  betInput.addEventListener('keydown', e => { if (e.key === 'Enter') betInput.blur(); });

  allInBtn.addEventListener('click', () => {
    if (state.playing) return;
    const amt = Math.max(MIN_BET, Math.floor(state.balance));
    if (amt < MIN_BET){ showToast('Balance too low'); return; }
    betInput.value = amt;
    state.bet = amt;
    haptic('light');
    Sound.click();
    updateActionButton();
  });

  /* ============ ACTION ============ */
  actionBtn.addEventListener('click', () => {
    if (state.busy || state.rebuilding) return;
    if (state.playing){
      if (state.revealed === 0) return;
      cashout(false);
    } else {
      startGame(true);
    }
  });

  resultCont.addEventListener('click', () => {
    haptic('light');
    Sound.click();
    resetRound();
  });

  /* ============ SETTINGS MODAL ============ */
  const settingsModal     = document.getElementById('settings-modal');
  const settingsBackdrop  = document.getElementById('settings-backdrop');
  const settingsCloseBtn  = document.getElementById('settings-close');
  const addBalanceBtn     = document.getElementById('add-balance-btn');
  const resetBalanceBtn   = document.getElementById('reset-balance-btn');
  const exitBtn           = document.getElementById('exit-btn');

  function openSettings(){
    settingsModal.classList.add('show');
    haptic('light');
    Sound.click();
  }
  function closeSettings(){
    settingsModal.classList.remove('show');
  }

  // Back button now opens Settings
  document.getElementById('back-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    openSettings();
  });

  settingsCloseBtn.addEventListener('click', closeSettings);
  settingsBackdrop.addEventListener('click', closeSettings);

  // Escape key closes settings
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && settingsModal.classList.contains('show')) closeSettings();
  });

  addBalanceBtn.addEventListener('click', () => {
    haptic('heavy');
    Sound.coin();
    state.balance += 1000;
    persistBalance();
    updateBalance(true);
    showToast('+1,000 diamonds added');
    // little pulse
    addBalanceBtn.style.transform = 'scale(.94)';
    setTimeout(() => { addBalanceBtn.style.transform = ''; }, 140);
  });

  resetBalanceBtn.addEventListener('click', () => {
    haptic('medium');
    Sound.click();
    state.balance = 1000;
    persistBalance();
    updateBalance(true);
    showToast('Balance reset to 1,000');
  });

  exitBtn.addEventListener('click', () => {
    haptic('light');
    Sound.click();
    try {
      if (TG?.close) TG.close();
      else history.back();
    } catch(_){}
  });

  /* ============ INIT ============ */
  function init(){
    state.multipliers = computeMultipliers(state.gridSize * state.gridSize, state.mines);
    gridVal.textContent = state.gridSize + ' × ' + state.gridSize;
    minesVal.textContent = state.mines;

    // Theme
    buildThemeGrid();
    applyTheme(currentTheme);

    renderGridChips();
    renderMineChips();
    renderGrid(false);
    buildMultBar();
    updateBalance(false);
    betInput.value = state.bet;
    updateActionButton();

    typeText(topbarTitle, 'Mines', 90);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      sizeGrid();
      moveIndicator(false);
      updateMaxFill();
    }));
  }

  window.addEventListener('resize', () => {
    sizeGrid();
    moveIndicator(false);
    updateNext2xHint();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { sizeGrid(); moveIndicator(false); updateNext2xHint(); }, 260);
  });

  init();
})();
</script>

</body>
</html>
