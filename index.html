<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>dllump · merge</title>
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{
    --bg-base:#0a0a0a;
    --surface2:rgba(255,255,255,.08);
    --text:#f5f5f5;
    --border:rgba(255,255,255,.08);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
    --r-sm:14px;--r-xl:22px;--r-pill:99px;
    --cell-radius:0px;
    --frame-radius:0px;
  }
  body.rounded{
    --cell-radius:6px;
    --frame-radius:12px;
  }
  html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg-base);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}

  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:440px;margin:0 auto;
    position:relative;background:var(--bg-base);overflow:hidden;isolation:isolate}
  #app::before{content:'';position:absolute;inset:-40px;z-index:0;
    background:radial-gradient(ellipse at 30% 15%, rgba(91,157,255,.08), transparent 55%),
               radial-gradient(ellipse at 80% 90%, rgba(76,195,138,.05), transparent 55%);
    filter:blur(30px);pointer-events:none}
  #app::after{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(circle at 30% 20%, rgba(0,0,0,.35), rgba(0,0,0,.8) 70%);pointer-events:none}
  #app > *{position:relative;z-index:1}

  /* TOPBAR */
  #topbar{display:flex;align-items:center;gap:8px;
    padding:calc(14px + var(--safe-top)) 12px 10px;flex-shrink:0}
  .back-btn{width:38px;height:38px;border-radius:var(--r-sm);border:.5px solid var(--border);
    background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .18s var(--ease-spring);
    -webkit-appearance:none;appearance:none;outline:none}
  .back-btn:active{transform:scale(.9)}
  .back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #topbar .title{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px;
    background:linear-gradient(180deg,#fff,#b8c8e0);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent}
  .settings-btn{width:38px;height:38px;border-radius:var(--r-sm);border:.5px solid var(--border);
    background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .18s var(--ease-spring);
    -webkit-appearance:none;appearance:none;outline:none}
  .settings-btn:active{transform:scale(.9) rotate(30deg)}
  .settings-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .balance-pill{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:var(--r-pill);
    background:var(--surface2);border:.5px solid var(--border);flex-shrink:0}
  .balance-pill img{width:18px;height:18px;display:block;object-fit:contain}
  .balance-pill span{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  /* SETTINGS */
  #settings-overlay{
    position:fixed;inset:0;z-index:200;pointer-events:none;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;transition:opacity .25s ease}
  #settings-overlay.open{opacity:1;pointer-events:auto}
  .settings-panel{
    width:100%;max-width:360px;
    background:linear-gradient(180deg,#282c34,#181b20);
    border-radius:22px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.1);
    padding:20px;transform:scale(.9);opacity:0;
    transition:transform .3s var(--ease-spring),opacity .2s ease}
  #settings-overlay.open .settings-panel{transform:scale(1);opacity:1}
  .settings-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:.2px}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
  .settings-row + .settings-row{border-top:1px solid rgba(255,255,255,.06)}
  .settings-label{font-size:13.5px;font-weight:800;color:#fff;line-height:1.2}
  .settings-desc{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.45);margin-top:3px;line-height:1.2}
  .toggle-switch{
    width:50px;height:28px;border-radius:14px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.1);
    cursor:pointer;position:relative;
    transition:background .25s ease,border-color .25s ease;
    -webkit-appearance:none;appearance:none;outline:none;flex-shrink:0;padding:0}
  .toggle-switch:active{transform:scale(.95)}
  .toggle-switch.on{background:linear-gradient(180deg,#6da9ff,#4a86e8);border-color:rgba(140,180,255,.7)}
  .toggle-knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .toggle-switch.on .toggle-knob{transform:translateX(22px)}
  .settings-done{width:100%;height:46px;border-radius:14px;border:none;margin-top:20px;
    background:linear-gradient(180deg,#6da9ff,#4a86e8);color:#fff;
    font-family:inherit;font-size:14px;font-weight:900;letter-spacing:.4px;cursor:pointer;
    box-shadow:0 6px 18px rgba(91,157,255,.4),inset 0 1px 0 rgba(255,255,255,.28);
    -webkit-appearance:none;appearance:none;outline:none;transition:transform .18s var(--ease-spring)}
  .settings-done:active{transform:scale(.97)}

  /* STATS */
  #stat-bar{flex-shrink:0;display:flex;gap:8px;padding:0 12px 10px}
  .stat-box{flex:1;position:relative;overflow:hidden;padding:9px 14px 10px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}
  .stat-fill{position:absolute;left:0;top:0;bottom:0;width:0%;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#4CC38A,#2fa86f);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
    transition:width .5s var(--ease-spring),background .35s ease}
  .stat-fill.tier-blue{background:linear-gradient(180deg,#6db3ff,#3a7fd4)}
  .stat-fill.tier-purple{background:linear-gradient(180deg,#c193ff,#8b5ddc)}
  .stat-fill.tier-yellow{background:linear-gradient(180deg,#ffe68a,#d4b02e)}
  .stat-fill.tier-orange{background:linear-gradient(180deg,#ffb877,#e07c1e)}
  .stat-label{position:relative;z-index:1;display:block;font-size:8.5px;font-weight:900;
    letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);
    line-height:1;margin-bottom:4px}
  .stat-value{position:relative;z-index:1;display:block;font-size:16.5px;font-weight:900;
    font-variant-numeric:tabular-nums;letter-spacing:-.4px;color:#fff;line-height:1.1;
    text-shadow:0 1px 5px rgba(0,0,0,.7);transform-origin:left center}
  .stat-value.bump{animation:valBump .4s var(--ease-spring)}
  @keyframes valBump{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

  /* GRID */
  #grid-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
    padding:0 12px;position:relative;overflow:hidden}
  #grid-frame{
    position:relative;padding:10px;
    border-radius:var(--frame-radius);
    background:linear-gradient(180deg,#1c2027 0%,#101318 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      inset 0 -3px 0 rgba(0,0,0,.55),
      0 10px 28px rgba(0,0,0,.55);
    z-index:1;transition:border-radius .25s ease}
  #grid-frame.shaking{animation:gridShake .5s cubic-bezier(.36,.07,.19,.97)}
  @keyframes gridShake{
    0%,100%{transform:translate(0,0)}
    15%{transform:translate(-8px,3px)}
    30%{transform:translate(7px,-3px)}
    45%{transform:translate(-5px,2px)}
    60%{transform:translate(4px,-2px)}
    75%{transform:translate(-2px,1px)}
    90%{transform:translate(1px,0)}
  }
  #merge-grid{display:grid;position:relative}

  .tile{
    position:relative;aspect-ratio:1/1;padding:0;cursor:pointer;
    border:0;background:none;outline:0;
    -webkit-appearance:none;appearance:none;
    font-family:inherit;
    contain:layout style;
    animation:tileIn .4s cubic-bezier(.22,.9,.28,1.05) backwards}
  .tile:focus,.tile:focus-visible,.tile:active{outline:0!important;border:0!important}
  body.hand-mode .tile.filled{cursor:grab;touch-action:none}
  body.hand-mode .tile.filled:active{cursor:grabbing}
  @keyframes tileIn{
    0%{opacity:0;transform:translateY(24px) scale(.92)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }

  .face{
    position:absolute;inset:0;
    border-radius:var(--cell-radius);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .3s ease,background .3s ease,border-radius .25s ease,transform .2s ease;
    background:linear-gradient(180deg,#3a3e46 0%,#262a31 100%);
    box-shadow:
      0 5px 0 0 #0e1014,
      0 7px 10px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.09);
  }
  .tile:active:not(.filled):not(.opened) .face{
    transform:translateY(3px);
    box-shadow:
      0 2px 0 0 #0e1014,
      0 3px 6px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.05);
  }
  .tile.opened .face{
    background:linear-gradient(180deg,#0e1115 0%,#181c22 100%);
    box-shadow:
      inset 0 4px 8px rgba(0,0,0,.85),
      inset 0 -1px 0 rgba(255,255,255,.04),
      inset 0 0 0 1px rgba(255,255,255,.03);
    transform:none;
  }
  .tile.opened:active .face{transform:none}
  .tile.filled .face{
    background:
      radial-gradient(circle at 50% 55%,
        var(--tier-glow, transparent) 0%,
        rgba(0,0,0,0) 68%),
      linear-gradient(180deg,#181b21 0%,#0f1115 100%);
    box-shadow:
      0 5px 0 0 #08090c,
      0 7px 10px rgba(0,0,0,.4),
      0 0 22px var(--tier-halo, rgba(255,255,255,0)),
      inset 0 0 0 2px var(--tier-color, rgba(255,255,255,.08)),
      inset 0 1px 0 rgba(255,255,255,.06);
    transform:none;
  }
  .tile.filled:active .face{transform:none}

  .tile.filled.highest .face{animation:highestPulse 2s ease-in-out infinite}
  @keyframes highestPulse{
    0%,100%{box-shadow:0 5px 0 0 #08090c,0 7px 10px rgba(0,0,0,.4),0 0 18px var(--tier-halo),inset 0 0 0 2px var(--tier-color),inset 0 1px 0 rgba(255,255,255,.06)}
    50%{box-shadow:0 5px 0 0 #08090c,0 7px 10px rgba(0,0,0,.4),0 0 34px var(--tier-halo),inset 0 0 0 2px var(--tier-color),inset 0 1px 0 rgba(255,255,255,.06)}
  }

  /* Hand-mode selection + target highlights */
  .tile.selected .face{
    box-shadow:
      0 5px 0 0 #08090c,
      0 7px 10px rgba(0,0,0,.4),
      0 0 24px rgba(0,255,255,.75),
      inset 0 0 0 3px rgba(0,255,255,.9),
      inset 0 1px 0 rgba(255,255,255,.06);
    animation:selectedPulse 1s ease-in-out infinite;
  }
  @keyframes selectedPulse{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.28)}
  }
  .tile.merge-target .face{
    box-shadow:
      0 5px 0 0 #08090c,
      0 7px 10px rgba(0,0,0,.4),
      0 0 24px rgba(0,255,136,.7),
      inset 0 0 0 2px rgba(0,255,136,.85),
      inset 0 1px 0 rgba(255,255,255,.06);
  }
  .tile.merge-hover .face{
    transform:scale(1.06);
    box-shadow:
      0 5px 0 0 #08090c,
      0 7px 10px rgba(0,0,0,.4),
      0 0 32px rgba(0,255,136,1),
      inset 0 0 0 3px rgba(0,255,136,1),
      inset 0 1px 0 rgba(255,255,255,.06);
  }
  .tile.drag-source{opacity:.35;transition:opacity .2s ease}

  .drag-ghost{
    pointer-events:none;
    z-index:9999;
    will-change:left,top;
    transition:transform .12s ease;
  }

  .closed-icon{
    position:absolute;
    width:56%;height:56%;
    object-fit:contain;
    opacity:.5;
    filter:grayscale(1) brightness(1.9);
    transition:opacity .2s ease;
    pointer-events:none;
  }
  .tile.opened .closed-icon,
  .tile.filled .closed-icon{opacity:0}

  .gift-img{
    position:absolute;
    object-fit:contain;
    opacity:0;
    transform:scale(.2);
    transition:opacity .24s ease, transform .36s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    z-index:2;
  }
  .tile.filled .gift-img{opacity:1;transform:scale(1)}
  .tile.just-filled .gift-img{animation:giftPop .5s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes giftPop{
    0%{opacity:0;transform:scale(.18) rotate(-12deg)}
    60%{opacity:1;transform:scale(1.12) rotate(2deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }

  .tile.is-bomb .face{
    background:
      radial-gradient(circle at 50% 55%, rgba(255,77,109,.45) 0%, rgba(0,0,0,0) 68%),
      linear-gradient(180deg,#2a0a12 0%,#14050a 100%);
    box-shadow:
      0 5px 0 0 #08090c,
      0 7px 10px rgba(0,0,0,.4),
      0 0 26px rgba(255,77,109,.55),
      inset 0 0 0 2px rgba(255,77,109,.8);
  }
  .bomb-img{
    position:absolute;left:50%;top:50%;
    width:62%;height:62%;object-fit:contain;
    transform:translate(-50%,-50%) scale(.2) rotate(-45deg);
    opacity:0;
    animation:bombIn .5s cubic-bezier(.34,1.56,.64,1) both;
    pointer-events:none;z-index:3;
  }
  @keyframes bombIn{
    0%{transform:translate(-50%,-50%) scale(.15) rotate(-90deg);opacity:0}
    55%{transform:translate(-50%,-50%) scale(1.2) rotate(10deg);opacity:1}
    80%{transform:translate(-50%,-50%) scale(.95) rotate(-3deg)}
    100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  }

  .tile.is-bonus .face{
    background:
      radial-gradient(circle at 50% 55%, rgba(0,255,136,.45) 0%, rgba(0,0,0,0) 68%),
      linear-gradient(180deg,#0a2018 0%,#041a10 100%);
    box-shadow:
      0 5px 0 0 #041410,
      0 7px 10px rgba(0,0,0,.4),
      0 0 26px rgba(0,255,136,.5),
      inset 0 0 0 2px rgba(0,255,136,.65);
  }
  .tile.is-bonus.bonus-flash .face{animation:bonusFlashAnim .7s ease}
  @keyframes bonusFlashAnim{
    0%{transform:scale(1);filter:brightness(1)}
    40%{transform:scale(1.12);filter:brightness(1.8)}
    70%{transform:scale(1.05);filter:brightness(1.5)}
    100%{transform:scale(1);filter:brightness(1)}
  }
  .bonus-label{
    position:absolute;bottom:5%;left:0;right:0;text-align:center;
    font-size:9px;font-weight:900;letter-spacing:1.8px;color:#00ff88;
    text-shadow:0 1px 2px rgba(0,0,0,.95);
    pointer-events:none;z-index:4;
  }

  .highest-badge{
    position:absolute;top:4px;left:4px;
    padding:3px 7px;
    background:rgba(0,0,0,.78);
    color:#fff;
    font-size:10px;font-weight:900;
    font-variant-numeric:tabular-nums;
    border-radius:var(--cell-radius);
    pointer-events:none;
    opacity:0;transform:scale(.7);
    transition:opacity .3s ease,transform .35s var(--ease-spring);
    z-index:5;
  }
  .tile.highest .highest-badge{opacity:1;transform:scale(1)}

  .tile.landed .face{animation:landBounce .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes landBounce{
    0%{transform:scale(1.12, .88)}
    35%{transform:scale(.93, 1.07)}
    58%{transform:scale(1.05, .96)}
    78%{transform:scale(.98, 1.02)}
    100%{transform:scale(1, 1)}
  }

  .fly-face{
    position:absolute;
    z-index:40;
    pointer-events:none;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 55%, var(--fly-glow, transparent) 0%, rgba(0,0,0,0) 68%),
      linear-gradient(180deg,#181b21 0%,#0f1115 100%);
    box-shadow:
      0 6px 0 0 #08090c,
      0 8px 12px rgba(0,0,0,.5),
      0 0 28px var(--fly-halo, rgba(255,255,255,0)),
      inset 0 0 0 2px var(--fly-tier-color, rgba(255,255,255,.1));
    border-radius:var(--cell-radius);
    will-change:transform;
    transform-origin:center;
    transform:translateZ(0);
  }
  .fly-face img{object-fit:contain;pointer-events:none}

  .float-value{
    position:fixed;z-index:45;pointer-events:none;
    font-size:16px;font-weight:900;color:#fff;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 6px rgba(0,0,0,.95);
    animation:floatUp .95s ease-out forwards}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,0) scale(.5)}
    22%{opacity:1;transform:translate(-50%,-16px) scale(1.2)}
    42%{transform:translate(-50%,-26px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-78px) scale(.9)}
  }
  .combo-text{
    position:fixed;z-index:9998;left:50%;top:38%;
    font-size:44px;font-weight:900;letter-spacing:-1.4px;color:#fff;white-space:nowrap;
    text-shadow:0 0 20px rgba(255,213,74,.85),0 3px 10px rgba(0,0,0,.95);
    pointer-events:none;opacity:0;
    animation:comboPop 1.1s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes comboPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(3deg)}
    45%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-70%) scale(.85)}
  }
  .nice-text{
    position:fixed;z-index:9999;left:50%;top:42%;
    font-size:52px;font-weight:900;letter-spacing:-1px;color:#fff;
    text-shadow:0 0 18px rgba(255,213,74,.95),0 4px 12px rgba(0,0,0,.95);
    pointer-events:none;opacity:0;
    transform:translate(-50%,-50%) scale(.3) rotate(-8deg);
    animation:nicePop 1.05s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes nicePop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(4deg)}
    32%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-58%) scale(.9)}
  }
  .confetti{
    position:fixed;width:5px;height:5px;border-radius:50%;
    pointer-events:none;z-index:9999;
    animation:confettiFly .65s ease-out forwards}
  @keyframes confettiFly{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2) rotate(var(--rot));opacity:0}
  }
  .bonus-fly-text{
    position:fixed;z-index:9999;pointer-events:none;
    color:#00ff88;font-size:17px;font-weight:900;white-space:nowrap;
    text-shadow:0 0 12px #00ff88,0 0 24px rgba(0,255,136,.7),0 2px 6px rgba(0,0,0,.95);
    transform:translate(-50%,-50%) scale(1);
    transition:transform .85s cubic-bezier(.34,1.1,.5,1),opacity .85s ease-out;
  }

  /* CONTROLS */
  #controls{flex-shrink:0;padding:8px 12px calc(14px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:8px}
  #diff-row{display:flex;gap:6px}
  .diff-chip{flex:1;height:44px;border-radius:16px;
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:inherit;cursor:pointer;padding:0 4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .16s var(--ease-spring),background .2s,border-color .2s,box-shadow .25s;
    -webkit-appearance:none;appearance:none;outline:none}
  .diff-chip:active{transform:scale(.94)}
  .diff-chip:disabled{opacity:.4;pointer-events:none}
  .dc-name{font-size:11.5px;font-weight:900;line-height:1}
  .dc-sub{font-size:8.5px;font-weight:800;opacity:.5;line-height:1;margin-top:2px}
  .diff-chip.active{
    border-color:var(--dc);

  #grid-size-row{display:flex;align-items:center;gap:6px}

  .gs-chip:active{transform:scale(.94)}
  .gs-chip:disabled{opacity:.4;pointer-events:none}
  .gs-chip.active{
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));

  .bet-row{display:flex;gap:8px}

  #bet-input:focus{border-color:rgba(140,180,255,.55);

  #allin-btn{height:50px;padding:0 22px;border-radius:var(--r-xl);

  #action-row{display:flex;gap:8px}

    transition:transform .2s var(--ease-spring),box-shadow .25s,background .3s;
    display:flex;align-items:center;justify-content:center;

  #cashout-btn{height:58px;border-radius:var(--r-xl);border:none;

    background:linear-gradient(180deg,#4ade80,#22c55e);color:#fff;
    box-shadow:0 10px 28px rgba(34,197,94,.42),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .2s var(--ease-spring),box-shadow .25s;
    display:flex;align-items:center;justify-content:center;gap:6px;
    -webkit-appearance:none;appearance:none;outline:none}
  #cashout-btn:active{transform:scale(.975)}
  #cashout-btn:disabled{opacity:.35;pointer-events:none}

  /* RESULT */
  #result-overlay{position:absolute;inset:0;z-index:50;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;

  #result-panel{width:100%;max-width:400px;border-radius:26px;padding:24px 20px 16px;
    background:linear-gradient(180deg, rgba(40,50,80,.95), rgba(18,24,40,.97));

    border:1px solid rgba(180,210,255,.22);
    box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.14);
    transform:translateY(130%);opacity:0;pointer-events:none;
    transition:transform .5s var(--ease-spring),opacity .3s ease}
  #result-panel.show{transform:translateY(0);opacity:1;pointer-events:auto}
  #result-panel.win{border-color:rgba(76,195,138,.45)}

  .result-title{font-size:11px;font-weight:900;letter-spacing:2.6px;text-transform:uppercase;

  #toast{position:fixed;top:calc(14px + var(--safe-top));left:50%;
    transform:translate(-50%,-140%) scale(.86);
    z-index:9999;padding:12px 20px;border-radius:18px;font-size:12.5px;font-weight:800;
    background:linear-gradient(180deg,rgba(56,68,100,.95),rgba(22,28,46,.97));

    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);
    opacity:0;pointer-events:none;max-width:90vw;text-align:center;
    transition:transform .4s var(--ease-spring),opacity .25s ease}
  #toast.show{transform:translate(-50%,0) scale(1);opacity:1}

  #combo-badge{
    position:absolute;top:-14px;right:-8px;z-index:20;

    opacity:0;transform:scale(.5) translateY(-8px);
    transition:opacity .3s ease,transform .4s var(--ease-spring);
    pointer-events:none}
  #combo-badge.show{opacity:1;transform:scale(1) translateY(0)}
  #combo-badge.bump{animation:comboBump .4s var(--ease-spring)}
  @keyframes comboBump{
    0%{transform:scale(1) translateY(0)}

    100%{transform:scale(1) translateY(0)}
  }

  #best-badge{
    position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
    z-index:20;padding:4px 10px;border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.75);
    font-size:10px;font-weight:900;letter-spacing:1.2px;
    font-variant-numeric:tabular-nums;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    white-space:nowrap}
  #best-badge.show{opacity:1}

  /* Loading */
  #loading{
    position:fixed;inset:0;background:#0a0a0a;z-index:99999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    transition:opacity .4s ease}
  #loading.hide{opacity:0;pointer-events:none}
  .ld-ring{
    width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#5b9dff;
    animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ld-text{font-size:12px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.4);text-transform:uppercase}
</style>
</head>
<body>

<div id="loading">

<div id="app">
  <div id="topbar">

    <button class="settings-btn" id="settings-btn" aria-label="Settings">

        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.34.34.65.6.91H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

  <div id="stat-bar">

  <div id="grid-stage">

  <div id="controls">
    <div id="diff-row">
      <button class="diff-chip" data-d="easy" type="button">
        <span class="dc-name">Easy</span><span class="dc-sub">6%</span>
      </button>
      <button class="diff-chip" data-d="medium" type="button">
        <span class="dc-name">Medium</span><span class="dc-sub">12%</span>
      </button>
      <button class="diff-chip" data-d="hard" type="button">
        <span class="dc-name">Hard</span><span class="dc-sub">18%</span>
      </button>

    <div id="grid-size-row">
      <span class="gs-label">Grid</span>
      <button class="gs-chip active" data-n="3" type="button">3 × 3</button>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  const TG = window.Telegram?.WebApp;
  if (TG) {
    try { TG.expand(); } catch(_){}
    try { TG.setHeaderColor?.('#0a0a0a'); } catch(_){}
    try { TG.setBackgroundColor?.('#0a0a0a'); } catch(_){}
    try { TG.disableVerticalSwipes?.(); } catch(_){}
  }
  function haptic(style){
    try {
      if (TG?.HapticFeedback) TG.HapticFeedback.impactOccurred(style || 'light');
      else if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 30 : 12);
    } catch(_){}
  }
  const $ = s => document.querySelector(s);

  /* +100 bonus */
  try {
    const MK = 'dllump_merge_bonus_v1';
    if (!localStorage.getItem(MK)) {
      const cur = parseInt(localStorage.getItem('dllump_merge_balance') || '1000', 10);
      localStorage.setItem('dllump_merge_balance', String(cur + 100));
      localStorage.setItem(MK, '1');
    }
  } catch(_){}

  const GIFT_ICON_SRC = 'https://i.postimg.cc/SsNS5WNq/better-gift-box.png';
  const APPLE_RING = 'https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-160/1f48d.png';
  const APPLE_BOMB = 'https://cdn.jsdelivr.net/gh/iamcal/emoji-data@master/img-apple-160/1f4a3.png';

  const TIERS_SRC = [
    { v: 1,   url: 'https://i.postimg.cc/Xv3Hq9JT/ezgif-21ab08378515e1ba.gif', color: '#a8b3c4', scale: 82 },
    { v: 3,   url: GIFT_ICON_SRC,                                               color: '#4CC38A', scale: 84 },
    { v: 10,  url: APPLE_RING,                                                   color: '#2fd9a4', scale: 78 },
    { v: 35,  url: 'https://i.postimg.cc/vBCSQk6t/ezgif-8bc68a0ab30628c5.gif', color: '#5b9dff', scale: 88 },
    { v: 120, url: 'https://i.postimg.cc/FKBTZ8G4/ezgif-2655c04bfa645c12.gif', color: '#8a7dff', scale: 90 },
    { v: 450, url: 'https://i.postimg.cc/kXmffxNX/ezgif-1bcbf26839329366.gif', color: '#ffd54a', scale: 94 }
  ];
  const BONUS_SRC = 'https://i.postimg.cc/PJkzVjw6/ezgif-731108219aa0df74.gif';
  const TIERS = TIERS_SRC.map(t => ({ ...t }));
  let BONUS_URL = BONUS_SRC;

  const staticCache = new Map();
  function extractStatic(url){
    if (staticCache.has(url)) return Promise.resolve(staticCache.get(url));
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      let done = false;
      const settle = (r) => { if (done) return; done = true; staticCache.set(url, r); resolve(r); };
      const timer = setTimeout(() => settle(url), 4000);
      img.onload = () => {
        clearTimeout(timer);
        try {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth || 128;
          c.height = img.naturalHeight || 128;
          c.getContext('2d').drawImage(img, 0, 0);
          settle(c.toDataURL('image/png'));
        } catch(e){ settle(url); }
      };
      img.onerror = () => { clearTimeout(timer); settle(url); };
      img.src = url;
    });
  }
  async function preloadAll(){
    const tasks = TIERS.map(t => (async () => { t.url = await extractStatic(t.url); })());
    tasks.push((async () => { BONUS_URL = await extractStatic(BONUS_SRC); })());
    tasks.push(extractStatic(GIFT_ICON_SRC));
    await Promise.all(tasks);
  }

  const Sound = (function(){
    let ctx = null, unlocked = false, master = null;
    function ensure(){
      if (!ctx){
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC){ ctx = new AC(); master = ctx.createGain(); master.gain.value = .3; master.connect(ctx.destination); }
        } catch(_){}
      }
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
      return ctx;
    }
    function unlock(){ if (unlocked) return; if (!ensure()) return; unlocked = true; }
    ['pointerdown','touchstart','keydown'].forEach(e => document.addEventListener(e, unlock, { once: true, passive: true }));
    function tone(freq, dur, type, vol, when, sweepTo){
      const c = ensure(); if (!c || !unlocked) return;
      const t0 = when || c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
      if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), t0 + dur);
      const v = vol == null ? .22 : vol;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .03);
    }
    return {
      click(){ tone(720,.03,'sine',.1,null,520); },
      place(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(560,.08,'sine',.13,t,760); tone(820,.06,'sine',.07,t+.03,980); },
      merge(lvl){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        const base = 480 + lvl * 160;
        tone(base,.14,'triangle',.16,t,base*1.7);
        tone(base*1.5,.18,'sine',.09,t+.03,base*2.3);
        if (lvl >= 2) tone(base*2,.24,'sine',.08,t+.08,base*3); },
      nice(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        [1046.5, 1318.5, 1568, 2093].forEach((f,i) => tone(f,.22,'triangle',.14,t+i*.05));
        tone(2637,.4,'sine',.1,t+.2,3200); },
      bomb(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(130,.35,'sawtooth',.3,t,45); tone(80,.5,'triangle',.22,t+.02,30);
        tone(280,.25,'square',.09,t+.05,90); },
      bonus(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(900,.1,'sine',.13,t,1200); tone(1300,.12,'triangle',.1,t+.05,1700); },
      milestone(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(800,.16,'sine',.14,t,1600); tone(1200,.18,'triangle',.11,t+.05,2400); },
      cashout(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        [523.25,659.25,783.99,1046.5].forEach((f,i) => {
          tone(f,.22,'triangle',.14,t+i*.05); tone(f*2,.16,'sine',.05,t+i*.05+.01);
        }); },
      lose(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(400,.32,'triangle',.17,t,180); tone(220,.45,'sine',.13,t+.11,90); },
      start(){ const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(440,.08,'sine',.14,t,660); tone(660,.12,'sine',.12,t+.05,990); }
    };
  })();

  const MIN_BET = 10;
  const MAX_BONUS = 2;
  const OPEN_PER_STEP = 3;
  const BONUS_CHANCE = 0.05;
  const PREMIUM_TIER = 4;

  const DIFFS = {
    easy:    { bomb: .06, k: .009, color: '#4CC38A', weights: [80, 15, 4, 1, 0, 0] },
    medium:  { bomb: .12, k: .016, color: '#5b9dff', weights: [60, 22, 11, 5, 1.8, .2] },
    hard:    { bomb: .18, k: .026, color: '#ff9d4d', weights: [44, 22, 16, 10, 6, 2] },
    extreme: { bomb: .26, k: .040, color: '#e0556b', weights: [28, 20, 19, 15, 11, 7] }
  };

  const state = {
    difficulty: 'medium',
    gridSize: 3,
    bet: 10,
    balance: 1000,
    playing: false,
    busy: false,
    points: 0,
    totalMerges: 0,
    maxTier: -1,
    bestTier: -1,
    roundedCorners: false,
    handMode: false,
    selectedTile: -1,
    tiles: []
  };

  try {
    const b = localStorage.getItem('dllump_merge_balance');
    if (b !== null) state.balance = Math.max(0, parseInt(b, 10) || 0);
    if (localStorage.getItem('dllump_merge_rounded') === '1') state.roundedCorners = true;
    if (localStorage.getItem('dllump_merge_handmode') === '1') state.handMode = true;
    const bt = localStorage.getItem('dllump_merge_best_tier');
    if (bt !== null) state.bestTier = parseInt(bt, 10) || -1;
  } catch(_){}
  function persistBalance(){ try { localStorage.setItem('dllump_merge_balance', String(state.balance)); } catch(_){} }
  function persistRounded(){ try { localStorage.setItem('dllump_merge_rounded', state.roundedCorners ? '1' : '0'); } catch(_){} }
  function persistHandMode(){ try { localStorage.setItem('dllump_merge_handmode', state.handMode ? '1' : '0'); } catch(_){} }
  function persistBest(){ try { localStorage.setItem('dllump_merge_best_tier', String(state.bestTier)); } catch(_){} }

  const els = {
    loading: $('#loading'),
    grid: $('#merge-grid'),
    frame: $('#grid-frame'),
    stage: $('#grid-stage'),
    mult: $('#mult-value'),
    cash: $('#cash-value'),
    fill: $('#mult-fill'),
    balance: $('#balance-val'),
    bet: $('#bet-input'),
    allin: $('#allin-btn'),
    action: $('#action-btn'),
    cashout: $('#cashout-btn'),
    diffRow: $('#diff-row'),
    gsRow: $('#grid-size-row'),
    combo: $('#combo-badge'),
    best: $('#best-badge'),
    panel: $('#result-panel'),
    panelTitle: $('#result-title'),
    panelMult: $('#result-mult'),
    panelAmt: $('#result-amt'),
    panelBtn: $('#result-continue'),
    toast: $('#toast'),
    settingsBtn: $('#settings-btn'),
    settingsOverlay: $('#settings-overlay'),
    settingsDone: $('#settings-done'),
    toggleCorners: $('#toggle-corners'),
    toggleHandMode: $('#toggle-handmode')
  };

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const distTL = i => Math.floor(i / state.gridSize) + (i % state.gridSize);
  const hexA = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  };
  const fmtMult = v => isFinite(v) ? 'x' + v.toFixed(2) : 'x∞';
  const fmtMoney = v => {
    const n = Math.floor(v * 100) / 100;
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(2);
  };
  const multTier = m => m >= 6 ? 'tier-orange' : m >= 4 ? 'tier-yellow' : m >= 2.5 ? 'tier-purple' : m >= 1.5 ? 'tier-blue' : '';

  function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function updateBalance(animate){
    const target = Math.floor(state.balance);
    if (animate){
      const from = parseInt(els.balance.textContent.replace(/,/g, ''), 10) || 0;
      if (from !== target){
        const start = performance.now(), dur = 420;
        (function step(t){
          const p = Math.min(1, (t - start) / dur);
          const e = 1 - Math.pow(1 - p, 3);
          els.balance.textContent = Math.round(from + (target - from) * e).toLocaleString('en-US');
          if (p < 1) requestAnimationFrame(step);
          else els.balance.textContent = target.toLocaleString('en-US');
        })(performance.now());
        return;
      }
    }
    els.balance.textContent = target.toLocaleString('en-US');
  }
  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(els.toast._t);
    els.toast._t = setTimeout(() => els.toast.classList.remove('show'), 2200);
  }

  function bonusCount(){ let n = 0; for (const t of state.tiles) if (t.tier === -2) n++; return n; }
  function currentMult(){
    const base = 1 + state.points * DIFFS[state.difficulty].k;
    return base * Math.pow(1.2, bonusCount());
  }
  function recalcPoints(){
    let p = 0;
    for (const t of state.tiles) if (t.tier >= 0) p += TIERS[t.tier].v;
    state.points = p;
  }
  function updateMultDisplay(pulse){
    const mult = currentMult();
    const cash = state.bet * mult;
    els.mult.textContent = fmtMult(mult);
    els.cash.textContent = fmtMoney(cash);
    const pct = Math.max(0, Math.min(1, mult / 6)) * 100;
    els.fill.style.width = pct + '%';
    const tier = multTier(mult);
    els.fill.classList.remove('tier-blue','tier-purple','tier-yellow','tier-orange');
    if (tier) els.fill.classList.add(tier);
    if (pulse){ bump(els.mult); bump(els.cash); }
    if (state.playing){
      els.cashout.innerHTML = 'Cashout <span class="co-amount">· ' + fmtMoney(cash) + '</span>';
      els.cashout.disabled = state.points <= 0 || state.busy;
    }
    updateHighestBadge();
  }
  function updateCombo(bumpAnim){
    if (state.totalMerges > 0){
      els.combo.textContent = 'COMBO ×' + state.totalMerges;
      els.combo.classList.add('show');
      if (bumpAnim){ els.combo.classList.remove('bump'); void els.combo.offsetWidth; els.combo.classList.add('bump'); }
    } else {
      els.combo.classList.remove('show');
    }
  }
  function updateBestBadge(){
    if (state.bestTier >= 0){
      els.best.textContent = 'BEST: $' + TIERS[state.bestTier].v;
      els.best.classList.add('show');
    } else {
      els.best.classList.remove('show');
    }
  }
  function updateHighestBadge(){
    let maxTier = -1, maxIdx = -1;
    state.tiles.forEach((t, i) => {
      if (t.tier > maxTier && t.tier >= 0){ maxTier = t.tier; maxIdx = i; }
    });
    state.tiles.forEach((t, i) => {
      t.el.classList.toggle('highest', i === maxIdx && maxTier >= 0);
    });
    if (maxIdx >= 0){
      const badge = state.tiles[maxIdx].badge;
      if (badge) badge.textContent = fmtMult(currentMult());
    }
  }

  function sizeGrid(){
    const r = els.stage.getBoundingClientRect();
    const s = Math.max(140, Math.floor(Math.min(r.width, r.height) - 40));
    els.grid.style.width = s + 'px';
    els.grid.style.height = s + 'px';
  }

  function buildGrid(animate){
    const n = state.gridSize;
    const total = n * n;
    els.grid.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    els.grid.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';
    els.grid.style.gap = n === 3 ? '8px' : n === 5 ? '6px' : '7px';
    els.grid.innerHTML = '';
    state.tiles = [];
    state.selectedTile = -1;
    for (let i = 0; i < total; i++){
      const t = document.createElement('button');
      t.type = 'button';
      t.className = 'tile';
      t.dataset.idx = i;
      if (animate) t.style.animationDelay = (i * 15) + 'ms';
      else t.style.animation = 'none';
      t.innerHTML =
        '<div class="face">' +
          '<img class="closed-icon" src="' + GIFT_ICON_SRC + '" alt="" draggable="false">' +
          '<img class="gift-img" alt="" draggable="false">' +
          '<div class="highest-badge"></div>' +
        '</div>';
      t.addEventListener('click', () => onTileClick(i));
      const face = t.firstChild;
      const closedIcon = face.querySelector('.closed-icon');
      const giftImg = face.querySelector('.gift-img');
      const badge = face.querySelector('.highest-badge');
      els.grid.appendChild(t);
      state.tiles.push({ tier: -1, el: t, face, closedIcon, giftImg, badge });

    sizeGrid();
  }

  function setTierGlow(faceEl, color){
    faceEl.style.setProperty('--tier-color', color);
    faceEl.style.setProperty('--tier-glow', hexA(color, 0.42));
    faceEl.style.setProperty('--tier-halo', hexA(color, 0.45));
  }
  function clearTierGlow(faceEl){
    faceEl.style.removeProperty('--tier-color');
    faceEl.style.removeProperty('--tier-glow');
    faceEl.style.removeProperty('--tier-halo');
  }

  function fillFresh(idx, tier){
    const t = state.tiles[idx];
    t.tier = tier;
    const info = TIERS[tier];
    const oldB = t.face.querySelector('.bonus-label');
    if (oldB) oldB.remove();
    setTierGlow(t.face, info.color);
    t.giftImg.style.transition = 'none';

    t.giftImg.style.width = info.scale + '%';
    t.giftImg.style.height = info.scale + '%';
    void t.giftImg.offsetWidth;
    t.giftImg.style.transition = '';
    t.giftImg.style.opacity = '';

    setTierGlow(t.face, '#00ff88');

    t.giftImg.style.opacity = '0';

    t.giftImg.style.width = '82%';
    t.giftImg.style.height = '82%';

  function clearCell(idx){
    const t = state.tiles[idx];
    t.tier = -1;
    t.el.classList.remove('filled','just-filled','landed','highest','is-bomb','is-bonus','bonus-flash','selected','merge-target','merge-hover','drag-source');

    t.el.style.opacity = '';
    t.el.style.transition = '';
    clearTierGlow(t.face);

      t.giftImg.style.transition = 'none';
      t.giftImg.style.opacity = '0';
      t.giftImg.style.visibility = 'hidden';

  function showFloatValue(el, text, color){

    const f = document.createElement('div');
    f.className = 'float-value';

    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top = (r.top + r.height * 0.35) + 'px';
    if (color) f.style.setProperty('--glow', color);
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1050);

  function showComboText(count){
    const el = document.createElement('div');
    el.className = 'combo-text';
    if (count >= 6) el.textContent = 'LEGENDARY ×' + count;
    else if (count >= 5) el.textContent = 'INSANE ×' + count;

    else if (count >= 3) el.textContent = 'SUPER ×' + count;

  function burstAt(el, color, count){

      const p = document.createElement('div');
      p.className = 'confetti';

      const dist = 28 + Math.random() * 52;
      p.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(1) + 'px');
      p.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(1) + 'px');
      p.style.setProperty('--rot', (Math.random() * 540 - 270).toFixed(0) + 'deg');
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = i % 3 === 0 ? '#fff' : color;

    setTimeout(() => f.remove(), 900);

  async function flashBonusCells(){
    const bonusIdx = [];
    state.tiles.forEach((t, i) => { if (t.tier === -2) bonusIdx.push(i); });
    if (!bonusIdx.length) return;
    bonusIdx.forEach(idx => {
      const t = state.tiles[idx];
      t.el.classList.remove('bonus-flash');
      void t.el.offsetWidth;
      t.el.classList.add('bonus-flash');
      showBonusFlyText(t.el);
    });
    Sound.bonus();
    haptic('light');
    await sleep(700);
    bonusIdx.forEach(idx => state.tiles[idx].el.classList.remove('bonus-flash'));

  /* ============ MERGE ANIMATION ============ */
  function makeFlyFace(srcEl, info, capturedRect){
    const fr = els.frame.getBoundingClientRect();
    const sr = capturedRect;
    const cs = getComputedStyle(srcEl.querySelector('.face'));
    const radius = cs.borderTopLeftRadius || '0px';
    const ghost = document.createElement('div');
    ghost.className = 'fly-face';
    ghost.style.left = (sr.left - fr.left) + 'px';
    ghost.style.top = (sr.top - fr.top) + 'px';
    ghost.style.width = sr.width + 'px';
    ghost.style.height = sr.height + 'px';
    ghost.style.borderRadius = radius;
    ghost.style.setProperty('--fly-tier-color', info.color);
    ghost.style.setProperty('--fly-glow', hexA(info.color, 0.42));
    ghost.style.setProperty('--fly-halo', hexA(info.color, 0.5));
    const img = document.createElement('img');
    img.src = info.url;
    img.style.width = info.scale + '%';
    img.style.height = info.scale + '%';
    img.style.objectFit = 'contain';
    ghost.appendChild(img);
    els.frame.appendChild(ghost);
    return ghost;
  }

  /* The "normal" squash-and-stretch merge animation */
  function animateMerge(srcIdx, dstIdx, tier){
    return new Promise(resolve => {
      const srcEl = state.tiles[srcIdx].el;
      const dstEl = state.tiles[dstIdx].el;
      const info = TIERS[tier];
      const srcFace = srcEl.querySelector('.face');
      const srcRect = srcFace.getBoundingClientRect();
      const dstRect = dstEl.getBoundingClientRect();

      clearCell(srcIdx);
      const ghost = makeFlyFace(srcEl, info, srcRect);

      const dx = dstRect.left - srcRect.left;
      const dy = dstRect.top - srcRect.top;
      const isPremium = (tier + 1) >= PREMIUM_TIER;

      const keyframes = isPremium ? [
        { transform: 'translate(0, 0) scale(1, 1)', offset: 0 },
        { transform: 'translate(0, 8px) scale(1.08, 0.9)', offset: 0.1 },
        { transform: 'translate(0, -70px) scale(0.85, 1.24)', offset: 0.3 },
        { transform: `translate(${dx*0.55}px, ${dy*0.55 - 90}px) scale(0.9, 1.14)`, offset: 0.55 },
        { transform: `translate(${dx*0.88}px, ${dy*0.88 - 25}px) scale(1.08, 0.94)`, offset: 0.8 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.32, 0.72)`, offset: 0.92 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.96, 1.04)`, offset: 0.97 },
        { transform: `translate(${dx}px, ${dy}px) scale(1, 1)`, offset: 1 }
      ] : [
        { transform: 'translate(0, 0) scale(1, 1)', offset: 0 },
        { transform: 'translate(0, -45px) scale(0.92, 1.12)', offset: 0.3 },
        { transform: `translate(${dx*0.6}px, ${dy*0.6 - 40}px) scale(0.98, 1.04)`, offset: 0.65 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.14, 0.88)`, offset: 0.9 },
        { transform: `translate(${dx}px, ${dy}px) scale(1, 1)`, offset: 1 }
      ];

      const duration = isPremium ? 580 : 420;

      ghost.animate(keyframes, { duration, easing: 'linear', fill: 'forwards' });

      if (isPremium){
        els.frame.classList.add('shaking');
        setTimeout(() => els.frame.classList.remove('shaking'), 520);
      }

      setTimeout(() => {
        ghost.remove();
        upgradeCell(dstIdx, tier + 1);
        state.tiles[dstIdx].tier = tier + 1;

        const dstElNew = state.tiles[dstIdx].el;
        dstElNew.classList.remove('landed');
        void dstElNew.offsetWidth;
        dstElNew.classList.add('landed');
        setTimeout(() => dstElNew.classList.remove('landed'), 600);

        const resultInfo = TIERS[tier + 1];
        showFloatValue(dstElNew, '+$' + resultInfo.v, resultInfo.color);

        if (isPremium){
          setTimeout(() => burstAt(dstElNew, resultInfo.color, 20), 30);
          setTimeout(() => burstAt(dstElNew, '#ffffff', 8), 110);
          showNiceText();
          Sound.nice();
        } else if (tier >= 2){
          burstAt(dstElNew, resultInfo.color, 8);
        }

        if (tier + 1 > state.maxTier){
          state.maxTier = tier + 1;
          if (tier + 1 > state.bestTier){
            state.bestTier = tier + 1;
            persistBest();
            showToast('🏆 BEST TIER ' + (tier + 1) + ' · $' + resultInfo.v);
          } else {
            showToast('✨ TIER ' + (tier + 1) + ' · $' + resultInfo.v);
          }
          Sound.milestone();
          updateBestBadge();
        }

        Sound.merge(tier);
        haptic(isPremium ? 'heavy' : (tier >= 2 ? 'medium' : 'light'));
        resolve();
      }, duration);
    });
  }

  /* ============ PARALLEL MERGE RESOLVER ============ */
  function findMergePairs(){
    const used = new Set();
    const pairs = [];
    for (let tier = 0; tier < TIERS.length - 1; tier++){
      const idxs = [];
      state.tiles.forEach((t, i) => {
        if (t.tier === tier && !used.has(i)) idxs.push(i);
      });
      if (idxs.length < 2) continue;
      idxs.sort((a, b) => distTL(a) - distTL(b));
      for (let k = 0; k + 1 < idxs.length; k += 2){
        const dst = idxs[k];
        const src = idxs[k+1];
        if (used.has(dst) || used.has(src)) continue;
        used.add(dst);
        used.add(src);
        pairs.push({ src, dst, tier });
      }
    }
    return pairs;
  }

  async function resolveMerges(){
    let totalMerges = 0;
    let guard = 0;
    while (guard++ < 60){
      const pairs = findMergePairs();
      if (!pairs.length) break;
      const promises = pairs.map((p, i) =>
        new Promise(resolve => {
          setTimeout(async () => {
            await animateMerge(p.src, p.dst, p.tier);
            totalMerges++;
            resolve();
          }, i * 60);
        })
      );
      await Promise.all(promises);
      recalcPoints();
      updateMultDisplay(true);
    }
    return totalMerges;
  }

  function rollTier(){
    const w = DIFFS[state.difficulty].weights;
    let total = 0;
    for (const x of w) total += x;
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++){
      if (r < w[i]) return i;
      r -= w[i];
    }
    return 0;
  }

  async function bombCellsFall(bombIdx){
    const filled = [];
    state.tiles.forEach((t, i) => {
      if (i === bombIdx) return;
      if (t.tier === -1 && !t.el.classList.contains('is-bomb')) return;
      filled.push(t);
    });
    if (!filled.length) return;
    const bombRow = Math.floor(bombIdx / state.gridSize);
    const bombCol = bombIdx % state.gridSize;
    filled.sort((a, b) => {
      const ai = state.tiles.indexOf(a);
      const bi = state.tiles.indexOf(b);
      const ad = Math.abs(Math.floor(ai / state.gridSize) - bombRow) + Math.abs((ai % state.gridSize) - bombCol);
      const bd = Math.abs(Math.floor(bi / state.gridSize) - bombRow) + Math.abs((bi % state.gridSize) - bombCol);
      return ad - bd;
    });
    filled.forEach((t, k) => {
      setTimeout(() => {
        const tx = (Math.random() - 0.5) * 60;
        const ty = 320 + Math.random() * 240;
        const rot = (Math.random() - 0.5) * 900;
        const sc = 0.35 + Math.random() * 0.35;
        t.el.animate([
          { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
          { transform: `translate(${tx * 0.5}px, ${ty * 0.55}px) rotate(${rot * 0.5}deg) scale(${sc * 1.15})`, opacity: 0.7, offset: 0.55 },
          { transform: `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${sc * 0.5})`, opacity: 0 }
        ], { duration: 720, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' });
      }, k * 35);
    });
    await sleep(720 + filled.length * 35 + 80);
  }

  async function revealBomb(idx){
    const t = state.tiles[idx];
    t.tier = -1;
    t.el.classList.remove('filled','just-filled','highest','is-bonus','opened','selected');
    t.giftImg.style.transition = 'none';
    t.giftImg.style.opacity = '0';
    t.giftImg.style.visibility = 'hidden';
    void t.giftImg.offsetWidth;
    t.giftImg.style.transition = '';
    const bl = t.face.querySelector('.bonus-label');
    if (bl) bl.remove();

    const bomb = document.createElement('img');
    bomb.className = 'bomb-img';
    bomb.src = APPLE_BOMB;
    bomb.alt = '';
    t.face.appendChild(bomb);
    t.el.classList.add('is-bomb');
    clearTierGlow(t.face);

    els.frame.classList.add('shaking');
    setTimeout(() => els.frame.classList.remove('shaking'), 520);
    Sound.bomb();
    haptic('heavy');

    await sleep(560);
    await bombCellsFall(idx);
    loseGame();
  }

  function loseGame(){
    state.playing = false;
    state.busy = false;
    state.selectedTile = -1;
    setTimeout(() => {
      Sound.lose();
      showResult(false, 0, state.bet);
      unlockControls();
      updateActionButton();
    }, 150);
  }

  function cashout(){
    if (!state.playing) return;
    const mult = currentMult();
    const payout = state.bet * mult;
    state.balance += payout;
    persistBalance();
    updateBalance(true);
    haptic('heavy');
    Sound.cashout();
    showResult(true, mult, payout);
    state.playing = false;
    state.busy = false;
    state.selectedTile = -1;
    unlockControls();
    updateActionButton();
  }

  function showResult(isWin, mult, amount){
    els.panel.classList.remove('win', 'lose');
    els.panel.classList.add(isWin ? 'win' : 'lose');
    els.panelTitle.textContent = isWin ? 'CASHED OUT' : 'BOOM';
    els.panelMult.textContent = isWin ? fmtMult(mult) : 'x0.00';
    els.panelAmt.textContent = isWin ? fmtMoney(amount) : ('-' + fmtMoney(amount));
    requestAnimationFrame(() => els.panel.classList.add('show'));
  }
  function resetRound(){
    els.panel.classList.remove('show', 'win', 'lose');
    state.playing = false;
    state.busy = false;
    state.points = 0;
    state.totalMerges = 0;
    state.maxTier = -1;
    state.selectedTile = -1;
    unlockControls();
    updateMultDisplay(false);
    updateCombo(false);
    updateActionButton();
    buildGrid(true);
  }

  function unlockControls(){
    els.bet.disabled = false;
    els.allin.disabled = false;
    els.diffRow.querySelectorAll('.diff-chip').forEach(b => b.disabled = false);
    els.gsRow.querySelectorAll('.gs-chip').forEach(b => b.disabled = false);
  }
  function lockControls(){
    els.bet.disabled = true;
    els.allin.disabled = true;
    els.diffRow.querySelectorAll('.diff-chip').forEach(b => b.disabled = true);
    els.gsRow.querySelectorAll('.gs-chip').forEach(b => b.disabled = true);
  }

  function emptyCount(){ let n = 0; for (const t of state.tiles) if (t.tier === -1) n++; return n; }

  function updateActionButton(){
    if (state.playing){
      const empties = emptyCount();
      if (empties === 0){
        els.action.textContent = 'Board Full';
        els.action.disabled = true;
      } else {
        els.action.textContent = 'Open ' + Math.min(OPEN_PER_STEP, empties);
        els.action.disabled = state.busy;
      }
      els.bet.parentElement.style.display = 'none';
      els.cashout.style.display = '';
      els.cashout.disabled = state.points <= 0 || state.busy;
      const cash = state.bet * currentMult();
      els.cashout.innerHTML = 'Cashout <span class="co-amount">· ' + fmtMoney(cash) + '</span>';
    } else {
      els.action.textContent = 'Start';
      els.action.disabled = state.balance < Math.max(MIN_BET, state.bet) || state.busy;
      els.bet.parentElement.style.display = '';
      els.cashout.style.display = 'none';
    }
  }

  /* ============ HAND MODE ============ */
  function setSelection(idx){
    clearSelection();
    state.selectedTile = idx;
    if (idx >= 0) state.tiles[idx].el.classList.add('selected');
    haptic('light');
  }
  function clearSelection(){
    if (state.selectedTile >= 0){
      const prev = state.tiles[state.selectedTile];
      if (prev) prev.el.classList.remove('selected');
      state.selectedTile = -1;
    }
    state.tiles.forEach(t => t.el.classList.remove('merge-target', 'merge-hover', 'drag-source'));
  }

  async function manualMerge(srcIdx, dstIdx){
    if (state.busy || !state.playing) return;
    if (srcIdx === dstIdx) return;
    const src = state.tiles[srcIdx];
    const dst = state.tiles[dstIdx];
    if (src.tier === -1 || dst.tier === -1) return;
    if (src.tier !== dst.tier) return;
    if (src.tier >= TIERS.length - 1) return;

    state.busy = true;
    updateActionButton();
    clearSelection();

    try {
      await animateMerge(srcIdx, dstIdx, src.tier);
      recalcPoints();
      updateMultDisplay(true);

      const merges = await resolveMerges();
      if (merges > 0){
        state.totalMerges += merges;
        updateCombo(true);
        if (merges >= 2) showComboText(merges);
      }
      await flashBonusCells();
      updateMultDisplay(true);
    } finally {
      state.busy = false;
      updateActionButton();
    }
  }

  function handleHandTap(idx){
    const t = state.tiles[idx];
    if (t.tier === -1) return;

    if (state.selectedTile === idx){
      clearSelection();
      return;
    }
    if (state.selectedTile !== -1){
      const sel = state.tiles[state.selectedTile];
      if (sel.tier === t.tier && t.tier < TIERS.length - 1){
        manualMerge(state.selectedTile, idx);
        return;
      }
      setSelection(idx);
      return;
    }
    setSelection(idx);
  }

  function onTileClick(idx){
    if (suppressNextClick){
      suppressNextClick = false;
      return;
    }
    if (!state.playing || state.busy) return;
    const t = state.tiles[idx];

    if (state.handMode && t.tier !== -1){
      handleHandTap(idx);
      return;
    }
    if (state.handMode && state.selectedTile !== -1){
      clearSelection();
      return;
    }
    openStep(false);
  }

  /* ============ DRAG LOGIC ============ */
  let dragState = null;
  let suppressNextClick = false;

  els.grid.addEventListener('pointerdown', (e) => {
    if (!state.playing || state.busy) return;
    if (!state.handMode) return;
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const idx = parseInt(tile.dataset.idx, 10);
    if (isNaN(idx)) return;
    if (state.tiles[idx].tier === -1) return;
    dragState = {
      idx,
      startX: e.clientX,
      startY: e.clientY,
      dragging: false,
      ghost: null,
      rect: null
    };
  });

  document.addEventListener('pointermove', (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (!dragState.dragging && dist > 10){
      dragState.dragging = true;
      activateDrag();
    }
    if (dragState.dragging) updateDragGhost(e);
  }, { passive: true });

  document.addEventListener('pointerup', (e) => {
    if (!dragState) return;
    if (dragState.dragging){
      endDrag(e);
      suppressNextClick = true;
      setTimeout(() => { suppressNextClick = false; }, 250);
    }
    dragState = null;
  });

  document.addEventListener('pointercancel', () => {
    if (dragState){
      if (dragState.ghost) dragState.ghost.remove();
      state.tiles.forEach(t => t.el.classList.remove('merge-target', 'merge-hover', 'drag-source'));
      dragState = null;
    }
  });

  function activateDrag(){
    const t = state.tiles[dragState.idx];
    const rect = t.el.getBoundingClientRect();
    const info = TIERS[t.tier];
    const cs = getComputedStyle(t.face);

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.position = 'fixed';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.pointerEvents = 'none';
    ghost.style.zIndex = '9999';
    ghost.style.borderRadius = cs.borderTopLeftRadius;
    ghost.style.background = 'linear-gradient(180deg,#181b21 0%,#0f1115 100%)';
    ghost.style.boxShadow = `0 0 26px ${hexA(info.color, 0.7)}, inset 0 0 0 2px ${info.color}`;
    ghost.style.display = 'flex';
    ghost.style.alignItems = 'center';
    ghost.style.justifyContent = 'center';
    ghost.style.opacity = '0.92';
    ghost.style.transform = 'scale(1.08)';

    const img = document.createElement('img');
    img.src = info.url;
    img.style.width = info.scale + '%';
    img.style.height = info.scale + '%';
    img.style.objectFit = 'contain';
    img.style.pointerEvents = 'none';
    ghost.appendChild(img);

    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    dragState.rect = rect;

    t.el.classList.add('drag-source');

    state.tiles.forEach((other, j) => {
      if (j === dragState.idx) return;
      if (other.tier === t.tier && other.tier < TIERS.length - 1){
        other.el.classList.add('merge-target');
      }
    });

    haptic('light');
  }

  function updateDragGhost(e){
    if (!dragState || !dragState.ghost) return;
    const rect = dragState.rect;
    dragState.ghost.style.left = (e.clientX - rect.width / 2) + 'px';
    dragState.ghost.style.top = (e.clientY - rect.height / 2) + 'px';

    state.tiles.forEach((other, j) => {
      if (j === dragState.idx) return;
      if (!other.el.classList.contains('merge-target')) return;
      const r = other.el.getBoundingClientRect();
      const inBounds = e.clientX >= r.left && e.clientX <= r.right &&
                       e.clientY >= r.top && e.clientY <= r.bottom;
      other.el.classList.toggle('merge-hover', inBounds);
    });
  }

  function endDrag(e){
    if (!dragState) return;
    const srcIdx = dragState.idx;
    let dropIdx = -1;
    state.tiles.forEach((other, j) => {
      if (j === srcIdx) return;
      if (other.tier !== state.tiles[srcIdx].tier) return;
      const r = other.el.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right &&
          e.clientY >= r.top && e.clientY <= r.bottom){
        dropIdx = j;
      }
    });
    if (dragState.ghost) dragState.ghost.remove();
    state.tiles.forEach(t => t.el.classList.remove('merge-target', 'merge-hover', 'drag-source'));
    if (dropIdx !== -1) manualMerge(srcIdx, dropIdx);
  }

  /* ============ OPEN STEP ============ */
  async function openStep(isFirstOpen){
    if (!state.playing || state.busy) return;
    const empties = [];
    state.tiles.forEach((t, i) => { if (t.tier === -1) empties.push(i); });
    if (!empties.length) return;

    state.busy = true;
    clearSelection();
    updateActionButton();

    try {
      const count = isFirstOpen
        ? Math.max(1, empties.length - 3)
        : Math.min(OPEN_PER_STEP, empties.length);
      shuffle(empties);
      const toFill = empties.slice(0, count);

      let bombIdx = -1;
      if (!isFirstOpen && Math.random() < DIFFS[state.difficulty].bomb){
        bombIdx = toFill[Math.floor(Math.random() * toFill.length)];
      }

      for (const idx of toFill){
        if (!state.playing) return;
        if (idx === bombIdx){
          await revealBomb(idx);
          return;
        }
        if (bonusCount() < MAX_BONUS && Math.random() < BONUS_CHANCE){
          fillBonus(idx);
        } else {
          fillFresh(idx, rollTier());
          Sound.place();
          haptic('light');
        }
        await sleep(80);
      }

      const merges = await resolveMerges();
      if (merges > 0){
        state.totalMerges += merges;
        updateCombo(true);
        if (merges >= 2) showComboText(merges);
      }

      await flashBonusCells();
      updateMultDisplay(true);
    } catch(err){
      console.error('openStep:', err);
    } finally {
      state.busy = false;
      updateActionButton();
    }
  }

  async function startGame(){
    if (state.busy) return;
    const bet = Math.max(MIN_BET, Math.floor(state.bet));
    if (bet > state.balance){ showToast('Insufficient balance'); haptic('light'); return; }

    state.balance -= bet;
    state.bet = bet;
    persistBalance();
    updateBalance(true);

    state.playing = true;
    state.busy = true;
    state.points = 0;
    state.totalMerges = 0;
    state.maxTier = -1;
    state.selectedTile = -1;

    state.tiles.forEach((t, i) => {
      clearCell(i);
      t.el.classList.add('opened');
    });

    lockControls();
    updateMultDisplay(false);
    updateCombo(false);
    updateActionButton();
    Sound.start();
    haptic('medium');

    await sleep(220);
    state.busy = false;
    await openStep(true);
  }

  function clampBet(){
    let v = parseInt(els.bet.value.replace(/[^\d]/g, ''), 10);
    if (!Number.isFinite(v) || v < MIN_BET) v = MIN_BET;
    if (v > Math.floor(state.balance)) v = Math.max(MIN_BET, Math.floor(state.balance));
    state.bet = v;
    els.bet.value = v;
    updateMultDisplay(false);
    updateActionButton();
  }
  els.bet.addEventListener('input', () => {
    els.bet.value = els.bet.value.replace(/[^\d]/g, '').slice(0, 9);
  });
  els.bet.addEventListener('blur', clampBet);
  els.bet.addEventListener('keydown', e => { if (e.key === 'Enter') els.bet.blur(); });

  els.allin.addEventListener('click', () => {
    if (state.playing) return;
    const amt = Math.max(MIN_BET, Math.floor(state.balance));
    if (amt < MIN_BET){ showToast('Balance too low'); return; }
    els.bet.value = amt;
    state.bet = amt;
    haptic('light');
    Sound.click();
    updateMultDisplay(false);
    updateActionButton();
  });

  function setDifficulty(key, animate){
    if (state.playing) return;
    state.difficulty = key;
    els.diffRow.querySelectorAll('.diff-chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.d === key);
    });
    if (animate){ haptic('light'); Sound.click(); }
    updateMultDisplay(false);
    updateActionButton();
  }
  els.diffRow.querySelectorAll('.diff-chip').forEach(btn => {
    const d = DIFFS[btn.dataset.d];
    btn.style.setProperty('--dc', d.color);
    btn.style.setProperty('--dc-a', hexA(d.color, .35));
    btn.addEventListener('click', () => setDifficulty(btn.dataset.d, true));
  });

  function setGridSize(n){
    if (state.playing) return;
    state.gridSize = n;
    els.gsRow.querySelectorAll('.gs-chip').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.n, 10) === n);
    });
    haptic('light'); Sound.click();
    buildGrid(true);
    updateMultDisplay(false);
    updateActionButton();
  }
  els.gsRow.querySelectorAll('.gs-chip').forEach(btn => {
    btn.addEventListener('click', () => setGridSize(parseInt(btn.dataset.n, 10)));
  });

  function applyRoundedState(){
    document.body.classList.toggle('rounded', state.roundedCorners);
    els.toggleCorners.classList.toggle('on', state.roundedCorners);
  }
  function applyHandModeState(){
    document.body.classList.toggle('hand-mode', state.handMode);
    els.toggleHandMode.classList.toggle('on', state.handMode);
    if (!state.handMode) clearSelection();
  }
  function openSettings(){ els.settingsOverlay.classList.add('open'); haptic('light'); Sound.click(); }
  function closeSettings(){ els.settingsOverlay.classList.remove('open'); haptic('light'); Sound.click(); }
  els.settingsBtn.addEventListener('click', openSettings);
  els.settingsDone.addEventListener('click', closeSettings);
  els.settingsOverlay.addEventListener('click', (e) => {
    if (e.target === els.settingsOverlay) closeSettings();
  });
  els.toggleCorners.addEventListener('click', () => {
    state.roundedCorners = !state.roundedCorners;
    persistRounded();
    applyRoundedState();
    haptic('light'); Sound.click();
  });
  els.toggleHandMode.addEventListener('click', () => {
    state.handMode = !state.handMode;
    persistHandMode();
    applyHandModeState();
    haptic('light'); Sound.click();
  });

  els.action.addEventListener('click', async () => {
    if (state.busy) return;
    if (state.playing) await openStep(false);
    else await startGame();
  });
  els.cashout.addEventListener('click', () => {
    if (state.busy || !state.playing || state.points <= 0) return;
    cashout();
  });
  els.panelBtn.addEventListener('click', () => {
    haptic('light');
    Sound.click();
    resetRound();
  });

  $('#back-btn').addEventListener('click', () => {
    haptic('light');
    Sound.click();
    try {
      if (TG?.close) TG.close();
      else history.back();
    } catch(_){}
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sizeGrid, 120);
  }, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(sizeGrid, 260));

  async function init(){
    try { await preloadAll(); } catch(e){ console.warn('preload:', e); }
    setDifficulty('medium', false);
    setGridSize(3);
    applyRoundedState();
    applyHandModeState();
    updateBalance(false);
    updateBestBadge();
    els.bet.value = state.bet;
    updateMultDisplay(false);
    updateActionButton();
    requestAnimationFrame(() => requestAnimationFrame(sizeGrid));
    els.loading.classList.add('hide');
    setTimeout(() => els.loading.remove(), 400);
  }
  init();
})();
</script>

</body>
</html>
