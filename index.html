<!DOCTYPE html>
<html lang="en" data-theme="onyx">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>dllump · mineshaft</title>
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{
    --bg-base:#0a0a0a;
    --surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.08);--surface3:rgba(255,255,255,.12);
    --primary:#5b9dff;
    --text:#f5f5f5;--text2:#9a9a9a;--text3:#5a5a5a;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
    --gold:#d4b46a;--red:#e0556b;--green:#4CC38A;
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-top:env(safe-area-inset-top,0px);
    --r-sm:14px;--r-md:16px;--r-lg:20px;--r-xl:22px;--r-pill:99px;
  }
  html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg-base);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}

  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:440px;margin:0 auto;
    position:relative;background:var(--bg-base);overflow:hidden;isolation:isolate}
  #app::before{content:'';position:absolute;inset:-40px;z-index:0;
    background:radial-gradient(ellipse at 30% 15%, rgba(91,157,255,.08), transparent 55%),
               radial-gradient(ellipse at 80% 90%, rgba(76,195,138,.05), transparent 55%);
    filter:blur(30px);pointer-events:none}
  #app::after{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(circle at 30% 20%, rgba(0,0,0,.25), rgba(0,0,0,.7) 70%);pointer-events:none}
  #app > *{position:relative;z-index:1}

  #topbar{display:flex;align-items:center;gap:8px;
    padding:calc(14px + var(--safe-top)) 12px 8px;flex-shrink:0}
  .back-btn{width:38px;height:38px;border-radius:var(--r-sm);border:.5px solid var(--border);
    background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .18s var(--ease-spring),background .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  .back-btn:active{transform:scale(.9);background:var(--surface3)}
  .back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #topbar .title{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px;min-height:20px;
    background:linear-gradient(180deg,#fff,#b8c8e0);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent}
  #topbar .title .caret{display:inline-block;width:1.5px;height:14px;background:#8fb8ff;
    margin-left:2px;vertical-align:-2px;animation:caretBlink 1s steps(1,end) infinite;border-radius:2px}
  @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .balance-pill{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:var(--r-pill);
    background:var(--surface2);border:.5px solid var(--border);flex-shrink:0;
    transition:transform .2s var(--ease-spring)}
  .balance-pill.bump{transform:scale(1.09)}
  .balance-pill img{width:18px;height:18px;display:block;object-fit:contain}
  .balance-pill span{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  #hero{position:relative;margin:4px 12px 8px;padding:10px 14px;border-radius:18px;flex-shrink:0;
    background:linear-gradient(135deg,rgba(40,50,80,.55),rgba(18,24,40,.72));
    backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(180,210,255,.16);
    box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
    display:flex;align-items:center;gap:12px}
  #pick-icon{
    width:48px;height:48px;flex-shrink:0;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);
    transition:background .4s ease,border-color .4s ease,opacity .3s ease}
  #pick-icon svg{width:32px;height:38px;display:block}
  #hero-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  #hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  #hero-name{font-size:13px;font-weight:900;letter-spacing:.3px;color:#fff;transition:color .3s ease}
  #hero-name.tier-wood{color:#c9a072}
  #hero-name.tier-stone{color:#c8c8c8}
  #hero-name.tier-iron{color:#f0f0f0}
  #hero-name.tier-gold{color:#f0d080}
  #hero-name.tier-diamond{color:#8ef0f0}
  #hero-earned{font-size:11px;font-weight:800;color:#8ef0b8;font-variant-numeric:tabular-nums;
    transition:transform .25s var(--ease-spring)}
  #hero-earned.bump{transform:scale(1.14)}
  #dura-track{position:relative;height:10px;border-radius:5px;
    background:rgba(20,10,12,.7);overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
  #dura-fill{position:absolute;left:0;top:0;bottom:0;width:100%;
    background:linear-gradient(90deg,#7a1a24,#e02838,#ff5060);
    border-radius:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
    transition:width .3s var(--ease-spring)}
  #dura-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.95);font-variant-numeric:tabular-nums;line-height:1;
    letter-spacing:.3px}

  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
    padding:0 12px;position:relative}
  #frame{
    position:relative;
    width:100%;max-width:420px;
    aspect-ratio:1 / 1.15;
    max-height:100%;
    border-radius:24px;
    background:linear-gradient(180deg,#1c2028 0%,#0f1216 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -4px 0 rgba(0,0,0,.6),
      0 10px 30px rgba(0,0,0,.55);
    overflow:hidden}
  #game-canvas{width:100%;height:100%;display:block}

  #turbo-indicator{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);
    padding:12px 22px;border-radius:16px;
    background:linear-gradient(135deg, rgba(255,157,77,.9), rgba(224,85,60,.9));
    border:2px solid rgba(255,220,150,.6);
    box-shadow:0 10px 40px rgba(255,157,77,.7), inset 0 2px 0 rgba(255,255,255,.4);
    color:#fff;font-size:16px;font-weight:900;letter-spacing:2px;
    text-transform:uppercase;pointer-events:none;z-index:8;
    opacity:0;transition:opacity .25s ease, transform .35s var(--ease-spring);
    text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #turbo-indicator.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  #streak-badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.4);
    font-size:34px;font-weight:900;letter-spacing:-1px;
    color:#fff;
    text-shadow:
      0 0 18px rgba(255,200,100,.9),
      0 0 34px rgba(255,157,77,.7),
      0 4px 12px rgba(0,0,0,.9);
    pointer-events:none;z-index:9;
    opacity:0;transition:opacity .35s ease, transform .45s var(--ease-spring);
    font-variant-numeric:tabular-nums}
  #streak-badge.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #streak-badge.fade{opacity:0;transform:translate(-50%,-70%) scale(.8)}

  #floats{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}

  .money-ball{
    position:absolute;
    width:50px;height:50px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;
    letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;
    color:#fff;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(0);
    box-shadow:
      0 6px 20px rgba(0,0,0,.7),
      0 0 24px rgba(255,255,255,.35),
      inset 0 3px 0 rgba(255,255,255,.55),
      inset 0 -4px 0 rgba(0,0,0,.45);
    animation:ballPop 1.6s cubic-bezier(.34,1.56,.64,1) forwards;
    will-change:transform,opacity;
    text-shadow:0 2px 4px rgba(0,0,0,.9);
    border:2.5px solid rgba(255,255,255,.65);
    z-index:100}
  @keyframes ballPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-45deg)}
    12%{opacity:1;transform:translate(-50%,-75%) scale(1.4) rotate(12deg)}
    22%{transform:translate(-50%,-95%) scale(1) rotate(0deg)}
    50%{transform:translate(-50%,-115%) scale(1.05)}
    80%{transform:translate(-50%,-150%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-240%) scale(.6)}}
  .money-ball.green{background:radial-gradient(circle at 35% 28%, #b8ffd0 0%, #4CC38A 45%, #1a7a52 100%)}
  .money-ball.gold{background:radial-gradient(circle at 35% 28%, #fff3c0 0%, #f5d76e 45%, #b88a20 100%)}
  .money-ball.purple{background:radial-gradient(circle at 35% 28%, #f0d8ff 0%, #b47aff 45%, #5a2ab8 100%)}
  .money-ball.cyan{background:radial-gradient(circle at 35% 28%, #e0ffff 0%, #5ce0e0 45%, #0a8080 100%)}
  .money-ball.emerald{background:radial-gradient(circle at 35% 28%, #c8ffd8 0%, #17dd62 45%, #0a8020 100%)}
  .money-ball.diamond{width:58px;height:58px;font-size:15px}
  .money-ball.emerald-lg{width:64px;height:64px;font-size:17px}

  .debris{position:absolute;pointer-events:none;z-index:3;will-change:transform,opacity}

  #status-bar{
    position:absolute;top:10px;left:10px;right:10px;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    pointer-events:none;z-index:4}
  .stat-pill{
    padding:5px 11px;border-radius:12px;
    background:rgba(10,12,20,.72);
    border:1px solid rgba(180,210,255,.14);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:10px;font-weight:900;letter-spacing:1.1px;
    text-transform:uppercase;
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:5px}
  .stat-pill .sp-label{color:rgba(200,215,235,.55)}
  .stat-pill .sp-val{color:#fff}
  .stat-pill.green .sp-val{color:#8ef0b8}
  .stat-pill.turbo{background:linear-gradient(135deg,rgba(255,157,77,.6),rgba(224,85,60,.6));
    border-color:rgba(255,220,150,.5);display:none}
  .stat-pill.turbo.on{display:flex}
  .stat-pill.turbo .sp-label,.stat-pill.turbo .sp-val{color:#fff}

  #start-hint{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-bottom:40px;gap:14px;
    pointer-events:none;z-index:5;opacity:0;transition:opacity .35s ease}
  #start-hint.show{opacity:1}
  #start-hint .sh-icon{width:72px;height:72px;display:flex;align-items:center;justify-content:center;
    animation:hintFloat 2.6s ease-in-out infinite}
  #start-hint .sh-icon svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 6px 18px rgba(91,157,255,.45))}
  @keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #start-hint .sh-text{font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    color:rgba(200,220,250,.9);text-shadow:0 2px 8px rgba(0,0,0,.95)}

  #end-hint{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
    padding:16px 24px;border-radius:18px;
    background:rgba(10,12,20,.92);
    border:1px solid rgba(180,210,255,.22);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 20px 60px rgba(0,0,0,.8);
    text-align:center;pointer-events:none;z-index:6;
    opacity:0;transition:opacity .35s ease,transform .4s var(--ease-spring)}
  #end-hint.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #end-hint .eh-title{font-size:10px;font-weight:900;letter-spacing:2.4px;text-transform:uppercase;
    color:rgba(200,215,235,.55);margin-bottom:6px}
  #end-hint .eh-amount{font-size:28px;font-weight:900;letter-spacing:-.8px;
    font-variant-numeric:tabular-nums;line-height:1}
  #end-hint.win .eh-amount{color:#8ef0b8;text-shadow:0 0 24px rgba(76,195,138,.6)}
  #end-hint.lose .eh-amount{color:#ff8a9a;text-shadow:0 0 24px rgba(224,85,107,.5)}

  #spin-overlay{
    position:absolute;inset:0;z-index:10;
    background:rgba(5,6,10,.94);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;opacity:0;pointer-events:none;
    transition:opacity .35s ease}
  #spin-overlay.show{opacity:1;pointer-events:auto}
  #spin-title{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
    color:rgba(200,215,235,.6)}
  #spin-window{
    position:relative;width:120px;height:140px;
    border-radius:22px;overflow:hidden;
    background:linear-gradient(180deg,#2a2f3a,#171b22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -3px 0 rgba(0,0,0,.5),
      0 10px 30px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.10)}
  #spin-window::before,
  #spin-window::after{
    content:'';position:absolute;left:0;right:0;height:32px;z-index:2;pointer-events:none}
  #spin-window::before{top:0;background:linear-gradient(180deg,rgba(10,12,20,.98),transparent)}
  #spin-window::after{bottom:0;background:linear-gradient(0deg,rgba(10,12,20,.98),transparent)}
  #spin-reel{
    position:absolute;left:0;top:0;right:0;
    display:flex;flex-direction:column;
    will-change:transform}
  .spin-item{
    width:120px;height:140px;flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    position:relative}
  .spin-item svg{width:64px;height:76px;display:block;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
  .spin-item .si-name{
    font-size:9px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
    opacity:.85;text-align:center;line-height:1}
  #spin-highlight{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    height:140px;z-index:1;pointer-events:none;
    border-top:2px solid rgba(140,180,255,.5);
    border-bottom:2px solid rgba(140,180,255,.5);
    box-shadow:0 0 30px rgba(91,157,255,.35) inset}
  #spin-result{
    font-size:13px;font-weight:900;letter-spacing:.5px;
    color:#fff;opacity:0;transform:translateY(6px);
    transition:opacity .35s ease,transform .4s var(--ease-spring);
    text-align:center}
  #spin-result.show{opacity:1;transform:translateY(0)}

  #history-row{flex-shrink:0;padding:0 12px;margin-top:4px;margin-bottom:4px}
  #history-strip{
    display:flex;gap:5px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    padding:4px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%)}
  #history-strip::-webkit-scrollbar{display:none}
  .history-pill{
    flex-shrink:0;padding:5px 10px;border-radius:11px;
    font-size:10.5px;font-weight:900;font-variant-numeric:tabular-nums;
    letter-spacing:-.2px;animation:pillIn .38s var(--ease-spring);
    box-shadow:0 3px 0 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1)}
  @keyframes pillIn{
    0%{opacity:0;transform:scale(.5) translateY(-6px)}
    60%{opacity:1;transform:scale(1.08) translateY(0)}
    100%{transform:scale(1)}}
  .history-empty{font-size:11px;color:var(--text3);padding:6px 2px;letter-spacing:.3px;font-weight:600}

  #controls{flex-shrink:0;padding:4px 12px calc(14px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:10px}
  .bet-row{display:flex;gap:8px}
  #bet-input{flex:1;height:54px;padding:0 18px;border-radius:var(--r-xl);
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    color:#fff;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
    outline:none;font-family:inherit;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    transition:border-color .2s ease,box-shadow .2s ease}
  #bet-input:focus{border-color:rgba(140,180,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(91,157,255,.14)}
  #bet-input:disabled{opacity:.45}
  #allin-btn{height:54px;padding:0 22px;border-radius:var(--r-xl);
    border:1px solid rgba(140,180,255,.4);
    background:linear-gradient(180deg,#6da9ff,#4a86e8);color:#fff;
    font-family:inherit;font-weight:900;font-size:12px;letter-spacing:.7px;
    cursor:pointer;flex-shrink:0;
    box-shadow:0 6px 18px rgba(91,157,255,.35),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .18s var(--ease-spring),opacity .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  #allin-btn:active{transform:scale(.95)}
  #allin-btn:disabled{opacity:.35;pointer-events:none}

  #action-btn{height:60px;border-radius:var(--r-xl);border:none;width:100%;
    font-family:inherit;font-size:15px;font-weight:900;letter-spacing:.6px;
    cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#6da9ff 0%,#4a86e8 100%);color:#fff;
    box-shadow:0 10px 28px rgba(91,157,255,.42),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .2s var(--ease-spring),box-shadow .25s,background .3s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-appearance:none;appearance:none;outline:none}
  #action-btn:active{transform:scale(.975)}
  #action-btn:disabled{opacity:.4;pointer-events:none}

  #toast{position:fixed;top:calc(14px + var(--safe-top));left:50%;
    transform:translate(-50%,-140%) scale(.86);
    z-index:9999;padding:12px 20px;border-radius:18px;font-size:12.5px;font-weight:800;
    background:linear-gradient(180deg,rgba(56,68,100,.95),rgba(22,28,46,.97));
    border:1px solid rgba(180,210,255,.24);color:#fff;
    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;pointer-events:none;max-width:90vw;text-align:center;
    transition:transform .42s var(--ease-spring),opacity .25s ease}
  #toast.show{transform:translate(-50%,0) scale(1);opacity:1}

  #tnt-flash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,220,120,.9), rgba(255,80,20,0) 60%);
    transition:opacity .15s ease}
  #tnt-flash.on{opacity:1}
</style>
</head>
<body>

<div id="app">

  <div id="topbar">
    <button class="back-btn" id="back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="title" id="topbar-title"></div>
    <div class="balance-pill" id="balance-pill">
      <img src="https://i.postimg.cc/fRj0QRKq/diamond-elegant.gif" alt="">
      <span id="balance-val">1,000</span>
    </div>
  </div>

  <div id="hero">
    <div id="pick-icon"></div>
    <div id="hero-info">
      <div id="hero-top">
        <div id="hero-name">No pickaxe</div>
        <div id="hero-earned">+0.00 ◆</div>
      </div>
      <div id="dura-track">
        <div id="dura-fill"></div>
        <div id="dura-text">— / —</div>
      </div>
    </div>
  </div>

  <div id="stage">
    <div id="frame">
      <canvas id="game-canvas"></canvas>
      <div id="floats"></div>
      <div id="tnt-flash"></div>
      <div id="turbo-indicator">⚡ TURBO ⚡</div>
      <div id="streak-badge">x2</div>
      <div id="status-bar">
        <div class="stat-pill"><span class="sp-label">Depth</span><span class="sp-val" id="sp-depth">0</span></div>
        <div class="stat-pill turbo" id="sp-turbo"><span class="sp-label">⚡ Turbo</span></div>
        <div class="stat-pill green"><span class="sp-label">Earned</span><span class="sp-val" id="sp-earned">+0.00</span></div>

    ['pointerdown','touchstart','keydown'].forEach(e => document.addEventListener(e, unlock, { once: true, passive: true }));
    function tone(freq, dur, type, vol, when, sweepTo){
      const c = ensure(); if (!c || !unlocked) return;
      const t0 = when || c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
      if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), t0 + dur);

      const c = ensure(); if (!c || !unlocked) return;

      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.6);
      const s = c.createBufferSource(); s.buffer = buf;
      const f = c.createBiquadFilter(); f.type = ftype || 'bandpass';
      f.frequency.value = ff || 1200; f.Q.value = 1.5;
      const g = c.createGain(); g.gain.value = vol == null ? .2 : vol;
      s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + .03);
    }
    return {
      unlock,
      click(){ tone(720, .035, 'sine', .09, null, 520); },
      reelTick(){ tone(1400 + Math.random()*400, .015, 'triangle', .04); },
      reelLand(i){ tone(500 + i * 110, .3, 'sine', .17, null, 900); tone(1000 + i * 200, .25, 'triangle', .08, null, 1400); },
      rock(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(160, .06, 'square', .14, t, 60);
        noise(.07, .18, t, 800, 'bandpass');
      },
      break(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(110, .18, 'square', .16, t, 45);
        noise(.2, .18, t, 900, 'bandpass');
      },
      bigBreak(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(90, .35, 'square', .22, t, 30);
        tone(150, .25, 'sawtooth', .16, t + .02, 60);
        noise(.35, .26, t, 700, 'lowpass');
      },
      crit(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(1200, .08, 'square', .15, t, 1800);
        tone(1800, .16, 'triangle', .12, t + .04, 2600);
      },
      ore(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        tone(880, .12, 'triangle', .14, t);
        tone(1320, .16, 'triangle', .12, t + .06);
      },
      bigOre(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
          tone(f, .28, 'triangle', .13, t + i * .055);
          tone(f*2, .2, 'sine', .05, t + i * .055 + .01);
        });
      },
      namek(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
          tone(f, .34, 'triangle', .14, t + i * .045);
          tone(f*2, .24, 'sine', .05, t + i * .045 + .01);

        tone(2093, .55, 'sine', .10, t + .28, 2400);
      },
      craft(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        [660, 880, 1100, 1320, 1760].forEach((f, i) => tone(f, .22, 'triangle', .12, t + i * .05));
      },
      slime(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;

      tnt(){

      },
      turbo(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;

      },
      combo(n){

      bigWin(){
        const c = ensure(); if (!c || !unlocked) return; const t = c.currentTime;
        [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i) => {
          tone(f, .3, 'triangle', .15, t + i * .05);
          tone(f*2, .22, 'sine', .06, t + i * .05 + .01);
        });
        tone(2093, .55, 'sine', .11, t + .35, 2600);
      }
    };
  })();

  const MIN_BET = 10;
  const MAP_COLS = 6;

  // === TUNED PHYSICS ===

  const PICKAXES = [
    { key:'wood',    name:'Wooden',  dur:8,  speed:1.1, power:1, color:'#a07850', highlight:'#c9a072', dark:'#6a4a28' },
    { key:'stone',   name:'Stone',   dur:14, speed:1.4, power:1, color:'#8a8a8a', highlight:'#c8c8c8', dark:'#5a5a5a' },

  const state = {

  try {

    if (b !== null) state.balance = Math.max(0, parseInt(b, 10) || 0);
  } catch(_){}
  function persistBalance(){

  const canvas        = $('#game-canvas');
  const ctx           = canvas.getContext('2d');
  const frame         = $('#frame');
  const floats        = $('#floats');
  const balancePill   = $('#balance-pill');
