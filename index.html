<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>🦆 Duck Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ease:cubic-bezier(.32,.72,.28,1);--spring:cubic-bezier(.34,1.56,.64,1);--ink:#e6e9ef;--ink-muted:#8d97a6;--ink-dim:#5a6572;--surface:#161b22;--surface-2:#1e242d;--surface-3:#262e39;--line:rgba(255,255,255,.07);--accent:#5a9dd6;--warn:#d97a7a;--good:#6bc287;--gold:#d1a85a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}

/* FIX: body is flex centered so #app is centered */
html,body{
  height:100%;overflow:hidden;
  background:#0a0e14;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
  font-size:15px;line-height:1.5;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:stretch;
  justify-content:center;
  width:100%;
}

/* FIX: background image on body directly */
body{
  background:
    radial-gradient(ellipse at 50% 30%, rgba(10,14,20,.35), rgba(5,7,10,.85)),
    url('https://i.postimg.cc/Qd5ZL2kG/2099f2dda704cb708fe20347afb964ba.jpg') center/cover no-repeat fixed,
    #0a0e14;
}

/* Themes */
body.style-midnight { background: linear-gradient(180deg,#080b10,#0e141c 55%,#080b10); }
body.style-aurora {
  background:
    radial-gradient(ellipse at 15% 10%, rgba(70,160,130,.28), transparent 60%),
    radial-gradient(ellipse at 85% 20%, rgba(120,100,200,.28), transparent 60%),
    radial-gradient(ellipse at 50% 90%, rgba(200,110,100,.22), transparent 60%),
    #0a0d12;
}
body.style-ocean {
  background:
    radial-gradient(ellipse at 25% 15%, rgba(50,150,200,.28), transparent 60%),
    radial-gradient(ellipse at 75% 70%, rgba(50,90,200,.28), transparent 60%),
    #04070d;
}
body.style-sunset {
  background:
    radial-gradient(ellipse at 30% 25%, rgba(230,120,80,.28), transparent 60%),
    radial-gradient(ellipse at 70% 65%, rgba(200,70,120,.28), transparent 60%),
    #0b0608;
}

/* FIX: #app centered via flex parent, width 100% with max cap on desktop */
#app{
  position:relative;
  display:flex;flex-direction:column;
  width:100%;
  height:100vh;height:100dvh;
  overflow:hidden;
  flex-shrink:0;
  flex-grow:1;
}
@media(min-width:720px){
  #app{max-width:500px;flex-grow:0;box-shadow:0 0 60px rgba(0,0,0,.7)}
}

#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#canvas-holder{position:absolute;inset:0;touch-action:none;cursor:grab}
#canvas-holder.dragging{cursor:grabbing}
#canvas-holder canvas{display:block;width:100%!important;height:100%!important;pointer-events:none}
.gif-emoji{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.22em;margin:0 2px;border-radius:4px;object-fit:cover}

#words-layer{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:10px 12px;padding:22% 22px 0;pointer-events:none;transition:opacity .4s var(--ease)}
.word{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-muted);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);opacity:0;transform:translateY(6px) scale(.94);transition:opacity .3s var(--ease),transform .4s var(--ease),color .3s var(--ease)}
.word.show{opacity:1;transform:translateY(0) scale(1)}
.word .word-text{position:relative;z-index:1}
.word svg.circle-overlay{position:absolute;inset:-4px -6px;width:calc(100% + 12px);height:calc(100% + 8px);pointer-events:none;overflow:visible}
.circle-path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:460;stroke-dashoffset:460;transition:stroke-dashoffset .6s var(--ease)}
.word.circled .circle-path{stroke-dashoffset:0}

#speech{position:absolute;left:50%;top:4%;width:min(92%,440px);max-height:50%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 15px 20px;border-radius:16px;background:rgba(20,25,33,.94);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:14px;line-height:1.55;word-break:break-word;opacity:0;transform:translate(-50%,12px) scale(.96);pointer-events:none;transition:opacity .32s var(--ease),transform .38s var(--ease),border-color .3s var(--ease);z-index:6;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#speech.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#speech::-webkit-scrollbar{width:0}
#speech-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#speech-avatar{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0;background:rgba(0,0,0,.35);border:1px solid var(--line)}
#speech-avatar img{width:100%;height:100%;object-fit:cover;display:block}
#speech-title{font-size:12px;font-weight:600;color:var(--ink-muted);flex:1}
#speech-body{word-break:break-word;padding-right:2px}
#speech-body .word-reveal{display:inline;opacity:0;animation:wordFadeIn .22s ease-out forwards}
@keyframes wordFadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
#speech-progress{position:absolute;bottom:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#5a9dd6,#6bc287);border-radius:0 0 16px 16px;transform-origin:left;z-index:3;pointer-events:none;opacity:.9;box-shadow:0 0 12px rgba(90,157,214,.35)}
#speech-hint{position:absolute;bottom:14px;right:12px;font-size:10.5px;color:var(--ink-dim);pointer-events:none}
#speech-close{position:absolute;top:8px;right:8px;width:24px;height:24px;border:none;background:rgba(255,255,255,.06);color:var(--ink-muted);border-radius:50%;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s var(--spring),background .15s}
#speech-close:active{transform:scale(.85);background:rgba(255,255,255,.16)}
#speech-draft{display:none;margin-top:12px;padding:10px 14px;width:100%;background:rgba(90,157,214,.1);border:1px solid rgba(90,157,214,.28);border-radius:999px;color:#8ab8e0;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--spring),background .2s var(--ease)}
#speech-draft.show{display:flex}

/* MAX THINKING OVERLAY */
#think-overlay {
  padding: 6px 0;
}
.think-loader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.think-spinner {
  width: 28px;
  height: 28px;
  border: 2.5px solid rgba(90,157,214,.2);
  border-top-color: #5a9dd6;
  border-right-color: #6bc287;
  border-radius: 50%;
  animation: thinkSpin 1s linear infinite;
}
@keyframes thinkSpin { to { transform: rotate(360deg); } }
.think-timer {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
  color: #6bc287;
  letter-spacing: .5px;
}
.think-timer .tt-label {
  font-size: 10px;
  color: var(--ink-dim);
  font-weight: 500;
  letter-spacing: .5px;
  display: block;
  text-align: right;
  margin-bottom: 1px;
}
.think-status {
  font-size: 13px;
  color: var(--ink-muted);
  margin-bottom: 10px;
  min-height: 18px;
  font-weight: 500;
  transition: color .2s;
}
.think-status .hl-word {
  color: #8ab8e0;
  font-weight: 700;
}
.think-progress-wrap {
  height: 5px;
  background: rgba(255,255,255,.06);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 14px;
}
.think-progress-fill {
  height: 100%;
  background: linear-gradient(90deg,#5a9dd6,#6bc287);
  border-radius: 999px;
  width: 0%;
  transition: width .3s linear;
  box-shadow: 0 0 8px rgba(90,157,214,.5);
}
.think-words {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 6px;
  padding: 10px 10px;
  background: rgba(0,0,0,.25);
  border-radius: 12px;
  min-height: 60px;
  max-height: 140px;
  overflow-y: auto;
  font-size: 12px;
}
.think-word {
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  font-family: var(--mono);
  font-size: 11.5px;
  opacity: 0;
  animation: thinkWordIn .3s var(--spring) forwards;
  transition: color .15s;
}
@keyframes thinkWordIn {
  from { opacity: 0; transform: scale(.7) translateY(4px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.think-word.scanned {
  background: rgba(90,157,214,.12);
  border-color: rgba(90,157,214,.3);
}
.think-word.final {
  background: rgba(107,194,135,.15);
  border-color: rgba(107,194,135,.4);
  color: #8fd1a2 !important;
}

.hl-warn{color:#d97a7a;font-weight:600}
.hl-danger{color:#e09696;font-weight:600}
.hl-action{color:#6bc287;font-weight:600}
.hl-key{color:#d1a85a;font-weight:600}
.hl-mention{color:#7ab3d9;font-weight:600;cursor:pointer}
.hl-email{color:#8ab8e0;font-weight:600}
.hl-link{color:#8ab8e0;text-decoration:underline}
.hl-step{color:#d1a85a;font-weight:600}
.hl-code{font-family:var(--mono);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:.9em}

.data-log{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.6;max-height:160px;overflow-y:auto}
.data-log .log-line{animation:logLine .25s ease-out both}
@keyframes logLine{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.data-log .log-tag{color:#5a9dd6}
.data-log .log-ok{color:#6bc287}
.data-log .log-warn{color:#d1a85a}

/* GLOBAL BUTTON PRESS */
button, .style-pill, .lang-btn, .q-option, .q-next, .tab-button, .mem-node, .chip {
  transition: transform .25s var(--spring), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
  will-change: transform;
}
.btn-pressing {
  transform: scale(0.92) !important;
  transition: transform .1s ease-out !important;
}
.btn-releasing {
  animation: btnRelease .35s var(--spring);
}
@keyframes btnRelease {
  0% { transform: scale(0.92); }
  60% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

#settings-btn{position:absolute;bottom:16px;left:16px;width:40px;height:40px;display:grid;place-items:center;font-size:17px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(20,25,33,.7);box-shadow:0 6px 20px rgba(0,0,0,.4);backdrop-filter:blur(8px);cursor:pointer;z-index:8}
#settings-btn:active{transform:scale(.92)}
#agent-badge{position:absolute;bottom:22px;left:64px;padding:5px 12px;border-radius:999px;background:rgba(20,24,32,.94);border:1px solid rgba(255,255,255,.12);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none;z-index:7;display:flex;align-items:center;gap:6px;font-family:var(--mono)}
#agent-badge.show{opacity:1;transform:translateY(0)}
#agent-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:#d97a7a;animation:agentPulse 1.6s infinite}
@keyframes agentPulse{0%,100%{opacity:1}50%{opacity:.3}}

#settings-panel{position:absolute;bottom:68px;left:12px;width:min(320px,calc(100% - 24px));max-height:calc(100% - 90px);background:rgba(22,27,36,.98);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 44px rgba(0,0,0,.7);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;transition:opacity .28s var(--ease),transform .32s var(--ease);backdrop-filter:blur(10px)}
#settings-panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#settings-panel::-webkit-scrollbar{width:0}
.settings-section{padding:14px 16px;border-bottom:1px solid var(--line)}
.settings-section:last-child{border-bottom:none}
.settings-title{font-size:10.5px;font-weight:600;color:var(--ink-muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.settings-title .think-value{color:var(--ink);font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.settings-row:last-child{margin-bottom:0}
.settings-label{font-size:13px;color:var(--ink);flex:1}
.settings-label small{display:block;font-size:11px;color:var(--ink-dim);margin-top:2px;font-weight:400}

/* FIX: slider thumb no longer clipped */
.think-slider-wrap{position:relative;padding:20px 2px 10px}
.think-slider-track{
  position:relative;
  height:14px;
  background:rgba(255,255,255,.06);
  border-radius:999px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
  /* overflow: visible so thumb isn't clipped */
}
.think-slider-fill{
  position:absolute;left:0;top:0;bottom:0;width:33%;
  border-radius:999px;
  background:linear-gradient(90deg,#6bc287 0%,#d1a85a 50%,#d97a7a 100%);
  background-size:500% 100%;background-position:0% 0%;
  transition:background-position .3s var(--ease);
  box-shadow:0 0 12px rgba(209,168,90,.35);
  /* self-rounded so no need to clip on track */
}
.think-spark{
  position:absolute;top:50%;
  width:2px;height:2px;border-radius:50%;
  background:rgba(255,255,255,.95);
  pointer-events:none;opacity:0;
  box-shadow:0 0 4px rgba(255,255,255,.8);
}
.think-slider-thumb{
  position:absolute;top:50%;left:33%;
  width:28px;height:28px;border-radius:50%;
  background:#fff;
  border:3px solid #5a9dd6;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
  transform:translate(-50%,-50%);
  cursor:grab;touch-action:none;
  transition:box-shadow .2s var(--ease),border-color .2s var(--ease);
  z-index:2;
}
.think-slider-thumb:active{cursor:grabbing;box-shadow:0 3px 14px rgba(0,0,0,.5),0 0 0 6px rgba(90,157,214,.15)}
.think-slider-labels{display:flex;justify-content:space-between;margin-top:16px;font-size:10px;color:var(--ink-dim);font-weight:500}
.think-slider-labels span.active{color:var(--ink);font-weight:600}

.style-pills-row{display:flex;gap:4px;background:rgba(255,255,255,.03);padding:3px;border-radius:999px}
.style-pill{flex:1;padding:8px 4px;font-size:10px;font-weight:500;background:transparent;color:var(--ink-dim);border:none;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px}
.style-pill.active{background:rgba(90,157,214,.25);color:var(--ink)}
.style-pill .style-dot{width:18px;height:8px;border-radius:4px}
.style-pill[data-val="default"] .style-dot{background:#0a0e14}
.style-pill[data-val="midnight"] .style-dot{background:linear-gradient(90deg,#080b10,#0e141c)}
.style-pill[data-val="aurora"] .style-dot{background:linear-gradient(90deg,#46a082,#7864c8)}
.style-pill[data-val="ocean"] .style-dot{background:linear-gradient(90deg,#3296c8,#2c5ac8)}
.style-pill[data-val="sunset"] .style-dot{background:linear-gradient(90deg,#e67850,#c84678)}

.settings-toggle{width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.1);border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .25s var(--ease)}
.settings-toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .28s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.settings-toggle.on{background:#d97a7a}
.settings-toggle.on::after{transform:translateX(18px)}

.lang-row{display:flex;gap:6px;margin-top:6px}
.lang-btn{flex:1;padding:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;color:var(--ink-muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.lang-btn.active{background:rgba(90,157,214,.25);color:var(--ink);border-color:rgba(90,157,214,.4)}

.settings-button{width:100%;padding:11px;background:rgba(90,157,214,.08);border:1px solid rgba(90,157,214,.22);border-radius:999px;color:#8ab8e0;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
#memory-count{font-size:11px;color:var(--ink-dim);padding:6px 10px;background:rgba(255,255,255,.03);border-radius:999px;margin-top:8px;text-align:center}

#dock{flex:0 0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));position:relative}
#question-panel{position:absolute;bottom:100%;left:14px;right:14px;margin-bottom:6px;background:rgba(22,27,36,.98);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 20px 44px rgba(0,0,0,.65);z-index:25;opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .3s var(--ease),transform .34s var(--ease);max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;backdrop-filter:blur(10px)}
#question-panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
#question-panel::-webkit-scrollbar{width:0}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.q-progress-track{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
.q-progress-fill{height:100%;background:linear-gradient(90deg,#5a9dd6,#6bc287);border-radius:999px;width:0%;transition:width .4s var(--ease)}
.q-count{font-size:10.5px;font-weight:600;color:var(--ink-dim);padding:2px 9px;background:rgba(255,255,255,.04);border-radius:999px;font-family:var(--mono)}
.q-close{width:24px;height:24px;border:none;border-radius:50%;background:rgba(255,255,255,.05);color:var(--ink-dim);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-question{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:10px}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-option{padding:11px 16px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px;font-family:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px}
.q-option .opt-emoji{font-size:15px;flex-shrink:0}
.q-input{width:100%;padding:11px 16px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px;font-family:inherit;outline:none;margin-bottom:8px;user-select:text;-webkit-user-select:text}
.q-input:focus{border-color:rgba(90,157,214,.6)}
.q-next{width:100%;padding:12px;background:rgba(90,157,214,.22);border:1px solid rgba(90,157,214,.4);border-radius:999px;color:#b4d4ed;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}

#input-shell{position:relative;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;border-radius:999px;background:rgba(22,27,36,.94);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .28s var(--ease)}
#input-shell:focus-within{border-color:rgba(90,157,214,.55);box-shadow:0 0 0 3px rgba(90,157,214,.1),0 14px 32px rgba(0,0,0,.55)}
#input-shell.agent-active{border-color:rgba(217,122,122,.55);box-shadow:0 0 0 3px rgba(217,122,122,.1),0 14px 32px rgba(0,0,0,.55)}
#input-shell.sent-flash{animation:inputPulse .85s var(--ease)}
@keyframes inputPulse{
  0%{box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 0 rgba(90,157,214,.9);border-color:rgba(90,157,214,.55)}
  40%{box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 10px rgba(90,157,214,.35);border-color:rgba(90,157,214,.9);background:rgba(30,40,55,.98)}
  100%{box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 24px rgba(90,157,214,0);border-color:rgba(255,255,255,.07);background:rgba(22,27,36,.94)}
}

const MENTION_RE = /^@[a-zA-Z0-9_]{3,}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const URL_RE = /^https?:\/\//i;

function classifyWord(word) {
  const raw = word; const clean = word.toLowerCase().replace(/[^a-z0-9@._-]/g, '');
  if (!clean) return { type: 'neutral', color: '#5a6572' };
  if (URL_RE.test(raw)) return { type: 'link', color: '#8ab8e0' };
  if (MENTION_RE.test(clean)) return { type: 'mention', color: '#7ab3d9' };
  if (EMAIL_RE.test(clean)) return { type: 'email', color: '#8ab8e0' };
  if (DANGER_WORDS_SET.has(clean)) return { type: 'danger', color: '#d97a7a' };
  if (THEME_WORDS_SET.has(clean)) return { type: 'theme', color: '#6bc287' };
  if (ACTION_WORDS_SET.has(clean)) return { type: 'action', color: '#8ab8e0' };
  for (const t of THEME_WORDS_SET) if (clean.length >= 4 && clean.startsWith(t) && clean.length <= t.length + 3) return { type: 'theme', color: '#6bc287' };
  for (const a of ACTION_WORDS_SET) if (clean.length >= 4 && clean.startsWith(a) && clean.length <= a.length + 3) return { type: 'action', color: '#8ab8e0' };
  return { type: 'neutral', color: '#5a6572' };
}

function resolveSmartIntent(text, level) {
  const lower = text.toLowerCase();
  const themesFound = [];
  for (const [key, words] of Object.entries(THEMES)) { for (const w of words) if (lower.includes(w)) { themesFound.push(key); break; } }
  const actionsFound = [];
  for (const [key, words] of Object.entries(ACTIONS)) { for (const w of words) if (lower.includes(w)) { actionsFound.push(key); break; } }

  if (level === 0) {
    if (themesFound.includes('doxx')) return INTENTS.doxx_threat;
    if (themesFound.includes('hacked')) return INTENTS.hacked_general;
    if (themesFound.includes('nft')) return INTENTS.nft_general;
    if (themesFound.includes('ban')) return INTENTS.ban;
    if (themesFound.includes('scam')) return INTENTS.scam_general;
    if (themesFound.includes('support')) return INTENTS.support;
    return FALLBACK;
  }

  const isPast = /\b(got|was|already|were|lost|stole|stolen|drained|happened|been|потерял|украли|уже|случилось)\b/.test(lower);
  const isProtect = /\b(protect|prevent|avoid|safety|secure|safe|защитить|обезопасить|защита)\b/.test(lower);
  const wantsDemo = actionsFound.includes('demo');
  const wantsShoot = actionsFound.includes('shoot');
  const wantsProfile = /\bshow\s+(?:@\w+|profile)/.test(lower) || /^@\w+$/.test(lower.trim()) || /покажи\s+@\w+/.test(lower);

  if (wantsShoot && settings.agentMode && (themesFound.includes('scam') || themesFound.includes('hacked') || themesFound.includes('doxx'))) return INTENTS.shoot_scammer;
  if (wantsDemo && settings.agentMode) {
    if (themesFound.includes('doxx')) return INTENTS.demo_doxx;
    if (themesFound.includes('nft')) return INTENTS.demo_nft;
    if (themesFound.includes('hacked')) return INTENTS.demo_hacked;
    if (themesFound.includes('scam')) return INTENTS.demo_scam;
    if (themesFound.includes('ban')) return INTENTS.demo_ban;
  }
  if (wantsProfile) return INTENTS.show_profile;
  if (themesFound.includes('nft') || themesFound.includes('crypto')) {
    if (actionsFound.includes('sell') || actionsFound.includes('buy')) return INTENTS.nft_trade;
    if (isProtect || actionsFound.includes('protect')) return INTENTS.nft_protect;
    if ((isPast || actionsFound.includes('lost')) && themesFound.includes('scam')) return INTENTS.nft_scam_lost;
    if (themesFound.includes('scam')) return INTENTS.nft_scam_general;
    return INTENTS.nft_general;
  }
  if (themesFound.includes('hacked')) {
    if (isPast || actionsFound.includes('lost')) return INTENTS.hacked_lost;
    if (actionsFound.includes('want') || /\b(want|wants|will|going|trying|threaten|угрожает|хочет)\b/.test(lower)) return INTENTS.hacked_threat;
    return INTENTS.hacked_general;
  }
  if (themesFound.includes('doxx')) {
    if (isPast || actionsFound.includes('lost') || /\b(leaked|exposed|posted|слили|слил)\b/.test(lower)) return INTENTS.doxx_lost;
    return INTENTS.doxx_threat;
  }
  if (themesFound.includes('ban')) return INTENTS.ban;
  if (themesFound.includes('deleted')) return INTENTS.deleted;
  if (themesFound.includes('login')) return INTENTS.login;
  if (themesFound.includes('gift')) return INTENTS.gift_scam;
  if (themesFound.includes('report')) return INTENTS.report;
  if (themesFound.includes('group')) return INTENTS.group;
  if (themesFound.includes('premium')) return INTENTS.premium;
  if (themesFound.includes('business')) return INTENTS.business;
  if (themesFound.includes('bot')) return INTENTS.bot;
  if (themesFound.includes('privacy')) return INTENTS.privacy;
  if (themesFound.includes('number')) return INTENTS.number;
  if (themesFound.includes('contacts')) return INTENTS.contacts;
  if (themesFound.includes('protect')) return INTENTS.protect_account;

    let holdTimer = null, moved = false, startX = 0, startY = 0, sBx = 0, sBy = 0, dragging = false;
    const startHold = () => { btn.classList.add('holding'); holdTimer = setTimeout(() => { btn.classList.remove('holding'); showTabMenu(tab, btn); haptic('medium'); SoundFX.tick(880, 0.06); }, 3000); };
    const cancelHold = () => { btn.classList.remove('holding'); if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); startX = e.clientX; startY = e.clientY; sBx = tab.x || 40 + i * 20; sBy = tab.y || 120 + i * 45; moved = false; dragging = true; try { btn.setPointerCapture(e.pointerId); } catch(_){} startHold(); });

  if (/\b(open|show|открой|покажи)\s+settings|настройки\b/.test(lower)) { showSpeech('<b>Opening settings...</b>', 'support', 1500, { reveal: false }); await wait(400); await agentFlyTo(settingsBtn); settingsPanel.classList.add('show'); return true; }
  const profileMatch = lower.match(/(?:show|покажи)\s+(?:the\s+)?(?:profile\s+(?:of\s+)?|профиль\s+)?(@\w{3,})/);
  if (profileMatch) { const uname = profileMatch[1]; showSpeech(settings.lang === 'ru' ? `<b>Ищу ${uname}...</b>` : `<b>Searching for ${uname}...</b>`, 'support', 1500, { reveal: false }); await wait(500); await agentFlyTo(input); const confirmMode = settings.agentMode || getThinkLevel() >= 3; showProfile(uname, { confirm: confirmMode }); return true; }
  if (/\b(protect|secure|защитить|обезопасить)\s+(?:my\s+)?(?:account|аккаунт)\b/.test(lower)) { showAgentPresentation([{ icon: '🔐', text: settings.lang === 'ru' ? 'Включить двухэтапную проверку' : 'Enable Two-Step Verification' }, { icon: '📧', text: settings.lang === 'ru' ? 'Добавить резервную почту' : 'Add recovery email' }, { icon: '🔍', text: settings.lang === 'ru' ? 'Проверить активные сессии' : 'Review Active Sessions' }, { icon: '🔒', text: settings.lang === 'ru' ? 'Номер → Никто' : 'Phone → Nobody' }, { icon: '🚫', text: settings.lang === 'ru' ? 'Не давать коды' : 'Never share codes' }]); showSpeech(getAnswer(INTENTS.protect_account), 'protect_account', 6000, { reveal: true }); return true; }
  return false;
}

/* ================================================================
   MAX LEVEL DEEP THINKING (5s min, 5min max, per-word scanning)
   ================================================================ */
async function doMaxThinking(text) {
  // Time scales with text length: 5s min, 5min (300000ms) max
  const computedThinkMs = Math.min(300000, Math.max(5000, text.length * 500));
  const startTime = performance.now();

  // Show thinking UI in speech bubble
  speechAvatarImg.src = GIFS.thinking;
  speechDraft.classList.remove('show');
  speechProgress.style.display = 'none';
  speechBody.innerHTML = `
    <div id="think-overlay">
      <div class="think-loader">
        <div class="think-spinner"></div>
        <div class="think-timer">
          <span class="tt-label">${t('timeLabel')}</span>
          <span id="think-timer-val">0.0s</span>
        </div>
      </div>
      <div class="think-status" id="think-status">${t('thinking')}…</div>
      <div class="think-progress-wrap"><div class="think-progress-fill" id="think-progress-fill"></div></div>
      <div class="think-words" id="think-words"></div>
    </div>
  `;
  speechEl.classList.add('show');
  speechEl.scrollTop = 0;

  const timerEl = document.getElementById('think-timer-val');
  const progressEl = document.getElementById('think-progress-fill');
  const statusEl = document.getElementById('think-status');
  const wordsContainer = document.getElementById('think-words');

  // Timer loop
  let rafId;
  function updateTimer() {
    const elapsed = performance.now() - startTime;
    const pct = Math.min(100, (elapsed / computedThinkMs) * 100);
    if (timerEl) timerEl.textContent = (elapsed / 1000).toFixed(1) + 's';
    if (progressEl) progressEl.style.width = pct + '%';
    if (elapsed < computedThinkMs) rafId = requestAnimationFrame(updateTimer);
  }
  updateTimer();

  // Read every word
  const words = text.split(/\s+/).filter(Boolean);
  const totalSteps = words.length + 3; // words + finalize
  const timePerStep = computedThinkMs / totalSteps;

  const wordEls = [];
  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const cls = classifyWord(word);
    const el = document.createElement('span');
    el.className = 'think-word';
    el.textContent = word;
    el.style.color = cls.color !== '#5a6572' ? cls.color : '';
    wordsContainer.appendChild(el);
    wordEls.push(el);

    // Highlight as scanning
    el.classList.add('scanned');
    if (statusEl) statusEl.innerHTML = `${t('reading')}: <span class="hl-word">"${escapeHtml(word)}"</span>`;
    SoundFX.tick(500 + (i % 12) * 40, 0.02, 0.012);
    haptic('light');

    await wait(timePerStep);
  }

  // Final scanning pass
  if (statusEl) statusEl.innerHTML = `${t('thinking')} — cross-checking ${words.length} tokens…`;
  await wait(timePerStep);

  // Mark all as final
  wordEls.forEach(el => el.classList.add('final'));
  if (statusEl) statusEl.innerHTML = `<span class="hl-word">${t('finalizing')}…</span>`;
  SoundFX.tick(880, 0.08, 0.03);
  haptic('success');
  await wait(timePerStep);

  // Fill progress
  if (progressEl) progressEl.style.width = '100%';
  if (rafId) cancelAnimationFrame(rafId);

  await wait(200);
  return computedThinkMs;
}

/* Submit */
let busy = false;
function getThinkDelay(text) { const level = getThinkLevel(); const base = [350, 700, 1400, 2400][level]; if (level === 3) return base + Math.min(1500, text.length * 20); return base + Math.min(600, text.length * 8); }
function getReadTime(intent) { const level = getThinkLevel(); const ans = getAnswer(intent); const base = Math.max(3500, Math.min(11000, 2200 + ans.length * 24)); return base * [0.7, 1, 1.3, 1.6][level]; }

async function submit() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) { shell.classList.remove('shake'); void shell.offsetWidth; shell.classList.add('shake'); return; }
  busy = true; sendBtn.disabled = true;
  input.blur(); input.value = '';

  /* Blink animation */
  shell.classList.remove('sent-flash');
  void shell.offsetWidth;
  shell.classList.add('sent-flash');

  if (settings.agentMode) { const handled = await handleAgentCommand(text); if (handled) { busy = false; sendBtn.disabled = false; return; } }

  st.mode = 'think'; st.targetDragY = 0; st.targetDragX = 0;
  hideSpeech(); readerModal.classList.remove('show');
  sendBtn.classList.add('thinking');
  if (settings.autoMemory && text.length > 8) addMemory('Asked', text.slice(0, 50));

  const rawWords = text.split(/\s+/).filter(Boolean).slice(0, 20);
  const words = rawWords.map(raw => { const cls = classifyWord(raw); return { raw, type: cls.type, color: cls.color }; });
  const level = getThinkLevel();
  const intent = resolveSmartIntent(text, level);

  /* MAX LEVEL: full deep thinking with timer */
  if (level === 3) {
    await doMaxThinking(text);
    sendBtn.classList.remove('thinking');

    /* Ask questions if needed */
    const flowKey = NEEDS_QUESTIONS[intent.id];
    if (flowKey) {
      st.mode = 'agent-idle';
      hideSpeech();
      await runQuestionFlow(QUESTION_FLOWS[flowKey]);
      /* After choices, think again briefly */
      st.mode = 'think';
      sendBtn.classList.add('thinking');
      speechAvatarImg.src = GIFS.thinking;
      speechBody.innerHTML = `<div style="text-align:center;padding:20px"><div class="think-spinner" style="margin:0 auto 12px"></div><div style="color:var(--ink-muted);font-size:12px">${settings.lang === 'ru' ? 'Обрабатываю ответы…' : 'Processing your answers…'}</div></div>`;
      speechEl.classList.add('show');
      await wait(2500);
      sendBtn.classList.remove('thinking');
    }

    /* Agent preview if demo */
    if (intent.demo && settings.agentMode) {
      st.mode = 'agent-idle';
      hideSpeech();
      await runAgentPreviewDemo(intent.demo);
    }

    st.mode = 'talk';
    await wait(300);
    const readTime = getReadTime(intent);
    showSpeech(getAnswer(intent), intent.id, readTime, { reveal: true });
    haptic('success');
    if (settings.autoMemory && intent.id !== 'fallback') addMemory('Topic', intent.id);
    await wait(readTime);
    st.mode = settings.agentMode ? 'agent-idle' : 'idle';
    busy = false; sendBtn.disabled = false;
    return;
  }

  /* Fast / Medium / High */
  const thinkDelay = getThinkDelay(text);
  let processLogHTML = '';
  if (level >= 2) {
    const logLines = [
      { tag: 'PARSE', text: `tokenizing ${text.split(/\s+/).length} words...` },
      { tag: 'MATCH', text: `themes: ${Object.keys(THEMES).filter(k => THEMES[k].some(w => text.toLowerCase().includes(w))).join(', ') || 'none'}` },
      { tag: 'ANALYZE', text: 'checking intent...' },
      { tag: 'DB', text: `matched: ${intent.id || 'fallback'}`, cls: 'log-ok' },
      { tag: 'OK', text: 'ready', cls: 'log-ok' }
    ];
    processLogHTML = `<div class="data-log">` + logLines.map((line, i) => `<div class="log-line" style="animation-delay:${i * 0.15}s"><span class="log-tag">[${line.tag}]</span> <span class="${line.cls || ''}">${line.text}</span></div>`).join('') + `</div>`;
    speechBody.innerHTML = processLogHTML;
    speechAvatarImg.src = GIFS.thinking;
    speechDraft.classList.remove('show');
    speechProgress.style.display = 'none';
    speechEl.classList.add('show');
  }

  await wait(thinkDelay);
  await showWords(words);

  if (intent.demo && settings.agentMode) { st.mode = 'agent-idle'; sendBtn.classList.remove('thinking'); clearOverlays(); hideSpeech(); await runAgentPreviewDemo(intent.demo); }

  const flowKey = NEEDS_QUESTIONS[intent.id];
  if (flowKey) { st.mode = settings.agentMode ? 'agent-idle' : 'idle'; sendBtn.classList.remove('thinking'); clearOverlays(); hideSpeech(); await runQuestionFlow(QUESTION_FLOWS[flowKey]); }

  st.mode = 'talk'; clearOverlays(); await wait(300);

  const readTime = getReadTime(intent);
  const answer = getAnswer(intent);
  let finalHTML = answer;
  if (processLogHTML && level >= 2) finalHTML = processLogHTML + '\n\n' + answer;
  showSpeech(finalHTML, intent.id, readTime, { reveal: true });
  haptic('success'); sendBtn.classList.remove('thinking');

  if (settings.autoMemory && intent.id !== 'fallback') addMemory('Topic', intent.id);
  await wait(readTime);
  st.mode = settings.agentMode ? 'agent-idle' : 'idle';
  busy = false; sendBtn.disabled = false;
}

async function waveHello() {
  if (settings.agentMode) { st.mode = 'agent-idle'; return; }
  st.mode = 'wave';
  const name = tg?.initDataUnsafe?.user?.first_name || (settings.lang === 'ru' ? 'друг' : 'friend');
  await wait(800);
  const greeting = settings.lang === 'ru' ? `<b>Привет ${name}!</b><br><br>Я твоя утка-ассистент. Спроси про скамы, взломы, NFT или что угодно про Telegram.` : `<b>Hey ${name}!</b><br><br>I'm your Telegram assistant duck. Ask me about scams, hacks, NFTs, or anything Telegram-related.`;
  showSpeech(greeting, 'support', 6500, { reveal: true });
  haptic('light');
  await wait(3000);
  if (st.mode === 'wave') st.mode = 'idle';
}

input.addEventListener('input', () => { if (busy) return; st.mode = settings.agentMode ? 'agent-idle' : 'follow'; if (!settings.agentMode) updateCaret(); dragHint.style.opacity = '0'; SoundFX.tick(470 + (input.value.length % 9) * 16, 0.025, 0.015); });
input.addEventListener('focus', () => { if (busy) return; if (!settings.agentMode) { st.mode = 'follow'; updateCaret(); } });
input.addEventListener('blur', () => { if (busy) return; if (st.mode === 'follow') st.mode = 'idle'; });
input.addEventListener('click', () => { if (busy) return; if (!settings.agentMode) { st.mode = 'follow'; updateCaret(); } });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
document.addEventListener('selectionchange', () => { if (busy) return; if (!settings.agentMode && document.activeElement === input) { st.mode = 'follow'; updateCaret(); } });
sendBtn.addEventListener('click', submit);

window.addEventListener('load', () => {
  restoreSettingsUI();
  setTimeout(() => input.focus(), 250);
  setTimeout(() => dragHint.style.opacity = '0', 6000);
  if (!settings.agentMode) setTimeout(waveHello, 500);
});
</script>
