<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  /* fallback palette — overridden by Telegram theme vars when inside TG */
  --bg:var(--tg-theme-bg-color, #ffffff);
  --bg-2:var(--tg-theme-secondary-bg-color, #f1f1f1);
  --text:var(--tg-theme-text-color, #000000);
  --hint:var(--tg-theme-hint-color, #8e8e93);
  --link:var(--tg-theme-link-color, #3390ec);
  --btn:var(--tg-theme-button-color, #3390ec);
  --btn-text:var(--tg-theme-button-text-color, #ffffff);
  --separator:rgba(60,60,67,.12);
  --danger:#ff3b30;
  --success:#34c759;
  --warning:#ff9f0a;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-scheme="dark"]{
  --separator:rgba(255,255,255,.1);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;touch-action:manipulation}

/* ---- header ---- */
#header{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 6px) 16px 6px;z-index:100;background:var(--bg);border-bottom:.5px solid var(--separator)}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.header-av{width:30px;height:30px;border-radius:50%;background:var(--bg-2);overflow:hidden;flex-shrink:0}
.header-av img{width:100%;height:100%;object-fit:cover;display:block}
.header-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.header-brand{font-size:15px;font-weight:600;letter-spacing:-.2px}
.header-right{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hint);font-weight:500}

/* ---- main ---- */
#main{position:absolute;inset:0;padding-top:calc(var(--safe-t) + 52px);padding-bottom:calc(var(--safe-b) + 50px);overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 20px;opacity:0;visibility:hidden;
  transition:opacity .18s ease,visibility .18s}
.page.active{opacity:1;visibility:visible}
.page::-webkit-scrollbar{display:none}

/* ---- tabs ---- */
#tabs{position:absolute;bottom:0;left:0;right:0;height:calc(var(--safe-b) + 50px);
  display:flex;background:var(--bg);border-top:.5px solid var(--separator);z-index:100;padding-bottom:var(--safe-b)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:0;color:var(--hint);font-family:inherit;font-size:10px;font-weight:500;cursor:pointer;
  transition:color .15s}
.tab-btn.active{color:var(--btn)}
.tab-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- list rows (Telegram style) ---- */
.list{background:var(--bg);border-radius:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:64px;cursor:pointer;position:relative}
.row:active{background:var(--bg-2)}
.row + .row::before{content:'';position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--separator)}
.av{width:44px;height:44px;border-radius:50%;background:var(--bg-2);overflow:hidden;flex-shrink:0;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--hint);
  border:2px solid var(--bg)}
.online-dot.on{background:var(--success)}
.row-body{flex:1;min-width:0}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:12px;color:var(--hint);flex-shrink:0}
.row-sub{font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-sub .handle{color:var(--hint)}
.row-action{flex-shrink:0}
.add-btn{background:transparent;border:.5px solid var(--btn);color:var(--btn);border-radius:99px;
  padding:5px 12px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}
.add-btn:active{opacity:.6}
.added-label{font-size:12px;color:var(--hint);font-weight:500}

/* ---- search ---- */
.search-wrap{position:relative;margin-bottom:8px}
.search-input{width:100%;padding:8px 12px 8px 36px;background:var(--bg-2);border:none;border-radius:10px;
  color:var(--text);font-family:inherit;font-size:16px;outline:none}
.search-input::placeholder{color:var(--hint)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  stroke:var(--hint);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;
  border:none;background:var(--hint);border-radius:50%;color:var(--bg);font-size:12px;cursor:pointer;
  display:none;align-items:center;justify-content:center}
.search-clear.show{display:flex}

.seg{display:flex;background:var(--bg-2);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:none;color:var(--hint);font-family:inherit;font-size:13px;
  font-weight:500;padding:6px;border-radius:7px;cursor:pointer;transition:all .15s}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.hint{font-size:12px;color:var(--hint);line-height:1.4;padding:8px 0;text-align:center}
.empty{padding:48px 20px;text-align:center;color:var(--hint)}
.empty svg{width:32px;height:32px;stroke:var(--hint);fill:none;stroke-width:1.5;margin-bottom:12px}

/* ---- profile ---- */
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;text-align:center}
.profile-av{width:80px;height:80px;border-radius:50%;background:var(--bg-2);overflow:hidden;margin-bottom:12px}
.profile-av img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:2px}
.profile-handle{font-size:14px;color:var(--hint);margin-bottom:8px}
.profile-bio{font-size:13px;color:var(--hint);line-height:1.4;max-width:280px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-card{background:var(--bg-2);border-radius:12px;padding:14px 8px;text-align:center}
.stat-val{font-size:17px;font-weight:600;color:var(--text);line-height:1}
.stat-label{font-size:11px;color:var(--hint);margin-top:4px}

.settings{background:var(--bg);border-radius:12px;overflow:hidden;margin-top:8px}
.setting-row{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;cursor:pointer}
.setting-row:active{background:var(--bg-2)}
.setting-row + .setting-row::before{content:'';position:absolute;top:0;left:52px;right:16px;height:.5px;background:var(--separator)}
.setting-icon{width:28px;height:28px;background:var(--bg-2);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.setting-icon svg{width:15px;height:15px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setting-body{flex:1;min-width:0}
.setting-label{font-size:15px;font-weight:500}
.setting-sub{font-size:12px;color:var(--hint);margin-top:1px}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--hint);cursor:pointer;transition:background .2s}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .slider{background:var(--btn)}
.switch input:checked + .slider::before{transform:translateX(16px)}

/* ---- Nova ---- */
.nova-card{background:var(--bg-2);border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:12px}
.nova-em{font-size:64px;line-height:1;margin-bottom:6px}
.nova-name{font-size:18px;font-weight:600;margin-bottom:2px}
.nova-meta{font-size:12px;color:var(--hint);margin-bottom:16px}
.bar-row{margin-bottom:10px;text-align:left}
.bar-head{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--hint);margin-bottom:4px}
.bar-track{height:5px;background:rgba(0,0,0,.1);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .3s ease}
.nova-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.nova-btns button{padding:10px;border-radius:10px;border:none;background:var(--bg);color:var(--text);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nova-btns button:active{opacity:.6}
.nova-btns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Pulse ---- */
.challenge{background:var(--bg-2);border-radius:14px;padding:14px;margin-bottom:12px}
.challenge-tag{font-size:11px;font-weight:600;color:var(--warning);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.challenge-title{font-size:16px;font-weight:600;margin-bottom:4px}
.challenge-sub{font-size:12px;color:var(--hint);margin-bottom:10px}
.btn-primary{width:100%;padding:11px;border-radius:10px;border:none;background:var(--btn);color:var(--btn-text);
  font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.btn-primary:active{opacity:.8}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-tile{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;
  padding:8px;cursor:pointer;position:relative;overflow:hidden}
.photo-tile:active{opacity:.8}
.photo-tile .em{flex:1;display:grid;place-items:center;font-size:28px}
.photo-tile .by{font-size:10px;color:rgba(255,255,255,.9);text-align:right;font-weight:500}
.photo-tile .votes{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;
  border-radius:99px;padding:2px 6px;font-size:10px;font-weight:600}

.anon-list{display:flex;flex-direction:column;gap:8px}
.anon-msg{background:var(--bg-2);border-radius:12px;padding:12px}
.anon-text{font-size:13px;line-height:1.4;font-style:italic;margin-bottom:8px}
.anon-from{font-size:12px;color:var(--success);font-weight:500}
.reveal-btn{width:100%;padding:8px;border-radius:8px;border:none;background:var(--bg);color:var(--link);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer}
.reveal-btn:active{opacity:.6}

/* ---- modal ---- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9000;display:none}
.modal-back.show{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9001;
  width:calc(100% - 48px);max-width:300px;background:var(--bg);border-radius:14px;padding:18px;
  display:none;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal.show{display:block}
.modal-title{font-size:16px;font-weight:600;margin-bottom:6px}
.modal-text{font-size:14px;color:var(--hint);line-height:1.4;margin-bottom:16px}
.modal-actions{display:flex;gap:8px}
.modal-actions button{flex:1;padding:10px;border-radius:9px;border:none;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.modal-cancel{background:var(--bg-2);color:var(--text)}
.modal-ok{background:var(--btn);color:var(--btn-text)}

/* ---- toast ---- */
#toast-wrap{position:fixed;top:calc(var(--safe-t) + 60px);left:50%;transform:translateX(-50%);
  z-index:10000;display:flex;flex-direction:column;gap:6px;width:calc(100% - 32px);max-width:360px;
  pointer-events:none;align-items:center}
.toast{padding:10px 16px;border-radius:10px;background:rgba(28,28,30,.92);color:#fff;
  font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:rgba(52,199,89,.95)}
.toast.error{background:rgba(255,59,48,.95)}
.toast svg{width:14px;height:14px;flex-shrink:0;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

</div>

<div id="toast-wrap"></div>
<div class="modal-back" id="modal-back"></div>
<div class="modal" id="modal"></div>

<script>
(function(){
'use strict';

/* ---------- Telegram setup ---------- */
const tg = window.Telegram?.WebApp;
if (tg){
  try { tg.ready(); } catch(_) {}
  try { tg.expand(); } catch(_) {}
  try {
    // apply Telegram theme vars if present
    const tp = tg.themeParams || {};
    const root = document.documentElement;
    if (tp.bg_color) root.style.setProperty('--bg', '#' + tp.bg_color);
    if (tp.secondary_bg_color) root.style.setProperty('--bg-2', '#' + tp.secondary_bg_color);
    if (tp.text_color) root.style.setProperty('--text', '#' + tp.text_color);
    if (tp.hint_color) root.style.setProperty('--hint', '#' + tp.hint_color);
    if (tp.link_color) root.style.setProperty('--link', '#' + tp.link_color);
    if (tp.button_color) root.style.setProperty('--btn', '#' + tp.button_color);
    if (tp.button_text_color) root.style.setProperty('--btn-text', '#' + tp.button_text_color);
    root.dataset.scheme = tg.colorScheme || 'light';
    // follow theme changes
    tg.onEvent && tg.onEvent('themeChanged', () => {
      const p = tg.themeParams;
      if (p.bg_color) root.style.setProperty('--bg', '#' + p.bg_color);
      if (p.secondary_bg_color) root.style.setProperty('--bg-2', '#' + p.secondary_bg_color);
      if (p.text_color) root.style.setProperty('--text', '#' + p.text_color);
      if (p.hint_color) root.style.setProperty('--hint', '#' + p.hint_color);
      root.dataset.scheme = tg.colorScheme || 'light';
    });
  } catch(_) {}
}

function haptic(t){ try { tg?.HapticFeedback?.impactOccurred(t || 'light'); } catch(_) {} }

/* ---------- SVG icons ---------- */
const ICON = {
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  people: '<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  paw: '<svg viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="9" cy="10" r="2"/><path d="M9 14a4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4z"/></svg>',
  pulse: '<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  user: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  feed: '<svg viewBox="0 0 24 24"><path d="M4 5h16l-2 4H6zM6 9v10h12V9M9 13h6"/></svg>',
  play: '<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>',
  sleep: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 2l9 4v6c0 5-3.5 9-9 10-5.5-1-9-5-9-10V6l9-4z"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  empty: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>'
};

/* ---------- state ---------- */
const STORAGE = 'orbit_v3';
const state = {
  tab: 'friends',
  filter: 'chats',
  search: '',
  friends: new Set(),
  nova: { food: 68, happy: 54, energy: 41, level: 3, xp: 340, xpMax: 500 },
  myPhoto: false,
  votes: new Set(),
  frame: 'none',
  echoTo: null,
  echoSent: [],
  echoOpened: new Set(),
  balance: 1250,
  notifications: true,
  hapticsOn: true
};

/* ---------- contact data (REALISTIC MOCK — replace with API later) ---------- */
const CONTACTS = [
  { id: 1, name: 'Alexey Petrov', username: 'alex_p', photo: 12, online: true, msgs: 342, prev: 'check this out', last: 2*60*1000, bio: 'coding, coffee, chaos' },
  { id: 2, name: 'Maria Sokolova', username: 'masha_s', photo: 45, online: true, msgs: 128, prev: 'see u at 8', last: 15*60*1000, bio: 'design & cats' },
  { id: 3, name: 'Dmitry Vlasov', username: 'dmitry_v', photo: 33, online: false, msgs: 87, prev: 'ok, going', last: 2*60*60*1000, bio: 'music producer' },
  { id: 4, name: 'Anna Kim', username: 'anna_kim', photo: 5, online: true, msgs: 456, prev: 'sending now', last: 30*60*1000, bio: 'photographer' },
  { id: 5, name: 'Timur Aliyev', username: 'timur', photo: 15, online: false, msgs: 23, prev: 'thumbs up', last: 5*60*60*1000, bio: 'product manager' },
  { id: 6, name: 'Sofia Ivanova', username: 'sofia_iv', photo: 20, online: true, msgs: 234, prev: 'that meme tho', last: 5*60*1000, bio: 'books & memes' },
  { id: 7, name: 'Nikita Orlov', username: 'nick_o', photo: 51, online: false, msgs: 0, prev: '', last: 0, bio: 'traveler' },
  { id: 8, name: 'Lisa Smirnova', username: 'lisa_sm', photo: 24, online: true, msgs: 67, prev: 'happy bday', last: 45*60*1000, bio: 'art student' },
  { id: 9, name: 'Artem Volkov', username: 'artem_v', photo: 40, online: false, msgs: 12, prev: 'later', last: 24*60*60*1000, bio: 'gym rat' },
  { id: 10, name: 'Daria Petrova', username: 'daria_', photo: 26, online: true, msgs: 891, prev: 'yo where u at', last: 60*1000, bio: 'food blogger' },
  { id: 11, name: 'Maxim Lebedev', username: 'max_l', photo: 60, online: false, msgs: 0, prev: '', last: 0, bio: 'developer' },
  { id: 12, name: 'Katya Morozova', username: 'katya_m', photo: 9, online: true, msgs: 45, prev: 'cool cool', last: 3*60*60*1000, bio: 'illustrator' },
  { id: 13, name: 'Ivan Fedorov', username: 'ivan_f', photo: 22, online: false, msgs: 34, prev: 'on my way', last: 20*60*1000, bio: 'cyclist' },
  { id: 14, name: 'Olya Kozlova', username: 'olya_k', photo: 18, online: true, msgs: 234, prev: 'yaaas', last: 8*60*1000, bio: 'dance & wine' },
  { id: 15, name: 'Pavel Novikov', username: 'pavel_n', photo: 7, online: false, msgs: 0, prev: '', last: 0, bio: 'sports fan' },
  { id: 16, name: 'Nastya Belova', username: 'nastya_b', photo: 28, online: true, msgs: 156, prev: 'haha nice', last: 12*60*1000, bio: 'travel & coffee' }
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const avatarUrl = p => `https://i.pravatar.cc/150?img=${p}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = ts => {
  if (!ts) return '';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
};
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---------- persist ---------- */
function save(){
  try { localStorage.setItem(STORAGE, JSON.stringify({
    friends: [...state.friends], nova: state.nova, myPhoto: state.myPhoto,
    votes: [...state.votes], echoSent: state.echoSent, echoOpened: [...state.echoOpened],
    balance: state.balance, notifications: state.notifications, hapticsOn: state.hapticsOn
  })); } catch(_) {}
}
function load(){
  try { const r = localStorage.getItem(STORAGE); if (!r) return;
    const d = JSON.parse(r);
    if (d.friends) state.friends = new Set(d.friends);
    if (d.nova) state.nova = { ...state.nova, ...d.nova };
    if (d.myPhoto) state.myPhoto = d.myPhoto;
    if (d.votes) state.votes = new Set(d.votes);
    if (d.echoSent) state.echoSent = d.echoSent;
    if (d.echoOpened) state.echoOpened = new Set(d.echoOpened);
    if (typeof d.balance === 'number') state.balance = d.balance;
    if (typeof d.notifications === 'boolean') state.notifications = d.notifications;
    if (typeof d.hapticsOn === 'boolean') state.hapticsOn = d.hapticsOn;
  } catch(_) {}
}

/* ---------- toast ---------- */
function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type === 'success' ? ICON.check : type === 'error' ? ICON.x : ICON.bell) + `<span>${esc(text)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 200); }, 2200);
  haptic('light');
}

/* ---------- modal ---------- */
function showModal(title, text, okText, onOk){
  const back = $('#modal-back'), modal = $('#modal');
  modal.innerHTML = `
    <div class="modal-title">${esc(title)}</div>
    <div class="modal-text">${text}</div>
    <div class="modal-actions">
      <button class="modal-cancel" id="mc">Cancel</button>
      <button class="modal-ok" id="mo">${esc(okText || 'OK')}</button>
    </div>`;
  back.classList.add('show'); modal.classList.add('show');
  $('#mc').onclick = hideModal;
  $('#mo').onclick = () => { hideModal(); onOk && onOk(); };
  haptic('medium');
}
function hideModal(){ $('#modal-back').classList.remove('show'); $('#modal').classList.remove('show'); }

/* ---------- header ---------- */
function renderHeader(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? ((u.first_name || '') + (u.last_name ? ' ' + u.last_name : '')).trim() : 'You';
  const photo = u?.photo_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=3390ec&textColor=ffffff`;
  $('#header').innerHTML = `
    <div class="header-left">
      <div class="header-av"><img src="${esc(photo)}" alt=""></div>
      <div class="header-name">${esc(name)}</div>
    </div>
    <div class="header-brand">Orbit</div>
    <div class="header-right">${state.balance.toLocaleString()} 💎</div>`;
}

/* ---------- tabs ---------- */
const TABS = [
  { id: 'friends', label: 'Friends', icon: 'people' },
  { id: 'nova',    label: 'Nova',    icon: 'paw' },
  { id: 'pulse',   label: 'Pulse',   icon: 'pulse' },
  { id: 'profile', label: 'Profile', icon: 'user' }
];
function renderTabs(){
  const nav = $('#tabs');
  nav.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn'; b.dataset.tab = t.id;
    b.innerHTML = `${ICON[t.icon]}<span>${t.label}</span>`;
    b.addEventListener('click', () => switchTab(t.id));
    nav.appendChild(b);
  });
}
function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');
  $('#page-' + state.tab)?.classList.remove('active');
  state.tab = tab;
  $('#page-' + tab).classList.add('active');
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'friends') renderFriends();
  if (tab === 'nova') renderNova();
  if (tab === 'pulse') renderPulse();
  if (tab === 'profile') renderProfile();
}

/* ================= FRIENDS ================= */
function renderFriends(){
  const page = $('#page-friends');
  const chatted = CONTACTS.filter(c => c.msgs > 0).length;

  page.innerHTML = `
    <div class="search-wrap">
      ${ICON.search}
      <input class="search-input" id="search" placeholder="Search by name or @username" value="${esc(state.search)}">
      <button class="search-clear ${state.search ? 'show' : ''}" id="clear">✕</button>
    </div>

    <div class="seg">
      <button class="${state.filter === 'chats' ? 'on' : ''}" data-f="chats">💬 Chats (${chatted})</button>
      <button class="${state.filter === 'all' ? 'on' : ''}" data-f="all">👥 All contacts</button>
    </div>

    <div class="list" id="list"></div>
    <div class="hint">Search checks all contacts while typing.</div>`;

  renderList();

  $$('.seg button').forEach(b => b.addEventListener('click', () => {
    state.filter = b.dataset.f; haptic('light'); renderFriends();
  }));
  $('#search')?.addEventListener('input', e => {
    state.search = e.target.value;
    $('#clear').classList.toggle('show', !!state.search);
    renderList();
  });
  $('#clear')?.addEventListener('click', () => {
    state.search = ''; $('#search').value = '';
    $('#clear').classList.remove('show'); renderList();
  });
}

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  if (q){
    const qu = q.startsWith('@') ? q.slice(1) : q;
    return CONTACTS.filter(c => c.name.toLowerCase().includes(q) || c.username.toLowerCase().includes(qu));
  }
  return CONTACTS.filter(c => state.filter === 'chats' ? c.msgs > 0 : true);
}

function renderList(){
  const list = $('#list');
  const visible = getFiltered();
  if (!visible.length){
    list.innerHTML = `<div class="empty">${ICON.empty}<p>No contacts found</p></div>`;
    return;
  }
  list.innerHTML = visible.map(c => {
    const added = state.friends.has(c.id);
    const sub = c.msgs > 0 ? esc(c.prev || '') : `<span class="handle">@${esc(c.username)}</span> · ${esc(c.bio)}`;
    return `
      <div class="row" data-id="${c.id}">
        <div class="av">
          <img src="${avatarUrl(c.photo)}" alt="">
          <span class="online-dot ${c.online ? 'on' : ''}"></span>
        </div>
        <div class="row-body">
          <div class="row-top">
            <span class="row-name">${esc(c.name)}</span>
            <span class="row-time">${timeAgo(c.last)}</span>
          </div>
          <div class="row-sub">${sub}</div>
        </div>
        <div class="row-action">
          ${added ? `<span class="added-label">Added</span>` : `<button class="add-btn" data-add="${c.id}">Add</button>`}
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); addFriend(+b.dataset.add);
  }));
}

function addFriend(id){
  if (state.friends.has(id)) return;
  state.friends.add(id); save(); haptic('medium');
  toast('Added to Orbit', 'success'); renderFriends();
}

/* ================= NOVA ================= */
function renderNova(){
  const n = state.nova;
  const pct = Math.min(100, (n.xp / n.xpMax) * 100);
  $('#page-nova').innerHTML = `
    <div class="nova-card">
      <div class="nova-em">🦊</div>
      <div class="nova-name">Nova</div>
      <div class="nova-meta">Level ${n.level} · ${state.friends.size} friends caring</div>
      <div class="bar-row">
        <div class="bar-head"><span>Food</span><span>${n.food}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${n.food}%;background:#34c759"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-head"><span>Mood</span><span>${n.happy}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${n.happy}%;background:#ff9f0a"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-head"><span>Energy</span><span>${n.energy}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${n.energy}%;background:#3390ec"></div></div>
      </div>
      <div class="nova-btns">
        <button data-care="feed">${ICON.feed}<span>Feed</span></button>
        <button data-care="play">${ICON.play}<span>Play</span></button>
        <button data-care="sleep">${ICON.sleep}<span>Sleep</span></button>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-head"><span>Level progress</span><span>${n.xp}/${n.xpMax}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#3390ec"></div></div>
    </div>`;
  $$('[data-care]').forEach(b => b.addEventListener('click', () => care(b.dataset.care)));
}

function care(kind){
  const n = state.nova;
  if (kind === 'feed'){ n.food = clamp(n.food + 18, 0, 100); n.energy = clamp(n.energy - 5, 0, 100); n.xp += 15; }
  if (kind === 'play'){ n.happy = clamp(n.happy + 16, 0, 100); n.energy = clamp(n.energy - 12, 0, 100); n.xp += 20; }
  if (kind === 'sleep'){ n.energy = clamp(n.energy + 22, 0, 100); n.food = clamp(n.food - 4, 0, 100); n.xp += 10; }
  if (n.xp >= n.xpMax){ n.level++; n.xp = 0; n.xpMax = Math.round(n.xpMax * 1.2); toast('Nova leveled up', 'success'); }
  else haptic('light');
  save(); renderNova();
}

/* ================= PULSE ================= */
function renderPulse(){
  const friends = [...state.friends].map(id => CONTACTS.find(c => c.id === id)).filter(Boolean);
  const chips = friends.length
    ? friends.map(c => `<button class="add-btn" data-echo="${c.id}" style="margin-right:6px">${esc(c.name.split(' ')[0])}</button>`).join('')
    : `<div class="hint">Add friends first to send anonymous messages.</div>`;

  const inbox = [
    { id: 1, text: 'You are building something cool, keep going.', from: 'Maria' },
    { id: 2, text: 'Stop coding at 3am and sleep.', from: 'Alexey' }
  ].map(m => {
    const opened = state.echoOpened.has(m.id);
    return `<div class="anon-msg">
      <div class="anon-text">"${esc(m.text)}"</div>
      ${opened ? `<div class="anon-from">— ${esc(m.from)}</div>` : `<button class="reveal-btn" data-reveal="${m.id}">Reveal author · 50 💎</button>`}
    </div>`;
  }).join('');

  $('#page-pulse').innerHTML = `
    <div class="challenge">
      <div class="challenge-tag">🔥 Daily challenge</div>
      <div class="challenge-title">"My desk setup"</div>
      <div class="challenge-sub">Ends in 6h · ${state.myPhoto ? 'You joined' : 'Join now'}</div>
      <button class="btn-primary" id="join">${state.myPhoto ? "You're in" : 'Join challenge'}</button>
    </div>

    <div class="challenge">
      <div class="challenge-tag">Anonymous</div>
      <div style="margin-bottom:8px">${chips}</div>
      <textarea id="echo-text" placeholder="Write something honest..." style="width:100%;min-height:60px;padding:8px;border-radius:8px;border:1px solid var(--separator);background:var(--bg-2);color:var(--text);font-family:inherit;font-size:13px;outline:none;resize:none"></textarea>
      <button class="btn-primary" id="echo-send" style="margin-top:8px">Send anonymously</button>
    </div>

    <div class="anon-list">${inbox}</div>`;

  $('#join')?.addEventListener('click', () => {
    if (state.myPhoto) return toast('Already joined', 'info');
    state.myPhoto = true; save(); haptic('heavy'); toast('Joined challenge', 'success'); renderPulse();
  });
  $$('[data-echo]').forEach(b => b.addEventListener('click', () => {
    state.echoTo = +b.dataset.echo; haptic('light');
    toast('Friend selected', 'info');
  }));
  $$('[data-reveal]').forEach(b => b.addEventListener('click', () => {
    if (state.balance < 50) return toast('Not enough diamonds', 'error');
    state.balance -= 50; state.echoOpened.add(+b.dataset.reveal); save();
    haptic('heavy'); toast('Author revealed', 'success'); renderHeader(); renderPulse();
  }));
  $('#echo-send')?.addEventListener('click', () => {
    const t = $('#echo-text').value.trim();
    if (!state.echoTo) return toast('Pick a friend', 'info');
    if (t.length < 2) return toast('Write something', 'info');
    state.echoSent.unshift({ to: 'friend', text: t }); save(); haptic('heavy');
    toast('Sent anonymously', 'success'); renderPulse();
  });
}

/* ================= PROFILE ================= */
function renderProfile(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? ((u.first_name || '') + (u.last_name ? ' ' + u.last_name : '')).trim() : 'You';
  const handle = u?.username ? '@' + u.username : 'no username';
  const photo = u?.photo_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=3390ec&textColor=ffffff`;

  $('#page-profile').innerHTML = `
    <div class="profile-hero">
      <div class="profile-av"><img src="${esc(photo)}" alt=""></div>
      <div class="profile-name">${esc(name)}</div>
      <div class="profile-handle">${esc(handle)}</div>
      <div class="profile-bio">Building Orbit. Add friends, raise Nova, send anonymous messages.</div>
    </div>

    <div class="profile-stats">
      <div class="stat-card"><div class="stat-val">${state.friends.size}</div><div class="stat-label">Friends</div></div>
      <div class="stat-card"><div class="stat-val">${state.nova.level}</div><div class="stat-label">Nova</div></div>
      <div class="stat-card"><div class="stat-val">${state.balance.toLocaleString()}</div><div class="stat-label">Diamonds</div></div>
    </div>

    <div class="settings">
      <div class="setting-row">
        <div class="setting-icon">${ICON.bell}</div>
        <div class="setting-body"><div class="setting-label">Notifications</div><div class="setting-sub">Updates from friends</div></div>
        <label class="switch"><input type="checkbox" id="notif" ${state.notifications ? 'checked' : ''}><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-icon">${ICON.paw}</div>
        <div class="setting-body"><div class="setting-label">Haptics</div><div class="setting-sub">Vibrate on actions</div></div>
        <label class="switch"><input type="checkbox" id="hap" ${state.hapticsOn ? 'checked' : ''}><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-icon">${ICON.moon}</div>
        <div class="setting-body"><div class="setting-label">Theme</div><div class="setting-sub">Follows Telegram</div></div>
        <span style="font-size:13px;color:var(--hint)">Auto</span>
      </div>
      <div class="setting-row">
        <div class="setting-icon">${ICON.shield}</div>
        <div class="setting-body"><div class="setting-label">Privacy</div><div class="setting-sub">Who can message anonymously</div></div>
        <span style="font-size:13px;color:var(--hint)">Friends</span>
      </div>
    </div>

    <div style="padding:20px 0;text-align:center;font-size:11px;color:var(--hint)">Orbit · v1.0</div>`;

  $('#notif')?.addEventListener('change', e => { state.notifications = e.target.checked; save(); });
  $('#hap')?.addEventListener('change', e => { state.hapticsOn = e.target.checked; save(); });
}

/* ================= INIT ================= */
function init(){
  load();
  renderHeader();
  renderTabs();
  switchTab('friends');
  document.addEventListener('click', e => { if (e.target.id === 'modal-back') hideModal(); });
}
init();

})();
</script>
</body>
</html>
