<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dlballs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#050506;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#dl{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#08080c 0%,#04040a 100%)}
#dl-canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.dl-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;z-index:10;display:flex;align-items:center;gap:6px;pointer-events:none}
.dl-pill{display:flex;align-items:center;gap:5px;height:30px;padding:0 12px;background:linear-gradient(135deg,rgba(22,22,30,.92),rgba(12,12,18,.88));border:1px solid rgba(255,255,255,.10);border-radius:15px;font-size:11px;font-weight:600;pointer-events:auto;flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.dl-pill .lbl{color:rgba(255,255,255,.42);font-size:9px;letter-spacing:1px;font-weight:800}
.dl-pill .val{color:#fff;font-variant-numeric:tabular-nums;font-weight:800}
.dl-pill.pot{border-color:rgba(255,220,80,.35)}
.dl-pill.pot .val{color:#ffdd44;text-shadow:0 0 12px rgba(255,220,80,.55)}
.dl-pill.map{border-color:rgba(120,200,255,.32)}
.dl-pill.map .val{color:#7fc8ff;font-size:10px}
.dl-pill.bal-flash{animation:dlBalFlash .55s ease-out}
@keyframes dlBalFlash{0%{box-shadow:0 4px 20px rgba(0,0,0,.55)}40%{box-shadow:0 4px 20px rgba(0,0,0,.55),0 0 30px rgba(255,220,80,.8)}100%{box-shadow:0 4px 20px rgba(0,0,0,.55)}}
.diamond-mini{width:14px;height:14px;object-fit:contain;flex-shrink:0}
.dl-close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(22,22,30,.92),rgba(12,12,18,.88));color:rgba(255,255,255,.85);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:auto;flex-shrink:0}
.dl-close:active{transform:scale(.88)}
.dl-ticker{position:absolute;top:calc(env(safe-area-inset-top,0px) + 48px);left:10px;right:10px;z-index:9;display:flex;gap:5px;overflow:hidden;pointer-events:none;height:22px;align-items:center;mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
.dl-ticker .chip{flex-shrink:0;background:linear-gradient(135deg,rgba(20,20,28,.92),rgba(10,10,16,.88));border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:3px 10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap;display:flex;align-items:center;gap:5px}
.dl-ticker .chip .amt{color:#8fe5b0;font-weight:900}
.dl-ticker .chip img{width:11px;height:11px}
.dl-mapbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);left:8px;right:8px;z-index:11;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.dl-mapbar button{pointer-events:auto;height:26px;padding:0 11px;border-radius:9px;background:linear-gradient(135deg,rgba(16,16,24,.90),rgba(8,8,14,.86));border:1px solid rgba(255,255,255,.10);color:rgba(255,255,255,.62);font-size:10px;font-weight:800;cursor:pointer;font-family:inherit}
.dl-mapbar button:active{transform:scale(.93)}
.dl-mapbar button.on{background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.12));color:#fff;border-color:rgba(255,255,255,.42);box-shadow:0 0 20px rgba(255,255,255,.28)}
.dl-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;right:14px;z-index:20;display:flex;gap:10px}
.dl-btn{position:relative;flex:1;height:48px;border-radius:15px;border:none;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dl-btn:active{transform:scale(.96)}
.dl-btn:disabled{opacity:.32;pointer-events:none}
.dl-btn-buy{background:linear-gradient(135deg,rgba(28,28,38,.95),rgba(14,14,22,.92));color:#fff;border:1px solid rgba(255,255,255,.11)}
.dl-btn-launch{background:linear-gradient(135deg,#ffffff 0%,#e2e2ea 55%,#c4c4d0 100%);color:#0a0a10;box-shadow:0 8px 28px rgba(255,255,255,.28)}
.dl-modal{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}
.dl-modal.show{display:flex}
.dl-sheet{width:100%;max-width:440px;background:linear-gradient(180deg,#13131a 0%,#0a0a10 100%);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 18px);border-top:1px solid rgba(255,255,255,.10)}
.dl-grip{width:42px;height:4px;background:rgba(255,255,255,.18);border-radius:3px;margin:0 auto 14px}
.dl-sheet h3{font-size:15.5px;font-weight:800;color:#fff;text-align:center;margin-bottom:16px}
.dl-sheet h3 small{color:rgba(255,255,255,.4);font-size:11px;font-weight:500}
.dl-seg{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:14px}
.dl-seg button{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.dl-seg button.on{background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.10));color:#fff}
.dl-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.dl-row.inline{flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:14px}
.dl-row label{font-size:10px;color:rgba(255,255,255,.42);letter-spacing:.9px;text-transform:uppercase;font-weight:800;padding-left:2px}
.dl-row.inline label{font-size:13px;color:#fff;letter-spacing:0;text-transform:none;font-weight:700;padding:0}
.dl-row .sub{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:1px;padding-left:2px}
.dl-input{width:100%;height:46px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:800;text-align:center;outline:none;font-family:inherit}
.dl-hint{font-size:10.5px;color:rgba(255,255,255,.38);line-height:1.55;padding:0 2px}
.dl-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.dl-tier{padding:11px 2px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;cursor:pointer;font-size:10px;font-weight:800;text-align:center;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.dl-tier .dot{width:20px;height:20px;border-radius:50%;flex-shrink:0}
.dl-tier .dot.gray{background:radial-gradient(circle at 32% 28%,#e8e8ee,#8a8a92 55%,#3a3a40)}
.dl-tier .dot.silver{background:radial-gradient(circle at 32% 28%,#fff,#d0d0dc 45%,#5a5a70)}
.dl-tier .dot.green{background:radial-gradient(circle at 32% 28%,#e0ffe8,#30c977 50%,#0a3a20)}
.dl-tier .dot.gold{background:radial-gradient(circle at 32% 28%,#fffbd0,#ffcc33 45%,#8a5a10)}
.dl-tier small{font-size:9.5px;color:rgba(255,255,255,.55);font-weight:700}
.dl-tier.on{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
.dl-switch{position:relative;width:46px;height:28px;flex-shrink:0;cursor:pointer}
.dl-switch input{opacity:0;width:0;height:0;position:absolute}
.dl-switch-slider{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:999px}
.dl-switch-slider::before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.24s}
.dl-switch input:checked + .dl-switch-slider{background:#3aa55a}
.dl-switch input:checked + .dl-switch-slider::before{transform:translateX(18px)}
.dl-actions{display:flex;gap:8px;margin-top:6px}
.dl-actions button{flex:1;height:46px;border-radius:12px;border:none;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
.dl-cancel{background:rgba(255,255,255,.07);color:rgba(255,255,255,.75)}
.dl-confirm{background:linear-gradient(135deg,#ffffff,#e2e2ea);color:#0a0a10}
.dl-result{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.86);padding:20px}
.dl-result.show{display:flex}
.dl-result-box{width:100%;max-width:360px;background:linear-gradient(180deg,#15151d 0%,#0a0a10 100%);border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:28px 22px;text-align:center}
.dl-res-tag{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2.5px;text-transform:uppercase;font-weight:800}
.dl-res-amt{font-size:48px;font-weight:900;color:#fff;margin:12px 0 4px;display:flex;align-items:center;justify-content:center;gap:10px}
.dl-res-amt img{width:34px;height:34px}
.dl-res-amt.lose{color:#7a7a82}
.dl-res-mult{font-size:24px;font-weight:900;color:#ffdd44;margin-bottom:6px}
.dl-res-mult.lose{color:#6a6a72}
.dl-res-sub{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:20px}
.dl-r{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#181820,#08080c 65%,#020205)}
.dl-r.show{display:flex}
.dl-r-title{font-size:11.5px;color:rgba(255,255,255,.7);letter-spacing:3px;text-transform:uppercase;font-weight:900;min-height:14px;text-align:center}
.dl-r-rows{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.dl-r-row{position:relative;flex-shrink:0;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(30,30,40,.9),rgba(8,8,14,.96));border:1px solid rgba(255,255,255,.08)}
.dl-r-viewport{position:absolute;inset:0;overflow:hidden}
.dl-r-ball{position:absolute;left:50%;top:50%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:-apple-system,system-ui,sans-serif;transform:translate3d(0,0,0);box-shadow:inset 0 2px 4px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,0,0,.5)}
.dl-r-ball.gray{background:radial-gradient(circle at 32% 28%,#e8e8ee,#8a8a92 55%,#3a3a40);color:#101014}
.dl-r-ball.silver{background:radial-gradient(circle at 32% 28%,#fff,#d0d0dc 45%,#5a5a70);color:#15151e}
.dl-r-ball.green{background:radial-gradient(circle at 32% 28%,#e0ffe8,#30c977 50%,#0a3a20);color:#042a18}
.dl-r-ball.gold{background:radial-gradient(circle at 32% 28%,#fffbd0,#ffcc33 45%,#8a5a10);color:#3a2000}
.dl-r-ball.winner::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid #fff;animation:dlWR 1s ease-in-out infinite}
@keyframes dlWR{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
.dl-r-pointer{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:14px;color:#fff;font-weight:900;pointer-events:none;z-index:500}
.dl-r-amount{font-size:34px;font-weight:900;color:#fff;opacity:0;transform:scale(.7);transition:.4s;min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px}
.dl-r-amount img{width:28px;height:28px}
.dl-r-amount.show{opacity:1;transform:scale(1)}
.dl-a{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
  background:radial-gradient(ellipse at 50% 40%,#1a1a22,#08080c 70%,#020205);
  padding:calc(env(safe-area-inset-top,0px) + 56px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);gap:12px}
.dl-a.show{display:flex}
.dl-a-head{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.dl-a-title{font-size:11.5px;color:rgba(255,255,255,.7);letter-spacing:3px;text-transform:uppercase;font-weight:900}
.dl-a-mode{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.06);border-radius:10px;border:1px solid rgba(255,255,255,.08);transition:opacity .2s}
.dl-a-mode.locked{opacity:.3;pointer-events:none}
.dl-a-mode button{padding:6px 14px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.55);font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
.dl-a-mode button.on{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.10));color:#fff}
.dl-a-wrap{flex:1;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;min-height:0}
.dl-a-board{position:relative;width:100%;height:340px;max-height:62vh;border-radius:22px;overflow:hidden;
  background:#0a0a12;border:2px solid rgba(255,255,255,.14);
  box-shadow:0 14px 44px rgba(0,0,0,.7)}
.dl-a-board canvas,.dl-a-board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dl-a-amount{font-size:34px;font-weight:900;color:#fff;opacity:0;transform:scale(.7);transition:.4s;min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px}
.dl-a-amount img{width:26px;height:26px}
.dl-a-amount.show{opacity:1;transform:scale(1)}
.dl-a-btn{width:100%;max-width:560px;height:52px;border:none;border-radius:15px;
  background:linear-gradient(135deg,#ffffff,#e2e2ea);color:#0a0a10;font-weight:900;font-size:15px;letter-spacing:.5px;
  cursor:pointer;font-family:inherit;transition:transform .15s}
.dl-a-btn:active{transform:scale(.97)}
.dl-a-btn:disabled{opacity:.35;pointer-events:none}
</style>
</head>

<script type="module">
import * as THREE from 'three';

let BALANCE = 5000;
try { if (window.__state?.balance) BALANCE = window.__state.balance; } catch(_){}

const DIAMOND_GIF = 'https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif';
const TRI_GIF = 'https://i.postimg.cc/QtKjfgmD/ezgif-2b4855fe8e25a8f6.gif';
const GUN_GIF = 'https://i.postimg.cc/VLzSB5tx/ezgif-81568bb4425aeea2.gif';
const MAX_BALLS = 20;

const TIER_CFG = {
  gray:{color:0x9a9aa0,metalness:0.75,roughness:0.42,emissive:0,eInt:0},
  silver:{color:0xe0e0e6,metalness:1.00,roughness:0.14,emissive:0x151520,eInt:0.35},
  green:{color:0x30c977,metalness:0.90,roughness:0.18,emissive:0x0a4a2c,eInt:0.7},
  gold:{color:0xffcc33,metalness:1.00,roughness:0.10,emissive:0x8a4a10,eInt:1.1},
};
const TIER_HEX = { gray:0x9a9aa0, silver:0xe0e0e6, green:0x30c977, gold:0xffcc33 };
const TIER_CSS = { gray:'#9a9aa0', silver:'#e0e0e6', green:'#30c977', gold:'#ffcc33' };
// Bright palette for arena segments
const ARENA_COLORS = [
  '#e63946','#f77f00','#fcbf49','#2a9d8f','#06d6a0','#118ab2','#3a86ff','#8338ec','#ff006e','#ffbe0b'
];
function tierFor(v){ return v>=1000?'gold':v>=500?'green':v>=100?'silver':'gray'; }
function ballR(v){ return Math.round((6 + Math.log10(v+1)*1.5)*10)/10; }
const SHARED_MAT = {};
for (const t in TIER_CFG){
  const c = TIER_CFG[t];
  SHARED_MAT[t] = new THREE.MeshStandardMaterial({color:c.color,metalness:c.metalness,roughness:c.roughness,emissive:c.emissive,emissiveIntensity:c.eInt});
}
const BALL_OUTLINE = new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide,transparent:true,opacity:0.55});
const MAP_OUTLINE  = new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide,transparent:true,opacity:0.4});
const ballGeoCache = new Map(), ballOutlineCache = new Map();
function getBallGeo(r){ if (ballGeoCache.has(r)) return ballGeoCache.get(r); const g = new THREE.SphereGeometry(r,20,16); ballGeoCache.set(r,g); return g; }
function getBallOutlineGeo(r){ const k = r+1; if (ballOutlineCache.has(k)) return ballOutlineCache.get(k); const g = new THREE.SphereGeometry(r+1,12,10); ballOutlineCache.set(k,g); return g; }
function makeBallMesh(value, tier){
  const r = ballR(value);
  const mesh = new THREE.Mesh(getBallGeo(r), SHARED_MAT[tier]||SHARED_MAT.gray);
  mesh.add(new THREE.Mesh(getBallOutlineGeo(r), BALL_OUTLINE));
  return mesh;
}
function roundedBoxGeo(w,h,d,r,bev=1){
  const shape = new THREE.Shape();
  const x=-w/2,y=-h/2;

  shape.lineTo(x+r,y+h); shape.quadraticCurveTo(x,y+h,x,y+h-r);
  shape.lineTo(x,y+r); shape.quadraticCurveTo(x,y,x+r,y);

  } else if (MAP.type === 'brick'){

    const brickW = 34, brickH = 20, gap = 6, rowY = -40, nBricks = 6;

function shuffleHoles(n, redMult, normalMult){
  const baseA = Math.random()*Math.PI*2;
  const redIdx = Math.floor(Math.random()*n);
  const holes = [];
  for (let i=0;i<n;i++){
    const spread = n>=3 ? (Math.PI*2/n) : Math.PI;
    const a = baseA + i*spread + (Math.random()-0.5)*0.3;
    const isRed = i===redIdx;

}

function buildPuckArena(A){
  const halfW = A.w/2, halfH = A.h/2;
  const leftX = A.cx - halfW, rightX = A.cx + halfW;
  const topY  = A.cy + halfH, botY  = A.cy - halfH;
  function seg(x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + A.wallT, A.wallT, 32), arenaMat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0);
    m.rotation.z = ang; addOutline(m,1.06); mapGroup.add(m);
    WALLS.push({x1,y1,x2,y2,thick:A.wallT/2});
  }
  seg(leftX, topY, -A.topOpeningW/2, topY); seg(A.topOpeningW/2, topY, rightX, topY);
  const bots = [...A.bottomOpenings].sort((a,b)=>a.x-b.x);
  let prevX = leftX;
  for (const o of bots){ seg(prevX, botY, A.cx + o.x - o.w/2, botY); prevX = A.cx + o.x + o.w/2; }
  seg(prevX, botY, rightX, botY);
  const yT = A.sideOpening.y + A.sideOpening.w/2, yB = A.sideOpening.y - A.sideOpening.w/2;
  if (A.sideOpening.side === 'left'){
    seg(leftX, topY, leftX, yT); seg(leftX, yB, leftX, botY); seg(rightX, topY, rightX, botY);
  } else {
    seg(rightX, topY, rightX, yT); seg(rightX, yB, rightX, botY); seg(leftX, topY, leftX, botY);
  }
  puckGroup = new THREE.Group();
  const pR = A.puck.r;
  const ringMatP = new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.9,roughness:0.15,emissive:0xa0a0b0,emissiveIntensity:0.9});
  puckGroup.add(new THREE.Mesh(new THREE.TorusGeometry(pR, 5, 14, 40), ringMatP));
  puckGroup.add(new THREE.Mesh(new THREE.TorusGeometry(pR - 5, 1.2, 8, 32), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.5})));
  const crossMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.4,depthWrite:false});
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(pR*1.75, 4, 4), crossMat));
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(4, pR*1.75, 4), crossMat));
  puckGroup.position.set(A.puck.x, A.puck.y, 0); mapGroup.add(puckGroup);
  A.puck.group = puckGroup;
}

function buildDartBox(D){
  const halfW = D.w/2, halfH = D.h/2;
  const leftX = D.cx - halfW, rightX = D.cx + halfW;
  const topY  = D.cy + halfH, botY  = D.cy - halfH;
  function seg(x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + D.wallT, D.wallT, 32), arenaMat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0);
    m.rotation.z = ang; addOutline(m,1.06); mapGroup.add(m);
    WALLS.push({x1,y1,x2,y2,thick:D.wallT/2});
  }
  seg(leftX, topY, -D.topOpeningW/2, topY); seg(D.topOpeningW/2, topY, rightX, topY);
  const bo = D.bottomOpenings[0];
  seg(leftX, botY, D.cx + bo.x - bo.w/2, botY); seg(D.cx + bo.x + bo.w/2, botY, rightX, botY);
  const sY = D.sideOpening.y, sH = D.sideOpening.h;
  const sTop = sY + sH/2, sBot = sY - sH/2;
  seg(leftX, topY, leftX, sTop); seg(leftX, sBot, leftX, botY);
  seg(rightX, topY, rightX, sTop); seg(rightX, sBot, rightX, botY);
  const R = 130;
  const layers = [
    { r: R, mat: DART_BLACK, z: -10 }, { r: R*0.94, mat: DART_RED, z: -9 },
    { r: R*0.80, mat: DART_WHITE, z: -8 }, { r: R*0.62, mat: DART_RED, z: -7 },
    { r: R*0.44, mat: DART_WHITE, z: -6 }, { r: R*0.28, mat: DART_RED, z: -5 },
    { r: R*0.12, mat: DART_WHITE, z: -4 },

  layers.forEach(L => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(L.r, 48), L.mat);
    m.position.set(D.cx, D.cy, L.z); mapGroup.add(m);

  const crossY = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 1), new THREE.MeshBasicMaterial({color: 0xff2020}));

  mapGroup.add(crossX, crossY);
  D.shootTimer = 0; D.active = null;
}

function isBallInDartBox(b){

function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, ls=dx*dx+dy*dy;
  if (ls<1e-6) return {x:ax,y:ay};
  let t = ((px-ax)*dx + (py-ay)*dy)/ls;
  t = Math.max(0,Math.min(1,t));
  return {x:ax+t*dx, y:ay+t*dy};
}
function collideSeg(b,ax,ay,bx,by,thick,rest){
  const c = closestOnSeg(b.x,b.y,ax,ay,bx,by);
  const dx = b.x-c.x, dy = b.y-c.y, d2 = dx*dx+dy*dy;
  const minD = b.r + thick;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
  b.x += nx*(minD-d); b.y += ny*(minD-d);
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){ b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny; b.squash = Math.min(1, Math.abs(vn)/620); return true; }
  return true;
}
function collideCircle(b,cx,cy,cr,rest){
  const dx = b.x-cx, dy = b.y-cy, minD = b.r+cr, d2 = dx*dx+dy*dy;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
  b.x = cx + nx*minD; b.y = cy + ny*minD;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){ b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny; b.squash = Math.min(1, Math.abs(vn)/620); return true; }
  return false;
}
function pointInTri(px,py,ax,ay,bx,by,cx,cy){
  const d1 = (px-bx)*(ay-by)-(ax-bx)*(py-by);
  const d2 = (px-cx)*(by-cy)-(bx-cx)*(py-cy);
  const d3 = (px-ax)*(cy-ay)-(cx-ax)*(py-ay);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
const REST_TRI = 0.5;
function resolveTriangle(b){
  if (!triMesh) return;
  const tipX = G.triX, tipY = MAP.triTipY;
  const blx = G.triX - MAP.triHalf, bly = MAP.triBaseY;
  const brx = G.triX + MAP.triHalf, bry = MAP.triBaseY;
  const pad = b.r + 6;
  if (b.x < Math.min(tipX,blx,brx)-pad || b.x > Math.max(tipX,blx,brx)+pad) return;
  if (b.y < Math.min(tipY,bly,bry)-pad || b.y > Math.max(tipY,bly,bry)+pad) return;
  if (pointInTri(b.x,b.y,tipX,tipY,blx,bly,brx,bry)){
    const side = (b.x-tipX) >= 0 ? 1 : -1;
    const sx = side>0 ? brx : blx, sy = side>0 ? bry : bly;
    const c = closestOnSeg(b.x,b.y,tipX,tipY,sx,sy);
    const dx = b.x-c.x, dy = b.y-c.y, dd = Math.hypot(dx,dy)||0.001;
    b.x = c.x + (dx/dd)*(b.r+3); b.y = c.y + (dy/dd)*(b.r+3);
    const vn = b.vx*(dx/dd)+b.vy*(dy/dd);
    if (vn < 0){ b.vx -= (1+REST_TRI)*vn*(dx/dd); b.vy -= (1+REST_TRI)*vn*(dy/dd); }
    b.vx += side*100; b.squash = 0.85;
    return;
  }
  const hL = collideSeg(b,tipX,tipY,blx,bly,3,REST_TRI);
  const hR = collideSeg(b,tipX,tipY,brx,bry,3,REST_TRI);
  if (hL||hR){ const side = (b.x-tipX) >= 0 ? 1 : -1; b.vx += side*80; }
}
const REST_BAR = 0.5;
function resolveBar(b,bar){
  const dy = b.y - bar.y;
  if (Math.abs(dy) > b.r+8) return;
  const dx = b.x - bar.x;
  if (Math.abs(dx) > bar.halfW + b.r) return;
  if (Math.abs(dx) < bar.halfW){
    const dir = dy >= 0 ? 1 : -1;
    b.y = bar.y + dir*(b.r+7);
    const vn = b.vy*dir;
    if (vn < 0) b.vy -= (1+REST_BAR)*vn*dir;
    else b.vy = -Math.abs(b.vy)*0.3;
    b.squash = Math.max(b.squash, 0.7);
    const vel = bar.x - bar.prevX;
    if (vel !== 0) b.vx += Math.sign(vel) * 80;
  }
}
function resolveBricks(b){
  if (!MAP.brickWall) return false;
  for (const br of MAP.brickWall.bricks){
    if (br.dead) continue;
    const dx = b.x - br.x, dy = b.y - br.y;
    const overlapX = (br.w/2 + b.r) - Math.abs(dx);
    const overlapY = (br.h/2 + b.r) - Math.abs(dy);
    if (overlapX > 0 && overlapY > 0){
      if (overlapY < overlapX){ const dir = dy > 0 ? 1 : -1; b.y = br.y + dir * (br.h/2 + b.r + 1); b.vy = 0; }
      else { const dir = dx > 0 ? 1 : -1; b.x = br.x + dir * (br.w/2 + b.r + 1); b.vx *= 0.5; }
      br.hits++; br.shake = 1.0;
      if (br.hits === 1){ br.mesh.material = BRICK_CRACKED.clone(); }
      else if (br.hits >= 2){ br.dead = true; br.mesh.visible = false; }
      b.y = MAP.brickWall.centerY + (MAP.brickWall.rows * MAP.brickWall.brickH) + 100;
      b.vy = -30; b.vx = (Math.random()-0.5)*200;
      haptic(); G.shake = Math.min(1, G.shake + 0.35);
      return true;
    }
  }
  return false;
}
function resolveDartBricks(b){
  if (!DARTBRICKS.length) return false;
  let hit = false;
  for (const br of DARTBRICKS){
    const dx = b.x - br.x, dy = b.y - br.y;
    const overlapX = (br.w/2 + b.r) - Math.abs(dx);
    const overlapY = (br.h/2 + b.r) - Math.abs(dy);
    if (overlapX > 0 && overlapY > 0){
      if (overlapY < overlapX){ const dir = dy > 0 ? 1 : -1; b.y = br.y + dir * (br.h/2 + b.r + 1); if (b.vy * dir < 0) b.vy = -b.vy * 0.55; }
      else { const dir = dx > 0 ? 1 : -1; b.x = br.x + dir * (br.w/2 + b.r + 1); b.vx = -b.vx * 0.55; }
      br.shake = 1.0; b.squash = 0.9; hit = true;
    }
  }
  return hit;
}
function collideJelly(b){
  if (!JELLY.length) return false;
  for (let i = 0; i < JELLY.length; i++){
    const j = JELLY[i];
    const curHalfH = j.halfH * (1 - j.squeeze * 0.5);
    const dx = b.x - j.x, dy = b.y - j.y;
    const overlapX = (j.halfW + b.r) - Math.abs(dx);
    const overlapY = (curHalfH + b.r) - Math.abs(dy);
    if (overlapX <= 0 || overlapY <= 0) continue;
    if (overlapY < overlapX){
      const dir = dy > 0 ? 1 : -1;
      b.y = j.y + dir * (curHalfH + b.r + 0.5);
      if (dir > 0 && b.vy < 0){
        b.vy = -b.vy * 0.92 + 30;
        b.vx += (dx / j.halfW) * 170;
        b.vx += j.tiltDir * 120;
        b.squash = Math.min(1, Math.abs(b.vy) / 500);
        j.squeeze = Math.min(0.85, j.squeeze + 0.6);
        j.squeezeVel = -j.squeeze * 9;
        haptic();
      } else b.vy = -b.vy * 0.35;
      if (dir > 0){ const desired = j.tiltDir * 70; b.vx += (desired - b.vx) * 0.06; }
    } else {
      const dir = dx > 0 ? 1 : -1;
      b.x = j.x + dir * (j.halfW + b.r + 0.5);
      b.vx = -b.vx * 0.5;
      j.squeeze = Math.min(0.6, j.squeeze + 0.28);
      j.squeezeVel = -j.squeeze * 7;
    }
    return true;
  }
  return false;
}

/* ============ HAMMER — vertical forging with stop-motion ============ */
function easeOutQuad(t){ return 1 - (1-t)*(1-t); }
function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

function updateHammer(dt){
  if (!MAP.hammer) return;
  const H = MAP.hammer;
  const big = H.big;
  big.phase += dt;
  if (big.phase >= big.cycle){
    big.phase -= big.cycle;
    big._didHitThisCycle = false;
  }
  const p = big.phase / big.cycle; // 0..1

  // Stop-motion profile: pos 0=top, 1=bottom
  let pos;
  if (p < 0.08){ pos = 0; }                                                // rest at top
  else if (p < 0.16){ const t = (p-0.08)/0.08; pos = 0.30 * easeOutQuad(t); }  // step 1
  else if (p < 0.22){ pos = 0.30; }                                        // HOLD
  else if (p < 0.30){ const t = (p-0.22)/0.08; pos = 0.30 + 0.30 * easeOutQuad(t); } // step 2
  else if (p < 0.36){ pos = 0.60; }                                        // HOLD
  else if (p < 0.44){ const t = (p-0.36)/0.08; pos = 0.60 + 0.25 * easeOutQuad(t); } // step 3
  else if (p < 0.48){ pos = 0.85; }                                        // HOLD
  else if (p < 0.54){ const t = (p-0.48)/0.06; pos = 0.85 + 0.15 * (t*t); } // SLAM
  else if (p < 0.70){ pos = 1.0; }                                         // HOLD at bottom (impact window)
  else { const t = (p-0.70)/0.30; pos = 1.0 - easeInOutQuad(t); }          // return to top

  // Map pos to head Y
  const headY = big.headTopY + (big.headBottomY - big.headTopY) * pos;

  // Detect the SLAM completing (crossing from p<0.54 to p>=0.54)
  const crossed = (big._lastPhase < 0.54) && (p >= 0.54) && (p < 0.70);
  if (crossed && !big._didHitThisCycle){
    big._didHitThisCycle = true;
    triggerHammerImpact();
  }
  big._lastPhase = p;

  // Continuously push balls in the strike zone during the impact window
  if (pos > 0.88){
    const strikeTop = headY + big.headR * 0.4;
    const strikeBot = headY - big.headR * 0.4;
    for (const b of G.active){
      if (b.dead || b.state !== 'falling') continue;
      const dx = b.x - big.baseX;
      const dy = b.y - headY;
      const dd = Math.hypot(dx, dy);
      const minD = b.r + big.headR;
      if (dd < minD && dd > 0.001){
        const nx = dx/dd, ny = dy/dd;
        b.x = big.baseX + nx * minD;
        b.y = headY + ny * minD;
        b.vx += nx * 120;
        b.vy = Math.min(b.vy, -60) + ny * 60;  // bounce up
        b.squash = 1;
      }
    }
  }

  if (big.mesh) big.mesh.position.y = headY;

  // Small hammers on marked balls
  H.cooldown -= dt;
  for (let i = H.smalls.length - 1; i >= 0; i--){
    const s = H.smalls[i];
    s.t += dt;
    const ball = s.ball;
    if (!ball || ball.dead){
      if (s.mesh) mapGroup.remove(s.mesh);
      if (s.markSprite) mapGroup.remove(s.markSprite);
      H.smalls.splice(i, 1);
      continue;
    }
    if (s.state === 'mark'){
      if (s.markSprite){
        s.markSprite.position.set(ball.x, ball.y + 40, 30);
        s.markSprite.material.opacity = Math.min(1, s.t / 0.25) * (0.75 + 0.35*Math.sin(s.t*20));
      }
      if (s.t >= 0.5){ s.state = 'lift'; s.t = 0; }
    } else if (s.state === 'lift'){
      const prog = Math.min(s.t / 0.16, 1);
      const startY = ball.y + ball.r * 0.5;
      const endY = ball.y + 160;
      const hy = startY + (endY - startY) * easeOutQuad(prog);
      if (s.mesh){ s.mesh.position.set(ball.x, hy, 0); }
      if (prog >= 1){ s.state = 'slam'; s.t = 0; }
    } else if (s.state === 'slam'){
      const prog = Math.min(s.t / 0.12, 1);
      const startY = ball.y + 160;
      const endY = ball.y + ball.r * 0.5;
      const hy = startY + (endY - startY) * (prog*prog);
      if (s.mesh) s.mesh.position.set(ball.x, hy, 0);
      if (prog >= 1){
        // Real hit — ball takes a strong upward bounce, physical slow
        ball.vy = -Math.abs(ball.vy) * 0.9 - (200 + Math.random() * 180);
        ball.vx += (Math.random() - 0.5) * 200;
        ball.squash = 1;
        s.state = 'recover'; s.t = 0;
        G.shake = Math.min(1, G.shake + 0.3);
        haptic();
      }
    } else if (s.state === 'recover'){
      const prog = Math.min(s.t / 0.3, 1);
      if (s.mesh){
        s.mesh.scale.setScalar(Math.max(0.001, 1 - prog));
        s.mesh.position.y += 3;
      }
      if (s.markSprite) s.markSprite.material.opacity = Math.max(0, 1 - prog);
      if (prog >= 1){
        if (s.mesh) mapGroup.remove(s.mesh);
        if (s.markSprite) mapGroup.remove(s.markSprite);
        H.smalls.splice(i, 1);
      }
    }
  }
  if (H.cooldown <= 0 && H.smalls.length < 3){
    const candidates = G.active.filter(b => !b.dead && b.state === 'falling' && !b._marked && b.y < 1060 && b.y > 200);
    if (candidates.length){
      const ball = candidates[Math.floor(Math.random() * candidates.length)];
      ball._marked = true;
      const sH = buildSmallHammer(66);
      sH.position.set(ball.x, ball.y + ball.r + 6, 0);
      mapGroup.add(sH);
      const markSprite = makeForgeSprite();
      markSprite.position.set(ball.x, ball.y + 40, 30);
      markSprite.material.opacity = 0;
      mapGroup.add(markSprite);
      H.smalls.push({ ball, mesh: sH, markSprite, state: 'mark', t: 0 });
      H.cooldown = 0.9 + Math.random() * 0.7;
    } else H.cooldown = 0.4;
  }
}

function triggerHammerImpact(){
  const big = MAP.hammer.big;
  const strikeY = big.headBottomY;
  const cx = big.baseX;
  const r = big.headR * 2.4;
  let hitAny = false;
  for (const b of G.active){
    if (b.dead || b.state !== 'falling') continue;
    const dx = b.x - cx, dy = b.y - strikeY;
    const dd = Math.hypot(dx, dy);
    if (dd < r + b.r){
      const nx = dd > 0.001 ? dx/dd : (Math.random()-0.5);
      const ny = dd > 0.001 ? dy/dd : -1;
      // Radial shockwave outward + upward
      const k = (1 - Math.min(1, dd / (r + b.r))) * 400 + 180;
      b.vx += nx * k;
      b.vy = Math.min(b.vy, -120) + ny * k * 0.4;
      b.squash = 1;
      hitAny = true;
    }
  }
  if (hitAny){
    G.shake = Math.min(1, G.shake + 0.6);
    haptic();
  }
}

const GRAV = 520, AIR = 0.9992, REST_WALL = 0.42, REST_PEG = 0.55;

function spawnBall(value, tier, spawnDelay){
  const a = Math.random()*Math.PI*2, rad = Math.random()*16;
  const b = {
    value, tier, r: ballR(value),
    x: Math.cos(a)*rad, y: MAP.spinCy + Math.sin(a)*rad, z: 0,
    vx: (Math.random()-0.5)*60, vy: (Math.random()-0.5)*60,
    state:'held', popT:-(spawnDelay||0), scale:0,
    theta:0,rad:0,omega:0,bowlNum:0,orbitT:0,
    stall:0,squash:0,spin:0,
    mesh: makeBallMesh(value,tier), dead:false,
    dropTargetY:0, holeTarget:null, holeT:0,
    hoverT:0, hoverDuration:0.55,
    hoverStartTheta:0, hoverEndTheta:0, holeStartY:0,
    escT:0, escFromX:0, escFromY:0, escFromZ:0, escToX:0, escToY:0, escToZ:0,
    escapedBowl2:false, slowMoDone:false, _marked:false,
    slipT:0,
    lastX:0, lastY:0, stuckCheckT:0, stuckCount:0,
  };
  b.mesh.scale.setScalar(0.001);
  scene.add(b.mesh);
  return b;
}
function removeBall(b){ scene.remove(b.mesh); }
function easeOutBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function updateHeld(dt){
  const innerR = MAP.spinR - MAP.spinTube - 6;
  const ringRot = G.time*1.6;
  const gapWorld = ringRot - Math.PI/2;
  for (let i = G.held.length-1; i >= 0; i--){
    const b = G.held[i];
    if (b.popT < 0){ b.popT += dt; continue; }
    if (b.popT < 0.55){ b.popT += dt; b.scale = Math.max(0.001, easeOutBack(Math.min(b.popT/0.55,1))); }
    else b.scale = 1;
    b.vy -= 380*dt;
    const drag = Math.pow(0.35, dt);
    b.vx *= drag; b.vy *= drag;
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.spin += (Math.abs(b.vx)+Math.abs(b.vy))*0.004;
    const dx = b.x, dy = b.y - MAP.spinCy;
    const dist = Math.hypot(dx,dy);
    const maxDist = innerR - b.r;
    if (G.phase === 'launching' && G.launchOpen > 0.5 && dist > maxDist - 6){
      let ba = Math.atan2(dy,dx), da = ba - gapWorld;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < currentGap*0.5*0.9){
        b.state = 'falling';
        b.vx = (Math.random()-0.5)*40; b.vy = -60;
        G.active.push(b); G.held.splice(i,1); haptic();
        continue;
      }
    }
    if (dist > maxDist && dist > 0.001){
      const nx = dx/dist, ny = dy/dist;
      b.x = nx*maxDist; b.y = MAP.spinCy + ny*maxDist;
      const vn = b.vx*nx + b.vy*ny;
      if (vn > 0){ b.vx -= 1.55*vn*nx; b.vy -= 1.55*vn*ny; }
    }
    for (let j = i+1; j < G.held.length; j++){
      const ob = G.held[j];
      if (ob.popT < 0) continue;
      const ddx = b.x-ob.x, ddy = b.y-ob.y, dd = Math.hypot(ddx,ddy);
      const mD = b.r + ob.r;
      if (dd < mD && dd > 0.001){
        const nx = ddx/dd, ny = ddy/dd, push = (mD-dd)*0.5;
        b.x += nx*push; b.y += ny*push;
        ob.x -= nx*push; ob.y -= ny*push;
      }
    }
  }
}

function stepFalling(b, dt){
  // NOTE: no artificial slow zone. Balls are only slowed by physical hits.
  const spd = Math.hypot(b.vx, b.vy);
  const SUBSTEPS = Math.min(60, Math.max(6, Math.ceil(spd*dt/3)));
  const subDt = dt/SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV*subDt;
    b.vx *= AIR; b.vy *= AIR;
    b.x += b.vx*subDt; b.y += b.vy*subDt;
    for (const w of WALLS) collideSeg(b,w.x1,w.y1,w.x2,w.y2,w.thick,REST_WALL);
    for (const p of PEGS){
      if (Math.abs(p.x-b.x)>40 || Math.abs(p.y-b.y)>40) continue;
      if (collideCircle(b,p.x,p.y,p.r,REST_PEG)) p.mesh.userData.hit = Math.min(1, p.mesh.userData.hit + 0.8);
    }
    for (const bar of BARS){ if (Math.abs(bar.y-b.y) > 30) continue; resolveBar(b, bar); }
    if (JELLY.length) collideJelly(b);
    if (MAP.brickWall) resolveBricks(b);
    if (DARTBRICKS.length) resolveDartBricks(b);
    if (triMesh && b.y < MAP.triTipY+50 && b.y > MAP.triBaseY-50) resolveTriangle(b);
    collideWithPuck(b);
  }
  b.spin += (Math.abs(b.vx)+Math.abs(b.vy))*0.0035;
  b.stuckCheckT += dt;
  if (b.stuckCheckT > 0.5){
    const moved = Math.hypot(b.x-b.lastX, b.y-b.lastY);
    if (moved < 8 && b.state === 'falling'){ b.stuckCount++; b.vx += (Math.random()-0.5)*260; b.vy -= 60; if (b.stuckCount >= 3){ b.y -= 90; b.vx = (Math.random()-0.5)*100; b.stuckCount = 0; } }
    else b.stuckCount = 0;
    b.lastX = b.x; b.lastY = b.y; b.stuckCheckT = 0;
  }
  if (b.x < -600 || b.x > 600){ b.state = 'lost'; b.dead = true; G.results.push({value:b.value, mult:0}); return; }
  if (b.y < MAP.floorY){
    if (isBallInDartBox(b)) return;
    if (MAP.type === 'dart'){ startBowlDrop(b, Math.random() < 0.20 ? 2 : 1); return; }
    if (Math.abs(b.x) < MAP.floorOpen){ startBowlDrop(b, Math.random()<0.20?2:1); return; }
    b.state = 'lost'; b.dead = true; G.results.push({value:b.value, mult:0});
  }
}

function updatePuck(dt){
  const A = MAP.puckArena; if (!A) return;
  const p = A.puck;
  p.x += p.vx*dt; p.y += p.vy*dt;
  p.angle += (p.vx*dt*0.006) + (p.vy*dt*0.004);
  const lb = A.cx - A.w/2 + A.wallT/2 + p.r, rb = A.cx + A.w/2 - A.wallT/2 - p.r;
  const bb = A.cy - A.h/2 + A.wallT/2 + p.r, tb = A.cy + A.h/2 - A.wallT/2 - p.r;
  if (p.x < lb){ p.x = lb; p.vx = Math.abs(p.vx); p.flash = 0.6; }
  if (p.x > rb){ p.x = rb; p.vx = -Math.abs(p.vx); p.flash = 0.6; }
  if (p.y < bb){ p.y = bb; p.vy = Math.abs(p.vy); p.flash = 0.6; }
  if (p.y > tb){ p.y = tb; p.vy = -Math.abs(p.vy); p.flash = 0.6; }
  const drag = Math.pow(0.995, dt*60);
  p.vx *= drag; p.vy *= drag;
  const spd = Math.hypot(p.vx, p.vy);
  const minS = 190, maxS = 340;
  if (spd < minS){ const ang = spd < 1 ? Math.random()*Math.PI*2 : Math.atan2(p.vy, p.vx); const t = minS + Math.random()*50; p.vx = Math.cos(ang)*t; p.vy = Math.sin(ang)*t; }
  else if (spd > maxS){ const k = maxS/spd; p.vx *= k; p.vy *= k; }
  if (p.group){ p.group.position.set(p.x, p.y, 0); p.group.rotation.z = p.angle; }
}
function collideWithPuck(b){
  const A = MAP.puckArena; if (!A) return;
  const p = A.puck;
  const dx = b.x-p.x, dy = b.y-p.y, d = Math.hypot(dx,dy), mD = b.r + p.r;
  if (d < mD && d > 0.001){
    const nx = dx/d, ny = dy/d;
    b.x = p.x + nx*mD; b.y = p.y + ny*mD;
    const rvx = b.vx-p.vx, rvy = b.vy-p.vy;
    const rvn = rvx*nx + rvy*ny;
    if (rvn < 0){ b.vx -= 1.6*rvn*nx; b.vy -= 1.6*rvn*ny; }
    b.vx += p.vx*0.7; b.vy += p.vy*0.7 + 30;
    b.squash = 0.95; A.puck.flash = 1; haptic();
  }
}

function updateDartBox(dt){
  const D = MAP.dartBox; if (!D) return;
  if (D.active && D.active.ball && D.active.ball.dead){
    if (D.active.targetMesh) mapGroup.remove(D.active.targetMesh);
    if (D.active.gunMesh) mapGroup.remove(D.active.gunMesh);
    D.active = null;
  }
  D.shootTimer += dt;
  if (!D.active && D.shootTimer > 0.5){
    D.shootTimer = 0;
    const inBox = G.active.filter(b => !b.dead && b.state === 'falling' && isBallInDartBox(b));
    if (inBox.length){
      const tb = inBox[Math.floor(Math.random() * inBox.length)];
      const targetMesh = new THREE.Group();
      const ring = new THREE.Mesh(new THREE.TorusGeometry(tb.r + 18, 3.5, 8, 28), new THREE.MeshBasicMaterial({color: 0xff2020, transparent: true, opacity: 0.95}));
      targetMesh.add(ring);
      const crossMat = new THREE.MeshBasicMaterial({color: 0xff2020, transparent: true, opacity: 0.95});
      targetMesh.add(new THREE.Mesh(new THREE.BoxGeometry((tb.r+18)*2, 2.5, 2.5), crossMat));
      targetMesh.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, (tb.r+18)*2, 2.5), crossMat));
      targetMesh.position.set(tb.x, tb.y, 8); targetMesh.scale.setScalar(0.001);
      mapGroup.add(targetMesh);
      const gunMesh = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({map: gunState.tex, transparent: true, depthWrite: false}));
      gunMesh.position.set(tb.x, tb.y + 85, 10); gunMesh.scale.setScalar(0.001); gunMesh.renderOrder = 400;
      mapGroup.add(gunMesh);
      D.active = { ball: tb, targetMesh, gunMesh, phase: 'target', t: 0 };
    }
  }
  if (D.active){
    D.active.t += dt;
    const tb = D.active.ball;
    if (!tb.dead){
      if (D.active.phase === 'target') D.active.targetMesh.position.set(tb.x, tb.y, 8);
      else if (D.active.phase === 'gun') D.active.gunMesh.position.set(tb.x, tb.y + 85, 10);
    }
    if (D.active.phase === 'target'){
      const tt = Math.min(D.active.t / 0.35, 1);
      D.active.targetMesh.scale.setScalar(Math.max(0.001, easeOutBack(tt)));
      if (D.active.t > 0.55){ D.active.phase = 'gun'; D.active.t = 0; D.active.targetPopT = 0; }
    } else if (D.active.phase === 'gun'){
      D.active.targetPopT = (D.active.targetPopT || 0) + dt;
      const tp = Math.min(D.active.targetPopT / 0.25, 1);
      D.active.targetMesh.scale.setScalar(Math.max(0.001, 1 - tp));
      const gt = Math.min(D.active.t / 0.3, 1);
      D.active.gunMesh.scale.setScalar(Math.max(0.001, easeOutBack(gt)));
      if (D.active.t > 0.45){
        const ang = Math.random() * Math.PI * 2;
        const power = 900 + Math.random() * 400;
        tb.vx = Math.cos(ang) * power; tb.vy = Math.sin(ang) * power * 0.75 + 100;
        haptic(); G.shake = Math.min(1, G.shake + 0.5);
        D.active.phase = 'fade'; D.active.t = 0;
      }
    } else if (D.active.phase === 'fade'){
      const ft = Math.min(D.active.t / 0.35, 1);
      D.active.gunMesh.scale.setScalar(Math.max(0.001, 1 - ft));
      D.active.targetMesh.scale.setScalar(Math.max(0.001, 1 - ft));
      if (ft >= 1){ mapGroup.remove(D.active.targetMesh); mapGroup.remove(D.active.gunMesh); D.active = null; }
    }
  }
}

function startBowlDrop(b, bowlNum){
  const cfg = bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  b.state = 'drop' + bowlNum; b.bowlNum = bowlNum;
  b.dropTargetY = cfg.cy + b.r + 1;
  const minR = cfg.holes[0].r + cfg.holeR + 10, maxR = cfg.rimR - b.r - 8;
  const offA = Math.random()*Math.PI*2;
  const offR = minR >= maxR ? (minR+maxR)*0.5 : minR + Math.random()*(maxR-minR);
  b.x = Math.cos(offA)*offR; b.z = Math.sin(offA)*offR;
  const sT = cfg.cy + cfg.wallH + 120;
  if (b.y < sT) b.y = sT;
  b.vx = 0; b.vy = Math.max(-320, Math.min(b.vy,-80)); b.spin = 0; b.orbitT = 0;
}
function updateDrop(b, dt){
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const SUBSTEPS = Math.min(20, Math.max(3, Math.ceil(Math.abs(b.vy)*dt/3)));
  const subDt = dt/SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV*0.9*subDt; b.y += b.vy*subDt;
    const r = Math.hypot(b.x,b.z), maxR = cfg.rimR-b.r-8;
    if (r > maxR){ b.x = (b.x/r)*maxR; b.z = (b.z/r)*maxR; }
    if (b.y <= b.dropTargetY || b.y < cfg.cy + b.r){
      b.y = b.dropTargetY; b.squash = 1.0;
      b.theta = Math.atan2(b.z,b.x);
      b.rad = Math.max(Math.hypot(b.x,b.z), cfg.holes[0].r + cfg.holeR + 4);
      b.omega = (Math.random()>0.5?1:-1)*(2.9+Math.random()*0.7);
      b.orbitT = 0; b.state = 'bowl' + b.bowlNum; return;
    }
  }
}
function updateOrbit(b, dt){
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  b.orbitT += dt; b.theta += b.omega*dt;
  b.omega *= Math.pow(0.85, dt);
  const spd = Math.abs(b.omega);
  const inward = spd < 1.2 ? (1.2-spd)*30 : 0;
  b.rad -= (4+inward)*dt;
  if (b.rad < cfg.holes[0].r) b.rad = cfg.holes[0].r;
  if (b.rad > cfg.rimR - b.r - 4) b.rad = cfg.rimR - b.r - 4;
  b.x = Math.cos(b.theta)*b.rad; b.z = Math.sin(b.theta)*b.rad;
  b.y = cfg.cy + b.r + 0.5; b.spin += Math.abs(b.omega)*dt*6;
  if (b.orbitT < 1.4) return;
  if (b.bowlNum === 1 && !b.escapedBowl2 && b.orbitT > 2.4){ b.escapedBowl2 = true; if (Math.random() < 0.20){ startEscape2(b); return; } }
  for (const h of cfg.holes){
    const hx = Math.cos(h.a)*h.r, hz = Math.sin(h.a)*h.r;
    if (Math.hypot(b.x-hx, b.z-hz) < cfg.holeR*1.15 && spd < 3.0){ startHover(b, cfg, h); return; }
  }
  if (b.orbitT > 6.5){
    let best = cfg.holes[0], bd = Infinity;
    for (const h of cfg.holes){
      let da = b.theta-h.a; da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < bd){ bd = Math.abs(da); best = h; }
    }

}
function startEscape2(b){ b.state = 'esc2'; b.escT = 0; b.escFromX = b.x; b.escFromY = b.y; b.escFromZ = b.z; b.escToX = 0; b.escToY = MAP.bowl2.cy + MAP.bowl2.wallH + 60; b.escToZ = 0; }
function updateEscape2(b, dt){
  b.escT += dt;
  const t = Math.min(b.escT/0.9, 1);
  b.x = b.escFromX + (b.escToX-b.escFromX)*(1-Math.pow(1-t,3));
  b.y = b.escFromY + (b.escToY-b.escFromY)*(t*t);
  b.z = b.escFromZ + (b.escToZ-b.escFromZ)*(1-Math.pow(1-t,3));
  b.spin += dt*12; b.scale = 1 - t*0.15;
  if (t >= 1){ b.state = 'drop2'; b.bowlNum = 2; b.dropTargetY = MAP.bowl2.cy+b.r+1; b.vy = -60; }
}
function startHover(b, cfg, hole){
  b.state = 'hover'; b.holeTarget = hole; b.hoverT = 0;
  b.holeStartY = cfg.cy + b.r + 0.5;
  b.hoverStartTheta = b.theta; b.hoverEndTheta = hole.a;
  while (b.hoverEndTheta - b.hoverStartTheta > Math.PI) b.hoverEndTheta -= Math.PI*2;
  while (b.hoverEndTheta - b.hoverStartTheta < -Math.PI) b.hoverEndTheta += Math.PI*2;
  G.results.push({value:b.value, mult:hole.mult});
  b.resultMult = hole.mult;
  G.shake = Math.min(1, G.shake + (hole.red?0.5:0.25));
  if (hole.red && b.tier === 'gold' && !slowMo.active && !b.slowMoDone){
    b.slowMoDone = true; slowMo.active = true; slowMo.t = 0; slowMo.ball = b;
    goldL1.visible = true; goldL2.visible = true; haptic();
  }
}
function updateHover(b, dt){
  b.hoverT += dt;
  const t = Math.min(b.hoverT/b.hoverDuration, 1);
  const e = t*t*(3-2*t);
  b.theta = b.hoverStartTheta + (b.hoverEndTheta-b.hoverStartTheta)*e;
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const h = b.holeTarget;
  b.x = Math.cos(b.theta)*h.r; b.z = Math.sin(b.theta)*h.r;
  b.y = b.holeStartY + Math.sin(t*Math.PI)*6;
  b.x += Math.sin(b.hoverT*30)*1.6;
  b.spin += dt*6;
  if (t >= 1){ b.state = 'hole'; b.holeT = 0; b.holeStartY = cfg.cy+b.r+0.5; }
}
function updateHoleDrop(b, dt){
  b.holeT += dt;
  const t = Math.min(b.holeT/1.05, 1);
  const fall = t*t*(1.4-t*0.4);
  const DROP = b.bowlNum === 1 ? 100 : 200;
  b.y = b.holeStartY - fall*DROP;
  b.spin += dt*10; b.scale = 1 - fall*0.7;
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const h = b.holeTarget;
  b.x = Math.cos(h.a)*h.r + Math.sin(b.holeT*24)*2;
  b.z = Math.sin(h.a)*h.r + Math.cos(b.holeT*24)*2;
  if (t >= 1){
    if (b.bowlNum === 2){ b.state = 'endFall'; b.vy = -60; b.scale = 1; b.x = (Math.random()-0.5)*40; b.z = (Math.random()-0.5)*40; }
    else { b.state = 'settled'; b.y = -99999; }
    spawnConfetti(0, cfg.cy-30, 0, h.red);
  }
}
function updateEndFall(b, dt){ b.vy -= GRAV*0.8*dt; b.y += b.vy*dt; const ty = MAP.endCy + b.r + 1; if (b.y <= ty){ b.y = ty; b.vy = 0; b.squash = 1.0; b.state = 'endRest'; b.restT = 0; } }
function updateEndRest(b, dt){ b.restT += dt; b.squash *= Math.pow(0.0008, dt); if (b.restT > 1.2){ b.scale = Math.max(0, b.scale - dt*2.5); if (b.scale <= 0){ b.state='settled'; b.y=-99999; } } }
function resolveBallBall(){
  const f = G.active.filter(b => !b.dead && b.state === 'falling');
  for (let i = 0; i < f.length; i++) for (let j = i+1; j < f.length; j++){
    const a = f[i], b = f[j];
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy), mD = a.r + b.r;
    if (d < mD && d > 0.001){
      const nx = dx/d, ny = dy/d, push = (mD-d)*0.5;
      a.x -= nx*push; a.y -= ny*push; b.x += nx*push; b.y += ny*push;
      const vn1 = a.vx*nx + a.vy*ny, vn2 = b.vx*nx + b.vy*ny, diff = vn2 - vn1;
      if (diff > 0){ const imp = diff*0.5; a.vx += imp*nx; a.vy += imp*ny; b.vx -= imp*nx; b.vy -= imp*ny; }
    }
  }
}
const CONF_COLORS = [0xffffff,0xffdd44,0xff5577,0x55ddff,0x8fe5b0];

function pickFeaturedBall(){

function update(dt){
  G.time += dt;
  G.shake *= Math.pow(0.001, dt);
  if (spinMesh && spinRail){
    const rot = G.time*1.6;
    spinMesh.rotation.z = -Math.PI/2 + currentGap/2 + rot;
    spinRail.rotation.z = -Math.PI/2 + currentGap/2 + rot;
  }
  for (const p of PEGS){
    if (p.mesh.userData.hit > 0){
      const h = p.mesh.userData.hit;
      p.mesh.scale.setScalar(1 + h*0.45);
      const mat = p.mesh.material;
      mat.emissive.setRGB(0.14 + h*0.62, 0.14 + h*0.80, 0.19 + h*0.95);
      mat.emissiveIntensity = 0.3 + h*2.6;
      p.mesh.userData.hit *= Math.pow(0.0005, dt);
      if (p.mesh.userData.hit < 0.002){ p.mesh.userData.hit = 0; p.mesh.scale.setScalar(1); mat.emissive.setRGB(0.14,0.14,0.19); mat.emissiveIntensity = 0.3; }
    }
  }
  for (const br of BRICKS){
    if (br.shake > 0){
      br.shake *= Math.pow(0.001, dt);
      if (br.mesh){ const s = br.shake; br.mesh.position.x = br.x + (Math.random()-0.5)*6*s; br.mesh.position.y = br.y + (Math.random()-0.5)*6*s; br.mesh.scale.setScalar(1 + s*0.08); }
    }
  }
  for (const br of DARTBRICKS){
    if (br.shake > 0){
      br.shake *= Math.pow(0.001, dt);
      if (br.mesh){ const s = br.shake; br.mesh.position.x = br.x + (Math.random()-0.5)*4*s; br.mesh.position.y = br.y + (Math.random()-0.5)*4*s; br.mesh.scale.setScalar(1 + s*0.06); }
    }
  }
  for (const j of JELLY){
    const k = 55, damp = 6.5;
    j.squeezeVel += (-j.squeeze * k) * dt - j.squeezeVel * damp * dt;
    j.squeeze += j.squeezeVel * dt;
    if (j.squeeze < 0){ j.squeeze = 0; j.squeezeVel *= -0.35; }
    if (j.squeeze > 1) j.squeeze = 1;
    if (j.mesh){
      const sq = j.squeeze;
      j.mesh.scale.set(1 + sq * 0.22, Math.max(0.35, 1 - sq * 0.55), 1 + sq * 0.08);
      j.mesh.position.x = j.x + Math.sin(G.time * 22) * sq * 3;
      j.mesh.position.y = j.y;
      j.mesh.rotation.z = j.tiltAngle + Math.sin(G.time * 26) * sq * 0.09;
    }
  }
  for (const bar of BARS){
    bar.prevX = bar.x; bar.phase += dt;
    bar.x = bar.baseX + Math.sin(bar.phase) * bar.range;
    const vel = bar.x - bar.prevX;
    if (bar.mesh) bar.mesh.position.x = bar.x;
    if (bar.arrows && bar.arrows.length){
      const dir = vel >= 0 ? 1 : -1;
      for (let k = 0; k < bar.arrows.length; k++){
        const a = bar.arrows[k];
        const phase = ((G.time * 0.6 + k * 0.33) % 1 + 1) % 1;
        const offsetX = -bar.halfW + phase * bar.halfW * 2;
        a.position.set(bar.x + offsetX, bar.y + 14, 8);
        a.rotation.z = dir > 0 ? 0 : Math.PI;
        const fade = Math.sin(phase * Math.PI);
        a.scale.setScalar(a.userData.baseScale * (0.6 + fade * 0.55));
      }
    }
  }
  if (triMesh && gifPlane && (G.phase === 'playing' || G.phase === 'ended' || G.phase === 'launching')){
    G.triX += G.triDir * MAP.triSpeed * dt;
    if (G.triX > MAP.triRange){ G.triX = MAP.triRange; G.triDir = -1; }
    if (G.triX < -MAP.triRange){ G.triX = -MAP.triRange; G.triDir = 1; }
    triMesh.position.x = G.triX;
    gifPlane.position.x = G.triX;
  }
  updatePuck(dt);
  updateDartBox(dt);
  updateHammer(dt);
  updateFeaturedArrow(dt);
  if (MAP.puckArena && MAP.puckArena.puck.group){
    if (MAP.puckArena.puck.flash > 0){
      MAP.puckArena.puck.flash *= Math.pow(0.0005, dt);
      MAP.puckArena.puck.group.scale.setScalar(1 + MAP.puckArena.puck.flash*0.25);
    } else MAP.puckArena.puck.group.scale.setScalar(1);
  }
  updateHeld(dt);
  if (G.phase === 'launching'){
    G.launchT += dt;
    G.launchOpen = Math.min(1, G.launchT/0.85);
    setSpinnerGap(G.launchOpen*Math.PI*0.95);
    if (G.launchT > 12 && G.held.length > 0){
      while (G.held.length){ const b = G.held.pop(); b.state = 'falling'; b.vx = (Math.random()-0.5)*40; b.vy = -60; G.active.push(b); }
    }
    if (G.launchT > 1.4 && G.held.length === 0){ G.phase = 'playing'; G._ending = false; updateHud(); }
  }
  for (let i = G.active.length-1; i >= 0; i--){
    const b = G.active[i];
    b.squash *= Math.pow(0.0008, dt);
    if      (b.state === 'falling') stepFalling(b, dt);
    else if (b.state === 'drop1' || b.state === 'drop2') updateDrop(b, dt);
    else if (b.state === 'bowl1' || b.state === 'bowl2') updateOrbit(b, dt);
    else if (b.state === 'hover') updateHover(b, dt);
    else if (b.state === 'hole') updateHoleDrop(b, dt);
    else if (b.state === 'esc2') updateEscape2(b, dt);
    else if (b.state === 'endFall') updateEndFall(b, dt);
    else if (b.state === 'endRest') updateEndRest(b, dt);
    if (b.dead){ removeBall(b); G.active.splice(i,1); }
  }
  resolveBallBall();
  for (let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.mesh.position.x += p.vx*dt; p.mesh.position.y += p.vy*dt; p.mesh.position.z += p.vz*dt;
    p.vy -= p.gravity*dt; p.life -= dt;
    if (p.life <= 0){ scene.remove(p.mesh); G.particles.splice(i,1); }
  }
  if (G.phase === 'playing' && G.held.length === 0 && G.active.every(b => b.state === 'settled' || b.state === 'lost' || b.state === 'endRest' || b.dead) && !G._ending){
    G._ending = true; setTimeout(finishRound, 1200);
  }
}

function syncMeshes(){
  G.held.forEach(b => { b.mesh.position.set(b.x,b.y,b.z); b.mesh.scale.setScalar(b.scale); });
  G.active.forEach(b => {
    if (b.dead) return;
    if (b.state === 'settled'){ b.mesh.visible = false; return; }
    if (b.state === 'slip' || b.state === 'endRest' || b.state === 'endFall' || b.state === 'hole'){
      b.mesh.position.set(b.x,b.y,b.z); b.mesh.scale.setScalar(b.scale || 1); b.mesh.rotation.z += 0.05; return;
    }
    const sx = 1 + b.squash*0.22, sy = 1 - b.squash*0.22, sz = 1 + b.squash*0.10, sc = b.scale || 1;
    b.mesh.position.set(b.x,b.y,b.z);
    b.mesh.scale.set(sx*sc, sy*sc, sz*sc);
    b.mesh.rotation.z = Math.sin(b.spin)*0.4;
    b.mesh.rotation.x = Math.cos(b.spin*0.7)*0.3;
  });
}

const camState = { lookY:1200, targetLookY:1200, dist: CAM_RADIUS_NORMAL, targetDist: CAM_RADIUS_NORMAL };
function updateCamera(realDt){
  if (slowMo.active && slowMo.ball){ camState.targetLookY = slowMo.ball.y; camState.targetDist = CAM_RADIUS_ZOOMED; }
  else if (G.phase === 'launching' || G.phase === 'holding' || G.phase === 'idle'){ camState.targetLookY = MAP.spinCy - 100; camState.targetDist = CAM_RADIUS_NORMAL; }
  else if (featured.ball){ camState.targetLookY = featured.ball.y + 100; camState.targetDist = CAM_RADIUS_NORMAL; }
  else if (G.active.length){
    const ys = G.active.filter(b=>!b.dead && b.state !== 'settled').map(b=>b.y).sort((a,b)=>a-b);
    const med = ys.length ? ys[Math.floor(ys.length/2)] : camState.lookY;
    camState.targetLookY = med + 180; camState.targetDist = CAM_RADIUS_NORMAL;
  } else camState.targetLookY = camState.lookY;
  const smooth = 1 - Math.pow(0.0035, realDt);
  camState.lookY += (camState.targetLookY - camState.lookY)*smooth;
  camState.dist += (camState.targetDist - camState.dist)*smooth*0.7;
  const camSmooth = 1 - Math.pow(0.004, realDt);
  camDrag.yaw += (camDrag.targetYaw - camDrag.yaw)*camSmooth;
  camDrag.pitch += (camDrag.targetPitch - camDrag.pitch)*camSmooth;
  if (!isFinite(camState.lookY)) camState.lookY = 0;
  if (!isFinite(camState.dist)) camState.dist = CAM_RADIUS_NORMAL;
  if (!isFinite(camDrag.yaw)) camDrag.yaw = 0;
  if (!isFinite(camDrag.pitch)) camDrag.pitch = CAM_DEFAULT_PITCH;
  const radius = camState.dist;
  const cy_off = Math.sin(camDrag.pitch) * radius;
  const hDist = Math.cos(camDrag.pitch) * radius;
  const cx = Math.sin(camDrag.yaw) * hDist;
  const cz = Math.cos(camDrag.yaw) * hDist;
  camera.position.set(cx, camState.lookY + cy_off, cz);
  camera.lookAt(0, camState.lookY, 0);
}

let last = performance.now(), errCount = 0;
function loop(now){
  const realDt = Math.min((now-last)/1000, 1/30);
  last = now;
  tickGifState(triState, now);

  let gameDt = realDt;
  if (slowMo.active){
    slowMo.t += realDt;
    const p = slowMo.t / slowMo.duration;
    let scale;
    if (p < 0.15) scale = 1 - (p/0.15)*0.88;
    else if (p < 0.85) scale = 0.12;
    else scale = 0.12 + ((p-0.85)/0.15)*0.88;
    gameDt = realDt * scale;
    if (slowMo.ball && !slowMo.ball.dead){
      const bx = slowMo.ball.x, by = slowMo.ball.y;
      const flash = 0.8 + 0.6*Math.sin(slowMo.t*30);

    }
    if (p >= 1){ slowMo.active = false; goldL1.visible = false; goldL2.visible = false; goldL1.intensity = 0; goldL2.intensity = 0; }
  }
  try {
    update(gameDt); syncMeshes(); updateCamera(realDt);
    const sx = (Math.random()-0.5)*G.shake*8;
    const sy = (Math.random()-0.5)*G.shake*8;
    renderer.domElement.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px)`;
    renderer.render(scene, camera);
    errCount = 0;
  } catch (e){
    errCount++; console.error(e);
    if (errCount >= 5){
      errCount = 0;
      try {
        G.active.forEach(b=>removeBall(b)); G.held.forEach(b=>removeBall(b));
        G.active = []; G.held = []; G.particles = []; G.results = [];
        G._ending = false; G.phase = 'idle';
      } catch(_){}
    }
  }
  requestAnimationFrame(loop);
}
