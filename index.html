<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ice Arena — White Liquid Glass Arena (Collisions Fixed)</title>
<style>
  :root{
    --bg:#050607;
    --muted:#8b939b;
    --accent:#7fa3ff;
    --glass-white: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
  }

  html,body{height:100%;margin:0;background:linear-gradient(180deg,#050607,#0b0d0f);font-family:Inter,system-ui,Arial;color:#dfe6ee;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:flex;gap:20px;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}

  /* Controls column */
  .controls {
    width:320px;
    padding:16px;
    border-radius:12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  .brand{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700}
  h1{font-size:16px;margin:0}
  .lead{margin-top:6px;color:var(--muted);font-size:13px}

  .row{display:flex;gap:8px;margin-top:12px}
  .btn{padding:10px 14px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);color:#eaf2ff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.5);transition:transform 140ms}
  .btn:active{transform:scale(.96)}
  .small{padding:6px 8px;font-size:13px}

  .muted{color:var(--muted);font-size:13px}

  /* Arena container */
  .arena-wrap{
    width:760px;
    padding:18px;
    border-radius:12px;
    position:relative;
    overflow:visible;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }

  .arena-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .arena-canvas{position:relative;border-radius:12px;overflow:visible;height:356px}
  canvas{display:block;border-radius:12px;background:transparent;margin:0 18px}

  /* visible white liquid glass rectangle (this is the only rectangle used for collisions) */
  .arena-inner {
    position:absolute;
    left:26px;
    right:26px;
    top:26px;
    height:304px;
    border-radius:10px;
    background: rgba(255,255,255,0.03); /* white liquid glass tint */
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events:none;
  }

  /* Win overlay (appears only on stop) */
  .win-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0.45),rgba(0,0,0,0.6));opacity:0;pointer-events:none;transition:opacity 220ms}
  .win-overlay.show{opacity:1;pointer-events:auto}
  .win-card{width:320px;padding:14px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.06)}
  .debug { position:absolute; right:18px; bottom:18px; background:rgba(0,0,0,0.45); padding:8px 10px; border-radius:8px; font-size:13px; color:#dfe6ee; border:1px solid rgba(255,255,255,0.03); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <div class="brand">
        <div class="logo">IA</div>
        <div>
          <h1>Ice Arena</h1>
          <div class="lead">White liquid glass arena — collisions match visible rectangle</div>
        </div>
      </div>

      <div class="row">
        <button class="btn" id="btnSpawn">Spawn</button>
        <button class="btn" id="btnRandom">Random Shot</button>
        <button class="btn" id="btnReset">Reset</button>
      </div>

      <div style="margin-top:12px" class="muted">Friction (applies after 2s hold)</div>
      <input id="frictionRange" type="range" min="0.96" max="0.999" step="0.001" value="0.990" style="width:100%;margin-top:8px">

      <div style="margin-top:12px" class="muted">Scoreboard</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <div style="flex:1;background:rgba(255,255,255,0.01);padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)">You: <span id="scoreYou">0</span></div>
        <div style="flex:1;background:rgba(255,255,255,0.01);padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)">Opp: <span id="scoreOpp">0</span></div>
      </div>
    </div>

    <div class="arena-wrap" aria-live="polite">
      <div class="arena-header">
        <div style="font-weight:700">Arena Preview</div>
        <div class="muted">Click canvas to shoot; start speed held for 2s</div>
      </div>

      <div class="arena-canvas">
        <canvas id="c" width="640" height="320" style="width:640px;height:320px;display:block;"></canvas>

        <!-- THIS is the visible rectangle used for collisions -->
        <div class="arena-inner" aria-hidden="true"></div>

        <div class="win-overlay" id="winOverlay">
          <div class="win-card" id="winCard">
            <div style="font-size:18px;font-weight:700">You Win</div>
            <div class="muted" style="margin-top:8px">Puck stopped — test</div>
            <div style="margin-top:12px;text-align:center"><button class="btn" id="btnCloseWin">Close</button></div>
          </div>
        </div>

        <div class="debug" id="debugPanel">speed: 0</div>
      </div>
    </div>
  </div>

<script>
/* Canvas setup */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BASE_W = 640, BASE_H = 320;
let DPR = Math.max(1, window.devicePixelRatio || 1);
function applyDPR(){
  DPR = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = BASE_W * DPR;
  canvas.height = BASE_H * DPR;
  canvas.style.width = BASE_W + 'px';
  canvas.style.height = BASE_H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
applyDPR();
window.addEventListener('resize', applyDPR);

/* Puck model (no rotation, no particles) */
const W = BASE_W, H = BASE_H;
const ARENA_INSET = 26; // matches .arena-inner left/top/right inset
const puck = {
  x: W/2, y: H/2,
  r: 18,
  vx: 0, vy: 0,
  restitution: 0.78,
  frictionBase: 0.990,
  rollingFriction: 0.985,
  moving: false,
  stopped: true,
  holdStartUntil: 0 // timestamp until which high speed hold is active
};

/* Helpers */
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function clear(){ ctx.clearRect(0,0,W,H); }

/* Draw rink and puck */
function drawArena(){
  // background
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#071018'); bg.addColorStop(1,'#0b1216');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // subtle center glow
  const g = ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,300);
  g.addColorStop(0,'rgba(120,150,200,0.02)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // visible arena border (match .arena-inner)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 2;
  roundRect(ctx, ARENA_INSET, ARENA_INSET, W - ARENA_INSET*2, H - ARENA_INSET*2, 10);
  ctx.stroke();
}

function drawPuck(){
  // soft radial edge shadow
  const shadowGrad = ctx.createRadialGradient(puck.x, puck.y, puck.r*0.2, puck.x, puck.y, puck.r*1.6);
  shadowGrad.addColorStop(0,'rgba(0,0,0,0.0)');
  shadowGrad.addColorStop(0.6,'rgba(0,0,0,0.12)');
  shadowGrad.addColorStop(1,'rgba(0,0,0,0.0)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r*1.6,0,Math.PI*2); ctx.fill();

  // thick white outline (stroke only)
  ctx.beginPath(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2); ctx.stroke();

  // inner dark fill (subtle)
  ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.arc(puck.x,puck.y,puck.r-4,0,Math.PI*2); ctx.fill();

  // cross across whole diameter (thin)
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1.2;
  const crossLen = puck.r * 2.0;
  ctx.moveTo(puck.x - crossLen/2, puck.y);
  ctx.lineTo(puck.x + crossLen/2, puck.y);
  ctx.moveTo(puck.x, puck.y - crossLen/2);
  ctx.lineTo(puck.x, puck.y + crossLen/2);
  ctx.stroke();

  // soft specular
  const spec = ctx.createRadialGradient(puck.x - puck.r*0.35, puck.y - puck.r*0.35, 1, puck.x - puck.r*0.35, puck.y - puck.r*0.35, puck.r*1.2);
  spec.addColorStop(0,'rgba(255,255,255,0.06)'); spec.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = spec; ctx.beginPath(); ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2); ctx.fill();
}

/* Physics update with 2s hold of initial speed; collisions use ARENA_INSET */
let last = performance.now();
let stopTimer = null;
let scoreYou = 0, scoreOpp = 0;
const debugPanel = document.getElementById('debugPanel');

function update(now){
  const dtMs = now - last; last = now;
  const dt = Math.max(0.5, Math.min(4, dtMs / 16.67));

  // integrate
  puck.x += puck.vx * dt;
  puck.y += puck.vy * dt;

  // collision bounds use the visible white rectangle inset
  const minX = ARENA_INSET + puck.r;
  const maxX = W - ARENA_INSET - puck.r;
  const minY = ARENA_INSET + puck.r;
  const maxY = H - ARENA_INSET - puck.r;

  let bounced = false;
  if (puck.x < minX){ puck.x = minX; puck.vx = -puck.vx * puck.restitution; bounced = true; }
  if (puck.x > maxX){ puck.x = maxX; puck.vx = -puck.vx * puck.restitution; bounced = true; }
  if (puck.y < minY){ puck.y = minY; puck.vy = -puck.vy * puck.restitution; bounced = true; }
  if (puck.y > maxY){ puck.y = maxY; puck.vy = -puck.vy * puck.restitution; bounced = true; }

  // friction logic: if current time < holdStartUntil, keep minimal friction (hold speed)
  const nowTs = performance.now();
  const holdActive = nowTs < puck.holdStartUntil;

  // friction value from slider (applies after hold ends)
  const frictionSlider = parseFloat(document.getElementById('frictionRange').value);
  const jitter = (Math.random()-0.5) * 0.0006;

  if (!holdActive){
    const friction = frictionSlider + jitter;
    const speed2 = puck.vx*puck.vx + puck.vy*puck.vy;
    if (speed2 > 1e-6){
      puck.vx *= Math.pow(friction, dt);
      puck.vy *= Math.pow(friction, dt);
      if (speed2 < 0.8) { puck.vx *= Math.pow(puck.rollingFriction, dt); puck.vy *= Math.pow(puck.rollingFriction, dt); }
    }
  } else {
    // while holdActive, apply only tiny damping so speed is effectively held
    puck.vx *= Math.pow(0.9999, dt);
    puck.vy *= Math.pow(0.9999, dt);
  }

  if (bounced){
    puck.vx *= 0.985; puck.vy *= 0.985;
  }

  // random small slowdowns
  if (Math.random() < 0.002 * dt){ puck.vx *= 0.92; puck.vy *= 0.92; }

  // detect stop
  const speed = Math.sqrt(puck.vx*puck.vx + puck.vy*puck.vy);
  if (speed < 0.05 && !puck.stopped){
    puck.vx = 0; puck.vy = 0;
    puck.stopped = true; puck.moving = false;
    if (stopTimer) clearTimeout(stopTimer);
    stopTimer = setTimeout(()=>{ showWin(); animateWinPop(); updateScore(); }, 300);
  } else if (speed >= 0.05){
    puck.stopped = false;
    if (stopTimer){ clearTimeout(stopTimer); stopTimer = null; }
  }

  // render
  clear(); drawArena(); drawPuck();
  debugPanel.innerHTML = `speed: ${speed.toFixed(2)}<br>hold: ${holdActive ? 'yes' : 'no'}`;
  requestAnimationFrame(update);
}
requestAnimationFrame(update);

/* Input: click to shoot; start speed held for 2 seconds */
canvas.addEventListener('pointerdown', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const cssX = e.clientX - rect.left;
  const cssY = e.clientY - rect.top;
  const x = cssX * (canvas.width / rect.width) / DPR;
  const y = cssY * (canvas.height / rect.height) / DPR;

  const dx = x - puck.x, dy = y - puck.y;
  const dist = Math.max(1, Math.hypot(dx,dy));
  // stronger initial impulse and held for 2s
  const power = Math.min(64, Math.max(18, dist / 3.5)); // faster start
  const nx = dx / dist, ny = dy / dist;
  puck.vx = nx * power; puck.vy = ny * power;
  puck.moving = true; puck.stopped = false;
  // set hold until 2 seconds from now
  puck.holdStartUntil = performance.now() + 2000;
  if (stopTimer){ clearTimeout(stopTimer); stopTimer = null; }
  hideWin();
});

/* Buttons */
document.getElementById('btnSpawn').addEventListener('click', ()=>{ puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0; puck.stopped = true; puck.holdStartUntil = 0; hideWin(); });
document.getElementById('btnRandom').addEventListener('click', ()=>{ const a = Math.random()*Math.PI*2; const s = 20 + Math.random()*40; puck.vx = Math.cos(a)*s; puck.vy = Math.sin(a)*s; puck.moving=true; puck.stopped=false; puck.holdStartUntil = performance.now() + 2000; hideWin(); });
document.getElementById('btnReset').addEventListener('click', ()=>{ puck.x = W/2; puck.y = H/2; puck.vx = 0; puck.vy = 0; puck.stopped = true; puck.holdStartUntil = 0; hideWin(); });

/* Win overlay */
const winOverlay = document.getElementById('winOverlay');
const winCard = document.getElementById('winCard');
document.getElementById('btnCloseWin').addEventListener('click', hideWin);
function showWin(){ if (!winOverlay.classList.contains('show')){ winOverlay.classList.add('show'); winCard.classList.add('pop'); setTimeout(()=>winCard.classList.remove('pop'),600); } }
function hideWin(){ winOverlay.classList.remove('show'); }

/* Pop animation on puck stop */
function animateWinPop(){
  const start = performance.now(); const dur = 420; const origR = puck.r;
  function anim(now){
    const t = Math.min(1,(now-start)/dur);
    const ease = 1 - Math.pow(1 - t, 3);
    puck.r = origR * (1 + 0.06 * Math.sin(ease * Math.PI * 2));
    if (t < 1) requestAnimationFrame(anim); else puck.r = origR;
  }
  requestAnimationFrame(anim);
}

/* Score update example */
function updateScore(){
  if (Math.random() > 0.5) { scoreYou++; document.getElementById('scoreYou').textContent = scoreYou; }
  else { scoreOpp++; document.getElementById('scoreOpp').textContent = scoreOpp; }
}

/* Accessibility */
document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') hideWin(); });
</script>
</body>
</html>
