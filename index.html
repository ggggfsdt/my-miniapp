function towerUpdate(u, dt){
  const foe = u.side === 'player' ? 'enemy' : 'player';
  const foes = [];
  for(const e of state.units){
    if(!e.alive || e.side !== foe) continue;
    if(dist(u, e) <= u.spotRange) foes.push(e);
  }
  const wantEvil = foes.length > 0;
  u.towerBeams = u.towerBeams || [];

  // If we WANT evil but haven't swapped yet, AND the beams array is about to fire,
  // swap GIF and spawn beams in the same frame for tight sync.
  if(wantEvil && !u.evilMode){
    u.evilMode = true;
    if(u.el && u.el.firstChild && u.el.firstChild.src !== u.card.evilGif){
      u.el.firstChild.src = u.card.evilGif;
    }
    // Immediately spawn beams for the enemies in range (up to max)
    u.towerBeams.length = 0;
    for(const e of foes){
      if(u.towerBeams.length >= u.card.maxBeams) break;
      u.towerBeams.push({
        target: e,
        rampT: 0,
        startT: 0,
        dmgAcc: 0,
        curve: (Math.random()-0.5) * 46,
        seed: Math.random() * 10,
        wasFiring: false
      });
    }
    // small pop ring so it feels like the eye opens
    addRing(u.x, u.y, 30, 'rgba(200,70,30,.5)', .35);
  } else if(!wantEvil && u.evilMode){
    u.evilMode = false;
    if(u.el && u.el.firstChild && u.el.firstChild.src !== u.card.gif){
      u.el.firstChild.src = u.card.gif;
    }
    u.towerBeams.length = 0;
  }

  // Prune dead/out-of-range beams
  for(let i=u.towerBeams.length-1;i>=0;i--){
    const b = u.towerBeams[i];
    if(!b.target.alive || dist(u, b.target) > u.spotRange*1.15) u.towerBeams.splice(i,1);
  }
  // Acquire new targets if we have room
  if(u.evilMode && u.towerBeams.length < u.card.maxBeams){
    for(const e of foes){
      if(u.towerBeams.length >= u.card.maxBeams) break;
      if(!u.towerBeams.some(b => b.target === e)){
        u.towerBeams.push({
          target: e,
          rampT: 0,
          startT: 0,
          dmgAcc: 0,
          curve: (Math.random()-0.5) * 46,
          seed: Math.random() * 10,
          wasFiring: false
        });
      }
    }
  }
  for(const b of u.towerBeams){
    b.startT = Math.min(0.24, b.startT + dt);
    // Damage ramp begins immediately
    b.rampT += dt;
    const dps = Math.min(u.card.maxDps, 14 + b.rampT * 26);
    b.dmgAcc += dps * dt;
    if(b.dmgAcc >= 6){
      const chunk = Math.floor(b.dmgAcc);
      b.dmgAcc -= chunk;
      damageUnit(b.target, chunk, u, true, true);
    }
    if(b.startT >= 0.24 && !b.wasFiring){
      b.wasFiring = true;
      // small impact burst at target the moment beam fully connects
      addRing(b.target.x, b.target.y - b.target.size*0.1, 18, 'rgba(255,140,60,.6)', .3);
      addParticles(b.target.x, b.target.y, 4, '#d07040', 100, .3);
    }
  }
}
function towerBeamCurvePoint(sx, sy, tx, ty, curve, t){
  // Quadratic bezier with perpendicular control point offset
  const dx = tx - sx, dy = ty - sy;
  const len = Math.hypot(dx, dy) || 1;
  const px = -dy/len, py = dx/len;
  const cpx = (sx + tx)/2 + px * curve;
  const cpy = (sy + ty)/2 + py * curve;
  const mt = 1 - t;
  return {
    x: mt*mt*sx + 2*mt*t*cpx + t*t*tx,
    y: mt*mt*sy + 2*mt*t*cpy + t*t*ty
  };
}
function drawLavaBeam(c, tower, beam){
  const tgt = beam.target;
  if(!tgt.alive) return;
  const sx = tower.x, sy = tower.y - tower.size*0.06;
  const tx = tgt.x, ty = tgt.y - tgt.size*0.15;
  const growP = Math.min(1, beam.startT / 0.24);
  const rampP = Math.min(1, beam.rampT / 6);
  // Wider beams — base 7 → up to 18
  const baseThickness = 7 + rampP * 11;
  const drawTo = growP; // 0..1 how far along the beam we render
  const steps = 16;

  c.save();
  c.lineCap = 'round';
  c.lineJoin = 'round';

  // Helper to stroke along the partial curve
  function strokeCurve(lineWidth, style){
    c.lineWidth = lineWidth;
    c.strokeStyle = style;
    c.beginPath();
    const p0 = towerBeamCurvePoint(sx, sy, tx, ty, beam.curve, 0);
    c.moveTo(p0.x, p0.y);
    for(let i=1;i<=steps;i++){
      const t = (i/steps) * drawTo;
      const pt = towerBeamCurvePoint(sx, sy, tx, ty, beam.curve, t);
      c.lineTo(pt.x, pt.y);
    }
    c.stroke();
  }

  // 1) Dark red outer aura
  strokeCurve(baseThickness * 2.4, 'rgba(140,40,15,.28)');
  // 2) Orange main glow
  strokeCurve(baseThickness * 1.4, 'rgba(210,90,30,.55)');
  // 3) Bright core gradient (approximate by layered strokes)
  const coreGrad = c.createLinearGradient(sx, sy, tx, ty);
  coreGrad.addColorStop(0, '#e07030');
  coreGrad.addColorStop(0.35, '#ff9040');
  coreGrad.addColorStop(0.7, '#ffb060');
  coreGrad.addColorStop(1, '#ffd080');
  strokeCurve(baseThickness, coreGrad);
  // 4) Hot white-yellow center
  strokeCurve(baseThickness * 0.34, 'rgba(255,235,170,.95)');

  // Impact glow at the beam tip
  const endPt = towerBeamCurvePoint(sx, sy, tx, ty, beam.curve, drawTo);
  const glowR = 12 + rampP * 12;
  const glow = c.createRadialGradient(endPt.x, endPt.y, 0, endPt.x, endPt.y, glowR);
  glow.addColorStop(0, 'rgba(255,240,180,.95)');
  glow.addColorStop(0.35, 'rgba(255,150,60,.65)');
  glow.addColorStop(0.75, 'rgba(200,70,25,.28)');
  glow.addColorStop(1, 'rgba(160,40,15,0)');
  c.fillStyle = glow;
  c.beginPath(); c.arc(endPt.x, endPt.y, glowR, 0, Math.PI*2); c.fill();

  // Traveling sparks once beam is grown in
  if(growP >= 1){
    const sparkCount = 3 + Math.floor(rampP * 3);
    for(let i=0;i<sparkCount;i++){
      const ph = (state.time * 1.6 + i/sparkCount + beam.seed) % 1;
      const sp = towerBeamCurvePoint(sx, sy, tx, ty, beam.curve, ph);
      const size = 1.6 + Math.sin(ph * Math.PI) * (1.6 + rampP * 1.8);
      c.fillStyle = 'rgba(255,225,150,'+(0.6 + rampP*0.4)+')';
      c.beginPath(); c.arc(sp.x, sp.y, size, 0, Math.PI*2); c.fill();
    }
  }

  // Slight flare at tower mouth right after the beam begins
  if(growP < 1){
    const flash = 1 - growP;
    const flareR = 8 + flash * 14;
    const flare = c.createRadialGradient(sx, sy, 0, sx, sy, flareR);
    flare.addColorStop(0, 'rgba(255,220,140,'+(flash*0.9)+')');
    flare.addColorStop(1, 'rgba(255,140,50,0)');
    c.fillStyle = flare;
    c.beginPath(); c.arc(sx, sy, flareR, 0, Math.PI*2); c.fill();
  }

  c.restore();
}
function drawTowerBeams(c){
  for(const u of state.units){
    if(!u.alive || u.key !== 'tower') continue;
    if(!u.evilMode || !u.towerBeams) continue;
    for(const b of u.towerBeams){
      if(b.target.alive) drawLavaBeam(c, u, b);
    }
  }
}

/* ---------- PAUL / SHERIFF ---------- */
function paulUpdate(u, dt){
  if(u.atkCd > 0) u.atkCd -= dt;
  if(u.abilityCd > 0) u.abilityCd -= dt;
  if(u.paulState === 'spotting'){
    u.paulT += dt;
    if(u.paulT >= 0.25){
      u.paulState = 'ride_back'; u.paulT = 0;
      const tgt = u.paulTarget;
      if(tgt && tgt.alive){
        const a = ang(tgt, u);
        const backX = clamp(u.x + Math.cos(a)*50, MIN_MARGIN, W-MIN_MARGIN);
        const backY = clamp(u.y + Math.sin(a)*50, MIN_MARGIN, H-MIN_MARGIN);
        startSlide(u, backX, backY, 0.25, '#d4a24a', null);
      }
    }
    return;
  }
  if(u.paulState === 'ride_back'){
    if(!u.sliding){ u.paulState = 'charging'; u.paulT = 0; }
    return;
  }
  if(u.paulState === 'charging'){
    const tgt = u.paulTarget;
    if(!tgt || !tgt.alive){ u.paulState = 'idle'; u.atkCd = 0.6; return; }
    if(!u.paulCharging){
      u.paulCharging = true;
      const a = ang(u, tgt);
      const d = dist(u, tgt);
      startSlide(u, tgt.x - Math.cos(a)*20, tgt.y - Math.sin(a)*20, Math.min(0.4, d/400), '#d4a24a', null);
    }
    if(!u.sliding && u.paulCharging){
      if(tgt.alive){
        damageUnit(tgt, Math.round(u.dmg * 1.3), u, false);
        const a = ang(u, tgt);
        addSlash(tgt.x, tgt.y, a, 28, '#d4a24a', .35);
        addRing(tgt.x, tgt.y, 36, 'rgba(212,162,74,.55)', .45);
        launchUnit(tgt, a, 200, 1.0);
        SFX.big();
      }
      u.paulCharging = false;
      u.paulState = 'recover'; u.paulT = 0;
    }
    return;
  }
  if(u.paulState === 'recover'){
    u.paulT += dt;
    if(u.paulT >= 0.3){ u.paulState = 'idle'; u.paulT = 0; u.atkCd = 1.2; u.paulTarget = null; }
    return;
  }
  if(u.abilityActive){
    u._paulAbilityT = (u._paulAbilityT || 0) + dt;
    const phase = u._paulAbilityPhase;
    if(phase === 'back'){
      if(!u.sliding && u._paulAbilityT > 0.05){
        u._paulAbilityPhase = 'charge'; u._paulAbilityT = 0; u._paulAbilityIdx = 0; u._paulAbilityCharging = false;
      }
      return;
    }
    if(phase === 'charge'){
      const targets = u.paulMarkedTargets.filter(t => t.alive);
      if(u._paulAbilityIdx >= targets.length){
        u.abilityActive = false; u._paulAbilityT = 0; u._paulAbilityPhase = null;
        u.paulMarkedTargets.forEach(t => t.marked = false);
        u.paulMarkedTargets = [];
        return;
      }
      if(!u._paulAbilityCharging){
        u._paulAbilityCharging = true;
        const tgt = targets[u._paulAbilityIdx];
        const a = ang(u, tgt);
        const d = dist(u, tgt);
        startSlide(u, tgt.x - Math.cos(a)*18, tgt.y - Math.sin(a)*18, Math.max(0.22, d/520), '#d4a24a', null);
      }
      if(!u.sliding && u._paulAbilityCharging){
        const tgt = targets[u._paulAbilityIdx];
        if(tgt && tgt.alive){
          damageUnit(tgt, Math.round(u.dmg * 1.4), u, false);
          const a = ang(u, tgt);
          addSlash(tgt.x, tgt.y, a, 32, '#d4a24a', .4);
          addRing(tgt.x, tgt.y, 42, 'rgba(212,162,74,.7)', .5);
          launchUnit(tgt, a, 400, 2.0);
          SFX.big();
        }
        tgt.marked = false;
        u._paulAbilityIdx++;
        u._paulAbilityCharging = false;
      }
      return;
    }
    return;
  }
  const tgt = findNearestEnemy(u);
  if(!tgt) return;
  const d = dist(u, tgt);
  u.facing = tgt.x >= u.x ? 1 : -1;
  if(d <= u.attackRange + tgt.size*.4){
    if(u.atkCd <= 0){ u.paulState = 'spotting'; u.paulT = 0; u.paulTarget = tgt; }
    return;
  }
  if(u.sliding) return;
  const a = ang(u, tgt);
  u.x += Math.cos(a)*CARDS.paul.speed*dt;
  u.y += Math.sin(a)*CARDS.paul.speed*dt;
  u.moveT += dt;
}
function createGunEl(mirrored){
  const el = document.createElement('div');
  el.className = 'gun' + (mirrored ? ' mirror' : '');
  const img = document.createElement('img');
  img.src = GIF.gun; img.draggable = false;
  el.appendChild(img);
  unitsEl.appendChild(el);
  return el;
}
function getSheriffTargets(u, max){
  const foe = u.side === 'player' ? 'enemy' : 'player';
  const arr = [];
  for(const e of state.units){
    if(!e.alive || e.side !== foe) continue;
    if(dist(u, e) <= u.spotRange) arr.push(e);
  }
  arr.sort((a,b) => dist(u,a) - dist(u,b));
  return arr.slice(0, max);
}
function startSheriffAttack(u, ability){
  const maxT = ability ? 3 : 4;
  const targets = getSheriffTargets(u, maxT);
  if(!targets.length) return false;
  u.shootSeq = { phase: 'mark', ability: !!ability, targets, idx: 0, timer: 0,
    currentGun: null, currentGunPair: null };
  return true;
}
function fireGunShot(u, gun){
  if(!gun || !gun.target || !gun.target.alive) return;
  const tgt = gun.target;
  damageUnit(tgt, u.dmg, u, true);
  const a = ang(u, tgt);
  tgt.x += Math.cos(a) * 6; tgt.y += Math.sin(a) * 6;
  tgt.x = clamp(tgt.x, MIN_MARGIN, W-MIN_MARGIN);
  tgt.y = clamp(tgt.y, MIN_MARGIN, H-MIN_MARGIN);
  const gx = tgt.x + (gun.side > 0 ? 12 : -12);
  const gy = tgt.y - tgt.size * 0.85;
  addParticles(gx, gy, 4, '#e0a060', 120, 0.3);
  addShake(0.4, 0.06);
  SFX.arrow();
}
function updateGunEl(gun){
  if(!gun.el) return;
  if(!gun.target.alive){
    if(gun.el.parentNode) gun.el.parentNode.removeChild(gun.el);
    gun.el = null; return;
  }
  const s = view.s;
  const sz = 34 * s;
  gun.el.style.width = sz + 'px';
  gun.el.style.height = sz + 'px';
  const offsetX = gun.side * (gun.target.size * 0.38);
  const offsetY = -gun.target.size * 0.95;
  const gx = (gun.target.x + offsetX - 17) * s;
  const gy = (gun.target.y + offsetY - 17) * s;
  gun.el.style.transform = `translate(${gx}px, ${gy}px)`;
}
function handleSheriffSeq(u, dt){
  const seq = u.shootSeq;
  seq.timer += dt;
  if(seq.phase === 'mark'){
    if(seq.idx < seq.targets.length){
      if(seq.timer >= 0.22){
        seq.timer = 0;
        const t = seq.targets[seq.idx];
        if(t.alive){ t.shootMark = 1.6; SFX.hit(); }
        seq.idx++;
      }
    } else {
      if(seq.timer >= 0.5){ seq.timer = 0; seq.phase = seq.ability ? 'abilityGuns' : 'guns'; seq.idx = 0; }
    }
    return;
  }
  if(seq.phase === 'guns'){
    if(seq.currentGun){
      const g = seq.currentGun;
      updateGunEl(g);
      g.shotTimer += dt;
      if(g.shotTimer >= (g.shotsFired === 0 ? 0.18 : 0.2) && g.shotsLeft > 0){
        g.shotTimer = 0; g.shotsLeft--; g.shotsFired++;
        fireGunShot(u, g);
      }
      if(g.shotsLeft <= 0){
        if(g.el && g.el.parentNode) g.el.parentNode.removeChild(g.el);
        seq.currentGun = null; seq.timer = -0.1;
      }
    } else {
      if(seq.idx >= seq.targets.length){ u.shootSeq = null; u.atkCd = 1.4; return; }
      if(seq.timer >= 0){
        const t = seq.targets[seq.idx];
        if(t.alive){
          t.shootMark = 0;
          seq.currentGun = { target: t, el: createGunEl(false), shotsLeft: 3, shotsFired: 0, shotTimer: 0, side: 1 };
        }
        seq.idx++; seq.timer = 0;
      }
    }
    return;
  }
  if(seq.phase === 'abilityGuns'){
    if(seq.currentGunPair){
      const pair = seq.currentGunPair;
      if(pair.left.target.alive) updateGunEl(pair.left);
      if(pair.right.target.alive) updateGunEl(pair.right);
      pair.left.shotTimer += dt;
      pair.right.shotTimer += dt;
      const leftReady = pair.left.target.alive && pair.left.shotsLeft > 0 &&
                        pair.left.shotTimer >= (pair.left.shotsFired === 0 ? 0.18 : 0.22);
      const rightReady = pair.right.target.alive && pair.right.shotsLeft > 0 &&
                         pair.right.shotTimer >= (pair.right.shotsFired === 0 ? 0.26 : 0.22);
      if(leftReady){
        pair.left.shotTimer = 0; pair.left.shotsLeft--; pair.left.shotsFired++;
        fireGunShot(u, pair.left);
      } else if(rightReady){
        pair.right.shotTimer = 0; pair.right.shotsLeft--; pair.right.shotsFired++;
        fireGunShot(u, pair.right);
      }
      const leftDone = !pair.left.target.alive || pair.left.shotsLeft <= 0;
      const rightDone = !pair.right.target.alive || pair.right.shotsLeft <= 0;
      if(leftDone && rightDone){
        if(pair.left.el && pair.left.el.parentNode) pair.left.el.parentNode.removeChild(pair.left.el);
        if(pair.right.el && pair.right.el.parentNode) pair.right.el.parentNode.removeChild(pair.right.el);
        seq.currentGunPair = null; seq.timer = -0.1;
      }
    } else {
      if(seq.idx >= seq.targets.length){ u.shootSeq = null; u.atkCd = 1.6; return; }
      if(seq.timer >= 0){
        const t = seq.targets[seq.idx];
        if(t.alive){
          t.shootMark = 0;
          seq.currentGunPair = {
            left: { target: t, el: createGunEl(true), shotsLeft: 3, shotsFired: 0, shotTimer: 0, side: -1 },
            right: { target: t, el: createGunEl(false), shotsLeft: 3, shotsFired: 0, shotTimer: -0.08, side: 1 }
          };
        }
        seq.idx++; seq.timer = 0;
      }
    }
    return;
  }
}
function sheriffUpdate(u, dt){
  if(u.atkCd > 0) u.atkCd -= dt;
  if(u.shootSeq){ handleSheriffSeq(u, dt); return; }
  if(u.atkState !== 'idle'){
    u.atkT += dt;
    if(u.atkState === 'windup' && u.atkT >= .3){
      const ok = startSheriffAttack(u, false);
      u.atkState = 'idle'; u.atkT = 0;
      if(!ok) u.atkCd = 0.5;
      return;
    }
    return;
  }
  const tgt = findNearestEnemy(u);
  if(!tgt) return;
  const d = dist(u, tgt);
  u.facing = tgt.x >= u.x ? 1 : -1;
  if(d <= u.attackRange){
    if(u.atkCd <= 0){ u.atkState = 'windup'; u.atkT = 0; u.atkTarget = tgt; }
    return;
  }
  if(u.sliding) return;
  const a = ang(u, tgt);
  u.x += Math.cos(a)*CARDS.sheriff.speed*dt;
  u.y += Math.sin(a)*CARDS.sheriff.speed*dt;
  u.moveT += dt;
}

const UPDATERS = {
  frog: frogUpdate, pepe: pepeUpdate, knight: knightUpdate, archer: archerUpdate,
  mage: mageUpdate, bomber: bomberUpdate, berserker: berserkerUpdate,
  vampire: vampireUpdate, skeletons: skeletonUpdate, tower: towerUpdate,
  paul: paulUpdate, sheriff: sheriffUpdate
};

/* ---------- HERO ABILITIES ---------- */
function getAbilityHero(){
  const heroes = state.units.filter(u => u.alive && u.side === 'player' && u.card && u.card.abilityCost);
  if(!heroes.length) return null;
  let best = null, bestScore = -Infinity;
  for(const h of heroes){
    const busy = h.abilityActive || h.shootSeq;
    const ready = h.abilityCd <= 0 && !busy && state.elixirP >= h.card.abilityCost;
    const score = ready ? 1000 : -h.abilityCd;
    if(score > bestScore){ bestScore = score; best = h; }
  }
  return best;
}
function triggerHeroAbility(){
  const h = getAbilityHero();
  if(!h) return false;
  if(h.abilityCd > 0 || state.elixirP < h.card.abilityCost) return false;
  if(h.key === 'paul') return triggerPaulAbility(h);
  if(h.key === 'sheriff') return triggerSheriffAbility();
  return false;
}
function triggerPaulAbility(paul){
  if(!paul || paul.abilityCd > 0 || state.elixirP < CARDS.paul.abilityCost) return false;
  if(paul.abilityActive || paul.paulState !== 'idle') return false;
  state.elixirP -= CARDS.paul.abilityCost;
  paul.abilityCd = CARDS.paul.abilityCooldown;
  const marked = [];
  const dirX = paul.facing;
  for(const e of state.units){
    if(!e.alive || e.side !== 'enemy') continue;
    const dx = e.x - paul.x, dy = e.y - paul.y;
    const d = Math.hypot(dx, dy);
    if(d > 280) continue;
    const dot = (dx * dirX) / (d || 1);
    if(dot < 0.1 && d > 60) continue;
    marked.push(e); e.marked = true;
  }
  if(marked.length === 0) return false;
  marked.sort((a,b) => dist(paul, a) - dist(paul, b));
  paul.paulMarkedTargets = marked;
  paul.abilityActive = true;
  paul._paulAbilityPhase = 'back'; paul._paulAbilityT = 0; paul._paulAbilityIdx = 0; paul._paulAbilityCharging = false;
  const first = marked[0];
  const a = ang(first, paul);
  const backX = clamp(paul.x + Math.cos(a)*100, MIN_MARGIN, W-MIN_MARGIN);
  const backY = clamp(paul.y + Math.sin(a)*100, MIN_MARGIN, H-MIN_MARGIN);
  startSlide(paul, backX, backY, 0.35, '#d4a24a', null);
  addRing(paul.x, paul.y, 52, 'rgba(212,162,74,.65)', .55);
  SFX.big();
  return true;
}
function triggerSheriffAbility(){
  const s = state.units.find(u => u.alive && u.side === 'player' && u.key === 'sheriff');
  if(!s || s.abilityCd > 0 || state.elixirP < CARDS.sheriff.abilityCost) return false;
  if(s.abilityActive || s.shootSeq) return false;
  const targets = getSheriffTargets(s, 3);
  if(!targets.length) return false;
  state.elixirP -= CARDS.sheriff.abilityCost;
  s.abilityCd = CARDS.sheriff.abilityCooldown;
  s.shootSeq = { phase: 'mark', ability: true, targets, idx: 0, timer: 0,
    currentGun: null, currentGunPair: null };
  addRing(s.x, s.y, 52, 'rgba(212,162,74,.6)', .5);
  SFX.big();
  return true;
}
abilityBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  triggerHeroAbility();
});

/* ---------- PLACEMENTS ---------- */
const placements = [];
function startPlacement(side, key, x, y){
  const c = CARDS[key];
  const el = document.createElement('div');
  el.className = 'unit ' + side;
  const s = view.s || 1;
  el.style.width = (c.size * s) + 'px';
  el.style.height = (c.size * s) + 'px';
  el.style.transform = `translate(${(x - c.size/2) * s}px, ${(y - c.size/2) * s}px)`;
  el.style.opacity = '0.55';
  const img = document.createElement('img');
  img.src = c.gif; img.draggable = false;
  el.appendChild(img);
  unitsEl.appendChild(el);
  placements.push({ side, key, x, y, el, phase:'preview', timer:0,
    previewDur:.3, chargeDur:.6 + c.cost*.22, size: c.size });
  addRing(x, y, 22, side === 'player' ? 'rgba(84,184,232,.45)' : 'rgba(224,85,107,.45)', .45);
}
function updatePlacements(dt){
  for(let i=placements.length-1;i>=0;i--){
    const p = placements[i];
    p.timer += dt;
    const s = view.s;
    p.el.style.width = (p.size*s)+'px';
    p.el.style.height = (p.size*s)+'px';
    p.el.style.transform = `translate(${(p.x-p.size/2)*s}px, ${(p.y-p.size/2)*s}px)`;
    if(p.phase === 'preview'){
      p.el.style.opacity = (0.4 + 0.6*(1-p.timer/p.previewDur)).toFixed(2);
      if(p.timer >= p.previewDur){ p.phase = 'charging'; p.timer = 0; }
    } else {
      p.el.style.opacity = '0.45';
      if(p.timer >= p.chargeDur){
        p.el.remove();
        const c = CARDS[p.key];
        const n = c.count || 1;
        for(let k = 0; k < n; k++){
          const a = (k / n) * Math.PI * 2 + Math.PI / 4;
          const r = n > 1 ? 18 : 0;
          spawnUnit(p.side, p.key,
            clamp(p.x + Math.cos(a) * r, MIN_MARGIN, W - MIN_MARGIN),
            clamp(p.y + Math.sin(a) * r, MIN_MARGIN, H - MIN_MARGIN),
            n > 1 ? k : null);
        }
        placements.splice(i,1);
      }
    }
  }
}
function drawPlacements(){
  for(const p of placements){
    const isTower = CARDS[p.key] && CARDS[p.key].tower;
    // Gradient range circle for towers only, during preview
    if(isTower && p.phase === 'preview'){
      const range = CARDS[p.key].spotRange;
      const rr = p.side === 'player' ? '84,184,232' : '224,85,107';
      // Radial gradient — dense in center, fades out at edge
      const grd = ctx.createRadialGradient(p.x, p.y, range*0.15, p.x, p.y, range);
      grd.addColorStop(0,   'rgba('+rr+',0.14)');
      grd.addColorStop(0.55,'rgba('+rr+',0.08)');
      grd.addColorStop(0.85,'rgba('+rr+',0.03)');
      grd.addColorStop(1,   'rgba('+rr+',0)');
      ctx.save();
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(p.x, p.y, range, 0, Math.PI*2); ctx.fill();
      // Very subtle thin edge
      ctx.strokeStyle = 'rgba('+rr+',0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, range, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    const col = p.side === 'player' ? 'rgba(140,200,240,.85)' : 'rgba(240,140,160,.85)';
    if(p.phase === 'preview'){
      const t = p.timer/p.previewDur;
      ctx.save(); ctx.globalAlpha = (1-t)*.7;
      ctx.strokeStyle = col; ctx.lineWidth = 1.4;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 14 + t*10, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    } else {
      const t = p.timer/p.chargeDur;
      ctx.save(); ctx.globalAlpha = .3;
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(p.x, p.y, 20, -Math.PI/2, -Math.PI/2 + t*Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---------- UPDATE ---------- */
function update(dt){
  state.time += dt;
  state.elixirP = Math.min(state.elixirMax, state.elixirP + dt*state.elixirRate);
  state.elixirE = Math.min(state.elixirMax, state.elixirE + dt*state.elixirRate);
  updateShake(dt);
  for(const u of state.units){
    if(!u.alive) continue;
    if(u.hitFlash > 0) u.hitFlash -= dt;
    if(u.shootMark > 0) u.shootMark -= dt;
    if(u.acidTimer > 0){
      u.acidTimer -= dt;
      u.hp -= u.acidDps * dt;
      if(u.hp <= 0){ killUnit(u); continue; }
    }
    // Towers can never slide/bounce
    if(u.card && u.card.tower){ u.sliding = false; u.bouncyTimer = 0; u.vx = 0; u.vy = 0; }
    if(u.bouncyTimer > 0){
      u.bouncyTimer -= dt;
      u.x += u.vx * dt;
      u.y += u.vy * dt;
      if(u.x < MIN_MARGIN){ u.x = MIN_MARGIN; u.vx = Math.abs(u.vx) * 0.85; }
      if(u.x > W - MIN_MARGIN){ u.x = W - MIN_MARGIN; u.vx = -Math.abs(u.vx) * 0.85; }
      if(u.y < MIN_MARGIN){ u.y = MIN_MARGIN; u.vy = Math.abs(u.vy) * 0.85; }
      if(u.y > H - MIN_MARGIN){ u.y = H - MIN_MARGIN; u.vy = -Math.abs(u.vy) * 0.85; }
      u.vx *= 0.99; u.vy *= 0.99;
      if(u.bouncyTimer <= 0){ u.vx = 0; u.vy = 0; }
      updateUnitEl(u);
      continue;
    }
    if(u.sliding){
      updateSlide(u, dt);
      u.x = clamp(u.x, MIN_MARGIN, W-MIN_MARGIN);
      u.y = clamp(u.y, MIN_MARGIN, H-MIN_MARGIN);
      updateUnitEl(u);
      continue;
    }
    if(u.stunTimer > 0){
      u.stunTimer -= dt;
      u.x = clamp(u.x, MIN_MARGIN, W-MIN_MARGIN);
      u.y = clamp(u.y, MIN_MARGIN, H-MIN_MARGIN);
      updateUnitEl(u);
      continue;
    }
    const fn = UPDATERS[u.key];
    if(fn) fn(u, dt);
    u.x = clamp(u.x, MIN_MARGIN, W-MIN_MARGIN);
    u.y = clamp(u.y, MIN_MARGIN, H-MIN_MARGIN);
    updateUnitEl(u);
  }
  for(let i=state.units.length-1;i>=0;i--){
    if(!state.units[i].alive) state.units.splice(i,1);
  }
  updatePlacements(dt);
  updateProjectiles(dt);
  fxUpdate(dt);
  updateAbilityBtn();
}

/* ---------- ABILITY BTN ---------- */
let lastAbilitySrc = '';
function updateAbilityBtn(){
  const h = getAbilityHero();
  abilityBtn.classList.toggle('show', !!h);
  if(!h){ lastAbilitySrc = ''; return; }
  if(h.card.gif !== lastAbilitySrc){ lastAbilitySrc = h.card.gif; abilityIcon.src = h.card.gif; }
  abilityLbl.textContent = h.key === 'sheriff' ? 'BARRAGE' : 'RIDE';
  const cd = h.abilityCd;
  const enoughElixir = state.elixirP >= h.card.abilityCost;
  const busy = h.abilityActive || h.shootSeq;
  const ready = cd <= 0 && enoughElixir && !busy;
  if(ready){
    abilityBtn.classList.remove('cd');
    abilityCdText.style.display = 'none';
  } else {
    abilityBtn.classList.add('cd');
    if(cd > 0){ abilityCdText.style.display = 'flex'; abilityCdText.textContent = Math.ceil(cd); }
    else if(!enoughElixir){ abilityCdText.style.display = 'flex'; abilityCdText.textContent = h.card.abilityCost; }
    else { abilityCdText.style.display = 'none'; }
  }
}

/* ---------- DRAW ---------- */
function draw(){
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a2836'); g.addColorStop(.5, '#16232f'); g.addColorStop(1, '#1a2836');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shake.x, shake.y);

  ctx.strokeStyle = 'rgba(255,255,255,.025)'; ctx.lineWidth = 1;
  for(let x = 0; x <= W; x += 60){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for(let y = 0; y <= H; y += 60){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.fillStyle = 'rgba(84,184,232,.035)';
  ctx.fillRect(0, PLAYER_LINE, W, H-PLAYER_LINE);
  ctx.fillStyle = 'rgba(224,85,107,.035)';
  ctx.fillRect(0, 0, W, PLAYER_LINE);

  ctx.save();
  ctx.strokeStyle = 'rgba(140,180,220,.13)'; ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.beginPath(); ctx.moveTo(0, PLAYER_LINE); ctx.lineTo(W, PLAYER_LINE); ctx.stroke();
  ctx.restore();

  for(const u of state.units){
    if(u.alive && u.key === 'berserker' && u.raging) drawBerserkerRage(ctx, u);
  }
  for(const u of state.units){
    if(u.alive && u.key === 'archer') drawArcherBow(ctx, u);
  }

  drawPlacements();
  drawProjectiles(ctx);
  fxDraw(ctx);
  drawTowerBeams(ctx);

  for(const u of state.units){
    if(u.alive && u.key === 'frog' && u.tongue) drawFrogTongue(ctx, u);
  }
  for(const u of state.units){
    if(u.alive && u.shootMark > 0) drawShootMarkUnit(ctx, u);
  }
  for(const u of state.units){
    if(u.alive && u.key === 'paul') drawPaulExtra(ctx, u);
  }
  for(const u of state.units){
    if(u.alive && u.stunTimer > 0) drawStun(ctx, u);
  }
  for(const u of state.units){
    if(!u.alive) continue;
    if(u.key === 'knight'){
      if(u.evo) drawEvoKnightSword(ctx, u);
      else drawKnightSword(ctx, u);
    }
    if(u.key === 'berserker') drawBerserkerAxes(ctx, u);
    if(u.key === 'skeletons') drawTinySword(ctx, u);
  }
  for(const u of state.units){
    if(!u.alive) continue;
    if(u.jumpZ < -2){
      ctx.save(); ctx.globalAlpha = .2; ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(u.x, u.y + u.size*.4, u.size*.35, u.size*.13, 0, 0, Math.PI*2);
      ctx.fill(); ctx.restore();
    }
  }

  ctx.restore();
}

/* ---------- HUD ---------- */
let lastFloorP = -1, lastFloorE = -1;
function updateHUD(){
  elixirFill.style.width = (state.elixirP/state.elixirMax*100) + '%';
  const fp = Math.floor(state.elixirP);
  if(fp !== lastFloorP){
    lastFloorP = fp; elixirNum.textContent = fp;
    elixirFill.classList.remove('bounce');
    void elixirFill.offsetWidth;
    elixirFill.classList.add('bounce');
    document.querySelectorAll('.card.player').forEach(el => {
      el.classList.toggle('disabled', CARDS[el.dataset.key].cost > state.elixirP);
    });
  }
  const fe = Math.floor(state.elixirE);
  if(fe !== lastFloorE){
    lastFloorE = fe;
    document.querySelectorAll('.card.enemy').forEach(el => {
      el.classList.toggle('disabled', CARDS[el.dataset.key].cost > state.elixirE);
    });
  }
}

/* ---------- HANDS ---------- */
const thumbCache = {};
function makeThumb(gifUrl, callback){
  if(thumbCache[gifUrl] !== undefined){ callback(thumbCache[gifUrl]); return; }
  const img = new Image();
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 96; canvas.height = 96;
      const c2 = canvas.getContext('2d');
      const s = Math.min(canvas.width / img.width, canvas.height / img.height);
      const w = img.width * s, h = img.height * s;
      c2.drawImage(img, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/png');
      thumbCache[gifUrl] = dataUrl;
      callback(dataUrl);
    }catch(e){ thumbCache[gifUrl] = null; callback(null); }
  };
  img.onerror = () => { thumbCache[gifUrl] = null; callback(null); };
  img.src = gifUrl;
}
function buildHands(){
  playerHandEl.querySelectorAll('.card').forEach(el => el.remove());
  enemyHandEl.querySelectorAll('.card').forEach(el => el.remove());
  for(const key of ALL) playerHandEl.appendChild(makeCardEl(key, 'player'));
  for(const key of ALL) enemyHandEl.appendChild(makeCardEl(key, 'enemy'));
}
function makeCardEl(key, side){
  const c = CARDS[key];
  const el = document.createElement('div');
  el.className = 'card ' + side + ' ' + (c.rarity || 'common');
  el.dataset.key = key; el.dataset.side = side;
  const img = document.createElement('img');
  img.alt = '';
  img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  makeThumb(c.gif, (thumb) => {
    if(thumb) img.src = thumb; else img.src = c.gif;
  });
  el.appendChild(img);
  const costDiv = document.createElement('div');
  costDiv.className = 'cost ' + (c.cost <= 2 ? 'low' : '');
  costDiv.textContent = c.cost;
  el.appendChild(costDiv);
  const nameDiv = document.createElement('div');
  nameDiv.className = 'name'; nameDiv.textContent = c.name;
  el.appendChild(nameDiv);
  const rarityDiv = document.createElement('div');
  rarityDiv.className = 'rarity';
  el.appendChild(rarityDiv);
  el.addEventListener('pointerdown', onCardDown);
  return el;
}

/* ---------- DRAG ---------- */
let drag = { active:false, side:null, key:null, pointerId:null };
function onCardDown(e){
  e.preventDefault();
  const el = e.currentTarget;
  const key = el.dataset.key, side = el.dataset.side;
  const c = CARDS[key];
  const elixir = side === 'player' ? state.elixirP : state.elixirE;
  if(c.cost > elixir){ SFX.fail(); return; }
  drag.active = true; drag.side = side; drag.key = key; drag.pointerId = e.pointerId;
  el.classList.add('hide');
  dragGhostImg.src = c.gif;
  dragGhost.classList.toggle('enemy', side === 'enemy');
  dragGhost.style.display = 'block';
  moveGhost(e.clientX, e.clientY);
  try { el.setPointerCapture(e.pointerId); } catch(_){}
}
function moveGhost(cx, cy){
  const w = dragGhost.offsetWidth || 62, h = dragGhost.offsetHeight || 62;
  dragGhost.style.transform = `translate(${cx - w/2}px, ${cy - h/2 - 20}px)`;
}
document.addEventListener('pointermove', e => {
  if(!drag.active || e.pointerId !== drag.pointerId) return;
  e.preventDefault();
  moveGhost(e.clientX, e.clientY);
}, { passive:false });
document.addEventListener('pointerup', e => {
  if(!drag.active || e.pointerId !== drag.pointerId) return;
  drag.active = false;
  dragGhost.style.display = 'none';
  dragGhost.classList.remove('enemy');
  document.querySelectorAll('.card').forEach(el => el.classList.remove('hide'));
  const r = arenaWrap.getBoundingClientRect();
  const lx = e.clientX - r.left - view.ox;
  const ly = e.clientY - r.top - view.oy;
  const wx = lx / view.s, wy = ly / view.s;
  const side = drag.side, key = drag.key;
  let valid;
  if(side === 'enemy'){
    valid = wx >= MIN_MARGIN && wx <= W-MIN_MARGIN && wy >= MIN_MARGIN && wy <= PLAYER_LINE - 10;
  } else {
    valid = wx >= MIN_MARGIN && wx <= W-MIN_MARGIN && wy >= PLAYER_LINE + 10 && wy <= H-MIN_MARGIN;
  }
  if(!valid){ SFX.fail(); drag.side = null; drag.key = null; drag.pointerId = null; return; }
  const c = CARDS[key];
  const elixir = side === 'player' ? state.elixirP : state.elixirE;
  if(c.cost > elixir){ SFX.fail(); drag.side = null; drag.key = null; drag.pointerId = null; return; }
  if(side === 'player') state.elixirP -= c.cost; else state.elixirE -= c.cost;
  startPlacement(side, key, wx, wy);
  SFX.pick();
  drag.side = null; drag.key = null; drag.pointerId = null;
});

/* ---------- SFX ---------- */
const SFX = {
  ctx:null, on:true,
  init(){ if(this.ctx) return; try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  tone(f,d,t,v,sw){
    if(!this.on || !this.ctx) return;
    try{
      const n = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = t||'sine';
      o.frequency.setValueAtTime(f,n);
      if(sw) o.frequency.exponentialRampToValueAtTime(Math.max(1,sw), n+d);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.linearRampToValueAtTime(v||0.15, n+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, n+d);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(n); o.stop(n+d+0.03);
    }catch(e){}
  },
  noise(d,v,ff,sw){
    if(!this.on || !this.ctx) return;
    try{
      const n = this.ctx.currentTime;
      const len = Math.max(1, Math.floor(this.ctx.sampleRate*d));
      const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const dt = b.getChannelData(0);
      for(let i=0;i<len;i++) dt[i] = Math.random()*2-1;
      const src = this.ctx.createBufferSource(); src.buffer = b;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(ff||1000, n);
      if(sw) f.frequency.exponentialRampToValueAtTime(sw, n+d);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, n);
      g.gain.linearRampToValueAtTime(v||0.12, n+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, n+d);
      src.connect(f); f.connect(g); g.connect(this.ctx.destination);
      src.start(n); src.stop(n+d+0.03);
    }catch(e){}
  },
  pick(){ this.tone(800,.06,'triangle',.07,1200); },
  fail(){ this.tone(180,.14,'sawtooth',.09,90); },
  tongue(){ this.tone(320,.14,'sawtooth',.08,900); },
  arrow(){ this.noise(.05,.08,3000,900); this.tone(1200,.05,'square',.06,2000); },
  zap(){ this.noise(.07,.09,4500,1600); this.tone(700,.06,'sawtooth',.07,1500); },
  sword(){ this.noise(.07,.08,2600,800); this.tone(880,.06,'triangle',.07,1400); },
  throwBomb(){ this.tone(260,.1,'sine',.08,180); },
  hit(){ this.noise(.05,.06,1800,600); },
  big(){ this.tone(90,.32,'sine',.16,40); this.noise(.24,.1,500,100); }
};
['pointerdown','touchstart'].forEach(e => document.addEventListener(e, () => { SFX.init(); SFX.resume(); }, { once:true, passive:true }));

/* ---------- LOOP ---------- */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-lastT)/1000);
  lastT = now;
  update(dt);
  draw();
  updateHUD();
  requestAnimationFrame(loop);
}

buildHands();
layout();
setTimeout(layout, 100);
setTimeout(layout, 400);
requestAnimationFrame(loop);
</script>
</body>
</html>
