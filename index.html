<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dllump Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;background:#0e1621;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#0e1621 0%,#0b121b 100%)}
.hand-row{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px 6px;overflow-x:auto;scrollbar-width:none;position:relative}
.hand-row::-webkit-scrollbar{display:none}
.hand-row.enemy{padding:6px 10px 8px}
.hand-label{position:absolute;left:10px;top:-2px;font-size:8.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#5a6a7c}
.hand-row.enemy .hand-label{color:#8a5a65}
.hand-row.player .hand-label{color:#5a7a99}
.card{position:relative;width:56px;height:76px;border-radius:10px;flex-shrink:0;background:#17212b;border:1px solid rgba(255,255,255,.08);overflow:hidden;cursor:pointer;touch-action:none;transition:transform .15s ease,border-color .15s ease}
.card:active{transform:scale(.94)}
.card.common{border-color:rgba(140,160,180,.35)}
.card.rare{border-color:rgba(90,150,220,.5)}
.card.epic{border-color:rgba(150,110,220,.55)}
.card.legendary{border-color:rgba(220,175,80,.65)}
.card.hide{opacity:.3}
.card.disabled{opacity:.4;pointer-events:none}
.card img{width:100%;height:100%;display:block;object-fit:contain;padding:4px;pointer-events:none}
.card.enemy img{filter:hue-rotate(-40deg) saturate(1.3) brightness(.92)}
.card .cost{position:absolute;top:3px;left:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#2b5278;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#c8e4ff;z-index:2;border:1px solid rgba(140,200,255,.15)}
.card .cost.low{background:#1e4a3a;color:#8fd9b8;border-color:rgba(76,195,138,.2)}
.card .name{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:7px;font-weight:800;color:rgba(245,247,250,.85);letter-spacing:.2px;text-transform:uppercase;z-index:2}
.card .rarity{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;z-index:2}
.card.common .rarity{background:#8a9aab}
.card.rare .rarity{background:#5aa2e0}
.card.epic .rarity{background:#a070e0}
.card.legendary .rarity{background:#d4a24a}
#arenaWrap{flex:1 1 auto;position:relative;width:100%;min-height:0;overflow:hidden;margin:2px 8px}
#cv{position:absolute;display:block;border-radius:12px}
#units{position:absolute;pointer-events:none;overflow:hidden;border-radius:12px}
.unit{position:absolute;left:0;top:0;will-change:transform;transform-origin:center center;pointer-events:none}
.unit img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.unit.enemy img{filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)) hue-rotate(-40deg) saturate(1.3) brightness(.92)}
.unit.evo img{filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)) hue-rotate(255deg) saturate(1.4) brightness(1.05)}
.unit .hp{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:32px;height:3px;border-radius:2px;background:rgba(0,0,0,.6);overflow:hidden}
.unit .hp i{display:block;height:100%;background:#54b8e8;transition:width .15s linear}
.unit.enemy .hp i{background:#e0556b}
.unit.evo .hp i{background:#c8a0ff}
.unit .lvl{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:24px;height:28px;pointer-events:none;display:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.unit .lvl svg{width:100%;height:100%;display:block}
.unit .mark{position:absolute;top:-40px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:#f0b90b;text-shadow:0 2px 4px rgba(0,0,0,.7);pointer-events:none;display:none}
.unit.marked .mark{display:block}
.gun{position:absolute;left:0;top:0;pointer-events:none;transform-origin:center center;will-change:transform;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.gun img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
.gun.mirror img{transform:scaleX(-1)}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:4px 14px 8px}
#elixirTrack{flex:1;height:16px;border-radius:8px;background:#0b121b;border:1px solid rgba(140,200,255,.15);overflow:hidden;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
#elixirFill{height:100%;width:50%;border-radius:7px;position:relative;overflow:hidden;transform-origin:left center;
  background:linear-gradient(180deg,#5aa2d8 0%,#3d7fb8 100%);
  transition:width .12s linear;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
#elixirTrack::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.35) calc(10% - 1px),rgba(0,0,0,.35) 10%);pointer-events:none;border-radius:7px}
#elixirFill.bounce{animation:lineBounce .4s cubic-bezier(.34,1.5,.5,1) 1}
@keyframes lineBounce{0%{transform:scaleX(1)}30%{transform:scaleX(1.13)}60%{transform:scaleX(0.98)}100%{transform:scaleX(1)}}
#elixirNum{min-width:20px;text-align:center;font-size:13px;font-weight:800;color:#b8c4d4;font-variant-numeric:tabular-nums}
#dragGhost{position:fixed;left:0;top:0;width:62px;height:62px;pointer-events:none;display:none;z-index:9999;opacity:.9;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#dragGhost.enemy img{filter:hue-rotate(-40deg) saturate(1.3) brightness(.92)}
#dragGhost img{width:100%;height:100%;display:block;object-fit:contain}
#abilityBtn{position:absolute;left:16px;bottom:22px;width:56px;height:56px;border-radius:50%;display:none;
  align-items:center;justify-content:center;cursor:pointer;z-index:20;touch-action:none;
  background:#22384a;border:none;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.4);border:1px solid rgba(90,150,220,.5);
  transition:transform .12s ease,filter .2s ease}
#abilityBtn.show{display:flex}
#abilityBtn:active{transform:scale(.94)}
#abilityBtn.cd{filter:grayscale(.65) brightness(.6);pointer-events:none}
#abilityBtn img{width:100%;height:100%;object-fit:cover;display:block}
#abilityBtn .cdText{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);
  background:rgba(0,0,0,.55)}
#abilityBtn.cd .cdText{display:flex}
#abilityBtn .lbl{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  font-size:7px;font-weight:800;letter-spacing:1px;color:#c8e4ff;
  text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="hand-row enemy" id="enemyHand"><span class="hand-label">Enemy</span></div>
  <div id="arenaWrap">
    <canvas id="cv"></canvas>
    <div id="units"></div>
    <div id="abilityBtn"><img id="abilityIcon" src="" alt=""><div class="cdText">0</div><span class="lbl">RIDE</span></div>
  </div>
  <div id="hud">
    <div id="elixirTrack"><div id="elixirFill"></div></div>
    <div id="elixirNum">5</div>
  </div>
  <div class="hand-row player" id="playerHand"><span class="hand-label">You</span></div>
</div>
<div id="dragGhost"><img src="" alt=""></div>

<script>
'use strict';

const GIF = {
  frog:      'https://i.postimg.cc/vmv8BgZy/ezgif-6a209cbdb9670fbd.gif',
  pepe:      'https://i.postimg.cc/vZg4sqNh/ezgif-731108219aa0df74.gif',
  knight:    'https://i.postimg.cc/c1k1L7Y5/ezgif-7124ab8b286672fc.gif',
  archer:    'https://i.postimg.cc/WpwHn3V4/ezgif-42ac0fa94feba79e.gif',
  mage:      'https://i.postimg.cc/bvFykX1f/ezgif-6611b82ad94fcfa6.gif',
  bomber:    'https://i.postimg.cc/JzmQ6w3m/ezgif-67d79dd792fbd612.gif',
  berserker: 'https://i.postimg.cc/t45N8rkf/ezgif-66594092a04c05e4.gif',
  vampire:   'https://i.postimg.cc/VNwmVKyV/ezgif-7ea5c48f28c00991.gif',
  paul:      'https://i.postimg.cc/9FFCtpwF/ezgif-4113ebc5948a7fca.gif',
  sheriff:   'https://i.postimg.cc/Pf95bq81/ezgif-5ce311053406b6e6.gif',
  gun:       'https://i.postimg.cc/G38ynVF9/ezgif-81568bb4425aeea2.gif',
  eyeNormal: 'https://i.postimg.cc/05MYxgVy/ezgif-7f90a0972f5690cb.gif',
  eyeEvil:   'https://i.postimg.cc/VkRM4zkX/ezgif-7973976318c3e43c.gif'
};
(function preloadGifs(){
  for(const url of Object.values(GIF)){ const im=new Image(); im.decoding='async'; im.src=url; }
})();

const svgImg = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
function skelSVG(bone, accent, headGear){
  return svgImg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <g stroke="${bone}" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M32 33 L32 46"/><path d="M32 46 L26 58"/><path d="M32 46 L38 58"/>
      <path d="M32 35 L22 43"/><path d="M32 35 L42 43"/>
      <path d="M25 39 L39 39"/><path d="M26 43 L38 43"/>
    </g>
    <ellipse cx="32" cy="20" rx="11" ry="12" fill="${bone}" stroke="${accent}" stroke-width="1.4"/>
    <ellipse cx="27.5" cy="19" rx="3.1" ry="3.6" fill="#141a22"/>
    <ellipse cx="36.5" cy="19" rx="3.1" ry="3.6" fill="#141a22"/>
    <path d="M29.5 26.5 l2.5 3 l2.5 -3" stroke="#141a22" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    ${headGear}
    <g transform="translate(45,41) rotate(-38)">
      <rect x="-8" y="-1.7" width="6" height="3.4" rx="1" fill="#6a4a20"/>
      <rect x="-3" y="-4.2" width="3.4" height="8.4" rx="1" fill="${accent}"/>
      <path d="M0 -2.2 L17 -1.4 L21 0 L17 1.4 L0 2.2 Z" fill="#e6ecf2" stroke="#8a94a0" stroke-width="0.8"/>
    </g>
  </svg>`);
}
GIF.skel1 = skelSVG('#e8eef2', '#c8d4e0', '');
GIF.skel2 = skelSVG('#dfe6ee', '#f0b90b', '<path d="M20 14 q12 -13 24 0" fill="none" stroke="#f0b90b" stroke-width="3" stroke-linecap="round"/>');
GIF.skel3 = skelSVG('#e8eef2', '#e0556b', '<path d="M21 15 q11 -7 22 0" fill="none" stroke="#c0392b" stroke-width="3.4" stroke-linecap="round"/><path d="M43 15 l9 5 l-7 2 z" fill="#c0392b"/>');

const CARDS = {
  frog:      { key:'frog',      name:'Frog',      cost:3, hp:500,  dmg:80,  attackRange:220, spotRange:280, speed:52,  size:46, gif:GIF.frog,      attackType:'single', rarity:'common' },
  pepe:      { key:'pepe',      name:'Pepe',      cost:4, hp:700,  dmg:45,  attackRange:180, spotRange:260, speed:48,  size:50, gif:GIF.pepe,      attackType:'heal',   rarity:'rare' },
  knight:    { key:'knight',    name:'Knight',    cost:4, hp:1000, dmg:130, attackRange:60,  spotRange:200, speed:55,  size:54, gif:GIF.knight,    attackType:'single', rarity:'rare', shieldHp:340, rangedDamageMult:0.5 },
  archer:    { key:'archer',    name:'Archer',    cost:3, hp:280,  dmg:80,  attackRange:190, spotRange:240, speed:62,  size:48, gif:GIF.archer,    attackType:'single', rarity:'common' },
  mage:      { key:'mage',      name:'Mage',      cost:5, hp:420,  dmg:110, attackRange:150, spotRange:220, speed:46,  size:50, gif:GIF.mage,      attackType:'splash', rarity:'epic' },
  bomber:    { key:'bomber',    name:'Bomber',    cost:4, hp:420,  dmg:85,  attackRange:120, spotRange:200, speed:56,  size:48, gif:GIF.bomber,    attackType:'splash', rarity:'rare' },
  berserker: { key:'berserker', name:'Berserker', cost:5, hp:950,  dmg:110, attackRange:60,  spotRange:200, speed:58,  size:56, gif:GIF.berserker, attackType:'splash', rarity:'epic' },
  vampire:   { key:'vampire',   name:'Vampire',   cost:5, hp:520,  dmg:90,  attackRange:140, spotRange:220, speed:44,  size:50, gif:GIF.vampire,   attackType:'single', rarity:'epic' },
  skeletons: { key:'skeletons', name:'Skeletons', cost:2, hp:140,  dmg:34,  attackRange:44,  spotRange:230, speed:82,  size:30, gif:GIF.skel1, gifs:[GIF.skel1,GIF.skel2,GIF.skel3], attackType:'single', rarity:'common', count:3 },
  tower:     { key:'tower',     name:'Evil Eye',  cost:5, hp:800,  dmg:0,   attackRange:200, spotRange:200, speed:0,   size:42, gif:GIF.eyeNormal, evilGif:GIF.eyeEvil, attackType:'beam', rarity:'epic', tower:true, maxBeams:2, maxDps:170 },
  paul:      { key:'paul',      name:'Paul',      cost:6, hp:900,  dmg:110, attackRange:70,  spotRange:240, speed:80,  size:58, gif:GIF.paul,      attackType:'single', rarity:'legendary', hero:true, abilityCost:2, abilityCooldown:4 },
  sheriff:   { key:'sheriff',   name:'Sheriff',   cost:5, hp:560,  dmg:42,  attackRange:200, spotRange:300, speed:52,  size:54, gif:GIF.sheriff,   attackType:'single', rarity:'legendary', hero:true, abilityCost:3, abilityCooldown:9 }
};
const ALL = ['frog','pepe','knight','archer','mage','bomber','berserker','vampire','skeletons','tower','paul','sheriff'];

const W = 360, H = 540;
const PLAYER_LINE = H * 0.5;
const MIN_MARGIN = 22;

const arenaWrap = document.getElementById('arenaWrap');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const unitsEl = document.getElementById('units');
const playerHandEl = document.getElementById('playerHand');
const enemyHandEl = document.getElementById('enemyHand');
const elixirFill = document.getElementById('elixirFill');
const elixirNum = document.getElementById('elixirNum');
const elixirTrack = document.getElementById('elixirTrack');
const dragGhost = document.getElementById('dragGhost');
const dragGhostImg = dragGhost.querySelector('img');
const abilityBtn = document.getElementById('abilityBtn');
const abilityIcon = document.getElementById('abilityIcon');
const abilityCdText = abilityBtn.querySelector('.cdText');
const abilityLbl = abilityBtn.querySelector('.lbl');

const view = { s:1, dpr:1, ox:0, oy:0 };

function layout(){
  const r = arenaWrap.getBoundingClientRect();
  if(r.width < 40 || r.height < 40) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const aspect = W/H;
  let cssW, cssH;
  if(r.width/r.height < aspect){ cssW = r.width; cssH = cssW/aspect; }
  else { cssH = r.height; cssW = cssH*aspect; }
  const ox = (r.width - cssW)/2;
  const oy = (r.height - cssH)/2;
  cv.style.left = ox+'px'; cv.style.top = oy+'px';
  cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  unitsEl.style.left = ox+'px'; unitsEl.style.top = oy+'px';
  unitsEl.style.width = cssW+'px'; unitsEl.style.height = cssH+'px';
  view.s = cssW/W; view.dpr = dpr; view.ox = ox; view.oy = oy;
  ctx.setTransform(dpr*view.s, 0, 0, dpr*view.s, 0, 0);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

const state = {
  time: 0, elixirP: 5, elixirE: 5, elixirMax: 10, elixirRate: 1/2.8,
  units: [], fx: [], particles: [], floaters: [], nextId: 1,
  knightPlacements: { player: 0, enemy: 0 }
};

const shake = { x:0, y:0, t:0, mag:0 };
function addShake(mag, dur){ shake.mag = Math.max(shake.mag, mag); shake.t = Math.max(shake.t, dur); }
function updateShake(dt){
  if(shake.t > 0){
    shake.t -= dt;
    const p = Math.max(0, shake.t);
    shake.x = (Math.random()-0.5) * shake.mag * p * 2;
    shake.y = (Math.random()-0.5) * shake.mag * p * 2;
    if(shake.t <= 0){ shake.mag = 0; shake.x = 0; shake.y = 0; }
  }
}

const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a + (b-a)*t;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const ang = (a,b) => Math.atan2(b.y-a.y, b.x-a.x);

function addRing(x,y,r,color,life){ state.fx.push({ type:'ring', x,y,r,color,life,maxLife:life }); }
function addSlash(x,y,angle,size,color,life){ state.fx.push({ type:'slash', x,y,angle,size,color,life,maxLife:life }); }
function addLightning(x1,y1,x2,y2,color,life){ state.fx.push({ type:'lightning', x1,y1,x2,y2,color,life,maxLife:life }); }
function addBeam(x1,y1,x2,y2,color,life){ state.fx.push({ type:'beam', x1,y1,x2,y2,color:color||'rgba(240,80,110,.9)',life,maxLife:life }); }
function addExplosion(x,y,r,color,life){ state.fx.push({ type:'explosion', x,y,r,color,life,maxLife:life }); }
function addAfterimage(x,y,color,life,size){ state.fx.push({ type:'after', x,y,color,life,maxLife:life, size: size||6 }); }
function addShieldPop(x,y,r,life){ state.fx.push({ type:'shieldPop', x,y,r,life,maxLife:life }); }
function addBiteMark(x,y,angle,life){ state.fx.push({ type:'biteMark', x,y,angle,life,maxLife:life }); }
function addHeartProjectile(sx,sy,tx,ty,dmg,side,owner,isBlack){
  state.fx.push({ type:'heartProj', x:sx, y:sy, sx, sy, tx, ty, dmg, side, owner, isBlack,
    t:0, dur: Math.hypot(tx-sx,ty-sy)/360, life: 2, maxLife: 2, angle: Math.atan2(ty-sy, tx-sx), done:false });
}
function addFireball(sx,sy,tx,ty,dmg,side,owner){
  state.fx.push({ type:'fireball', x:sx, y:sy, sx, sy, tx, ty, dmg, side, owner,
    t:0, dur: Math.hypot(tx-sx,ty-sy)/320, life: 2, maxLife: 2, angle: Math.atan2(ty-sy, tx-sx), done:false, spin:0 });
}
function addHealPlus(x,y,color){ state.fx.push({ type:'healPlus', x,y, life:0.9, maxLife:0.9, color: color||'#5dff9d' }); }
function addParticles(x,y,count,color,speed,life){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = speed*(0.4+Math.random()*0.6);
    state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life,maxLife:life,color,size:1.6+Math.random()*1.6});
  }
}
function addFloater(x,y,text,color){ state.floaters.push({x,y,text,color,life:.85,maxLife:.85}); }

function addHitEffect(x, y, color, power, angle){
  state.fx.push({ type:'hitRing', x, y, r: 12 + power*10, color, life: 0.28, maxLife: 0.28 });
  const count = 4 + Math.floor(power*3);
  const baseA = angle != null ? angle : Math.random()*Math.PI*2;
  for(let i=0;i<count;i++){
    const a = baseA + (Math.random()-0.5) * Math.PI * 1.0;
    const spd = 70 + Math.random()*100;
    state.particles.push({
      x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 30,
      life: 0.25 + Math.random()*0.1, maxLife: 0.35, color, size: 1.4 + Math.random()*1.2
    });
  }
}

function fxUpdate(dt){
  for(let i=state.fx.length-1;i>=0;i--){ state.fx[i].life-=dt; if(state.fx[i].life<=0) state.fx.splice(i,1); }
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 180*dt; p.vx *= .95; p.life -= dt;
    if(p.life<=0) state.particles.splice(i,1);
  }
  for(let i=state.floaters.length-1;i>=0;i--){
    const f = state.floaters[i]; f.y -= 34*dt; f.life -= dt;
    if(f.life<=0) state.floaters.splice(i,1);
  }
}
function drawHeartShape(c, x, y, size, color, strokeColor, isBlack){
  c.save();
  c.translate(x, y);
  c.beginPath();
  const s = size;
  c.moveTo(0, s*0.35);
  c.bezierCurveTo(-s, -s*0.35, -s*0.55, -s, 0, -s*0.55);
  c.bezierCurveTo(s*0.55, -s, s, -s*0.35, 0, s*0.35);
  c.closePath();
  c.fillStyle = color;
  c.fill();
  if(isBlack){
    c.fillStyle = 'rgba(255,80,120,.7)';
    c.beginPath(); c.arc(0, -s*0.1, s*0.14, 0, Math.PI*2); c.fill();
  }
  c.restore();
}
function drawShootMarkUnit(c, u){
  if(u.shootMark <= 0) return;
  const t = Math.min(1, u.shootMark / 1.6);
  const p = 1 - t;
  c.save();
  c.translate(u.x, u.y - u.size*0.55);
  const scale = p < 0.15 ? (p/0.15)*1.3 : 1.3 - Math.min(0.3, (p-0.15)*0.8);
  c.scale(scale, scale);
  c.globalAlpha = Math.min(1, t*1.6);
  c.strokeStyle = '#e05060';
  c.lineWidth = 1.6;
  c.beginPath(); c.arc(0, 0, 7, 0, Math.PI*2); c.stroke();
  c.beginPath(); c.arc(0, 0, 2.4, 0, Math.PI*2); c.stroke();
  c.beginPath();
  c.moveTo(-9,0); c.lineTo(-3,0); c.moveTo(3,0); c.lineTo(9,0);
  c.moveTo(0,-9); c.lineTo(0,-3); c.moveTo(0,3); c.lineTo(0,9);
  c.stroke();
  c.restore();
  c.globalAlpha = 1;
}
function fxDraw(c){
  for(const f of state.fx){
    const t = f.life/f.maxLife;
    const p = 1-t;
    if(f.type === 'ring'){
      c.globalAlpha = t*.55;
      c.strokeStyle = f.color;
      c.lineWidth = 1.6*t + .4;
      c.beginPath(); c.arc(f.x,f.y,4 + p*f.r, 0, Math.PI*2); c.stroke();
    } else if(f.type === 'slash'){
      c.globalAlpha = t*.85;
      c.save(); c.translate(f.x,f.y); c.rotate(f.angle);
      c.strokeStyle = f.color;
      c.lineWidth = 3.6*t; c.lineCap = 'round';
      c.beginPath(); c.arc(0,0,f.size,-.8,.8); c.stroke();
      c.globalAlpha = t*.5;
      c.strokeStyle = '#ffffff';
      c.lineWidth = 1.1*t;
      c.beginPath(); c.arc(0,0,f.size*.98,-.65,.65); c.stroke();
      c.restore();
    } else if(f.type === 'hitRing'){
      const e = 1-t;
      c.globalAlpha = t*0.7;
      c.strokeStyle = f.color;
      c.lineWidth = 2.4*t + 0.5;
      c.beginPath(); c.arc(f.x, f.y, f.r * (0.35 + e*0.9), 0, Math.PI*2); c.stroke();
    } else if(f.type === 'lightning'){
      c.globalAlpha = t;
      c.strokeStyle = f.color;
      c.lineWidth = 2*t + .6;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(f.x1,f.y1);
      const dx = f.x2-f.x1, dy = f.y2-f.y1;
      const len = Math.hypot(dx,dy);
      const segs = Math.max(3, Math.floor(len/14));
      for(let i=1;i<=segs;i++){
        const t2 = i/segs;
        const jx = (i<segs) ? (Math.random()-.5)*6 : 0;
        const jy = (i<segs) ? (Math.random()-.5)*6 : 0;
        c.lineTo(f.x1 + dx*t2 + jx, f.y1 + dy*t2 + jy);
      }
      c.stroke();
    } else if(f.type === 'beam'){
      c.globalAlpha = t;
      c.strokeStyle = f.color;
      c.lineWidth = 4*t; c.lineCap = 'round';
      c.beginPath(); c.moveTo(f.x1,f.y1); c.lineTo(f.x2,f.y2); c.stroke();
      c.globalAlpha = t*.7;
      c.strokeStyle = 'rgba(255,255,255,.85)';
      c.lineWidth = 1.4*t;
      c.beginPath(); c.moveTo(f.x1,f.y1); c.lineTo(f.x2,f.y2); c.stroke();
    } else if(f.type === 'heartProj'){
      c.globalAlpha = 1;
      drawHeartShape(c, f.x, f.y, 8, f.isBlack ? '#20242c' : '#ff5a9a', null, f.isBlack);
    } else if(f.type === 'fireball'){
      c.globalAlpha = 1;
      c.save();
      c.translate(f.x, f.y); c.rotate(f.spin);
      const g = c.createRadialGradient(-1,-1,1,0,0,6);
      g.addColorStop(0,'#ffd090'); g.addColorStop(.5,'#e07830'); g.addColorStop(1,'#8a3010');
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, 6, 0, Math.PI*2); c.fill();
      c.restore();
    } else if(f.type === 'explosion'){
      c.globalAlpha = t*0.75;
      const g = c.createRadialGradient(f.x,f.y,2,f.x,f.y,f.r*(1-p*.4));
      g.addColorStop(0,'rgba(230,180,110,.85)');
      g.addColorStop(.5,'rgba(200,120,60,.5)');
      g.addColorStop(1,'rgba(120,60,30,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(f.x,f.y,f.r*(1-p*.4),0,Math.PI*2); c.fill();
    } else if(f.type === 'after'){
      c.globalAlpha = t*.35;
      c.fillStyle = f.color;
      c.beginPath(); c.arc(f.x,f.y,(f.size||6)*t,0,Math.PI*2); c.fill();
    } else if(f.type === 'shieldPop'){
      let scale;
      if(p < 0.18) scale = (p/0.18)*0.9;
      else if(p < 0.34) scale = 0.9 + ((p-0.18)/0.16)*0.18;
      else scale = 1.08 - Math.min(0.08, (p-0.34)*0.4);
      const alpha = p < 0.6 ? 1 : 1 - (p-0.6)/0.4;
      const r = f.r * 0.85 * scale;
      c.save();
      c.translate(f.x, f.y - 2);
      c.globalAlpha = alpha * 0.95;
      function hexPath(radius){
        c.beginPath();
        for(let i=0;i<6;i++){
          const a = -Math.PI/2 + i * Math.PI/3;
          const px = Math.cos(a) * radius;
          const py = Math.sin(a) * radius * 1.1;
          if(i===0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.closePath();
      }
      hexPath(r);
      c.fillStyle = 'rgba(70,120,180,'+(0.28*alpha)+')';
      c.fill();
      c.strokeStyle = 'rgba(180,215,255,'+(0.9*alpha)+')';
      c.lineWidth = 1.8;
      c.stroke();
      hexPath(r*0.72);
      c.strokeStyle = 'rgba(200,225,255,'+(0.45*alpha)+')';
      c.lineWidth = 1;
      c.stroke();
      c.strokeStyle = 'rgba(215,235,255,'+(0.8*alpha)+')';
      c.lineWidth = 1.6;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(0, -r*0.55); c.lineTo(0, r*0.55);
      c.moveTo(-r*0.4, 0); c.lineTo(r*0.4, 0);
      c.stroke();
      c.restore();
    } else if(f.type === 'healPlus'){
      c.globalAlpha = t;
      c.fillStyle = f.color;
      const s = 8;
      const rise = (1 - t) * 26;
      c.fillRect(f.x - s*0.18, f.y - rise - s, s*0.36, s*2);
      c.fillRect(f.x - s, f.y - rise - s*0.18, s*2, s*0.36);
    } else if(f.type === 'biteMark'){
      c.save();
      c.translate(f.x, f.y); c.rotate(f.angle);
      const sizeScale = 1 + p*1.2;
      c.globalAlpha = t;
      c.fillStyle = '#ffffff'; c.strokeStyle = '#7a0e1e'; c.lineWidth = 0.8;
      const fw = 4 * sizeScale;
      const fh = 7.5 * sizeScale;
      for(const side of [-1, 1]){
        c.beginPath();
        c.moveTo(side*3.2, -1);
        c.lineTo(side*3.2 - fw*0.5, -1);
        c.lineTo(side*3.2, -1 + fh);
        c.lineTo(side*3.2 + fw*0.5, -1);
        c.closePath(); c.fill(); c.stroke();
      }
      c.fillStyle = 'rgba(190,30,50,'+(t*0.7)+')';
      c.beginPath(); c.arc(-2.4, 4.5, 1.5, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(2.4, 4.5, 1.5, 0, Math.PI*2); c.fill();
      c.restore();
    }
  }
  c.globalAlpha = 1;
  for(const p of state.particles){
    const t = p.life/p.maxLife;
    c.globalAlpha = t*0.85;
    c.fillStyle = p.color;
    c.beginPath(); c.arc(p.x,p.y,p.size*t,0,Math.PI*2); c.fill();
  }
  c.globalAlpha = 1;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for(const f of state.floaters){
    const t = f.life/f.maxLife;
    c.globalAlpha = t;
    c.font = '800 12px -apple-system,sans-serif';
    c.lineWidth = 2.4; c.strokeStyle = 'rgba(0,0,0,.75)';
    c.strokeText(f.text,f.x,f.y);
    c.fillStyle = f.color;
    c.fillText(f.text,f.x,f.y);
  }
  c.globalAlpha = 1;
}

function spawnArrow(sx, sy, tx, ty, dmg, side, owner){
  state.fx.push({ type:'arrow', x:sx, y:sy, sx, sy, tx, ty, dmg, side, owner,
    t:0, dur: Math.hypot(tx-sx,ty-sy)/520, life: 2, maxLife: 2, angle: Math.atan2(ty-sy, tx-sx), done:false });
}
function spawnBomb(sx, sy, tx, ty, dmg, side, owner){
  state.fx.push({ type:'bomb', x:sx, y:sy, sx, sy, tx, ty, dmg, side, owner,
    t:0, dur: 0.65, life: 2, maxLife: 2, spin:0, done:false });
}
function updateProjectiles(dt){
  for(let i=state.fx.length-1;i>=0;i--){
    const f = state.fx[i];
    if(f.type !== 'arrow' && f.type !== 'bomb' && f.type !== 'heartProj' && f.type !== 'fireball') continue;
    f.life -= dt; f.t += dt;
    if(f.done) continue;
    const p = Math.min(1, f.t/f.dur);
    if(f.type === 'arrow'){
      f.x = lerp(f.sx, f.tx, p); f.y = lerp(f.sy, f.ty, p);
      if(p >= 1){
        const foe = f.side === 'player' ? 'enemy' : 'player';
        for(const e of state.units){
          if(!e.alive || e.side !== foe) continue;
          if(dist({x:f.x,y:f.y}, e) < e.size*0.6){
            damageUnit(e, f.dmg, f.owner, true); break;
          }
        }
        f.done = true; f.life = 0;
      }
    } else if(f.type === 'bomb'){
      f.spin += dt*10;
      f.x = lerp(f.sx, f.tx, p);
      f.y = lerp(f.sy, f.ty, p) - Math.sin(p*Math.PI)*50;
      if(p >= 1){
        addExplosion(f.x, f.y, 36, '#c88040', .45);
        addParticles(f.x, f.y, 10, '#c88040', 130, .45);
        addShake(1.6, 0.16);
        SFX.big();
        const foe = f.side === 'player' ? 'enemy' : 'player';
        for(const e of state.units){
          if(!e.alive || e.side !== foe) continue;
          if(dist({x:f.x,y:f.y}, e) < 36 + e.size*0.5) damageUnit(e, f.dmg, f.owner, true);
        }
        f.done = true; f.life = 0;
      }
    } else if(f.type === 'heartProj'){
      f.x = lerp(f.sx, f.tx, p);
      f.y = lerp(f.sy, f.ty, p) - Math.sin(p*Math.PI)*12;
      if(p >= 1){
        const foe = f.side === 'player' ? 'enemy' : 'player';
        for(const e of state.units){
          if(!e.alive || e.side !== foe) continue;
          if(dist({x:f.x,y:f.y}, e) < e.size*0.6){
            if(f.isBlack){ damageUnit(e, f.dmg, f.owner, true); e.acidTimer = 2.5; e.acidDps = 8; }
            else damageUnit(e, f.dmg, f.owner, true);
            break;
          }
        }
        f.done = true; f.life = 0;
      }
    } else if(f.type === 'fireball'){
      f.spin += dt * 8;
      f.x = lerp(f.sx, f.tx, p);
      f.y = lerp(f.sy, f.ty, p) - Math.sin(p*Math.PI)*20;
      if(p >= 1){
        addExplosion(f.x, f.y, 55, '#d88040', .5);
        addParticles(f.x, f.y, 14, '#d88040', 160, .55);
        addShake(2.4, 0.2);
        SFX.big();
        const foe = f.side === 'player' ? 'enemy' : 'player';
        for(const e of state.units){
          if(!e.alive || e.side !== foe) continue;
          if(dist({x:f.x,y:f.y}, e) < 55 + e.size*0.5) damageUnit(e, f.dmg, f.owner, true);
        }
        f.done = true; f.life = 0;
      }
    }
  }
}
function drawProjectiles(c){
  for(const f of state.fx){
    if(f.type === 'arrow'){
      c.save();
      c.translate(f.x, f.y); c.rotate(f.angle);
      c.strokeStyle = '#8a7a5a'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(-6, 0); c.lineTo(6, 0); c.stroke();
      c.fillStyle = '#c8d4e0';
      c.beginPath(); c.moveTo(9,0); c.lineTo(5,-2); c.lineTo(5,2); c.closePath(); c.fill();
      c.restore();
    } else if(f.type === 'bomb'){
      c.save();
      c.translate(f.x, f.y); c.rotate(f.spin);
      const g = c.createRadialGradient(-3,-3,1,0,0,7);
      g.addColorStop(0,'#5a5a5a'); g.addColorStop(1,'#1a1a1a');
      c.fillStyle = g;
      c.beginPath(); c.arc(0,0,7,0,Math.PI*2); c.fill();
      c.fillStyle = '#c88040';
      c.beginPath(); c.arc(0,-8,2,0,Math.PI*2); c.fill();
      c.restore();
    }
  }
}

function spawnUnit(side, key, x, y, variant){
  const c = CARDS[key];
  const gifSrc = (c.gifs && variant != null) ? c.gifs[variant % c.gifs.length] : c.gif;
  const u = {
    id: state.nextId++, side, key, card: c, gif: gifSrc,
    x, y,
    hp: c.hp, maxHp: c.hp,
    dmg: c.dmg,
    attackRange: c.attackRange, spotRange: c.spotRange,
    attackType: c.attackType,
    speed: c.speed, size: c.size,
    level: 1,
    facing: side === 'player' ? -1 : 1,
    shieldHp: c.shieldHp || 0, maxShieldHp: c.shieldHp || 0,
    jumping: false, jumpT: 0,
    jumpFromX: x, jumpFromY: y, jumpToX: x, jumpToY: y, jumpZ: 0,
    hopDur: 0.5, hopHeight: 30,
    moveT: 0,
    sliding: false, slideFromX: 0, slideFromY: 0, slideToX: 0, slideToY: 0,
    slideT: 0, slideDur: 0.3, slideTrailColor: '#c8d4e0', afterSlide: null,
    atkState: 'idle', atkT: 0, atkCd: 0,
    atkTarget: null, atkHeavy: false, comboCount: 0,
    tongue: null, eatAnim: 0,
    spinning: false,
    rageAura: false, raging: false, rageTimer: 0, rageCd: 3 + Math.random()*4,
    pepeState: 'idle', pepeHeartIdx: 0,
    paulState: 'idle', paulT: 0, paulTarget: null, paulCharging: false,
    paulMarkedTargets: [], _paulAbilityIdx: 0, _paulAbilityCharging: false, _paulAbilityT: 0, _paulAbilityPhase: null,
    abilityCd: 0, abilityActive: false,
    zapSeq: null,
    vx: 0, vy: 0, bouncyTimer: 0,
    vampireInvisible: false, vampireCanHeal: false,
    shootSeq: null, shootMark: 0,
    towerBeams: [], evilMode: false,
    stunTimer: 0, acidTimer: 0, acidDps: 0,
    hitFlash: 0, hitDirX: 0, hitDirY: 0, marked: false,
    evo: false, evoBlockT: 0, evoStreak: 0, evoStreakTarget: null, evoLastAtkTime: -10,
    alive: true, el: null, hpEl: null, lvlEl: null
  };
  if(key === 'vampire'){ u.vampireInvisible = true; u.vampireCanHeal = true; }
  if(key === 'knight'){
    state.knightPlacements[side] = (state.knightPlacements[side] || 0) + 1;
    if(state.knightPlacements[side] % 3 === 0){
      u.evo = true;
      u.shieldHp = 0; u.maxShieldHp = 0;
      u.hp = Math.round(c.hp * 0.72);
      u.maxHp = u.hp;
    }
  }
  makeUnitEl(u);

  if(c.hero) addRing(x, y, 40, 'rgba(212,162,74,.65)', .5);
  if(u.evo) addRing(x, y, 44, 'rgba(200,160,255,.7)', .55);

}
function makeUnitEl(u){
  const el = document.createElement('div');
  el.className = 'unit ' + u.side + (u.evo ? ' evo' : '');
  const img = document.createElement('img');
  img.src = u.gif || u.card.gif; img.draggable = false;
  const hp = document.createElement('div');
  hp.className = 'hp';
  const hpi = document.createElement('i');
  hp.appendChild(hpi);
  const lvl = document.createElement('div');
  lvl.className = 'lvl';
  const mark = document.createElement('div');
  mark.className = 'mark';
  mark.textContent = '!';
  el.appendChild(img); el.appendChild(hp); el.appendChild(lvl); el.appendChild(mark);
  unitsEl.appendChild(el);
  u.el = el; u.hpEl = hpi; u.lvlEl = lvl;
}
function updateLvlBadge(u){
  if(u.level > 1){ u.lvlEl.style.display = 'block'; u.lvlEl.innerHTML = LEVEL_SVG(u.level); }
  else { u.lvlEl.style.display = 'none'; }
}
function updateUnitEl(u){
  if(!u.el) return;
  const s = view.s;
  const sz = u.size * s;
  u.el.style.width = sz + 'px';
  u.el.style.height = sz + 'px';
  const px = (u.x - u.size/2) * s;
  const py = (u.y - u.size/2 + u.jumpZ) * s;
  let sqX = 1, sqY = 1, lungeX = 0, lungeY = 0, rot = 0;
  if(u.jumping){
    const p = Math.sin(u.jumpT*Math.PI);
    sqY = 1 + p*.15; sqX = 1 - p*.10;
  }
  if(u.tongue){
    const lean = u.tongue.phase === 'pull' ? .9 : u.tongue.phase === 'out' ? .55 : .35;
    sqX = 1 + .18*lean; sqY = 1 - .10*lean;
    lungeX = u.facing * 4 * lean;
  }
  if(u.eatAnim > 0){
    const p = u.eatAnim;
    const e = 1 + Math.sin(p*Math.PI)*.32;
    sqX *= e; sqY *= e;
  }
  if(u.atkState === 'windup'){
    const rageFast = (u.key === 'berserker' && u.raging) ? 0.4 : 1;
    const dur = (u.atkHeavy ? .24 : .14) * rageFast;
    const p = Math.min(1, u.atkT/dur);
    sqX = 1 - p*.14; sqY = 1 + p*.16;
  } else if(u.atkState === 'strike'){
    const rageFast = (u.key === 'berserker' && u.raging) ? 0.4 : 1;
    const dur = (u.atkHeavy ? .16 : .09) * rageFast;
    const p = Math.min(1, u.atkT/dur);
    sqX = 1.28 - p*.26; sqY = .86 + p*.12;
    lungeX = u.facing * 10 * Math.sin(p*Math.PI);
  } else if(u.atkState === 'recover'){
    const rageFast = (u.key === 'berserker' && u.raging) ? 0.4 : 1;
    const dur = (u.atkHeavy ? .30 : .18) * rageFast;
    const p = Math.min(1, u.atkT/dur);
    sqX = 1 + (1-p)*.05; sqY = 1 - (1-p)*.035;
  }
  if(u.paulCharging){ sqX = 1.15; sqY = .9; lungeX = u.facing * 5; }
  if(u.spinning){ sqX = 1.12; sqY = .92; }
  if(u.key === 'sheriff' && u.shootSeq && (u.shootSeq.phase === 'guns' || u.shootSeq.phase === 'abilityGuns')){
    sqX = 1.05; sqY = .96;
  }
  if(u.evoBlockT > 0){ sqX = 1.04; sqY = .92; }
  if(u.moveT > 0 && u.atkState === 'idle' && !u.jumping && !u.sliding && u.key !== 'tower'){
    const step = Math.sin(state.time * 11 + u.id * 1.7);
    sqY += Math.abs(step)*.045;
    rot = step * 0.055;
  }
  if(u.sliding && u.key !== 'tower'){
    const dirX = (u.slideToX - u.slideFromX);
    const dirY = (u.slideToY - u.slideFromY);
    const l = Math.hypot(dirX, dirY) || 1;
    sqX += Math.abs(dirX/l) * 0.15;
    sqY += Math.abs(dirY/l) * 0.15;
  }
  if(u.hitFlash > 0){
    const p = u.hitFlash / 0.12;
    const stretch = p * 0.22;
    sqX += Math.abs(u.hitDirX) * stretch;
    sqY += Math.abs(u.hitDirY) * stretch;
    lungeX += u.hitDirX * p * 5;
    lungeY += u.hitDirY * p * 5;
  }
  const fx = u.facing >= 0 ? 1 : -1;
  const finalPx = px + lungeX * s;
  const finalPy = py + lungeY * s;
  u.el.style.transform = `translate(${finalPx}px, ${finalPy}px) rotate(${rot}rad) scale(${fx*sqX}, ${sqY})`;
  if(u.hpEl) u.hpEl.style.width = (clamp(u.hp/u.maxHp, 0, 1)*100) + '%';
  u.el.classList.toggle('marked', u.marked);
  if(u.key === 'vampire'){
    const targetAlpha = u.vampireInvisible ? 0.12 : 1;
    u._alpha = u._alpha == null ? targetAlpha : u._alpha + (targetAlpha - u._alpha) * 0.25;
    u.el.style.opacity = u._alpha.toFixed(3);
  }
}
function removeUnitEl(u){
  if(u.el && u.el.parentNode) u.el.parentNode.removeChild(u.el);
  u.el = null;
}

function startSlide(u, toX, toY, dur, color, onDone){
  if(u.card && u.card.tower) return; // towers can't move
  u.sliding = true;
  u.slideFromX = u.x; u.slideFromY = u.y;
  u.slideToX = toX; u.slideToY = toY;
  u.slideT = 0; u.slideDur = dur || 0.3;
  u.slideTrailColor = color || '#c8d4e0';
  u.afterSlide = onDone || null;
}
function updateSlide(u, dt){
  if(!u.sliding) return false;
  u.slideT += dt;
  const p = Math.min(1, u.slideT / u.slideDur);
  u.x = lerp(u.slideFromX, u.slideToX, p);
  u.y = lerp(u.slideFromY, u.slideToY, p);
  u._slideTrailT = (u._slideTrailT || 0) + dt;
  if(u._slideTrailT > 0.05){
    u._slideTrailT = 0;
    addAfterimage(u.x, u.y - u.size*0.05, u.slideTrailColor, 0.3, u.size * 0.2);
  }
  if(p >= 1){
    u.sliding = false;
    u.x = u.slideToX; u.y = u.slideToY;
    const cb = u.afterSlide; u.afterSlide = null;
    if(cb) cb();
  }
  return true;
}
function launchUnit(u, angle, speed, duration){
  if(!u || !u.alive) return;
  if(u.card && u.card.tower) return; // towers can't be launched
  u.vx = Math.cos(angle) * speed;
  u.vy = Math.sin(angle) * speed;
  u.bouncyTimer = duration;
  u.sliding = false; u.jumping = false; u.jumpZ = 0;
  addRing(u.x, u.y, 18, 'rgba(200,140,80,.5)', .35);
  addParticles(u.x, u.y, 6, '#d09060', 120, .4);
}
function cleanupSheriffGuns(u){
  if(!u || !u.shootSeq) return;
  const s = u.shootSeq;
  if(s.currentGun && s.currentGun.el && s.currentGun.el.parentNode) s.currentGun.el.parentNode.removeChild(s.currentGun.el);
  if(s.currentGunPair){
    for(const g of [s.currentGunPair.left, s.currentGunPair.right]){
      if(g && g.el && g.el.parentNode) g.el.parentNode.removeChild(g.el);
    }
  }
  u.shootSeq = null;
}

function damageUnit(t, amount, src, isRanged, silent){
  if(!t || !t.alive) return;
  if(src && src.x !== undefined && !silent){
    const a = Math.atan2(t.y - src.y, t.x - src.x);
    t.hitDirX = Math.cos(a); t.hitDirY = Math.sin(a);
  }
  if(!silent) t.hitFlash = 0.12;

  if(t.key === 'knight' && t.evo){
    if(isRanged){
      if(!silent){
        t.evoBlockT = 0.55;
        addRing(t.x, t.y, 32, 'rgba(200,160,255,.85)', 0.35);
        addParticles(t.x, t.y, 8, '#c8a0ff', 140, 0.4);
        addFloater(t.x, t.y - t.size*0.75, 'BLOCK', '#d0b0ff');
        addShake(1, 0.1);
      } else {
        t.evoBlockT = Math.max(t.evoBlockT, 0.2);
      }
      return;
    } else {
      const reduced = Math.max(1, amount * 0.3);
      t.hp -= reduced;
      if(!silent){
        addFloater(t.x, t.y - t.size*0.7, '-' + Math.round(reduced), '#c8a0ff');
        addSlash(t.x, t.y, src ? ang(src, t) : 0, 22, '#c8a0ff', 0.3);
        addShake(1.2, 0.1);
      }
      if(src && src.alive && src !== t && src.hp !== undefined){
        const reflect = Math.max(1, amount * 0.05);
        src.hp -= reflect;
        if(!silent){
          addFloater(src.x, src.y - src.size*0.65, '-' + Math.round(reflect), '#ff90b0');
          addHitEffect(src.x, src.y, '#ff90b0', 0.6, ang(t, src));
        }
        if(src.hp <= 0) killUnit(src);
      }
      if(t.hp <= 0) killUnit(t);
      return;
    }
  }

  if(t.key === 'knight' && t.shieldHp > 0){
    const shieldDmg = isRanged ? amount * (CARDS.knight.rangedDamageMult || 0.5) : amount;
    const before = t.shieldHp;
    t.shieldHp = Math.max(0, t.shieldHp - shieldDmg);
    const actualToShield = before - t.shieldHp;
    const overflow = shieldDmg - actualToShield;
    if(!silent){
      addShieldPop(t.x, t.y - t.size * 0.05, t.size * 1.35, 0.5);
      addFloater(t.x, t.y - t.size*0.65, '-' + Math.round(actualToShield), isRanged ? '#a8d0f0' : '#f0c890');
    }
    if(overflow > 0){
      t.hp -= overflow;
      if(t.shieldHp <= 0){
        if(!silent){
          addFloater(t.x, t.y - t.size*0.95, 'SHIELD BROKEN', '#d4a24a');
          addRing(t.x, t.y, 42, 'rgba(212,162,74,.55)', .5);
          addParticles(t.x, t.y, 12, '#d4a24a', 160, .55);
          addShake(1.8, 0.16);
        }
        SFX.big();
      }
    } else {
      if(!silent){ addShake(0.5, 0.08); SFX.hit(); }
    }
    if(t.hp <= 0) killUnit(t);
    return;
  }
  t.hp -= amount;
  if(!silent){
    const power = Math.min(2, amount / 55);
    const hitAngle = t.hitDirX ? Math.atan2(t.hitDirY, t.hitDirX) : 0;
    addHitEffect(t.x, t.y, '#e8dcb8', power, hitAngle);
    if(power > 1.0) addShake(power*0.9, 0.1);
    addFloater(t.x, t.y - t.size*.65, String(Math.round(amount)), '#e0d8c0');
  }
  if(t.hp <= 0) killUnit(t);
}
function killUnit(t){
  if(!t.alive) return;
  if(t.shootSeq) cleanupSheriffGuns(t);
  if(t.gunsHeld){
    for(const g of t.gunsHeld){ if(g.el && g.el.parentNode) g.el.parentNode.removeChild(g.el); }
    t.gunsHeld = null;
  }
  t.alive = false;
  addRing(t.x, t.y, 22, 'rgba(190,190,190,.5)', .35);
  addParticles(t.x, t.y, 8, 'rgba(170,170,170,.6)', 110, .45);
  addShake(0.8, 0.1);
  removeUnitEl(t);
}
function eatUnit(u, t){
  t.alive = false; removeUnitEl(t);
  u.eatAnim = 1; u.level += 1;
  u.maxHp = Math.round(u.maxHp*1.22);
  u.hp = Math.min(u.maxHp, u.hp + Math.round(u.maxHp*.3));
  u.dmg = Math.round(u.dmg*1.22);
  u.attackRange = Math.round(u.attackRange*1.07);
  u.size = Math.round(u.size*1.13);
  u.hopDur = Math.max(.34, u.hopDur*.94);
  updateLvlBadge(u);
  addRing(u.x, u.y, 36, 'rgba(84,184,232,.5)', .5);
  addParticles(u.x, u.y, 10, '#54b8e8', 140, .5);
  addFloater(u.x, u.y - 34, 'Lv ' + u.level, '#54b8e8');
  SFX.big();
}
function findNearestEnemy(u){
  const foe = u.side === 'player' ? 'enemy' : 'player';
  let best = null, bd = Infinity;
  for(const e of state.units){
    if(!e.alive || e.side !== foe) continue;
    const d = dist(u, e);
    if(d < bd && d <= u.spotRange){ bd = d; best = e; }
  }
  return best;
}
function countEnemiesInRange(u, r){
  const foe = u.side === 'player' ? 'enemy' : 'player';
  let n = 0;
  for(const e of state.units){
    if(!e.alive || e.side !== foe) continue;
    if(dist(u, e) <= r + e.size*.5) n++;
  }
  return n;
}
function countAliveEnemiesInRange(u, r){
  const foe = u.side === 'player' ? 'enemy' : 'player';
  let n = 0;
  for(const e of state.units){
    if(!e.alive || e.side !== foe) continue;
    if(dist(u, e) <= r) n++;
  }
  return n;
}
function healUnit(u, amount, source){
  if(!u || !u.alive) return;
  if(u.hp >= u.maxHp) return;
  const before = u.hp;
  u.hp = Math.min(u.maxHp, u.hp + amount);
  const actual = u.hp - before;
  if(actual > 0){
    addFloater(u.x, u.y - u.size*0.7, '+' + Math.round(actual), '#5dff9d');
    addHealPlus(u.x - 6, u.y - u.size*0.5, '#5dff9d');
    addHealPlus(u.x + 6, u.y - u.size*0.7, '#7dffb0');
  }
}

/* ---------- Weapon draws ---------- */
function drawKnightSword(c, u){
  if(u.atkState === 'idle' && !u.eatAnim) return;
  const wind = .22, strike = .12, recover = .28;
  let angle;
  if(u.atkState === 'windup') angle = lerp(-0.3, -1.9, Math.min(1, u.atkT/wind));
  else if(u.atkState === 'strike') angle = lerp(-1.9, 0.7, Math.min(1, u.atkT/strike));
  else if(u.atkState === 'recover') angle = lerp(0.7, -0.3, Math.min(1, u.atkT/recover));
  else return;
  const handX = u.x + u.facing * u.size * 0.22;
  const handY = u.y - u.size * 0.12;
  c.save();
  c.translate(handX, handY);
  c.rotate(u.facing > 0 ? angle : Math.PI - angle);
  const bladeG = c.createLinearGradient(0, -3, 0, 3);
  bladeG.addColorStop(0, '#e8eef6'); bladeG.addColorStop(0.5, '#c0c8d4'); bladeG.addColorStop(1, '#8890a0');
  c.fillStyle = bladeG;
  c.beginPath();
  c.moveTo(0, -2.4); c.lineTo(30, -2); c.lineTo(36, 0);
  c.lineTo(30, 2); c.lineTo(0, 2.4); c.closePath(); c.fill();
  c.strokeStyle = '#4a5060'; c.lineWidth = 0.8; c.stroke();
  c.fillStyle = '#a08048'; c.fillRect(-3, -6, 4, 12);
  c.fillStyle = '#3a2818'; c.fillRect(-11, -2, 8, 4);
  c.fillStyle = '#a08048';
  c.beginPath(); c.arc(-12, 0, 2.2, 0, Math.PI*2); c.fill();
  c.restore();
}
function drawEvoKnightSword(c, u){
  const isBlocking = u.evoBlockT > 0;
  const isAttacking = u.atkState === 'windup' || u.atkState === 'strike' || u.atkState === 'recover';
  if(!isBlocking && !isAttacking) return;
  let angle;
  if(isBlocking){
    angle = -Math.PI / 2 + 0.18;
  } else if(u.atkState === 'windup'){
    angle = lerp(-0.55, -2.1, Math.min(1, u.atkT/.22));
  } else if(u.atkState === 'strike'){
    angle = lerp(-2.1, 0.7, Math.min(1, u.atkT/.12));
  } else if(u.atkState === 'recover'){
    angle = lerp(0.7, -0.55, Math.min(1, u.atkT/.28));
  }
  const handX = u.x + u.facing * u.size * 0.24;
  const handY = u.y - u.size * 0.14;
  c.save();
  c.translate(handX, handY);
  c.rotate(u.facing > 0 ? angle : Math.PI - angle);
  const bladeG = c.createLinearGradient(0, -3.5, 0, 3.5);
  bladeG.addColorStop(0, '#f0d8ff'); bladeG.addColorStop(0.5, '#b890e0'); bladeG.addColorStop(1, '#6a3aa0');
  c.fillStyle = bladeG;
  c.beginPath();
  c.moveTo(0, -3.2); c.lineTo(44, -2.8); c.lineTo(54, 0);
  c.lineTo(44, 2.8); c.lineTo(0, 3.2); c.closePath(); c.fill();
  c.strokeStyle = '#3a2050'; c.lineWidth = 1; c.stroke();
  c.fillStyle = '#8050b0'; c.fillRect(-4, -8, 5, 16);
  c.fillStyle = '#2a1530'; c.fillRect(-15, -3, 11, 6);
  c.fillStyle = '#c8a0ff';
  c.beginPath(); c.arc(-17, 0, 2.8, 0, Math.PI*2); c.fill();
  if(isBlocking){
    const p = Math.min(1, u.evoBlockT / 0.55);
    c.strokeStyle = 'rgba(200,160,255,'+(0.85*p)+')';
    c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, 22, -0.85, 0.85); c.stroke();
  } else if(u.atkState === 'strike'){
    const p = Math.min(1, u.atkT/.12);
    c.strokeStyle = 'rgba(200,160,255,'+((1-p)*0.75)+')';
    c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, 30, -0.9, 0.7); c.stroke();
  }
  c.restore();
}
function drawBerserkerAxes(c, u){
  if(u.atkState === 'idle' && !u.raging) return;
  const rageFast = u.raging ? 0.4 : 1;
  const wind = (u.atkHeavy ? .28 : .16) * rageFast;
  const strike = (u.atkHeavy ? .16 : .1) * rageFast;
  const recover = (u.atkHeavy ? .3 : .2) * rageFast;
  let angle;
  if(u.atkState === 'windup') angle = lerp(-0.3, -2.1, Math.min(1, u.atkT/wind));
  else if(u.atkState === 'strike') angle = lerp(-2.1, 0.6, Math.min(1, u.atkT/strike));
  else if(u.atkState === 'recover') angle = lerp(0.6, -0.3, Math.min(1, u.atkT/recover));
  else angle = -0.3;
  const handX = u.x + u.facing * u.size * 0.2;
  const handY = u.y - u.size * 0.15;
  c.save();
  c.translate(handX, handY);
  c.rotate(u.facing > 0 ? angle : Math.PI - angle);
  c.fillStyle = '#5a3a1a'; c.fillRect(-2, -1.8, 24, 3.6);
  c.fillStyle = u.raging ? '#e0a0a0' : '#c8ccd4';
  c.strokeStyle = '#4a4a52'; c.lineWidth = 0.8;
  c.beginPath();
  c.moveTo(22, -1.4); c.lineTo(28, -9); c.lineTo(34, -8);
  c.lineTo(32, 0); c.lineTo(34, 8); c.lineTo(28, 9); c.lineTo(22, 1.4);
  c.closePath(); c.fill(); c.stroke();
  c.restore();
}
function drawArcherBow(c, u){
  const handX = u.x + u.facing * u.size * 0.25;
  const handY = u.y - u.size * 0.08;
  c.save(); c.translate(handX, handY); c.scale(u.facing, 1);
  c.strokeStyle = '#8a6a3a'; c.lineWidth = 2.2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -14); c.quadraticCurveTo(10, 0, 0, 14); c.stroke();
  let pullX = 0;
  if(u.atkState === 'windup') pullX = -(u.atkT/0.4) * 9;
  else if(u.atkState === 'strike') pullX = -9 + (u.atkT/0.08) * 11;
  c.strokeStyle = '#d0c0a0'; c.lineWidth = 0.9;
  c.beginPath(); c.moveTo(0, -14); c.lineTo(pullX, 0); c.lineTo(0, 14); c.stroke();
  c.restore();
}
function drawTinySword(c, u){
  let angle = -0.6;
  if(u.atkState === 'windup') angle = -0.6 - Math.min(1, u.atkT/0.14)*0.7;
  else if(u.atkState === 'strike') angle = -1.3 + Math.min(1, u.atkT/0.07)*1.9;
  else if(u.atkState === 'recover') angle = 0.6 - Math.min(1, u.atkT/0.18)*0.9;
  const handX = u.x + u.facing * u.size*0.20;
  const handY = u.y - u.size*0.02;
  c.save();
  c.translate(handX, handY);
  c.rotate(u.facing > 0 ? angle : Math.PI - angle);
  c.fillStyle = '#6a4a20'; c.fillRect(-4, -1, 5, 2);
  c.fillStyle = '#e6ecf2'; c.strokeStyle = '#8a94a0'; c.lineWidth = 0.6;
  c.beginPath();
  c.moveTo(1, -1.3); c.lineTo(12, -0.9); c.lineTo(14, 0); c.lineTo(12, 0.9); c.lineTo(1, 1.3);
  c.closePath(); c.fill(); c.stroke();
  c.restore();
}
function drawBerserkerRage(c, u){
  if(!u.raging) return;
  const pulse = 0.7 + Math.sin(state.time*14)*0.3;
  c.save();
  const g = c.createRadialGradient(u.x, u.y - u.size*0.05, 5, u.x, u.y - u.size*0.05, u.size*0.95);
  g.addColorStop(0, 'rgba(200,60,60,'+(0.22*pulse)+')');
  g.addColorStop(1, 'rgba(200,60,60,0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(u.x, u.y - u.size*0.05, u.size*0.95, 0, Math.PI*2); c.fill();
  c.restore();
}
function drawStun(c, u){
  if(u.stunTimer <= 0) return;
  const t = state.time;
  for(let i = 0; i < 3; i++){
    const a = t*4 + i * (Math.PI*2/3);
    const sx = u.x + Math.cos(a) * 11;
    const sy = u.y - u.size*0.68 + Math.sin(a) * 3;
    c.save(); c.globalAlpha = 0.8;
    c.fillStyle = '#e0d070'; c.strokeStyle = '#7a5c00'; c.lineWidth = 0.5;
    c.beginPath();
    const r1 = 2.6, r2 = 1.2;
    for(let k = 0; k < 10; k++){
      const ang2 = -Math.PI/2 + k * Math.PI/5;
      const rr = k % 2 === 0 ? r1 : r2;
      const px = sx + Math.cos(ang2) * rr;
      const py = sy + Math.sin(ang2) * rr;
      if(k === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill(); c.stroke(); c.restore();
  }
}
function drawPaulExtra(c, u){
  if(u.paulState === 'spotting'){
    const t = u.paulT / 0.25;
    const scale = 1 + Math.sin(t*Math.PI)*0.3;
    c.save();
    c.translate(u.x, u.y - u.size*0.9);
    c.scale(scale, scale);
    c.fillStyle = '#d4a24a'; c.strokeStyle = '#5a3a00'; c.lineWidth = 1.2;
    c.font = '900 22px -apple-system,sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.strokeText('!', 0, 0); c.fillText('!', 0, 0);
    c.restore();
  }
  if(u.paulCharging || u.abilityActive){
    c.save(); c.globalAlpha = 0.5;
    c.strokeStyle = '#d4a24a'; c.lineWidth = 2; c.lineCap = 'round';
    for(let i = 0; i < 4; i++){
      const offsetY = -8 + i*5;
      const len = 12 + i*4;
      const dirX = u.facing;
      c.beginPath();
      c.moveTo(u.x - dirX*(u.size*0.4 + len), u.y + offsetY);
      c.lineTo(u.x - dirX*u.size*0.4, u.y + offsetY);
      c.stroke();
    }
    c.restore();
  }
}

/* ---------- Frog tongue ---------- */
function drawFrogTongue(c, u){
  const t = u.tongue;
  if(!t) return;
  const mouthX = u.x + u.facing * u.size*.30;
  const mouthY = u.y - u.size*.08;
  const tipX = t.tipX, tipY = t.tipY;
  const midX = (mouthX + tipX)/2;
  const wiggle = Math.sin(state.time*12 + t.seed)*2.5;
  const midY = (mouthY + tipY)/2 + wiggle;
  c.strokeStyle = 'rgba(90,20,40,.55)'; c.lineWidth = 9; c.lineCap = 'round';
  c.beginPath(); c.moveTo(mouthX, mouthY); c.quadraticCurveTo(midX, midY, tipX, tipY); c.stroke();
  const g = c.createLinearGradient(mouthX, mouthY, tipX, tipY);
  g.addColorStop(0, '#8a1030'); g.addColorStop(.4, '#c8283f');
  g.addColorStop(.8, '#e85070'); g.addColorStop(1, '#f090a8');
  c.strokeStyle = g; c.lineWidth = 6;
  c.beginPath(); c.moveTo(mouthX, mouthY); c.quadraticCurveTo(midX, midY, tipX, tipY); c.stroke();
  const pulse = t.phase === 'bite' ? 1.2 : t.phase === 'pull' ? 1.08 : 1;
  c.fillStyle = '#f090a8';
  c.beginPath(); c.ellipse(tipX, tipY, 6*pulse, 4.5*pulse, 0, 0, Math.PI*2); c.fill();
}

/* ---------- Unit updates ---------- */
function frogUpdate(u, dt){
  if(u.atkCd > 0) u.atkCd -= dt;
  if(u.eatAnim > 0) u.eatAnim -= dt;
  if(u.tongue){
    const T = u.tongue;
    const en = T.target;
    T.t += dt;
    if(!en || !en.alive){ u.tongue = null; u.atkCd = .3; return; }
    u.facing = en.x >= u.x ? 1 : -1;
    const mouthX = u.x + u.facing * u.size*.30;
    const mouthY = u.y - u.size*.08;
    const tgtX = en.x - u.facing * en.size*.05;
    const tgtY = en.y - en.size*.1;
    if(T.phase === 'out'){
      const p = Math.min(1, T.t/.18);
      T.tipX = lerp(mouthX, tgtX, p);
      T.tipY = lerp(mouthY, tgtY, p);
      if(p >= 1){
        T.phase = 'pull'; T.t = 0;
        T.originX = en.x; T.originY = en.y;
        T.tipX = tgtX; T.tipY = tgtY;
      }
    } else if(T.phase === 'pull'){
      const p = Math.min(1, T.t/.35);
      const nearX = u.x + u.facing * (u.size*.45 + en.size*.55 + 6);
      const nearY = u.y + 2;
      en.x = lerp(T.originX, nearX, p);
      en.y = lerp(T.originY, nearY, p);
      T.tipX = en.x; T.tipY = en.y - en.size*.1;
      if(p >= 1){
        T.phase = 'bite'; T.t = 0;
        if(en.hp <= u.dmg && !(u.key === 'frog' && u.level >= 5)){
          eatUnit(u, en); u.tongue = null; u.atkCd = .8;
        }
        else {
          damageUnit(en, u.dmg, u, false);
          addSlash(en.x, en.y, ang(u, en) + Math.PI, 16, '#c8d4e0', .25);
        }
      }
    } else if(T.phase === 'bite'){
      const p = Math.min(1, T.t/.15);
      T.tipX = lerp(T.tipX, mouthX, p*.7);
      T.tipY = lerp(T.tipY, mouthY, p*.7);
      if(T.t >= .15){ u.tongue = null; u.atkCd = .6; }
    }
    return;
  }
  if(u.jumping){
    u.jumpT += dt/u.hopDur;
