<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>dllump · ice</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  :root{
    --bg:#0a0a0a;
    --surface:rgba(255,255,255,.05);--surface2:rgba(255,255,255,.08);--surface3:rgba(255,255,255,.12);
    --text:#f5f5f5;--text2:#9a9a9a;--text3:#5a5a5a;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
    --primary:#5b9dff;--gold:#d4b46a;--green:#4CC38A;--red:#e0556b;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
    --r-sm:14px;--r-md:16px;--r-lg:20px;--r-xl:22px;--r-pill:99px;
  }
  html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:440px;margin:0 auto;
    position:relative;background:var(--bg);overflow:hidden;isolation:isolate}
  #app::after{content:'';position:absolute;inset:0;z-index:0;
    background:radial-gradient(circle at 30% 20%, rgba(0,0,0,.22), rgba(0,0,0,.7) 70%);pointer-events:none}
  #app > *{position:relative;z-index:1}

  /* ===== TOPBAR ===== */
  #topbar{display:flex;align-items:center;gap:8px;
    padding:calc(14px + var(--safe-t)) 12px 8px;flex-shrink:0}
  .icon-btn{width:38px;height:38px;border-radius:var(--r-sm);
    border:.5px solid var(--border);background:var(--surface2);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:transform .18s var(--spring),background .2s,color .2s,border-color .2s;
    -webkit-appearance:none;appearance:none;outline:none;position:relative}
  .icon-btn:active{transform:scale(.9);background:var(--surface3)}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
  #cheatBtn.on{color:#0a0a0a;background:linear-gradient(180deg,#f6dd9a,#d4b46a);
    border-color:rgba(240,208,128,.65);
    box-shadow:0 0 22px rgba(240,208,128,.45),inset 0 1px 0 rgba(255,255,255,.55)}
  #cheatBtn.on svg{transform:scale(1.12) rotate(-6deg)}
  #settingsBtn.open{color:#fff;background:rgba(91,157,255,.20);
    border-color:rgba(140,180,255,.5)}
  #settingsBtn.open svg{transform:rotate(35deg)}
  #topbar .title{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px;
    background:linear-gradient(180deg,#fff,#b8c8e0);-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent}
  #topbar .title .caret{display:inline-block;width:1.5px;height:14px;background:#8fb8ff;
    margin-left:2px;vertical-align:-2px;animation:caretBlink 1s steps(1,end) infinite;border-radius:2px}
  @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .balance-pill{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;
    border-radius:var(--r-pill);background:var(--surface2);border:.5px solid var(--border);flex-shrink:0}
  .balance-pill img{width:18px;height:18px;display:block;object-fit:contain}
  .balance-pill span{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

  /* ===== SETTINGS PANEL ===== */
  #settingsPanel{position:absolute;top:calc(58px + var(--safe-t));right:12px;width:236px;
    max-height:70vh;overflow-y:auto;
    background:linear-gradient(180deg,rgba(22,22,24,.98),rgba(10,10,12,.99));
    border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:8px;z-index:60;
    box-shadow:0 20px 50px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;visibility:hidden;transform:translateY(-8px) scale(.94);transform-origin:top right;
    transition:opacity .22s ease,visibility 0s .24s,
               transform .35s var(--spring)}
  #settingsPanel.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);
    transition:opacity .22s ease,visibility 0s,transform .35s var(--spring)}
  .settings-title{font-size:9.5px;font-weight:900;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--text3);padding:6px 10px 8px;
    display:flex;align-items:center;gap:8px}
  .settings-title::after{content:'';flex:1;height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,.10),transparent)}
  .setting-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px;
    border:none;background:transparent;color:var(--text);font-family:inherit;
    font-size:12.5px;font-weight:700;letter-spacing:.1px;cursor:pointer;
    border-radius:14px;transition:background .18s ease;text-align:left;
    -webkit-tap-highlight-color:transparent}
  .setting-row:active{background:rgba(255,255,255,.06)}
  .setting-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch-sm{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.12);position:relative;flex-shrink:0;
    transition:background .25s ease,border-color .25s ease,box-shadow .25s ease}
  .switch-sm .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;
    border-radius:50%;background:linear-gradient(180deg,#fff,#c8d2e2);
    box-shadow:0 2px 6px rgba(0,0,0,.45);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
  .setting-row.active .switch-sm{background:linear-gradient(135deg,#6da9ff,#4a86e8);
    border-color:rgba(140,180,255,.55);box-shadow:0 0 12px rgba(91,157,255,.35)}
  .setting-row.active .switch-sm .knob{transform:translateX(14px)}
  .setting-row.active{color:#fff}

  /* ===== STAGE ===== */
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    padding:8px 12px;min-height:0}
  #cv{display:block;border-radius:24px;touch-action:none}
  #banner{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;
    transform:translate(-50%,-50%) scale(.6);opacity:0;
    font-size:36px;font-weight:900;letter-spacing:-1.2px;
    text-shadow:0 4px 24px rgba(0,0,0,.85);
    transition:transform .45s var(--spring),opacity .3s ease;white-space:nowrap}
  #banner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  #banner.win{color:#bfe0ff;text-shadow:0 0 36px rgba(91,157,255,.95),0 4px 24px rgba(0,0,0,.9)}
  #banner.lose{color:#ff9aa8;text-shadow:0 0 32px rgba(224,85,107,.8),0 4px 24px rgba(0,0,0,.9)}

  /* ===== CONTROLS ===== */
  #controls{flex-shrink:0;padding:8px 12px calc(14px + var(--safe-b));
    display:flex;flex-direction:column;gap:10px;position:relative}

  .row-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{
    padding:12px 8px 10px;border-radius:var(--r-xl);text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.07);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25)}
  .stat .lbl{display:block;font-size:9px;font-weight:900;letter-spacing:1.6px;
    text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:5px}
  .stat .val{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px;
    font-variant-numeric:tabular-nums;color:#fff;transition:color .3s ease,text-shadow .3s ease}

  .slider-box{
    padding:14px 18px 10px;border-radius:var(--r-xl);
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.07);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
    transition:opacity .25s ease}
  .slider-box.locked{opacity:.4;pointer-events:none}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;
    background:transparent;cursor:pointer;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:99px;
    border:none;background:var(--track,rgba(255,255,255,.08));
    box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:48px;height:26px;border-radius:14px;margin-top:-6px;border:none;
    background:linear-gradient(180deg,#fff 0%,#dbe4f0 45%,#b8c4d4 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.6),
               0 0 0 3px var(--thumb-glow,rgba(91,157,255,.18)),
               inset 0 1px 0 rgba(255,255,255,.95);
    transition:transform .15s var(--spring)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.06)}
  input[type=range]::-moz-range-track{height:14px;border-radius:99px;border:none;
    background:var(--track,rgba(255,255,255,.08))}
  input[type=range]::-moz-range-thumb{width:46px;height:24px;border-radius:13px;
    border:none;background:linear-gradient(180deg,#fff 0%,#dbe4f0 45%,#b8c4d4 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.6),
               0 0 0 3px var(--thumb-glow,rgba(91,157,255,.18))}
  .slider-labels{display:flex;justify-content:space-between;
    font-size:9px;font-weight:900;letter-spacing:1.4px;color:rgba(255,255,255,.4);
    margin-top:0;padding:0 3px}

  .chip-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{
    padding:12px 0;border-radius:16px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.03);
    color:rgba(255,255,255,.85);
    font-family:inherit;font-size:12px;font-weight:800;letter-spacing:1.2px;
    text-transform:uppercase;cursor:pointer;
    transition:transform .16s var(--spring),background .2s,border-color .2s,color .2s,box-shadow .2s;
    -webkit-appearance:none;appearance:none;outline:none}
  .chip:active{transform:scale(.94)}
  .chip.active{
    background:linear-gradient(180deg, rgba(91,157,255,.22), rgba(91,157,255,.06));
    border-color:rgba(140,180,255,.5);color:#fff;
    box-shadow:0 0 16px rgba(91,157,255,.22),inset 0 1px 0 rgba(255,255,255,.18)}

  .bet-row{display:flex;gap:8px}
  .bet-field{flex:1;display:flex;align-items:center;gap:9px;padding:0 16px;
    border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
    transition:border-color .2s ease,box-shadow .2s ease,opacity .25s ease}
  .bet-field:focus-within{border-color:rgba(140,180,255,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(91,157,255,.14)}
  .bet-field.locked{opacity:.4;pointer-events:none}
  .bet-field img{width:18px;height:18px;object-fit:contain;flex-shrink:0;opacity:.95}
  .bet-field input{flex:1;min-width:0;height:52px;border:none;background:transparent;
    outline:none;color:#fff;font-family:inherit;font-size:16px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .mini{
    width:52px;height:52px;border-radius:var(--r-xl);
    border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    color:rgba(255,255,255,.8);
    font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
    transition:transform .16s var(--spring),background .2s,color .2s,opacity .25s;
    -webkit-appearance:none;appearance:none;outline:none;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mini:active{transform:scale(.9);background:rgba(255,255,255,.11);color:#fff}
  .mini.locked{opacity:.4;pointer-events:none}

  #action-btn{height:60px;border-radius:var(--r-xl);border:none;width:100%;
    font-family:inherit;font-size:15px;font-weight:900;letter-spacing:.6px;
    cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#6da9ff 0%,#4a86e8 100%);color:#fff;
    box-shadow:0 10px 28px rgba(91,157,255,.42),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .2s var(--spring),box-shadow .25s,background .3s,opacity .25s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    -webkit-appearance:none;appearance:none;outline:none}
  #action-btn:active{transform:scale(.975)}
  #action-btn:disabled{opacity:.4;pointer-events:none;filter:grayscale(.3)}

  /* ===== TOAST ===== */
  #toast{position:fixed;top:calc(14px + var(--safe-t));left:50%;
    transform:translate(-50%,-140%) scale(.86);
    z-index:9999;padding:12px 20px;border-radius:18px;font-size:12.5px;font-weight:800;
    background:linear-gradient(180deg,rgba(56,68,100,.95),rgba(22,28,46,.97));
    border:1px solid rgba(180,210,255,.24);color:#fff;
    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;pointer-events:none;max-width:90vw;text-align:center;
    transition:transform .42s var(--spring),opacity .25s ease}
  #toast.show{transform:translate(-50%,0) scale(1);opacity:1}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <button class="icon-btn" id="cheatBtn" type="button" aria-label="Cheat">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </button>
    <div class="title" id="topbar-title"></div>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="balance-pill">
      <img src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="">
      <span id="balOut">1000</span>
    </div>
  </div>

  <div id="settingsPanel" aria-hidden="true">
    <div class="settings-title">Settings</div>
    <button class="setting-row" data-key="bounce" type="button"><span class="setting-label">Bounce physics</span><span class="switch-sm"><span class="knob"></span></span></button>
    <button class="setting-row" data-key="zoom" type="button"><span class="setting-label">Zoom on stop</span><span class="switch-sm"><span class="knob"></span></span></button>
    <button class="setting-row" data-key="pop" type="button"><span class="setting-label">Stop pop</span><span class="switch-sm"><span class="knob"></span></span></button>
    <button class="setting-row" data-key="outline" type="button"><span class="setting-label">Field outlines</span><span class="switch-sm"><span class="knob"></span></span></button>
    <button class="setting-row" data-key="arrow" type="button"><span class="setting-label">Spin arrow</span><span class="switch-sm"><span class="knob"></span></span></button>
    <button class="setting-row" data-key="glow" type="button"><span class="setting-label">Glow &amp; shadows</span><span class="switch-sm"><span class="knob"></span></span></button>
    <button class="setting-row" data-key="tgIcons" type="button"><span class="setting-label">TG icons overlay</span><span class="switch-sm"><span class="knob"></span></span></button>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
  </div>

  <div id="controls">
    <div class="row-stats">
      <div class="stat"><span class="lbl">Chance</span><span class="val" id="chanceOut">45%</span></div>
      <div class="stat"><span class="lbl">Multiplier</span><span class="val" id="multOut" style="color:#d4b46a">2.16×</span></div>
      <div class="stat"><span class="lbl">Payout</span><span class="val" id="payoutOut">21</span></div>
    </div>

    <div class="slider-box" id="sliderBox">
      <input id="slider" type="range" min="0.05" max="95" step="0.05" value="45">
      <div class="slider-labels"><span>0.05%</span><span>RISK</span><span>95%</span></div>
    </div>

    <div class="chip-row" id="speedRow">
      <button class="chip" data-speed="slow" type="button">Slow</button>
      <button class="chip active" data-speed="normal" type="button">Normal</button>
      <button class="chip" data-speed="fast" type="button">Fast</button>
    </div>

    <div class="bet-row" id="betBox">
      <div class="bet-field" id="betField">
        <img src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="">
        <input id="betInput" type="text" inputmode="numeric" autocomplete="off" value="10">
      </div>
      <button class="mini" data-act="half" type="button">½</button>
      <button class="mini" data-act="double" type="button">2×</button>
      <button class="mini" data-act="max" type="button">MAX</button>
    </div>

    <button id="action-btn" type="button">Upgrade</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

const S=400, R=24, PUCK_R=24, HOUSE=0.03;
const MIN_CHANCE=0.05, MAX_CHANCE=95;

/* Perspective */
const PERSP_K = 0.32, PERSP_TILT = 0.68, PERSP_Y_OFF = -10;
let perspMix = 1;

function project(x, y){
  const depth = y / S;
  const k3d = 1 - PERSP_K * (1 - depth);
  const scale = 1 + (k3d - 1) * perspMix;
  const ty = 1 + (PERSP_TILT - 1) * perspMix;
  return {
    x: S/2 + (x - S/2) * scale,
    y: S/2 + (y - S/2) * ty * scale + PERSP_Y_OFF * perspMix,
    k: scale
  };
}
function effTilt(){ return 1 - (1 - PERSP_TILT) * perspMix; }

const EMPTY_GIF=new Image();
EMPTY_GIF.src='https://i.postimg.cc/DfYMRbty/ezgif-3ae2db2f22c213a2.gif';

/* === TG icons overlay image === */
const TG_ICONS=new Image();
TG_ICONS.crossOrigin='anonymous';
TG_ICONS.src='https://i.postimg.cc/zBX4wFQH/images-(2)-Photoroom.png';

/* Pre-tiled TG icons pattern (built once when image loads) */
const TG_TILE_SIZE = 90;
let tgPatternCanvas = null;
(function buildTgTile(){
  TG_ICONS.onload = () => {
    const c = document.createElement('canvas');
    c.width = TG_TILE_SIZE;
    c.height = TG_TILE_SIZE;
    const g = c.getContext('2d');
    const iw = TG_ICONS.naturalWidth, ih = TG_ICONS.naturalHeight;
    const pad = 10;
    const s = Math.min((TG_TILE_SIZE - pad*2) / iw, (TG_TILE_SIZE - pad*2) / ih);
    const w = iw * s, h = ih * s;
    // top-left
    g.drawImage(TG_ICONS, pad, pad, w, h);
    // top-right (smaller offset)
    g.drawImage(TG_ICONS, TG_TILE_SIZE - pad - w*0.85, pad + h*0.18, w*0.85, h*0.85);
    // bottom-left
    g.drawImage(TG_ICONS, pad + w*0.15, TG_TILE_SIZE - pad - h*0.85, w*0.85, h*0.85);
    // bottom-right
    g.drawImage(TG_ICONS, TG_TILE_SIZE - pad - w*0.9, TG_TILE_SIZE - pad - h*0.9, w*0.9, h*0.9);
    tgPatternCanvas = c;
  };
})();

const DEFAULT_SETTINGS={bounce:false,zoom:true,pop:true,outline:true,arrow:true,glow:true,tgIcons:false};
const settings=Object.assign({},DEFAULT_SETTINGS);
try{const raw=localStorage.getItem('dllump_ice_settings'); if(raw) Object.assign(settings,JSON.parse(raw));}catch(_){}
function saveSettings(){try{localStorage.setItem('dllump_ice_settings',JSON.stringify(settings));}catch(_){}}
function setGlow(c,blur,color){if(settings.glow){c.shadowBlur=blur;c.shadowColor=color;}else{c.shadowBlur=0;c.shadowColor='transparent';}}

function buildPerimeter(size,r,N){
  const segs=[];
  segs.push({t:'l',a:{x:r,y:0},b:{x:size-r,y:0}});
  segs.push({t:'a',c:{x:size-r,y:r},a0:-Math.PI/2,a1:0});
  segs.push({t:'l',a:{x:size,y:r},b:{x:size,y:size-r}});

function buildBilliardPath(start,target){
  let bestValid=null, bestValidDelta=Infinity;
  for(let attempt=0;attempt<20000;attempt++){
    const ix=Math.floor(Math.random()*60)-30;
    const iy=Math.floor(Math.random()*60)-30;
    if(ix===0&&iy===0) continue;
    const sx=Math.random()<0.5?-1:1, sy=Math.random()<0.5?-1:1;
    const U={x:sx*target.x+2*S*ix, y:sy*target.y+2*S*iy};
    const dx=U.x-start.x, dy=U.y-start.y;
    const straight=Math.hypot(dx,dy);
    if(straight<LEN_MIN||straight>LEN_MAX) continue;
    const cuts=[];
    if(Math.abs(dx)>1e-6){
      const k0=Math.ceil(Math.min(start.x,U.x)/S);
      const k1=Math.floor(Math.max(start.x,U.x)/S);
      for(let k=k0;k<=k1;k++){const t=(k*S-start.x)/dx;
        if(t>1e-4&&t<1-1e-4) cuts.push({t});}
    }
    if(Math.abs(dy)>1e-6){
      const k0=Math.ceil(Math.min(start.y,U.y)/S);
      const k1=Math.floor(Math.max(start.y,U.y)/S);
      for(let k=k0;k<=k1;k++){const t=(k*S-start.y)/dy;
        if(t>1e-4&&t<1-1e-4) cuts.push({t});}
    }
    cuts.sort((a,b)=>a.t-b.t);
    let cornerHit=false;
    for(let i=1;i<cuts.length;i++){if(Math.abs(cuts[i].t-cuts[i-1].t)<1e-5){cornerHit=true;break;}}
    if(cornerHit) continue;
    const pts=[{x:start.x,y:start.y}];
    for(const c of cuts){
      const ux=start.x+dx*c.t, uy=start.y+dy*c.t;
      pts.push({x:foldAxis(ux),y:foldAxis(uy)});
    }
    pts.push({x:target.x,y:target.y});
    let bad=false;
    for(let i=1;i<pts.length-1;i++){
      const p=pts[i];
      const nearX=(p.x<R+8||p.x>S-R-8);
      const nearY=(p.y<R+8||p.y>S-R-8);
      if(nearX&&nearY){bad=true; break;}
    }
    if(bad) continue;
    let minSeg=Infinity;
    for(let i=1;i<pts.length;i++){
      const d=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
      if(d<minSeg) minSeg=d;
    }
    if(minSeg<26) continue;
    const cum=[0];
    for(let i=1;i<pts.length;i++)
      cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    const total=cum[cum.length-1];
    if(total<LEN_MIN) continue;
    const delta=Math.abs(total-TARGET_LEN);
    if(delta<bestValidDelta){bestValidDelta=delta; bestValid={pts,cum,total};}
    if(bestValidDelta<50) break;
  }
  if(bestValid) return bestValid;
  const dx=target.x-start.x, dy=target.y-start.y;
  const cum=[0, Math.hypot(dx,dy)];
  return {pts:[{x:start.x,y:start.y},{x:target.x,y:target.y}],cum,total:cum[1]};
}
function pointAtPath(p,d){
  if(d<=0) return {x:p.pts[0].x, y:p.pts[0].y};
  if(d>=p.total){const l=p.pts[p.pts.length-1]; return {x:l.x, y:l.y};}
  let i=0;
  while(i<p.cum.length-2 && p.cum[i+1]<d) i++;
  const seg=p.cum[i+1]-p.cum[i];
  const t=seg>0?(d-p.cum[i])/seg:0;
  const a=p.pts[i], b=p.pts[i+1];
  return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t};
}

  step();
})();

function showBanner(text,win){

function startRoll(){
  if(G.state!=='idle') return;
  closeSettings();
  G.shown=G.chance; G.shownVel=0;
  recomputeField();
  if(G.bet<1){G.bet=10; betInput.value=10; syncUI(); return;}
  if(G.bet>G.balance) return;
  if(!G.winPoly||!G.losePoly) return;
  G.outcome=cheatOn?true:(Math.random()<G.chance);
  G.rollMult=multiplierFor(G.chance);
  G.rollBet=Math.min(G.bet, Math.floor(G.balance));
  G.balance-=G.rollBet;
  const region=G.outcome?G.winPoly:G.losePoly;
  const target=pickTargetPoint(region);
  const path=buildBilliardPath({x:S/2,y:S/2}, target);
  G.path=path;
  G.duration=TOTAL_DURATION*(SPEED_MULT[G.speedMode]||1);
  const dx=path.pts[1].x-path.pts[0].x;
  const dy=path.pts[1].y-path.pts[0].y;
  G.spinFinalAngle=Math.atan2(dy,dx);
  G.spinExtraTurns=3+Math.floor(Math.random()*4);
  G.spinArrowAngle=G.spinFinalAngle-G.spinExtraTurns*2*Math.PI;
  G.spinStart=performance.now();
  G.spinDuration=1.7+Math.random()*0.5;
  G.rollStart=0;
  G.state='spinning';
  G.puck.x=S/2; G.puck.y=S/2;
  G.puckScale=0.55; G.puckAlpha=1;
  G.stopPopStart=0;
  jiggles.length=0; jiggleDisp.fill(0);
  G.rollSegIdx=0; G.lastJiggleIdx=-1;
  G.zoom=1; G.zoomCenterX=S/2; G.zoomCenterY=S/2; G.zoomAtStop=1;
  banner.classList.remove('show');
  haptic('medium');
  syncUI();
}
actionBtn.addEventListener('click',startRoll);

function finishRoll(){
  G.state='done';
  G.flashT=performance.now();
  G.stopPopStart=performance.now();
  G.zoomAtStop=G.zoom;
  if(G.outcome){
    const payout=Math.floor(G.rollBet*G.rollMult);
    G.balance+=payout;
    showBanner('+'+payout.toLocaleString(), true);
    haptic('heavy');
  } else {
    showBanner('−'+G.rollBet.toLocaleString(), false);
    haptic('heavy');
  }
  syncUI();
  clearTimeout(G.doneTimer);
  G.doneTimer=setTimeout(()=>{
    if(G.state!=='done') return;
    G.state='idle';
    G.puck.x=S/2; G.puck.y=S/2;
    G.puckAlpha=0; G.puckScale=0.55;
    G.stopPopStart=0;
    G.zoom=1; G.zoomCenterX=S/2; G.zoomCenterY=S/2;
    randomizeAngle();
    recomputeField();
    if(G.bet>G.balance){G.bet=Math.max(1,Math.floor(G.balance)); betInput.value=G.bet;}
    syncUI();
  },2400);
}

function puckPopScale(t){
  if(t<=0) return 1;
  if(t>=1) return 1;
  if(t<0.28){const k=t/0.28; return 1+0.58*(1-Math.pow(1-k,2));}
  const k=(t-0.28)/0.72;
  const decay=Math.pow(1-k,2.1);
  return 1+0.58*decay*Math.cos(k*Math.PI*2.3);
}

const PUCK_OPTS={
  rimRatio:0.44, outerRatio:0.32,
  rimAlpha:0.95, outerAlpha:0.20, innerGlow:0.10,
  cross:true, crossAlpha:0.28, crossWidth:1.6
};
function drawWhitePuck(c, x, y, r){
  if(r<=0.5) return;
  const scl=r/36;
  const rim=PUCK_OPTS.rimRatio*r, outer=PUCK_OPTS.outerRatio*r;

  c.save(); c.beginPath(); c.lineWidth=outer;
  c.strokeStyle='rgba(255,255,255,'+PUCK_OPTS.outerAlpha+')';
  c.lineCap='round'; c.arc(x,y,r+outer*0.12,0,Math.PI*2); c.stroke(); c.restore();

  c.save(); c.beginPath(); c.lineWidth=rim;
  c.strokeStyle='rgba(255,255,255,'+PUCK_OPTS.rimAlpha+')';
  c.lineCap='round'; c.arc(x,y,r-rim/2,0,Math.PI*2); c.stroke(); c.restore();

  c.save(); c.beginPath(); c.lineWidth=Math.max(1,rim*0.36);
  c.strokeStyle='rgba(0,0,0,0.18)'; c.lineCap='round';
  c.arc(x,y,r-rim*0.9,0,Math.PI*2); c.stroke(); c.restore();

  c.save(); c.beginPath(); c.lineWidth=Math.max(1,rim*0.12);
  c.strokeStyle='rgba(255,255,255,0.12)'; c.lineCap='round';
  c.arc(x,y,r-rim*0.6,0,Math.PI*2); c.stroke(); c.restore();

  if(PUCK_OPTS.cross){
    const L=r*1.9;
    c.save(); c.lineWidth=PUCK_OPTS.crossWidth*(r/20);
    c.strokeStyle='rgba(255,255,255,'+PUCK_OPTS.crossAlpha+')';
    c.beginPath();
    c.moveTo(x-L/2,y); c.lineTo(x+L/2,y);
    c.moveTo(x,y-L/2); c.lineTo(x,y+L/2);
    c.stroke(); c.restore();
  }

  c.save();
  const g=c.createRadialGradient(x-r*0.18,y-r*0.18,1,x,y,r*1.2);
  g.addColorStop(0,'rgba(255,255,255,'+PUCK_OPTS.innerGlow+')');
  g.addColorStop(0.35,'rgba(255,255,255,'+(PUCK_OPTS.innerGlow*0.45)+')');
  g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r-rim*0.6,0,Math.PI*2); c.fill(); c.restore();

  const ca=[-2.35,-0.8,2.35,0.8];
  c.save();
  for(let i=0;i<ca.length;i++){
    const a=ca[i];
    const px=x+Math.cos(a)*(r-rim/2), py=y+Math.sin(a)*(r-rim/2);
    c.save(); c.translate(px,py); c.rotate(a+Math.PI/2);
    const gw=Math.max(8*scl,rim*1.1), gh=Math.max(2*scl,rim*0.26);
    const grad=c.createLinearGradient(-gw/2,0,gw/2,0);
    grad.addColorStop(0,'rgba(255,255,255,0)');
    grad.addColorStop(0.35,'rgba(255,255,255,0.45)');
    grad.addColorStop(0.65,'rgba(255,255,255,0.45)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=grad; c.beginPath();
    c.ellipse(0,0,gw/2,gh/2,0,0,Math.PI*2); c.fill(); c.restore();
  }
  c.restore();

  c.save(); c.beginPath(); c.lineWidth=Math.max(1,rim*0.08);
  c.strokeStyle='rgba(255,255,255,0.04)'; c.arc(x,y,r-rim*0.2,-0.6,0.6); c.stroke(); c.restore();
}

function drawPuckTilted(c, cx, cy, r, tilt){
  c.save();
  c.beginPath();
  c.ellipse(cx + 3, cy + 6, r * 1.05, r * tilt * 1.05, 0, 0, Math.PI*2);
  c.fillStyle = 'rgba(0,0,0,0.5)';
  c.filter = 'blur(4px)';
  c.fill();
  c.filter = 'none';
  c.restore();

  c.save();
  c.translate(cx, cy);
  c.scale(1, tilt);
  drawWhitePuck(c, 0, 0, r);
  c.restore();
}

function drawSpinArrow(c){
  const ctr=project(S/2, S/2);
  const puckR = PUCK_R * G.puckScale * ctr.k;
  const orbit = puckR + 6;
  const triSize=Math.min(S*0.038,11), tipOffset=triSize*0.4;
  const a=G.spinArrowAngle;
  const ty = effTilt();
  c.save();
  c.translate(ctr.x, ctr.y);
  const x1 = Math.cos(a)*(orbit + tipOffset);
  const y1 = Math.sin(a)*(orbit + tipOffset)*ty;
  const bx = Math.cos(a)*(orbit - tipOffset*0.3);
  const by = Math.sin(a)*(orbit - tipOffset*0.3)*ty;
  const px = -Math.sin(a)*triSize*0.5;
  const py = Math.cos(a)*triSize*0.5*ty;
  c.beginPath();
  c.moveTo(x1, y1);
  c.lineTo(bx + px, by + py);
  c.lineTo(bx - px, by - py);
  c.closePath();
  c.fillStyle='#e8f4ff';
  setGlow(c,14,'rgba(180,210,255,.9)');
  c.fill(); c.shadowBlur=0;
  c.strokeStyle='rgba(180,210,255,.45)'; c.lineWidth=1; c.stroke();
  c.restore();
}

function drawEmptyCross(c,x,y,size){
  if(size<4) return;
  c.save();
  c.strokeStyle='rgba(255,255,255,0.52)';
  c.lineWidth=Math.max(1.4,size*0.13);
  c.lineCap='round';
  setGlow(c,size*0.45,'rgba(200,220,255,0.5)');
  c.beginPath();
  c.moveTo(x-size*0.30,y-size*0.30); c.lineTo(x+size*0.30,y+size*0.30);
  c.moveTo(x+size*0.30,y-size*0.30); c.lineTo(x-size*0.30,y+size*0.30);
  c.stroke(); c.restore();
}

function draw(now){
  const c=ctx;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,cssSize,cssSize);
  c.save();
  c.scale(scale,scale);

  c.fillStyle='#050608'; c.fillRect(0,0,S,S);

  const m=multiplierFor(G.chance);
  const fieldHex=chanceToHex(G.shown);

  const rinkPts = (settings.bounce && jiggles.length>0) ? buildJigglePoints(1.0) : PERIM;
  const projRink = projectPoints(rinkPts);
  const rinkPath = pathFromProjected(projRink, true);
  const innerProj = projectPoints(buildJigglePoints(0.965));
  const innerPath = pathFromProjected(innerProj, true);

  const zoomActive=settings.zoom && G.zoom>1.002;
  if(zoomActive){
    const zc = project(G.zoomCenterX, G.zoomCenterY);
    c.save();
    c.translate(zc.x, zc.y);
    c.scale(G.zoom, G.zoom);
    c.translate(-zc.x, -zc.y);
  }

  c.save(); c.fillStyle='#070b14'; c.fill(rinkPath); c.restore();

  c.save(); c.clip(rinkPath);
  c.fillStyle = '#0b1220';
  c.fillRect(0,0,S,S);
  const vg = c.createRadialGradient(S/2,S/2,S*0.15, S/2,S/2,S*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  c.fillStyle = vg;
  c.fillRect(0,0,S,S);

  if(G.losePoly&&G.losePoly.length>=3&&G.loseBB&&G.loseCenter){
    const projLose = projectPoints(G.losePoly);
    const lp = pathFromProjected(projLose, true);
    const lbb = bboxOf(projLose);
    const lw=lbb.x1-lbb.x0, lh=lbb.y1-lbb.y0;
    const lcFull = project(G.loseCenter.x, G.loseCenter.y);
    const lc = { x: lcFull.x, y: lcFull.y };
    const lk = lcFull.k;
    const lg=c.createLinearGradient(lbb.x0,lbb.y0,lbb.x1,lbb.y1);
    lg.addColorStop(0,'#10131c'); lg.addColorStop(0.5,'#181c28'); lg.addColorStop(1,'#0d1018');
    c.fillStyle=lg; c.fill(lp);
    c.strokeStyle='rgba(255,255,255,0.10)';
    c.lineWidth=1.2; c.lineJoin='round'; c.stroke(lp);
    c.textAlign='center'; c.textBaseline='middle';
    if(lw>90&&lh>90){
      const crossSize=Math.min(18,Math.min(lw,lh)*0.14);
      const gs=Math.min(46,lh*0.28,lw*0.28);
      const labelH=14, gap1=9, gap2=6;
      const totalH=crossSize+gap1+labelH+gap2+gs;
      const topY=lc.y-totalH/2;
      drawEmptyCross(c,lc.x,topY+crossSize/2,crossSize);
      c.fillStyle='rgba(230,240,255,0.72)';
      c.font='800 '+Math.round(10.5*lk)+'px -apple-system,system-ui,sans-serif';
      c.fillText('E M P T Y',lc.x,topY+crossSize+gap1+labelH/2);
      if(EMPTY_GIF.complete&&EMPTY_GIF.naturalWidth>0){
        c.save(); c.globalAlpha=0.92;
        c.drawImage(EMPTY_GIF,lc.x-gs/2,topY+crossSize+gap1+labelH+gap2,gs,gs);
        c.restore();
      }
    } else if(lw>50&&lh>50){
      const crossSize=Math.min(14,Math.min(lw,lh)*0.18);
      const labelH=12, gap=6;
      const totalH=crossSize+gap+labelH;
      const topY=lc.y-totalH/2;
      drawEmptyCross(c,lc.x,topY+crossSize/2,crossSize);
      c.fillStyle='rgba(230,240,255,0.65)';
      c.font='800 '+Math.round(8.5*lk)+'px -apple-system,system-ui,sans-serif';
      c.fillText('EMPTY',lc.x,topY+crossSize+gap+labelH/2);
    } else if(lw>30&&lh>30){
      drawEmptyCross(c,lc.x,lc.y,Math.min(12,Math.min(lw,lh)*0.28));
    } else {
      drawEmptyCross(c,lc.x,lc.y,Math.min(9,Math.min(lw,lh)*0.35));
    }
  }

  if(G.winPoly&&G.winPoly.length>=3&&G.winBB&&G.winCenter){
    const projWin = projectPoints(G.winPoly);
    const wp = pathFromProjected(projWin, true);
    const wbb = bboxOf(projWin);
    const wcFull = project(G.winCenter.x, G.winCenter.y);
    const wc = { x: wcFull.x, y: wcFull.y };
    const wk = wcFull.k;
    const ww=wbb.x1-wbb.x0, wh=wbb.y1-wbb.y0;
    const wg=c.createLinearGradient(wbb.x0,wbb.y0,wbb.x1,wbb.y1);
    wg.addColorStop(0,lighten(fieldHex,42));
    wg.addColorStop(0.5,fieldHex);
    wg.addColorStop(1,lighten(fieldHex,18));
    c.fillStyle=wg; c.fill(wp);

    /* === TG ICONS OVERLAY — repeated tile pattern === */
    if(settings.tgIcons && tgPatternCanvas){
      c.save();
      c.clip(wp);
      const pat = c.createPattern(tgPatternCanvas, 'repeat');
      if(pat){
        c.globalAlpha = 0.32;
        c.fillStyle = pat;
        // fill the bbox in screen space
        c.fillRect(wbb.x0 - 100, wbb.y0 - 100, ww + 200, wh + 200);
        c.globalAlpha = 1;
      }
      c.restore();
    }
    /* ============================================ */

    if(settings.outline){
      c.save();
      if(G.state!=='rolling'&&G.state!=='spinning') setGlow(c,12,'rgba(180,215,255,0.55)');
      c.strokeStyle='rgba(255,255,255,0.88)';
      c.lineWidth=2; c.lineJoin='round'; c.stroke(wp);
      c.restore();
      const corners=findBboxCorners(G.winPoly);
      for(const corner of corners){
        if(!corner) continue;
        const pc = project(corner.x, corner.y);
        const br=Math.min(30,Math.min(ww,wh)*0.28);
        if(br<=1) continue;
        const rg=c.createRadialGradient(pc.x,pc.y,0,pc.x,pc.y,br);
        rg.addColorStop(0,'rgba(255,255,255,0.46)');
        rg.addColorStop(0.45,'rgba(255,255,255,0.13)');
        rg.addColorStop(1,'rgba(255,255,255,0)');
        c.fillStyle=rg; c.beginPath(); c.arc(pc.x,pc.y,br,0,Math.PI*2); c.fill();
      }
    }
    c.textAlign='center'; c.textBaseline='middle';
    if(ww>80&&wh>60){
      const labelH=12, multH=26, gap=2;
      const totalH=labelH+gap+multH;
      const topY=wc.y-totalH/2;
      c.fillStyle='rgba(255,255,255,0.92)';
      c.font='800 '+Math.round(10.5*wk)+'px -apple-system,system-ui,sans-serif';
      c.fillText('W I N',wc.x,topY+labelH/2);
      c.fillStyle='rgba(255,255,255,1)';
      c.font='900 '+Math.round(24*wk)+'px -apple-system,system-ui,sans-serif';
      c.fillText('×'+m.toFixed(2),wc.x,topY+labelH+gap+multH/2);
    } else if(ww>46&&wh>30){
      c.fillStyle='rgba(255,255,255,1)';
      c.font='900 '+Math.round(15*wk)+'px -apple-system,system-ui,sans-serif';
      c.fillText('×'+m.toFixed(2),wc.x,wc.y);
    } else if(ww>26&&wh>18){
      c.fillStyle='rgba(255,255,255,0.95)';
      c.font='900 '+Math.round(10*wk)+'px -apple-system,system-ui,sans-serif';
      c.fillText('×'+m.toFixed(1),wc.x,wc.y);
    }
  }

  if(G.state==='done'){
    const age=(now-G.flashT)/1000;
    if(age<1.0){
      const a=(1-age)*0.32;
      c.fillStyle=G.outcome?'rgba(120,190,255,'+a+')':'rgba(224,85,107,'+(a*0.85)+')';
      c.fillRect(0,0,S,S);
    }
  }
  c.restore();

  c.save();
  setGlow(c,38,'rgba(140,180,255,0.55)');
  c.strokeStyle='rgba(180,210,255,0.15)';
  c.lineWidth=22; c.lineJoin='round'; c.stroke(rinkPath);
  c.restore();
  c.save();
  setGlow(c,20,'rgba(120,170,255,0.55)');
  c.strokeStyle='rgba(150,190,255,0.42)';
  c.lineWidth=10; c.lineJoin='round'; c.stroke(rinkPath);
  c.restore();
  c.save();
  c.strokeStyle='rgba(255,255,255,0.95)';
  c.lineWidth=2.2; c.lineJoin='round'; c.stroke(rinkPath);
  c.restore();

  if(settings.outline){
    c.save(); c.strokeStyle='rgba(255,255,255,0.20)'; c.lineWidth=1.1;
    c.lineJoin='round'; c.stroke(innerPath); c.restore();
  }

  if(settings.arrow&&G.state==='spinning') drawSpinArrow(c);

  if(G.puckAlpha>0.01){
    let popScale=1;
    if(settings.pop&&G.state==='done'&&G.stopPopStart>0){
      const age=(now-G.stopPopStart)/1000;
      const t=Math.min(1,age/G.stopPopDuration);
      popScale=puckPopScale(t);
    }
    const ctr = project(G.puck.x, G.puck.y);
    const puckR = PUCK_R * G.puckScale * popScale * ctr.k;
    const tilt = effTilt();
    c.save();
    c.globalAlpha = G.puckAlpha;
    drawPuckTilted(c, ctr.x, ctr.y, puckR, tilt);
    c.restore();
  }

  if(zoomActive) c.restore();
  c.restore();
}

let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05, (now-lastT)/1000||0.016);
  lastT=now; const nowSec=now/1000;

  if(G.state==='idle'){
    const before=G.shown;
    stepFieldSpring(dt);
    if(Math.abs(G.shown-before)>0.00005){ syncFieldColorUI(); }
    if(Math.abs(G.shown-G.lastShown)>0.0025){ recomputeField(); }
  }

  if(G.state==='spinning'){
    const t=(now-G.spinStart)/1000/G.spinDuration;
    if(t>=1){
      G.spinArrowAngle=G.spinFinalAngle;
      G.state='rolling'; G.rollStart=now;
    } else {
      const e=1-Math.pow(1-t,3);
      G.spinArrowAngle=G.spinFinalAngle-(1-e)*G.spinExtraTurns*2*Math.PI;
    }
  }
  if(G.state==='rolling'){
    const elapsed=(now-G.rollStart)/1000;
    const u=Math.min(1,elapsed/G.duration);
    const dist=G.path.total*distFrac(u);
    if(u>=1){
      const last=G.path.pts[G.path.pts.length-1];
      G.puck.x=last.x; G.puck.y=last.y;
      finishRoll();
    } else {
      const p=pointAtPath(G.path,dist);
      G.puck.x=p.x; G.puck.y=p.y;
    }
    if(G.puckScale<1) G.puckScale=Math.min(1,G.puckScale+dt*3.4);
    if(settings.bounce){
      let segIdx=0; const pts=G.path.pts;
      while(segIdx<G.path.cum.length-2 && G.path.cum[segIdx+1]<=dist) segIdx++;
      if(segIdx>G.rollSegIdx){
        for(let s=G.rollSegIdx+1;s<=segIdx;s++){
          if(s<=0||s>=pts.length-1) continue;
          const bp=pts[s]; if(!bp) continue;
          const idx=findNearestPerimIdx(bp.x,bp.y);
          if(idx===G.lastJiggleIdx) continue;
          G.lastJiggleIdx=idx;
          const phase=u<=U1?1:(1-((u-U1)/(1-U1))*0.7);
          const intensity=(4+Math.random()*3)*phase;
          spawnJiggle(idx,intensity);
        }
        G.rollSegIdx=segIdx;
      } else if(segIdx<G.rollSegIdx){ G.rollSegIdx=segIdx; }
    }
    if(settings.zoom){
      const zoomStartAt=Math.max(0,G.duration-ZOOM_LEAD);
      if(elapsed>=zoomStartAt){
        const zp=Math.min(1,(elapsed-zoomStartAt)/ZOOM_IN_DURATION);
        const ze=easeOutCubic(zp);
        G.zoom=1+(ZOOM_MAX-1)*ze;
      } else G.zoom=1;
      if(G.zoom>1.002){
        const followRate=Math.min(1,dt*9);
        G.zoomCenterX+=(G.puck.x-G.zoomCenterX)*followRate;
        G.zoomCenterY+=(G.puck.y-G.zoomCenterY)*followRate;
      }
    } else G.zoom=1;
  }
  if(G.state==='done'){
    if(settings.zoom){
      const sinceStop=(now-G.stopPopStart)/1000;
      if(sinceStop<ZOOM_OUT_DELAY){ G.zoom=G.zoomAtStop; }
      else {
        const t=Math.min(1,(sinceStop-ZOOM_OUT_DELAY)/ZOOM_OUT_DURATION);
        const e=easeInOutCubic(t);
        G.zoom=G.zoomAtStop-(G.zoomAtStop-1)*e;
      }
      if(G.zoom>1.002){
        const followRate=Math.min(1,dt*9);
        G.zoomCenterX+=(G.puck.x-G.zoomCenterX)*followRate;
        G.zoomCenterY+=(G.puck.y-G.zoomCenterY)*followRate;
      }
    } else G.zoom=1;
  }
  if(G.state==='idle'){
    if(G.puckScale<1) G.puckScale=Math.min(1,G.puckScale+dt*2.6);
    if(G.puckAlpha<1) G.puckAlpha=Math.min(1,G.puckAlpha+dt*3.4);
    G.puck.x+=(S/2-G.puck.x)*Math.min(1,dt*12);
    G.puck.y+=(S/2-G.puck.y)*Math.min(1,dt*12);
    G.zoom=1;
  }

  let perspTarget = 1;
  if (G.state === 'rolling') {
    const elapsed = (now - G.rollStart) / 1000;
    if (elapsed > 5) {
      const t = Math.min(1, (elapsed - 5) / 1.5);
      perspTarget = 1 - t;
    }
  } else if (G.state === 'done') {
    perspTarget = 0;
  }
  const lerpRate = (G.state === 'rolling' && (now - G.rollStart) / 1000 > 5) ? dt * 3 : dt * 2.5;
  perspMix += (perspTarget - perspMix) * Math.min(1, lerpRate);

  updateJiggles(nowSec);
  draw(now);
}

function boot(){
  resize();
  randomizeAngle();
  recomputeField();
  syncUI();
  requestAnimationFrame(function(t){
    lastT=t;
    requestAnimationFrame(frame);
  });
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize, 260));
if(document.readyState==='complete'||document.readyState==='interactive'){
  setTimeout(boot, 30);
} else {
  document.addEventListener('DOMContentLoaded', ()=>setTimeout(boot, 30));
}
})();
</script>
</body>
