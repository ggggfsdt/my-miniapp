<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>xDll</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#0c0c0c;--surface-2:#161616;--surface-3:#202020;
  --text:#fff;--text-2:#a0a0a0;--text-3:#5a5a5a;
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.16);
  --accent:#4d9fff;--green:#34d399;--gold:#fbbf24;--red:#f87171;
  --safe-top:max(env(safe-area-inset-top,0px),24px);
  --safe-bottom:max(env(safe-area-inset-bottom,0px),10px);
  --header-h:54px;--tabs-h:68px;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;touch-action:manipulation}
button{font-family:inherit}
.em{display:inline-block;object-fit:contain;vertical-align:-.15em;pointer-events:none}

#onboarding{position:fixed;inset:0;z-index:99998;display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 40%,#0a1428 0%,#000 70%);
  transition:opacity .5s ease}
#onboarding.hidden{opacity:0;visibility:hidden;pointer-events:none}
#globe-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;
  transition:transform .9s cubic-bezier(.4,0,.2,1),opacity .5s ease}
#globe-canvas.zooming{transform:scale(2.4);opacity:0}
.onb-header{position:relative;z-index:2;padding:calc(var(--safe-top) + 30px) 24px 0;text-align:center;pointer-events:none}
.onb-title{font-size:32px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px}
.onb-sub{font-size:14px;color:rgba(255,255,255,.55);font-weight:500}
.onb-footer{position:relative;z-index:2;margin-top:auto;padding:0 20px calc(var(--safe-bottom) + 24px);
  width:100%;max-width:440px;margin:0 auto}
.onb-search-wrap{position:relative;margin-bottom:12px}
.onb-search-input{width:100%;padding:14px 16px 14px 44px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;color:#fff;font-size:16px;outline:none;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.onb-search-input::placeholder{color:rgba(255,255,255,.4)}
.onb-search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:2;pointer-events:none}
.onb-city-results{max-height:200px;overflow-y:auto;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;margin-bottom:12px;display:none;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.onb-city-results.show{display:block}
.onb-city-results::-webkit-scrollbar{width:0}
.onb-city-opt{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;
  font-size:14px;font-weight:500;position:relative}
.onb-city-opt:active{background:rgba(255,255,255,.1)}
.onb-city-opt+.onb-city-opt::before{content:'';position:absolute;top:0;left:52px;right:16px;
  height:.5px;background:rgba(255,255,255,.08)}
.onb-city-flag{font-size:22px;line-height:1}
.onb-city-name{flex:1}
.onb-city-country{font-size:12px;color:rgba(255,255,255,.5)}
.onb-continue{width:100%;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#4d9fff,#3a7ad9);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;opacity:0;transform:translateY(12px);
  transition:transform .15s var(--spring),opacity .2s;box-shadow:0 8px 24px rgba(77,159,255,.4)}
.onb-continue.show{opacity:1;transform:translateY(0)}
.onb-hint{text-align:center;font-size:11.5px;color:rgba(255,255,255,.35);margin-top:10px}

#loading{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(circle at 50% 40%,#0d1117 0%,#000 70%);
  transition:opacity .5s ease}
#loading.out{opacity:0;visibility:hidden;pointer-events:none}
.loading-logo{font-size:44px;font-weight:900;letter-spacing:-1.5px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.loading-spinner{width:28px;height:28px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.1);border-top-color:#4d9fff;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#header{position:fixed;top:0;left:0;right:0;height:calc(var(--safe-top) + var(--header-h));
  display:flex;align-items:center;justify-content:space-between;padding:var(--safe-top) 16px 0;
  z-index:100;background:rgba(0,0,0,.94);border-bottom:.5px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.h-left{display:flex;align-items:center;gap:10px;height:var(--header-h);min-width:0}
.h-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.h-av img{width:100%;height:100%;object-fit:cover;display:block}
.h-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + var(--safe-top)/2));
  font-size:18px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);-webkit-background-clip:text;
  background-clip:text;color:transparent;pointer-events:none}
.h-right{font-size:13px;font-weight:700;color:var(--gold);height:var(--header-h);
  display:flex;align-items:center;gap:5px}
.h-diamond{width:16px;height:16px;object-fit:contain}

#main{position:fixed;top:calc(var(--safe-top) + var(--header-h));
  left:0;right:0;bottom:calc(var(--safe-bottom) + var(--tabs-h));overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px;opacity:0;visibility:hidden;
  transform:translateY(10px);transition:opacity .25s var(--ease),transform .3s var(--spring),visibility .25s}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;visibility:visible;transform:translateY(0)}
#page-nova{padding:8px 12px}

#tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--safe-bottom) + var(--tabs-h));
  padding:8px 12px calc(var(--safe-bottom) + 8px);background:rgba(0,0,0,.94);
  border-top:.5px solid var(--border);z-index:100;backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);touch-action:none;user-select:none;-webkit-user-select:none}
#tabs-inner{position:relative;display:flex;align-items:center;height:52px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:20px;padding:5px;touch-action:none;overflow:hidden}
.tab-indicator{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 4);
  z-index:1;pointer-events:none;transition:transform .4s var(--spring)}
.tab-indicator.dragging{transition:none}
.tab-indicator-fill{position:absolute;inset:0;border-radius:16px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 12px rgba(0,0,0,.3)}
.tab-btn{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;background:none;border:0;
  color:var(--text-3);font-size:10px;font-weight:600;cursor:pointer;
  transition:color .2s;height:42px;pointer-events:none}
.tab-btn.active{color:#fff}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.tab-btn.active svg{transform:scale(1.1) translateY(-1px)}

.search-hero{margin-bottom:16px}
.search-title{font-size:24px;font-weight:800;letter-spacing:-.7px;margin-bottom:4px}
.search-sub{font-size:13px;color:var(--text-2);margin-bottom:14px}
.search-wrap{position:relative}
.search-input{width:100%;padding:13px 44px 13px 44px;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;color:var(--text);font-size:16px;outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:border .2s,background .2s}
.search-input:focus{border-color:var(--accent);background:var(--surface-2)}
.search-input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:var(--text-3);fill:none;stroke-width:2;pointer-events:none}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border:none;background:transparent;border-radius:50%;
  color:var(--text-3);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.search-clear.show{display:flex}
.search-clear svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer}
.chip:active{transform:scale(.94);border-color:var(--accent);color:var(--accent)}

.results{margin-top:18px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:16px;margin-bottom:12px;animation:resultIn .5s var(--spring) both}
@keyframes resultIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.result-av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.result-av img{width:100%;height:100%;object-fit:cover;display:block}
.result-info{flex:1;min-width:0}
.result-name-row{display:flex;align-items:center;gap:6px}
.result-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-verified{flex-shrink:0;width:14px;height:14px;background:var(--accent);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center}
.result-verified svg{width:9px;height:9px;stroke:#fff;stroke-width:3.5;fill:none}
.result-handle{font-size:12px;color:var(--text-3);margin-top:2px;font-weight:500}

.action-row{display:flex;align-items:center;gap:8px}
.send-btn{flex:1;padding:10px 14px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#4d9fff,#3a7ad9);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 14px rgba(77,159,255,.35);transition:transform .15s var(--spring)}
.send-btn:active{transform:scale(.96)}
.send-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2}
.msg-btn,.fav-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s var(--spring)}
.msg-btn:active,.fav-btn:active{transform:scale(.94);background:var(--surface-3)}
.msg-btn svg,.fav-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fav-btn.on{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4);color:var(--gold)}
.fav-btn.on svg{fill:var(--gold);stroke:var(--gold)}

.send-strip{position:relative;height:36px;border-radius:18px;overflow:hidden;
  background:rgba(77,159,255,.1);border:1px solid rgba(77,159,255,.25);
  flex:1;display:flex;align-items:center;padding:0 12px}
.send-strip.done{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3)}
.send-status{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.send-strip.done .send-status{color:var(--green)}
.send-plane-mini{position:absolute;width:18px;height:18px;top:50%;
  transform:translateY(-50%);animation:sendMini 2.4s cubic-bezier(.4,0,.5,1) forwards}
.send-plane-mini svg{width:100%;height:100%}
@keyframes sendMini{
  0%{left:8px;opacity:1}
  50%{left:50%;transform:translateY(-50%) rotate(3deg)}
  100%{left:calc(100% - 26px);opacity:0}}

.state-line{padding:10px 0;text-align:center;font-size:12px;font-weight:600}
.state-line.connected{color:var(--green)}
.state-line.pending{color:var(--gold)}

.chat-list{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  overflow:hidden;margin-bottom:12px}
.chat-list-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.chat-list-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3)}
.chat-list-count{font-size:11px;color:var(--text-3);font-weight:600;
  background:var(--surface-2);padding:2px 8px;border-radius:99px;border:1px solid var(--border)}
.chat-row{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;
  cursor:pointer;animation:chatIn .35s var(--spring) both}
@keyframes chatIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.chat-row+.chat-row::before{content:'';position:absolute;top:0;left:64px;right:16px;height:.5px;background:var(--border)}
.chat-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative}
.chat-av img{width:100%;height:100%;object-fit:cover;display:block}
.chat-online{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:var(--green);border:2px solid var(--surface)}
.chat-body{flex:1;min-width:0}
.chat-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-handle{font-size:11.5px;color:var(--text-3);margin-top:1px}
.chat-empty{padding:28px 16px;text-align:center;font-size:13px;color:var(--text-3);line-height:1.5}
.pend-row{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative}
.pend-row+.pend-row::before{content:'';position:absolute;top:0;left:64px;right:16px;height:.5px;background:var(--border)}
.pend-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);opacity:.7}
.pend-av img{width:100%;height:100%;object-fit:cover;display:block}
.pend-body{flex:1;min-width:0}
.pend-name{font-size:13.5px;font-weight:600;opacity:.85}
.pend-handle{font-size:11.5px;color:var(--text-3)}
.pend-status{font-size:10.5px;color:var(--gold);font-weight:600;
  padding:2px 7px;border-radius:99px;border:1px solid rgba(251,191,36,.25);background:rgba(251,191,36,.08)}

.state-msg{text-align:center;padding:32px 20px;color:var(--text-3)}
.state-msg svg{width:40px;height:40px;stroke:var(--text-3);fill:none;stroke-width:1.4;margin-bottom:12px;opacity:.5}
.state-msg .state-title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.state-msg .state-text{font-size:13px;line-height:1.5}

/* ============================================================
   NOVA FULL SCREEN
   ============================================================ */
.nova-screen{position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;gap:8px}
.scene{position:relative;flex:1;min-height:340px;overflow:hidden;border-radius:22px;
  background:radial-gradient(ellipse at 50% 40%,#100c1a 0%,#000 80%);
  perspective:750px;perspective-origin:50% 55%;
  touch-action:none;user-select:none;-webkit-user-select:none;
  border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 24px rgba(0,0,0,.5);
  cursor:grab}
.scene:active{cursor:grabbing}
.room{position:absolute;left:50%;top:50%;width:0;height:0;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx,-18deg)) rotateY(var(--ry,0deg)) translateZ(-30px);
  will-change:transform}

/* WALLS */
.wall{position:absolute;left:-200px;top:-200px;width:400px;height:400px;
  backface-visibility:hidden;transform-style:preserve-3d}
.wall-floor{transform:translateY(200px) rotateX(90deg);
  background:linear-gradient(180deg,#3a2818 0%,#1a1008 100%)}
.wall-floor::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 50px,rgba(0,0,0,.16) 50px 51px),
    repeating-linear-gradient(0deg,transparent 0 80px,rgba(0,0,0,.1) 80px 81px)}
.wall-ceiling{transform:translateY(-200px) rotateX(-90deg);
  background:linear-gradient(180deg,#0a0812 0%,#050308 100%)}
.wall-back{transform:translateZ(-200px);
  background:linear-gradient(180deg,#2a2238 0%,#1a1426 100%)}
.wall-left{transform:translateX(-200px) rotateY(90deg);
  background:linear-gradient(180deg,#1e1828 0%,#120c1c 100%)}
.wall-right{transform:translateX(200px) rotateY(-90deg);
  background:linear-gradient(180deg,#261e30 0%,#16101e 100%)}

/* Room themes */
.room[data-scene="bedroom"] .wall-floor{background:linear-gradient(180deg,#4a3040 0%,#2a1828 100%)}
.room[data-scene="bedroom"] .wall-back{background:linear-gradient(180deg,#3e2444 0%,#1c0c22 100%)}
.room[data-scene="bedroom"] .wall-left{background:linear-gradient(180deg,#2c1832 0%,#140818 100%)}
.room[data-scene="bedroom"] .wall-right{background:linear-gradient(180deg,#3a2040 0%,#1c0c22 100%)}

.room[data-scene="kitchen"] .wall-floor{background:linear-gradient(180deg,#c8c8c8 0%,#787878 100%)}
.room[data-scene="kitchen"] .wall-floor::before{background:repeating-linear-gradient(90deg,transparent 0 45px,rgba(0,0,0,.14) 45px 46px),repeating-linear-gradient(0deg,transparent 0 45px,rgba(0,0,0,.14) 45px 46px)}
.room[data-scene="kitchen"] .wall-ceiling{background:linear-gradient(180deg,#e8e8e8 0%,#a8a8a8 100%)}
.room[data-scene="kitchen"] .wall-back{background:linear-gradient(180deg,#f0f0f0 0%,#c0c0c0 100%)}
.room[data-scene="kitchen"] .wall-left{background:linear-gradient(180deg,#e0e0e0 0%,#b0b0b0 100%)}
.room[data-scene="kitchen"] .wall-right{background:linear-gradient(180deg,#e8e8e8 0%,#b8b8b8 100%)}

.room[data-scene="living"] .wall-floor{background:linear-gradient(180deg,#503620 0%,#2a1a0e 100%)}
.room[data-scene="living"] .wall-back{background:linear-gradient(180deg,#3e2e20 0%,#1e1408 100%)}
.room[data-scene="living"] .wall-left{background:linear-gradient(180deg,#2a1e12 0%,#140a04 100%)}
.room[data-scene="living"] .wall-right{background:linear-gradient(180deg,#3a2a1a 0%,#1a1008 100%)}

.room[data-scene="bathroom"] .wall-floor{background:linear-gradient(180deg,#c0d8e8 0%,#7090a8 100%)}
.room[data-scene="bathroom"] .wall-floor::before{background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(0,0,0,.12) 40px 41px),repeating-linear-gradient(0deg,transparent 0 40px,rgba(0,0,0,.12) 40px 41px)}
.room[data-scene="bathroom"] .wall-ceiling{background:linear-gradient(180deg,#f0f8ff 0%,#b0c0d0 100%)}
.room[data-scene="bathroom"] .wall-back{background:linear-gradient(180deg,#f0f8ff 0%,#b8c8d8 100%)}
.room[data-scene="bathroom"] .wall-left{background:linear-gradient(180deg,#e0e8f0 0%,#a8b8c8 100%)}
.room[data-scene="bathroom"] .wall-right{background:linear-gradient(180deg,#e8f0f8 0%,#a0b8c8 100%)}

/* FURNITURE - direct children of .room, explicit transforms */
.furn{position:absolute;transform-style:preserve-3d}

/* Floor-laid furniture (rotateX 90 to lie flat) */
.f-bed{
  width:180px;height:130px;left:-90px;top:-65px;
  transform:translate3d(-40px,200px,60px) rotateX(90deg);
  background:linear-gradient(180deg,#6a4a7a 0%,#3a2044 100%);
  border-radius:8px;box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.4)}
.f-bed::before{content:'';position:absolute;inset:12px 12px auto 12px;height:34px;
  background:linear-gradient(180deg,#f0e8f8,#c0b0d0);border-radius:6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
.f-bed::after{content:'';position:absolute;left:12px;right:12px;bottom:12px;height:70px;
  background:linear-gradient(180deg,#e0d0e8,#a890b8);border-radius:6px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}

.f-sofa{
  width:200px;height:100px;left:-100px;top:-50px;
  transform:translate3d(40px,200px,50px) rotateX(90deg);
  background:linear-gradient(180deg,#a04030 0%,#601808 100%);
  border-radius:16px;box-shadow:inset 0 3px 0 rgba(255,255,255,.2),0 6px 20px rgba(0,0,0,.4)}
.f-sofa::before{content:'';position:absolute;inset:10px 12px auto 12px;height:30px;
  background:linear-gradient(180deg,#c05040,#803018);border-radius:10px}

.f-tub{
  width:220px;height:100px;left:-110px;top:-50px;
  transform:translate3d(30px,200px,40px) rotateX(90deg);
  background:linear-gradient(180deg,#f0f8ff 0%,#c0d8e8 100%);
  border-radius:50px 50px 20px 20px;border:3px solid #a0b8c8;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.7),0 6px 20px rgba(0,0,0,.4)}

/* Upright furniture on floor (like nightstand) */
.f-nightstand{
  width:60px;height:60px;left:-30px;top:-30px;
  transform:translate3d(-140px,200px,20px) rotateX(90deg);
  background:linear-gradient(180deg,#5a4030,#2a1a10);
  border-radius:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 12px rgba(0,0,0,.4)}

/* Lamp - vertical, standing on nightstand */
.f-lamp{
  width:40px;height:60px;left:-20px;top:-30px;
  transform:translate3d(-140px,170px,20px);
  transform-style:preserve-3d}
.f-lamp-base{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:5px;height:26px;background:linear-gradient(90deg,#3a2a1a,#5a3a20,#3a2a1a)}
.f-lamp-shade{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:40px;height:24px;
  background:linear-gradient(180deg,#f0c060 0%,#c09030 100%);
  border-radius:50% 50% 8px 8px;
  box-shadow:0 0 25px rgba(251,191,36,.45);
  transition:box-shadow .3s,background .3s}
.f-lamp.on .f-lamp-shade{
  background:linear-gradient(180deg,#ffe890 0%,#f0b030 100%);
  box-shadow:0 0 45px rgba(251,191,36,.9),0 0 90px rgba(251,191,36,.5)}
.f-lamp.off .f-lamp-shade{
  background:linear-gradient(180deg,#4a4a4a 0%,#2a2a2a 100%);box-shadow:none}

/* Wall items - sit against back wall */
.f-fridge{
  width:80px;height:160px;left:-40px;top:-80px;
  transform:translate3d(-120px,120px,-199px);
  background:linear-gradient(180deg,#f0f0f0 0%,#c0c0c0 100%);
  border:2px solid #888;border-radius:8px 8px 4px 4px;
  box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5);
  cursor:pointer;pointer-events:auto}
.f-fridge::before{content:'';position:absolute;top:44%;left:4px;right:4px;height:2px;background:#888}
.f-fridge::after{content:'❄';position:absolute;top:6%;left:50%;transform:translateX(-50%);
  font-size:24px;color:#4d9fff}

.f-stove{
  width:100px;height:70px;left:-50px;top:-35px;
  transform:translate3d(120px,165px,-199px);
  background:linear-gradient(180deg,#2a2a2a,#0a0a0a);border:2px solid #444;
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:24px}

.f-counter{
  width:120px;height:60px;left:-60px;top:-30px;
  transform:translate3d(20px,170px,-199px);
  background:linear-gradient(180deg,#8a6a4a,#5a3a20);border-radius:4px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 4px 12px rgba(0,0,0,.4)}

.f-tv{
  width:160px;height:100px;left:-80px;top:-50px;
  transform:translate3d(0,120px,-199px);
  background:linear-gradient(180deg,#111,#000);
  border:5px solid #222;border-radius:6px;
  box-shadow:0 4px 20px rgba(0,0,0,.6),inset 0 0 30px rgba(100,150,255,.15)}
.f-tv::after{content:'';position:absolute;inset:8px;
  background:radial-gradient(ellipse at 30% 30%,#1a3050,#000);border-radius:3px;
  box-shadow:inset 0 0 25px rgba(77,159,255,.4)}

.f-mirror{
  width:120px;height:140px;left:-60px;top:-70px;
  transform:translate3d(0,110px,-199px);
  background:linear-gradient(135deg,#a8d8f0,#5a8ab0);
  border:5px solid #c8a868;border-radius:50% 50% 8px 8px;
  box-shadow:0 0 25px rgba(168,216,240,.4),inset 0 0 40px rgba(255,255,255,.3)}

.f-sink{
  width:90px;height:60px;left:-45px;top:-30px;
  transform:translate3d(120px,170px,-199px);
  background:linear-gradient(180deg,#f8f8f8,#d0d0d0);
  border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 10px rgba(0,0,0,.3)}

/* DOOR - back wall center, always visible */
.f-door{
  width:80px;height:160px;left:-40px;top:-80px;
  transform:translate3d(0,120px,-199px);
  background:linear-gradient(90deg,rgba(0,0,0,.2) 0%,transparent 10%,transparent 90%,rgba(0,0,0,.2) 100%),
    linear-gradient(180deg,#5a3620 0%,#2a1a10 100%);
  border:2px solid #1a1008;border-radius:4px 4px 0 0;
  box-shadow:inset 0 0 30px rgba(0,0,0,.5);
  cursor:pointer;pointer-events:auto;
  transition:box-shadow .3s,border-color .3s}
.f-door::before{content:'';position:absolute;inset:8px;
  border:1px solid rgba(0,0,0,.3);border-radius:2px;pointer-events:none}
.f-door::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;background:#c8a868;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.f-door:hover{box-shadow:inset 0 0 40px rgba(77,159,255,.4),0 0 30px rgba(77,159,255,.5);
  border-color:rgba(77,159,255,.75)}

/* PET */
.pet{position:absolute;width:80px;height:80px;left:-40px;top:-80px;
  transform-origin:50% 100%;pointer-events:auto;cursor:grab;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.6));
  will-change:transform;transition:filter .2s ease}
.pet:active{cursor:grabbing}
.pet.dragging{filter:drop-shadow(0 12px 20px rgba(0,0,0,.8)) drop-shadow(0 0 20px rgba(255,255,255,.3))}
.pet.hidden{opacity:0 !important;pointer-events:none}
.pet img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.pet.sleeping img{filter:brightness(.5) saturate(.6)}
.pet.hopping img{animation:hopBounce .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes hopBounce{0%{transform:translateY(0) scale(1,1)}
  35%{transform:translateY(-18px) scale(1.05,.95)}
  70%{transform:translateY(-3px) scale(.95,1.05)}
  100%{transform:translateY(0) scale(1,1)}}
.zzz-float{position:absolute;left:50%;top:-10px;transform:translateX(-50%);
  font-size:18px;pointer-events:none;animation:zzzFloat 2.5s ease-out infinite}
@keyframes zzzFloat{0%{opacity:0;transform:translate(-50%,0) scale(.8)}
  20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1.2)}}

.floating-pet{position:fixed;width:70px;height:70px;z-index:99998;pointer-events:none;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.7)) drop-shadow(0 0 24px rgba(77,159,255,.4))}
.floating-pet img{width:100%;height:100%;object-fit:contain;display:block}

.lamp-toggle{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.6);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);z-index:15}
.lamp-toggle.on{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.5);
  box-shadow:0 0 20px rgba(251,191,36,.5)}

/* NOVA BAR */
.nova-bar{display:flex;gap:6px;align-items:center}
.nova-bar-stats{flex:1;display:flex;gap:5px}
.nstat{flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:8px 6px;text-align:center}
.nstat-lbl{font-size:8.5px;color:var(--text-3);font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:2px}
.nstat-val{font-size:13px;font-weight:700;color:#fff}
.nstat-val.low{color:var(--red)}
.nstat-val.mid{color:var(--gold)}
.nstat-val.high{color:var(--green)}

/* ============================================================
   DEFORMING BLOB BUBBLE
   ============================================================ */
.blob-wrap{display:flex;justify-content:center;padding:6px 0 4px}
.blob{position:relative;width:72px;height:72px;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.15),
    0 8px 24px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  animation:blobMorph 8s ease-in-out infinite;
  transition:transform .3s var(--spring)}
.blob:active{transform:scale(.94)}
@keyframes blobMorph{
  0%,100%{border-radius:50% 50% 50% 50% / 50% 50% 50% 50%}
  14%{border-radius:62% 38% 44% 56% / 55% 45% 55% 45%}
  28%{border-radius:44% 56% 62% 38% / 42% 58% 42% 58%}
  42%{border-radius:56% 44% 38% 62% / 62% 38% 62% 38%}
  57%{border-radius:38% 62% 56% 44% / 44% 56% 44% 56%}
  71%{border-radius:52% 48% 62% 38% / 56% 44% 56% 44%}
  85%{border-radius:48% 52% 40% 60% / 40% 60% 40% 60%}}
.blob.wobble{animation:blobMorph 8s ease-in-out infinite,blobWobble .5s ease}
@keyframes blobWobble{
  0%,100%{transform:scale(1) rotate(0deg)}
  25%{transform:scale(1.15) rotate(-6deg)}
  50%{transform:scale(.92) rotate(5deg)}
  75%{transform:scale(1.06) rotate(-2deg)}}
.blob-face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.blob-icon{font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.blob-txt{font-size:9px;font-weight:700;color:rgba(255,255,255,.7);
  letter-spacing:.4px;text-transform:uppercase}

/* Expanded blob panel - scales up from blob position */
.blob-overlay{position:fixed;inset:0;z-index:9994;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,0);pointer-events:none;
  transition:background .35s ease}
.blob-overlay.open{display:flex;background:rgba(0,0,0,.72);pointer-events:auto;
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.blob-panel{
  width:min(340px,88vw);height:min(480px,72vh);
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
  backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.15),
    0 20px 60px rgba(0,0,0,.6);
  border-radius:32px;padding:24px 20px;
  display:flex;flex-direction:column;
  transform:scale(.15);opacity:0;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  transform-origin:center center;
  overflow:auto}
.blob-overlay.open .blob-panel{transform:scale(1);opacity:1}
.blob-panel::-webkit-scrollbar{width:0}
.blob-panel-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.blob-panel-av{width:44px;height:44px;border-radius:50%;overflow:hidden;
  background:rgba(255,255,255,.1);flex-shrink:0}
.blob-panel-av img{width:100%;height:100%;object-fit:contain}
.blob-panel-info{flex:1;min-width:0}
.blob-panel-name{font-size:17px;font-weight:800;color:#fff}
.blob-panel-lvl{font-size:12px;color:rgba(255,255,255,.55);font-weight:600;margin-top:2px}
.blob-panel-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.bps{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:12px 6px;text-align:center}
.bps-v{font-size:18px;font-weight:800;color:#fff;line-height:1;display:flex;
  align-items:center;justify-content:center;gap:3px}
.bps-l{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:5px}
.blob-panel-label{font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px}
.caretaker-list{display:flex;flex-direction:column;gap:6px}
.caretaker{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;cursor:pointer;position:relative;
  transition:background .15s ease}
.caretaker:active{background:rgba(255,255,255,.1)}
.caretaker-av{width:36px;height:36px;border-radius:50%;overflow:hidden;
  flex-shrink:0;background:rgba(255,255,255,.1)}
.caretaker-av img{width:100%;height:100%;object-fit:cover;display:block}
.caretaker-body{flex:1;min-width:0}
.caretaker-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.caretaker-mood{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.caretaker-badge{font-size:18px;flex-shrink:0}
.caretaker-popup{position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;
  background:rgba(20,20,28,.98);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:10px 14px;white-space:nowrap;
  box-shadow:0 8px 30px rgba(0,0,0,.8);transition:all .25s var(--spring);z-index:20}
.caretaker-popup::after{content:'';position:absolute;top:100%;left:50%;
  transform:translateX(-50%);border:6px solid transparent;
  border-top-color:rgba(20,20,28,.98)}
.caretaker.show-popup .caretaker-popup{opacity:1;transform:translateX(-50%) scale(1);
  pointer-events:auto}
.caretaker-popup-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px}
.caretaker-popup-text{font-size:11px;color:rgba(255,255,255,.65)}

/* Orbiting caretakers around blob panel */
.orbiters{position:fixed;left:50%;top:50%;width:0;height:0;
  z-index:9995;pointer-events:none;display:none}
.orbiters.show{display:block}
.orbiter{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;
  border-radius:50%;overflow:hidden;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 4px 16px rgba(0,0,0,.6),0 0 12px rgba(77,159,255,.4);
  background:rgba(20,20,28,.9);
  transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
.orbiter img{width:100%;height:100%;object-fit:cover;display:block}
.orbiter.orbit-0{transform:rotate(0deg) translateX(0px)}
.orbiter.orbit-1{transform:rotate(0deg) translateX(0px)}
.orbiter.orbit-2{transform:rotate(0deg) translateX(0px)}
.orbiter.orbit-3{transform:rotate(0deg) translateX(0px)}
.orbiters.show .orbiter.orbit-0{transform:rotate(-40deg) translateX(210px)}
.orbiters.show .orbiter.orbit-1{transform:rotate(50deg) translateX(210px)}
.orbiters.show .orbiter.orbit-2{transform:rotate(140deg) translateX(210px)}
.orbiters.show .orbiter.orbit-3{transform:rotate(230deg) translateX(210px)}

/* HOUSE VIEW */
.house-view{position:fixed;inset:0;z-index:99996;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,#1a1a2e 0%,#050508 100%);
  padding:24px;opacity:0;transition:opacity .4s ease;overflow:hidden}
.house-view.show{display:flex;opacity:1}
.house-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;text-align:center}
.house-hint{font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:24px}
.house-scene{position:relative;width:min(100%,340px);height:340px;
  perspective:1000px;perspective-origin:50% 60%;
  margin-bottom:20px;display:flex;align-items:center;justify-content:center}
.house-3d{position:relative;width:220px;height:220px;
  transform-style:preserve-3d;transform:rotateX(45deg) rotateZ(-45deg)}
.mroom{position:absolute;width:100px;height:100px;transform-style:preserve-3d;
  transition:filter .25s ease;cursor:pointer}
.mroom[data-room="bedroom"]{transform:translate3d(0,0,0)}
.mroom[data-room="kitchen"]{transform:translate3d(110px,0,0)}
.mroom[data-room="bathroom"]{transform:translate3d(0,0,110px)}
.mroom[data-room="living"]{transform:translate3d(110px,0,110px)}
.mroom-floor{position:absolute;inset:0;
  background:linear-gradient(135deg,#3a2818,#1a1008);
  border:1px solid rgba(255,255,255,.1);
  transform:rotateX(90deg);transform-origin:center top;
  top:100px;height:100px}
.mroom[data-room="bedroom"] .mroom-floor{background:linear-gradient(135deg,#4a2a4a,#2a0a20)}
.mroom[data-room="kitchen"] .mroom-floor{background:linear-gradient(135deg,#c8c8c8,#787878)}
.mroom[data-room="bathroom"] .mroom-floor{background:linear-gradient(135deg,#c0d8e8,#7090a8)}
.mroom[data-room="living"] .mroom-floor{background:linear-gradient(135deg,#503620,#2a1a0e)}
.mroom-wall{position:absolute;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12)}
.mroom-wall.w-back{top:0;left:0;width:100px;height:60px;
  transform-origin:center bottom;transform:rotateX(-90deg)}
.mroom-wall.w-left{top:0;left:0;width:100px;height:60px;
  transform-origin:left bottom;transform:rotateZ(90deg) rotateX(-90deg)}
.mroom-wall.w-right{top:0;right:0;width:100px;height:60px;
  transform-origin:right bottom;transform:rotateZ(-90deg) rotateX(-90deg)}
.mroom[data-room="bedroom"] .mroom-wall{background:rgba(120,60,150,.25)}
.mroom[data-room="kitchen"] .mroom-wall{background:rgba(240,240,240,.3)}
.mroom[data-room="bathroom"] .mroom-wall{background:rgba(200,220,240,.3)}
.mroom[data-room="living"] .mroom-wall{background:rgba(140,90,50,.25)}
.mroom-label{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotateX(-90deg);
  font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;
  letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.8);
  pointer-events:none;white-space:nowrap;z-index:3}
.mroom.highlight{filter:drop-shadow(0 0 20px rgba(77,159,255,.9)) brightness(1.3)}
.mroom.highlight .mroom-floor{box-shadow:inset 0 0 25px rgba(77,159,255,.6),0 0 30px rgba(77,159,255,.6)}
.mroom.current .mroom-floor{border-color:rgba(77,159,255,.8);box-shadow:inset 0 0 15px rgba(77,159,255,.3)}
.house-close{position:absolute;top:calc(var(--safe-top) + 16px);right:16px;
  width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.1);
  color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bear-token{position:fixed;width:60px;height:60px;z-index:99997;pointer-events:auto;
  cursor:grab;filter:drop-shadow(0 8px 20px rgba(0,0,0,.7));
  touch-action:none;display:none}
.bear-token:active{cursor:grabbing}
.bear-token img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.bear-token.dragging{transform:scale(1.1);filter:drop-shadow(0 12px 30px rgba(77,159,255,.7))}

#fridge-overlay{position:fixed;inset:0;z-index:99997;display:none;align-items:center;
  justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);padding:24px;opacity:0;transition:opacity .3s}
#fridge-overlay.show{display:flex;opacity:1}
.fridge-content{background:linear-gradient(180deg,#f0f0f0,#d0d0d0);border:3px solid #888;
  border-radius:20px;padding:20px;max-width:340px;width:100%;position:relative}
.fridge-title{font-size:16px;font-weight:800;color:#333;margin-bottom:14px;text-align:center}
.fridge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fridge-food{aspect-ratio:1;background:rgba(0,0,0,.05);border:2px solid #aaa;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:36px;cursor:pointer;transition:transform .15s var(--spring)}
.fridge-food:active{transform:scale(.9);background:rgba(77,159,255,.2);border-color:#4d9fff}
.fridge-close{position:absolute;top:10px;right:10px;width:32px;height:32px;
  border-radius:50%;border:none;background:rgba(0,0,0,.15);color:#333;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center}

#hand-cursor{position:fixed;pointer-events:none;z-index:99999;display:none;
  transform:translate(-8px,-8px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
#hand-cursor.active{display:block}
.hand-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid #fff;
  background:var(--surface-2);box-shadow:0 2px 10px rgba(0,0,0,.7)}
.hand-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hand-icon{font-size:24px;margin-top:-8px;margin-left:22px;line-height:1}

.setting-row+.setting-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:.5px;background:var(--border)}
.setting-lbl{font-size:14px;font-weight:500;flex:1}
.switch{position:relative;width:40px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);
  cursor:pointer;transition:background .2s}
.switch .slider::before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;
  border-radius:50%;background:#fff;transition:transform .22s var(--spring)}
.switch input:checked+.slider{background:rgba(255,255,255,.6)}
.switch input:checked+.slider::before{transform:translateX(16px)}

#toast-wrap{position:fixed;top:calc(var(--safe-top) + var(--header-h) + 12px);left:50%;

function getUserInfo(){

const KNOWN = {durov:'Pavel Durov',telegram:'Telegram',botfather:'BotFather',
  tginfo:'Telegram Info',stickers:'Stickers',premium:'Telegram Premium',gif:'GIF'};
function search(q){
  const clean = String(q).replace(/^@/, '').trim().toLowerCase();
  if (!clean) return { error: 'empty' };
  if (clean.length < 2) return { error: 'too_short' };
  if (!/^[a-z0-9_]{2,32}$/i.test(clean)) return { error: 'invalid' };
  const isKnown = clean in KNOWN;
  const name = isKnown ? KNOWN[clean] : clean.charAt(0).toUpperCase() + clean.slice(1);
  return { ok: true, user: { username: clean, name,
    photo: 'https://unavatar.io/telegram/' + clean, verified: isKnown }};
}

function typeText(el, text, speed, onDone){
  if (!el) return;
  speed = speed || 40;
  el.innerHTML = '';
  let i = 0;
  const bar = document.createElement('span');
  bar.className = 'cursor-bar';
  el.appendChild(bar);
  function tick(){
    if (i >= text.length){ setTimeout(() => bar.remove(), 500); onDone && onDone(); return; }
    const ch = text[i++];
    const span = document.createElement('span');
    span.className = 'type-char';
    span.textContent = ch;
    el.insertBefore(span, bar);
    setTimeout(tick, speed);
  }
  tick();
}

function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?I.check:type==='error'?I.x:I.search) + '<span>'+esc(text)+'</span>';
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),280); }, 2400);
  haptic('light');
}

let tabWidth = 0;

function renderTabs(){
  const inner = $('#tabs-inner');
  inner.querySelectorAll('.tab-btn').forEach(b => b.remove());
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.tab===t.id?' active':'');
    b.dataset.tab = t.id;
    b.innerHTML = I[t.icon]+'<span>'+t.label+'</span>';
    inner.appendChild(b);
  });
  requestAnimationFrame(() => {
    tabWidth = (inner.clientWidth - 10) / TABS.length;
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
  });
}
function setTabIndicator(idx, animate){
  const ind = $('#tab-indicator');
  if (!ind) return;
  if (!animate) ind.classList.add('dragging');
  else ind.classList.remove('dragging');
  ind.style.transform = 'translateX('+(idx * tabWidth)+'px)';
  if (!animate) { void ind.offsetWidth; requestAnimationFrame(()=>ind.classList.remove('dragging')); }
}
function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');
  $('#page-'+state.tab)?.classList.remove('active');
  state.tab = tab;
  $('#page-'+tab).classList.add('active');
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  setTabIndicator(TABS.findIndex(t => t.id === tab), true);
  stopWandering();
  if (tab==='friends') mountFriendsPage();
  if (tab==='nova') renderNova();
  if (tab==='pulse') renderPulse();
  if (tab==='profile') renderProfile();
}

  let dragging = false, moved = false, startX = 0, startIdx = 0;
  function getX(e){ return (e.touches && e.touches[0]) ? e.touches[0].clientX :
    (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : e.clientX; }
  function onDown(e){ dragging = true; moved = false; startX = getX(e);
    startIdx = TABS.findIndex(t => t.id === state.tab); ind.classList.add('dragging'); }
  function onMove(e){ if (!dragging) return; const dx = getX(e) - startX;
    if (Math.abs(dx) > 6) moved = true;
    if (moved){ e.preventDefault(); const maxX = (TABS.length - 1) * tabWidth;
      ind.style.transform = 'translateX('+clamp(startIdx * tabWidth + dx, 0, maxX)+'px)'; } }
  function onUp(e){ if (!dragging) return; dragging = false; ind.classList.remove('dragging');
    const rect = inner.getBoundingClientRect();
    const relX = getX(e) - rect.left - 5;
    let idx = moved ? Math.round(relX / tabWidth) : Math.floor(relX / tabWidth);
    idx = clamp(idx, 0, TABS.length - 1);
    ind.style.transform = 'translateX('+(idx * tabWidth)+'px)';
    if (TABS[idx].id !== state.tab){ haptic('medium'); switchTab(TABS[idx].id); }
    else setTabIndicator(idx, true); }
  inner.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  inner.addEventListener('touchstart', onDown, { passive: true });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onUp);
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      tabWidth = (inner.clientWidth - 10) / TABS.length;
      setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
    }, 150);
  });
}

let searchTimer = null;
let mounted = false;

function mountFriendsPage(){
  if (mounted){ refreshFriendsRegions(); return; }
  mounted = true;
  const page = $('#page-friends');
  page.innerHTML =
    '<div class="search-hero">'+
      '<div class="search-title">Find people</div>'+
      '<div class="search-sub">Search any Telegram user by @username</div>'+
      '<div class="search-wrap">'+
        I.search+
        '<input class="search-input" id="search-input" placeholder="@durov" value="'+esc(state.query)+'" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">'+
        '<button class="search-clear '+(state.query?'show':'')+'" id="search-clear">'+I.x+'</button>'+
      '</div>'+
      '<div class="chips">'+
        '<button class="chip" data-try="durov">@durov</button>'+
        '<button class="chip" data-try="telegram">@telegram</button>'+

      '</div>'+
    '</div>'+
    '<div id="region-results"></div>'+
    '<div id="region-pending"></div>'+
    '<div id="region-connections"></div>';
  wireFriendsInput();
  refreshFriendsRegions();
}

function wireFriendsInput(){
  const input = $('#search-input');
  if (!input) return;
  input.addEventListener('input', e => {
    state.query = e.target.value;
    $('#search-clear')?.classList.toggle('show', !!state.query);
    clearTimeout(searchTimer);
    if (!state.query.trim()){ state.result = null; state.error = null; refreshResults(); return; }
    searchTimer = setTimeout(() => doSearch(state.query), 700);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ clearTimeout(searchTimer); doSearch(state.query); }
  });
  $('#search-clear')?.addEventListener('click', () => {
    state.query = ''; state.result = null; state.error = null;
    $('#search-input').value = ''; $('#search-clear').classList.remove('show');
    refreshResults(); $('#search-input').focus();
  });
  $$('[data-try]').forEach(chip => chip.addEventListener('click', () => {
    clearTimeout(searchTimer); state.query = '@' + chip.dataset.try;
    $('#search-input').value = state.query;
    $('#search-clear').classList.add('show');
    doSearch(chip.dataset.try);
  }));
}

function doSearch(q){
  const r = search(q);
  if (r.error){ state.error = r.error; state.result = null; }
  else { state.result = r.user; state.error = null; haptic('medium'); }
  refreshResults();
}

function refreshFriendsRegions(){ refreshResults(); refreshPending(); refreshConnections(); }

function refreshResults(){
  const region = $('#region-results');
  if (!region) return;
  const input = document.getElementById('search-input');
  const hadFocus = input && document.activeElement === input;
  if (state.error){
    const titles = {empty:'Type a username',too_short:'Too short',invalid:'Invalid username'};
    const texts = {empty:'Enter a @username.',too_short:'At least 2 characters.',invalid:'Only letters, numbers, underscore.'};
    region.innerHTML = '<div class="results"><div class="state-msg">'+I.empty+
      '<div class="state-title">'+(titles[state.error]||'Error')+'</div>'+
      '<div class="state-text">'+(texts[state.error]||'')+'</div></div></div>';
    return;
  }
  if (!state.result){ region.innerHTML = ''; return; }
  region.innerHTML = '<div class="results">'+renderResultCard(state.result)+'</div>';
  const nameEl = document.getElementById('result-name');
  if (nameEl) typeText(nameEl, state.result.name, 55);
  $('#send-btn')?.addEventListener('click', () => startSendAnimation(state.result));
  $('#msg-btn')?.addEventListener('click', () => openChat(state.result.username));
  $('#fav-btn')?.addEventListener('click', (e) => {
    const u = state.result.username;
    if (state.favorites.has(u)){ state.favorites.delete(u); e.currentTarget.classList.remove('on'); }
    else { state.favorites.add(u); e.currentTarget.classList.add('on'); haptic('medium'); }
    save();
  });
  if (hadFocus && input) try { input.focus({ preventScroll: true }); } catch(_) {}
}

function renderResultCard(u){
  const isPending = state.pending.has(u.username);
  const isConnected = state.connections.some(c => c.username.toLowerCase() === u.username.toLowerCase());
  const isFav = state.favorites.has(u.username);
  const fb = initialAvatar(u.name, 96);
  let actions;
  if (isConnected){
    actions = '<div class="action-row">'+
      '<button class="send-btn" id="msg-btn" style="background:var(--surface-2);color:var(--text);box-shadow:none;border:1px solid var(--border)">'+I.message+'<span>Message</span></button>'+
      '<button class="fav-btn '+(isFav?'on':'')+'" id="fav-btn">'+I.star+'</button>'+
    '</div>';
  } else if (isPending){
    actions = '<div class="state-line pending">Request sent · waiting</div>';
  } else {
    actions = '<div class="action-row">'+
      '<button class="send-btn" id="send-btn">'+I.send+'<span>Send Request</span></button>'+
      '<button class="msg-btn" id="msg-btn">'+I.message+'</button>'+
      '<button class="fav-btn '+(isFav?'on':'')+'" id="fav-btn">'+I.star+'</button>'+
    '</div>';
  }
  return '<div class="result-card">'+
    '<div class="result-header">'+
      '<div class="result-av"><img src="'+esc(u.photo)+'" alt="" onerror="this.onerror=null;this.src=\''+fb+'\'"></div>'+
      '<div class="result-info">'+
        '<div class="result-name-row">'+
          '<div class="result-name" id="result-name">'+esc(u.name)+'</div>'+
          (u.verified ? '<span class="result-verified"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>' : '')+
        '</div>'+
        '<div class="result-handle">@'+esc(u.username)+'</div>'+
      '</div>'+
    '</div>'+
    actions+
  '</div>';

function startSendAnimation(user){
  if (!user) return;
  const row = document.querySelector('.action-row');
  if (!row) return;
  row.innerHTML =
    '<div class="send-strip" id="send-strip">'+
      '<div class="send-status" id="send-status">Sending…</div>'+
      '<div class="send-plane-mini" id="send-plane-mini">'+
        '<svg viewBox="0 0 24 24"><path d="M2 12 L22 2 L14 22 L11 14 Z" fill="#fff" stroke="rgba(77,159,255,.6)" stroke-width=".5" stroke-linejoin="round"/></svg>'+
      '</div>'+
    '</div>';
  haptic('medium');
  setTimeout(() => {
    const strip = $('#send-strip');
    const status = $('#send-status');
    if (strip) strip.classList.add('done');
    if (status) status.textContent = 'Request sent';
    haptic('heavy');
    setTimeout(() => finishRequest(user), 1200);
  }, 2400);
}

function finishRequest(user){
  state.pending.set(user.username, { name: user.name, photo: user.photo, requestedAt: Date.now() });
  save();
  toast('Request sent to @'+user.username, 'success');
  refreshFriendsRegions();
  setTimeout(() => {
    if (!state.pending.has(user.username)) return;
    state.pending.delete(user.username);
    state.connections.unshift({ username: user.username, name: user.name, photo: user.photo, connectedAt: Date.now() });
    save(); haptic('heavy');
    toast('@'+user.username+' accepted', 'success');
    if (state.tab === 'friends') refreshFriendsRegions();
    if (state.tab === 'profile') renderProfile();
  }, 8000 + Math.random() * 5000);
}

function refreshPending(){
  const region = $('#region-pending');
  if (!region) return;
  const arr = [...state.pending.entries()];
  if (!arr.length){ region.innerHTML = ''; return; }
  region.innerHTML = '<div class="chat-list">'+
    '<div class="chat-list-head"><div class="chat-list-title">Pending</div>'+
      '<div class="chat-list-count">'+arr.length+'</div></div>'+
    arr.map(([username, data]) => {
      const fb = initialAvatar(data.name, 96);
      return '<div class="pend-row">'+
        '<div class="pend-av"><img src="'+esc(data.photo)+'" alt="" onerror="this.onerror=null;this.src=\''+fb+'\'"></div>'+

        '<div class="pend-status">Waiting</div>'+

function refreshConnections(){
  const region = $('#region-connections');
  if (!region) return;
  if (!state.connections.length){
    region.innerHTML = '<div class="chat-list">'+
      '<div class="chat-list-head"><div class="chat-list-title">Your connections</div>'+
        '<div class="chat-list-count">0</div></div>'+
      '<div class="chat-empty">Nobody yet.<br>Search a username above.</div></div>';
    return;
  }
  region.innerHTML = '<div class="chat-list">'+
    '<div class="chat-list-head"><div class="chat-list-title">Your connections</div>'+
      '<div class="chat-list-count">'+state.connections.length+'</div></div>'+
    state.connections.map((c, i) => {
      const fb = initialAvatar(c.name, 96);
      return '<div class="chat-row" data-open="'+esc(c.username)+'" style="animation-delay:'+(i*40)+'ms">'+
        '<div class="chat-av"><img src="'+esc(c.photo)+'" alt="" onerror="this.onerror=null;this.src=\''+fb+'\'">'+
          (i % 3 !== 1 ? '<span class="chat-online"></span>' : '')+

          '<div class="chat-handle">@'+esc(c.username)+'</div></div>'+

function openChat(username){
  const clean = String(username).replace(/^@/, '');
  haptic('medium');
  try { if (tg?.openTelegramLink){ tg.openTelegramLink('https://t.me/' + clean); return; } } catch(_){}
  window.open('https://t.me/' + clean, '_blank');
}

/* ============================================================
   BLOB BUBBLE - expands in place with scale animation
   ============================================================ */
function setupBlob(){
  const blob = $('#blob');
  if (!blob) return;
  blob.addEventListener('click', (e) => {
    e.stopPropagation();
    // Wobble
    blob.classList.remove('wobble');
    void blob.offsetWidth;
    blob.classList.add('wobble');
    setTimeout(() => blob.classList.remove('wobble'), 550);
    haptic('heavy');
    // Get blob position for scale origin
    const rect = blob.getBoundingClientRect();
    const panel = $('#blob-panel');
    if (panel){
      const cx = (rect.left + rect.width/2) / window.innerWidth * 100;
      const cy = (rect.top + rect.height/2) / window.innerHeight * 100;
      panel.style.transformOrigin = cx + '% ' + cy + '%';
    }
    setTimeout(() => openBlobPanel(), 120);
  });
}

function buildCaretakers(){

let orbitRAF = null;
function startOrbitAnimation(){
  stopOrbitAnimation();
  const orbitersEl = $('#orbiters');
  if (!orbitersEl) return;
  const orbiters = orbitersEl.querySelectorAll('.orbiter');
  const count = orbiters.length;
  const t0 = performance.now();
  function tick(now){
    const elapsed = (now - t0) / 1000;
    const radius = 205;
    for (let i = 0; i < count; i++){
      const baseAngle = (i / count) * Math.PI * 2;
      const angle = baseAngle + elapsed * 0.35;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius * 0.7;
      const rot = angle * 180 / Math.PI + 90;
      orbiters[i].style.transform = 'translate('+x+'px,'+y+'px) rotate('+rot+'deg)';
    }
    orbitRAF = requestAnimationFrame(tick);
  }
  orbitRAF = requestAnimationFrame(tick);
}
function stopOrbitAnimation(){
  if (orbitRAF){ cancelAnimationFrame(orbitRAF); orbitRAF = null; }
}

function startWandering(){
  stopWandering();
  if (state.nova.sleeping) return;
  novaWanderTimer = setInterval(() => {
    if (isDraggingPet || isRotatingRoom) return;
    if (state.nova.sleeping) return;
    if (state.tab !== 'nova') return;
    if (!state.nova.lampOn && state.nova.room === 'bedroom') return;
    if (novaWandering) return;
    novaWandering = true;
    state.nova.x = (Math.random() - 0.5) * 160;
    state.nova.z = 20 + Math.random() * 60;
    const pet = $('#pet');
    if (pet){
      pet.style.transition = 'transform 1.2s cubic-bezier(.5,0,.3,1)';
      pet.style.transform = 'translate3d('+state.nova.x+'px,200px,'+state.nova.z+'px) rotateY(calc(-1 * var(--ry,0deg))) rotateX(calc(-1 * var(--rx,-18deg)))';
      pet.classList.add('hopping');
      setTimeout(() => {
        if (pet){ pet.classList.remove('hopping'); pet.style.transition = ''; }
        novaWandering = false;
      }, 1300);
    } else { novaWandering = false; }
    save();
  }, 3500);
}
function stopWandering(){
  if (novaWanderTimer){ clearInterval(novaWanderTimer); novaWanderTimer = null; }
}

/* ============================================================
   ROOM EVENTS - FIXED DRAG MATH
   ============================================================ */
function setupRoomEvents(){
  const scene = $('#scene');
  const roomEl = $('#room-el');
  const pet = $('#pet');
  const door = $('#f-door');
  const lamp = $('#f-lamp');
  const lampBtn = $('#lamp-toggle');
  const fridge = $('#f-fridge');
  if (!scene || !roomEl || !pet) return;

  isDraggingPet = false;
  isRotatingRoom = false;

  let startPX = 0, startPY = 0;
  let startRx = state.nova.roomRotX, startRy = state.nova.roomRotY;
  let startPetX = 0, startPetZ = 0, startPetSX = 0, startPetSY = 0;
  let floatingPet = null;
  let capturedPointerId = null;

  function createFloatingPet(x, y){
    if (floatingPet) floatingPet.remove();
    floatingPet = document.createElement('div');
    floatingPet.className = 'floating-pet';
    floatingPet.style.left = (x - 35) + 'px';
    floatingPet.style.top = (y - 35) + 'px';
    floatingPet.innerHTML = '<img src="'+PET_GIF+'" alt="" draggable="false">';
    document.body.appendChild(floatingPet);
    pet.classList.add('hidden');
  }
  function moveFloatingPet(x, y){
    if (!floatingPet) return;
    floatingPet.style.left = (x - 35) + 'px';
    floatingPet.style.top = (y - 35) + 'px';
  }
  function releaseFloatingPet(){
    if (!floatingPet) return;
    const r = pet.getBoundingClientRect();
    floatingPet.style.transition = 'left .3s cubic-bezier(.34,1.56,.64,1), top .3s cubic-bezier(.34,1.56,.64,1), opacity .2s, transform .3s';
    floatingPet.style.left = (r.left + r.width / 2 - 35) + 'px';
    floatingPet.style.top = (r.top + r.height / 2 - 35) + 'px';
    floatingPet.style.transform = 'scale(.7)';
    floatingPet.style.opacity = '0';
    const fp = floatingPet;
    setTimeout(() => { if (fp) fp.remove(); if (floatingPet === fp) floatingPet = null; }, 320);
    pet.classList.remove('hidden');
  }

  function down(e){
    const target = e.target;
    // Let interactive elements work without capturing pointer
    if (lamp && (target === lamp || target.closest('#f-lamp'))) return;
    if (lampBtn && (target === lampBtn || target.closest('#lamp-toggle'))) return;
    if (fridge && (target === fridge || target.closest('#f-fridge'))) return;
    if (door && (target === door || target.closest('#f-door'))) return;

    if (target === pet || (target.closest && target.closest('.pet'))){
      isDraggingPet = true;
      isRotatingRoom = false;
      startPetSX = e.clientX; startPetSY = e.clientY;
      startPetX = state.nova.x; startPetZ = state.nova.z;
      pet.classList.add('dragging');
      createFloatingPet(e.clientX, e.clientY);
      showHand(e.clientX, e.clientY);
      haptic('medium');
      try { scene.setPointerCapture(e.pointerId); capturedPointerId = e.pointerId; } catch(_){}
    } else {
      isRotatingRoom = true;
      isDraggingPet = false;
      startPX = e.clientX; startPY = e.clientY;
      startRx = state.nova.roomRotX; startRy = state.nova.roomRotY;
      try { scene.setPointerCapture(e.pointerId); capturedPointerId = e.pointerId; } catch(_){}
    }
  }

  function move(e){
    if (isRotatingRoom){
      e.preventDefault();
      state.nova.roomRotY = startRy + (e.clientX - startPX) * 0.4;
      state.nova.roomRotX = clamp(startRx + (e.clientY - startPY) * 0.25, -50, -5);
      roomEl.style.setProperty('--ry', state.nova.roomRotY + 'deg');
      roomEl.style.setProperty('--rx', state.nova.roomRotX + 'deg');
      pet.style.transform = 'translate3d('+state.nova.x+'px,200px,'+state.nova.z+'px) rotateY(calc(-1 * var(--ry,0deg))) rotateX(calc(-1 * var(--rx,-18deg)))';
    }
    if (isDraggingPet){
      e.preventDefault();
      updateHandPos(e.clientX, e.clientY);
      moveFloatingPet(e.clientX, e.clientY);
      const sdx = e.clientX - startPetSX;
      const sdy = e.clientY - startPetSY;
      const ryRad = state.nova.roomRotY * Math.PI / 180;
      const rxRad = state.nova.roomRotX * Math.PI / 180;
      const cosRy = Math.cos(ryRad), sinRy = Math.sin(ryRad);
      const sinRxAbs = Math.max(0.15, Math.abs(Math.sin(rxRad)));
      const sdyAdj = sdy / sinRxAbs;
      // FIXED: sign flip on sdyAdj terms (verified via derivation)
      const dpx = sdx * cosRy - sdyAdj * sinRy;
      const dpz = sdx * sinRy + sdyAdj * cosRy;
      state.nova.x = clamp(startPetX + dpx, -150, 150);
      state.nova.z = clamp(startPetZ + dpz, -150, 150);
      pet.style.transform = 'translate3d('+state.nova.x+'px,200px,'+state.nova.z+'px) rotateY(calc(-1 * var(--ry,0deg))) rotateX(calc(-1 * var(--rx,-18deg)))';
    }
  }

  function up(e){
    if (capturedPointerId !== null){
      try { scene.releasePointerCapture(capturedPointerId); } catch(_){}
      capturedPointerId = null;
    }
    if (isDraggingPet){
      isDraggingPet = false;
      pet.classList.remove('dragging');
      releaseFloatingPet();
      hideHand();
      save();
      const nearDoor = Math.abs(state.nova.x) < 70 && state.nova.z < -100;
      if (nearDoor) openHouseView();
    }
    isRotatingRoom = false;
  }

  scene.addEventListener('pointerdown', down);
  scene.addEventListener('pointermove', move, { passive: false });
  scene.addEventListener('pointerup', up);
  scene.addEventListener('pointercancel', up);

  if (door) door.addEventListener('click', (e) => {
    e.stopPropagation();
    haptic('heavy');
    openHouseView();
  });
}

/* HOUSE VIEW */
let houseCleanup = null;

function openHouseView(){
  const view = $('#house-view');
  const token = $('#bear-token');
  if (!view || !token) return;
  document.querySelectorAll('.mroom').forEach(r => {
    r.classList.toggle('current', r.dataset.room === state.nova.room);
  });
  const img = token.querySelector('img');
  if (img) img.src = PET_GIF;
  token.style.display = 'block';
  token.style.left = (window.innerWidth / 2 - 30) + 'px';
  token.style.top = (window.innerHeight - 140) + 'px';
  view.classList.add('show');
  haptic('heavy');
  let dragging = false, offsetX = 0, offsetY = 0, highlighted = null;
  function getRoomAt(x, y){
    for (const card of document.querySelectorAll('.mroom')){
      const r = card.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return card;
    }
    return null;
  }
  function onDown(e){
    e.preventDefault();
    dragging = true;
    token.classList.add('dragging');
    const r = token.getBoundingClientRect();
    offsetX = e.clientX - r.left - r.width / 2;
    offsetY = e.clientY - r.top - r.height / 2;
    haptic('light');
  }
  function onMove(e){
    if (!dragging) return;
    e.preventDefault();
    token.style.left = (e.clientX - offsetX - 30) + 'px';
    token.style.top = (e.clientY - offsetY - 30) + 'px';
    const card = getRoomAt(e.clientX, e.clientY);
    if (card !== highlighted){
      if (highlighted) highlighted.classList.remove('highlight');
      if (card && card.dataset.room !== state.nova.room) card.classList.add('highlight');
      highlighted = card;
      if (card) haptic('light');
    }
  }
  function onUp(e){
    if (!dragging) return;
    dragging = false;
    token.classList.remove('dragging');
    const card = getRoomAt(e.clientX, e.clientY);
    if (card && card.dataset.room && card.dataset.room !== state.nova.room){
      const roomId = card.dataset.room;
      closeHouseView();
      haptic('heavy');
      state.nova.room = roomId;
      state.nova.x = 0;
      state.nova.z = 20;
      save();
      setTimeout(() => renderNova(), 250);
      toast('Nova went to the ' + ROOMS[roomId].label, 'success');
    } else {
      token.style.left = (window.innerWidth / 2 - 30) + 'px';
      token.style.top = (window.innerHeight - 140) + 'px';
      if (highlighted){ highlighted.classList.remove('highlight'); highlighted = null; }
    }
  }
  token.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  houseCleanup = () => {
    token.removeEventListener('pointerdown', onDown);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  };
}
function closeHouseView(){
  $('#house-view')?.classList.remove('show');
  const token = $('#bear-token');
  if (token) token.style.display = 'none';
  if (houseCleanup){ houseCleanup(); houseCleanup = null; }
  document.querySelectorAll('.mroom').forEach(r => r.classList.remove('highlight', 'current'));
}

/* GLOBE */
const globe = { canvas:null, ctx:null, W:0, H:0, R:0, dpr:1, rotX:-0.25, rotY:0.5,
  dragging:false, lastX:0, lastY:0, marker:null, markerStart:0, markerAnim:0,
  selectedCity:null, scheduled:false };

function scheduleGlobeRender(){
  if (globe.scheduled) return;
  globe.scheduled = true;
  requestAnimationFrame(() => {
    globe.scheduled = false;
    renderGlobe();
    if (globe.marker && globe.markerAnim < 1) scheduleGlobeRender();
  });
}

function initGlobe(){
  globe.canvas = $('#globe-canvas');
  if (!globe.canvas) return;
  globe.ctx = globe.canvas.getContext('2d');
  resizeGlobe();
  window.addEventListener('resize', resizeGlobe);
  setupGlobeDrag();
  scheduleGlobeRender();
}

function resizeGlobe(){
  if (!globe.canvas) return;
  const r = globe.canvas.getBoundingClientRect();
  globe.dpr = Math.min(window.devicePixelRatio || 1, 2);
  globe.W = r.width; globe.H = r.height;
  globe.canvas.width = r.width * globe.dpr;
  globe.canvas.height = r.height * globe.dpr;
  globe.ctx.setTransform(globe.dpr, 0, 0, globe.dpr, 0, 0);
  globe.R = Math.min(globe.W, globe.H) * 0.38;
  scheduleGlobeRender();
}

function projectGlobe(lat, lng){
  const phi = lat * Math.PI / 180, theta = lng * Math.PI / 180;
  const x = Math.cos(phi) * Math.sin(theta);
  const y = Math.sin(phi);
  const z = Math.cos(phi) * Math.cos(theta);
  const cy = Math.cos(globe.rotY), sy = Math.sin(globe.rotY);
  const x1 = x * cy + z * sy;
  const z1 = -x * sy + z * cy;
  const cx = Math.cos(globe.rotX), sx = Math.sin(globe.rotX);
  const y1 = y * cx - z1 * sx;
  const z2 = y * sx + z1 * cx;
  const cxS = globe.W / 2, cyS = globe.H / 2;
  const persp = 1 + z2 * 0.12;
  return { x: cxS + x1 * globe.R * persp, y: cyS - y1 * globe.R * persp,
    z: z2, visible: z2 > 0.02 };
}

function setupGlobeDrag(){
  const c = globe.canvas;
  if (!c) return;
  function down(e){
    if (e.touches && e.touches.length > 1) return;
    globe.dragging = true;
    const p = e.touches ? e.touches[0] : e;
    globe.lastX = p.clientX; globe.lastY = p.clientY;
  }
  function move(e){
    if (!globe.dragging) return;
    const p = e.touches ? e.touches[0] : e;
    globe.rotY += (p.clientX - globe.lastX) * 0.008;
    globe.rotX = clamp(globe.rotX + (p.clientY - globe.lastY) * 0.008, -1.2, 1.2);
    globe.lastX = p.clientX; globe.lastY = p.clientY;
    if (e.cancelable) e.preventDefault();
    scheduleGlobeRender();
  }
  function up(){ globe.dragging = false; scheduleGlobeRender(); }
  c.addEventListener('pointerdown', down);
  c.addEventListener('pointermove', move, { passive: false });
  c.addEventListener('pointerup', up);
  c.addEventListener('touchstart', down, { passive: true });
  c.addEventListener('touchmove', move, { passive: false });
  c.addEventListener('touchend', up);
}

function drawContinent(ctx, poly){
  const projected = poly.map(p => projectGlobe(p[0], p[1]));
  const runs = []; let current = [];
  for (let i = 0; i < projected.length; i++){
    if (projected[i].visible) current.push(projected[i]);
    else { if (current.length >= 3) runs.push(current); current = []; }
  }
  if (current.length >= 3) runs.push(current);
  runs.forEach(run => {
    ctx.beginPath();
    ctx.moveTo(run[0].x, run[0].y);
    for (let i = 1; i < run.length; i++) ctx.lineTo(run[i].x, run[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(72,140,90,0.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,200,140,0.35)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  });
}

function renderGlobe(){
  const ctx = globe.ctx;
  if (!ctx) return;
  ctx.clearRect(0, 0, globe.W, globe.H);
  const cx = globe.W / 2, cy = globe.H / 2, R = globe.R;
  const glow = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.45);
  glow.addColorStop(0, 'rgba(77,159,255,.18)');
  glow.addColorStop(1, 'rgba(77,159,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.45, 0, Math.PI * 2); ctx.fill();
  const sphere = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.05, cx, cy, R * 1.05);
  sphere.addColorStop(0, '#2f6690');
  sphere.addColorStop(0.5, '#1d4a73');
  sphere.addColorStop(0.9, '#0f2f4a');
  sphere.addColorStop(1, '#08203a');
  ctx.fillStyle = sphere;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  CONTINENTS.forEach(poly => drawContinent(ctx, poly));
  CITIES.forEach(city => {
    const p = projectGlobe(city.lat, city.lng);
    if (!p.visible) return;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8 + Math.max(0, p.z), 0, Math.PI * 2);
    ctx.fill();
    if (!globe.dragging && p.z > 0.5){
      const fs = 10 + p.z * 6;
      ctx.font = fs + 'px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(city.flag, p.x, p.y - 6);
    }
  });
  ctx.restore();
  if (globe.marker){
    const p = projectGlobe(globe.marker.lat, globe.marker.lng);
    if (p.visible){
      const elapsed = (performance.now() - globe.markerStart) / 900;
      globe.markerAnim = Math.min(1, elapsed);
      const eased = 1 - Math.pow(1 - globe.markerAnim, 3);
      ctx.strokeStyle = 'rgba(77,159,255,'+((1 - globe.markerAnim) * 0.9)+')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 8 + eased * 30, 0, Math.PI * 2); ctx.stroke();
      const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 26);
      gg.addColorStop(0, 'rgba(77,159,255,.85)');
      gg.addColorStop(1, 'rgba(77,159,255,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(77,159,255,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 40 * eased); ctx.stroke();
      ctx.fillStyle = '#4d9fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      if (30 * eased > 4){
        ctx.font = (30 * eased) + 'px -apple-system,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(globe.marker.flag, p.x, p.y - 44 * eased);
        ctx.font = 'bold 10px -apple-system,sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.textBaseline = 'top';
        ctx.fillText(globe.marker.code, p.x, p.y - 38 * eased);
      }
    }
  }
}

function selectCity(city){
  globe.marker = city;
  globe.markerStart = performance.now();
  globe.markerAnim = 0;
  globe.selectedCity = city;
  const targetRotY = -(city.lng * Math.PI / 180);
  const targetRotX = (city.lat * Math.PI / 180);
  const startY = globe.rotY;
  let diffY = targetRotY - startY;
  while (diffY > Math.PI) diffY -= Math.PI * 2;
  while (diffY < -Math.PI) diffY += Math.PI * 2;
  const finalY = startY + diffY;
  const startX = globe.rotX;
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / 900);
    const eased = 1 - Math.pow(1 - t, 3);
    globe.rotY = startY + (finalY - startY) * eased;
    globe.rotX = startX + (targetRotX - startX) * eased;
    scheduleGlobeRender();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  $('#onb-continue')?.classList.add('show');
  haptic('medium');
}

function setupOnboarding(){
  const input = $('#onb-search');
  const results = $('#onb-results');
  const cont = $('#onb-continue');
  if (!input || !results) return;
  input.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    if (!q){ results.classList.remove('show'); return; }
    const matches = CITIES.filter(c =>
      c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q)
    ).slice(0, 8);
    if (!matches.length){ results.classList.remove('show'); return; }
    results.innerHTML = matches.map(c =>
      '<div class="onb-city-opt" data-name="'+esc(c.name)+'">'+
        '<span class="onb-city-flag">'+c.flag+'</span>'+
        '<span class="onb-city-name">'+esc(c.name)+'</span>'+
        '<span class="onb-city-country">'+esc(c.country)+'</span>'+
      '</div>'
    ).join('');
    results.classList.add('show');
    results.querySelectorAll('[data-name]').forEach(opt => {
      opt.addEventListener('click', () => {
        const city = CITIES.find(c => c.name === opt.dataset.name);
        if (city){ selectCity(city); results.classList.remove('show'); input.value = city.name; input.blur(); }
      });
    });
  });
  if (cont) cont.addEventListener('click', () => {
    if (!globe.selectedCity) return;
    state.homeCity = globe.selectedCity;
    save();
    haptic('heavy');
    const c = $('#globe-canvas');
    if (c) c.classList.add('zooming');
    const ov = $('#onboarding');
    setTimeout(() => {
      ov?.classList.add('hidden');
      setTimeout(() => { ov?.remove(); switchTab('nova'); }, 500);
    }, 900);
  });
  if (globe.canvas) globe.canvas.addEventListener('pointerup', e => {
    if (globe.dragging) return;
    const rect = globe.canvas.getBoundingClientRect();
    let nearest = null, minDist = 40;
    CITIES.forEach(city => {
      const p = projectGlobe(city.lat, city.lng);
      if (!p.visible) return;
      const d = Math.hypot(p.x - (e.clientX - rect.left), p.y - (e.clientY - rect.top));
      if (d < minDist){ minDist = d; nearest = city; }
    });
    if (nearest) selectCity(nearest);
  });
}

function init(){
  load();
  const loading = $('#loading');
  if (loading) loading.classList.add('out');
  setTimeout(() => { loading?.remove(); }, 600);
  renderHeader();
  renderTabs();
  initTabSlider();
  if (!state.homeCity){
    setTimeout(() => { initGlobe(); setupOnboarding(); }, 100);
  } else {
    $('#onboarding')?.remove();
  }
  switchTab('friends');
  $('#house-close')?.addEventListener('click', closeHouseView);
  $('#fridge-close')?.addEventListener('click', closeFridge);
  $('#fridge-overlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'fridge-overlay') closeFridge();
  });
  $('#blob-overlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'blob-overlay') closeBlobPanel();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
