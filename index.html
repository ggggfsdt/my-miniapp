<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#0a0a0a;--surface-2:#141414;--surface-3:#1e1e1e;
  --text:#fff;--text-2:#a0a0a0;--text-3:#5a5a5a;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);
  --accent:#4d9fff;--accent-2:#6eb0ff;
  --green:#34d399;--gold:#fbbf24;--red:#f87171;--pink:#f472b6;
  --safe-top:max(env(safe-area-inset-top,0px),24px);
  --safe-bottom:max(env(safe-area-inset-bottom,0px),10px);
  --header-h:54px;--tabs-h:68px;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;touch-action:manipulation}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:calc(var(--safe-top) + var(--header-h));
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--safe-top) 16px 0;z-index:100;
  background:rgba(0,0,0,.94);border-bottom:.5px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.h-left{display:flex;align-items:center;gap:10px;min-width:0;height:var(--header-h)}
.h-av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.h-av img{width:100%;height:100%;object-fit:cover;display:block}
.h-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.h-brand{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% + var(--safe-top)/2));
  font-size:17px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,#4d9fff,#a78bfa);-webkit-background-clip:text;background-clip:text;
  color:transparent;pointer-events:none}
.h-right{font-size:12.5px;font-weight:600;color:var(--gold);height:var(--header-h);
  display:flex;align-items:center;gap:4px}

/* MAIN */
#main{position:fixed;top:calc(var(--safe-top) + var(--header-h));
  left:0;right:0;bottom:calc(var(--safe-bottom) + var(--tabs-h));overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px;opacity:0;visibility:hidden;
  transform:translateY(10px);transition:opacity .25s var(--ease),transform .3s var(--spring),visibility .25s}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;visibility:visible;transform:translateY(0)}

/* TABS + SLIDER */
#tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--safe-bottom) + var(--tabs-h));
  padding:8px 12px calc(var(--safe-bottom) + 8px);background:rgba(0,0,0,.94);
  border-top:.5px solid var(--border);z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#tabs-inner{position:relative;display:flex;align-items:center;height:52px;
  background:rgba(20,20,20,.7);border:1px solid var(--border);border-radius:16px;
  padding:5px;touch-action:none;cursor:grab}
#tabs-inner:active{cursor:grabbing}
.tab-indicator{position:absolute;top:5px;bottom:5px;left:5px;
  width:calc((100% - 10px) / 4);background:rgba(77,159,255,.16);
  border:1px solid rgba(77,159,255,.35);border-radius:12px;pointer-events:none;
  transition:transform .45s var(--spring);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(77,159,255,.18)}
.tab-indicator.dragging{transition:none}
.tab-btn{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;background:none;border:0;color:var(--text-3);
  font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.2px;cursor:pointer;
  transition:color .2s var(--ease);height:42px;pointer-events:none}
.tab-btn.active{color:var(--accent)}
.tab-icon{position:relative;display:inline-flex;transition:transform .3s var(--spring)}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tab-btn.active .tab-icon{transform:scale(1.14) translateY(-1px)}
.tab-bell{position:absolute;top:-5px;right:-8px;font-size:10px;line-height:1;
  animation:bellWobble 2.4s ease-in-out infinite;transform-origin:50% 20%}
@keyframes bellWobble{0%,100%{transform:rotate(0)}8%{transform:rotate(14deg)}16%{transform:rotate(-12deg)}
  24%{transform:rotate(8deg)}32%{transform:rotate(-4deg)}40%{transform:rotate(0)}}
.tab-bell::before{content:'';position:absolute;top:-1px;right:-1px;width:5px;height:5px;
  background:var(--red);border-radius:50%;border:1px solid #000;box-shadow:0 0 6px rgba(248,113,113,.8)}

/* SEARCH */
.search-hero{margin-bottom:18px}
.search-title{font-size:24px;font-weight:800;letter-spacing:-.7px;margin-bottom:4px}
.search-sub{font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.4}
.search-wrap{position:relative}
.search-input{width:100%;padding:13px 44px 13px 44px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;color:var(--text);
  font-family:inherit;font-size:16px;outline:none;
  transition:border .2s var(--ease),background .2s var(--ease)}
.search-input:focus{border-color:var(--accent);background:var(--surface-2)}
.search-input::placeholder{color:var(--text-3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;stroke:var(--text-3);fill:none;stroke-width:2;
  stroke-linecap:round;pointer-events:none;transition:stroke .2s}
.search-input:focus~.search-icon{stroke:var(--accent)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border:none;background:var(--surface-3);border-radius:50%;
  color:var(--text-2);font-size:12px;cursor:pointer;display:none;
  align-items:center;justify-content:center}
.search-clear.show{display:flex}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s var(--spring)}
.chip:active{transform:scale(.94);background:var(--surface-2);
  border-color:var(--accent);color:var(--accent)}

/* RESULT CARD */
.results{margin-top:20px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin-bottom:14px;animation:resultIn .45s var(--spring) both}
@keyframes resultIn{from{opacity:0;transform:translateY(12px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.result-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.result-av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2);position:relative}
.result-av img{width:100%;height:100%;object-fit:cover;display:block}
.result-av::after{content:'';position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.result-info{flex:1;min-width:0}
.result-name-row{display:flex;align-items:center;gap:6px}
.result-name{font-size:18px;font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:22px}
.result-verified{flex-shrink:0;width:16px;height:16px;background:var(--accent);
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.result-verified svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.result-handle{font-size:13px;color:var(--text-3);margin-top:3px;font-weight:500}

/* PENDING / CONNECTED BADGE */
.pending-badge{padding:14px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);
  border-radius:12px;text-align:center;font-size:13px;font-weight:600;color:var(--gold);
  display:flex;align-items:center;justify-content:center;gap:8px}
.connected-badge{padding:14px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);
  border-radius:12px;text-align:center;font-size:13px;font-weight:600;color:var(--green);
  display:flex;align-items:center;justify-content:center;gap:8px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* LIQUID GLASS SLIDER */
.lg-slider{position:relative;height:58px;border-radius:29px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),
  inset 0 -1px 0 rgba(0,0,0,.3)}
.lg-slider::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.08),transparent 55%),
    radial-gradient(ellipse at 80% 100%,rgba(77,159,255,.1),transparent 55%);
  border-radius:29px}
.lg-fill{position:absolute;top:0;left:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(77,159,255,.4),rgba(77,159,255,.75));
  border-radius:29px;pointer-events:none;box-shadow:0 0 20px rgba(77,159,255,.4)}
.lg-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.3px;
  pointer-events:none;transition:opacity .2s var(--ease)}
.lg-knob{position:absolute;left:4px;top:4px;width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.08));
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.15),
    0 6px 16px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;cursor:grab;
  transition:box-shadow .2s var(--ease),background .2s var(--ease);will-change:transform}
.lg-knob.dragging{cursor:grabbing;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.15),
    0 8px 24px rgba(77,159,255,.55),0 2px 8px rgba(0,0,0,.4)}
.lg-knob svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
  transition:transform .25s var(--spring)}
.lg-knob.dragging svg{transform:scale(1.1)}

/* CONNECTIONS */
.section{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;margin-bottom:14px}
.section-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-3);padding:14px 18px 10px}
.conn-row{display:flex;align-items:center;gap:12px;padding:10px 18px;position:relative;
  cursor:pointer;transition:background .15s var(--ease);
  animation:connIn .35s var(--spring) both}
.conn-row:active{background:var(--surface-2)}
@keyframes connIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.conn-row+.conn-row::before{content:'';position:absolute;top:0;left:70px;right:18px;
  height:.5px;background:var(--border)}
.conn-av{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:var(--surface-2)}
.conn-av img{width:100%;height:100%;object-fit:cover;display:block}
.conn-body{flex:1;min-width:0}
.conn-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.conn-handle{font-size:12.5px;color:var(--text-3);margin-top:1px;font-weight:500}
.conn-chevron{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;
  stroke-linecap:round;flex-shrink:0}
.conn-empty{padding:32px 18px;text-align:center;font-size:13px;color:var(--text-3);
  line-height:1.5}

/* STATE MSG */
.state-msg{text-align:center;padding:32px 20px;color:var(--text-3)}
.state-msg svg{width:44px;height:44px;stroke:var(--text-3);fill:none;stroke-width:1.4;
  margin-bottom:12px;opacity:.5}
.state-msg .state-title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.state-msg .state-text{font-size:13px;line-height:1.5}

/* NOVA / PET ROOM */
.pet-room{position:relative;width:100%;max-width:340px;aspect-ratio:340/320;
  margin:0 auto 16px;touch-action:none;user-select:none;-webkit-user-select:none}
.room-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.pet{position:absolute;transform:translate(-50%,-100%);z-index:10;
  cursor:grab;filter:drop-shadow(0 8px 8px rgba(0,0,0,.6));
  transition:left .3s var(--ease),top .3s var(--ease)}
.pet:active{cursor:grabbing}
.pet.dragging{transition:none;z-index:999}
.pet-body{display:block;font-size:44px;line-height:1;animation:petIdle 3s ease-in-out infinite;
  transform-origin:50% 90%}
@keyframes petIdle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.02)}}
.pet.dragging .pet-body{animation:petDrag .5s ease-in-out infinite alternate}
@keyframes petDrag{0%{transform:rotate(-6deg) scale(1.08)}100%{transform:rotate(6deg) scale(1.08)}}
.pet.sleeping .pet-body{animation:petSleep 2.5s ease-in-out infinite}
@keyframes petSleep{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.03) rotate(-3deg)}}
.pet.sleeping::after{content:'💤';position:absolute;top:-22px;right:-14px;font-size:16px;
  animation:zzz 2s ease-in-out infinite}
@keyframes zzz{0%,100%{transform:translateY(0) scale(1);opacity:1}
  50%{transform:translateY(-8px) scale(1.2);opacity:.5}}
.pet.playing .pet-body{animation:petPlay .35s ease-in-out infinite alternate}
@keyframes petPlay{0%{transform:translateY(0) rotate(-4deg)}
  100%{transform:translateY(-6px) rotate(4deg)}}
.pet.walking .pet-body{animation:petWalk .35s ease-in-out infinite alternate}
@keyframes petWalk{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}

.nova-info{text-align:center;margin-bottom:16px}
.nova-name{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.nova-meta{font-size:12px;color:var(--text-3);font-weight:500}
.nova-bars{margin:16px 0}
.bar-row{margin-bottom:11px;text-align:left}
.bar-head{display:flex;justify-content:space-between;font-size:12px;font-weight:600;
  color:var(--text-2);margin-bottom:5px}
.bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s var(--spring)}
.nova-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.nova-btns button{padding:12px 4px;border-radius:12px;border:none;background:var(--surface-2);
  color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:transform .15s var(--spring)}
.nova-btns button:active{transform:scale(.94)}
.nova-btns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* HAND CURSOR */
#hand-cursor{position:fixed;pointer-events:none;z-index:99999;display:none;
  transform:translate(-8px,-8px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
#hand-cursor.active{display:block}
.hand-avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;
  border:2px solid #fff;background:var(--surface-2);
  box-shadow:0 2px 8px rgba(0,0,0,.6)}
.hand-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hand-icon{font-size:22px;margin-top:-6px;margin-left:20px;line-height:1}

/* PULSE / TYPING */
.anon-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:10px}
.anon-text{font-size:13.5px;line-height:1.5;font-style:italic;margin-bottom:10px;min-height:22px}
.reveal-btn{width:100%;padding:9px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--accent);font-family:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer}
.reveal-btn:active{opacity:.7}
.type-char{display:inline-block;opacity:0;
  animation:typeIn .35s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes typeIn{from{opacity:0;transform:translateY(6px) scale(.7)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.cursor-bar{display:inline-block;width:2px;height:1em;background:var(--accent);
  margin-left:2px;vertical-align:text-bottom;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* PROFILE */
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px;
  text-align:center}
.profile-av{width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--surface-2);
  margin-bottom:14px;box-shadow:0 0 0 3px var(--accent),0 0 0 6px rgba(77,159,255,.12)}
.profile-av img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.profile-handle{font-size:13.5px;color:var(--text-3);font-weight:500}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 8px;text-align:center}
.stat-val{font-size:18px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500}
.settings{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  overflow:hidden}
.setting-row{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative}
.setting-row+.setting-row::before{content:'';position:absolute;top:0;left:16px;right:16px;
  height:.5px;background:var(--border)}
.setting-lbl{font-size:14px;font-weight:500;flex:1}
.switch{position:relative;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);
  cursor:pointer;transition:background .2s}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;
  border-radius:50%;background:#fff;transition:transform .22s var(--spring)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::before{transform:translateX(16px)}

/* TOAST */
#toast-wrap{position:fixed;top:calc(var(--safe-top) + var(--header-h) + 12px);left:50%;
  transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:6px;
  width:calc(100% - 32px);max-width:360px;align-items:center;pointer-events:none}
.toast{padding:11px 16px;border-radius:12px;background:rgba(20,20,20,.96);
  border:1px solid var(--border-2);font-size:13px;font-weight:600;display:flex;
  align-items:center;gap:9px;opacity:0;transform:translateY(-10px);
  transition:opacity .2s,transform .3s var(--spring);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:rgba(52,211,153,.35);color:var(--green)}
.toast.error{border-color:rgba(248,113,113,.35);color:var(--red)}
.toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>

<div id="header"></div>
<main id="main">
  <section class="page" id="page-friends"></section>
  <section class="page" id="page-nova"></section>
  <section class="page" id="page-pulse"></section>
  <section class="page" id="page-profile"></section>
</main>
<nav id="tabs">
  <div id="tabs-inner">
    <div class="tab-indicator" id="tab-indicator"></div>
  </div>
</nav>
<div id="toast-wrap"></div>
<div id="hand-cursor">
  <div class="hand-avatar"><img id="hand-avatar-img" src="" alt=""></div>
  <div class="hand-icon">🖐️</div>
</div>

<script>
(function(){
'use strict';

/* ============================================
   TELEGRAM
   ============================================ */
const tg = window.Telegram?.WebApp;
if (tg){ try{tg.ready()}catch(_){}; try{tg.expand()}catch(_){} }
function haptic(t){ try{tg?.HapticFeedback?.impactOccurred(t||'light')}catch(_){} }

/* ============================================
   ICONS
   ============================================ */
const I = {

function getUserInfo(){

  const name = u ? ((u.first_name||'')+(u.last_name?' '+u.last_name:'')).trim() : 'You';

/* ============================================
   SEARCH
   ============================================ */
const KNOWN = {
  durov:'Pavel Durov', telegram:'Telegram', botfather:'BotFather',
  tginfo:'Telegram Info', stickers:'Stickers', premium:'Telegram Premium', gif:'GIF'
};
function search(q){
  const clean = String(q).replace(/^@/, '').trim().toLowerCase();
  if (!clean) return { error: 'empty' };
  if (clean.length < 2) return { error: 'too_short' };
  if (!/^[a-z0-9_]{2,32}$/i.test(clean)) return { error: 'invalid' };
  const isKnown = clean in KNOWN;
  return { ok: true, user: {
    username: clean,
    name: isKnown ? KNOWN[clean] : clean.charAt(0).toUpperCase() + clean.slice(1),
    photo: `https://unavatar.io/telegram/${clean}`,
    fallbackPhoto: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(clean)}&backgroundColor=4d9fff&textColor=ffffff`,
    verified: isKnown
  }};
}

/* ============================================
   TYPEWRITER
   ============================================ */
function typeText(el, text, speed = 40, onDone){
  if (!el) return;
  el.innerHTML = '';
  let i = 0;
  const bar = document.createElement('span');
  bar.className = 'cursor-bar';
  el.appendChild(bar);
  function tick(){
    if (i >= text.length){ setTimeout(() => bar.remove(), 400); onDone && onDone(); return; }
    const ch = text[i++];
    const span = document.createElement('span');
    span.className = 'type-char';
    span.textContent = ch;
    el.insertBefore(span, bar);
    setTimeout(tick, speed);
  }
  tick();
}

/* ============================================
   TOAST
   ============================================ */
function toast(text, type){
  type = type || 'info';
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='success'?I.check:type==='error'?I.x:I.search) + `<span>${esc(text)}</span>`;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),280); }, 2400);
  haptic('light');
}

function renderTabs(){

  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.tab===t.id?' active':'');

function setTabIndicator(idx, animate){
  const ind = $('#tab-indicator');
  if (!ind) return;
  if (!animate) ind.classList.add('dragging');
  else ind.classList.remove('dragging');
  ind.style.transform = `translateX(${idx * tabWidth}px)`;
  if (!animate) { void ind.offsetWidth; requestAnimationFrame(()=>ind.classList.remove('dragging')); }
}

function switchTab(tab){
  if (state.tab === tab) return;
  haptic('light');
  $('#page-'+state.tab)?.classList.remove('active');
  state.tab = tab;
  $('#page-'+tab).classList.add('active');
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  setTabIndicator(TABS.findIndex(t => t.id === tab), true);
  if (tab==='friends') renderFriends();
  if (tab==='nova') renderNova();
  if (tab==='pulse') renderPulse();
  if (tab==='profile') renderProfile();
}

function initTabSlider(){
  const inner = $('#tabs-inner');
  let dragging = false, moved = false, startX = 0, startIdx = 0;

  inner.addEventListener('pointerdown', e => {
    dragging = true; moved = false;
    startX = e.clientX;
    startIdx = TABS.findIndex(t => t.id === state.tab);
    $('#tab-indicator').classList.add('dragging');
  });
  document.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 8) moved = true;
    if (moved){
      const w = tabWidth;
      const maxX = (TABS.length - 1) * w;
      const target = clamp(startIdx * w + dx, 0, maxX);
      $('#tab-indicator').style.transform = `translateX(${target}px)`;
    }
  });
  document.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    const ind = $('#tab-indicator');
    ind.classList.remove('dragging');
    const innerRect = inner.getBoundingClientRect();
    const relX = e.clientX - innerRect.left - 5;
    let idx;
    if (!moved){
      idx = Math.floor(relX / tabWidth);
    } else {
      idx = Math.round(relX / tabWidth);
    }
    idx = clamp(idx, 0, TABS.length - 1);
    ind.style.transform = `translateX(${idx * tabWidth}px)`;
    if (TABS[idx].id !== state.tab){
      haptic('medium');
      switchTab(TABS[idx].id);
    }
  });
  document.addEventListener('pointercancel', () => {
    if (!dragging) return;
    dragging = false;
    $('#tab-indicator').classList.remove('dragging');
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), true);
  });
  window.addEventListener('resize', () => {
    tabWidth = (inner.clientWidth - 10) / TABS.length;
    setTabIndicator(TABS.findIndex(t => t.id === state.tab), false);
  });
}

function wireFriends(){

/* ============================================
   SEND REQUEST
   ============================================ */
function sendRequest(user){
  if (!user) return;
  if (state.connections.some(c => c.username.toLowerCase() === user.username.toLowerCase())){
    toast('Already connected', 'info'); return;
  }
  if (state.pending.has(user.username)){ toast('Request already sent', 'info'); return; }

  state.pending.add(user.username);
  save();
  haptic('heavy');
  toast(`Request sent to @${user.username}`, 'success');
  renderFriends();

  // Simulate acceptance after a delay (in real app: server push)
  const delay = 6000 + Math.random() * 6000;
  setTimeout(() => {
    if (!state.pending.has(user.username)) return;
    state.pending.delete(user.username);
    state.connections.unshift({
      username: user.username,
      name: user.name,
      photo: user.photo,
      fallbackPhoto: user.fallbackPhoto
    });
    save();
    haptic('heavy');
    toast(`@${user.username} accepted your request`, 'success');
    renderFriends();
    renderProfile();
  }, delay);
}

function openChat(username){
  const clean = String(username).replace(/^@/, '');

}

/* ============================================
   LIQUID GLASS SLIDER
   ============================================ */
function setupLiquidSlider(el, onComplete){
  const knob = el.querySelector('.lg-knob');
  const fill = el.querySelector('.lg-fill');
  const text = el.querySelector('.lg-text');
  let dragging = false, startX = 0, currentX = 0, maxX = 0;

  function measure(){ maxX = el.offsetWidth - knob.offsetWidth - 8; }
  requestAnimationFrame(measure);
  window.addEventListener('resize', measure);

  function onDown(e){
    dragging = true;
    startX = e.clientX - currentX;
    knob.style.transition = 'none';
    fill.style.transition = 'none';
    knob.classList.add('dragging');
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    haptic('light');
  }
  function onMove(e){
    if (!dragging) return;
    currentX = clamp(e.clientX - startX, 0, maxX);
    knob.style.transform = `translateX(${currentX}px)`;
    fill.style.width = (currentX + knob.offsetWidth + 4) + 'px';
    text.style.opacity = String(Math.max(0, 1 - currentX / (maxX * 0.4)));
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    knob.classList.remove('dragging');
    knob.style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1)';
    fill.style.transition = 'width .45s cubic-bezier(.34,1.56,.64,1)';
    if (currentX >= maxX * 0.82){
      currentX = maxX;
      knob.style.transform = `translateX(${maxX}px)`;
      fill.style.width = '100%';
      haptic('heavy');
      setTimeout(() => onComplete && onComplete(), 250);
    } else {
      currentX = 0;
      knob.style.transform = 'translateX(0)';
      fill.style.width = '0px';
      text.style.opacity = '1';
      haptic('light');
    }
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}

        <rect x="0" y="0" width="340" height="320" fill="url(#warm)" pointer-events="none"/>
      </svg>

      <div class="pet" id="pet" style="left:${(n.x/340*100)}%;top:${(n.y/320*100)}%">
        <div class="pet-body">🦊</div>
      </div>
    </div>

    <div class="nova-info">
      <div class="nova-name">Nova</div>
      <div class="nova-meta">Level ${n.level} · ${state.connections.length} friends · drag me around</div>
    </div>

    <div class="nova-bars">
      ${['food','happy','energy'].map((k,i)=>`
        <div class="bar-row">
          <div class="bar-head"><span>${k[0].toUpperCase()+k.slice(1)}</span><span>${n[k]}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${n[k]}%;background:${['#34d399','#fbbf24','#4d9fff'][i]}"></div></div>
        </div>`).join('')}
    </div>

    <div class="nova-btns">
      <button data-care="feed">${I.feed}<span>Feed</span></button>
      <button data-care="play">${I.play}<span>Play</span></button>
      <button data-care="sleep">${I.sleep}<span>Sleep</span></button>
    </div>

    <div class="section" style="margin-top:16px">
      <div class="section-title">Level progress</div>
      <div style="padding:0 18px 16px">
        <div class="bar-head"><span>Level ${n.level}</span><span>${n.xp}/${n.xpMax}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      </div>
    </div>`;

  $('#page-nova').innerHTML = roomHTML;

  $$('[data-care]').forEach(b => b.addEventListener('click', () => care(b.dataset.care)));
  initPetDrag();
  startPetBehavior();
}

function initPetDrag(){
  const pet = $('#pet');
  const room = $('#pet-room');
  if (!pet || !room) return;

  function getSvgCoords(clientX, clientY){
    const rect = room.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * 340;
    const y = ((clientY - rect.top) / rect.height) * 320;
    return { x, y };
  }

  function clampToFloor(x, y){
    // Floor diamond: center (170,150), half-width 110, half-height 55
    // Safe inner region: shrink by 15 to keep pet on floor
    const cx = 170, cy = 150, hw = 95, hh = 45;
    // Clamp to diamond: |dx|/hw + |dy|/hh <= 1
    let dx = x - cx, dy = y - cy;
    const d = Math.abs(dx)/hw + Math.abs(dy)/hh;
    if (d > 1){ dx /= d; dy /= d; }
    return { x: cx + dx, y: cy + dy };
  }

  function setPetPos(svgX, svgY, animate){
    if (animate) pet.style.transition = 'left .35s ease, top .35s ease';
    else pet.style.transition = 'none';
    pet.style.left = (svgX / 340 * 100) + '%';
    pet.style.top = (svgY / 320 * 100) + '%';
    state.nova.x = svgX;
    state.nova.y = svgY;
  }

  pet.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragging = true;
    pet.classList.add('dragging');
    try { pet.setPointerCapture(e.pointerId); } catch(_){}
    showHand(e.clientX, e.clientY);
    haptic('medium');
  });

  document.addEventListener('pointermove', e => {
    if (!dragging) return;
    updateHandPos(e.clientX, e.clientY);
    const c = getSvgCoords(e.clientX, e.clientY);
    const clamped = clampToFloor(c.x, c.y);
    setPetPos(clamped.x, clamped.y, false);
  });

  document.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    pet.classList.remove('dragging');
    try { pet.releasePointerCapture(e.pointerId); } catch(_){}
    hideHand();
    save();
    haptic('light');
  });

  // Persist saved position
  setPetPos(state.nova.x || 170, state.nova.y || 160, false);
}

function showHand(x, y){
  const h = $('#hand-cursor');
  const u = getUserInfo();
  $('#hand-avatar-img').src = u.photo;
  h.classList.add('active');
  updateHandPos(x, y);
}
function updateHandPos(x, y){
  const h = $('#hand-cursor');
  h.style.left = (x + 12) + 'px';
  h.style.top = (y + 12) + 'px';
}
function hideHand(){
  $('#hand-cursor').classList.remove('active');
}

/* ============================================
   PET HABITS (autonomous behavior)
   ============================================ */
function startPetBehavior(){
  clearTimeout(petBehaviorTimer);
  const states = ['idle','idle','idle','sleeping','playing','walking'];
  function next(){
    if (dragging) { petBehaviorTimer = setTimeout(next, 2000); return; }
    const s = states[Math.floor(Math.random() * states.length)];
    const pet = $('#pet');
    if (!pet){ petBehaviorTimer = setTimeout(next, 3000); return; }
    pet.classList.remove('sleeping','playing','walking');
    if (s !== 'idle') pet.classList.add(s);

    if (s === 'walking'){
      const angle = Math.random() * Math.PI * 2;
      const dist = 25 + Math.random() * 40;
      let nx = 170 + Math.cos(angle) * dist;
      let ny = 150 + Math.sin(angle) * dist * 0.5;
      // Clamp to floor
      const hw = 95, hh = 45;
      let dx = nx - 170, dy = ny - 150;
      const d = Math.abs(dx)/hw + Math.abs(dy)/hh;
      if (d > 1){ dx /= d; dy /= d; }
      nx = 170 + dx; ny = 150 + dy;
      state.nova.x = nx; state.nova.y = ny;
      pet.style.transition = 'left 2s ease-in-out, top 2s ease-in-out';
      pet.style.left = (nx/340*100) + '%';
      pet.style.top = (ny/320*100) + '%';
      setTimeout(() => { pet.style.transition = ''; }, 2100);
    }

    petBehaviorTimer = setTimeout(next, 3500 + Math.random() * 4000);
  }
  next();
}

/* ============================================
   NOVA ACTIONS
   ============================================ */
function care(kind){
  const n = state.nova;
  if (kind==='feed'){ n.food=clamp(n.food+18,0,100); n.energy=clamp(n.energy-5,0,100); n.xp+=15; }
  if (kind==='play'){ n.happy=clamp(n.happy+16,0,100); n.energy=clamp(n.energy-12,0,100); n.xp+=20; }
  if (kind==='sleep'){ n.energy=clamp(n.energy+22,0,100); n.food=clamp(n.food-4,0,100); n.xp+=10; }
  if (n.xp >= n.xpMax){ n.level++; n.xp=0; n.xpMax=Math.round(n.xpMax*1.2);
    toast('Nova leveled up', 'success'); haptic('heavy'); }
  else haptic('light');
  save(); renderNova();
}

/* ============================================
   PULSE
   ============================================ */
function renderPulse(){
  $('#page-pulse').innerHTML = `
    <div class="section">
      <div class="section-title">Anonymous messages</div>
      <div style="padding:0 18px 16px">
        <div class="anon-card">
          <div class="anon-text" id="anon1"></div>
          <button class="reveal-btn" data-reveal="50">Reveal author · 50 💎</button>
        </div>
        <div class="anon-card">
          <div class="anon-text" id="anon2"></div>
          <button class="reveal-btn" data-reveal="50">Reveal author · 50 💎</button>
        </div>
      </div>
    </div>`;
  const m1 = "You're building something cool. Keep going.";
  const m2 = "Bro it's 3am, close the laptop and sleep.";
  setTimeout(() => typeText($('#anon1'), m1, 35), 150);
  setTimeout(() => typeText($('#anon2'), m2, 35), 1500);

  $$('[data-reveal]').forEach(b => b.addEventListener('click', () => {
    const cost = +b.dataset.reveal;
    if (state.balance < cost){ toast('Not enough diamonds', 'error'); return; }
    state.balance -= cost; save(); renderHeader();
    toast('Author revealed', 'success'); haptic('heavy');
    b.textContent = 'Revealed ✓'; b.disabled = true; b.style.color = 'var(--green)';
  }));
}

/* ============================================
   PROFILE
   ============================================ */
function renderProfile(){
  const u = getUserInfo();
  const handle = u.username ? '@'+u.username : 'no username';
  $('#page-profile').innerHTML = `
    <div class="profile-hero">
      <div class="profile-av"><img src="${esc(u.photo)}" alt=""></div>
      <div class="profile-name">${esc(u.name)}</div>
      <div class="profile-handle">${esc(handle)}</div>
    </div>
    <div class="profile-stats">
      <div class="stat-card"><div class="stat-val">${state.connections.length}</div><div class="stat-lbl">Connections</div></div>
      <div class="stat-card"><div class="stat-val">${state.pending.size}</div><div class="stat-lbl">Pending</div></div>
      <div class="stat-card"><div class="stat-val">${state.nova.level}</div><div class="stat-lbl">Nova</div></div>
    </div>
    <div class="settings">
      <div class="setting-row"><span class="setting-lbl">Notifications</span>
        <label class="switch"><input type="checkbox" id="notif" ${state.notifications?'checked':''}><span class="slider"></span></label>
      </div>
      <div class="setting-row"><span class="setting-lbl">Haptics</span>
        <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
      </div>
    </div>
    <div style="padding:20px;text-align:center;font-size:11px;color:var(--text-3)">Orbit · v1.1</div>`;
  $('#notif')?.addEventListener('change', e => { state.notifications = e.target.checked; save(); });
}

/* ============================================
   INIT
   ============================================ */
function init(){
  load();
  renderHeader();
  renderTabs();
  initTabSlider();
  switchTab('friends');
}
init();

})();
</script>
