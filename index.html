<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Dlballs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#050506;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#dl{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1a1a20 0%,#0a0a10 55%,#050507 100%)}
#dl-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.dl-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;z-index:10;display:flex;align-items:center;gap:6px;pointer-events:none}
.dl-pill{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;background:rgba(10,10,12,.85);border:1px solid rgba(255,255,255,.07);border-radius:13px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:11px;font-weight:600;pointer-events:auto;flex-shrink:0}
.dl-pill .lbl{color:rgba(255,255,255,.4);font-size:9px;letter-spacing:.8px;font-weight:700}
.dl-pill .val{color:#fff;font-variant-numeric:tabular-nums;font-weight:800}
.dl-pill.pot{border-color:rgba(255,220,80,.35)}
.dl-pill.pot .val{color:#ffdd44}
.dl-pill.map{border-color:rgba(120,200,255,.35)}
.dl-pill.map .val{color:#7fc8ff;font-size:10px}
.diamond-mini{width:13px;height:13px;object-fit:contain;flex-shrink:0;animation:dlDP 2.2s ease-in-out infinite}
@keyframes dlDP{0%,100%{filter:drop-shadow(0 0 3px rgba(255,220,80,.4))}50%{filter:drop-shadow(0 0 8px rgba(255,220,80,1)) brightness(1.15)}}
.dl-close{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.07);background:rgba(10,10,12,.85);color:rgba(255,255,255,.85);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;pointer-events:auto;flex-shrink:0}
.dl-close:active{transform:scale(.9)}
.dl-ticker{position:absolute;top:calc(env(safe-area-inset-top,0px) + 42px);left:10px;right:10px;z-index:9;display:flex;gap:4px;overflow:hidden;pointer-events:none;mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
.dl-ticker .chip{flex-shrink:0;background:rgba(10,10,12,.75);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:3px 9px;font-size:10px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap;display:flex;align-items:center;gap:4px;animation:dlCI .35s ease}
.dl-ticker .chip .amt{color:#8fe5b0;font-weight:800}
.dl-ticker .chip img{width:11px;height:11px}
@keyframes dlCI{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.dl-mapbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);left:10px;right:10px;z-index:11;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.dl-mapbar button{pointer-events:auto;height:24px;padding:0 10px;border-radius:8px;background:rgba(14,14,18,.85);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.65);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:background .15s,color .15s,border-color .15s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dl-mapbar button:active{transform:scale(.95)}
.dl-mapbar button.on{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35)}
.dl-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;z-index:10;display:flex;gap:8px}
.dl-btn{flex:1;height:44px;border-radius:13px;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.dl-btn:active{transform:scale(.97)}
.dl-btn:disabled{opacity:.3;pointer-events:none}
.dl-btn-buy{background:rgba(20,20,24,.9);color:#fff;border:1px solid rgba(255,255,255,.08)}
.dl-btn-launch{background:#f4f4f8;color:#0a0a0c}
.dl-modal{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dl-modal.show{display:flex;animation:dlF .2s}
@keyframes dlF{from{opacity:0}to{opacity:1}}
.dl-sheet{width:100%;max-width:440px;background:#0e0e12;border-radius:22px 22px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid rgba(255,255,255,.06);animation:dlSU .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlSU{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dl-grip{width:36px;height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin:0 auto 12px}
.dl-sheet h3{font-size:15px;font-weight:700;color:#fff;text-align:center;margin-bottom:14px}
.dl-seg{display:flex;gap:3px;padding:3px;background:rgba(255,255,255,.04);border-radius:11px;margin-bottom:14px}
.dl-seg button{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.dl-seg button.on{background:rgba(255,255,255,.14);color:#fff}
.dl-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.dl-row.inline{flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:14px}
.dl-row label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.9px;text-transform:uppercase;font-weight:700;padding-left:2px}
.dl-row.inline label{font-size:13px;color:#fff;letter-spacing:0;text-transform:none;font-weight:600;padding:0}
.dl-row .sub{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:1px;padding-left:2px}
.dl-input{width:100%;height:42px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#fff;font-size:15px;font-weight:700;text-align:center;outline:none;font-family:inherit;font-variant-numeric:tabular-nums}
.dl-input:focus{border-color:rgba(255,255,255,.35)}
.dl-hint{font-size:10.5px;color:rgba(255,255,255,.35);line-height:1.5;padding:0 2px}
.dl-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.dl-tier{padding:10px 2px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;cursor:pointer;font-size:10px;font-weight:800;text-align:center;font-family:inherit;line-height:1.35;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.dl-tier .dot{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.dl-tier .dot.gray{background:radial-gradient(circle at 32% 28%,#e8e8ee 0%,#8a8a92 55%,#3a3a40 100%)}
.dl-tier .dot.silver{background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d0d0dc 45%,#5a5a70 100%)}
.dl-tier .dot.green{background:radial-gradient(circle at 32% 28%,#e0ffe8 0%,#30c977 50%,#0a3a20 100%)}
.dl-tier .dot.gold{background:radial-gradient(circle at 32% 28%,#fffbd0 0%,#ffcc33 45%,#8a5a10 100%)}
.dl-tier small{font-size:9.5px;color:rgba(255,255,255,.5);font-weight:600}
.dl-tier.on{border-color:#fff;background:rgba(255,255,255,.13)}
.dl-switch{position:relative;width:46px;height:28px;flex-shrink:0;cursor:pointer}
.dl-switch input{opacity:0;width:0;height:0;position:absolute}
.dl-switch-slider{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:999px;transition:.22s}
.dl-switch-slider::before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.22s}
.dl-switch input:checked + .dl-switch-slider{background:#3aa55a}
.dl-switch input:checked + .dl-switch-slider::before{transform:translateX(18px)}
.dl-actions{display:flex;gap:8px;margin-top:4px}
.dl-actions button{flex:1;height:42px;border-radius:11px;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.dl-cancel{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7)}
.dl-confirm{background:#f4f4f8;color:#0a0a0c}
.dl-result{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px}
.dl-result.show{display:flex;animation:dlF .25s}
.dl-result-box{width:100%;max-width:360px;background:#0e0e12;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:26px 22px;text-align:center;animation:dlPP .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlPP{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.dl-res-tag{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase;font-weight:800}
.dl-res-amt{font-size:44px;font-weight:900;color:#fff;margin:8px 0 4px;letter-spacing:-1.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.dl-res-amt img{width:32px;height:32px}
.dl-res-amt.lose{color:#7a7a82}
.dl-res-mult{font-size:22px;font-weight:800;color:#ffdd44;margin-bottom:4px;letter-spacing:-0.5px}
.dl-res-mult.lose{color:#7a7a82}
.dl-res-sub{font-size:11.5px;color:rgba(255,255,255,.45);margin-bottom:18px}
/* ═════ OPTIMIZED ROULETTE ═════ */
.dl-r{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;background:radial-gradient(ellipse at 50% 50%,#14141a 0%,#07070a 70%,#020203 100%);transform:translateZ(0);-webkit-transform:translateZ(0)}
.dl-r.show{display:flex;animation:dlF .2s}
.dl-r-title{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:2.5px;text-transform:uppercase;font-weight:800;min-height:14px;text-align:center}
.dl-r-rows{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;overflow:hidden;transform:translateZ(0);-webkit-transform:translateZ(0)}
.dl-r-row{position:relative;flex-shrink:0;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(24,24,30,.85),rgba(6,6,8,.95));border:1px solid rgba(255,255,255,.06);perspective:600px;-webkit-perspective:600px;perspective-origin:50% 50%;contain:layout style paint;transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dl-r-viewport{position:absolute;inset:0;overflow:hidden;transform:translateZ(0);-webkit-transform:translateZ(0)}
.dl-r-ball{position:absolute;left:50%;top:50%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;will-change:transform,opacity;transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none;contain:strict}
.dl-r-ball.gray{background:radial-gradient(circle at 32% 28%,#e8e8ee 0%,#8a8a92 55%,#3a3a40 100%);color:#101014}
.dl-r-ball.silver{background:radial-gradient(circle at 32% 28%,#ffffff 0%,#d0d0dc 45%,#5a5a70 100%);color:#15151e}
.dl-r-ball.green{background:radial-gradient(circle at 32% 28%,#e0ffe8 0%,#30c977 50%,#0a3a20 100%);color:#042a18}
.dl-r-ball.gold{background:radial-gradient(circle at 32% 28%,#fffbd0 0%,#ffcc33 45%,#8a5a10 100%);color:#3a2000}
.dl-r-ball.winner::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;animation:dlWR .9s ease-in-out infinite;will-change:transform,opacity}
@keyframes dlWR{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.dl-r-pointer{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:13px;color:#fff;font-weight:900;text-shadow:0 0 10px #fff;pointer-events:none;z-index:500}
.dl-r-amount{font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px;opacity:0;transform:scale(.7);transition:.3s;min-height:36px;display:flex;align-items:center;justify-content:center;gap:6px}
.dl-r-amount img{width:24px;height:24px}
.dl-r-amount.show{opacity:1;transform:scale(1)}
@media (max-width: 420px){
  .dl-r{padding:16px 10px;gap:6px}
  .dl-r-row{border-radius:14px;perspective:500px;-webkit-perspective:500px}
  .dl-r-title{font-size:10px;letter-spacing:2px}
  .dl-r-pointer{font-size:11px}
}
</style>

        <div class="dl-row"><label>Amount to spend</label><input class="dl-input" id="dl-rand-amt" value="100" inputmode="numeric"></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

let BALANCE = 5000;
try { if (window.__state?.balance) BALANCE = window.__state.balance; } catch(_){}

const DIAMOND_GIF = 'https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif';
const TRI_GIF = 'https://i.postimg.cc/QtKjfgmD/ezgif-2b4855fe8e25a8f6.gif';
const GUN_GIF = 'https://i.postimg.cc/VLzSB5tx/ezgif-81568bb4425aeea2.gif';
const MAX_BALLS = 20;

const TIER_CFG = {
  gray:{color:0x9a9aa0,metalness:0.75,roughness:0.42,emissive:0,eInt:0},
  silver:{color:0xe0e0e6,metalness:1.00,roughness:0.14,emissive:0x151520,eInt:0.35},
  green:{color:0x30c977,metalness:0.90,roughness:0.18,emissive:0x0a4a2c,eInt:0.7},
  gold:{color:0xffcc33,metalness:1.00,roughness:0.10,emissive:0x8a4a10,eInt:1.1},
};
function tierFor(v){ return v>=1000?'gold':v>=500?'green':v>=100?'silver':'gray'; }
function ballR(v){ return Math.round((6 + Math.log10(v+1)*1.5)*10)/10; }
const SHARED_MAT = {};
for (const t in TIER_CFG){
  const c = TIER_CFG[t];
  SHARED_MAT[t] = new THREE.MeshStandardMaterial({color:c.color,metalness:c.metalness,roughness:c.roughness,emissive:c.emissive,emissiveIntensity:c.eInt});
}
const BALL_OUTLINE = new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide,transparent:true,opacity:0.55});
const MAP_OUTLINE  = new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide,transparent:true,opacity:0.4});
const ballGeoCache = new Map(), ballOutlineCache = new Map();
function getBallGeo(r){ if (ballGeoCache.has(r)) return ballGeoCache.get(r); const g = new THREE.SphereGeometry(r,18,14); ballGeoCache.set(r,g); return g; }
function getBallOutlineGeo(r){ const k = r+1; if (ballOutlineCache.has(k)) return ballOutlineCache.get(k); const g = new THREE.SphereGeometry(r+1,10,8); ballOutlineCache.set(k,g); return g; }
function makeBallMesh(value, tier){
  const r = ballR(value);
  const mesh = new THREE.Mesh(getBallGeo(r), SHARED_MAT[tier]||SHARED_MAT.gray);
  mesh.add(new THREE.Mesh(getBallOutlineGeo(r), BALL_OUTLINE));
  return mesh;
}
function roundedBoxGeo(w,h,d,r,bev=1){
  const shape = new THREE.Shape();
  const x=-w/2,y=-h/2;
  shape.moveTo(x+r,y);
  shape.lineTo(x+w-r,y); shape.quadraticCurveTo(x+w,y,x+w,y+r);
  shape.lineTo(x+w,y+h-r); shape.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  shape.lineTo(x+r,y+h); shape.quadraticCurveTo(x,y+h,x,y+h-r);
  shape.lineTo(x,y+r); shape.quadraticCurveTo(x,y,x+r,y);
  const geo = new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:2});
  geo.translate(0,0,-d/2);
  return geo;
}

const MAP_NAMES = { classic:'Classic', maze:'Maze', puck:'Puck Arena', brick:'Brick', dart:'Darts', blade:'Blade Pit' };
const MAP = { type:'classic' };
let FORCED_MAP = 'random';

function regenerateMap(){
  const r = Math.random();
  if (FORCED_MAP === 'random'){
    if (r < 0.20) MAP.type = 'classic';
    else if (r < 0.40) MAP.type = 'maze';
    else if (r < 0.58) MAP.type = 'puck';
    else if (r < 0.74) MAP.type = 'brick';
    else if (r < 0.88) MAP.type = 'dart';
    else MAP.type = 'blade';
  } else {
    MAP.type = FORCED_MAP;
  }

  MAP.spinCy = 1300; MAP.spinR = 130; MAP.spinTube = 12;
  MAP.upperTopY = 1180; MAP.upperTopHalf = 240;
  MAP.upperBotY = 380; MAP.upperBotHalf = 130;
  MAP.lowerTopY = 200; MAP.lowerTopHalf = 140;
  MAP.lowerBotY = -240; MAP.lowerBotHalf = 130;
  MAP.floorY = -240; MAP.floorOpen = 105;
  MAP.pegs = []; MAP.bars = [];
  MAP.puckArena = null; MAP.brickWall = null; MAP.dartBox = null;
  MAP.dartGate = null; MAP.bladeArms = null; MAP.blackhole = null;
  MAP.useTriangle = false;

  MAP.pegTop = 1050; MAP.pegBot = 500; MAP.pegRows = 6; MAP.pegSpan = 320; MAP.pegR = 11;

  function buildPegs(){
    for (let rr=0; rr<MAP.pegRows; rr++){
      const t = rr/(MAP.pegRows-1);
      const y = MAP.pegTop + (MAP.pegBot-MAP.pegTop)*t;
      const count = 5 + (rr%2);
      const step = MAP.pegSpan/(count+1);
      const startX = -MAP.pegSpan/2 + step;

function shuffleHoles(n, redMult, normalMult){
  const baseA = Math.random()*Math.PI*2;
  const redIdx = Math.floor(Math.random()*n);
  const holes = [];
  for (let i=0;i<n;i++){
    const spread = n>=3 ? (Math.PI*2/n) : Math.PI;
    const a = baseA + i*spread + (Math.random()-0.5)*0.3;
    const isRed = i===redIdx;
    holes.push({a, r:44+Math.random()*10, mult:isRed?redMult:normalMult, red:isRed});
  }
  return holes;
}

function createGifCanvas(src, initialSize){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = src;
  img.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;pointer-events:none;clip-path:inset(100%)';
  document.body.appendChild(img);
  const canvas = document.createElement('canvas');
  canvas.width = initialSize; canvas.height = initialSize;
  const cctx = canvas.getContext('2d');
  cctx.fillStyle = '#000000';
  cctx.fillRect(0,0,initialSize,initialSize);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  const state = { img, canvas, cctx, tex, ready: false, lastTick: 0 };
  img.onload = () => {
    canvas.width = img.naturalWidth || initialSize;
    canvas.height = img.naturalHeight || initialSize;
    cctx.fillStyle = '#000000';
    cctx.fillRect(0,0,canvas.width,canvas.height);
    cctx.drawImage(img, 0, 0);
    tex.needsUpdate = true;
    state.ready = true;
  };
  return state;
}
function tickGifState(state, now){
  if (!state.ready) return;
  if (now - state.lastTick < 16) return;
  state.lastTick = now;
  state.cctx.clearRect(0,0,state.canvas.width,state.canvas.height);
  state.cctx.drawImage(state.img, 0, 0, state.canvas.width, state.canvas.height);
  state.tex.needsUpdate = true;
}

function buildMap(){
  while (mapGroup.children.length){ const c = mapGroup.children[0]; mapGroup.remove(c); if (c.geometry) c.geometry.dispose(); }
  WALLS = []; PEGS = []; BARS = []; BRICKS = [];
  triMesh = null; gifPlane = null;
  spinMesh = null; spinRail = null; spinInner = null;
  puckGroup = null;
  bladeMeshes = [];

  function wall(ax,ay,bx,by){
    const dx = bx-ax, dy = by-ay, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(roundedBoxGeo(len,12,32,5,0.8), wallMat);
    m.position.set((ax+bx)/2,(ay+by)/2,0);
    m.rotation.z = ang;
    addOutline(m,1.06);
    mapGroup.add(m);
    WALLS.push({x1:ax,y1:ay,x2:bx,y2:by,thick:6});
  }
  wall(-MAP.upperTopHalf, MAP.upperTopY, -MAP.upperBotHalf, MAP.upperBotY);
  wall( MAP.upperTopHalf, MAP.upperTopY,  MAP.upperBotHalf, MAP.upperBotY);
  wall(-MAP.lowerTopHalf, MAP.lowerTopY, -MAP.lowerBotHalf, MAP.lowerBotY);
  wall( MAP.lowerTopHalf, MAP.lowerTopY,  MAP.lowerBotHalf, MAP.lowerBotY);

  if (MAP.puckArena){
    const A = MAP.puckArena;
    const topY = A.cy + A.h/2;
    wall(-MAP.upperBotHalf, MAP.upperBotY, -A.topOpeningW/2, topY);
    wall( MAP.upperBotHalf, MAP.upperBotY,  A.topOpeningW/2, topY);
  }
  if (MAP.dartBox){
    const D = MAP.dartBox;
    const topY = D.cy + D.h/2;
    wall(-MAP.upperBotHalf, MAP.upperBotY, -D.topOpeningW/2, topY);
    wall( MAP.upperBotHalf, MAP.upperBotY,  D.topOpeningW/2, topY);
  }

  MAP.pegs.forEach(p => {

    const m = new THREE.Mesh(new THREE.SphereGeometry(p.r,16,12), pegMatBase.clone());

    m.userData.hit = 0;
    m.userData.baseColor = 0xf6f6fc;
    m.add(new THREE.Mesh(new THREE.SphereGeometry(p.r+0.8,10,8), MAP_OUTLINE));

  MAP.bars.forEach(b => {
    const m = new THREE.Mesh(roundedBoxGeo(b.halfW*2, 16, 28, 6, 1.2), barMat);
    m.position.set(b.x, b.y, 0);

    mapGroup.add(m);
    const arrows = [];
    for (let k = 0; k < 3; k++){
      const a = new THREE.Mesh(CHEVRON_GEO, arrowMat);
      a.userData.baseScale = 14;
      a.renderOrder = 300;
      mapGroup.add(a);
      arrows.push(a);
    }
    BARS.push({mesh:m, y:b.y, halfW:b.halfW, x:b.x, baseX:b.baseX, speed:b.speed, range:b.range, phase:b.phase, prevX:b.x, arrows});
  });

  if (MAP.brickWall){

function updateGateMeshes(){
  const G = MAP.dartGate;
  if (!G || !G.leftMesh || !G.rightMesh) return;
  const halfGap = G.apexGap / 2;
  const la = { x: -G.halfW, y: G.baseY };
  const lb = { x: -halfGap, y: G.apexY };
  const ldx = lb.x - la.x, ldy = lb.y - la.y;
  const llen = Math.hypot(ldx, ldy);
  const lang = Math.atan2(ldy, ldx);
  G.leftMesh.geometry.dispose();
  G.leftMesh.geometry = roundedBoxGeo(llen, 12, 28, 5, 0.8);
  G.leftMesh.position.set((la.x+lb.x)/2, (la.y+lb.y)/2, 0);
  G.leftMesh.rotation.z = lang;

  const ra = { x: halfGap, y: G.apexY };
  const rb = { x: G.halfW, y: G.baseY };
  const rdx = rb.x - ra.x, rdy = rb.y - ra.y;
  const rlen = Math.hypot(rdx, rdy);
  const rang = Math.atan2(rdy, rdx);
  G.rightMesh.geometry.dispose();
  G.rightMesh.geometry = roundedBoxGeo(rlen, 12, 28, 5, 0.8);
  G.rightMesh.position.set((ra.x+rb.x)/2, (ra.y+rb.y)/2, 0);
  G.rightMesh.rotation.z = rang;
}

function buildPuckArena(A){
  const halfW = A.w/2, halfH = A.h/2;
  const leftX = A.cx - halfW, rightX = A.cx + halfW;
  const topY  = A.cy + halfH, botY  = A.cy - halfH;

  function seg(x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + A.wallT, A.wallT, 32), arenaMat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0);
    m.rotation.z = ang;
    addOutline(m,1.06);
    mapGroup.add(m);
    WALLS.push({x1,y1,x2,y2,thick:A.wallT/2});
  }
  seg(leftX, topY, -A.topOpeningW/2, topY);
  seg(A.topOpeningW/2, topY, rightX, topY);
  const bots = [...A.bottomOpenings].sort((a,b)=>a.x-b.x);
  let prevX = leftX;
  for (const o of bots){
    seg(prevX, botY, A.cx + o.x - o.w/2, botY);
    prevX = A.cx + o.x + o.w/2;
  }
  seg(prevX, botY, rightX, botY);
  if (A.sideOpening.side === 'left'){
    const yT = A.sideOpening.y + A.sideOpening.w/2;
    const yB = A.sideOpening.y - A.sideOpening.w/2;
    seg(leftX, topY, leftX, yT);
    seg(leftX, yB, leftX, botY);
    seg(rightX, topY, rightX, botY);
  } else {
    const yT = A.sideOpening.y + A.sideOpening.w/2;
    const yB = A.sideOpening.y - A.sideOpening.w/2;
    seg(rightX, topY, rightX, yT);
    seg(rightX, yB, rightX, botY);
    seg(leftX, topY, leftX, botY);
  }

  puckGroup = new THREE.Group();
  const pR = A.puck.r;
  const ringMatP = new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.9,roughness:0.15,emissive:0xa0a0b0,emissiveIntensity:0.9});
  puckGroup.add(new THREE.Mesh(new THREE.TorusGeometry(pR, 5, 12, 36), ringMatP));
  puckGroup.add(new THREE.Mesh(new THREE.TorusGeometry(pR - 5, 1.2, 8, 28), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.5})));
  const crossMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.4,depthWrite:false});
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(pR*1.75, 4, 4), crossMat));
  puckGroup.add(new THREE.Mesh(new THREE.BoxGeometry(4, pR*1.75, 4), crossMat));
  const glow = new THREE.Mesh(new THREE.CircleGeometry(pR*0.9, 20), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.08,depthWrite:false}));
  glow.position.z = -1;
  puckGroup.add(glow);
  puckGroup.position.set(A.puck.x, A.puck.y, 0);
  mapGroup.add(puckGroup);
  A.puck.group = puckGroup;
}

function buildDartBox(D){
  const halfW = D.w/2, halfH = D.h/2;
  const leftX = D.cx - halfW, rightX = D.cx + halfW;
  const topY  = D.cy + halfH, botY  = D.cy - halfH;

  function seg(x1,y1,x2,y2){
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
    if (len < 1) return;
    const ang = Math.atan2(dy,dx);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + D.wallT, D.wallT, 32), arenaMat);
    m.position.set((x1+x2)/2,(y1+y2)/2,0);
    m.rotation.z = ang;
    addOutline(m,1.06);
    mapGroup.add(m);
    WALLS.push({x1,y1,x2,y2,thick:D.wallT/2});
  }
  seg(leftX, topY, -D.topOpeningW/2, topY);
  seg(D.topOpeningW/2, topY, rightX, topY);
  const bots = [...D.bottomOpenings].sort((a,b)=>a.x-b.x);
  let prevX = leftX;
  for (const o of bots){
    seg(prevX, botY, D.cx + o.x - o.w/2, botY);
    prevX = D.cx + o.x + o.w/2;
  }
  seg(prevX, botY, rightX, botY);
  seg(leftX, topY, leftX, botY);
  seg(rightX, topY, rightX, botY);

  const R = 130;
  const layers = [
    { r: R,        mat: DART_BLACK, z: -10 },
    { r: R*0.94,   mat: DART_RED,   z: -9  },
    { r: R*0.80,   mat: DART_WHITE, z: -8  },
    { r: R*0.62,   mat: DART_RED,   z: -7  },
    { r: R*0.44,   mat: DART_WHITE, z: -6  },
    { r: R*0.28,   mat: DART_RED,   z: -5  },
    { r: R*0.12,   mat: DART_WHITE, z: -4  },
  ];
  layers.forEach(L => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(L.r, 40), L.mat);
    m.position.set(D.cx, D.cy, L.z);
    mapGroup.add(m);
  });
  [R*0.94, R*0.80, R*0.62, R*0.44, R*0.28, R*0.12].forEach((rr, i) => {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(rr - 1.5, rr + 1.5, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.75 })
    );
    ring.position.set(D.cx, D.cy, -9 + i*0.1);
    mapGroup.add(ring);
  });
  const crossX = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 1), new THREE.MeshBasicMaterial({color: 0xff2020}));
  const crossY = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 1), new THREE.MeshBasicMaterial({color: 0xff2020}));
  crossX.position.set(D.cx, D.cy, -3);
  crossY.position.set(D.cx, D.cy, -3);
  mapGroup.add(crossX, crossY);

  D.shootTimer = 0;
  D.active = null;
}

function isBallInDartBox(b){

  const bot = D.cy - D.h/2 + D.wallT;
  const top = D.cy + D.h/2 - D.wallT;
  return b.x > left && b.x < right && b.y > bot && b.y < top;
}

function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, ls=dx*dx+dy*dy;
  if (ls<1e-6) return {x:ax,y:ay};
  let t = ((px-ax)*dx + (py-ay)*dy)/ls;
  t = Math.max(0,Math.min(1,t));
  return {x:ax+t*dx, y:ay+t*dy};
}
function collideSeg(b,ax,ay,bx,by,thick,rest){
  const c = closestOnSeg(b.x,b.y,ax,ay,bx,by);
  const dx = b.x-c.x, dy = b.y-c.y, d2 = dx*dx+dy*dy;
  const minD = b.r + thick;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
  b.x += nx*(minD-d); b.y += ny*(minD-d);
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny;
    b.squash = Math.min(1, Math.abs(vn)/620);
    return true;
  }
  return true;
}
function collideCircle(b,cx,cy,cr,rest){
  const dx = b.x-cx, dy = b.y-cy, minD = b.r+cr, d2 = dx*dx+dy*dy;
  if (d2 >= minD*minD || d2 < 1e-6) return false;
  const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
  b.x = cx + nx*minD; b.y = cy + ny*minD;
  const vn = b.vx*nx + b.vy*ny;
  if (vn < 0){
    b.vx -= (1+rest)*vn*nx; b.vy -= (1+rest)*vn*ny;
    b.squash = Math.min(1, Math.abs(vn)/620);
    return true;
  }
  return false;
}
function pointInTri(px,py,ax,ay,bx,by,cx,cy){
  const d1 = (px-bx)*(ay-by)-(ax-bx)*(py-by);
  const d2 = (px-cx)*(by-cy)-(bx-cx)*(py-cy);
  const d3 = (px-ax)*(cy-ay)-(cx-ax)*(py-ay);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
const REST_TRI = 0.5;
function resolveTriangle(b){
  if (!triMesh) return;
  const tipX = G.triX, tipY = MAP.triTipY;
  const blx = G.triX - MAP.triHalf, bly = MAP.triBaseY;
  const brx = G.triX + MAP.triHalf, bry = MAP.triBaseY;
  const pad = b.r + 6;
  if (b.x < Math.min(tipX,blx,brx)-pad || b.x > Math.max(tipX,blx,brx)+pad) return;
  if (b.y < Math.min(tipY,bly,bry)-pad || b.y > Math.max(tipY,bly,bry)+pad) return;
  if (pointInTri(b.x,b.y,tipX,tipY,blx,bly,brx,bry)){
    const side = (b.x-tipX) >= 0 ? 1 : -1;
    const sx = side>0 ? brx : blx, sy = side>0 ? bry : bly;
    const c = closestOnSeg(b.x,b.y,tipX,tipY,sx,sy);
    const dx = b.x-c.x, dy = b.y-c.y, dd = Math.hypot(dx,dy)||0.001;
    b.x = c.x + (dx/dd)*(b.r+3);
    b.y = c.y + (dy/dd)*(b.r+3);
    const vn = b.vx*(dx/dd)+b.vy*(dy/dd);
    if (vn < 0){ b.vx -= (1+REST_TRI)*vn*(dx/dd); b.vy -= (1+REST_TRI)*vn*(dy/dd); }
    b.vx += side*100; b.squash = 0.85;
    return;
  }
  const hL = collideSeg(b,tipX,tipY,blx,bly,3,REST_TRI);
  const hR = collideSeg(b,tipX,tipY,brx,bry,3,REST_TRI);
  if (hL||hR){
    const side = (b.x-tipX) >= 0 ? 1 : -1;
    b.vx += side*80;
  }
}
const REST_BAR = 0.5;
function resolveBar(b,bar){
  const dy = b.y - bar.y;
  if (Math.abs(dy) > b.r+8) return;
  const dx = b.x - bar.x;
  if (Math.abs(dx) > bar.halfW + b.r) return;
  if (Math.abs(dx) < bar.halfW){
    const dir = dy >= 0 ? 1 : -1;
    b.y = bar.y + dir*(b.r+7);
    const vn = b.vy*dir;
    if (vn < 0) b.vy -= (1+REST_BAR)*vn*dir;
    else b.vy = -Math.abs(b.vy)*0.3;
    b.squash = Math.max(b.squash, 0.7);
    const vel = bar.x - bar.prevX;
    if (vel !== 0) b.vx += Math.sign(vel) * 80;
  }
}
function resolveBreakableBricks(b, brickList, respawnY){
  for (const br of brickList){
    if (br.dead) continue;
    const dx = b.x - br.x;
    const dy = b.y - br.y;
    const overlapX = (br.w/2 + b.r) - Math.abs(dx);
    const overlapY = (br.h/2 + b.r) - Math.abs(dy);
    if (overlapX > 0 && overlapY > 0){
      if (overlapY < overlapX){
        const dir = dy > 0 ? 1 : -1;
        b.y = br.y + dir * (br.h/2 + b.r + 1);
        b.vy = 0;
      } else {
        const dir = dx > 0 ? 1 : -1;
        b.x = br.x + dir * (br.w/2 + b.r + 1);
        b.vx *= 0.5;
      }
      br.hits++;
      br.shake = 1.0;
      if (br.hits === 1 && br.mesh){ br.mesh.material = BRICK_CRACKED.clone(); }
      else if (br.hits >= 2){
        br.dead = true;
        if (br.mesh) br.mesh.visible = false;
        for (let i=0;i<8;i++){
          const mat = new THREE.MeshBasicMaterial({color: 0x8a4a2a, transparent:true});
          const deb = new THREE.Mesh(new THREE.BoxGeometry(5,3,3), mat);
          deb.position.set(br.x, br.y, 0);

            life:1.4, gravity:600,

        }

      if (respawnY !== undefined){

      }
      haptic();
      G.shake = Math.min(1, G.shake + 0.35);
      return true;
    }
  }
  return false;
}

function resolveGate(b){

/* BLADE COLLISION */
function resolveBlades(b){
  if (!MAP.bladeArms) return;
  for (const arm of MAP.bladeArms){
    const halfLen = arm.length;
    const ca = Math.cos(arm.angle), sa = Math.sin(arm.angle);
    const ax = -halfLen * ca, ay = arm.y - halfLen * sa;
    const bx =  halfLen * ca, by = arm.y + halfLen * sa;
    const c = closestOnSeg(b.x, b.y, ax, ay, bx, by);
    const dx = b.x - c.x, dy = b.y - c.y;
    const dist = Math.hypot(dx, dy);
    const minD = b.r + 9;
    if (dist < minD){
      const nx = dist > 0.001 ? dx/dist : 0;
      const ny = dist > 0.001 ? dy/dist : -1;
      b.x += nx * (minD - dist);
      b.y += ny * (minD - dist);
      const vn = b.vx*nx + b.vy*ny;
      if (vn < 0){
        b.vx -= 1.6 * vn * nx;
        b.vy -= 1.6 * vn * ny;
      }
      // Tangential push from rotating arm
      const rx = c.x - 0, ry = c.y - arm.y;
      const rotDir = Math.sign(arm.speed) || 1;
      const tangX = -ry * rotDir;
      const tangY =  rx * rotDir;
      const tLen = Math.hypot(tangX, tangY) || 1;
      const power = 620 * Math.abs(arm.speed) + 300;
      b.vx += (tangX / tLen) * power;
      b.vy += (tangY / tLen) * power;
      b.squash = 0.9;
      haptic();
    }
  }
}

function easeOutBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function updateHeld(dt){
  const innerR = MAP.spinR - MAP.spinTube - 6;
  const ringRot = G.time*1.6;
  const gapWorld = ringRot - Math.PI/2;
  for (let i = G.held.length-1; i >= 0; i--){
    const b = G.held[i];
    if (b.popT < 0){ b.popT += dt; continue; }
    if (b.popT < 0.55){ b.popT += dt; b.scale = Math.max(0.001, easeOutBack(Math.min(b.popT/0.55,1))); }
    else b.scale = 1;
    b.vy -= 380*dt;
    const drag = Math.pow(0.35, dt);
    b.vx *= drag; b.vy *= drag;
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.spin += (Math.abs(b.vx)+Math.abs(b.vy))*0.004;
    const dx = b.x, dy = b.y - MAP.spinCy;
    const dist = Math.hypot(dx,dy);
    const maxDist = innerR - b.r;
    if (G.phase === 'launching' && G.launchOpen > 0.5 && dist > maxDist - 6){
      let ba = Math.atan2(dy,dx), da = ba - gapWorld;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < currentGap*0.5*0.9){
        b.state = 'falling';
        b.vx = (Math.random()-0.5)*40;
        b.vy = -60;
        G.active.push(b); G.held.splice(i,1); haptic();
        continue;
      }
    }
    if (dist > maxDist && dist > 0.001){
      const nx = dx/dist, ny = dy/dist;
      b.x = nx*maxDist; b.y = MAP.spinCy + ny*maxDist;
      const vn = b.vx*nx + b.vy*ny;
      if (vn > 0){ b.vx -= 1.55*vn*nx; b.vy -= 1.55*vn*ny; }
    }
    for (let j = i+1; j < G.held.length; j++){
      const ob = G.held[j];
      if (ob.popT < 0) continue;
      const ddx = b.x-ob.x, ddy = b.y-ob.y, dd = Math.hypot(ddx,ddy);
      const mD = b.r + ob.r;
      if (dd < mD && dd > 0.001){
        const nx = ddx/dd, ny = ddy/dd, push = (mD-dd)*0.5;
        b.x += nx*push; b.y += ny*push;
        ob.x -= nx*push; ob.y -= ny*push;
      }
    }
  }
}

function stepFalling(b, dt){
  const spd = Math.hypot(b.vx, b.vy);
  const SUBSTEPS = Math.min(50, Math.max(5, Math.ceil(spd*dt/3)));
  const subDt = dt/SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV*subDt;
    b.vx *= AIR; b.vy *= AIR;
    b.x += b.vx*subDt; b.y += b.vy*subDt;
    for (const w of WALLS) collideSeg(b,w.x1,w.y1,w.x2,w.y2,w.thick,REST_WALL);
    for (const p of PEGS){
      if (Math.abs(p.x-b.x)>40 || Math.abs(p.y-b.y)>40) continue;
      if (collideCircle(b,p.x,p.y,p.r,REST_PEG)){
        p.mesh.userData.hit = Math.min(1, p.mesh.userData.hit + 0.85);
      }
    }
    for (const bar of BARS){
      if (Math.abs(bar.y-b.y) > 30) continue;
      resolveBar(b, bar);
    }
    if (MAP.brickWall) resolveBreakableBricks(b, MAP.brickWall.bricks, MAP.brickWall.centerY + MAP.brickWall.rows * MAP.brickWall.brickH + 100);
    if (MAP.dartGate) resolveGate(b);
    if (MAP.bladeArms) resolveBlades(b);
    if (triMesh && b.y < MAP.triTipY+50 && b.y > MAP.triBaseY-50) resolveTriangle(b);
    collideWithPuck(b);
  }
  b.spin += (Math.abs(b.vx)+Math.abs(b.vy))*0.0035;
  b.stuckCheckT += dt;
  if (b.stuckCheckT > 0.5){
    const moved = Math.hypot(b.x-b.lastX, b.y-b.lastY);
    if (moved < 8 && b.state === 'falling'){
      b.stuckCount++;
      b.vx += (Math.random()-0.5)*260;
      b.vy -= 60;
      if (b.stuckCount >= 3){ b.y -= 90; b.vx = (Math.random()-0.5)*100; b.stuckCount = 0; }
    } else b.stuckCount = 0;
    b.lastX = b.x; b.lastY = b.y; b.stuckCheckT = 0;
  }
  if (b.x < -600 || b.x > 600){
    b.state = 'lost'; b.dead = true;
    G.results.push({value:b.value, mult:0});
    return;
  }
  if (b.y < MAP.floorY){
    if (Math.abs(b.x) < MAP.floorOpen){ startBowlDrop(b, Math.random()<0.20?2:1); return; }
    if (b.x < 0) b.vx -= 180; else b.vx += 180;
    if (b.y < MAP.floorY - 300){
      b.state = 'lost'; b.dead = true;
      G.results.push({value:b.value, mult:0});
    }
  }
}

function updatePuck(dt){
  const A = MAP.puckArena;
  if (!A) return;
  const p = A.puck;
  p.x += p.vx*dt; p.y += p.vy*dt;
  p.angle += (p.vx*dt*0.006) + (p.vy*dt*0.004);
  const lb = A.cx - A.w/2 + A.wallT/2 + p.r;
  const rb = A.cx + A.w/2 - A.wallT/2 - p.r;
  const bb = A.cy - A.h/2 + A.wallT/2 + p.r;
  const tb = A.cy + A.h/2 - A.wallT/2 - p.r;
  if (p.x < lb){ p.x = lb; p.vx = Math.abs(p.vx); p.flash = 0.6; }
  if (p.x > rb){ p.x = rb; p.vx = -Math.abs(p.vx); p.flash = 0.6; }
  if (p.y < bb){ p.y = bb; p.vy = Math.abs(p.vy); p.flash = 0.6; }
  if (p.y > tb){ p.y = tb; p.vy = -Math.abs(p.vy); p.flash = 0.6; }
  const drag = Math.pow(0.995, dt*60);
  p.vx *= drag; p.vy *= drag;
  const spd = Math.hypot(p.vx, p.vy);
  const minS = 190, maxS = 340;
  if (spd < minS){
    const ang = spd < 1 ? Math.random()*Math.PI*2 : Math.atan2(p.vy, p.vx);
    const t = minS + Math.random()*50;
    p.vx = Math.cos(ang)*t; p.vy = Math.sin(ang)*t;
  } else if (spd > maxS){
    const k = maxS/spd; p.vx *= k; p.vy *= k;
  }
  if (p.group){
    p.group.position.set(p.x, p.y, 0);
    p.group.rotation.z = p.angle;
  }
}
function collideWithPuck(b){
  const A = MAP.puckArena;
  if (!A) return;
  const p = A.puck;
  const dx = b.x-p.x, dy = b.y-p.y, d = Math.hypot(dx,dy), mD = b.r + p.r;
  if (d < mD && d > 0.001){
    const nx = dx/d, ny = dy/d;
    b.x = p.x + nx*mD; b.y = p.y + ny*mD;
    const rvx = b.vx-p.vx, rvy = b.vy-p.vy;
    const rvn = rvx*nx + rvy*ny;
    if (rvn < 0){ b.vx -= 1.6*rvn*nx; b.vy -= 1.6*rvn*ny; }
    b.vx += p.vx*0.7; b.vy += p.vy*0.7 + 30;
    b.squash = 0.95;
    A.puck.flash = 1;
    haptic();
  }
}

/* BLACKHOLE — cinematic pull + release */
function updateBlackhole(dt){
  const BH = MAP.blackhole;
  if (!BH || !BH.group) return;

  // Always animate the visuals
  BH.ringPhase += dt;
  if (BH.ring1) BH.ring1.rotation.z = BH.ringPhase * 0.7;
  if (BH.ring2) BH.ring2.rotation.z = -BH.ringPhase * 1.1;
  if (BH.swirl) BH.swirl.rotation.z = BH.ringPhase * 1.8;
  const pulse = 0.9 + 0.15 * Math.sin(BH.ringPhase * 4);
  if (BH.ring1) BH.ring1.scale.setScalar(pulse);

  const candidates = G.active.filter(b =>
    !b.dead && b.state === 'falling' &&
    Math.hypot(b.x - BH.x, b.y - BH.y) < BH.r
  );

  if (BH.state === 'idle'){
    if (candidates.length > 0){
      BH.state = 'pulling';
      BH.timer = 0;
      haptic();
      G.shake = Math.min(1, G.shake + 0.3);
    }
  } else if (BH.state === 'pulling'){
    BH.timer += dt;
    // Ramp up glow
    if (BH.glowLight) BH.glowLight.intensity = 1.2 + BH.timer * 1.2;
    // Add new candidates
    for (const b of candidates){
      if (!BH.held.includes(b)){ BH.held.push(b); b.bhHeld = true; }
    }
    // Strong pull on all held balls
    for (const b of BH.held){
      if (b.dead) continue;
      const dx = BH.x - b.x, dy = BH.y - b.y;
      const dist = Math.hypot(dx, dy) || 1;
      const pull = BH.pullStrength * (0.5 + BH.timer * 0.4);
      b.vx += (dx / dist) * pull * dt;
      b.vy += (dy / dist) * pull * dt;
      // Swirl
      b.vx += (-dy / dist) * 400 * dt;
      b.vy += ( dx / dist) * 400 * dt;
      // Clamp max speed toward center to avoid flying past
      const spd = Math.hypot(b.vx, b.vy);
      if (spd > 1800){ b.vx = b.vx/spd*1800; b.vy = b.vy/spd*1800; }
      b.squash = 0.7 + Math.sin(BH.ringPhase * 8) * 0.15;
    }
    if (BH.timer >= BH.holdTime){
      // RELEASE!
      BH.state = 'releasing';
      BH.releaseTimer = 0;
      for (const b of BH.held){
        if (b.dead) continue;
        const ang = Math.random() * Math.PI * 2;
        const power = 1500 + Math.random() * 500;
        b.vx = Math.cos(ang) * power;
        b.vy = Math.sin(ang) * power * 0.7 - 200;
        b.squash = 1.1;
        b.bhHeld = false;
      }
      haptic();
      G.shake = 1;
      // Spawn burst particles at BH center
      for (let i = 0; i < 40; i++){
        const col = i % 2 === 0 ? 0x8a2aff : 0xffffff;
        const mat = new THREE.MeshBasicMaterial({color: col, transparent:true});
        const p = new THREE.Mesh(new THREE.SphereGeometry(3.5, 6, 6), mat);
        p.position.set(BH.x, BH.y, 10);
        scene.add(p);
        const ang = Math.random() * Math.PI * 2;
        G.particles.push({
          mesh:p,
          vx: Math.cos(ang) * (400 + Math.random() * 700),
          vy: Math.sin(ang) * (400 + Math.random() * 700),
          vz:0,
          life: 1.2, gravity: 0,
        });
      }
    }
  } else if (BH.state === 'releasing'){
    BH.releaseTimer += dt;
    if (BH.glowLight) BH.glowLight.intensity = Math.max(0.4, 2.4 - BH.releaseTimer * 4);
    if (BH.releaseTimer > 0.6){
      BH.state = 'idle';
      BH.held = [];
      if (BH.glowLight) BH.glowLight.intensity = 1.6;
    }
  }
}

function updateDartBox(dt){
  const D = MAP.dartBox;
  if (!D) return;

  if (D.active && D.active.ball && D.active.ball.dead){
    if (D.active.targetMesh) mapGroup.remove(D.active.targetMesh);
    if (D.active.gunMesh) mapGroup.remove(D.active.gunMesh);
    D.active = null;
  }

  D.shootTimer += dt;
  if (!D.active && D.shootTimer > 0.5){
    D.shootTimer = 0;
    const inBox = G.active.filter(b =>
      !b.dead && b.state === 'falling' && isBallInDartBox(b)
    );
    if (inBox.length){
      const tb = inBox[Math.floor(Math.random() * inBox.length)];
      const targetMesh = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(tb.r + 18, 3.5, 8, 24),
        new THREE.MeshBasicMaterial({color: 0xff2020, transparent: true, opacity: 0.95})
      );
      targetMesh.add(ring);
      const crossMat = new THREE.MeshBasicMaterial({color: 0xff2020, transparent: true, opacity: 0.95});
      targetMesh.add(new THREE.Mesh(new THREE.BoxGeometry((tb.r+18)*2, 2.5, 2.5), crossMat));
      targetMesh.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, (tb.r+18)*2, 2.5), crossMat));
      targetMesh.position.set(tb.x, tb.y, 8);
      targetMesh.scale.setScalar(0.001);
      mapGroup.add(targetMesh);

      const gunMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshBasicMaterial({map: gunState.tex, transparent: true, depthWrite: false})
      );
      gunMesh.position.set(tb.x, tb.y + 85, 10);
      gunMesh.scale.setScalar(0.001);
      gunMesh.renderOrder = 400;
      mapGroup.add(gunMesh);

      D.active = { ball: tb, targetMesh, gunMesh, phase: 'target', t: 0 };
    }
  }

  if (D.active){
    D.active.t += dt;
    const tb = D.active.ball;
    if (!tb.dead){
      if (D.active.phase === 'target'){
        D.active.targetMesh.position.set(tb.x, tb.y, 8);
      } else if (D.active.phase === 'gun'){
        D.active.gunMesh.position.set(tb.x, tb.y + 85, 10);
      }
    }

    if (D.active.phase === 'target'){
      const tt = Math.min(D.active.t / 0.35, 1);
      D.active.targetMesh.scale.setScalar(Math.max(0.001, easeOutBack(tt)));
      if (D.active.t > 0.55){
        D.active.phase = 'gun';
        D.active.t = 0;
        D.active.targetPopT = 0;
      }
    } else if (D.active.phase === 'gun'){
      D.active.targetPopT = (D.active.targetPopT || 0) + dt;
      const tp = Math.min(D.active.targetPopT / 0.25, 1);
      D.active.targetMesh.scale.setScalar(Math.max(0.001, 1 - tp));
      const gt = Math.min(D.active.t / 0.3, 1);
      D.active.gunMesh.scale.setScalar(Math.max(0.001, easeOutBack(gt)));
      if (D.active.t > 0.45){
        const ang = Math.random() * Math.PI * 2;
        const power = 900 + Math.random() * 400;
        tb.vx = Math.cos(ang) * power;
        tb.vy = Math.sin(ang) * power * 0.75 + 100;
        haptic();
        G.shake = Math.min(1, G.shake + 0.5);
        D.active.phase = 'fade';
        D.active.t = 0;
      }
    } else if (D.active.phase === 'fade'){
      const ft = Math.min(D.active.t / 0.35, 1);
      D.active.gunMesh.scale.setScalar(Math.max(0.001, 1 - ft));
      D.active.targetMesh.scale.setScalar(Math.max(0.001, 1 - ft));
      if (ft >= 1){
        mapGroup.remove(D.active.targetMesh);
        mapGroup.remove(D.active.gunMesh);
        D.active = null;
      }
    }
  }
}

function updateDartGate(dt){
  const Gt = MAP.dartGate;
  if (!Gt) return;
  Gt.timer += dt;
  if (Gt.timer > 3.2){
    Gt.timer = 0;
    Gt.targetOpen = Gt.targetOpen > 0.5 ? 0 : 1;
  }
  Gt.openAmount += (Gt.targetOpen - Gt.openAmount) * Math.min(1, dt * 4.5);
  Gt.apexGap = Gt.maxApexGap * Gt.openAmount;
  updateGateMeshes();
}

function startBowlDrop(b, bowlNum){
  const cfg = bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  b.state = 'drop' + bowlNum;
  b.bowlNum = bowlNum;
  b.dropTargetY = cfg.cy + b.r + 1;
  const minR = cfg.holes[0].r + cfg.holeR + 10;
  const maxR = cfg.rimR - b.r - 8;
  const offA = Math.random()*Math.PI*2;
  const offR = minR >= maxR ? (minR+maxR)*0.5 : minR + Math.random()*(maxR-minR);
  b.x = Math.cos(offA)*offR; b.z = Math.sin(offA)*offR;
  const sT = cfg.cy + cfg.wallH + 120;
  if (b.y < sT) b.y = sT;
  b.vx = 0; b.vy = Math.max(-320, Math.min(b.vy,-80)); b.spin = 0;
}
function updateDrop(b, dt){
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const SUBSTEPS = Math.min(20, Math.max(3, Math.ceil(Math.abs(b.vy)*dt/3)));
  const subDt = dt/SUBSTEPS;
  for (let s = 0; s < SUBSTEPS; s++){
    b.vy -= GRAV*0.9*subDt;
    b.y += b.vy*subDt;
    const r = Math.hypot(b.x,b.z), maxR = cfg.rimR-b.r-8;
    if (r > maxR){ b.x = (b.x/r)*maxR; b.z = (b.z/r)*maxR; }
    if (b.y <= b.dropTargetY || b.y < cfg.cy + b.r){
      b.y = b.dropTargetY; b.squash = 1.0;
      b.theta = Math.atan2(b.z,b.x);
      b.rad = Math.max(Math.hypot(b.x,b.z), cfg.holes[0].r + cfg.holeR + 4);
      b.omega = (Math.random()>0.5?1:-1)*(2.9+Math.random()*0.7);
      b.orbitT = 0;
      b.state = 'bowl' + b.bowlNum;
      return;
    }
  }
}
function updateOrbit(b, dt){
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  b.orbitT += dt;
  b.theta += b.omega*dt;
  b.omega *= Math.pow(0.85, dt);
  const spd = Math.abs(b.omega);
  const inward = spd < 1.2 ? (1.2-spd)*30 : 0;
  b.rad -= (4+inward)*dt;
  if (b.rad < cfg.holes[0].r) b.rad = cfg.holes[0].r;
  if (b.rad > cfg.rimR - b.r - 4) b.rad = cfg.rimR - b.r - 4;
  b.x = Math.cos(b.theta)*b.rad;
  b.z = Math.sin(b.theta)*b.rad;
  b.y = cfg.cy + b.r + 0.5;
  b.spin += Math.abs(b.omega)*dt*6;
  if (b.orbitT < 1.4) return;
  if (b.bowlNum === 1 && !b.escapedBowl2 && b.orbitT > 2.4){
    b.escapedBowl2 = true;
    if (Math.random() < 0.20){ startEscape2(b); return; }
  }
  for (const h of cfg.holes){
    const hx = Math.cos(h.a)*h.r, hz = Math.sin(h.a)*h.r;
    if (Math.hypot(b.x-hx, b.z-hz) < cfg.holeR*1.15 && spd < 3.0){ startHover(b, cfg, h); return; }
  }
  if (b.orbitT > 6.5){
    let best = cfg.holes[0], bd = Infinity;
    for (const h of cfg.holes){
      let da = b.theta-h.a;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < bd){ bd = Math.abs(da); best = h; }
    }
    b.theta = best.a; b.rad = best.r;
    startHover(b, cfg, best);
  }
}
function startEscape2(b){
  b.state = 'esc2'; b.escT = 0;
  b.escFromX = b.x; b.escFromY = b.y; b.escFromZ = b.z;
  b.escToX = 0; b.escToY = MAP.bowl2.cy + MAP.bowl2.wallH + 60; b.escToZ = 0;
}
function updateEscape2(b, dt){
  b.escT += dt;
  const t = Math.min(b.escT/0.9, 1);
  b.x = b.escFromX + (b.escToX-b.escFromX)*(1-Math.pow(1-t,3));
  b.y = b.escFromY + (b.escToY-b.escFromY)*(t*t);
  b.z = b.escFromZ + (b.escToZ-b.escFromZ)*(1-Math.pow(1-t,3));
  b.spin += dt*12;
  b.scale = 1 - t*0.15;
  if (t >= 1){ b.state = 'drop2'; b.bowlNum = 2; b.dropTargetY = MAP.bowl2.cy+b.r+1; b.vy = -60; }
}
function startHover(b, cfg, hole){
  b.state = 'hover'; b.holeTarget = hole; b.hoverT = 0;
  b.holeStartY = cfg.cy + b.r + 0.5;
  b.hoverStartTheta = b.theta;
  b.hoverEndTheta = hole.a;
  while (b.hoverEndTheta - b.hoverStartTheta > Math.PI) b.hoverEndTheta -= Math.PI*2;
  while (b.hoverEndTheta - b.hoverStartTheta < -Math.PI) b.hoverEndTheta += Math.PI*2;
  G.results.push({value:b.value, mult:hole.mult});
  b.resultMult = hole.mult;
  G.shake = Math.min(1, G.shake + (hole.red?0.5:0.25));
  if (hole.red && b.tier === 'gold' && !slowMo.active && !b.slowMoDone){
    b.slowMoDone = true; slowMo.active = true; slowMo.t = 0; slowMo.ball = b;
    goldL1.visible = true; goldL2.visible = true;
    haptic();
  }
}
function updateHover(b, dt){
  b.hoverT += dt;
  const t = Math.min(b.hoverT/b.hoverDuration, 1);
  const e = t*t*(3-2*t);
  b.theta = b.hoverStartTheta + (b.hoverEndTheta-b.hoverStartTheta)*e;
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const h = b.holeTarget;
  b.x = Math.cos(b.theta)*h.r;
  b.z = Math.sin(b.theta)*h.r;
  b.y = b.holeStartY + Math.sin(t*Math.PI)*6;
  b.x += Math.sin(b.hoverT*30)*1.6;
  b.spin += dt*6;
  if (t >= 1){ b.state = 'hole'; b.holeT = 0; b.holeStartY = cfg.cy+b.r+0.5; }
}
function updateHoleDrop(b, dt){
  b.holeT += dt;
  const t = Math.min(b.holeT/1.05, 1);
  const fall = t*t*(1.4-t*0.4);
  const DROP = b.bowlNum === 1 ? 100 : 200;
  b.y = b.holeStartY - fall*DROP;
  b.spin += dt*10;
  b.scale = 1 - fall*0.7;
  const cfg = b.bowlNum === 1 ? MAP.bowl1 : MAP.bowl2;
  const h = b.holeTarget;
  b.x = Math.cos(h.a)*h.r + Math.sin(b.holeT*24)*2;
  b.z = Math.sin(h.a)*h.r + Math.cos(b.holeT*24)*2;
  if (t >= 1){
    if (b.bowlNum === 2){ b.state = 'endFall'; b.vy      b.state = 'endFall'; b.vy = -60; b.scale = 1;
      b.x = (Math.random()-0.5)*40; b.z = (Math.random()-0.5)*40;
    } else { b.state = 'settled'; b.y = -99999; }
    spawnConfetti(0, cfg.cy-30, 0, h.red);
  }
}
function updateEndFall(b, dt){
  b.vy -= GRAV*0.8*dt; b.y += b.vy*dt;
  const ty = MAP.endCy + b.r + 1;
  if (b.y <= ty){ b.y = ty; b.vy = 0; b.squash = 1.0; b.state = 'endRest'; b.restT = 0; }
}
function updateEndRest(b, dt){
  b.restT += dt;
  b.squash *= Math.pow(0.0008, dt);
  if (b.restT > 1.2){ b.scale = Math.max(0, b.scale - dt*2.5); if (b.scale <= 0){ b.state='settled'; b.y=-99999; } }
}
function resolveBallBall(){
  const f = G.active.filter(b => !b.dead && b.state === 'falling' && !b.bhHeld);
  for (let i = 0; i < f.length; i++){
    for (let j = i+1; j < f.length; j++){
      const a = f[i], b = f[j];
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy), mD = a.r + b.r;
      if (d < mD && d > 0.001){
        const nx = dx/d, ny = dy/d, push = (mD-d)*0.5;
        a.x -= nx*push; a.y -= ny*push;
        b.x += nx*push; b.y += ny*push;
        const vn1 = a.vx*nx + a.vy*ny;
        const vn2 = b.vx*nx + b.vy*ny;
        const diff = vn2 - vn1;
        if (diff > 0){
          const imp = diff*0.5;
          a.vx += imp*nx; a.vy += imp*ny;
          b.vx -= imp*nx; b.vy -= imp*ny;
        }
      }
    }
  }
}
const CONF_COLORS = [0xffffff,0xffdd44,0xff5577,0x55ddff,0x8fe5b0];
const CONF_MATS = CONF_COLORS.map(c => new THREE.MeshBasicMaterial({color:c, transparent:true}));
const CONF_GEO = new THREE.SphereGeometry(3.2, 6, 6);
function spawnConfetti(x,y,z,big){
  const n = big ? 50 : 20;
  for (let i = 0; i < n; i++){
    const m = new THREE.Mesh(CONF_GEO, CONF_MATS[i % CONF_MATS.length]);
    m.position.set(x,y,z); scene.add(m);
    G.particles.push({mesh:m, vx:(Math.random()-0.5)*500, vy:250+Math.random()*500, vz:(Math.random()-0.5)*350, life:1.8, gravity:480});
  }
}

function pickFeaturedBall(){
  const BH = MAP.blackhole;
  if (BH && BH.state === 'pulling' && BH.held.length > 0){
    return BH.held[0];
  }
  if (MAP.dartBox && MAP.dartBox.active && MAP.dartBox.active.ball && !MAP.dartBox.active.ball.dead){
    return MAP.dartBox.active.ball;
  }
  const active = G.active.filter(b => !b.dead && b.state === 'falling');
  if (!active.length) return null;
  let lowest = active[0];
  for (const b of active) if (b.y < lowest.y) lowest = b;
  return lowest;
}
function updateFeaturedArrow(dt){
  featured.ball = pickFeaturedBall();
  if (featured.ball){
    if (!featured.arrow){
      const arrow = new THREE.Mesh(
        FEATURED_ARROW_GEO,
        new THREE.MeshBasicMaterial({
          color: 0xffffff, transparent: true, opacity: 0.95,

        })
      );

      arrow.renderOrder = 500;
      scene.add(arrow);
      featured.arrow = arrow;
    }
    const bob = Math.sin(G.time * 7) * 5;
    featured.arrow.visible = true;
    featured.arrow.position.set(
      featured.ball.x,
      featured.ball.y + 42 + bob,
      16
    );
  } else if (featured.arrow){
    featured.arrow.visible = false;
  }
}

function update(dt){
  G.time += dt;
  G.shake *= Math.pow(0.001, dt);

  if (spinMesh && spinRail){
    const rot = G.time*1.6;
    spinMesh.rotation.z = -Math.PI/2 + currentGap/2 + rot;
    spinRail.rotation.z = -Math.PI/2 + currentGap/2 + rot;
  }

  // PEG GLOW when hit — with pulsing emissive
  for (const p of PEGS){
    const h = p.mesh.userData.hit;
    if (h > 0){
      p.mesh.userData.hit *= Math.pow(0.0008, dt);
      const mat = p.mesh.material;
      const glow = p.mesh.userData.hit;
      mat.emissive.setRGB(1.0 * glow, 0.9 * glow, 0.5 * glow);
      mat.emissiveIntensity = 0.3 + glow * 2.0;
      p.mesh.scale.setScalar(1 + glow * 0.35);
    } else {
      const mat = p.mesh.material;
      mat.emissiveIntensity = 0.3;
      mat.emissive.setRGB(0.14, 0.14, 0.18);
      p.mesh.scale.setScalar(1);
    }
  }

  // Brick shake
  for (const br of BRICKS){
    if (br.shake > 0){
      br.shake *= Math.pow(0.001, dt);
      if (br.mesh){
        const s = br.shake;
        br.mesh.position.x = br.x + (Math.random()-0.5)*6*s;
        br.mesh.position.y = br.y + (Math.random()-0.5)*6*s;
        br.mesh.scale.setScalar(1 + s*0.08);
      }
    }
  }

  // Bars
  for (const bar of BARS){
    bar.prevX = bar.x;
    bar.phase += dt;
    bar.x = bar.baseX + Math.sin(bar.phase) * bar.range;
    const vel = bar.x - bar.prevX;
    if (bar.mesh) bar.mesh.position.x = bar.x;
    if (bar.arrows && bar.arrows.length){
      const dir = vel >= 0 ? 1 : -1;
      for (let k = 0; k < bar.arrows.length; k++){
        const a = bar.arrows[k];
        const phase = ((G.time * 0.6 + k * 0.33) % 1 + 1) % 1;
        const offsetX = -bar.halfW + phase * bar.halfW * 2;
        a.position.set(bar.x + offsetX, bar.y + 14, 8);
        a.rotation.z = dir > 0 ? 0 : Math.PI;
        const fade = Math.sin(phase * Math.PI);
        a.scale.setScalar(a.userData.baseScale * (0.6 + fade * 0.55));
      }
    }
  }

  // Triangle slide
  if (triMesh && gifPlane && (G.phase === 'playing' || G.phase === 'ended' || G.phase === 'launching')){
    G.triX += G.triDir * MAP.triSpeed * dt;
    if (G.triX >  MAP.triRange){ G.triX =  MAP.triRange; G.triDir = -1; }
    if (G.triX < -MAP.triRange){ G.triX = -MAP.triRange; G.triDir =  1; }
    triMesh.position.x = G.triX;
    gifPlane.position.x = G.triX;
  }

  // BLADES — rotate and position arms
  if (MAP.bladeArms){
    for (const arm of MAP.bladeArms){
      arm.angle += arm.speed * dt;
      for (const bm of bladeMeshes){
        if (bm.arm !== arm) continue;
        if (bm.type === 'hub'){
          bm.mesh.position.set(0, arm.y, 0);
          bm.mesh.rotation.z = arm.angle * 2;
        } else if (bm.type === 'bar'){
          bm.mesh.position.set(0, arm.y, 0);
          bm.mesh.rotation.z = arm.angle;
        } else if (bm.type === 'tip'){
          const ca = Math.cos(arm.angle), sa = Math.sin(arm.angle);
          bm.mesh.position.set(bm.sign * arm.length * ca, arm.y + bm.sign * arm.length * sa, 0);
        }
      }
    }
  }

  updatePuck(dt);
  updateDartBox(dt);
  updateDartGate(dt);
  updateBlackhole(dt);
  updateFeaturedArrow(dt);

  if (MAP.puckArena && MAP.puckArena.puck.group){
    if (MAP.puckArena.puck.flash > 0){
      MAP.puckArena.puck.flash *= Math.pow(0.0005, dt);
      MAP.puckArena.puck.group.scale.setScalar(1 + MAP.puckArena.puck.flash*0.25);
    } else MAP.puckArena.puck.group.scale.setScalar(1);
  }

  updateHeld(dt);

  if (G.phase === 'launching'){
    G.launchT += dt;
    G.launchOpen = Math.min(1, G.launchT/0.85);
    setSpinnerGap(G.launchOpen*Math.PI*0.95);
    if (G.launchT > 12 && G.held.length > 0){
      while (G.held.length){
        const b = G.held.pop();
        b.state = 'falling'; b.vx = (Math.random()-0.5)*40; b.vy = -60;
        G.active.push(b);
      }
    }
    if (G.launchT > 1.4 && G.held.length === 0){
      G.phase = 'playing'; G._ending = false; updateHud();
    }
  }

  for (let i = G.active.length-1; i >= 0; i--){
    const b = G.active[i];
    b.squash *= Math.pow(0.0008, dt);
    if      (b.state === 'falling') stepFalling(b, dt);
    else if (b.state === 'drop1' || b.state === 'drop2') updateDrop(b, dt);
    else if (b.state === 'bowl1' || b.state === 'bowl2') updateOrbit(b, dt);
    else if (b.state === 'hover') updateHover(b, dt);
    else if (b.state === 'hole') updateHoleDrop(b, dt);
    else if (b.state === 'esc2') updateEscape2(b, dt);
    else if (b.state === 'endFall') updateEndFall(b, dt);
    else if (b.state === 'endRest') updateEndRest(b, dt);
    if (b.dead){ removeBall(b); G.active.splice(i,1); }
  }

  resolveBallBall();

  for (let i = G.particles.length-1; i >= 0; i--){
    const p = G.particles[i];
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;
    p.vy -= p.gravity*dt;
    p.life -= dt;
    if (p.life <= 0){ scene.remove(p.mesh); G.particles.splice(i,1); }
  }

  if (G.phase === 'playing'
    && G.held.length === 0
    && G.active.every(b => b.state === 'settled' || b.state === 'lost' || b.state === 'endRest' || b.dead)
    && !G._ending){
    G._ending = true;
    setTimeout(finishRound, 1200);
  }
}

function syncMeshes(){
  G.held.forEach(b => { b.mesh.position.set(b.x,b.y,b.z); b.mesh.scale.setScalar(b.scale); });
  G.active.forEach(b => {
    if (b.dead) return;
    if (b.state === 'settled'){ b.mesh.visible = false; return; }
    if (b.state === 'endRest' || b.state === 'endFall' || b.state === 'hole'){
      b.mesh.position.set(b.x,b.y,b.z);
      b.mesh.scale.setScalar(b.scale || 1);
      b.mesh.rotation.z += 0.05;
      return;
    }
    const sx = 1 + b.squash*0.22, sy = 1 - b.squash*0.22, sz = 1 + b.squash*0.10, sc = b.scale || 1;
    b.mesh.position.set(b.x,b.y,b.z);
    b.mesh.scale.set(sx*sc, sy*sc, sz*sc);
    b.mesh.rotation.z = Math.sin(b.spin)*0.4;
    b.mesh.rotation.x = Math.cos(b.spin*0.7)*0.3;
  });
}

const camState = { lookY:1200, targetLookY:1200, dist: CAM_RADIUS_NORMAL, targetDist: CAM_RADIUS_NORMAL };
function updateCamera(realDt){
  if (slowMo.active && slowMo.ball){
    camState.targetLookY = slowMo.ball.y; camState.targetDist = CAM_RADIUS_ZOOMED;
  } else if (G.phase === 'launching' || G.phase === 'holding' || G.phase === 'idle'){
    camState.targetLookY = MAP.spinCy - 100; camState.targetDist = CAM_RADIUS_NORMAL;
  } else if (featured.ball){
    camState.targetLookY = featured.ball.y + 100;
    camState.targetDist = CAM_RADIUS_NORMAL;
  } else if (G.active.length){
    const ys = G.active.filter(b=>!b.dead && b.state !== 'settled').map(b=>b.y).sort((a,b)=>a-b);
    const med = ys.length ? ys[Math.floor(ys.length/2)] : camState.lookY;
    camState.targetLookY = med + 180; camState.targetDist = CAM_RADIUS_NORMAL;
  } else camState.targetLookY = camState.lookY;

  const smooth = 1 - Math.pow(0.0035, realDt);
  camState.lookY += (camState.targetLookY - camState.lookY)*smooth;
  camState.dist  += (camState.targetDist  - camState.dist)*smooth*0.7;
  const camSmooth = 1 - Math.pow(0.004, realDt);
  camDrag.yaw   += (camDrag.targetYaw   - camDrag.yaw)*camSmooth;
  camDrag.pitch += (camDrag.targetPitch - camDrag.pitch)*camSmooth;

  if (!isFinite(camState.lookY)) camState.lookY = 0;
  if (!isFinite(camState.dist)) camState.dist = CAM_RADIUS_NORMAL;
  if (!isFinite(camDrag.yaw)) camDrag.yaw = 0;
  if (!isFinite(camDrag.pitch)) camDrag.pitch = CAM_DEFAULT_PITCH;

  const radius = camState.dist;
  const cy_off = Math.sin(camDrag.pitch) * radius;
  const hDist = Math.cos(camDrag.pitch) * radius;
  const cx = Math.sin(camDrag.yaw) * hDist;
  const cz = Math.cos(camDrag.yaw) * hDist;

  camera.position.set(cx, camState.lookY + cy_off, cz);
  camera.lookAt(0, camState.lookY, 0);
}

let last = performance.now(), errCount = 0;
function loop(now){
  const realDt = Math.min((now-last)/1000, 1/30);
  last = now;
  tickGifState(triState, now);
  tickGifState(gunState, now);
  let gameDt = realDt;
  if (slowMo.active){
    slowMo.t += realDt;
    const p = slowMo.t / slowMo.duration;
    let scale;
    if (p < 0.15) scale = 1 - (p/0.15)*0.88;
    else if (p < 0.85) scale = 0.12;
    else scale = 0.12 + ((p-0.85)/0.15)*0.88;
    gameDt = realDt * scale;
    if (slowMo.ball && !slowMo.ball.dead){
      const bx = slowMo.ball.x, by = slowMo.ball.y;
      const flash = 0.8 + 0.6*Math.sin(slowMo.t*30);
      goldL1.position.set(bx-45, by+35, 90); goldL2.position.set(bx+45, by+35, 90);
      goldL1.intensity = 3.5*flash; goldL2.intensity = 3.5*flash;
    }
    if (p >= 1){
      slowMo.active = false;
      goldL1.visible = false; goldL2.visible = false;
      goldL1.intensity = 0; goldL2.intensity = 0;
    }
  }
  try {
    update(gameDt); syncMeshes(); updateCamera(realDt);
    const sx = (Math.random()-0.5)*G.shake*8;
    const sy = (Math.random()-0.5)*G.shake*8;
    renderer.domElement.style.transform = `translate(${sx}px,${sy}px)`;
    renderer.render(scene, camera);
    errCount = 0;
  } catch (e){
    errCount++; console.error(e);
    if (errCount >= 5){
      errCount = 0;
      try {
        G.active.forEach(b=>removeBall(b)); G.held.forEach(b=>removeBall(b));
        G.active = []; G.held = []; G.particles = []; G.results = [];
        G._ending = false; G.phase = 'idle';
      } catch(_){}
    }
  }
  requestAnimationFrame(loop);
}

/* ═════ OPTIMIZED ROULETTE ═════ */
const ROULETTE_N = 22;
let spinToken = 0;
let spinRaf = null;

function spinAll(balls, done){
  spinToken++;
  const myToken = spinToken;
  elRoulette.classList.add('show');
  elRTitle.textContent = 'Rolling';
  elRAmount.classList.remove('show');
  elRAmount.innerHTML = '';
  elRRows.innerHTML = '';

  const n = balls.length;
  // Reserve space (topbar + ticker + mapbar + bottom bar)
  const availH = Math.min(innerHeight - 260, 560);
  const gapPx = 6;
  let rowH = Math.floor((availH - (n-1)*gapPx) / n);
  rowH = Math.max(44, Math.min(160, rowH));

  const baseAngles = [];
  for (let i=0;i<ROULETTE_N;i++) baseAngles.push((i/ROULETTE_N)*360);

  const rows = [];
  for (let idx=0; idx<n; idx++){
    const ball = balls[idx];
    const rowEl = document.createElement('div');
    rowEl.className = 'dl-r-row';
    rowEl.style.height = rowH + 'px';
    const vpEl = document.createElement('div'); vpEl.className = 'dl-r-viewport';
    rowEl.appendChild(vpEl);
    const ptrEl = document.createElement('div'); ptrEl.className = 'dl-r-pointer'; ptrEl.textContent = '▲';
    ptrEl.style.fontSize = Math.max(8, Math.min(16, rowH*0.18)) + 'px';
    rowEl.appendChild(ptrEl);
    elRRows.appendChild(rowEl);
    const items = [];
    for (let k=0;k<ROULETTE_N;k++){ const v = randomValue(); items.push({value:v, tier:tierFor(v)}); }
    const winnerIdx = Math.floor(Math.random()*ROULETTE_N);
    items[winnerIdx] = {value: ball.value, tier: ball.tier};
    const ballSize = Math.min(76, Math.max(28, rowH-14));
    const fontSize = Math.max(9, ballSize*0.26);
    const ballEls = [];
    items.forEach(b => {
      const d = document.createElement('div');
      d.className = 'dl-r-ball ' + b.tier;
      d.textContent = b.value;
      d.style.width = ballSize + 'px';
      d.style.height = ballSize + 'px';
      d.style.marginLeft = (-ballSize/2) + 'px';
      d.style.marginTop = (-ballSize/2) + 'px';
      d.style.fontSize = fontSize + 'px';
      vpEl.appendChild(d);
      ballEls.push(d);
    });
    rows.push({ballEls, winnerIdx, endW: -baseAngles[winnerIdx] - 360*(5+Math.floor(Math.random()*4))});
  }

  const vpW = elRRows.clientWidth || 380;
  const RADIUS = Math.max(100, Math.min(220, vpW*0.5));

  // Precompute per-frame transforms for perf
  const transforms = new Array(ROULETTE_N);

  function applyRow(rowData, W){
    for (let i=0;i<ROULETTE_N;i++){
      const A = (W + baseAngles[i]) * Math.PI / 180;
      const c = Math.cos(A), s = Math.sin(A);
      const x = s*RADIUS;
      const depth = (c+1)/2;
      const scale = 0.55 + 0.45*depth;
      const el = rowData.ballEls[i];
      el.style.transform = `translate3d(${x}px,0,0) scale(${scale})`;
      el.style.zIndex = (depth*1000)|0;
      el.style.opacity = (0.4 + 0.6*depth).toFixed(2);
    }
  }

  const eoQ = t => 1 - Math.pow(1-t, 5);
  const eoB = t => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  const DURATION = FAST_SPIN ? 1100 : 2400;
  const t0 = performance.now();
  rows.forEach(r => applyRow(r, 0));

  if (spinRaf) cancelAnimationFrame(spinRaf);

  function frame(now){
    if (myToken !== spinToken){ spinRaf = null; return; }
    const p = Math.min((now - t0) / DURATION, 1);
    const eased = p < 0.9 ? eoQ(p/0.9)*0.985 : 0.985 + (eoB((p-0.9)/0.1)*0.015);
    rows.forEach(r => applyRow(r, r.endW * eased));
    if (p >= 1){
      rows.forEach(r => { applyRow(r, r.endW); r.ballEls[r.winnerIdx].classList.add('winner'); });
      setTimeout(() => {
        if (myToken !== spinToken) return;
        elRTitle.textContent = 'You got';
        const totalVal = balls.reduce((s,b)=>s+b.value, 0);
        elRAmount.innerHTML = `<img src="${DIAMOND_GIF}"><span>${totalVal}</span>`;
        elRAmount.classList.add('show');
        haptic();
      }, 250);
      setTimeout(() => {
        if (myToken !== spinToken) return;
        elRoulette.classList.remove('show');
        elRRows.innerHTML = '';
        spinRaf = null;
        done();
      }, FAST_SPIN ? 1000 : 1700);
      return;
    }
    spinRaf = requestAnimationFrame(frame);
  }
  spinRaf = requestAnimationFrame(frame);
}

function finishRound(){
  let total = 0, won = 0, lost = 0;
  for (const r of G.results){ total += r.value * r.mult; if (r.mult === 0) lost++; else won++; }
  const winnings = Math.floor(total);
  BALANCE += winnings;
  const mult = G.wagered > 0 ? (winnings/G.wagered) : 0;
  G.wagered = 0;
  updateHud();
  if (winnings > 0) addTickerChip(winnings, mult, '');
  elResTag.textContent = winnings > 0 ? 'Round Results' : 'Round Over';
  elResAmt.innerHTML = `<img src="${DIAMOND_GIF}"><span>${(winnings>0?'+':'')+winnings}</span>`;
  elResAmt.classList.toggle('lose', winnings === 0);
  elResMult.textContent = '×' + mult.toFixed(2);
  elResMult.classList.toggle('lose', winnings === 0);
  elResSub.textContent = `${won} won · ${lost} lost`;
  elResult.classList.add('show');
}

  if (featured.arrow) featured.arrow.visible = false;
  featured.ball = null;
  regenerateMap(); buildMap();
  G.triX = 0; G.triDir = 1;
  camState.lookY = MAP.spinCy - 100;
  camState.targetLookY = MAP.spinCy - 100;
  camDrag.targetYaw = CAM_DEFAULT_YAW;
  camDrag.targetPitch = CAM_DEFAULT_PITCH;
  document.querySelectorAll('.dl-modal,.dl-r,.dl-result').forEach(el => el.classList.remove('show'));
  updateHud();
});
function flashResult(tag, amt, isLose, sub){
  elResTag.textContent = tag;
  elResAmt.innerHTML = `<span>${amt}</span>`;
  elResAmt.classList.toggle('lose', !!isLose);
  elResMult.textContent = '';
  elResSub.textContent = sub || '';
  elResult.classList.add('show');
}

document.getElementById('dl-close').addEventListener('click', () => {
  try { if (window.__state){ window.__state.balance = BALANCE; window.__state.updateBalance?.(); } } catch(_){}
  window.dispatchEvent(new CustomEvent('dlballs-close'));
});

regenerateMap();
buildMap();
onResize();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
