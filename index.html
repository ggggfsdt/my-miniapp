<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forge — Telegram NFT Crafting</title>
<style>
:root{
  --bg:#080a0e;--panel:#141a23;--line:#222b37;
  --txt:#e9eff8;--dim:#8794a6;--dim2:#5d6a7c;
  --accent:#3d8bfd;--accent2:#6ee7ff;--danger:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1000px 700px at 50% -10%, #1c2636 0%, transparent 62%),
    radial-gradient(800px 600px at 100% 110%, #16202e 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;
}
.app{
  height:100vh;height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,rgba(12,16,22,.5),rgba(8,11,16,.94));
  border-left:1px solid rgba(255,255,255,.04);
  border-right:1px solid rgba(255,255,255,.04);
}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
@keyframes flicker{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes ripple{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}

.nft-float{animation:float 3.6s ease-in-out infinite}
.nft-pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nft-sway{animation:sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.nft-flap{animation:flap 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nft-flicker{animation:flicker 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nft-sparkle{animation:sparkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nft-glow{animation:glow 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nft-orbit{animation:orbit 12s linear infinite;transform-box:fill-box;transform-origin:center}
.nft-ripple{animation:ripple 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:0 0 auto;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;
  background:linear-gradient(145deg,#3a4453,#1c232d);
  display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.08);
}
.brand-mark svg{width:19px;height:19px;color:#c8d4e4}
.brand-title{font-size:15px;font-weight:700;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--dim2);margin-top:1px;letter-spacing:.4px;text-transform:uppercase}
.coins{
  display:flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:800;color:#ffcf5c;
  background:rgba(255,207,92,.10);
  border:1px solid rgba(255,207,92,.28);
  padding:6px 10px;border-radius:9px;
  font-variant-numeric:tabular-nums;
}
.coins svg{width:12px;height:12px;color:#ffcf5c}

main{flex:1 1 auto;position:relative;overflow:hidden}
.view{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:translateX(30px);
  transition:opacity .28s ease, transform .36s cubic-bezier(.22,.9,.3,1);
  overflow-y:auto;overscroll-behavior:contain;
}
.view.active{opacity:1;pointer-events:auto;transform:translateX(0)}
.view.exit-left{transform:translateX(-30px)}
.view::-webkit-scrollbar{width:0}

.stage{
  position:relative;height:298px;flex:0 0 auto;
  display:grid;place-items:center;
  perspective:1050px;perspective-origin:50% 46%;
}
.stage.vib{animation:microVib .2s ease-out}
@keyframes microVib{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-2px,.7px) rotate(-.15deg)}
  50%{transform:translate(2px,-.7px) rotate(.15deg)}
  75%{transform:translate(-1px,-.4px) rotate(-.08deg)}
}
.stage::before{
  content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,140,170,.09),rgba(120,140,170,0) 66%);
  filter:blur(10px);pointer-events:none;
}
.floor{
  position:absolute;bottom:24px;width:200px;height:28px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(120,140,175,.16),rgba(0,0,0,0) 70%);
  filter:blur(5px);
}
.cube-pos{transform-style:preserve-3d;will-change:transform}
.cube{
  position:relative;width:150px;height:150px;
  transform-style:preserve-3d;will-change:transform;
}

.face{
  position:absolute;inset:0;width:150px;height:150px;border-radius:15px;
  background:#3e434b;border:1px solid rgba(0,0,0,.6);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.04),
    inset 0 -28px 40px rgba(0,0,0,.32),
    inset 0 28px 40px rgba(255,255,255,.03);
  display:grid;place-items:center;overflow:hidden;
  transition:box-shadow .3s ease, border-color .3s ease;
}
.face[data-f="front"] {transform:translateZ(75px)}
.face[data-f="back"]  {transform:rotateY(180deg) translateZ(75px)}
.face[data-f="right"] {transform:rotateY(90deg)  translateZ(75px)}
.face[data-f="left"]  {transform:rotateY(-90deg) translateZ(75px)}
.face[data-f="top"]   {transform:rotateX(90deg)  translateZ(75px)}
.face[data-f="bottom"]{transform:rotateX(-90deg) translateZ(75px)}

.face-icon{position:absolute;width:42px;height:42px;color:rgba(20,24,30,.42);transition:opacity .25s}
.face-icon svg{width:100%;height:100%}
.face.has-nft .face-icon{opacity:0}
.face .attached{
  position:absolute;inset:0;display:grid;place-items:center;
  opacity:0;transform:scale(.35);
}
.face.has-nft .attached{
  opacity:1;transform:scale(1);
  transition:opacity .26s ease, transform .52s cubic-bezier(.18,1.7,.4,1);
}
.face.has-nft{
  border-color:rgba(150,220,255,.72);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.15),
    inset 0 0 46px rgba(120,200,255,.28),
    0 0 26px rgba(110,190,255,.32);
}
.face .attached svg{width:76%;height:76%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.face.result{
  border-color:rgba(255,214,110,.95);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.2),
    inset 0 0 60px rgba(255,196,72,.42),
    0 0 40px rgba(255,196,72,.5);
}
.face.result .attached{animation:revealPop .82s cubic-bezier(.2,1.5,.35,1) both}
@keyframes revealPop{
  0%{opacity:0;transform:scale(.12) rotate(-32deg)}
  62%{opacity:1;transform:scale(1.14) rotate(5deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.face.burn{
  border-color:rgba(255,90,90,.85)!important;
  box-shadow:inset 0 0 54px rgba(255,60,60,.55),0 0 30px rgba(255,60,60,.45)!important;
  animation:burnFlicker .48s ease-in-out 3;
}
@keyframes burnFlicker{0%,100%{opacity:1}50%{opacity:.3}}
.face.burn .attached{opacity:.22!important;filter:grayscale(1) brightness(.5)}

.status{
  position:absolute;bottom:0;left:0;right:0;text-align:center;
  font-size:12.5px;font-weight:600;color:var(--dim);
  letter-spacing:.5px;transition:color .3s ease;
}
.status.live{color:var(--accent2)}
.status.bad{color:var(--danger)}

.panel{flex:0 0 auto;padding:0 14px 10px}
.slots{display:flex;gap:6px;margin-bottom:8px}
.slot{
  flex:1;aspect-ratio:1;border-radius:12px;
  border:1.5px dashed rgba(130,150,180,.24);
  background:rgba(255,255,255,.014);
  display:grid;place-items:center;position:relative;overflow:hidden;
  transition:border-color .25s ease, background .25s ease;
}
.slot.filled{border-style:solid;border-color:rgba(130,180,240,.55);background:rgba(60,90,140,.12)}
.slot .ph{width:15px;height:15px;color:rgba(130,160,200,.22)}
.slot .ph svg{width:100%;height:100%}
.slot .sl-bg{position:absolute;inset:0;opacity:.92}
.slot .sl-bg svg{width:100%;height:100%;display:block}
.slot .sl-md{position:absolute;inset:0;display:grid;place-items:center}
.slot .sl-md svg{width:78%;height:78%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.slot .sl-bgname{
  position:absolute;bottom:2px;left:2px;right:2px;
  font-size:6px;font-weight:800;letter-spacing:.2px;
  text-align:center;color:#e2ecf8;
  padding:1px 0;border-radius:4px;
  background:rgba(0,0,0,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.slot .sl-x{
  position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;
  background:rgba(10,14,20,.88);border:1px solid rgba(255,255,255,.14);
  display:grid;place-items:center;z-index:3;
}
.slot .sl-x svg{width:6px;height:6px;color:#b9c6d8}

.odds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:16px}
.odds .od{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:var(--dim);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  padding:2px 7px;border-radius:20px;
}
.odds .dot{width:6px;height:6px;border-radius:50%}
.odds .od b{color:var(--txt);font-weight:700}

.riskline{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:600;color:var(--dim2);
  margin-bottom:9px;min-height:15px;letter-spacing:.2px;
}
.riskline.warn{color:#cf8f8f}
.riskline b{color:var(--danger);font-weight:800}
.riskline .rdot{width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px rgba(255,90,90,.7)}
.riskline.safe{color:#6a8a6a}
.riskline.safe b{color:#7ee88c}
.riskline .sdot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(80,220,130,.7)}

.craft-btn{
  width:100%;height:50px;border:none;border-radius:15px;
  font-size:14.5px;font-weight:800;letter-spacing:.5px;
  color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#4b5563,#2a303a);
  box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .12s ease, opacity .2s ease, box-shadow .2s ease, background .25s;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.craft-btn svg{width:18px;height:18px}
.craft-btn:active{transform:scale(.975)}
.craft-btn:disabled{background:linear-gradient(135deg,#222b38,#181f29);color:#57657a;box-shadow:none;cursor:default}
.craft-btn.ready{
  background:linear-gradient(135deg,#3d8bfd,#2a5fd0);
  box-shadow:0 8px 24px rgba(45,110,220,.38), inset 0 1px 0 rgba(255,255,255,.22);
}

.upg-wrap{padding:14px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel-wrap{position:relative;width:230px;height:230px;display:grid;place-items:center}
.wheel-svg{width:100%;height:100%;filter:drop-shadow(0 12px 32px rgba(0,0,0,.6))}
#wheelRotate{
  transition:transform 4.4s cubic-bezier(.15,.7,.2,1);
  transform-origin:100px 100px;transform:rotate(0deg);
}
.wlabel{font-size:8.5px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:middle;pointer-events:none;letter-spacing:.3px;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:1.2px}
.wheel-pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:18px solid #ffcf5c;
  filter:drop-shadow(0 0 8px rgba(255,207,92,.9));z-index:10;
}
.wheel-hub{
  position:absolute;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a525e,#1a202a);
  border:2px solid #2a3038;
  box-shadow:0 0 0 5px #10151c, 0 6px 16px rgba(0,0,0,.7);
  z-index:5;display:grid;place-items:center;
}
.wheel-hub svg{width:20px;height:20px;color:#c8d4e4}

.upg-info{
  font-size:11.5px;color:var(--dim);text-align:center;
  max-width:280px;line-height:1.5;font-weight:600;
}
.upg-info b{color:var(--accent2)}

.spin-btn{
  width:100%;max-width:300px;height:50px;border:none;border-radius:15px;
  font-size:14.5px;font-weight:800;letter-spacing:.5px;
  color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  box-shadow:0 8px 24px rgba(120,60,220,.4), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .12s ease, opacity .2s ease;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.spin-btn:active{transform:scale(.975)}
.spin-btn:disabled{background:linear-gradient(135deg,#222b38,#181f29);color:#57657a;box-shadow:none;cursor:default}
.spin-btn svg{width:18px;height:18px}

.upg-slot{
  width:100%;max-width:300px;height:100px;border-radius:16px;
  border:1.5px dashed rgba(130,150,180,.28);
  background:rgba(255,255,255,.02);
  display:grid;place-items:center;position:relative;overflow:hidden;
}
.upg-slot.filled{border-style:solid;border-color:rgba(160,140,250,.6);background:rgba(80,60,160,.12)}
.upg-slot .u-bg{position:absolute;inset:0;opacity:.85}
.upg-slot .u-bg svg{width:100%;height:100%;display:block}
.upg-slot .u-md{position:absolute;left:0;top:0;bottom:0;width:100px;display:grid;place-items:center}
.upg-slot .u-md svg{width:80%;height:80%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
.upg-slot .u-info{position:absolute;left:104px;right:12px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.upg-slot .u-nm{font-size:13px;font-weight:800;color:#eef4fb}
.upg-slot .u-tier{font-size:10px;font-weight:800;letter-spacing:.7px;margin-top:3px}
.upg-slot .u-bgnm{font-size:10px;color:var(--dim);margin-top:2px;font-weight:600}
.upg-slot .ph-txt{font-size:12px;font-weight:700;color:var(--dim2);letter-spacing:.3px}

.picker-title{
  font-size:11.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);
  text-transform:uppercase;margin-top:6px;align-self:flex-start;padding-left:2px;
}

.prof-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;flex:0 0 auto}
.prof-title{font-size:17px;font-weight:800;letter-spacing:.2px}
.prof-count{font-size:11.5px;color:var(--dim2);margin-top:3px;font-weight:600}
.mint-btn{
  border:1px solid rgba(130,180,240,.32);background:rgba(60,120,220,.14);
  color:#9ecbff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:11px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:background .2s ease, transform .12s ease;
}
.mint-btn:active{background:rgba(60,120,220,.3);transform:scale(.96)}
.mint-btn svg{width:13px;height:13px}

.gifts-section{padding:0 16px 14px}
.gifts-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gifts-title{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--dim);text-transform:uppercase}
.gifts-actions{display:flex;gap:6px}
.gbtn{
  border:1px solid rgba(255,207,92,.32);background:rgba(255,207,92,.10);
  color:#ffcf5c;font-size:10.5px;font-weight:800;padding:6px 10px;border-radius:9px;cursor:pointer;
  letter-spacing:.3px;transition:background .2s ease,transform .12s ease;
}
.gbtn:active{background:rgba(255,207,92,.22);transform:scale(.95)}
.gifts-row{display:flex;gap:8px;flex-wrap:wrap;min-height:66px}
.gift-box{
  width:56px;height:56px;border-radius:12px;
  background:linear-gradient(145deg,#2a1f0a,#1a1208);
  border:1.5px solid rgba(255,207,92,.42);
  display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease;
  animation:cardIn .4s cubic-bezier(.2,.9,.3,1) backwards;
}
.gift-box:active{transform:scale(.94)}
.gift-box::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 25%,rgba(255,207,92,.28),transparent 65%);
  pointer-events:none;
}
.gift-box svg{width:60%;height:60%;color:#ffcf5c;filter:drop-shadow(0 3px 6px rgba(255,180,0,.5))}
.gift-box.shake{animation:giftShake .45s ease}
@keyframes giftShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-3px,1px) rotate(-4deg)}
  50%{transform:translate(3px,-1px) rotate(4deg)}
  75%{transform:translate(-2px,1px) rotate(-2deg)}
}
.gifts-empty{font-size:11px;color:var(--dim2);font-weight:600;padding:14px 0;text-align:center;width:100%}

.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 26px}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.inv-card{
  position:relative;aspect-ratio:.78;border-radius:14px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.07);background:#0b0f15;cursor:pointer;
  transition:transform .16s ease, border-color .2s ease, box-shadow .2s ease;
  animation:cardIn .36s cubic-bezier(.2,.9,.3,1) backwards;
}
.inv-card:active{transform:scale(.965)}
.inv-card.sel{
  border-color:rgba(140,210,255,.95);
  box-shadow:0 0 0 1.5px rgba(140,210,255,.4), 0 0 22px rgba(90,170,255,.4);
}
.inv-card .c-bg{position:absolute;inset:0}
.inv-card .c-bg svg{width:100%;height:100%;display:block}
.inv-card .c-md{position:absolute;left:0;right:0;top:0;bottom:44px;display:grid;place-items:center}
.inv-card .c-md svg{width:84%;height:84%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.55))}
.inv-card .c-ft{
  position:absolute;left:0;right:0;bottom:0;padding:3px 5px 4px;
  background:linear-gradient(180deg,rgba(8,11,16,0),rgba(8,11,16,.95) 40%);
}
.inv-card .c-nm{font-size:8.5px;font-weight:800;color:#eef4fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.05px}
.inv-card .c-bgname{
  display:inline-block;font-size:7px;font-weight:700;letter-spacing:.2px;
  padding:1px 5px;border-radius:20px;margin-top:1px;max-width:calc(100% - 42px);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);
  color:#cdd9e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.inv-card .c-price{
  position:absolute;bottom:4px;right:5px;
  font-size:7.5px;font-weight:800;color:#ffcf5c;
  display:flex;align-items:center;gap:2px;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.inv-card .c-price svg{width:7px;height:7px}
.inv-card .c-check{
  position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(140deg,#4d9dff,#2a6fe0);
  display:grid;place-items:center;
  opacity:0;transform:scale(.5);
  transition:all .2s cubic-bezier(.2,1.6,.4,1);
  box-shadow:0 3px 10px rgba(50,120,240,.6);
}
.inv-card.sel .c-check{opacity:1;transform:scale(1)}
.inv-card .c-check svg{width:9px;height:9px;color:#fff}

.market-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 16px 12px;flex:0 0 auto;
}
.market-bal{
  display:flex;flex-direction:column;gap:2px;
}
.market-bal-label{font-size:11px;color:var(--dim2);font-weight:600;letter-spacing:.3px}
.market-bal-value{font-size:19px;font-weight:800;color:#ffcf5c;display:flex;align-items:center;gap:6px}
.market-bal-value svg{width:16px;height:16px}

.tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  background:rgba(12,16,22,.94);
  backdrop-filter:blur(14px);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  gap:4px;
}

function shade(hex, p){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(p>=0){ r+=(255-r)*p; g+=(255-g)*p; b+=(255-b)*p; }
  else { r*=(1+p); g*=(1+p); b*=(1+p); }
  const h = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}
function weightedPick(list){
  const total = list.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  for(const it of list){ r -= it.w; if(r<=0) return it; }
  return list[list.length-1];
}

  return new Promise(res=>{
    const t0 = performance.now();
    (function step(t){
      const p = Math.min(1,(t-t0)/dur);
      fn(p);
      if(p<1) requestAnimationFrame(step); else res();

  });
}

function bgSVG(bg, u){
  const shapes = [];
  for(let i=0;i<6;i++) for(let j=0;j<6;j++){
    const x = 9 + i*16.4, y = 9 + j*16.4;
    const r = 2.2 + ((i*7 + j*13) % 3) * 0.9;
    const m = (i*3 + j*5) % 3;
    if(m === 0) shapes.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"/>`);
    else if(m === 1) shapes.push(`<path d="M${x.toFixed(1)} ${(y-r).toFixed(1)} L${(x+r).toFixed(1)} ${(y+r).toFixed(1)} L${(x-r).toFixed(1)} ${(y+r).toFixed(1)} Z"/>`);
    else shapes.push(`<path d="M${x.toFixed(1)} ${(y-r).toFixed(1)} L${(x+r).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y+r).toFixed(1)} L${(x-r).toFixed(1)} ${y.toFixed(1)} Z"/>`);
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgg${u}" cx="28%" cy="16%" r="96%">
        <stop offset="0%" stop-color="${bg.a}"/>
        <stop offset="100%" stop-color="${bg.b}"/>
      </radialGradient>
      <radialGradient id="bgv${u}" cx="50%" cy="50%" r="70%">
        <stop offset="55%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
      </radialGradient>
    </defs>
    <rect width="100" height="100" fill="url(#bgg${u})"/>
    <g fill="none" stroke="${bg.sym}" stroke-width=".75" opacity=".5">${shapes.join('')}</g>
    <rect width="100" height="100" fill="url(#bgv${u})"/>
  </svg>`;
}

  top:    { rx:-90, ry:0   }, bottom: { rx:90,  ry:0   }

const FACE_KICK = {
  front:  { dx: 0,  dy: 40,  ax: 0,   ay: 0,   az: 3.2 },
  back:   { dx: 0,  dy:-36,  ax: 0,   ay: 0,   az:-3.2 },

};

const ANVIL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

const st = {

  spinX: 7, spinY: 20, spinZ: 2.6,
  spinExtra: { x:0, y:0, z:0 },
  freeze: false,
  holdFace: null,
  ox:0, oy:0, orx:0, ory:0,
  vx:0, vy:0, vrx:0, vry:0
};

function applyFaceKick(faceName){
  const k = FACE_KICK[faceName];
  if(!k) return;
  st.vx += k.dx * 16;
  st.vy += k.dy * 16;
  st.spinExtra.x += k.ax * 38;
  st.spinExtra.y += k.ay * 38;
  st.spinExtra.z += k.az * 38;
  vibe([18, 22, 30]);
  microVib();
}
function microVib(){
  stageEl.classList.remove('vib');
  void stageEl.offsetWidth;
  stageEl.classList.add('vib');
  setTimeout(() => stageEl.classList.remove('vib'), 220);
}

let _last = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t - _last) / 1000);
  _last = t;

  if(!st.freeze){
    st.ry += (st.spinY + st.spinExtra.y) * dt;
    st.rx += (st.spinX + st.spinExtra.x) * dt;
    st.rz += (st.spinZ + st.spinExtra.z) * dt;
    const decay = 1 - 0.11 * dt * 60 / 60;
    st.spinExtra.x *= decay;
    st.spinExtra.y *= decay;
    st.spinExtra.z *= decay;
  }

  const K = 65, D = 6;
  const acc = (v,x) => -K*x - D*v;
  st.vx  += acc(st.vx,  st.ox)  * dt;  st.ox  += st.vx  * dt;
  st.vy  += acc(st.vy,  st.oy)  * dt;  st.oy  += st.vy  * dt;
  st.vrx += acc(st.vrx, st.orx) * dt;  st.orx += st.vrx * dt;
  st.vry += acc(st.vry, st.ory) * dt;  st.ory += st.vry * dt;

  cubePosEl.style.transform = `translate3d(${st.ox.toFixed(2)}px, ${st.oy.toFixed(2)}px, 0)`;
  cubeEl.style.transform =
    `rotateX(${(st.rx + st.orx).toFixed(2)}deg) ` +
    `rotateY(${(st.ry + st.ory).toFixed(2)}deg) ` +
    `rotateZ(${st.rz.toFixed(2)}deg)`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function makeNFT(baseId, bgId, modelOverride){
  const b = BASE_MAP[baseId];
  const model = modelOverride || weightedPick(b.models.map(m => ({ ...m, w:m.weight })));
  const bg = bgId ? BG_MAP[bgId] : weightedPick(BGS.map(x => ({ id:x.id, w:x.weight })));
  const isGrail = !!model.grail;
  const c1 = isGrail ? '#ffffff' : model.c1;
  const c2 = isGrail ? '#0a0a0a' : model.c2;
  const finalBg = isGrail ? 'onyx' : bg.id;
  const finalBgObj = BG_MAP[finalBg];
  return {
    id: 'n' + (++NFT_ID),
    baseId,
    name: model.name,
    char: b.char,
    style: model.style || 'simple',
    c1, c2,
    bg: finalBg,
    grail: isGrail,
    price: TIER_PRICE[finalBgObj.rarity] || 15,
    crafted: !!modelOverride
  };
}

function makeRandomNFT(){
  const base = pick(BASES);
  const model = weightedPick(base.models.map(m => ({ ...m, w:m.weight })));
  const bg = weightedPick(BGS.map(x => ({ id:x.id, w:x.weight })));
  const isGrail = !!model.grail;
  const finalBg = isGrail ? BG_MAP.onyx : bg;
  return {
    id: 'n' + (++NFT_ID),
    baseId: base.id,
    name: model.name,
    char: base.char,
    style: model.style || 'simple',
    c1: isGrail ? '#ffffff' : model.c1,
    c2: isGrail ? '#0a0a0a' : model.c2,
    bg: finalBg.id,
    grail: isGrail,
    price: TIER_PRICE[finalBg.rarity] || 15,
    crafted: true
  };
}

function seedInventory(){
  state.inventory = [];
  BASES.forEach(b => { for(let i=0;i<2;i++) state.inventory.push(makeNFT(b.id)); });
  state.inventory[2].bg  = 'nebula';

function computeOdds(){
  const counts = {};
  state.selected.forEach(id => {
    const n = state.inventory.find(x => x.id === id);
    if(n) counts[n.bg] = (counts[n.bg] || 0) + 1;
  });
  const entries = Object.entries(counts).map(([id,c]) => ({ id, w: c*c*10 + 1 }));
  const total = entries.reduce((s,e) => s + e.w, 0) || 1;
  return entries.map(e => ({ bg: BG_MAP[e.id], pct: e.w/total*100 })).sort((a,b) => b.pct - a.pct);
}

async function flyToCube(nft){
  const src = document.querySelector(`.slot[data-id="${nft.id}"]`);
  const srcRect = src ? src.getBoundingClientRect()
                      : { left: innerWidth/2-30, top: innerHeight-150, width:60, height:60 };
  const stageRect = stageEl.getBoundingClientRect();
  const sx = srcRect.left + srcRect.width/2;
  const sy = srcRect.top  + srcRect.height/2;
  const cx = stageRect.left + stageRect.width/2;
  const cy = stageRect.top  + stageRect.height/2;

  const flyer = document.createElement('div');
  flyer.className = 'flyer';
  flyer.innerHTML = charSVG(nft.char, nft.c1, nft.c2, nft.style, uid());
  document.body.appendChild(flyer);

  const mx = (sx + cx)/2 + rnd(-80,80);
  const my = (sy + cy)/2 - 130;

  const anim = flyer.animate([
    { transform:`translate(${sx}px,${sy}px) translate(-50%,-50%) scale(1) rotate(0deg)`, opacity:1 },
    { transform:`translate(${mx}px,${my}px) translate(-50%,-50%) scale(1.12) rotate(240deg)`, opacity:1, offset:.55 },
    { transform:`translate(${cx}px,${cy}px) translate(-50%,-50%) scale(.12) rotate(600deg)`, opacity:0 }
  ], { duration: 720, easing:'cubic-bezier(.4,0,.25,1)', fill:'forwards' });

  try { await anim.finished; } catch(e){}
  flyer.remove();
}

/* =========================================================
   RESULT CALC
   ========================================================= */
function colorDist(a, b){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const dr = ((pa>>16)&255) - ((pb>>16)&255);
  const dg = ((pa>>8)&255)  - ((pb>>8)&255);
  const db = (pa&255)       - (pb&255);
  return Math.sqrt(dr*dr + dg*dg + db*db);
}

function computeResult(inputs){
  const baseCounts = {};
  inputs.forEach(n => baseCounts[n.baseId] = (baseCounts[n.baseId]||0) + 1);
  const basePick = weightedPick(Object.entries(baseCounts).map(([id,c]) => ({ id, w:c })));
  const base = BASE_MAP[basePick.id];

  const totalW = base.models.reduce((s,m) => s + m.weight, 0);
  const model  = weightedPick(base.models.map(m => ({ ...m, w:m.weight })));
  const chance = model.weight / totalW * 100;

  const bgCounts = {};
  inputs.forEach(n => bgCounts[n.bg] = (bgCounts[n.bg]||0) + 1);
  const bgPicks = Object.entries(bgCounts).map(([id,c]) => ({ id, w: c*c*10 + 1 }));
  let bgId = weightedPick(bgPicks).id;
  let bg   = BG_MAP[bgId];

  /* Grail override: model.grail forces black/white + Black Onyx */
  const isGrail = !!model.grail;
  let c1 = model.c1, c2 = model.c2;
  if(isGrail){
    c1 = '#ffffff';
    c2 = '#0a0a0a';
    bgId = 'onyx';
    bg = BG_MAP.onyx;
  }

  const forcedMono  = !isGrail && Math.random() < 0.045;
  const naturalMono = !isGrail && colorDist(c1, bg.sym) < 42 && colorDist(c2, bg.a) < 60;
  const mono = isGrail || forcedMono || naturalMono;

  if(forcedMono){ c1 = shade(bg.sym, 0.34); c2 = shade(bg.a, -0.12); }

  return {
    id: 'c' + (++NFT_ID),
    baseId: base.id,
    name: model.name,
    char: base.char,
    style: model.style || 'simple',
    c1, c2,
    bg: bgId,
    chance,
    mono,
    grail: isGrail,
    price: TIER_PRICE[bg.rarity] || 15,
    serial: state.serial++,
    crafted: true
  };
}

/* =========================================================
   ALIGN — freeze after (no snap-back free spin)
   ========================================================= */
async function alignTo(faceName, dur = 1600){
  const t = FACE_ROT[faceName];
  const baseRy = t.ry + 360 * Math.round((st.ry - t.ry) / 360);
  const fromRx = st.rx, fromRy = st.ry, fromRz = st.rz;
  const toRy = baseRy + 360;

  st.freeze = true;
  st.spinExtra = { x:0, y:0, z:0 };
  await tween(dur, p => {
    const e = easeOutQuart(p);
    st.rx = fromRx + (t.rx - fromRx) * e;
    st.ry = fromRy + (toRy  - fromRy) * e;
    st.rz = fromRz + (0     - fromRz) * e;
  });
  /* Snap exactly to target — no residual offset */
  st.rx = t.rx;
  st.ry = baseRy;
  st.rz = 0;
  st.spinExtra = { x:0, y:0, z:0 };
  /* Keep frozen — cube stays on the result face until modal closes */
  st.holdFace = faceName;
}

/* =========================================================
   CRAFT — with failure risk
   ========================================================= */
async function craft(){
  if(state.busy || !state.selected.length) return;

  switchTab('forge');
  state.busy = true;
  $('#craftBtn').disabled = true;
  $('#craftBtn').classList.remove('ready');

  resetCube();
  st.freeze = false;
  st.holdFace = null;

  const inputs = state.selected.map(id => state.inventory.find(n => n.id === id)).filter(Boolean);
  const risk = riskFor(inputs.length);
  const willFail = Math.random() < risk;

  const sideFaces  = ['front','back','right','left'];
  const shuffled   = shuffle(FACES);
  const inputFaces = shuffled.slice(0, inputs.length);
  const freeSides  = sideFaces.filter(f => !inputFaces.includes(f));
  const resultFace = freeSides.length ? pick(freeSides) : 'front';

  setStatus('Feeding the forge…', 'live');
  vibe([22, 18, 30]);

  for(let i=0;i<inputs.length;i++){
    await flyToCube(inputs[i]);
    attachToFace(inputFaces[i], inputs[i]);
    applyFaceKick(inputFaces[i]);
    await wait(250);
  }
  await wait(140);

  setStatus('Fusing…', 'live');
  await tween(680, p => {
    st.spinExtra.y += 28 * (1 - p) * 0.5;
    st.spinExtra.x += 12 * (1 - p) * 0.5;
  });
  for(let i=0;i<3;i++){
    st.vx += rnd(-42,42) * 4;
    st.vy += rnd(-34,34) * 4;
    st.spinExtra.x += rnd(-44,44);
    st.spinExtra.y += rnd(-66,66);
    vibe([16, 22, 30]);
    await wait(140);
  }
  await wait(160);

  /* ============ FAILURE ============ */
  if(willFail){
    setStatus('Unstable!', 'bad');
    st.vx += 500; st.vy -= 380;
    st.spinExtra.x += 220; st.spinExtra.y += 320; st.spinExtra.z += 150;
    vibe([60, 40, 120, 40, 180]);

    FACES.forEach(f => {
      const el = faceEl(f);
      if(el.classList.contains('has-nft')) el.classList.add('burn');
    });
    flashScreen();
    await wait(1000);
    flashScreen();
    vibe([40, 30, 80]);
    await wait(220);

    state.inventory = state.inventory.filter(n => !state.selected.includes(n.id));
    state.selected = [];
    refreshSelectionUI();
    renderInventory();
    showFailModal(inputs);
    return;
  }

  /* ============ SUCCESS ============ */
  setStatus('Locking…', 'live');
  await alignTo(resultFace, 1500);

  const result = computeResult(inputs);
  const rf = faceEl(resultFace);
  rf.classList.add('has-nft','result');
  rf.querySelector('.attached').innerHTML = charSVG(result.char, result.c1, result.c2, result.style, uid());

  st.vx += 34; st.vy += 30;
  vibe([30, 25, 45, 30, 80]);
  setStatus('Forged!', 'live');

  state.inventory = state.inventory.filter(n => !state.selected.includes(n.id));
  state.selected = [];
  state.inventory.unshift(result);

  refreshSelectionUI();
  renderInventory();

  await wait(900);
  showResultModal(result);
}

async function flashScreen(){
  const el = $('#flash');
  el.classList.add('on');
  await wait(190);
  el.classList.remove('on');
}

    </div>

    <div class="res-row">
      <span class="tier" style="color:${tier.color}">${tier.name}</span>

function showFailModal(inputs){

      <div class="lbg">${bgSVG(bg, uid())}</div>

  }).join('');

  openModal(`
    <div class="fail-card">
      <svg viewBox="0 0 100 100" fill="none" stroke="#ff8080" stroke-width="2.4" stroke-linejoin="round">
        <path d="M50 6 L88 28 L88 72 L50 94 L12 72 L12 28 Z" stroke-opacity=".55"/>
        <path d="M50 6 L50 40 L30 52 L44 64 L34 86" stroke="#ff5a5a" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="res-sub">The cube rejected your offering</div>

    <div class="modal-actions">
      <button class="mbtn primary" id="fClose" style="background:linear-gradient(135deg,#b34242,#7d2626);box-shadow:0 6px 18px rgba(180,50,50,.35)">
        Accept Loss

    </div>

  $('#fClose').addEventListener('click', () => {

  });

function showModelList(baseId, owned){
  const base = BASE_MAP[baseId];
  const totalW = base.models.reduce((s,m) => s + m.weight, 0);

  const rows = base.models.slice().sort((a,b) => b.weight - a.weight).map(m => {
    const pct  = m.weight / totalW * 100;
    const tier = tierOfChance(pct);
    const isOwn = owned && owned.name === m.name;
    const style = m.grail ? 'grail' : (m.style || 'simple');
    return `<div class="ml-item${isOwn ? ' own' : ''}">
      <div class="ml-ic">${charSVG(base.char, m.c1, m.c2, style, uid())}</div>
      <div class="ml-info">
        <div class="ml-nm">${m.name}</div>
        <div class="ml-tier" style="color:${tier.color}">${tier.name}</div>
      </div>
      <div class="ml-pct">${fmtPct(pct)}</div>
    </div>`;
  }).join('');

  openModal(`
    <div class="ml-head">
      <div class="ml-title">${base.name}</div>
      <div class="ml-sub">${base.models.length} forged variants</div>
    </div>
    <div class="ml-list">${rows}</div>
    <div class="modal-actions">
      <button class="mbtn primary" id="mlBack">Back</button>
    </div>
  `);

  $('#mlBack').addEventListener('click', () => {
    if(owned) showResultModal(owned); else closeModal();
  });
}

/* =========================================================
   RARITY
   ========================================================= */
function tierOfChance(pct){
  if(pct > 30)  return { name:'COMMON',    color:'#8b98a9' };
  if(pct > 10)  return { name:'UNCOMMON',  color:'#4ade80' };
  if(pct > 4)   return { name:'RARE',      color:'#5ea8ff' };
  if(pct > 1.5) return { name:'EPIC',      color:'#b48cff' };
  if(pct > 0.6) return { name:'LEGENDARY', color:'#ffcf5c' };
  return { name:'MYTHIC', color:'#ff6b6b' };
}
function fmtPct(p){
  if(p >= 10) return p.toFixed(1) + '%';
  return p.toFixed(2) + '%';
}

/* =========================================================
   UPGRADER WHEEL
   ========================================================= */
const UPGRADE_PATTERN = [1, 2, 1, 3, 1, 2];

function segmentPath(i){
  const a1 = i * 60 * Math.PI / 180;
  const a2 = (i + 1) * 60 * Math.PI / 180;
  const x1 = 100 + 85 * Math.sin(a1);
  const y1 = 100 - 85 * Math.cos(a1);
  const x2 = 100 + 85 * Math.sin(a2);
  const y2 = 100 - 85 * Math.cos(a2);
  return `M100,100 L${x1.toFixed(2)},${y1.toFixed(2)} A85,85 0 0,1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
}
function labelPos(i){
  const a = (i * 60 + 30) * Math.PI / 180;
  return { x: 100 + 58 * Math.sin(a), y: 100 - 58 * Math.cos(a) };
}

function buildWheel(currentTierIdx){
  const g = $('#wheelRotate');
  g.innerHTML = '';
  for(let i=0;i<6;i++){
    const upgrade = UPGRADE_PATTERN[i];
    const newIdx = Math.min(currentTierIdx + upgrade, TIER_ORDER.length - 1);
    const tierName = TIER_ORDER[newIdx];
    const color = TIER_COLORS[tierName];
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', segmentPath(i));
    path.setAttribute('fill', shade(color, -0.15));
    path.setAttribute('stroke', '#0f151d');
    path.setAttribute('stroke-width', '1');
    g.appendChild(path);

    const pos = labelPos(i);
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', pos.x.toFixed(1));
    txt.setAttribute('y', pos.y.toFixed(1));
    txt.setAttribute('class', 'wlabel');
    txt.textContent = tierName;
    g.appendChild(txt);
  }
}

function selectForUpgrade(id){
  if(state.busy) return;
  if(state.upgradeSelected === id) state.upgradeSelected = null;
  else state.upgradeSelected = id;
  vibe([12, 16, 20]);
  updateUpgradeUI();
  renderUpgradePicker();
}

function updateUpgradeUI(){
  const nft = state.upgradeSelected ? state.inventory.find(n => n.id === state.upgradeSelected) : null;
  const slot = $('#upgSlot');
  const spinBtn = $('#spinBtn');
  const info = $('#upgInfo');

  if(!nft){
    slot.className = 'upg-slot';
    slot.innerHTML = `<div class="ph-txt">No NFT selected</div>`;
    info.innerHTML = 'Select an NFT below to begin upgrading';
    spinBtn.disabled = true;
    buildWheel(0);
    return;
  }

  const bg = BG_MAP[nft.bg];
  const tierIdx = TIER_ORDER.indexOf(bg.rarity);
  const isMax = tierIdx === TIER_ORDER.length - 1;

  slot.className = 'upg-slot filled';
  slot.innerHTML = `
    <div class="u-bg">${bgSVG(bg, uid())}</div>
    <div class="u-md">${charSVG(nft.char, nft.c1, nft.c2, nft.style, uid())}</div>
    <div class="u-info">
      <div class="u-nm">${nft.name}</div>
      <div class="u-tier" style="color:${TIER_COLORS[bg.rarity]}">${bg.rarity.toUpperCase()}</div>
      <div class="u-bgnm">${bg.name}</div>
    </div>`;
  buildWheel(tierIdx);

  if(isMax){
    info.innerHTML = '<b>Already Mythic!</b> This NFT is at max rarity.';
    spinBtn.disabled = true;
  } else {
    info.innerHTML = `Spin to upgrade the background. Guaranteed upgrade!`;
    spinBtn.disabled = false;
  }
}

async function spinWheel(){
  if(state.busy) return;
  const nft = state.upgradeSelected ? state.inventory.find(n => n.id === state.upgradeSelected) : null;
  if(!nft) return;
  const bg = BG_MAP[nft.bg];
  const currentIdx = TIER_ORDER.indexOf(bg.rarity);
  if(currentIdx === TIER_ORDER.length - 1) return;

  state.busy = true;
  $('#spinBtn').disabled = true;

  const segIdx = Math.floor(Math.random() * 6);
  const upgrade = UPGRADE_PATTERN[segIdx];
  const newIdx = Math.min(currentIdx + upgrade, TIER_ORDER.length - 1);
  const newTier = TIER_ORDER[newIdx];

  vibe([18, 22, 26, 22, 34]);

  const extraSpins = 5;
  const targetAngle = 360 * extraSpins + (330 - segIdx * 60);
  state.wheelAngle += targetAngle;
  $('#wheelRotate').style.transform = `rotate(${state.wheelAngle}deg)`;

  const ticks = [];
  for(let i=0;i<12;i++) ticks.push(setTimeout(() => vibe(8), 200 + i * 180));

  await wait(4400);
  ticks.forEach(clearTimeout);
  vibe([40, 30, 60, 30, 100]);

  const pool = BGS.filter(b => b.rarity === newTier);
  const newBg = pick(pool);

  nft.bg = newBg.id;
  nft.price = TIER_PRICE[newBg.rarity] || 15;
  nft.crafted = true;

  showUpgradeResult(nft, bg, newBg);
}

function showUpgradeResult(nft, oldBg, newBg){
  openModal(`
    <div class="reveal-card">
      <div class="bg">${bgSVG(newBg, uid())}</div>
      <div class="mdl">${charSVG(nft.char, nft.c1, nft.c2, nft.style, uid())}</div>
    </div>
    <div class="res-name">Upgraded!</div>
    <div class="res-sub">${oldBg.rarity} → <span style="color:${TIER_COLORS[newBg.rarity]};font-weight:800">${newBg.rarity}</span></div>
    <div class="res-bgline">
      <span class="bdot" style="background:${newBg.sym};color:${newBg.sym}"></span>
      ${newBg.name}
    </div>
    <div class="res-price">${COIN_ICON} ${nft.price.toLocaleString()} coins</div>
    <div class="modal-actions">
      <button class="mbtn primary" id="uClose">Nice!</button>
    </div>
  `);
  $('#uClose').addEventListener('click', () => {
    closeModal();
    renderInventory();
    renderUpgradePicker();
    updateUpgradeUI();
    renderMarket();
  });
}

$('#spinBtn').addEventListener('click', spinWheel);

   GIFTS
   ========================================================= */
function renderGifts(){
  const row = $('#giftsRow');
  row.innerHTML = '';
  if(!state.gifts.length){
    row.innerHTML = '<div class="gifts-empty">No gifts — tap "+ Get Gift" to mint one</div>';
    return;
  }
  state.gifts.forEach((gift, i) => {
    const box = document.createElement('div');
    box.className = 'gift-box';
    box.style.animationDelay = Math.min(i * 30, 300) + 'ms';
    box.innerHTML = GIFT_ICON;
    box.addEventListener('click', () => revealGift(gift.id, box));
    row.appendChild(box);
  });
}

async function revealGift(giftId, boxEl){
  if(state.busy) return;
  state.busy = true;
  boxEl.classList.add('shake');
  vibe([25, 20, 35, 20, 50]);
  await wait(450);

  const nft = makeRandomNFT();
  state.gifts = state.gifts.filter(g => g.id !== giftId);
  state.inventory.unshift(nft);

  vibe([40, 30, 70, 30, 120]);
  renderInventory();
  renderGifts();

  const bg = BG_MAP[nft.bg];
  openModal(`
    <div class="reveal-card">
      <div class="bg">${bgSVG(bg, uid())}</div>
      <div class="mdl">${charSVG(nft.char, nft.c1, nft.c2, nft.style, uid())}</div>
    </div>
    <div class="res-name">Gift Revealed!</div>
    <div class="res-sub">${nft.name} · ${bg.rarity}</div>
    <div class="res-bgline">
      <span class="bdot" style="background:${bg.sym};color:${bg.sym}"></span>
      ${bg.name}
    </div>
    <div class="res-price">${COIN_ICON} ${nft.price.toLocaleString()} coins</div>
    <div class="modal-actions">
      <button class="mbtn primary" id="rClose">Nice!</button>
    </div>
  `);
  $('#rClose').addEventListener('click', closeModal);
}

$('#buyGiftBtn').addEventListener('click', () => {
  if(state.busy) return;
  state.gifts.push({ id: 'g' + (++GIFT_ID) });
  renderGifts();
  vibe([14, 18, 22]);
  toast('Gift added');
});

$('#revealAllBtn').addEventListener('click', async () => {
  if(state.busy || !state.gifts.length) return;
  state.busy = true;
  vibe([20, 15, 40, 15, 80]);
  const allGifts = state.gifts.slice();
  const boxEls = $$('#giftsRow .gift-box');
  for(let i=0;i<allGifts.length;i++){
    if(boxEls[i]) boxEls[i].classList.add('shake');
    await wait(140);
  }
  for(let i=0;i<allGifts.length;i++){
    const nft = makeRandomNFT();
    state.inventory.unshift(nft);
  }
  state.gifts = [];
  vibe([50, 40, 90, 40, 140]);
  renderInventory();
  renderGifts();
  toast(allGifts.length + ' gifts revealed');
  state.busy = false;
});
