<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Upgrade</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{display:flex;align-items:center;justify-content:center;padding:10px}
  #app{width:100%;max-width:420px;height:100%;max-height:900px;
    background:#020203;border-radius:36px;padding:22px 18px 18px;
    display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.03),0 0 0 1px rgba(255,255,255,.03);}
  #app::before{content:'';position:absolute;top:-12%;left:50%;width:130%;height:60%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,
      hsl(var(--h,160) 65% 50% / .14) 0%, transparent 62%);
    pointer-events:none;z-index:0;filter:blur(24px);transition:background .8s ease;}
  #app > *{position:relative;z-index:1}
  .head{display:flex;align-items:center;justify-content:space-between}
  .head .t{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .head .s{font-size:9px;font-weight:800;color:rgba(255,255,255,.26);
    letter-spacing:2.4px;text-transform:uppercase;margin-top:4px}
  .bal{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;
    border-radius:99px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.055);font-size:13px;font-weight:800;
    font-variant-numeric:tabular-nums;}
  .bal img{width:14px;height:14px;opacity:.9}
  .wheel-wrap{position:relative;width:100%;aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;margin:0 auto;}
  #wheel{display:block;width:100%;height:100%}

  .slider-block{background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);border-radius:24px;
    padding:14px 20px 20px;flex-shrink:0;}
  .slider-head{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:18px;}
  .slider-head .lbl{font-size:9.5px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;color:rgba(255,255,255,.34);}
  .slider-head .val{font-size:22px;font-weight:800;letter-spacing:-.8px;
    font-variant-numeric:tabular-nums;color:hsl(var(--h,160) 70% 68%);
    transition:color .5s ease;}
  .slider-track{position:relative;height:38px;display:flex;align-items:center;
    cursor:pointer;touch-action:none;}
  .slider-rail{position:absolute;left:0;right:0;top:50%;height:22px;
    transform:translateY(-50%);background:rgba(255,255,255,.035);
    border-radius:99px;box-shadow:inset 0 1px 3px rgba(0,0,0,.7);}
  .slider-fill{position:absolute;left:0;top:0;bottom:0;width:50%;
    background:linear-gradient(180deg,
      hsl(var(--h,160) 70% 62%), hsl(var(--h,160) 68% 48%));
    border-radius:99px;
    box-shadow:0 0 22px hsl(var(--h,160) 70% 55% / .6),
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -2px 4px rgba(0,0,0,.25);
    transition:background .5s ease, box-shadow .5s ease;}
  .slider-thumb{position:absolute;top:50%;left:50%;
    width:44px;height:26px;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 40% 30%, #ffffff, #dfe3ec 70%, #a8b0c4);
    border-radius:99px;box-shadow:0 8px 20px rgba(0,0,0,.85),
      0 0 0 5px hsl(var(--h,160) 70% 55% / .18),
      inset 0 -2px 4px rgba(0,0,0,.18);
    pointer-events:none;transition:box-shadow .5s ease;}

  .bet-block{display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
    border-radius:24px;padding:12px 12px 12px 20px;flex-shrink:0;}
  .bet-block .lbl{font-size:9.5px;font-weight:800;letter-spacing:2px;
    text-transform:uppercase;color:rgba(255,255,255,.34);flex-shrink:0;}
  .bet-block .input-wrap{flex:1;display:flex;align-items:center;
    justify-content:flex-end;gap:8px;min-width:0;}
  .bet-block img{width:16px;height:16px;flex-shrink:0;opacity:.9}
  .bet-block input{width:100%;border:none;background:none;outline:none;
    color:#fff;font-size:20px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.5px;
    text-align:right;font-family:inherit;}
  .quick{display:flex;gap:5px;padding-left:12px;
    border-left:1px solid rgba(255,255,255,.05);}
  .quick button{min-width:40px;padding:10px 0;border-radius:12px;
    background:#050508;border:1px solid rgba(255,255,255,.07);
    color:rgba(255,255,255,.75);font-family:inherit;font-size:12px;
    font-weight:800;cursor:pointer;
    transition:transform .14s cubic-bezier(.34,1.56,.64,1),
      background .2s,color .2s,border-color .2s,box-shadow .2s;}
  .quick button:active{transform:scale(.9);background:#0a0a10;
    border-color:hsl(var(--h,160) 70% 55% / .55);color:#fff;
    box-shadow:0 0 18px hsl(var(--h,160) 70% 55% / .35);}

  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
  .meta-item{padding:11px 16px;background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);border-radius:20px;
    display:flex;justify-content:space-between;align-items:baseline;}
  .meta-item .lbl{font-size:9.5px;font-weight:800;letter-spacing:1.8px;
    text-transform:uppercase;color:rgba(255,255,255,.34);}
  .meta-item .val{font-size:15px;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
  .meta-item.chance .val{color:hsl(var(--h,160) 70% 68%);transition:color .5s ease;}

  .spin-btn{margin-top:auto;padding:20px 0;border-radius:26px;
    background:linear-gradient(135deg,
      hsl(var(--h,160) 55% 24%) 0%, hsl(var(--h,160) 60% 14%) 100%);
    border:1.5px solid hsl(var(--h,160) 65% 45% / .8);
    color:hsl(var(--h,160) 85% 78%);font-family:inherit;font-size:15px;
    font-weight:900;letter-spacing:3.2px;text-transform:uppercase;
    cursor:pointer;box-shadow:0 0 34px hsl(var(--h,160) 70% 55% / .32),
      0 12px 30px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 0 26px hsl(var(--h,160) 70% 55% / .16);
    text-shadow:0 0 14px hsl(var(--h,160) 80% 65% / .55);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),
      opacity .2s, box-shadow .7s ease, border-color .7s ease,
      color .7s ease, background .7s ease;flex-shrink:0;}
  .spin-btn:active{transform:scale(.975)}
  .spin-btn:disabled{opacity:.4;pointer-events:none}

  .toast{position:absolute;left:50%;top:18px;
    transform:translateX(-50%) translateY(-160%);
    padding:12px 22px;border-radius:99px;
    background:rgba(6,6,10,.97);border:1px solid rgba(255,255,255,.08);
    font-size:13.5px;font-weight:800;color:#fff;opacity:0;z-index:30;
    pointer-events:none;white-space:nowrap;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .3s;
    box-shadow:0 14px 40px rgba(0,0,0,.85);}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div>
      <div class="t">Upgrade</div>
      <div class="s">beta</div>
    </div>
    <div class="bal">
      <img src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="">
      <span id="bal">1,000</span>
    </div>
  </div>

  <div class="wheel-wrap">
    <canvas id="wheel"></canvas>
  </div>

  <div class="slider-block">
    <div class="slider-head">
      <span class="lbl">Win amount</span>
      <span class="val" id="winVal">1,000</span>
    </div>
    <div class="slider-track" id="sliderTrack">
      <div class="slider-rail"><div class="slider-fill" id="sliderFill"></div></div>
      <div class="slider-thumb" id="sliderThumb"></div>
    </div>
  </div>

  <div class="bet-block">
    <span class="lbl">Bet</span>
    <div class="input-wrap">
      <img src="https://i.postimg.cc/vHKQ9y9q/diamond-elegant.gif" alt="">
      <input id="betInput" inputmode="numeric" value="100">
    </div>
    <div class="quick">
      <button data-q="0.5">½</button>
      <button data-q="2">2×</button>
    </div>
  </div>

  <div class="meta">
    <div class="meta-item chance">
      <span class="lbl">Chance</span>
      <span class="val" id="chanceVal">10.00%</span>
    </div>
    <div class="meta-item mult">
      <span class="lbl">Multiplier</span>
      <span class="val" id="multVal">10.00×</span>
    </div>
  </div>

  <button id="spinBtn" class="spin-btn">Spin</button>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  'use strict';

  // ============ CONFIG ============
  const MIN_BET = 10;
  const MAX_BET = 100000;
  const MIN_WIN = 20;
  const MAX_WIN = 1000000;
  const TWO_PI  = Math.PI * 2;

  const PREVIEW_SPEED = 0.00040;   // calmer idle spin
  const ARM_DUR       = 720;
  const SPIN_DUR_MIN  = 8200;
  const SPIN_DUR_MAX  = 9400;

  const HUES = [148, 172, 200, 222, 248, 268, 300, 328, 8, 32];
  const OVERLAY_URL = 'https://i.postimg.cc/NF7n3mYD/photo-5202192649983563686-y-removebg-preview.png';
  const CENTER_URL  = 'https://i.postimg.cc/Kv8QGd5B/Snimok-ekrana-2026-07-07-143049-Photoroom.png';

  // ============ STATE ============
  const S = {
    balance: 1000,
    bet: 100,
    target: 1000,
    chance: 0.10,
    animChance: 0.10,

    sliceAngle: 0,
    arrowAngle: 0,
    phase: 'idle',

    armArrowFrom: 0, armArrowTo: 0,
    armSliceFrom: 0, armSliceTo: 0,
    armStart: 0,

    spinFrom: 0, spinTo: 0, spinStart: 0, spinDur: 0,

    hue: 148, hueFrom: 148, hueTo: 148, hueStart: 0, hueDur: 0,

    overlayImg: null,
    centerImg: null,
    centerReady: false,

    outcome: null,
  };

  // ============ ELEMENTS ============
  const canvas      = document.getElementById('wheel');
  const ctx         = canvas.getContext('2d');
  const appEl       = document.getElementById('app');
  const balEl       = document.getElementById('bal');
  const betInput    = document.getElementById('betInput');
  const winVal      = document.getElementById('winVal');
  const sliderTrack = document.getElementById('sliderTrack');
  const sliderFill  = document.getElementById('sliderFill');
  const sliderThumb = document.getElementById('sliderThumb');
  const chanceVal   = document.getElementById('chanceVal');
  const multVal     = document.getElementById('multVal');
  const spinBtn     = document.getElementById('spinBtn');
  const toastEl     = document.getElementById('toast');

  // ============ CANVAS SIZE ============
  let size = 0, dpr = 1;
  function resize(){
    const r = canvas.parentElement.getBoundingClientRect();
    size = Math.max(220, Math.min(r.width, r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width  = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ============ HELPERS ============
  const fmt = n => Math.floor(n).toLocaleString('en-US');
  const hsl = (h,s,l,a) =>
    a === undefined ? `hsl(${h} ${s}% ${l}%)`
                    : `hsl(${h} ${s}% ${l}% / ${a})`;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  function lerpHue(from, to, t){
    let d = to - from;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return (from + d * t + 360) % 360;
  }

  // ============ WHEEL EASE (C¹ continuous, zero velocity at t=1) ============
  // Piecewise: linear-ramp accel → constant cruise → (1-u)² decay
  // Normalized so p(1) = 1 exactly with p'(1) = 0 (silky stop).
  const _T_ACC  = 0.16;                       // accel duration
  const _T_CRUI = 0.22;                       // cruise duration
  const _T_DEC  = 1 - _T_ACC - _T_CRUI;       // 0.62
  const _A_ACC  = _T_ACC / 2;                 // 0.08
  const _A_CRUI = _T_CRUI;                    // 0.22
  const _A_DEC  = _T_DEC / 3;                 // 0.2067
  const _A_TOT  = _A_ACC + _A_CRUI + _A_DEC;  // 0.5067
  const _SCALE  = 1 / _A_TOT;

  function wheelEase(t){
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    if (t < _T_ACC){
      const u = t / _T_ACC;
      return _SCALE * _A_ACC * u * u;
    }
    if (t < _T_ACC + _T_CRUI){
      const u = t - _T_ACC;
      return _SCALE * (_A_ACC + u);
    }
    const u = (t - _T_ACC - _T_CRUI) / _T_DEC;
    const decayed = _A_DEC * (1 - Math.pow(1 - u, 3));
    return _SCALE * (_A_ACC + _A_CRUI + decayed);
  }

  // ============ ASSET LOADERS ============
  (function loadOverlay(){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { S.overlayImg = img; };
    img.onerror = () => {};
    img.src = OVERLAY_URL;
  })();
  (function loadCenter(){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { S.centerImg = img; S.centerReady = true; };
    img.onerror = () => {};
    img.src = CENTER_URL;
  })();

  // ============ DRAW ============
  function draw(){
    const R = size / 2;
    const cx = R, cy = R;
    const hue = S.hue;
    const chance = S.animChance;

    const wheelRadius = Math.max(70, R - 20);

    // ---- arrow geometry (higher / further out) ----
    const arrowLength = wheelRadius * 0.18;
    const arrowWidth  = wheelRadius * 0.26;
    const tipRadius   = wheelRadius * 0.80;   // ← further out
    const pivotRadius = tipRadius + arrowLength;

    ctx.clearRect(0, 0, size, size);

    // ---- base (loss) disc ----
    ctx.beginPath();
    ctx.arc(cx, cy, wheelRadius, 0, TWO_PI);
    ctx.fillStyle = 'rgba(255,255,255,.022)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, wheelRadius - 0.5, 0, TWO_PI);
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ---- win slice ----
    const startA = -Math.PI / 2 + S.sliceAngle;
    const endA   = startA + chance * TWO_PI;

    if (chance > 0.0015){
      // outer glow
      ctx.save();
      ctx.shadowColor = hsl(hue, 70, 55, .5);
      ctx.shadowBlur  = 34;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, wheelRadius, startA, endA);
      ctx.closePath();
      ctx.fillStyle = hsl(hue, 70, 52, .25);
      ctx.fill();
      ctx.restore();

      // main slice (semi-transparent)
      const g = ctx.createRadialGradient(cx, cy, wheelRadius * 0.08, cx, cy, wheelRadius);
      g.addColorStop(0,   hsl(hue, 72, 62, .60));
      g.addColorStop(.55, hsl(hue, 70, 52, .50));
      g.addColorStop(1,   hsl(hue, 66, 40, .44));

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, wheelRadius, startA, endA);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();

      // clip → overlay + rims
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, wheelRadius, startA, endA);
      ctx.closePath();
      ctx.clip();

      // ---- ONE BIG overlay image, aspect-preserved, centered, rotating with slice ----
      if (S.overlayImg){
        const iw = S.overlayImg.width, ih = S.overlayImg.height;
        // cover a square of side (wheelRadius * 2.9) around the wheel center
        const target = wheelRadius * 2.9;
        const sc = Math.max(target / iw, target / ih);
        const dw = iw * sc;
        const dh = ih * sc;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(S.sliceAngle);
        ctx.globalAlpha = 0.34;
        ctx.drawImage(S.overlayImg, -dw / 2, -dh / 2, dw, dh);
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // inner rim highlight
      ctx.beginPath();
      ctx.arc(cx, cy, wheelRadius - 2.5, startA, endA);
      ctx.strokeStyle = 'rgba(255,255,255,.22)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // leading / trailing edges
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(startA) * wheelRadius, cy + Math.sin(startA) * wheelRadius);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(endA) * wheelRadius, cy + Math.sin(endA) * wheelRadius);
      ctx.strokeStyle = 'rgba(255,255,255,.28)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.restore();
    }

    // ---- center circle (aspect-preserved cover, shifted slightly down) ----
    const cR    = wheelRadius * 0.21;
    const cOffY = cR * 0.16;
    const ccx = cx;
    const ccy = cy + cOffY;

    ctx.beginPath();
    ctx.arc(ccx, ccy, cR + 3, 0, TWO_PI);
    ctx.fillStyle = '#020203';
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(ccx, ccy, cR, 0, TWO_PI);
    ctx.clip();
    if (S.centerReady && S.centerImg){
      const iw = S.centerImg.width, ih = S.centerImg.height;
      const sc = Math.max((cR * 2) / iw, (cR * 2) / ih); // cover
      const w = iw * sc, h = ih * sc;
      ctx.drawImage(S.centerImg, ccx - w / 2, ccy - h / 2, w, h);
    } else {
      const ds = cR * 0.55;
      ctx.save();
      ctx.translate(ccx, ccy);
      ctx.beginPath();
      ctx.moveTo(0, -ds);
      ctx.lineTo(ds * 0.72, 0);
      ctx.lineTo(0, ds);
      ctx.lineTo(-ds * 0.72, 0);
      ctx.closePath();
      ctx.fillStyle = hsl(hue, 72, 60);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(ccx, ccy, cR, 0, TWO_PI);
    ctx.strokeStyle = hsl(hue, 70, 55, .65);
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(ccx, ccy, cR + 4, 0, TWO_PI);
    ctx.strokeStyle = hsl(hue, 70, 55, .18);
    ctx.lineWidth = 1;
    ctx.stroke();

    // ---- arrow ----
    const a = S.arrowAngle;
    const px = cx + Math.sin(a) * pivotRadius;
    const py = cy - Math.cos(a) * pivotRadius;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);

    ctx.shadowColor = hsl(hue, 70, 55, .85);
    ctx.shadowBlur  = 26;

    const ag = ctx.createLinearGradient(0, 0, 0, arrowLength);
    ag.addColorStop(0, '#ffffff');
    ag.addColorStop(1, '#c8d3ec');

    ctx.beginPath();
    ctx.moveTo(0, arrowLength);
    ctx.lineTo(-arrowWidth / 2, 0);
    ctx.lineTo(-arrowWidth / 2 + 4, -4);
    ctx.lineTo(0, -2);
    ctx.lineTo(arrowWidth / 2 - 4, -4);
    ctx.lineTo(arrowWidth / 2, 0);
    ctx.closePath();
    ctx.fillStyle = ag;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  // ============ LOOP ============
  let lastTs = 0;
  function tick(ts){
    if (!lastTs) lastTs = ts;
    const dt = Math.min(50, ts - lastTs);
    lastTs = ts;

    const dc = S.chance - S.animChance;
    if (Math.abs(dc) > 0.0002) S.animChance += dc * Math.min(1, dt * 0.010);
    else S.animChance = S.chance;

    if (S.hueDur > 0){
      const t = Math.min(1, (ts - S.hueStart) / S.hueDur);
      S.hue = lerpHue(S.hueFrom, S.hueTo, t);
      if (t >= 1) S.hueDur = 0;
      appEl.style.setProperty('--h', S.hue.toFixed(1));
    }

    if (S.phase === 'idle'){
      S.sliceAngle += PREVIEW_SPEED * dt;
    } else if (S.phase === 'arming'){
      const t = Math.min(1, (ts - S.armStart) / ARM_DUR);
      const e = easeOutCubic(t);
      S.sliceAngle = S.armSliceFrom + (S.armSliceTo - S.armSliceFrom) * e;
      S.arrowAngle = S.armArrowFrom + (S.armArrowTo - S.armArrowFrom) * e;
      if (t >= 1){
        S.sliceAngle = S.armSliceTo;
        S.arrowAngle = S.armArrowTo;
        S.phase = 'spinning';
        S.spinStart = ts;
        if (navigator.vibrate) navigator.vibrate(12);
      }
    } else if (S.phase === 'spinning'){
      const t = Math.min(1, (ts - S.spinStart) / S.spinDur);
      const e = wheelEase(t);
      S.arrowAngle = S.spinFrom + (S.spinTo - S.spinFrom) * e;
      if (t >= 1){
        S.arrowAngle = S.spinTo;
        S.phase = 'result';
        setTimeout(onSpinEnd, 320);
      }
    }

    draw();
    requestAnimationFrame(tick);
  }

  // ============ UI ============
  function updateDerived(){
    S.bet    = Math.max(MIN_BET, Math.min(MAX_BET, Math.floor(S.bet) || MIN_BET));
    S.target = Math.max(S.bet + 1, Math.min(MAX_WIN, Math.floor(S.target) || MIN_WIN));
    S.chance = Math.max(0.01, Math.min(0.95, S.bet / S.target));

    balEl.textContent     = fmt(S.balance);
    betInput.value        = S.bet;
    winVal.textContent    = fmt(S.target);
    chanceVal.textContent = (S.chance * 100).toFixed(2) + '%';
    multVal.textContent   = (S.target / S.bet).toFixed(2) + '×';

    const minL = Math.log(MIN_WIN), maxL = Math.log(MAX_WIN);
    const pct  = Math.max(0, Math.min(1, (Math.log(S.target) - minL) / (maxL - minL)));
    sliderFill.style.width = (pct * 100) + '%';
    sliderThumb.style.left = (pct * 100) + '%';

    appEl.style.setProperty('--h', S.hue.toFixed(1));
  }

  // SLIDER
  let sliding = false;
  function applySlider(clientX){
    const rect = sliderTrack.getBoundingClientRect();
    let t = (clientX - rect.left) / rect.width;
    t = Math.max(0, Math.min(1, t));
    const minL = Math.log(MIN_WIN), maxL = Math.log(MAX_WIN);
    const v = Math.exp(minL + (maxL - minL) * t);
    let rounded;
    if (v < 100) rounded = Math.round(v / 5) * 5;
    else if (v < 1000) rounded = Math.round(v / 10) * 10;
    else if (v < 10000) rounded = Math.round(v / 50) * 50;
    else if (v < 100000) rounded = Math.round(v / 500) * 500;
    else rounded = Math.round(v / 5000) * 5000;
    S.target = Math.max(S.bet + 1, rounded);
    updateDerived();
  }
  sliderTrack.addEventListener('pointerdown', e => {
    sliding = true;
    try { sliderTrack.setPointerCapture(e.pointerId); } catch(_){}
    applySlider(e.clientX);
  });
  sliderTrack.addEventListener('pointermove', e => { if (sliding) applySlider(e.clientX); });
  const endSlide = e => {
    sliding = false;
    try { sliderTrack.releasePointerCapture(e.pointerId); } catch(_){}
  };
  sliderTrack.addEventListener('pointerup', endSlide);
  sliderTrack.addEventListener('pointercancel', endSlide);

  // BET
  betInput.addEventListener('input', () => {
    const v = parseInt(betInput.value.replace(/[^\d]/g, ''), 10);
    if (Number.isFinite(v) && v > 0){ S.bet = v; updateDerived(); }
  });
  betInput.addEventListener('blur', () => {
    S.bet = Math.max(MIN_BET, Math.min(MAX_BET, parseInt(betInput.value, 10) || MIN_BET));
    if (S.target <= S.bet) S.target = S.bet * 2;
    updateDerived();
  });
  document.querySelectorAll('.quick button').forEach(b => {
    b.addEventListener('click', () => {
      const q = parseFloat(b.dataset.q);
      S.bet = Math.max(MIN_BET, Math.min(MAX_BET, Math.floor(S.bet * q)));
      if (S.target <= S.bet) S.target = S.bet * 2;
      updateDerived();
    });
  });

  // TOAST
  let toastTimer = null;
  function toast(msg, kind){
    toastEl.textContent = msg;
    toastEl.style.color = kind === 'win'  ? '#a8ffcf'
                        : kind === 'lose' ? '#ffb3be'
                        : '#fff';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  // SPIN
  let lastHue = -1;
  function pickHue(){
    let h;
    do { h = HUES[(Math.random() * HUES.length) | 0]; }
    while (h === lastHue && HUES.length > 1);
    lastHue = h;
    return h;
  }
  function transitionHue(){
    S.hueFrom = S.hue;
    S.hueTo   = pickHue();
    S.hueStart = performance.now();
    S.hueDur   = 900;
  }

  function spin(){
    if (S.phase !== 'idle') return;
    const bet = S.bet, target = S.target;
    if (bet < MIN_BET){ toast('Bet too small', 'lose'); return; }
    if (bet > S.balance){ toast('Insufficient balance', 'lose'); return; }

    S.balance -= bet;
    updateDerived();
    transitionHue();

    const win    = Math.random() < S.chance;
    const payout = win ? target : 0;
    S.outcome = { win, payout, bet, target };

    // ARM
    let sliceDelta = -(((S.sliceAngle % TWO_PI) + TWO_PI) % TWO_PI);
    if (sliceDelta < -Math.PI) sliceDelta += TWO_PI;
    S.armSliceFrom = S.sliceAngle;
    S.armSliceTo   = S.sliceAngle + sliceDelta;

    let arrowDelta = -(((S.arrowAngle % TWO_PI) + TWO_PI) % TWO_PI);
    if (arrowDelta < -Math.PI) arrowDelta += TWO_PI;
    S.armArrowFrom = S.arrowAngle;
    S.armArrowTo   = S.arrowAngle + arrowDelta;

    S.armStart = performance.now();

    // SPIN
    const arcSpan = S.chance * TWO_PI;
    let landAngle;
    if (win){
      const margin = Math.min(arcSpan * 0.14, 0.10);
      const lo = margin;
      const hi = Math.max(lo + 0.001, arcSpan - margin);
      landAngle = lo + Math.random() * (hi - lo);
    } else {
      const margin = 0.08;
      const lo = arcSpan + margin;
      const hi = TWO_PI - margin;
      landAngle = lo + Math.random() * Math.max(0.001, hi - lo);
    }

    const turns = 4 + ((Math.random() * 3) | 0);
    S.spinFrom = S.armArrowTo;
    S.spinTo   = S.armArrowTo + turns * TWO_PI + landAngle;
    S.spinDur  = SPIN_DUR_MIN + Math.random() * (SPIN_DUR_MAX - SPIN_DUR_MIN);

    S.phase = 'arming';
    spinBtn.disabled = true;
    if (navigator.vibrate) navigator.vibrate(8);
  }

  function onSpinEnd(){
    const o = S.outcome;
    if (!o){ S.phase = 'idle'; spinBtn.disabled = false; return; }
    if (o.win){
      S.balance += o.payout;
      toast('You won +' + fmt(o.payout), 'win');
      if (navigator.vibrate) navigator.vibrate([25, 40, 60]);
    } else {
      toast('You lost ' + fmt(o.bet), 'lose');
      if (navigator.vibrate) navigator.vibrate(120);
    }
    updateDerived();
    spinBtn.disabled = false;
    S.phase = 'idle';
  }

  spinBtn.addEventListener('click', spin);

  // BOOT
  resize();
  updateDerived();
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
